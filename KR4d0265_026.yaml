front:
  text: 石湖居士詩集卷二十六
  hash: sha256:29a8b7e953f821cdb9b3a5d3e3d97efb2b63aa50e2597250802601f064dc77d3
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0265_SBCK_026-1a}
body:
  text: 吳歈一首送丘宗卿自平江移會稽吳兒與君緣不薄再騎竹馬迎南郭吳兒與君緣復淺坐席才溫旗腳轉東人賦重越吟悲趣了兹段隨朝雞胸竒百鍊當活國君豈獨私吳與越鶴鳴樟橋猿夜啼胸奴未滅家何為功成他年歸結屋好在山花休斬竹宗卿十三年前嘗守吳今復來幾年而去越民困於和買蓋有意為蠲減之樟橋宗卿卜築處有山牡丹二本歲各發百花手植筀竹二十年今一尺圍作舍時悉當伐去皆實録席上語也贈壽老農圃規模昔共論雲奎卜築又逢君睂菴壽老長隨喜好箇拋梁伏願文十八年前始作農圃堂壽老自睂菴逺來相與度地今雲奎始基又值其入城留觀上梁似非偶然再贈壽老淡齊寂莫淡菴空玉柱金庭一夢中我病君衰猶見在莫嫌俱作白頭翁頃與淡齊兄遊洞庭林屋并淡菴現老睂菴壽老偕今十年矣壽老見過話舊事二淡巳為古人雪中聞牆外鬻魚菜者求售之聲甚苦有感三絶飯籮驅出敢偷閒雪脛冰鬚慣忍寒豈是不能扃户坐忍寒猶可忍饑難憂渴焦山業海深貪渠刀蜜坐成禽一身冒雪渾家暖汝不能詩替汝吟啼號升斗抵千金凍雀飢鴉共一音勞汝以生令至此悠悠大塊亦何心詠河市歌者豈是從容唱渭城箇中當有不平鳴可憐日晏忍飢面強作春深求友聲偶針情知萬法本來空猶復將心奉八風逆順境來欣戚變咄哉誰是主人翁丙午新正書懷十首不用桃符貼畫雞身心安處是夭倪行年六十舊曆日汗腳尺三新杖藜祝我賸周花甲子謝人深勸玉東西春風若借筋骸便先渡南村學灌畦新圃在河南名范村瘦骨難勝遇節衣日髙催起趂晨炊病憐楖栗隨身慣老覺屠蘇到手遲一飽但蘄庚癸諾百年甘守甲辰雌莫言此外都無事柳眼梅梢正索詩煮茗燒香了歲時靜中光景笑中嬉身閒一日似兩日春淺南枝如北枝朝鏡略無功業到午窗惟有睡魔知年來并束牀頭易一任平章濟叔癡窮巷閒門本閴然強將爆竹聒階前人情舊雨非今雨老境增年是減年口不兩匙休足榖身能幾屐莫言錢掃除一室空諸有龎老家人總解禪吳諺云一口不能著兩匙厲風翻海雪漫天百計逃寒息萬緣穩作被爐如卧炕厚裁綿旋入聲勝披氊尊前現在瞢騰醉飯後無何爛熳眠斟酌出門髙興盡從教閒却剡溪船被爐綿旋皆新得法老人御冬之具二物尤為要切俗情如絮巳泥沾因病偷閒意屬厭鵬鷃相安無可笑熊魚自古不容兼灰藏榾柮多時暖雪壓蔓菁滿意甜溫飽閉門吾事辦異時書判指如籖炭熟香濃石鼎煨人言小閣是春臺蕉心翠展一冬在梅藟粉融連夜開肅肅九冰妨發育溫溫三火護恢台養生此外無遺說梨棗元須趂暖栽水芭蕉長三寸在暖閣中經冬不瘁瓶梅亦烘然先拆經過掃軌但幽棲巢穩林深寄一枝栗里歸來窗下卧香山老去病中詩東風馬耳塵勞後半夜雞聲睡熟時俯仰平生盡塵迹恰如腷膊幾枰棊窗明窗暗篆煙馡珍重晨光與夕暉東院齊鐘披被坐南城嚴鼓岸巾歸幾人霜滑騎朝馬何處燈殘織曉機懶裏若承三昧力始知忙裏事俱非此篇敘蚤眠晏起之事殊方節物記吾曽海北天西一瘦藤烏欖雞檳嘗老酒酥花芋葉試新燈瘴雲度嶺濃如墨邊雪窺窗冷欲冰閒展兩鄉圖畫看卧遊何必減深登此篇記桂林成都元日舊事檳欖皆椒盤中物老酒十數年不壞者滴酥為花熬芋為柳葉三夕張燈如上元上下句分記廣蜀雲露并序豫素不能飲病又止酒比得佳釀法客以雲露名之取吉雲五露飲之則老者少病者除之意也乃復濡脣且為賦詩飲少嘗遭大户嗤病中全是獨醒時三年魯望自憐賦萬祀淵明真止詩破戒忽傳雲露法賞心仍把雪梅枝一杯未問長生事先罥蛛塵藥裹絲陸魯望好飲病甫里三年作自憐賦賓至潔壺置觴而巳丙午新年六十一歲俗謂之元命作詩自貺歲復當生次星臨本命辰四人同丙午初度再庚寅長狄名猶記沙隨會若新童心仍竹馬暮境忽蒲輪鏡裏全成老尊前略似春三年歸汶上千日卧漳濱剛長交新泰隂消脫舊屯網蛛縈藥裹竇犬吠醫人窗下烏皮几田間紫領巾鯢淵方止水鯤海任揚塵波匿觀河見維摩示病身顰端還一笑默識幻中真文潞公詩云四人三百七十歲況是同生丙午年僕與今丞相王公樞使周公參政錢公皆丙午又頃皆同朝故用此事稍的也丙午人日立春屈指癸卯孟夏晦得疾恰千日矣戲書百年能有幾春光只合都將付醉鄉衰病豁除千日外尚餘三萬五千場春困二絶吳俗立春日兒童以春困相呼以掉頭不應者為黠綵花生菜又新年節物人情巳可憐不待春來呼我困四時何日不堪眠諾惺菴裏呼春困特地回頭著耳聽若解昏昏安穩睡主翁方始是惺惺立春大雪招親友共春盤坐上作積雪錮萬瓦雲容如死灰豈惟梅柳寒小槽冰去聲春醅東風乃多事仍將六花來兒女曉翻餅呵手把一杯菘甲剪翠羽韭黃㔃金叉齒牙幸牢潔對案心眼開華年惜節物況此霜鬢摧如何千日病三見寅杓回旁人不堪憂我心猶始孩衰翁豈知道癡絶忘形骸化兒任惡劇歡伯有竒懷餘寒會退聽一笑當安排嚴子文以春雪數作用為瑞不冝多為韻賦詩見寄次韻同雲癡不掃梅柳春到遲笙歌暖寒會當任主人為圍尺庸何傷袤丈乃非瑞郢中姑度曲山左巳驅癘世無辟寒香誰能不龜手鄰舍索米歸衾稠無恙不貧人寒切骨無地兼無錐安知雙綵勝但寫入春宜販夫博口食奈此不售何無術慰啼號汝今一身多詠吳中二燈琉璃毬龍綜繅冰繭魚文鏤玉英雨絲風外皺雲網日邊明叠暈重重見分光面面呈不深閒裏趣爭識箇中情萬眼羅弱骨千絲結輕毬萬錦裝綵雲籠月魄寶氣繞星芒檀點紅嬌小梅粧粉細香等閒三夕看消費一年忙元夕後連隂問訊東風幾日來冷煙寒霧鎖池臺掃空積雪翻成雨收盡殘燈未見梅夜飲厭厭非老伴春隂漠漠是愁媒誰能腰鼓催花信快打凉州百面雷次韻嚴子文見寄雨雲濃壓屋山頭詩句端來寫客憂雷電巳將金薤取瓊瑶難報木瓜投無心我正銘三住有意君堪話四休何日尋春同步屧先教啼鳥說來由再次韻述懷約子文見過灰木心形雪滿頭鶴鳬長短不悲憂瓮畦純白無機械蒲局裊盧任博投若愛陶陶并兀兀先須莫莫與休休箇中情話誰能共雞黍明當挽仲由寄題郫縣蘧仙觀四楠蘧仙手植嘗有丹光現其杪沉犀浦上舊仙蹤老木長春翠掃空敢請丹光來萬里為扶雲嶠駕飛鴻春來風雨無一日好晴因賦瓶花二絶滿插瓶花罷出遊莫將攀折為花愁不知燭照香薰看何似風吹雨打休酒冷花寒無好懷柴荆終日為誰開三分春色三分雨匹似東風本不來寄題永新張教授無盡藏古來誰道四并難對境心空著處安要識見聞無盡藏先除夢幼有為觀削平丘垤孤峰峻撤去籓籬萬象寬快誦老坡秋望賦大千風月一毫端寄題莫氏椿桂堂莫氏五子皆登科居崇德縣君不見衣冠盛事今猶昔前說燕山後崇德聯翩五組帶天香世上籯金賤如礫他年詩禮到雲來日日髙堂稱壽杯桂長孫枝椿不老却比竇家應更好春晚即事留游子明王仲顯繡地紅千點平橋緑一篙楝花來石首榖雨熟櫻桃笑我生塵甑慚君有意袍故人能少駐門徑久蓬蒿留游子明得得跫音喜匆匆笑口開牢愁攻易破歸夢挽難回我巳踈茶碗君今減酒杯不知乘興棹更得幾回來初夏三絶呈游子明王仲顯東君不解惜芳菲料峭寒中一夢非剪盡牡丹梅子綻何須風雨送春歸一簾芳樹緑蔥蔥胡蝶飛來覓綺叢雪白荼䕷紅寶相尚攜春色見薰風送春迎夏未聞雷日日斜風細雨來不是故人能裹飯柴門雖設為誰開送王仲顯赴瓊管三徑蓬蒿春雨肥微君誰與開柴扉電光射牛書過目虹氣干斗酒淋衣十年五別歲月老一方萬里音塵稀誰云滄海斷地脉莫信天南無鴈飛梅雨五絶梅雨暫收斜照明去年無此一日晴忽思城東黃篾舫卧聽打鼓踏車聲乙酉甲申雷雨驚乘除却賀芒種晴插秧先插蚤秈稻少忍數旬蒸米成吳農忌五月甲申乙酉雨雨則大水諺云甲申猶自可乙酉怕殺我風聲不多雨聲多洶洶曉衾聞浪波恰似秋眠隱靜寺玉霄泉從牀下過繁昌隱靜寺方丈山後玉霄泉自板閣下過最為佳致千山雲深甲子雨十日地濕東南風靜裏壺天人不到火輪飛出默存中道家東向坐想日出以煉氣雨霽雲開池面光三年魚苗如許長小荷拳拳可包鮓晚日照盤風露香芒種後積雨驟冷三絶一菴濕蟄似龜藏深夏暄寒未可常昨日蒙絺今挾纊莫嗔門外有炎凉梅黃時節怯衣單五月江吳麥秀寒香篆吐雲生暖熱從教窗外雨漫漫梅霖傾瀉九河翻百瀆交流海面寬良苦吳農田下濕年年披絮插秧寒崑山農人梅雨時著毳絮以耘秧歲以為常東宫壽詩再造炎圖撫太寧龍樓育德會千齡三宫叠矩深邦本兩曜重光炳帝庭自古東明陪出日只今南極是前星鈞天歲歲家人禮長對瑶階第四蓂並世勳華照古今朱明綵服侍尊臨邦家大慶重親養社稷元良萬國心菊露壺觴秋色正桂風殿閣月香深欲知天序無疆處銅律聲中治世音寄題漢中新作南樓二首我作籌邊倚半霄西山雲雪照弓刀如今且說南樓勝應共漢壇相對髙甲子周天事好還關河響動劒光寒秦川草木多如薺時倚樓闌直北看次韻李子永見訪二首混俗休超俗居家似出家有為皆影事無念即生涯莫覓安心法翻成揑目花作糜須榖粟千劫漫炊砂有意能停棹多情易憶家淸詩穿月脅逺夢繞天涯雨蝶衣濡粉秋蚊喙吐花新凉宜小駐談笑有丹砂自詠瘦悴皮下多無肉秋來瘦不禁骨稜春焙銙筋蹙海山沉蟣蝨從何有蚊蠅枉見侵惟餘老笻杖相伴兩虛心石湖居士詩集卷二十六
