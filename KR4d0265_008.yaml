body:
  text: 伏聞知府柲書欲取小杜桐廬詩語以見花名堂成大記東坡送鄭戶曹詩云蕩蕩淸河壖黃樓我所開遲君為坐客新詩出瓊瑰樓成君巳去人事固多乖此段大類今日成大行且受代計梅開堂成歸舟巳下南浦欲為坐客不可得懷不能已請先為公賦之使君來暖東堂席又見堂前花信息小白猶封竹外枝微黃巳點睂間色山城十月如春臺聞有細書天上來說與橫斜應早計不須更待雪花催知府祕書遣帳下持新詩追路贈行輒次韻寄上冷雲去仍來凍雨落還歇平明一篙漲珍重送船發端成南溪泛寧復東堂謁何時公三日請澤看山笏恩勤一未報終古銘肌骨幡幡跡雖逺耿耿心不沒門闌如水波永印此孤月寄上鄙句之明日舟次梅口南枝巳有春意復次知府祕書贈行髙韻晏溫解船去暮夜㰕船歇橫斜隘梅村玉蓓粲將發城中三輔豪指日承明謁髙懷妙康濟未試君前笏周南又小春微溫入花骨我瞻浮丘亭山髙璿柄沒飛鳥正飄蕩空繞南枝月晞真閣留別方道士賔實東山西山雙袖舞中有淸宫蟠萬礎雲橫朱閣碧梧寒風掃石壇蒼檜古道人賔實其姓方來從何許今幾霜誅蒿仆蓬殿突兀玉華紫氣騰真香胸竒腹憤無人識我獨相從似疇昔時時苦語見針砭邂逅天涯得三益明朝歸客上歸艎重到晞真計渺茫只有雙魚相問訊歙江之水通吳江程助教逺餞求詩殘山剩水帶離亭送客煩君逺作程直欲明年擊吳榜白沙翠竹是柴荆次伯安推官贈別韻交情彌歲竟匆匆短棹歸尋一畝宫塞責文書容我懶及時杯酒賴君同披雲峰頂城頭月攬秀堂前扇裏風千里音書慰離索莫言天逺費鱗鴻次景琳録事贈別韻放船鳴櫓便秦吳送別空煩長者車宿霧鎖山常羃羃斷雲將雨忽踈踈髙城五嶺花深處短棹三江木落初賴得溪流通尺素蒲根仍有一雙魚次黃必先主簿同年贈別韻二首當年仗外揖髙標繡䪌蘆鞭寶馬驕瓊苑天香飄合坐碧城山色照同僚思歸意決吾張翰贈別情深子繞朝蟹籪魚梁從此去他年書札墮煙霄山郭官閒得爛遊彌年還往話綢繆西園剝栗催奴課東院尋梅勸客留皆簿廳故事筆下修鋒千首富談間和氣兩睂浮別來悵望何時見謾上重城謾上樓次胡經仲知丞贈別韻先生有道抗浮雲拄頰看山意最真霜鬢不堪痟首疾翠蛾常作捧心顰官如斯立藍田小家似淵明栗里貧俯仰別來蓂莢換袛今誰與話情親經仲與侍兒皆多病又不樂贊邑賦歸去來詞次諸葛伯山贍軍贈別韻歙維羣山囿漫仕富英傑淸標照人寒玉筍森積雪嗟余獨委瑣無用等木屑又如道傍李味苦不堪折歸舟坐成泛去馬亦已刷三年風波險盡付一笑閲惟君同懷抱各坐天機拙我家鴟夷子竹帛照吳越雲仍無肖似俯首愧前哲若家卧龍公事業管蕭埒期君踵祖武勿惜兒女別言狂舉白浮醉倒霜松折次韻樂先生除夜三絶團蒲曲几坐成癡北看南觀恍是非道眼巳空詩眼在梅花欲動雪花稀天邊客裏五迎冬爭信還鄉似寓公人事都非城郭是獨憐雞犬識新豐牀頭曆日鬢絲絲懶倦慵吟守歲詩冝入新年須吉利明朝把筆寫門􅎝次韻唐幼度客中幼度相別數年復會於錢塘湖上西湖冰泮緑生鱗料峭東風欲中人花片不禁寒食雨鬢絲猶那湧金春江山契闊詩情在京洛追隨客夢新喚取歌聲不愁思為君吹水引杯頻客中呈幼度手板頭銜意巳慵墨池書枕興無窮釀泥深巷五更雨吹酒小樓三面風草色有無春最好客心去住水長東今朝合有家書到昨夜燈花綴玉蟲奠唐少梁晉仲兄弟墓下當年連璧氣如霓人許躋攀九列齊黃壤一時埋玉樹靑雲何處用丹梯生平書札頻雙鯉歲晚交情但隻雞眼底傷心難制淚寧論宿草巳萋萋鎮東行送湯丞相帥紹興吳波鱗鱗越山紫鎮東旌斾東風裏前驅傳道相君來一夜鑑湖春漲起鑑湖如鑑涵空明相君出處如湖淸十年勳業泰山重五鼎富貴浮雲輕人言公如裴相國緑野堂髙貯風月我獨願公如子牟身在江湖心魏闕浯溪有石髙嵯峨公方東征如此何丁寧湖水莫斷渡早晚歸來絶江去水月菴謁現老不值有客叩巖扃無人管送迎片雲間出岫水月自空明次韻邊公辨錯落參旗罥竹梢柴荆臨水閉蓬蒿春風吹曉玉蟾墮穠露洗空銀漢髙雙鵲繞枝應也倦一蛩吟壁巳能豪新秋只合添詩興莫學潘郎歎二毛中秋無月復次韻屋山從捲杜陵茅門徑慵芟仲蔚蒿淡淡白虹風暈壯紛紛蒼狗雨雲髙凌空纍筯仙無術半夜撞鐘句謾豪枵腹題詩將底用真成兔角與龜毛公辨用前韻見贈復次韻先生筆力玉山鼇氣壓明堂一柱蒿雪碗滌毫詞絶妙朱絃縮瑟調彌髙心兵不起無三粲坐客常多似四豪喜有過從南北巷蘇蘭薪桂瀹溪毛公辨再贈復次韻書生活計極蕭騷爝火微明似束蒿犬子地寒徒壁立元龍身懶謾樓髙筆端未辦誇三絶酒裏猶能掃二豪又向詩壇蘄借一強磨鉛鈍齒吹毛送施元光赴江西幕府鎮南旌斾照江皋入幕如今客最髙月暗秋城稀擊柝雲飛朝棟賸揮毫長亭酒盡歌三叠半夜溪深雨一篙莫戀陽關更西路九關歸路踏金鼇次韻林子章阻淺留滯客行端似未歸雲指點璿杓幾易辰喜有風花黃作暈似聞溪漲緑生鱗我從走俗言無味君巳鳴文筆有神繡段炳然空辱贈急翻緹襲掃蛛塵次韻馬少伊木犀月窟飛來露巳凉斷無塵格惹蜂黃纎纎緑裹排金粟何處能容九里香水尾山腰樹影蒼一天風露不供香誰家鏡裏能消得付與詩人古錦囊密密嬌黃侍翠輿避風遮日小扶踈畫闌想見懸秋晚無限宫香總不如林夫人挽詞黃中之妹知書翰墨門闌正巋然故應婉娩亦儒先與聞古學三千禮能誦家書四百篇卜協媯姜占永世夢呼辰巳䜟凋年班姬合有遺文在後日從容訪孟堅李仲鎮懶窩求名當著鞭訪道亦重趼二邊俱不住三昧不如懶向來南嶽師自謂極蕭散收涕且無緒客至那可欵爭如懶窩髙門外轍常滿殊不妨嘯歌秉燭苦夜短天寒雪欲花屋角黃雲晚徑須煩二妙對洗玻瓈盞次韻陳季陵寺丞求歙石睂子硯金星熒熒睂子緑婺源琢石如琢玉寶玩何曽救枵腹但愛文君逺山蹙丈人筆陳森五兵書品入妙仍詩名我有陂陀天海樣與公文字俱金聲梟盧一擲不須呼況敢定價論車渠只煩將到粧臺下試比何如京兆畫次韻季陵貢院新晴鎖闈令嚴深復深五星簾幕晴若隂淡雲微月謾淸夜短檠政自關人心看燈作暈生睡色江南行處夢不隔覺來快讀新晴篇恍然置我鶯花前徑欲觴公後堂酒倘煩春衫小垂手次韻周子充正字館中緋碧兩桃花碧城香霧赤城霞深出劉郎未見花憑仗天風扶絳節為招萼緑過羊家明日子充折贈次韻謝之海上三山冠綵霞六時髙㑹雨天花步虛聲裏隨風下吹落尋常百姓家明日大雨復折贈再次韻一天雲葉翳朝霞風卷泥沾不惜花羣玉山髙春好在人間煙雨暗千家張恭甫正字折贈館中碧桃因次子充韻次年滿枝晴雪照靑霞舊識桃源暈碧花俯仰京塵隔年夢東風猶認故人家雨中報謁呈劉韶美侍郎花落滿城雨雨餘雲重隂驅車有底急巷泥三尺深平生黃篾舫漁榔有淸音斗升得苦相懷刺衝愁霖歸來掩關卧一枕直兼金作詩詫比鄰幸勿譏褊心雨中集水月獻之今年不堪暑天亦相憐病良苦明便中秋法合凉夜半行雲曉行雨蘄州竹簟淸如氷飢蚊倔強猶鳴聲下牀蚤喜衣裳健出門更覺山川明曳屐扶藜尋水月不惜垂垂巾角折竹間松下巳淒然却要芳樽生暖熱送洪景盧內翰使虜二首金章玉色照離亭戰伐和親決此行國有威靈雙節重家傳忠義一身輕平生海內文場伯今日胸中武庫兵萬里往來公有相淮濆隂德貫神明近日兩淮戰地掩骼公之請也檄到中原殺氣銷穹廬那敢說天驕今年蕃始來和漢即日燕當逺徙遼北土未乾遺老淚西陵應望孝孫朝著鞭往矣功名會麟閣丹靑上九霄次韻嚴子文旅中見贈杯中疇昔共江天傾座新詩報警聯海浦寸心空共月京華雙鬢各凋年交情敢說同方友句法甘從弟子貟有意數從文字飲何須爭著祖生鞭次韻子文客舍小樓客裏仍攜一束書閉門虹氣自凌虛未聞光範延珠履誰向甘泉從玉車散盡生涯千答布收將文價百車渠淹留且結西湖夏同到秋風賦遂初次韻劉韶美大風雨壞門屋雲煙揮翰墨池翻緗縹如山晝掩關巳許六丁收散落只愁雷電費牆藩洪景盧內翰使還入境以詩迓之玉帛干戈洶並馳孤臣叱馭觸危機關山無極申舟去天地有情蘇武歸漢月凌秋隨使節胡塵捲暑避征衣國人渴望公顔色為報褰帷入帝畿寄題向撫州采菊亭一葉起秋色衆緑凋歲華耿耿霜露側餘此黃金葩西風滿天地孤芳照塵沙殷勤開小築花氣日夕嘉落英楚纍手東籬陶令家兩窮偶寓意豈必真愛花不如亭中人一笑了天涯采采勿虛度門前欲髙牙古風二首上湯丞相抱瑟游孔門豈識宫與商古曲一再行乃雜巴人倡知音顧之笑解絃為更張歸來掩關卧冰炭交愁腸平生桑濮手未省歌虞唐明發理朱絲復登君子堂遺音入三歎山髙水湯湯空山學仙子窮年卧巖扃煮石不得飽秋鬢蒼巳星道逢紫霄翁示我餐霞經采采晨之華滌濯腐與腥向來役薪水終然槁柴荆跪謝起再拜飄颻蛻蟬輕飛升那敢學倘許學長生冷泉亭放水古苔危磴著枯藜腳底翻濤洶欲飛九陌倦遊那有此從教驚雪濺塵衣九月十日南山見梅五斗留連首屢回來尋南澗濯塵埃春風直恐淵明去借與橫斜對菊開送汪聖錫侍郎帥福唐承明才入又南州重見旌旗照柁樓道義平生無捷徑風波隨處有虛舟如公未可違文石稽古何妨缺碧油我亦登門煩著録此行無力為王留送王純白郎中赴閩漕聲利場中百戰鏖今誰勇退似公豪緩尋南粵千山路先破西興百尺濤平日曼容嫌祿厚他年文本歎官髙才名政爾歸安往富貴追蹤未可逃純白先君平生約官至正郎而休卒踐言故純白為兵部便丐去以承其志長至日與同舍遊北山歲晚山同色湖平霧不收寒雲低閣雪佳節靜供愁竹柏森嚴立蒲荷索莫休瘦笻知腳力政爾耐淸遊石湖居士詩集卷八
