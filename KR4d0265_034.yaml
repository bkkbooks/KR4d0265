body:
  text: 館娃宫賦并序靈巖山寺故吳館娃宫也山上下間臺別館之迹髣佛可考余少長遊焉感遺事而賦之洶西山之南奔勢鬱嵂其巉空若大敵之在前忽踞虎而跧龍半紫崖而砥平訪館娃之故宫是為逸王之舊遊有墟國之遺恫焉嗟乎汰哉愎賢胥之忠告巽隂嚭之詖説暗養虎之後患縱處女使􅊵脫逮嘗膽之謀成駭疽囊之潰裂蓋自有以賈禍非天為之孽方其銜哀茹痛抆淚飲血儼拂士於前庭尅三年而報越訖甘心而一快夫何初志之英發及其見棲於姑蘇遽雌伏而大壞援宿恩而乞憐或赦圖於臣罪當是之時又何其憊也韙禍福之無門曷今愚而昨賢後千載之嗤點莫不鍾咎於嬋娟固尤物之移人抑猶有可得而言蓋嘗觀於若人矣好大而欲速厭常而棄舊狃會稽之得意謂周鼎其唾手闖齊楚以朵頤睨陳蔡而驤首道甚逺而疾驅氣巳餒而猶鬭外未寧而內憂東略之而西否阻關河以頓兵撤牆屋而致寇亟歸視其四封蔑一夫之能守是猶螳螂之慕蟬不知黃雀之議其後也然以蕞爾之旅衡行四方攻靡堅郛戰無距行事便時利如徑乎無人之鄉惜也未聞大道宜其逸樂而志荒次有臺池宿有嬪嬙左攜修明右撫夷光粲二八以前列咸絶世而浩倡嗟浣紗之彼姝乃獨繫於興亡蕩龍舟之水嬉擷香徑之春芳載夕陽以俱還秉遊燭於夜長灔金鍾之千石倣酒池於舊商歌吳歈而楚舞薦萬壽於君王悵星河之易翻嘉來日之未央錚銅壺之鳴悲爛急烽之森芒慘梧宫之生愁踐桐夢之不祥歘髙陵與深谷委盛麗於蒼茫所謂玉檻銅溝朱簾椒房理鏡之軒響屧之廊杳煙蕪與露蔓紛日暮之牛羊況捧心之百媚濯粉之餘粧者哉今則雲雨之巔仙聖是宅硯沼蓴浮琴臺松崛封古蘚於井甃宿暗芳於洞穴木鯨吼以淸厲金磬隱其蕭瑟彼方外之徒龜藏而蠖屈者又安知往古與來今方枯禪而縛律翩鴻影之拂坐見前山之銜石問天醫賦并序余幼而氣弱常慕同隊兒之強壯生十四年大病瀕死至紹興壬申又十三年矣疾痛疴癢無時不有夏至前一日得寒疾夢謁天醫省問答了然獨未知天醫為何神案晉書卷舌六星其一曰天讒主巫醫而孫氏千金書以日辰推天醫所在其是歟皆未可必也雖然吾疾自是其有間哉乃敘其夢為問天醫賦吳山之臞不達不聞有門常關日與病親歲直壬申亢中於昏薄寒中之不良睡眠覺邪夢邪陸離紛紜神馬具裝出於頂門驅風鞭霆莫知所從紫城翠樓千窗萬櫳玉書垂芒天醫之宫中有一人瑶冠紫衣如帝如尊衆真繞圍我瞻而思是其天醫者邪竊樂其名幸巳我疾次且而前再拜以出仰而稱曰蟣蝨之臣有鬱弗宣幸遭聖靈利用乞憐願賜淸間聽臣苦言天生下人如沙如塵長養安樂壽其天真臣獨多疾支離輪囷炎黃之經厥病四百去半取半臣悉經歷五日一曵杖十日一卧簀茁為痤痱潰為瘇癧遊為痺頑尼為否塞疏為洞蕩節為關格躁為囂呼靜為爽惑榮衛挾寒而留行溪谷流溫而橫溢襲於皮毛客於絡脈次於焦府盎於形色攣拳惰其四支皯黣淫乎大宅百骸九竅無一得適十巫遞進三醫更謁探金匱之寶藏紬玉函之祕䇿方書堆於几案藥物庤於牆壁訪和扁以制度招桐雷使炮炙參以天泉左右之運列以君臣佐使之職配合者相須畏惡者相敵參木芝桂鉛汞乳礫果菜之英醪醴之液萬歲之藟千年之珀莫潤於養血之茸莫澀於委蛻之骼厭逺效於中和要近功於武力三建若燎五毒若螫入口如荼下咽如戟燥剛以發舒酸苦以湧泄杵臼無停鳴鐺鼎不暇滌瞑眩酷烈疾戰縱擊外邪未潰中氣先踣久立則蹐久行則躄語多則逆卧多則惕先寒而裘未暑而綌席避風而五遷衣惡濕而再襞旦欲興而三休夜將誦而九息聽蟻為牛視朱作碧中憒憒其結轖頭岑岑而戴石人生世間居處飲食臣以病故跬步榛棘春醅珠紅暑醴玉白翠瓤之瓜靑房之菂泫梨液之流膚滃橘泉之破隙臣欲過門而大嚼黃媪推臣以避席淸空泬寥霧旦霜夕駕牛西上騎鯨東極納寒月於半領御罡風於兩腋臣欲褰裳而往從皓華挾臣以辟易弱柳怪其早衰癭木嗤其多瘠怠侮出於家人煩勞困於僕役羣居之中軋軋厭厭狎者臣嘲疏者臣嫌獨疚臣身不可任堪人之多疾自取自探不一其凡大略有三其一者心根泄機命門喪阻明消精散形弊神苦擲溫玉以卑火奉甘餐而戲虎隂惑陽而化蜮風落山而成蠱若是者得於晦淫命曰伐性之斧其二者愁莫愁於生離痛莫痛於死別哭不淚而神傷歎無聲而怨結魂欲升而中斷腸將思而巳絶孤憤為丹心之灰隱憂為靑鬢之雪若是者得於情鍾命曰蠧心之孽其三曰深居奧處溫燠窈窕重帷復幄風日不到枵然如久繫之匏薾然如處隂之草玉體軟脆動輒感冒若是者得於貴遊命曰煬和之竈凡此三者臣非有之呻號弊尫誰職為之孰祟孰厲孰攻孰襲何方而來何門而入抑嘗聞之造化為爐人物為象洪鈞無心大放厥帑元陽之氣可斤可兩人受其中有瘠有䑋故有稟生多艱形枯德腴委隨惰窳命也何如子房所以辟榖長卿所以間居士安散髮黽勉扶輿希逸惙惙疢與生俱天實為之非人速辜臣也不肖殆類此乎地産之藥方家之書嫓寒配溫僻違怪迂欲持人以勝天嗟慮密而功疏竊聞大神天醫之王範圍堪輿運平隂陽起死回骸斡旋天藏揉太和以為劑酌沆瀣而為漿噓碧落以發英糜朝霞而薦芳神火氣篩日暾星芒度人千億奮飛仙鄉賜臣刀圭刮摩膏肓濡枯充虛豐羸植僵解臣朽骨濯臣腐腸宅胎仙以葆真凝虛白而發光碎鼎槌罏破瓢褫囊脫兔彭殤之囿蛻蟬人鬼之場不老不衰來歸帝傍臣之願也非所敢望語未竟仰聞太息曰有是哉汝之憂也凡汝所苦可以理測凡汝所求吾不汝嗇病自汝得造化吾知汝窮汝原何藥之為今即汝身示汝三機隱几遐思載撫四維汝身塊然汝方火馳甘寐於牀委骸陳尸夢遊何方悲啼笑嘻溘焉以死烏鳶狐狸生汝安住死汝安歸形與化遷汝豈變移虛空無傍奚所據依厥狀維何為靑為黃為一為多為短為長未病何形巳病何色癢苛酸辛誰覺誰識吾將逺遊汝速返去試用我言周遍求汝脫焉得之解痼釋痾不然巳矣將奈汝何叩稽玉階退而下歸形開神澄汗濡寢衣嗚呼異哉為信為欺是邪非邪至今疑之望海亭賦并序會稽太守參政魏公作望海亭於卧龍之巔率其屬為歌詩以落成録與書來且使賦之余謹掇其膏馥之餘擬賦一首以寄後日獲從杖屨其上於山川之神尚有舊焉其辭曰諸侯之客有來自東而姹會稽之遊者曰佳乎麗哉越之為邦也縈山帶湖樓觀相望背卧龍而崛起煥丹碧之翬翔躋攀下臨顧瞻無旁平疇蔚以稚緣喬木森其老蒼淙萬壑之春聲寫千巖之秋光朝霞暝霏扶踈微茫望山河之故墟弔草木之餘社夏后萬國之朝勾踐百戰之野興亡梗概猶有存者至於流觴泛雪髙人之舊事浣紗采蓮遊女之遺迹鬱溪山之如畫尚倣佛其可識訪故老以問訊興慨歎於疇昔是為遊覽之大略而蓬萊觀風之所得雖然士固多感而況於對景以懷古撫事而凝情往往使人魂斷意折酒淡而歌不平故麗則麗矣而未擅乎登臨之勝也若夫浩蕩軒豁孤髙伶俜騰駕碧寥指麾滄溟墮憂端於眇莽挹皓氣於空明飄飄焉有連鼇跨鯨之意舉莫如望海之新亭嘗試登兹而望焉沃野既盡遙見東極送萬折之傾注艷寒光之迸射浸地軸以上浮蕩天容而一色珠輝具芒矗蝀橫霓快宇宙之淸寬悵百年之逼仄當其三星曉橫萬境俱寂浴日未動晨光先激波鱗鱗而躍金天晃晃而半赤頳輪騰上東方皆白煙消塵作栖鳥振翼俯羣動而紛起寄一笑於遐覿永我暇日苒其將夕餞斜暉於孤嶂候佳月於滄浦沉沉上下杳無處所驚玉地之破碎漾銀盤而吞吐忽褰雲而湧霧獻霜影於庭宇夜色既合初聞鐘鼓觴屢至而不辭詩欲成而起舞又若潮生海門萬里一息浮光如線濤頭千尺方鐵馬之橫潰倐銀山之崩坼氣平怒霽水面如席吳帆越檣飛上空碧此亦天下之偉觀然猶未及乎目力燕香舂容俗客莫陪神淸意消徙倚徘徊天風激吹波濤闔開五雲明滅丹宫絳臺睇三山之不逺其為公而飛來遂招汗漫之勝遊下飇車之逸軌屬紫霄之妙質值玉斚之淸醴勤歌鸞與舞鳳壽仙伯以多祉恍風雨之皆散但驚塵之四起悟真靈之不隔而何有乎弱水之三萬里也噫昔之居此者多矣曽靡暇於經營逮山靈之效竒發遺址於巖扃殫妙巧於天藏超埃壒而上征極觀聽之所接遂杳渺而難名嗟此樂之無央與來者而同登決眥蕩胸雪其塵纓且安知前日之蒼煙白露斷蔓而荒荆者哉顧客子之所能道者才管中之一斑惟覽者之自得會絶景於憑闌心凝神釋浩如飛翰而後知兹亭之仙意而凌虛御風之無難主人瞿然而起曰有是哉吾將觀焉惜交賦并序屈原既遭子蘭子椒之譖傷楚國之俗朋友道薄始合之難而終以輕背故著惜交之詞道知心之難遇故舊之不再得動心忍性徘徊不能去君子覽之有以增義合之重焉余既有此淑質兮昔幽處而無仇悵佳人之眇覿兮走六漠而周求歲甲子之初春兮維元日吾始遊紉木蘭以為蓋兮抗杜蘅以為斿詔凍雨俾淸道兮戒日星使燭幽恐駟驪之選軟兮又命飛廉而挾輈羾天紘而騖列缺兮俯幽都與玄丘天地四方多賊姦兮忽吾班乎齊州恍神釋而目粲兮恱夫人之好修佩轇轕之連璐兮戴陸離之髙冠紛雞鶩之朋飛兮儼黃鵠之蹁蹮葆衆美以自卑兮夫何獨處之嬋娟吾恐始合之易兮終離之者不難號百靈而訊之兮筮告余曰吉哉豫令巫咸往招兮介蹇修而為媒枉若人之嘉惠兮命保介而載豫摻修袂而約言兮曰歲晚其與俱入既與之同袍兮出又與之同車投我以蒼玉之連環兮豫報以獨繭曵緒玉宛轉而不斷兮繭縈紆而連縷谷風習其自東兮固維風而及雨汝行前而豫殿兮豫安歌而汝舞至於今其十年兮固知美惡周必復敏豫德而日新兮羌未變乎初也修豫容其滋媚兮嗟采色其猶未暮也妬被離而害交兮讒翕脅而敗度雖君子之石腸兮固將徇乎市虎兩造膝而笑言兮慘其間之容斧豫冶容虞豫善泆兮頩顔謂豫汝怒髮甚短而怨長兮輿則固而路艱蹇中道而如遺兮豫既寡而汝鰥夫豈無他人兮焉有夫君之好賢雖得汝於萬一兮終不及當時之纏綿彼日而食兮此月而虧物不終盡剝兮信復盈之有時涕承曉而交下兮若孟津之流澌敢誦言而怨慕兮恐衆人之汝窺曼豫聲以悲吟兮託長風而要之政木石必回眷兮將白首而為期儻曽飛而不顧兮嗟此怨之誰歸荔枝賦并序紹興丙子夏有自行都餉貢餘新荔子者坐客稱歎窮山所未嘗有呼酒更酌鼓琴以侑之且為之賦時為新安掾吾聞南國之南水激而山蟠鍾具美於一物繄化工之所難撋絳綃以袨服襲蒨桃而中單湛冰明之漼漼粲玉粒之團團蓊生香之令芳泫仙液於微瀾走候置其萬里上玉宸與金鑾顧人間之流落才千倉之一簞餉江南之病客索孤笑於顰端斥蜂蜜之黃膩謝佛桑之紅乾覺龍目之么麼咍蒲萄之甘酸藉以秋雲之巾薦以水晶之盤羞以燒春之浮醅相以流水之淸彈逮風月之溫麗耿星河其未翻豫一嚼而三咽灔玉池之淸寒恍醉夢之翾飛掖九天之風翰望涪江與閩嶺麾八極於雷鼾方溟濛其路暗倏浩蕩其天寬岌芳宫與繡戶窈玉聲之闌珊欵荔枝之仙人若平生之所歡謂客子其少留紛擘緑而破丹招玉環於東虛御淸空之雙鸞訪長生之舊曲有千載之遺歎悵三山之回風驚南斗之闌干亂梧竹之滿庭渺雲海之漫漫桂林中秋賦并序乾道癸巳中秋湘南樓月色佳甚病起不觴客又祈雨𬞞食淸坐默數年來九遇此夕皆不常其處乙酉值三館丙戌與嚴子文遊松江有來歲復會之約丁亥又以薄遽走陽羡與周子充遇於罨畫溪上戊子守括蒼巳丑以經筵內宿庚寅使虜次於雎陽辛卯出西掖泊舟吳興門外壬辰始歸石湖而今復踰嶺歎此生之役役次其事而賦之登湘南以獨夜兮挹訾洲之橫煙絳霄艷其光景兮湧冰鏡於蒼巔悵旻宇之佳節兮并四者其良難矧吾生之漂泊兮寄蘧廬於八埏九得秋而九徙兮靡一枝之能安上瀛洲而瀑飲兮當作噩之初元旋水宿於垂虹兮滉金碧之浮天剋後期而竟爽兮忽罨畫之滄灣既戊子而守括兮摘少微於樓欄丑寓直於玉堂兮聽宫漏之淸圓再西風而北征兮胡笳咽於夜闌逮返斾之期月兮放苕霅之歸船幸故歲之還吳兮帶夕暉而灌園甘土偶之遇雨兮就一丘而考槃今又飄飄而桂海兮賓望舒於南躔訪農圃之昨夢兮杳征路之三千月亦隨豫而四方兮不擇地而嬋姢諒素娥之我咍兮老色涴於朱顔觀月之曩見兮炯不動而超然適病餘而閉閣兮屏危柱與哀絃復訟風而閔雨兮謝鼎食之芳鮮閴淸齋而晤歎兮驚足迹之間關誰職為此驅逐兮豈不坐夫微官知明年之何處兮莞一笑而無眠楚辭幽誓天風厲兮山木黃歲晼晚兮又早霜虎號崖兮石飛下山中人兮孰虞豫造軔兮挾輈紛不可兮此淹留靈曄兮遄邁趣駕兮逺遊豫髙馳兮雨濡蓋豫揭淺兮水漸珮橫四方兮未極泥盎盎兮豫車以敗望夫君兮天東南江復山兮斯路巉恍欲遇兮忽不見奄晝晦兮雲曇曇前馬兮無路稅駕兮無所誰與共兮芳馨獨蒼茫兮愁苦愍遊君胡為兮逺遊蹇行迷兮路阻修朝豫濟兮滄海靈胥怒兮蛟躒舟暮豫略兮太行車墮輻兮驂決攀援怪蔓兮一息雷晝闞兮山裂四無人兮又風雨靈幽幽兮為豫愁絶君胡為兮逺道委玉躬兮荒草與魑魅兮爭光與虎兕兮羣嘷君之居兮社木蒼然衡門之下兮可以休老歸來兮婆娑芳滿堂兮儛歌奉君子兮睂壽光風蕩兮酒生波雲日兮同杜月星兮偕夜千秋兮歲華弭豫蓋兮紲豫馬悲莫悲兮天涯樂莫樂兮還家交難美一人兮巖之扃珮璧月兮間珠星歲既單兮不圭幣路巉絶兮逺莫致稼石田兮長飢誰與此兮藝之藉豫玉兮雙玨先豫絺兮五兩不萬一兮當此託長風兮寄想長風兮無旁吾媒乏兮鳳凰謂蘋若兮蒿艾鳳告豫兮以不祥恐靑女兮行秋奄銷歇兮衆芳搴芳華兮玉蕤將以遺兮所思玉蕤兮霜露所思兮未知歸將輿不濟兮中河日欲暮兮情多子蘭橈兮蕙棹願因子兮凌波眢壑兮以漁周落兮以驅驪龍兮飛度郊之麟兮去汝波河濆兮迷塗黃流怒兮不可以桴目八極兮悵望獨顧懷兮此都御右兮告病鑾鈴兮靡騁河之水兮洋洋不濟此兮有命石湖居士詩集卷三十四
