front:
  text: 石湖居士詩集卷十一
  hash: sha256:9a33a22438717f42797b3d3569db415251347e4b22721812c4c04c7eb970d582
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0265_SBCK_011-1a}
body:
  text: 己丑五月被召至行在遇周畏知司直和五年前送周歸弋陽韻見贈復次韻荅之以下自處州再至行在作分袂悠悠爾許年莫嗔蓬鬢兩蕭然酒槽不奈靑春老經笥空供白晝眠暗緑千章新活計軟紅三尺舊塵縁相逢且作西湖客山繞荷花檥畵船次韻馬少伊郁舜舉寄示同游石湖詩卷七首蕪城老蘚不知春忽有柴門月色新芝草琅玕無鎖鑰自無超俗扣門人莫問朝歌與棘津浮生惟有一杯春君看百戰功名地越戍吳臺兩窖塵鏡面波光倒碧峰半湖雲錦萬芙蓉去年蕩槳香風裏行傍石橋花正濃紅皺黃團熟暑風甘瓜削玉藕玲瓏身謀巳落園丁後滿帽京塵日正中兩賢風度藹春陽歩屧隨風上柳塘綵筆紅牋芳徑裏句中挾我萬花香得得來題小隱詩拂香縈柳画船移湖邊好景春猶未須到秋淸月滿時瀟洒王郎亦勝流今年何事阻淸遊當家風味今如此孤負山隂夜雪舟王必大獨不赴二公同遊之約玉堂寓直摛文窓戸九霄中岸幘燒香愧老農上直馬歸催下鑰傳更人唱促鳴鐘金城􅏭嵲雲千雉碧瓦參差月萬重骨冷魂淸都不夢玉階蕭瑟聽秋蛩己丑中秋寓宿玉堂聞沈公雅大卿劉正夫戸部集張園賞月走筆寄之笑看收雲捲雨忙沉沉宫樹納空光夜長來伴玉堂宿天近似聞丹桂香鳷鵲樓欄浮瑞氣鳳凰城闕帶新凉遥知勝絶西園會也憶車公對舉觴八月二十二日寓直玉堂雨後頓凉雨意蒸雲暗夕陽濃薫滿院落花香題詩弄筆北窓下將此工夫報荅凉次韻荅吳江周縣尉飲垂虹見寄垂虹亭上角巾傾鼉怒龍吟醉不聽安得對君浮大白想應嗤我汗新靑夢魂舞蝶隨春草時節賔鴻點暮汀湖海扁舟須及健莫敎明月照星星次韻徐廷獻機冝送自釀石室酒三首元亮折腰嘻巳久故山應有欲蕪田因君辦作送酒客憶我北窓淸晝眠淸絶仍香如橘露甘餘小苦似松肪官槽重濁那知此付與街頭白面郎一語爲君評石室三杯便可博凉州百年兀兀同渠住何處能生半點愁玉堂寓直曉起書事記直舎老兵語江湖垂釣手天漢摛文堂魂淸不得眠室虚自生光曉緯澹天闕江濤隱胡牀傳呼九門開奔走千官忙若若誇組綬紛紛夢黃梁微聞鈴下騶竊議馬上郎但計夢長短寧論已行藏與長文正夫游北山柳岸松門勝處通馬蹄踏霧入空濛春寒有力欺遊子天色無情没斷鴻雨脚逺連山脚暗杏梢斜倚竹梢紅駞裘擁鼻吾衰矣年少猶嫌料峭風致政承奉盧君挽詞二首德華父泮水橋門識太平歸來霜鬢老柴荆淹中學䆳方成傳谷口名髙豈待卿黃壤無情埋玉樹靑衫有道勝金籯襄陽耆舊今蕭索惟有松風到晩淸純孝當年有䕶持赤睂那敢近姜詩眼看庭玉成名後身及堂萱未老時湖海靑鞵驚斷夢風霜丹旐挂新悲尊前五客今誰在愁絶廬山十段竒寓直玉堂拜賜御酒歸鴉陸續墮宫槐簾幙參差晩不開小雨遂將秋色至長風時送市聲來近瞻北斗璿璣次猶夢西山翠碧堆慚愧君恩來甲夜殿頭宣勸紫金杯送汪仲嘉侍郎使虜分韻得待字聖人坐明堂洪覆等穹蓋歳頒兩玉節前後歌出塞公才有廊廟安用試專對要煩第一人鎭撫大荒外嫩寒欺別酒微月見征斾遥知燕山雪飄灑漢冠佩玉色照穹廬驕子亦心醉要領一笑得歸來安鼎鼐是時春正佳湖上花如海淸遊不可遲日日檥船待李翬知縣作亭西湖上余用東坡語名之曰飲緑遂爲勝槩芷葺蓮巢喚客遊蘆鞭席帽爲君留未論吹水堪添酒且要移牀學枕流乍霽却隂梅釀雨暫暄還冷麥催秋石湖也似西湖好煩向蒼煙問白鷗草蟲扇莫嫌絡緯股鳴悲解向寒牕促曉機海眼多花無藉在顚狂只待學于飛送汪仲嘉待制奉祠歸四明分韻得論字丹霄碧海眇髙鶱厭直承明却自論寶馬十年聽漏箭扁舟一雨看潮痕侍臣相憶松門逺歸客還憐菊徑存淸潤要非山澤相又煩一札下雲根魯如晦郎中挽詞二首術業推游刃功名苦溯洄著鞭孤壯志籌算老竒才星省龎睂去雲山袖手來知公了時命何必誄餘哀自古歸來引于今遂隱篇碁燈熒夜觀歌板聒春船陳迹空華似佳城露草邊寂寥雞黍約望眼一􅏰然初約鄰人至石湖以下辛卯自西掖歸吳作窈窕﨑嶇學種園此生丘壑是前縁隔籬日上浮天水當戸山橫匝地煙春入葑田蘆綻筍雨傾沙岸竹垂鞭荒寒未辦招君醉且吸湖光當酒泉社日獨坐海棠雨後沁臙脂楊柳風前撚緑絲香篆結雲深院靜去年今日燕來時與周子充侍郎同宿石湖幽香馥蕙帳淸夢安且吉蘿月墮蒼茫松風隱蕭瑟曉禽啄且鳴喚我起盥櫛鈎窓納雲濤灔灔浴初日金鉦忽騰上倒景落書帙佳晴有新課曬種催萟秫從今不得閒東皐草過膝和周子充侍郎見寄樂府戲贈之作釣海風水急登樓塵霧髙不如岸綸巾春船攜小橋芳草含竒薫光景上東壁桂林那辦此辦作安昌客壬辰三月十八日石湖花下作夜飲海棠月朝潄山茶露臞儒槁木形受用侈如許荆扉隔黃塵誰識花島路惟有瘦笻枝共飽園中趣林神釀餘春政爾美無度葱蘢千萬重芳意未渠暮風香薦秀色鼎俎謝腥腐雖無稻粱謀捫腹有餘飫刈麥行梅花開時我種麥桃李花飛麥叢碧多病經旬不出門東陂巳作黃雲色腰鐮刈熟趂晴歸明朝雨來麥沾泥犁田待雨插晩稻朝出移秧夜食麨壬辰天中節赴平江錫燕因懷去年以侍臣攝事捧御盃殿上賦二小詩去歳排場德壽宫薫風披拂酒鱗紅小臣供奉金龍醆親到虚皇玉座東天中繖動玉輿來萬歳三聲徹九街想見牙牀當殿過舜裳雲委拜堯階壬辰七月十六日侵晨眞率會石湖路中書事白葛烏紗稱老農溪南溪北水車風稻頭的皪粘朝露歩入明珠翠網中次韻施進之惠紫芝术山精媒長生仙理信可詰梨棗本寓言𣏌菊亦凡質幽人愛臞儒藥鼎薦珍物絶粒謝煙火耘苗換肌骨摩挱萊蕪甑塵生不須拂題醉道士圖蜩鷃鵬鵾任過前壺中春色瓮中天朝來兀兀三杯後且作人間有漏仙五雜組四首并序古樂府有五雜組及兩頭纎纎殆類酒令孔平仲最愛作此以爲詩戲亦效之五雜組同心結往復來當窓月不得巳話離別五雜組流蘇縷往復來臨行語不得巳上馬去五雜組回文機往復來錦梭飛不得巳獨畵睂五雜組綵絲鍼往復來鳥投林不得巳夢孤衾兩頭纎纎二首兩頭纎纎探官繭半白半黒鶴氅縁腷腷膊膊上帖箭磊磊落落封侯面兩頭纎纎小秤衡半白半黒月未明腷腷膊膊扣戸聲磊磊落落金盤冰再賦五雜組四首五雜組綬若若往復來大車鐸不得巳去丘壑五雜組侯門㦸往復來道上檄不得巳天涯客五雜組漢旌斾往復來賔鴻字不得巳餐氊使五雜組非煙雲往復來朝馬塵不得巳嬰龍鱗夜坐聽雨四檐密密又踈踈聲到蒲團醉夢蘇恰似秋眠天竺寺東軒窓外聽跳珠寒夜獨歩中庭忍寒索句踏霜行刮面風來鬚結冰倦僕觸屏呼不應梅花影下一窓燈會散野歩忘却下樓扶我誰接離顚倒酒沾衣貪看雪樣滿街月不上籃輿歩砌歸歩砌吳語也孟嶠之家姬乞題扇二首輕雲翠英輕煙小雨釀芳春草色連天緑似裙斜日滿樓人獨望斷鴻飛入萬重雲翠袖凌寒弄月明梅花影下醉三更一天風露誰驚覺寂寞空杯綴落英周畏知司直得湖南帥屬過吳門復用已丑年倡和韻贈別邂逅婆娑失少年劇談抵掌尚超然君猶拄笏看山去我且披蓑聽雨眠京洛分襟疑後會江吳把酒悟前縁暫來忽去都如夢疑是陳卿竹葉船偶書以下十五首三十年前所作續得殘稾附此卷末伯勞東去燕西飛同寄春風二月時可恨同時不同調此情那得更相知雙燕底處飛雙燕銜泥上藥欄莫敎驚得去留取隔簾看戲題牡丹主人細意惜芳春寶帳籠堦護紫雲風日等閒猶不到外邊蜂蝶莫紛紛春日三首藥欄花煖小猧眠雪白晴雲水碧天煮酒靑梅寒食過夕陽庭院鎖鞦韆西窓一雨又斜暉睡起薫籠換夾衣莫放珠簾遮洞戸從敎燕子作雙飛雙鯉無書直萬金畵橋新緑一篙深靑蘋白芷皆愁思不獨江楓動客心髙樓曲以下六首皆夢境所得歳暮天涯客黃昏蝙蝠飛髙樓人不到小雨怯單衣湘江怨蘋芷迷煙路蓮舟忘却歸夜寒江水黒風雨夢如飛採蓮三首溪頭風迅怯單衣兩槳凌波去似飛折得蘋花雙葉子緑鬟撩亂帶香歸藕花深處好徘徊不奈華筵苦見催記取南涇茭葉露月明風熟更重來柔櫓無聲坐釣魚浪花飛點翠羅裾空江日暮無來客腸斷三湘一紙書弔陳叔寶詞賞心亭上再來遊煙月迷人獨自愁行到江邊無去路却隨潮水過揚州石湖居士詩集卷十一
