  text: 石湖居士詩集卷二
  hash: sha256:4dda4fa40c70ce7f6b80da3390d739f2e26b569e409870726aefe74f8fba1560
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0265_SBCK_002-1a}
body:
  text: 望金陵行闕聖代規模跨六朝行宫臺殿壓金鼇三山落日靑鸞近雙闕淸風紫鳳髙石虎蹲江蟠王氣玉麟湧地鎭神臯太平不用千㝷鎖靜聽西城打夜濤金陵道中山晩黃羊隨日下天寒白犢弄風歸愁埃百轉西州路笑憶沙湖一棹飛曉行官塘驛篝燈驛吏喚人行寥落星河向五更馬上誰驚千里夢石頭岡下小車聲秦淮不將行李試閒關誰信江湖道路難腸斷秦淮三百曲船頭終日見方山重九獨登賞心亭誰敎佳節滯天涯強展愁眉管物華每歳有詩題白鴈今年無酒對黃花悠悠造化占斜日草草登臨記落霞宇宙此身元是客不須彈鋏更思家賞心亭再題天險東南重兵雄百二尊拂雲千雉繞截水萬崖奔赤日吳波動蒼煙楚樹昏向無形勝地何以控乾坤宿義林院暝氣昏如雨禪房冷似氷竹間東嶺月松杪上方燈驚鶻盤金刹流螢拂玉繩明朝窮脚力連夜斬崖藤荆公墓二首百歳誰人巧拙一丘底處虧成半世靑苗法意當年雪竹詩情本意治功徙木何心黨禍揚塵報讎豈敎行刼作俑翻成害仁十月朔客建業不得與兄弟上冡之列悲感成詩歳巳看成暮身今未得歸風塵孤淚盡霜露寸心違南磵新流水西山舊落暉煙松應好在宿草定成非逝水方東去浮雲浪北飛危魂先自斷不待更沾衣白鷺亭倦遊客舎不勝閒日日淸江見倚闌少待西風吹雨過更從二水看淮山臙脂井三首昭光殿下起樓臺拚得山河付酒杯春色巳從金井去月華空上石頭來午醉醒來一夢非怱怱玉樹逐春歸臙脂却作千年計不似愁魂四散飛腰支旅拒更神遊桃葉山前水自流三十六書都莫恨煩將歌舞過揚州秦淮并序自金陵復泛秦淮宛轉數百曲世傳始皇東巡自江乗渡望氣者以爲金陵有天子氣乃鑿長岡引潮水入焉號曰秦淮逶迤屈曲不類人功故又傳爲龍所開也祖龍驅羣龍䟽此萬丈溝雨工戀故棲十歩九回頭至今秦淮曲蜿若春蛇遊舟師厭回互歎息倚柂樓維昔東巡初八極圍寸眸天端有佳氣鬱鬱東南浮卜云當興王在後五百秋叱咤召六丁慘淡風雲愁鑿渠斷地脉自謂神與謀乾坤有端倪巳露不可收大帝開吳天定鼎臨江陬融融秣陵日始照十二斿經營曁六代兹地稱神州乃知歷數定昧者徒私憂兹事故老傳未知信然不姑置勿重陳作詩歎遲留九月三日宿胥口始聞鴈以下歸崑山作故人久不見乍見雜悲喜新鴈如故人一聲驚我起把酒不能觴送目問行李曽雲行路難空濛千萬里塞北多關山江南渺雲水風髙吹汝痩旅伴今餘幾斜行不少駐滅没蒼煙裏羈遊吾亦倦客程殊未巳扁舟費年華短纜繫沙尾物生各有役冥心聽行止江郊匝地熟場圃平如砥歸期且勿念共飽豐年米欲雪烏鴉撩亂舞黃雲樓上飛花已唾人說與江梅須早計馮夷無賴欲爭春讀史三首百歳虧成費械機烏鳶螻蟻竟同歸一檠燈火挑明滅兩眼昏花管是非堂堂列傳冠元功紙上浮雲萬事空我若材堪當世用他年應只似諸公鏤氷琢雪戰毛氂画餅聲名骨朽時汗簡書靑巳兒戲峴山辛苦更沉碑宴坐菴四首油燈巳暗忽微明石鼎將乾尚有聲衲被蒙頭籠兩袖藜牀無地著功名五更風竹鬧軒窓聽作江船浪隱牀枕上翻身尋斷夢故人待漏滿鞾霜粥魚吼罷鼓逄逄卧聽飢鼯上曉釭一點斜光明紙帳悟知檐雀巳穿窓跏趺合眼是無何靜裏惟聞鳥雀多俗客叩門稱問字又煩居士起穿鞾靑靑磵上松送致逺入官靑靑磵上松鬱鬱磵底柏松森上曽雲柏跼抱幽石偃植雖不同臭味乃相得千霜與百雪偶立衆芳側衆芳豈不好歳晏埽無迹廣厦罩羣木萬牛挽山澤松材可世用攀援入王國草木豈有情亦復念離析君看此翠柏錯莫無顔色孤隂愁月夜獨籟怨風夕蒼官何當歸相望長相憶除夜感懷松楸百年哀霜露終歳悲天地豈汝偏鬼神諒無私孤窮罪當爾我今怨尤誰噎絶夢自語伶俜影相隨豈無一經傳政坐五鬼嗤鑿枘共齟齬榛荆費耘耔付卑踰丘山奉承劣毫釐生男九族歡所願作門楣時命有大謬生男竟何裨匏瓜謾枵腹蒲柳無眞姿蹙縮髙顴頰蕭騷短髯髭貧病老歳月斗杓坐成移曉風凄以寒簾幕相紛披月星炯我冠霧雨泫我衣焄蒿奉祠事苦淚落酒巵逝者日巳逺生者日以衰羸驂駕九折日暮抱長飢岐路正巉絶耿耿誰當知次韻唐子光席上賞梅玉枝橫斜照淸空纎手撚香公水部無人廣平去後來我輩猶情鍾誰噴昭華送愁絶呌雲三弄怨斜月徑須踏雪問前村莫待馬蹄如踣鐵春風壓盡百花橋尊前仍有董嬌嬈惜無楚客歌成雪空有蕭郎眼似刀夜行上沙見梅記東坡作詩招魂之句玉妃謫人世乃在流水村天風吹嬋娟飄墮寂莫濵芳心怨命薄玉色凄路塵佳人來無期日暮多碧雲溪聲爲咽絶月亦低微顰相逢倦遊子一笑不復珍脉脉問不語亭亭意彌眞要我氷雪句招此欲斷魂蘇仙上賔天妙意終難陳璿柄忽傾墮曉嵐愁翠昏次韻唐子光敎授河豚世間尤物美惡并江鄉未用誇吳羮淸宫洞房寒熱媒深山大澤龍蛇生胡夷信美胎殺氣不奈吳兒苦知味楊花欲動荻芽肥汙手死心揺食指食魚要是黃粱古來不必須河魴君看嗔腹似渾脫寧肯滑甘隨芥薑先生法語峻立壁譏評不使一錢直膨亨從此迹如埽坐令梅老詩無力懸知仙骨有靑冥風香久巳滌羶腥大笑日華解毒法何如肘後餐霞經題如夢堂壁勃姑午啼喚雨鵯鵊曉囀留春片雲不載歸夢兩髩全供客塵曉起簾額繡波蕩漾燭盤紅淚闌干夢裏五更風急愁邊一半春殘再遊上方僧共老花俱在客將春鴈同回范叔一寒如此劉郎前度曽來即事醉袖籠鞭轉柳塘靑門芳樹掩殘香誰驚翡翠雙飛去衹有蓮花對斷腸春晩即事屋頭淸樾暗荆扉紫葚斕斑翠莢肥春晩軒窓人獨困日長籬落燕雙飛春晩三首隂隂垂柳閉朱門一曲闌干一斷魂手把靑梅春巳去滿城風雨怕黃昏客去鉤窓詠小詩遊絲撩亂柳花稀微風盡日吹芳草蝴蝶雙雙貼地飛夕陽槐影上簾鈎一枕淸風夢昔遊夢見錢塘春盡處碧桃花謝水西流樂先生闢新堂以待芍藥酴醿作詩奉贈芍藥有國色酴醿乃天香二妙絶世立百草爲不芳先生絶俗姿風味本無雙年來悟結習欲試安心方天魔巧伺便作計廻剛腸多情開此花艶絶温柔郷道人爲一笑正爾未易忘呼童葺荷芷擇勝開軒窓啼鶯不愁思遊蜂亦猖狂百年顰呻頃共此過隙光朝爲春條緑暮爲秋葉黃把翫尚無幾況以憂愁妨願言秉燭遊迨此春宵長題城山晩對軒壁一枕淸風夢緑蘿人間隨處是南柯也知睡足當歸去不奈溪山留客何題城山挂月堂壁百叠煙鬟得眼明坐來心跡喜雙淸秋陽滿地西風起猶有啼鶯四五聲姑惡并序姑惡水禽以其聲得名世傳姑虐其婦婦死所化東坡詩云姑惡姑惡姑不惡妾命薄此句可以泣鬼余行苕霅始聞其聲晝夜哀厲不絶客有惡之以爲此必子婦之不孝者予爲作後姑惡詩姑惡婦所云恐是婦偏辭姑言婦惡定有之婦言姑惡未可知姑不惡婦不死與人作婦亦大難巳死人言尚如此大暑舟行含山道中雨驟至霆奔龍挂可駭隤雲曖前驅連鼓訌後殿駸駸失髙丘擾擾暗古縣白龍起幽蟄黒霧佐神變盆傾耳雙聵斗暗目四眩帆重腹逾飽櫓潤鳴更健圎漪暈雨點濺滴走波面伶俜愁孤鴛颭閃亂飢燕麥老枕水卧秧穉與風戰牛蹊岌城沉蟻隧洶瓴建水車競施行歳事敢休宴咿啞嘯簧鳴轣轆連鎖轉駢頭立婦子列舎望宗伴東枯駭西潰寸涸驚尺澱嗟余豈能賢與彼亦何辨扁舟風露熟半世江湖徧不知憂稼穡但解加餐飯遥憐老農苦敢厭遊子倦題畵卷五首鑿落秋江水石明髙楓老柳兩灘橫君看叠巘雲容變又有中宵雨意生欹傾棧路繞山明隔隴人家犬吠聲無限白雲堆去路不知誰識許宣平春隂十日溪頭暗夜半西風雨脚收但覺奔霆吼空谷遥知萬壑正爭流暑雲潑墨送驚雷坐見前山驟雨來今夜一凉千萬里更無焦卷與塵埃秋晩黃蘆斷岸江南野水連天日色微明魚網鴈行飛入蒼煙六月七日夜起坐殿廡取凉畏暑中夜起出門月露淸晶熒卧銀漢錯落低玉繩網戸閉妙香石樓棲古燈風從何處來殿閣微凉生桂旗儼不動藻井生上征榱楣共突兀鬼物相枝撐彭觥鐵拄杖磔磔棲燕驚俗人豈解事鼻息春雷鳴大星送曉來四窓炯微明顥氣澡肌骨栩栩兩腋輕乗風欲歸去驂鸞羾靑冥却恐方平知浪得狡獪名中秋卧病呈同社人間佳風月浩浩滿大千俗子不解愛我乃知其天以此有盡姿翫彼無窮妍受用能幾何北溟一杯然天公尚齟齬不肯卑其全卧病窘詩料坐貧羞酒錢瓊樓與金闕想像屋角邊如聞眞率社勝遊若登仙四者自難并造物豈我偏秋日雜興六首我友蓬蒿士却埽謝四鄰内無三尺童外無雙蒲輪豈非騏驥姿執轡難其人無衣可御冬忍寒待陽春仰雲發永歎夜作寒螿呻奓戸勸之起懷寶善自珍秋月耿淸夜秋風捲曽雲佳哉爲誰歟定爲我與君莫嫌酒味薄聊復相歡欣夕陽下桑柘餘暉挂西山西山在何許冉冉紫翠間綵雲無朝昏緑蘿竟暄寒昔與霞上人同跨雙飛翰上凌紫霄峰下弄白石湍風吹墮渺莽及此行路難佳人應望予我豈眞忘還秋髙氣彌淸歳晏天雨霜繁枝各病緑況乃枝上香向來不勝春渺在無何鄉樂極定自悲誰歟此更張春秋無終窮榮落殊未央嫣嫣芙蓉花秀出淸霜晨衆卉巳昨夢孤芳若爲新寒蜂無儇飛一笑靜自珍誰令嬋娟姿墮此寂寞濵絶世貴獨立後時莫酸辛回風佐小舞薄日生微醺即事亦足樂何必桃李塵蒼筠如蒼玉鄉是磵壑姿朅來西窓下死生付汙泥蟲縁有病葉土瘦無新枝太陽豈我偏檐影爲蔽虧昔如松柏獨今作蒲柳衰暮夜風雨急歳晏誰與歸屋東雙梧桐婉娩無眞姿朝爲春風條暮爲秋霜枝夜久風葉鳴驚鵲一再飛梧桐不足愁會有明年期人老眞可歎寧復遊冶時石湖居士詩集卷二
