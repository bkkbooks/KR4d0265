front:
  text: 石湖居士詩集卷二十四
  hash: sha256:6118de71aba24c9de5dc0db0dfe236b51baab1040a76eb7112bbbfd6547ab7ac
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0265_SBCK_024-1a}
body:
  text: 題請息齋六言十首洞門晝挂鐵鎖閣道秋生緑苔蓍下略同龜伏瓜中且免蠅來多謝紛紛雲雨相忘渺渺江湖坐隅但忌占鵩屋上何煩譽烏灔澦年年似馬太行日日摧車笑中恐有義甫泣裏難防叔魚見影蜮猶鉍鉍聞聲厖尚狺狺問誰毛生名紙知我角出車輪不惜人扶難拜非關我醉欲眠勞君敬枯木耳恐汝見濕灰焉稅駕今吾將老結廬此地不喧恐妨蝴蝶同夢笑倩顚當守門口邊一任醭去鼻孔慵將涕收間門冷落車轍空室團欒話頭冷暖舊雨今雨是非一波萬波壁下禪枯達磨室中病著維摩親戚自有情話來往都無雜言酒熟徑須相報文成聊與細論園丁以時白事山客終日相陪竹比平安報到花依次第折來送劉唐卿户曹擢第西歸六首摩挲漢柱愴分襟邂逅吳船喜盍簪別久十年知幾夢情親萬里只初心學道何關紫與靑發身聊假佛名經歸來解盡程書縛千古文章似建瓴槐黃燈火困豪英此去書窗得此生學力根深方蒂固功名水到自渠成中年親友惜分離況我身兼老病衰餘景庶幾猶及見登瀛召客過門時我識岷峨最上頭當年腳力與雲浮兩山父老如相問一席三椽正卧遊四海西州舊故多煩君問訊各如何心期本自無南北萬里天波一月波末句戲用蜀語以見久要不忘之意富順楊商卿使君嚮與余相別于瀘之合江渺然再會之期後九年乃訪余吳門則喜可知也今復分袂更增惘然病中強書數語送之合江縣下初語離共説再會知何時壽櫟堂前哄一笑人生聚散真難料靑燈話舊語未終船頭疊鼓帆爭風草草相逢復相送直恐送迎皆夢中昨聞親上安邊奏玉階從容移禁漏天香懷袖左魚符歸作雙親千歲壽我今老病塘蒲衰君歸報政還復來萬里儻容明月共更期後夢如今夢久病或勸勉強遊適吟四絶答之風月箇中老子江湖之上散人化爐苦靳淸福環堵間拋好春鶴怨久回俗駕鷗盟誰主載書一丘一壑謝汝三歲三秋望豫捫蝨即是忙事驅蠅豈非褊心香暖香寒功課窗明窗暗光隂羸如蓐婦多忌倦似田翁作勞玩具僧梳刖屨歡悰丁尾龜毛初秋間記園池草木五首茙葵爛紫終陋薝蔔嫣黃亦香醫俗賸延竹色療愁催拆萱房牛牽碧蔓自繞雞聳朱冠欲爭菱葩可範伯雅蓼節偏宜麴生菱葩為酒杯樣最佳蓼入麴為勝旱地蓮花嬌小水盆梔子幽芳薇帳半年春艷桂叢四季秋香紫薇一名半年紅嵓桂一種四季有花醉憐金盞齊側卧看玉簪對橫腥水留灌末利結香旋薰素馨末利用治魚腥水澆方多花玉菡化生稚子碧枝視現聲聞馬齒任藏汞冷鴻頭自勝硫溫謂孩兒蓮羅漢木馬齒莧中有水銀鴻頭芡實也芡性暖號水硫黃巖桂三首風簾踈爽月裴回悵望家人把酒杯病著幽窗知幾日瓶花兩見木犀開越城芳徑手親栽紅淺黃深次第開不用小山招隱賦身如強健日千回一株蕭索倚宣華東苑香風屬內家丹碧屠蘇銀燭照平生竒絶象山花少城圃中惟有一株建康東御園有亦不多四明丹桂特竒州宅所種尤蔚茂常與魏丞相夜飲其下中秋無月三首兒女無悰坐客稀今年孤負隔年期誰從天上牢遮月不管人間大欠詩撲地癡雲欲萬重家家簾幕護房櫳世間第一無情物誰似中秋雨與風一生露下風前客兩歲愁邊病裏身姑置隂晴圓缺事藥寮燈火正相親藻姪比課五言詩巳有意趣老懷甚喜因吟病中十二首示之可率昆季賡和勝終日飽間也舊歲連新歲涼牀又暖牀山川屏裏畫時刻篆中香畏壘吾安土支離飽太倉若教身更健鶴背入維楊牣鹿紛紜夢亡羊散亂心眵昏遮眼讀愁苦撚髭吟幸覺行迷逺其如卧病深通身都放下何用覓砭針日暖衣猶襲宵長被有稜朝晡三楪飯昏曉一釭燈伴坐跧如几扶行瘦比藤生緣堪入畫寂寞憩松僧繩倚扶枵骨蒲團閣瘁膚事疑償業債形類窘囚拘空劫真常體浮生幻化軀箇中元不二無語對文殊軟熟羞盤饌芳辛實枕幃候晴先晒席占濕豫烘衣易粟雞皮皺難培鶴骨肥頭顱雖若此虛白自生輝數息憎晨凊伸睂愜晚晴隙塵浮日影窗穴嘯風聲捫蝨天機動驅蚊我相生偶然成一笑栩栩暫身輕貴仕龜鑽策間居馬脫鞿冠塵昏舊製帶眼剩新圍堆案書郵少登門刺字稀掩關灰木坐休示季咸機目眚浮珠珮聲塵籟玉簫秋懷潘鬢秃午夢楚魂銷注水瓶花醒吹薪藥鼎潮南柯何處是斜日上廊腰靜裏秋先到間中晝自長門闌疑泄柳尸祝漫庚桑腹巳枵經笥身猶試藥方強名今日愈勃窣負東牆汗漬笻枝赤苔封屐齒靑有醫延上坐無客抗分庭霽月鑽窗看鳴琴側枕聽莫嗔猿鶴怨岫幌兩年扃視絮勞羣從祗承愧闔家乳泉供水遞金液養丹芽加釀厚如酪旋舂香勝花百端扶老憊無物報投瓜學業荒呻畢歡悰隔笑鹽入秋先復幕過夏亦踈簾門客嗔愁思家人獻吉占尤憐小兒女時報鵲鳴簷贈臨江簡壽玉二首簡攜王仲顯使君書來謁并示孔毅甫夢蟾圖今廟堂五府皆有題字蕭灘逺客扣田廬貽我讀書樓上書千里故情元共月錯云多病故人踈卷中圖畫袖中珍上有三階五朵雲白日靑天光範路未饒蟾窟夢紛紜壽櫟前假山成移丹桂於馬城自嘲堂前趣就小嶙峋未許蹣􅘐杖屨親更遣移花三百里世間真有大癡人灼艾血忌詳涓日尻神謹避方艾求真伏道穴按古明堂謝去羣巫祝勝如幾藥湯起來成獨笑一病攪千忙東宫壽詩甲觀秋彌月前星蚤麗天君親重慶日家國中興年英武神機逺溫文德宇全摛章森典則會道極髙堅儉寶躬安履仁端性自然淵沖澄有量海潤浹無邊五學臨函丈三朝拱邃延頌聲敷政久喜色問安還銅律諧初度桑弧絶舊傳菊催重九近梅占小春先戲綵猗蘭殿宣杯玳瑁筵靑宫千億壽長對兩宫前十月朝開爐偶書余病歸二年未能拜掃松楸曩常以此日侍先兄遊洞庭并寫悲感之懷圃芋今年紫籬楓昨日丹開爐修故事聽雨説新寒橘社重遊阻楸行再拜難此時西望眼衰涕不勝彈有懷龔養正好在楚龔子秋來情話稀昨承書素説行侍板輿歸煙水潮平棹風霜歲晚衣幾時真訪戴莫待雪花霏白髭行四十踰四髭始黃手持漢節臨大荒輿疾歸來皮骨在兩鬢尚作靑絲光俯仰行年四十九萬里南馳復西走斑斑頷下點吳霜猶可芟夷誑賓友屈指如今又十年兩年憊卧秋風前人生血氣能幾許不待覽鏡知皤然長安後輩輕前輩百方染藥千金賣煩撋包裹夜不眠無奈霞頭出光怪病翁髙卧門長扃垂雪毶毶骨更淸兒童不作居士喚喚作堂中老壽星但能之提刑相別十年自曲江逺寄二詩敘舊良厚次韻為謝亦以首章奉懷略道湘南分攜故事末篇自述年來衰病不復故吾也憶昔驂鸞識俊英朱幡繡斧盡能名書隨庾嶺一枝寄句挾韶江九奏成吳粵交馳淸夜夢參辰不隔故人情何時重醉金槽曲一洗陽關別恨平濩落枵虛似瓠壺新添雪鬢與雙鬚也知病叟形容變非是仙儒骨相癯歲晚山林如自獻年豐田野亦多娛無端拙恙妨淸樂未許扁舟到五湖復以蟾硯歸龔養正夢裏何人歌式微覺來石友在書幃鄭環信美非吾寶趙璧猶全任汝歸渴水雙蟾窺海闊出雲孤月照星稀好將自草三千牘莫與蚍蜉作釣磯大雪書懷天將竒賞發淸歡疇昔登臨插羽翰梅下尋詩騎馬滑松梢索酒倚樓寒閉門老子愁無賴返棹歸來興巳闌聊掬玉塵添石鼎自煎魚眼破龍團雪中苦寒戲嘲二絶冥凌分職大間關辛苦行冬強作難費盡無邊風與雪劣能供得一番寒茸氊帳下玉杯寬香裏吹笙醉裏看風雪過門無入處却投窮巷覓袁安雪復大作六言四首竒寒擁被曉枕噩夢披蓑晚江遙想漫天匝地近聽穿幔鳴窗釀成送臘三白功在迎年九秋樵指擔肩相賀飯囊酒甕何憂初報折篁搶地旋聞壓柳堆橋寧教風過掀舞可惜雨來半銷伶俜凍雀蹲晚噤滲踈梅鎖春有客典衣沽酒何人增價賣薪立春乙巳綵勝金幡夢裏茶槽藥杵聲中索莫兩年春事小窗卧聽東風題徐熙風牡丹二首紫花蘂珠仙馭曉驂鸞道服朝元露未乾天半剛風如激箭緑綃飄蕩紫綃寒白花寒入仙裙粟玉肌舞餘全不耐風吹從教旅拒春無力細看腰支嫋嫋時題黃居宷雀竹圖二首居寀筌之子羣雀歲寒保聚兩鶉日晏忘歸草間豈無餘粒刮地風號雪飛蔓花露下凝碧叢竹秋來老蒼噪雀羣爭何事么禽自囀淸篁題張晞顔兩花圖二首晞顔廣漢人趙昌之甥繁杏紅粉團枝一萬重當年獨自費東風若為報答春無賴付與笙歌鼎沸中玉梨雪薄冰輕不耐春雨中愁緒月中真莫教夢作雲飛去留伴昭陽第一人題范道士二牛圖道士處州人號范牛中年狂顚人傳其得道此圖自稱中興道士范子珉蓋未顚時所作尤為精妙西疇滌場淨無塵原頭逺牧秋草春一牛疾行離其羣一牛返顧如怒嗔目光炯炯獰而馴點綴毫末俱逼真不顚不狂筆有神妙哉吾宗散仙人石湖居士詩集卷二十四
