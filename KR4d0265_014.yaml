  text: 石湖居士詩集卷十四
  hash: sha256:f8c3ce7a803af4e050c3cffcfa4c3eb7b44b2459edd50616193e286c241858db
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0265_SBCK_014-1a}
body:
  text: 晚春二首以下桂林作舊在乙稿靜極聞簷珮慵來愛枕幃隙虹飛永晝簾影碎斜暉燕踏花枝語蜂縈柳絮歸輕颸冝白紵時節近淸微好事憐春老無愁耐日長爐煙驚扇影酒面舞花光照水雲容懶移牀竹意涼更煩紅槿帽促拍打山香紅豆蔲花緑葉焦心展紅苞竹籜披貫珠垂寶珞剪綵倒鸞枝且入花欄品休論藥裹冝南方草木狀為爾首題詩偶題簷雨初乾團扇風夕陽芳樹緑蔥蔥蕉心榴萼俱無賴要與春衫相並紅次韻郭季勇機冝雪觀席上留別勝絶尊前萬事休縱非吾土且登樓山迎雨腳俄飛過風約江聲欲倒流野水漸堪添酒面夕陽依舊滿簾鈎憑闌從此遲歸鞅能及中秋對月不次韻許季韶通判雪觀席上把酒臨風瑞露傾瓊漿何用謁雲英捲簾雨腳銀絲挂倚杖江頭緑漲生嶺海一涼蘇暑病山林千籟試秋聲兹遊竒絶忘羈宦慚愧煙中短棹橫送周直夫教授歸永嘉靑燈相對話儒酸老去羈遊自鮮歡昨夜榕溪三寸雨今朝桂嶺十分寒知心海內向來少解手天涯良獨難一笑不須論聚散少焉吾亦跨歸鞍贈趙廉州馬羣雜沓草蒙茸刮目權竒一洗空天末也煩行李到歲寒聊得酒尊同梅花夜夜湘南雨榕葉年年海北風少待佳晴看山去玉篸髙插翠雲叢去年過弋陽訪趙恂道通判話西湖舊遊因題小詩近忽刻石寄來謾録紅塵寶馬碧湖船一夢如今費十年却照淸溪尋緑鬢但餘衰雪兩蕭然送唐彥博宰安豐兼寄呈淮西帥趙渭師郎中唐子皎自鮮水淸石鄰粼繡腸五車書不鄙簿領塵黟山與桂嶺一笑二十春天涯會面難歲晚情話真五管無賢侯但有嵐煙昏此豈功名場往戍淸淮濵北門詩書帥平生吾故人問訊今何如凌煙上星辰為言落南客病作寒螿呻飄飄北歸夢夜繞吳淞雲燕臺後盧橘一株冬前先開極香盧橘花殘細細飛滿枝晴日鬧蜂兒霜餘有此香無奈合與稱題賦小詩乾道癸巳臘後二日桂林大雪尺餘郡人云前此未省見也郭季勇機冝賦古風為賀次其韻憶昔北征秋遇雪穹廬苦寒不堪説飛花如席暗燕然把酒悲歌度佳節胡兒館客類西河鐍戶不容浮蟻泄當時巳分餐氊莩寧復夢遊炎嶺熱忽逐梅花行萬里又與故山輕話別天公恐我愁瘴霧十日號風吹石裂同雲乃肯度嚴關一夜玉峰髙􅏭嵲老榕蓊密最先縞稚竹枵虛時一折須知桂海接蓬灜滿目三山白銀闕不管樓髙翠袖單但嫌酒淺金杯凸東郭先生履雖敝詩情却鬭冰壺潔歸撚凍髭搜好句山館靑燈對明滅為憐叶氣到黃茅何止森森松柏恱豐年作守會飽暖羈宦思歸自愁絶豈無菊徑樂琴書亦有秫田供麴糵東岡雪後一犁春誰在陂頭憶調燮次韻陳仲思經屬西峰觀雪仙人灕江遊剪水馮夷宫賓友來鄒枚寒轡搖冬瓏起望天南陲玉沙滿長風越人來省識把酒酹層空從來嶠南北人謂將無同那知梁園霰飛入瑞露中幕府有淸士尋僧上西峰六花信姢巧未及五字工我亦滌冰硯課虛貴新功莫嗤兩臞儒毫端尚淸豐喜雪示桂人臘雪同雲嶺外稀南人北客盡冬衣從今老杜詩猶信梅片飛時雪也飛寄題商華叔心逺堂用卷中韻示我新詩卷知君遁俗情安流視巫峽灰劫笑昆明徽外夜絃語甕頭春蟻生藍橋即仙窟何況有雲英送郭季勇同年歸衡山天壤郭有道文獻今在兹啄喙家雞羣見子野鶴姿塵籠萬里心擇食中夜飢拙宦避捷徑瘴風吹鬢絲平生杏園友把酒天南陲何敢吏朱浮但喜見紫芝問君今何適舊圃餘荒畦提攜漢隂甕歲晚俱忘機勿開衡山雲恐驚隱淪棲定肯從君遊歲晚攀桂枝我亦理吳榜春湘緑蘋齊風蒲為誰落之子同襟期丁寧祝融峰將迎兩枯藜一望五千里共洗蠻煙悲甲午歲朝寓桂林記去年是日泊桐江謁嚴子陵祠迤邐度嶺感懷賦詩去年曉纜解江臯也把屠蘇泛濁醪一席飽風漁浦闊千山封雪釣臺髙將軍老矣鳴孤劒客子歸哉咏大刀早晚扁舟尋舊路柁樓吹笛破雲濤癸水亭落成示坐客長老之記曰癸水繞東城永不見刀兵余作亭於水上其詳具記中天將福地鞏嚴城形勝山川表裏明舊説桂林無瘴氣今知灕水辟刀兵雲深銅柱邊聲樂月冷珠池海面平願挽江流接河漢為君直北洗欃槍緩帶軒獨坐午日烘開豆蔲苞簷塵飛動雀爭巢蒙蒙困眼無安處間送爐煙到竹梢食罷書字甲子霖涔雨東南濕蟄風荔枝梅子緑豆蔲杏花紅捫腹蠻茶快扶頭老酒中荒隅經歲客土俗漸相通蠻茶出修仁大治頭風老酒數年酒南人珍之次韻平江韓子師侍郎見寄三首自古四愁湘水深誰將城郭啓山林有情碧嶂團欒繞無數朱樓縹眇臨蚺鼓揭天驚客坐象鍪航海厭蠻琛三千客路長安逺故舊書來直萬金南人以蚺蛇皮作腰鼓響徹異常交趾以象革為兜鍪皆異事靈泉杖屨浙江頭經濟長懷尚典州堂上讀書朝氣爽臺前呼月海光浮交情尺素勤雙鯉筆力枯松挽萬牛巳把三章翻樂府為君擊節變蠻謳子師新作小築於浙江號靈泉讀書堂呼月臺皆其處也前年衝雪過雙溪風帽泥韀騎吹隨爛醉依前逢錦瑟好音惟是欠黃鸝功名未試玉璜玦離別頻傾金屈巵疇昔北征煩吉夢南征合有夢歸時頃年北使時朝野多妄傳被留不歸子師家中人忽夢豫歸翌日過界報到故末句及之鶯鶯子師家善歌者前年過婺劵滿巳去冝齋雨中秀麥一番冷送梅三日霖緑肥新荔子紅浥舊蕉心映竹千絲舞垂簷一線斟終朝盤膝坐卑濕恐相侵次韻許季韶通判水鄉席上靑山緑浦竹間明倣佛苕溪好處行解愠風來如故舊催詩雨作要將迎休兵幕府烏鳶樂熟稻邊城鼓笛聲摹寫箇中須綵筆句成仍挾水雲淸水鄉酌別但能之主管能之將過石康南郭河橋市井喧緑荷香處有江天一簾梅雨爐煙外三疊陽關燭淚前馬耳西風君並海船頭北渚我歸田後期只恐參商似且醉金槽四十絃六月十五日夜泛西湖風月溫麗暮檥金龜潭追隨今夕涼波紋挾月影搖蕩舞船窗夜久四山髙松桂黯以蒼長煙界巖腹浮空餘劒鋩棹夫三弄笛跳魚翻素光我亦醉夢驚解纓濯滄浪多情芙蕖風嫋嫋吹鬢霜會心有竒賞天涯此何方淸潤不立塵空明滿生香過淸難久留俯俯墮渺茫燕堂書事歲稔齋鈴閴年深屋墍摧狸爭雷瓦過蟻化雨窗來盡日風常籟無時地不梅耳邊情話少笑口若為開酒邊二絶團扇香中嫋嫋風斷腸聲裏看羞紅不須過處催乾盞聽徹歌頭盞自空日長繡倦酒紅潮間束羅巾理六么新樣築毬花十八丁寧小玉慢吹簫枕上作繞枕蚊相聒翻釭鼠自忙早衰秋夢亂不寢曉更長賦擬騷人屈吟成病客莊安心無可覓隨處且為鄉思歸再用枕上韻老覺觸事懶病添歸計忙行年心巳化疇昔意空長五柳栗里宅百花錦城莊何時去檢校一棹水雲鄉李正之提點行至郴用豫忙字韻寄和答天涯逢我病秋晚送君忙感槩交情厚留連別恨長賓筵猶雪觀客路巳雲莊搖落郴江路應須憶醉鄉曉出北郊逼仄深巷中蔥蘢緑隂交山家不早起閉戶如藏逃濃露蛻蟬咽小風飢燕髙新渠厪涓流壞陂方怒號遐氓病瘠土不肯昏作勞滅裂復滅裂晚秧如牛毛空餘朝氣白浮浮濕弓刀官稱勸農使臨風首頻搔甘雨應祈三絶晚稻成苞未肯肥鵓鳩啼曉雨來時黃紬被冷初眠覺先向芭蕉葉上知數日雖蒙霡霂霑浥塵終恨太廉纎今朝健起巡簷看恰似廬山看水簾髙田一雨免飛埃上水綱船亦可催説與東江津吏道打量今晚漲痕來與鄭少融趙養民二使者訪古訾家洲歸憩松關二君欲助力興廢戲書此付長老善良以當疏頭飄飄竹雨潤輕裘嫋嫋松風繫小舟安得從容興廢手越人重上訾家洲淳熙甲午桂林鹿鳴燕輒賦小詩少見勸駕之意維南吾國最多儒聳看招招赴隴書竹實秋風辭穴鳳桃花春浪脫淵魚月宫移種新栽桂江水朝宗舊鑿渠況有狀頭坊井上明年應表第三閭郡人曹鄴及第詩云我到月宫收得種為君移向故園栽今歲用故事植桂正夏進德二堂之下又復朝宗古渠以應文章應舉之讖趙觀文王世則亦郡人皆魁天下故詩中悉及之逍遙樓席上贈張邦達教授張癸未省闈門生也同年進士俱會樓上者七人疇昔金門看選賢一星終矣半英躔誰憐蠻府淸池句不著南山捷徑鞭作者七人茅瘴地肅霜九月菊殘天浮生聚散如風雨同倚東樓豈偶然畫工李友直為余作冰天桂海二圖冰天畫使北虜渡黃河時桂海畫遊佛子巖道中也戲題許國無功浪著鞭天教飽識漢山川酒邊蠻舞花低帽夢裏胡笳雪沒韀收拾桑榆身老矣追隨萍梗意茫然明朝重上歸田奏更放岷江萬里船耳鳴戲題歷歷從何起泠泠與耳謀人言衰相現我以妄心求逺磬山房夜寒蜩隴樹秋圓通無別法但自此根修復作耳鳴二首至音豈寂透希夷珍重幽田為發揮妙用何關新卷葉圓通自有倒聞機夢中鼓響生千偈覺後春聲失百非寄語爵隂吞賊道玉牀安穩坐朱衣東極空歌下始靑西方寶網奏韶英不須路入兜元國自有音聞室筏城牛蟻誰知牀下鬭雞蠅任向夢中鳴如今却笑難陀種無耳何勞強聽聲碧虛席上得趙養民運使寄詩約今晚可歸次韻迓之偶攜尊酒上孱顔忽憶行人瘴霧間便好來分蒼石坐巳教不鎖翠雲關寒夜萬象閴無語一蛩吟獨譁肅肅月浸樹滿庭穠李花風從月中來吹我兩鬢華北斗聲回環南斗亦橫斜人生幾良夜吾行久天涯離居隔江漢何由寄疏麻甲午除夜猶在桂林念致一弟使虜今夕當宿燕山會同館兄弟南北萬里感悵成詩把酒新年一笑非鶺鴒原上巧相違墨濃雲瘴我猶住席大雪花君未歸萬里關山燈自照五更風雨夢如飛別離南北人誰免似此別離人亦稀乙未元日用前韻書懷今年五十矣浮生四十九俱非樓上行藏與願違縱有百年今過半別無三䇿但當歸定中久巳安心竟飽外何須食肉飛若使一丘并一壑還鄉曲調儘依稀儘乃俗字再用前韻時被命帥蜀休論今昨總皆非世味誠甘與我違蜀道雖如履平地杜鵑終勸不如歸三冬自苦坐毛穎一夢微官陪螱飛夜久南枝翻倦鵲茫茫月白衆星稀與同僚遊栖霞洞極深逺中有數路相傳有通九疑者燭將盡乃還飲碧虛上陳仲思用二華君韻賦詩即席和之竹杖芒鞋俗網踈每逢絶勝更踟蹰但隨岐路東西去莫計光隂大小餘倣佛桃源猶舞鳳辛勤李白謾騎魚今朝真作遊仙夢不似騷人賦子虛施元光在崑山病中逺寄長句次韻答之四海飄蓬客舍邊幾多雲水與風煙絶無膂力驅長轡空有孤忠誓大川參井忽隨征馬上斗牛應挂故山前親交情話知何許詩到天涯喜欲顚次韻趙養民碧虛坐上巳將山色染睂黛更挽江波添酒罍珍重江山勸人醉笑人驅馬惺惺回贛州明府楊同年挽歌詞二首拱璧溫無纇深蘭逺自芳淸班孤玉筍薄宦老銅章傳業麒麟子承家鴻鴈行門闌自簪笏吾獨憾堂堂憶昔龍門化曽容鴈塔陪逡巡九閏過迢遞一書來未報錯刀贈驚傳丹旐回辰陽隔江渚空些楚詞哀石湖居士詩集卷十四
