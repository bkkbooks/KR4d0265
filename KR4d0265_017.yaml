front:
  text: 石湖居士詩集卷十七
  hash: sha256:c69c7e44fdc074d02ca332435333282f57d461f9c42202aedfea105ab4479377
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0265_SBCK_017-1a}
body:
  text: 九月十九日衙散回留大將及幕屬飲淸心堂觀晚菊分韻得譟暮字暮字作樂府甲光射曽雲雨腳不敢到西山明古雪秋日一竿照先偏井絡密後拒參旗掉分弓滴博平鳴劒伊吾小君看天山箭狐兔何足了開邊吾豈敢自治有餘巧歸來翠帷卷聊共黃花笑雖無落帽風亦復接㒿倒餘間校筆陳刻燭龍蛇掃毛錐乃更勇我亦鼓旗譟冬至日銅壺閣落成走遍人間行路難異鄉風物雜悲歡三年北戶梅邊暖萬里西樓雪外寒巳辦鬢霜供歲籥仍拚髀肉了征鞍故園雲物知何似試上東樓直北看十二月十八日海雲賞山茶追趂新晴管物華馬蹄鬆快帽簷斜天南臘盡風晞雪冰下春來水潄沙巳報主林催市柳仍從掌故問山茶豐年自是歡聲沸更著牙前畫鼓撾雨後東郭排岸司申梅開方及三分戲書小絶令一面開燕雨入南枝玉蘂皴合江雲冷凍芳塵司花好事相邀勒不著笙歌不肯春鞭春微雨幡勝絲絲雨笙歌步步塵一年新樂事萬里未歸人雲薄竟慳雪酒濃先受春送寒東作近慚愧耦耕身緑萼梅朝罷東皇放玉鸞霜羅薄袖緑裙單貪看修竹忘歸路不管人間日暮寒玉茗花折得瑶華付與誰人間鉛粉弄粧遲直須逺寄驂鸞客鬢腳飄飄可一枝張正字母夫人朱氏挽詞蘋藻儀邦媛詩書了歲華籯金寧遺子羣玉竟傳家厚施心無斁浮生自有涯空餘報恩子三載亦苴麻十二月二十四日西樓觀雪一夜珠簾不下鈎徹明隨雪上西樓瑶池萬頃崑崙近玉壘千峰滴博收巳報春回南畝潤從教寒勒北枝愁四筵都為豐年醉録事何須校酒籌丙申元日安福寺禮塔成都一歲故事始於此士女大集拜塔下然香挂幡以禳兵火之災嶺梅蜀柳笑人忙歲歲椒盤各異方耳畔逢人無魯語蜀人鄉音極難解其為京洛音輒謂之虜語或是僭偽時以中國自居循習至今不改也既又諱之改作魯語尤可笑姑就用其字鬢邊隨我是吳霜新年後飲屠蘇酒故事先然窣堵香石筍新街好行樂與民同處且逢場余新甃石筍街初三日出東郊碑樓院故事祭東君因宴此院蜀人皆以是日拜掃逺柳新晴暝紫煙小江吹凍舞淸漣紅塵一鬨人歸後跕跕飢鳶蹙紙錢郊外閲驍騎剪柳亦曰槎柳千騎同瞻白羽揮驚塵一鬨響金鞿不知掣電彎弓過但覺柳梢隨箭飛初四日東郊觀麥苗去歲秋霖麥下遲臘殘一雪潤無泥相將飽喫滹沱飯來聽林間快活啼櫻桃花借暖衝寒不用媒勻朱勻粉最先來玉梅一見憐癡小教向傍邊自在開再出東郊晚景增年慣官身作客諳大都緣偶熟豈是性能堪昔者開三徑他時老一龕越溪親種竹藝緑想毿毿三月二日北門馬上新街如拭過鳴騶芍藥酴醿競滿頭十里珠簾都捲上少城風物似揚州上巳前一日學射山萬歲池故事北郊征路記前回三尺驚塵馬踏開新漲忽明多病眼好風如把及時杯靑黃麥壠平平去踈密榿林整整來遊騎不知都幾許長堤十里轉輕雷上巳日萬歲池上呈程詠之提刑濃春酒暖絳煙霏漲水天平雪浪遲緑岸翻鷗如北渚紅塵躍馬似西池麥苗剪剪嘗新麵梅子雙雙帶折枝試比長安水邊景只無飢客為題詩新作景亭程詠之提刑賦詩次其韻二首飛鴻銜子謾紛紛萬里西遊始識真不管吳霜微點鬢來看蜀錦爛爭春倚闌定有司花女秉燭仍留主夜神異縣賞心誰與共故人新作坐中賓小築聊鋤草棘荒遊人錯比召南棠花邊霧鬢風鬟滿酒畔雲衣月扇香燦爛吟箋煩索句淋漓醉墨自成行報章遲鈍吾衰矣終日冥搜謾七襄錦亭然燭觀海棠銀燭光中萬綺霞醉紅堆上缺蟾斜從今勝絶西園夜壓盡錦官城裏花寶相花誰把柔條夾砌栽壓枝萬朵一時開為君也著詩收拾題作西樓錦被堆三月二十三日海雲摸石勸耕亭上往來頻四海萍浮老病身亂插山茶猶昨夢重尋池石巳殘春驚心歲月東流水過眼人情一鬨塵賴有貽牟堪飽飯道逢田畯且睂伸四月十日出郊約束南風徹曉忙收雲捲雨一川涼漲江混混無聲緑熟麥騷騷有意黃吏卒逺時間信馬田園佳處忽思鄉鄰翁萬里應相念春晚不歸同插秧納涼雨洗新秋夜氣淸悴肌無汗葛衣輕畫簷分月下西壁絡緯飛來庭樹鳴西樓獨上竹日駐微暑松風生早秋間尋來處路獨倚靜中樓老景驅雙轂鄉心挽萬牛相隨木上坐腳底亦雲浮曉詣三井觀路轉市聲逺寬間古城東適從紅塵來忽入蒼煙叢槿心傾穠露芋葉翻微風秋陽淡籬落殘暑不必攻野老熟睡起日髙首如蓬官身騎官馬君應笑龍鍾曉起黠鼠緣鈴索飢鴉啄井欄不眠秋漏近多病曉屏寒咄咄渠何怪休休我自闌牙門朝日上簫鼓報平安舫齋晚憩心作萬緣起境生千劫忙誰同油幕靜獨對篆煙長有盡天魔力無窮海印光雨餘弦月上塵界本淸涼秋雨快晴靜勝堂席上一笑憧憧鴈鶩行簿書堆裏賦秋陽心如墜絮沾泥懶身似飛泉激石忙雨後蹲鴟先稻熟霜前浮蟻鬭棖香天涯節物遮愁眼且復隨鄉便入鄉新涼夜坐吏退焚香百慮空靜聞蟲響度簾櫳江頭一尺稻花雨窗外三更蕉葉風日日老添明鏡裏家家涼入短檠中簡編燈火平生事雪白眵昏奈此翁秋老四境雨巳沛然晚坐籌邊樓方議祈晴樓下忽有東界農民數十人訴山田却要雨須長吏致禱感之作詩歲晚羈懷有所思秋來病骨最先知鏡中公案巳甘老𥿄上課程休諱癡西堰頗聞江漲急東山猶説雨來遲錦城樂事知多少憂旱憂霖蹙盡睂西樓夜坐抗塵懷抱若為寬繞屋蛙聲亦在官巖桂無香秋遂晚江鱸有約歲將寒文書散亂嘲癡絶燈火淒淸語夜闌病倦百骸非復我但思禪板與蒲團立秋月夜巳放新涼入簟紋更驅餘溽避爐薰穿雲竹月時時見咽露莎蛩院院聞稍喜雪山無斥堠但虞煙驛有移文行藏且付蘧蘧夢明發還親鴈鶩羣前堂觀月箕踞繩牀政自豪逺遊何暇續離騷蕭森萬竹秋逾瘦突兀雙楠夜更髙東郭風喧三鼓市西城石洶二江濤色塵聲界如如現本自無禪不用逃有懷石湖舊隱浩蕩沙鷗久倦飛摧頽櫪馬不勝鞿官中風月常虛度夢裏關山或暫歸橘社十年霜欲飽鱸江一雨水應肥冷雲著地塘蒲晚誰為披蓑暖釣磯太平瑞聖花雪外捫參嶺煙中濯錦洲密攢文杏蘂髙結綵雲毬百世嘉名重三登瑞氣浮挽春同住夏看到火西流無題聞道明朝送舊官無情更鼓夜將闌此生見面知何日忍淚須臾子細看朝子西寄詩謝酒自言其家數有逝者詞意悲甚次韻解之且以建茶同往我讀朝子詩十語九慨傷長川日夜逝鬢髮空蒼浪君家出世學無生亦無亡鄉謂法幢立何乃稿木僵起滅不滿笑古來共楸行豈其揑目華解翳海印光我酒愧薄薄未能暖愁腸申以春風芽一瀹萬慮忘慧刀儻未割會且掀禪牀錦里有逢迎謹避舍蓋堂居然足音跫好在故意長啁耳念一洗遲君鳳鳴岡早衰不寐官事拘攣似力田作勞歸晚意茫然按摩合體俱非我展轉通宵似逺年一叟披衣惟兀坐羣兒得枕便佳眠人生元是華胥客休向迷塗更著鞭晚步宣華舊苑喬木如山廢苑西古溝踈水靜鳴池吏兵窸窣番更後樓閣崔嵬欲暝時有露冷螢猶照草無風驚雀自遷枝歸來更了程書債目眚昏花燭穗垂西樓秋晚樓前處處長秋苔俯仰璿杓又欲回殘暑巳隨梁燕去小春應為海棠來客愁天逺詩無託吏案山橫睡有媒晴日滿窗鳧鶩散巴童來按鴨爐灰明日分弓亭按閲再用西樓韻眼看白露點蒼苔歲月飛流首屢回老去讀書隨忘却醉中得句若飛來聞雞午夜猶能舞射雉西郊不用媒自笑支離聊復爾丹心元未十分灰丁酉重九藥市呈坐客余於南北西三方皆走萬里皆遇重九每作水調一闋燕山首句云萬里漢家使桂林云萬里漢都護成都云萬里橋邊客今歲倦遊甚矣不復更和前曲乃作此詩以自戲莫向登臨怨落暉自緣羈宦阻歸期年來厭把三邊酒此去休哦萬里詩烏帽不辭欹短髮黃花終是欠東籬若無合坐揮毫健誰解西風楚客悲會慶節大慈寺茶酒霜暉催曉五雲鮮萬國歡呼共一天淡淡暖紅旗轉日浮浮寒碧瓦收煙銜杯樂聖千秋節擊鼓迎冬大有年忽憶捧觴供玉座不知身在雪山邊冬至日天慶觀朝拜雲日晴麗遙想郊禋慶成作歡喜口號淅淅霜風不滿旗紫煙黃氣捧朝曦五更貫索埋光後萬里鈎陳放仗時留滯周南無舊事布宣漢德有新詩豐年四海皆溫飽願把歡心壽玉巵十一月十日海雲賞山茶門巷歡呼十里村臘前風物已知春兩年池上經行處萬里天邊未去人客鬢花身俱歲晚粧光酒色且時新海雲橋下溪如鏡休把冠巾照路塵海雲回按驍騎於城北原時有吐番出沒大渡河上古道風沙捲夕霏小江煙浪皺春漪天於麥壠猶慳雪人向梅梢大欠詩頓轡靑驪飛脫兔離弦白羽嘯寒鴟牙門列校俱剽鋭檄與河邊秃髮知合江亭隔江望瑶林莊梅盛開過江訪之馬上哦此何處春能早踈籬限激湍竹間煙雪迥馬上晚香寒喚渡聊相覓巡簷得細看極知微雨意未許日烘殘新作官梅莊移植大梅數十本繞之臘前催喚主林神玉樹飛來不動塵契闊西湖慚處士飄零東閣似詩人一天午夢空花碎滿地春愁月影新掃淨宣華藜藋徑他年誰記石湖濱丁酉正月二日東郊故事椒盤宿酒未全醒擾擾金鞍逐畫軿麥雨一犂隨處緑柳煙千縷幾時靑客愁舊歲連新歲歸路長亭間短亭萬里松楸雙淚墮風前安得諱飄零二月二十七日病後始能扶頭復幕重簾苦見遮暮占栖雀曉占鴉殘燈煮藥看成老細雨鳴鳩過盡花心為蚤衰元自化髮從無病巳先華更蒙厲鬼相提唱此去山林屬當家病中聞西園新花巳茂及竹徑皆成而海棠亦未過梅塢桃蹊斫竹初三旬髙卧信音踈春雖與病無交涉雨莫將花便破除只合蘧蘧隨夢去何須咄咄向空書頗聞蜀錦猶相待去歲今朝巳雪如枕上一枕經春似宿酲三衾投曉尚淒淸殘更未盡鴉先起虛幌無聲鼠自驚久病厭聞銅鼎沸不眠惟望紙窗明摧頽豈是功名具燒藥爐邊過此生初履地扶頭今日強冠篸餘燼收從百戰酣長脛閣軀如瘦鶴衝風奪氣似枯柟客來慵抆懶殘涕老去定同彌勒龕何處更能容結習任教花雨落毿毿密室憊坐如許頭顱莫振矜但尋曲几與枯藤餘生不直一彈指此病寧論三折肱何處丹房癡候火誰家籌室強傳燈本來識字耕夫耳今乃仍添百不能春晚初出西樓試倚枯藤似籋雲堂階微步小逡巡忽逢巖桂新抽葉屈指黃紬睡一春春晚卧病故事都廢聞西門種柳巳成而燕宫海棠亦爛熳矣軒窗深窈似禪房竟日虛明裊斷香詩債無邊春巳老睡魔有約晝初長市橋煙雨應官柳墟苑池臺自海棠遊騎行歌莫相笑遨頭六結巳龜藏病起初見賓僚時上疏丐祠未報浪將冠服衣猿狙因病偷間稍自如時有好懷誇得句略無情語怕回書邊城晏閉稀傳箭村巷春遊未荷鋤逮此良辰公事少天恩儻許賦歸歟陸務觀云春初多雨近方晴碧雞坊海棠全未及去年遲日溫風護海棠十分顔色醉春粧天公巳許晴教好説與鳴鳩一任忙報事碧雞坊裏來今年花少似前回笙簧冷落遨頭病不著梁州打不開淸明日試新火作牡丹會蜀人以洛中千葉種為京花單葉為川花再鑽巴火尚浮家去國年多客路賖那得靑煙穿御柳且將銀燭照京花香鬟半醉斜枝重病眼全昏瘴霧遮錦地繡天春不散任教簷雨捲泥沙三月十九日夜極冷誰勒餘寒不放回春深猶暖地爐灰鄉心忽向燈前動夜雨先從竹裏來鶗鴂巳如鶯百囀酴醿那復雪千堆調糜煮藥東風老慚愧茶甌與酒杯垂絲海棠春工葉葉與絲絲怕日嫌風不自持曉鏡為誰粧未辦沁痕猶有淚胭脂浣花戲題爭標者凌波一劇便捐生得失何曽較重輕蝸角虛名人尚愛錦標安得笑渠爭鹿鳴宴岷峨鍾秀蜀多珍坐上儒先更逸羣墨沼不憂經覆瓿琴臺重有賦凌雲文章小技聊干祿道學初心擬致君富貴功名今發軔願看稽古䇿髙勳陸務觀作春愁曲悲甚作詩反之東風本是繁華主天地元無著愁處詩人多事惹間情間門自造愁如許病翁老矣癡復頑風前一笑春無邊糟牀夜鳴如落泉一杯正與人相關種竹了題愛山亭灑掃宣華舍此君煙中月下緑生塵他年葉葉淸風滿莫忘今年借宅人題錦亭手開花徑錦成窠浩蕩春風載酒過來歲遊人應解笑甘棠終少海棠多石湖居士詩集卷十七
