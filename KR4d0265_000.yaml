front:
  text: 序豫疇昔之晨與客坐堂上遙見一健步黃衣負一笈至庭下呼而諏其奚自曰自參政公范氏也發其笈公之文集在焉索其書讀之則公之子莘叩頭請曰莘不天不自霣越而先公一夕奄忽棄其孤莘欲死而不敢者有先公付託之重任在方先公之疾而未病也日夜手編其詩文數年成集凡若干卷逮將易簀執莘手而授之且曰吾集不可以無序篇有序篇非序篇寧無序篇也今四海文字之友惟江西楊誠齋與吾好且我知微斯人疇可以屬斯事小子識之若莘則何敢請而先公之治命不敢墜惟先生哀而諾之豫執書抱遺編而泣曰萬里與公同年進士也公先進至為朝廷大臣與天子論道發政坐廟堂進退百官而萬里環堵荒寒之士也何敢與公友公不我薄陋而辱友之萬里不敢拒公亦不敢以執政俟公也今忍死丁寧之託其何敢辭初公以文學材氣受知壽皇自致大用至杖漢節使強虜即其庭伏穹廬不肯起袖出私書切責之君臣大驚有自階闥之嬖竊位樞臣者其勢方震赫公沮之竟不奉詔而去其所立又有不凡者矣若夫劌心於山水風月之場雕龍於言語文章之囿此吾輩羈窮酸寒無聊不平之音也公何必能此哉古語曰爭名者必於朝爭利者必於市是二人者使之以此易彼或以彼易此二人者其肯乎哉非不肯也不願也非不願也亦各樂其樂也詩人文士挾其所樂足以敵王公大人之所樂不啻也猶將愈之故王公大人無以傲夫士而士亦無所折於王公大人今公乃自屏其所可樂而復力爭夫士之所甚樂所謂不虞君之涉吾地者其不多取乎然公之詩文非能工也不能不工耳公風神英邁意氣傾倒拔新領異之談登峰造極之理蕭然如晉宋間人物他人戛戛吃吃而不能出諸口者公矉呻噫欠之間猝然談笑而道之則其詩文之工豈十日一水五日一石之謂也哉甚矣文之難也長於臺閣之體者或短於山林之味諧於時世之嗜者或漓於古雅之風箋奏與記序異曲五七與千百不同調非文之難兼之者難也至於公訓誥具西漢之爾雅賦篇有杜牧之之刻深騷詞得楚人之幽婉序山水則柳子厚傳任俠則太史遷至於詩大篇決流短章斂芒縟而不釀縮而不僒淸新嫵麗奄有鮑謝奔逸俊偉窮追太白求其隻字之陳陳一倡之嗚嗚而不可得也今海內詩人不過三四而公皆過之無不及者豫於詩豈敢以千里畏人者而於公獨斂袵焉於是文士詩人之難者易偏者兼矣其不盛矣乎嘻人琴今俱亡矣廣陵散今此聲遂絶矣惠子不生莊子不死復何道哉公之別墅曰石湖山水之勝東南絶境也壽皇嘗為書兩大字以揭之故號石湖居士云公諱成大字至能世為姑蘇人其世次言行職官則有少保大觀文大丞相益公周公之銘詩在紹熙五年六月十一日誠齋野客楊萬里謹序序石湖居士范公待制敷文閣來帥成都兼制置成都潼川利夔四道成都地大人衆事巳十倍他鎮而四道大抵皆帶蠻夷且北控秦隴所以臨制捍防一失其冝皆足致變故於呼吸顧盼之間以是幕府率窮日夜力理文書應期會而故時巨公大人亦或不得少休及公之至也定規模信命令施利惠農選將治兵未數月聲震四境歲復大登幕府益無事公時從其屬及四方之賓客飲酒賦詩公素以詩名一代故落紙墨未及燥士女萬人巳更傳誦被之樂府弦歌或題寫素屏團扇更相贈遺蓋自蜀置帥守以來未有也或曰公之自桂林入蜀也舟車鞍馬之間有詩百餘篇號西征小集尤雋偉蜀人未有見者盍請於公以傳屢請而公不可彌年乃僅得之於是相與刻之而屬遊為序淳熙三年上巳日朝奉郎成都府路安撫司參議官兼四川制置使司參議官山隂陸遊序宋史本傳范成大字致能吳郡人紹興二十四年擢進士第授戶曹監和劑局隆興元年遷正字纍遷著作佐郎除吏部郎官言者論其超躐罷奉祠起知處州陛對論力之所及者三曰日力曰國力曰天力今盡以虛文耗之上嘉納處民以爭役囂訟成大為創義役隨家貧富輸金買田助當役者甲乙論第至二十年民便之其後入奏言及此詔頒其法於諸路處多山田梁天監中詹南二司馬作通濟堰在松陽遂昌之間激漢水四十里溉田二十萬畝堰歲久壞成大訪故迹疊石築防置堤閼四十九所立水則上中下溉灌有序民食其利除禮部員外郎兼崇政殿説書乾道令以絹計贓估價輕而論罪重成大奏承平時絹匹不及千錢而估價過倍紹興初年遞增五分為錢三千足今絹實貴當倍時直上驚曰是陷民深文遂增為四千而刑輕矣隆興再講和失定受書之禮上嘗悔之遷成大起居郎假資政殿大學士充金祈請國信使圖書專求陵寢蓋泛使也上面諭受書事成大乞并載書中不從金迓使者慕成大名至求巾幘效之至燕山密章奏具言受書式懷之入初進國書詞氣慷慨金君臣方傾聽成大忽奏曰兩朝既為叔姪而受書禮未稱臣有疏搢笏出之金主大駭曰此豈獻書處耶左右以笏摽起之成大屹不動必欲書達既而歸館所金主遣伴使宣旨取奏成大之未起也金庭紛然太子欲殺成大越王止之竟得全節而歸除中書舍人初上書崔實政論賜輔臣成大奏曰御書政論意在飭綱紀振積敝而近日大理議刑遞加一等此非以嚴致平乃酷也上稱為知言張説除簽書樞密院事成大當制留詞頭七日不下又上疏言之説命竟寢知靜江府廣西窘匱專藉鹽利漕臣盡取之於是屬邑有增價抑配之敝詔復行鈔鹽漕司拘鈔錢均給所部而錢不時至成大入境曰利害有大於此乎奏疏謂能裁抑漕司強取之數以寬郡縣則科抑可禁止從之數年廣州鹽商上書乞復令客販宰相可其説成大出銀錢助之人多以為非下有司議卒不易成大説舊法馬以四尺三寸為限詔加至四寸以上成大謂互市四十年不宜驟改除敷文閣待制四川制置使疏言吐蕃靑羌兩犯黎州而結蕃列等尤桀黠輕視中國臣當教閲將兵外修堡寨仍講明教閲團結之法使人自為戰三者非財不可上賜度牒錢四十萬緡成大謂西南諸邊黎為要地增戰兵五千奏置都監路分吐蕃入寇之路十有八悉築柵分戍結擾安靜寨發飛山軍千人赴之料其三日必遁已而果然白水寨將王文才私娶蠻女常導之寇邊成大重賞檄羣蠻使相疑二俄禽文才以獻即斬之蜀北邊舊有義士三萬本民兵也監司郡守雜役之都統司又俾與大軍更戍成大力具其不可詔遵舊法蜀知名士孫松壽年六十餘樊漢廣甫五十九皆挂冠不仕表其節詔召之皆不起蜀士由是歸心凡人才可用者悉致幕下用所長不拘小節其傑然者露章薦之往往顯於朝位至二府召對除權吏部尚書拜參知政事兩月為言者所論奉祠起知明州奏罷海物之獻除端明殿學士尋帥金陵會歲旱奏移軍儲米二十萬賑飢民減租米五萬水賊徐五竊發號靜江大將軍捕而戮之以病請間進資政殿學士再領洞霄宫紹興二年加大學士四年薨成大素有文名尤工於詩上嘗命陳俊卿擇文士掌內制俊卿以成大及張震對自號石湖有石湖集攬轡録桂海虞衡集行於世石湖居士詩集目次
