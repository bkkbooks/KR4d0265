body:
  text: 嗣協迂客吳郡顧嗣臯漢魚重訂嗣立俠君卷一詩四十六首卷二詩五十四首卷三詩六十三首卷四詩六十七首卷五詩五十一首卷六詩四十三首卷七詩四十九首卷八詩五十二首卷九詩五十一首卷十詩五十九首卷十一詩六十五首卷十二詩七十二首卷十三詩四十四首卷十四詩五十四首卷十五詩六十九首卷十六詩六十五首卷十七詩六十九首卷十八詩六十首卷十九詩五十二首卷二十詩八十四首卷二十一詩六十首卷二十二詩四十二首卷二十三詩七十二首卷二十四詩七十首卷二十五詩六十三首卷二十六詩五十六首卷二十七詩七十九首卷二十八詩七十五首卷二十九詩五十首卷三十詩三十三首卷三十一詩五十一首卷三十二詩五十七首卷三十三詩三十九首卷三十四嗣出賦六首楚辭四首卷三十五嗣出詞石湖詩集三十三卷凡古今各體詩一千九百一十六首范文穆公手自編定宋嘉泰間其子莘等刻以行世合詩文凡百有三十卷明時曽巳重刻而流傳頗少又有活板印本殘闕甚多今藏書家多有抄本而訛舛異同魯魚錯出吾友金子亦陶所藏從宋板抄得更為廣集諸家較勘精密可稱善本兹先刻其詩集以公諸同好卷帙前後悉依原本所編其間訛字如井垔木刊之誤垔為堊弚靡波流之誤弚為弟皆略為改正所有一二漶漫之處無從辨證姑闕之以俟考外附賦楚辭一卷樂府一卷賦本在詩前今附於詩後者集以詩名從其類也嗟乎自文穆公至今四百有餘年矣而詩篇在是聲光爛然亦可以見吳下之風流其淵源至今弗絶也康熙戊辰八月中秋前一日依園主人謹識石湖居士詩集目次終
