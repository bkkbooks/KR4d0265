front:
  text: 石湖居士詩集卷一
  hash: sha256:9109e383f68f3c79188c7206150a6e74838ba413ffdaf827f88fe036f95b3d33
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0265_SBCK_001-1a}
body:
  text: 嗣協迂客吳郡顧嗣臯漢魚重訂嗣立俠君行路難贈君以丹棘忘憂之草靑棠合歡之花馬腦遊仙之夢枕龍綜辟寒之寶紗天河未翻月未落夜長如年引春酌昔人安在空城郭今夕不飲何時樂西江有單鵠行西江有單鵠託身萬里雲猥為稻粱謀墮此鷗鷺羣朝遊楓葉杪暮宿蘆花根懷安浦漵暖忘記雲海寬忽有孤征鴻驚飛落江濵眼明見黃鵠解后傾情真羽毛雖不同意氣頗相親言鵠有六翮何不髙飛翾水鳥不足羣朝暮徒嘲喧相將乘風去一上盤秋旻渴飲皓露滋飢吸晴霞暾方知翅翎俊可以凌埃塵東風昨解凍春光暖如薰陽鳥當北鄉行止倐巳分儻欲相逐去關山隔吳秦兩鳥竟分飛鳴聲動行人豈不有歲晚鴻當復來賔但愁山海闊岐路多糾紛復來失故道那得相知聞鴻歸有儔侶鵠住長悲辛車遙遙篇車遙遙馬憧憧君遊東山東復東安得奮飛逐西風願我如星君如月夜夜流光相皎潔月暫晦星常明留明待月復三五共盈盈放魚行水落塘枯魚臥陸小兒抱取不濡足昂藏赤鯶亦垂頭背負玄鱗三十六家人滌砧不辭勞云有素書金錯刀嗟豫贖放豈徼福忍把汝命供吾叨如今巳脫張胡子好上龍門飲湖水不然崛起載飛仙切莫顚狂稱長史晚步東郊水墨依林寺靑黃負郭田斜陽猶滿地片月早中天䇿䇿鴉飛急冥冥樹影圎西山元自好那更著雲煙元夜憶羣從愁裏仍蒿徑閒中更蓽門靑燈聊自照濁酒為誰溫隙月知無夢窗梅寄斷魂遙憐好兄弟飄泊兩江村登西樓少年豪氣合摧鋒靑鬢朱顔萬事慵疇昔四愁無夢到及時一笑有誰供詩情飲興如雲薄草色花光似酒醲千里春心吟不盡下樓分付晚煙鐘不寐南風釀卑濕滑滑病履舄竟日隱几坐拳局不得適丹田恍澒洞銀海眩眵黑髀弱類跨鞍臂強如運甓合體競酸嘶莫夜輒增極奏牀不得眠耿耿到明發黃妳共住久來夢乃其職睡魔吾故人曩是不速客招呼各偃蹇莫效尺寸力周公無由來咫尺今古隔彭尸不得去罡騎無行色主客兩愁緒虛室浪生白人言老禪師兩脅不到席兹事恐未暇但願了今夕平生北窗眠栩栩即聖域睡仙吾所慕行步亦鼾息河豚歎鯫生藜萈腸食事一飽足腥腐色所難況乃衷鴆毒彭亨強名魚殺氣孕慘黷既非養生具冝謝砧几酷吳儂真差事網索不遺育捐生決下箸縮手汗童僕朝來里中子饞吻不待熟濃睡喚不譍巳落新鬼録百年三寸咽水陸富肴䔩一物不登爼未負將軍腹為口忘計身叨死何足哭作俑者誰與至今走末俗或云先王意除惡如萟菽逆梟與毒獍歲歲參幣玉芟夷入薦羞蓋欲殱種族生死有定數斷命烏可續適丁是時者未易一理局黿鼎子公怒羊羹華元䘐異味古所珍無事苦畏縮駢頭訌此語戒諭袛取瀆聾盲死不悟明知諒巳燭續長恨歌七首金杯㶑灔曉粧寒國色天香勝牡丹白鳳詔書來巳暮六宫鉛粉半春闌紫薇金屋閉春陽石竹山花却自芳莫道故情無覓處領巾猶有隔生香聞道蓬壺重見時瘦來全不耐風吹無端却作塵間念巳被仙官聖得知別後相思夢亦難東虛雲路海漫漫仙凡頓隔銀屏影不似當時取次看人似飛花去不歸蘭昌宫殿幾斜暉百年只有雲容姊留得當時舊舞衣驪山六十二髙樓突兀華淸最上頭玉羽川長湘浦暗三郎無事更神遊帝鄉雲馭若為留八景三淸好在不玉笛不隨雙鶴去人間猶得聽梁州雷雨鄰舍起龍雨工避事欲蟠泥帝遣豐隆執以歸連鼓一聲人失箸不知挂壁幾梭飛次韻唐致逺雨後喜凉老陽作氣再三衰鼓竭之餘不支雨搴旗拔幟掃迹空一點新凉破殘暑飛蚊薨薨巳無竒蜻蜓翅淨摩天嬉竹窗日暮轉蕭瑟喜有促織鳴聲悲秋日二絶碧蘆靑柳不冝霜染作滄洲一帶黃莫把江山誇北客冷雲寒水更荒凉新秋病骨頓成衰不度溪橋半月來無事閉門非左計饒渠屐齒上靑苔窗前木芙蓉辛苦孤花破小寒花心應似客心酸更憑靑女留連得未作愁紅怨緑看嘲里人新婚冷艷頩容一笑開休將鸞扇更徘徊箜篌細寫歸舟字倣佛遊仙夢裏來過松江長虹斗起蛟龍穴朱碧欄干夜明滅太湖三萬六千頃多少淸風與明月靑鷁驚飛白鷺閒丹楓未老黃蘆折誰將橫笛呌蒼煙無限驚波翻白雪洞庭林屋舊遊處玉柱金庭路巉絶水仙逢迎摻修袂問我歸計何當決去年匹馬兀春寒今此孤篷窘秋熱人生意氣得失間輕重劒頭吹一吷莫將塵土涴朱顔却待丹砂回白髮過平望寸碧闖髙浪孤墟明夕陽水柳搖病緑霜蒲蘸新黃孤嶼乍舉網蒼煙忽鳴榔波明荇葉顫風熟蘋花香雞犬各村落蓴鱸近江鄉野寺對客起樓隂濯滄浪古來離別地淸詩斷人腸亭前舊時水還照兩鴛鴦長安閘斗門貯淨練懸板淙驚雷黃沙古岸轉白屋飛檐開是間袤丈許舳艫蔽川來千車擁孤隧萬馬盤一壞篙尾亂若雨檣竿束如堆摧摧勢排軋洶洶聲喧豗逼仄復逼仄誰肯少徘徊傳呼津吏至弊蓋凌髙埃囁嚅議譏征呌怒不可裁吾觀舟中子一一皆可哀大為聲利驅小者飢寒催古今共來往所得隨飛灰我乃畸於人胡為乎來哉榮木并序卧病十日緑隂滿庭因誦淵明榮木詩其序曰日月推遷巳復有夏總角聞道白首無成犁然有感乃和其韻薰風南來木榮於兹木榮幾時黃落從之逝其須臾坐成四時今我不學殆其巳而天旋地遊日月其根形息氣徂不亡者存去鄉離家莫肯過門猗歟先師不我疵陋褰衣示珠俾我復舊自我來歸十年不富孰蠧孰蠱惟汝自疚冉冉榮木霜華將墜天黑路長屹蹶可畏隸也不力奚取六驥脂車著鞭一息而至兩木并序壬申五月卧病北窗惟庭柯相對手植緑橘枇杷森然出屋枇杷巳著子橘獨十年不花各賦一詩枇杷昔所嗜不問甘與酸黃泥裹餘核散擲籬落間春風拆勾萌朴􅈪如榛菅一株獨成長蒼然齊屋山去年小試花瓏瓏犯冰寒化成黃金彈同登桃李盤大鈞播羣物斡旋不作難樹老人何堪挽鏡覓朱顔頷髭爾許長大笑欹巾冠緑橘生西山得自髯翁家云此接活根是歲當著花俯仰乃十霜垂蠧紛相遮芳意竟寂莫枯枝謾槎牙風土諒非冝翁言豈豫夸會令返故山髙深謝汙邪石液滋舊根山英擢新葩黃團挂霜實大如崆峒瓜當有四老人來駐七香車道中月冷吟蛩草湖平宿鷺沙客愁無錦字鄉信有燈花蹤跡隨風葉程途犯斗槎君看枝上鵲薄暮亦還家落鴻落鴻聲裏怨關山淚濕秋衣不肯乾只道一番新雨過誰知雙袖倚樓寒題山水橫看二首煙山漠漠水漫漫老柳知秋渡口寒盡是西溪腸斷處憑君將與故人看霜入丹楓白葦林橫煙平逺暮江深君看鴈落帆飛處知我秋風故國心瑞香花萬粒叢芳破雪殘曲房深院閉春寒紫紫靑靑雲錦被百叠薰籠晚不翻酒惡休拈花蘂嗅花氣醉人醲勝酒大將香供惱幽禪恰在蘭枯梅落後讀史登壇䇿劉項卧廬料曹孫探懷取事業一一如印圈英豪蓋天資八極入控摶由來事成毁只繫手覆翻玉虹朝貫日劒氣夜燭天雖欲避功名何處蟄龍鸞我生後千載愚暗難具言長大但食粟閔凶不能文麥豆巳難辨楣梲固不分抱瓮灌圃畦截竿避城門智略類如此何以超籬籓龜刳始神策木斷方犧尊朝市有機穽冠裳或鉗髠兹事定不吾其老泥蟠敢云善用短聊復強自寬浙江小磯春日客裏無人共一杯故園桃李為誰開春潮不管天涯恨更捲西興暮雨來代聖集贈別一曲悲歌水倒流尊前何計緩千憂事如夢斷無尋處人似春歸挽不留草色粘天鶗鴂恨雨聲連曉鷓鴣愁迢迢緑浦帆飛逺今夜新晴獨倚樓二月三日登樓有懷金陵宣城諸友百尺西樓十二欄日遲花影對人閒春風巳入片時夢寒食從今數日間折柳故情多望斷落梅新曲與愁關詩成欲訪江南便千里煙波萬叠山寒食郊行書事二首野店垂楊步荒祠苦竹叢鷺窺蘆箔水烏啄紙錢風媪引濃粧女兒扶爛醉翁深村時節好應為去年豐隴麥欣欣緑山桃寂寂紅帆邊漁蕝浪木末酒旗風信步隨芳草迷途問小童賞心添腳力呼渡過溪東初夏二首淸晨出郭更登臺不見餘春只麼回桑葉露枝𧖟向老菜花成莢蝶猶來晴絲千尺挽韶光百舌無聲燕子忙永日屋頭槐影暗微風扇裏麥花香夏夜脉脉惜佳夜泠泠成浩歌儻無詩句子將奈月明何露氣濛花重風聲入樹多淸歡殊未辦桂影墮江波與時敘現老納凉池上時敘誦新詞甚工會心不在逺頃步便得之長風吹月來淸影落半池屋頭見木葉玲瓏剪琉璃紅塵絆兩足大笑兒輩癡老禪挽我遊髙論方軒眉潘郎忽鼎來談詩解人頤晚誦雲髻篇濯濯餘春姿想見篇中人淸潤如君詩笑我兩枯木獨與三冬期林元復挽詩胸次崢嶸滿貯書十年名字滿江湖張公閲世詩千首楊子傳家宅一區謾道春風須得意那知秋雨不成珠自從雪魄氷魂散魯國今誰更服儒戲贈少梁屈膝銅鋪晝掩關薰爐誰伴夕香寒秋來合有相思字會待風前片葉看南徐道中以下赴金陵漕試作生憎行路與心違又逐孤帆擘浪飛吳岫湧雲穿望眼楚江浮月冷征衣長歌悲似垂垂淚短夢紛如草草歸若有一廛供閉戶肯將篾舫換柴扉石湖居士詩集卷一
