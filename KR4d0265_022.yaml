front:
  text: 石湖居士詩集卷二十二
  hash: sha256:f362060c5db4666a4e9930154f33d32ef5a7a36360c489ca8be4587a849fd1c2
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0265_SBCK_022-1a}
body:
  text: 送江朝宗歸括蒼半生三解后相看成老翁詩情故崒嵂袖有天都峰江山佳麗地登臨苦匆匆塔燈落淮水寺樓倚霜空攟拾著錦囊撫掌夸窮工歸轡不可挽思入孤征鴻洞天我昔遊俯仰星一終士友歎契闊吏民念罷癃婆娑故將軍白髮簿書叢足趼雖四方夢寐煙雨東歸田有腳力尚往尋行蹤期君斬寒藤伴我搘枯笻鍾山閣上望雨天闊山長雨似煙忽然飛去暗平川粳禾未實秈禾瘦不用廉纎便霈然除夜婪尾杯殘雪滿簪牀頭曆日費光隂故山巧入忙中夢新歲尤關客裏心烏鵲倦時三匝繞鷦鷯穩處一枝深勞生佚老尋常事從政那堪力不任元日老來百味絮沾泥期會關身尚火馳幾夜鄉心欹枕處今年腳力上樓時酒缸幸有乾坤大丹鼎何憂日月遲莫道神仙無可學學仙猶勝簿書癡體中不佳偶書生平人比似維摩試比尫孱不啻過舊摘衰髯今雪遍頻揩病眼轉花多從來世味聊復爾此去官身如老何收拾頽齡加藥餌尚堪風月對婆娑坐嘯齋書懷時方治賑濟老來窮苦事相違兀坐鈴齋竟日癡眼目昏緣多押字胸襟俗為少吟詩月侵燈影吏方去春遍梅梢官未知直待食新方綬帶明朝騎馬過陵陂寶公祈雨感應用陳申公韻賦詩為謝膴原龜坼暮春時夾路爐薰共禱祠喚起雲頭千嶂湧飛來雨腳萬絲垂無情梅塢猶紅綻有意秧田盡緑滋大施門開須滿願願均此施匝天涯送徐叔智運使奉祠歸吳中手種湖邊花百畝東風日夜催歸去當年辛苦種花時不道白頭猶未歸君如肯過城南陌但向水雲紅處覓煩呼猿鶴問平安當有畦丁解看客我今江船亦欲東楫迎楓橋成兩翁壓枝萬朵雖過盡尚及巢龜蓮葉中送舉老歸廬山二千里往回似夢四十年今昔如浮去矣莫久留桑下歸歟來共煨芋頭題現老真三十年來共葛藤如今蓮社冷如冰茶瓜櫻筍遊山會從此齋厨欠一僧致一齋述事文書煙海困浮沉不覺盤􅘐百病侵偶問客年驚我老忽聞鶯語歎春深今朝麥粒黃堪麵幾日秧田緑似針除却一犁春雨足眼前無物可關心次韻楊同年祕監見寄二首瘴雲嵐雨幾時歸應把周南視九夷舊説鬼神驚落筆新傳狐兔駭搴旗韶江石老簫音在庾嶺梅殘驛使遲自古朱絃淸廟具莫貪鵬海看天池吾衰長愧接輿狂忙裏何心領燕香塵土簿書憎鐵研水雲蓑笠傲金章論文無伴法孤起訪舊有情書數行何日却同湖上醉露幃宵幄為君張曉起信筆午枕汗如洗曉櫛氣稍蘇莎蛩試風露滿意鳴相呼倦客感節物流光不躊躇秋聲巳如許殘暑何足驅人言今歲熱迥與常歲殊此理恐未然豈不知頭顱年年有三伏日日非故吾婆娑今尚可後當彌不如病骨須一涼未暇惜居諸坐來有淸思西風搖井梧送曽原伯運使歸會稽用送徐叔智韻秧田水滿麥棲畝勸農使者翩然去去年愁苦救荒時豈敢夢為今日歸天津橋西官柳陌文書燈火長相覓江山信美不留人寂寞回潮工送客鏡湖一曲浙河東萬頃太湖蓑笠翁願賡四愁作五詠我所思兮思剡中王南卿母挽詞櫛縰稱純孝笄珈蚤隱憂病中心巳化身外世如浮聞道悲風木誰能駐壑舟佳兒行古道足以賁潛幽次韻鄭校書參議留別年豐方共慶歲晚客他之吏事朝還暮人生合復離江山殘夢破風月片帆移後會吾衰矣桑榆一繭絲重九賞心亭登髙憶隨書劒此徘徊投老雙旌重把杯緑鬢風前無幾在黃花雨後不多開豐年江隴靑黃遍落日淮山紫翠來飲罷此身猶是客鄉心却附晚潮回寄題王仲顯讀書樓嗜書如嗜酒知味乃篤好欲辨巳忘言不為醒者道使君靑箱家文史􅋔懷抱平生名教樂雙旌不滿笑忽乘雪溪興來檥秦淮棹丘亭客漂泊夜夜短檠照人云太癡絶我自斫輪妙今朝檣竿起昨夢繞閣皂云有百尺樓歸寄北窗傲滴露紬朱黃拂塵靜緗縹想當呻畢時寧復羡騰趠古心千載事俗眼詎能料蕭灘富還往取友必同調一張復一弛釀秫助歌嘯菊樓金陵出一種菊甚髙園丁結成樓塔或至一二丈東籬秋色照踈蕪挽結髙花不用扶淨洗西風塵土面來看金碧萬浮圖北門覆舟山道中苒苒霜風掠弊貂簿書塵外訪漁樵林煙色淡如濛雨塘水痕深似落潮鴈字江天聞塞管梅梢山路欠溪橋騎驢索句當年事歲暮騷人不自聊送郭明復寺丞守蜀州士進固未易退亦良獨難西州多故人歸路常險艱有道獨行意郭舟若神仙勿輕銀兔符傾倒金貂蟬唐安君昔遊百萬蠲逋錢我亦常客夢醉歌采菱船父老尚相記况君有前緣想見東西湖恩波漲春瀾此地著經濟紗籠相後先潭潭相業堂新題我所刊政為來者地君行豈偶然去去進明德後日五四賢元日謁鍾山寶公塔雪後江臯未放春老來猶駕兩朱輪歸心歷歷來時路官事驅驅病裏身未暇雞窠尋古佛且防鶴帳怨山人君看王謝墩邊地今古功名一窖塵元日馬上二絶泥絮心情雪樣髯詩囊羞澀酒杯嫌年來萬事都消減惟有牀頭曆日添筋骸全比去年非騎吹聲中憶釣磯待得江風欺老病何如間健一蓑歸春晚荒園蕭瑟懶追隨舞燕啼鶯各自私窗下日長多得睡尊前花老不供詩吾衰久矣雙蓬鬢歸去來兮一釣絲想見籬東春漲動小舟無伴柳絲垂北窗偶書呈王仲顯南卿二友官居故逼仄北窗誰所開胡牀憩午暑簾影久徘徊髙槐忽低昻知有好風來須臾墮几席篆香小飛灰病翁亦披襟月露􅋔竒懷壠頭暴背耘永晝婦子偕不辭夢山裂田水如潑醅去年豈堪説稻根巳浮埃使君坐侯宅窗間即涼臺何敢訴苦熱灑然助心齋中秋淸暉閣靜坐因思前二年石湖四明賞月前年銀界接天迷去歲金盤湧海低漂泊相逢重一笑秦淮東畔女牆西玉麟堂會諸司觀牡丹酴醿三絶東風微峭護餘春紅紫香中酒自溫不用忙催銀燭上酴醿如雪照黃昏洛園姚魏碧雲愁風物江東亦上遊憶起遨頭八年夢彭州花檻滿西樓莫向花前惜酒杯一年一度有花開浮生滿百今強半歲歲看花得幾回重九獨坐玉麟堂江上西風動所思又將淸賞負東籬年年客路黃花酒日日鄉心白鴈詩籠月秦淮無舊曲馳煙鍾阜有新移人生笑口真稀闊況值官忙閔雨時次韻舉老見嘲未歸石湖半世吟客舍柳長年憶後園花為報廬山莫笑雲丘今屬誰家次韻曽仲躬侍郎同登伏龜二絶帶束江淮翠岫圍掌窺臺殿碧鱗差劉郎句裏登臨眼壓倒三江二水詩古來遊客謾西東領會誰如我與公露坐繩牀天不盡絶勝簾雨棟雲中題李雲叟畫軸兼寄江安楊簡卿明府二絶蒼煙枯木共荒寒籬落堤灣洶漲湍歸路宛然歸未得間將李叟畫圖看新圖來自雪邊州皴石枯槎筆最遒明府能詩如此畫為渠題作小營丘晨出蔣山道中霜痕如雨沁東郊樂歲家家一把茅故國丘陵多麥壠新晴籬落有梅梢小山何在應招隱北嶺如今巳獻嘲歸計未成聊琢玉飄颻風袖作推𫾣有感今昔二首陽春白雪雅音希俚耳冬烘輒笑嗤麋見麗姬翻決驟鳥聞韶樂却憂悲爛奚輕薄人何敢伏獵荒唐自不知蚓竅蠅鳴莫嘲誚彭亨菌蠢正當時飄風驟雨謾驚春掃蕩何煩臂屈伸天識不衷宜不恕神歆非類即非仁休讎地下枯魚骨且鬭尊前健犢身靜看可憐還可笑香山寧是幸災人種竹歎向在成都種竹滿西園偶苦寒疾朅來金陵復種繞池未幾以眩卧閣家人子遂謂不當種竹其説甚可怪歎口占此詩宣華種萬竿寒疾適相值玉麟種千竿偶復須藥餌僮奴狃今昨競道竹相祟如將聖作狂似以儒為戲此君來聲寃林神亦短氣我夢不平鳴霍然推枕起明當還石湖賸種千畝地未論比封君且用執讒喙公退書懷昨者騰章奏發倉今兹飛檄議驅蝗四無告者僅一飽七不堪中仍百忙皎日自能臨俯仰浮雲寧解制行藏求田問舍亦何有歲晚倦遊思故鄉石湖居士詩集卷二十二
