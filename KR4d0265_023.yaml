front:
  text: 石湖居士詩集卷二十三
  hash: sha256:aa3112c907822cc5438d29b8b24e0a70279ef28cb6e3e95e1b6249976966b6f0
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0265_SBCK_023-1a}
body:
  text: 初秋二首急雨過窗紙新凉生簟藤蹣􅘐老鈴下來炷壁間燈壯歲故多病老年知不堪何須看公案只此是真參蝙蝠伏翼昏飛急營營定苦飢聚蚊充口腹生汝亦奚為蛩壁下秋蟲語一蛩鳴獨雄自然遭跡捕窘束入雕龍四花素馨間末利木犀和玉簪醫來都屏去頭眩怕香侵謝範老問病三椽一席度秋冬造化兒嬉困此翁帖有王書難治眩文如陳檄不驅風骨枯似枿膚如臘髮織成氊鬢作蓬點檢病身還一笑本來四大滿虛空二偈呈似壽老法法剎那無住云何見在去來若覓三心不見便從不見打開孟說所過者化莊云相代乎前何處安身立命飢餐渴飲困眠諾惺菴枕上噩夢驚回曉枕寒靑燈猶照藥爐邊紙窗弄色如朧月又了浮生一夜眠癸卯除夜聊復爾齊偶題五夜燈花重東風角韻來雪慳衣未纊春早句多梅寂歷羅門亞溫黁藥鼎煨老嫌新歲換病喜舊星回鬱壘先題版屠蘇後把杯書扉無健筆爆竹有寒灰餳楪牙難膠椒盤眼倦開陳人仍憊卧身世兩悠哉甲辰人日病中吟六言六首以自嘲攢睂輒作山字啾耳惟聞水聲人應見憐久病我亦自厭餘生日慌慌蟻旋磨頭岑岑鼇負山筆牀久巳均伏藥鼎何時丐閒政爾榮枯衛澀剛云人厄天窮歸咎四衝臨歲乞憐九曜過宫復吉既愆七日泰來惟候三陽曆日今頒寅正占星更候農祥有日猶嫌開牖無風不敢上簾報國丹心何似夢中抵掌掀髯壯歲喜新節物老來惜舊年華病後都盧不問家人時換瓶花正月九日雪霰後大雨二首夜霰三更碎瓦晝冥一陳翻盆賴是梅花巳過不然皴玉誰溫黃昏簷溜垂瀑淸曉屐聲滿門湖光萬頃何似小沼先吹縠紋正月十日夜大雷震二首阿香真是健婦夜半鼓行疾驅直恐南山破碎絶憐窗紙枝梧人言有物司鼓春到揚桴發聲但要蟄蟲啓戶何須一許震驚吳燈兩品最髙鏤冰影裏百千光剪綵毬中一萬窗不是齊人誇管晏吳中風物竟難雙燈夕懷廣蜀舊事灕水橋西列炬香少城樓下變燈忙兒嬉萬里客程逺老懶一龕春夢長上元紀吳中節物俳諧體三十二韻斗野豐年屢吳臺樂事并酒壚先叠鼓歲後即旗亭先擊鼓不巳以迎節意燈市蚤投瓊臘月即有燈市珍竒者數人醵買之相與呼盧采勝者得燈價喜膏油賤祥占雨雪晴篔簹仙子洞坊巷燈以連枝竹縛成洞門多處數十重菡萏化人城蓮花燈最多檣炬疑龍見舟人接竹桅檣之表置一燈望之如星橋星訝鵲成橋燈小家厖獨踞犬燈髙閈鹿雙撐鹿燈屏展輝雲母琉璃屏風簾垂晃水精琉璃簾萬窗花眼密萬眼燈以碎羅紅白相間砌成工夫妙天下多至萬眼千隙玉虹明琉璃毬燈每一隙映成一花亦妙天下薝蔔丹房挂梔子燈葡萄緑蔓縈葡萄燈方縑翻史冊生絹糊大方燈圖畫史冊故事村人喜看圓魄綴門衡月燈擲燭騰空穩小毬燈時擲空中推毬滚地輕大滚毬燈映光魚隱見琉璃壺瓶貯水養魚以燈映之轉影騎縱橫馬騎燈輕薄行歌過顚狂社舞呈民間鼓樂謂之社火不可悉記大抵以滑稽取笑村田蓑笠野村田樂街市管絃淸街市細樂里巷分題句每里門作長燈題好句其上官曹別扁門官府名額多以絹或琉璃照映旱船遙似泛夾道陸行為競渡之樂謂之划旱船水儡近如生水戲照以燈鉗赭􅋔牢戶獄燈嘲嗤繪樂棚山棚多畫一時可嘲誚之人堵觀瑶席隘喝道綺叢爭禁鑰通三鼓歸鞭任五更桑𧖟春繭勸春繭自臘月即入食次所以為𧖟事之兆花蝶夜蛾迎大白蛾花無貴賤悉戴之亦以迎春物也鳧子描丹筆紅畫鴨子相餽遺鵝毛剪雪英剪鵝毛為雪花與夜蛾並戴寶糖珍粔籹䭔拍吳中謂之寶糖䭔特為脆美烏膩美飴餳烏膩糖即白餳俗言能去烏膩撚粉團欒意糰子熬稃腷膊聲炒糯榖以卜俗名孛婁北人號糯米花筵篿巫志怪香火婢輸誠俗謂正月百草靈故帚葦針箕之屬皆卜焉多婢子之輩為之帚卜拖裙驗弊帚繫裙以卜名掃帚姑箕詩落筆驚即古紫姑今謂之大仙俗名筲箕姑微如針屬尾以針姑卜伺其尾相屬為兆名針姑賤及葦分莖葦莖分合為卜名葦姑末俗難訶止佳辰且放行此時紛僕馬有客靜柴荆幸甚歸長鋏居然照短檠生涯惟病骨節物尚鄉情掎托成俳體咨詢逮里氓誰修吳地志聊以助譏評雪寒探梅酸風如箭莫憑闌凍合橫枝雪未乾吳下得春元自晚那堪天與十分寒曉枕三首煮湯聽成萬籟添被知是五更陸續滿城鐘動須臾後巷雞鳴卧聞赤腳鼾息樂哉栩栩蘧蘧病夫心口相語何日佳眠似渠舒慘常隨天氣關心窗暗窗明日晏扶頭未起喚人先問隂晴不寐春宵似暖非暖曉夢欲成未成風竹時驚雀噪月窗誰伴梅橫戲書二首長病人嫌理亦冝吾今有計可扶衰煩君舁著山深處恐有黃龍浴水醫羣兒欺老少陵窮口燥脣乾髮漫衝顚沛須臾猶執禮古來惟有一髙共耳鳴風號髙木水翻洪歷歷音聞不是聾一任大千都震吼便從卷葉證圓通案上梅花二首南坡玉雪萬花團舊約東風載酒看冷落銅瓶一枝亞今年天女亦酸寒地爐火暖日烘窗一夜花鬚半吐黃鼻觀圓通熏百和博山三夕罷燒香古梅二首孤標元不鬬芳菲雨瘦風皴老更竒壓倒嫩條千萬蘂只消踈影兩三枝誰似西湖處士才詩中籬落久塵埃陸郎舊有梅花課未見今年句子來至昌為具賞東軒千葉梅然梅尚未開玉葉重英意巳芽新移竹外小橫斜東齊何似春工晚鐵樹巳花梅未花喜周妹自四明到團欒話裏老龎衰一妹仍從海浦來孤苦尚餘兄弟樂如今雖病也睂開占星者謂命宫月孛獨行無害但去年復照作災今年正月一日巳出而歲星作福戲書二絶昔躔初度本除災何意重逢作病媒久住靈斿今日過曆翁歡喜勸椒杯暗曜加臨有救神煌煌福德自天仁只煩終惠蘇殘喘官爵從渠奉董秦題藥方孤童亦復夢槐柯無德無功用福多天理乘除當老病巢源王訣奈君何園丁折花七品各賦一絶單葉御衣黃舟前鵝羽映酒塞上駝酥截肪春工若與多葉應入姚家鴈行水精毬輕盈嫵媚不耐風日又名醉西施又名風嬌又名玉勝瓊縹眇醉魂夢物嬌饒輕素輕紅若非風細日薄直恐雲消雪融壽安紅深色粉紅多葉易種且耐久豐肌弱骨自喜醉暈粧光總宜獨立風前雨裏嫣然不要人持叠羅紅開遲旬日始放盡襞積剪裁千叠深藏愛惜孤芳若要韶華展盡東風細細商量崇寧紅勻染十分艷絶當年欲占春風曉起粧光沁粉晚來醉面潮紅鞓紅猩脣鶴頂太赤榴萼梅腮弄黃帶眼一般官樣只愁瘦損東陽紫中貴沉沉色與露滴泥泥香隨日烘滿眼艷粧紅袖紫綃終是仙風聞春逺牡丹盛開東軒聞道有花開癡坐三椽首謾回縱得好晴猶懶看那堪風雨揭天來蜀花以狀元紅為第一金陵東御園紫繡毬為最西樓第一紅多葉東苑無雙紫壓枝夢裏東風忙裏過蒲團藥鼎鬢成絲喜雨昨遣長鬚借踏車小池須水引鳴蛙今朝一雨添新漲便合翻泥種藕花嘲風紛紅駭緑驟飄零癡騃封姨沒性靈報道海棠方熟睡也須留眼為渠靑大風春晴雖好恨多風到眼花枝轉眼空晴不與花為道地爭如雲淡雨濛濛風止收盡狂飊捲盡雲一竿晴日曉光新柳魂花魄都無恙依舊商量作好春苦雨五首河流滿滿更滿檐溜垂垂又垂皇天寧有漏處后土豈無乾時不辭蛾化麥穗叵忍秧浮浪花兒孫汨汰護岸翁媪扶攜上車折筍肥梅飣坐涎蝸鬭蟻上梁雨工莫賈餘勇留待稻花半黃潤礎才晴又汗濕薪未爆先煙壯夫往往言病病叟岑岑且眠巳厭衣裳蒸潤仍憐書畫斕斑奩香尚餘幾所盡付熏罏博山謝龔養正送蘄竹杖一聲霜曉謾吹愁八尺風漪不耐秋上座獨超三昧地諾惺菴裏證般舟釋氏謂常行為般舟三昧寄題祝郢州白雪樓楚望風煙倚繡楹使君靜治有髙情只應襦袴新翻曲壓倒當年寡和聲夏至二首李核垂腰祝饐粽絲繫臂扶羸節物競隨鄉俗老翁閒伴兒嬉石鼎聲中朝暮紙窗影下寒溫踰年不與廟祭敢云孝子慈孫重午尉斗薰籠分夏衣翁身獨比去年衰巳孤菖渌十分勸却要艾黃千壯醫蜜粽冰糰為誰好丹符綵索聊自欺小兒造物亦難料藥裹有時生網絲積雨作寒五首壓屋雨雲晝暗環城霖潦夏寒西池半沒荷柄南蕩平沉芡盤巳報舟浮登岸更憐橋塌平池養成蛙吹無謂掃盡蚊雷却竒尉帖重尋毳衲補苴盡護紙窗餘生雪鬢禪榻昨夢雲帆漲江婢喜蚊僵霧帳兒嗔蝸篆風櫺兀坐鼻端正白忘懷眼底常靑山寒禪老不下泥滑琴僧罕來且喚園丁閒語喜聞湖岸未頽禪老範默堂琴僧淨月師也喜晴二首驅帚水爭溝口卷簾日欵屋山飢燕癡兒叫怒拙鳩去婦復還窗間梅熟落蒂牆下筍成出林連雨不知春去一晴方覺夏深子文大丞重午日走貺煮酒淸甚殆與逺水一色何其妙哉數語奉謝臘腳淸若空吾聞其語矣今晨品義尊公酒正如此太常家有此段竒銷得不齊醉如泥但恨今無遏雲曲送我菖蒲一杯緑子文舊有歌者名遏雲子文見和云亦有小鬟能度曲復用韻戲贈三年屏杯酌甚矣吾衰矣眼中有淄澠猶解商略此花
