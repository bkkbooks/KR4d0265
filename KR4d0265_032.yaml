front:
  text: 石湖居士詩集卷三十二
  hash: sha256:fb670fdd957260ee20328df7d8ebb83875c5d9ffdfa6e0ff4355b5fa3fb9e02e
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0265_SBCK_032-1a}
body:
  text: 春日覽鏡有感習氣不解老壯心故嵯峨忽與鄉曲齒方驚年許多有眼不自見尚謂朱顔酡今朝鏡中逢憔悴如枯荷形骸既遷變歲華復蹉跎悟此吁巳晚既悟當若何烏兔兩惡劇不滿一笑呵但淬割愁劍何須揮日戈兒童競佳節呼喚儛且歌我亦興不淺健起相婆娑故太夫人章氏挽詞二首張子儀總領之母洵美相門裔有齊邦媛賢藻蘋南澗下萱竹北堂前孝敬三從謹哀榮五福全松銘諸健筆題作晉陵阡積慶今如許生兒得寧馨軻親躬授教韋子世傳經壽斚明卿月安輿拱使星市橋何處在夢斷一溪靑舅母太夫人方氏挽詞三首四德儀邦族三遷奠里門姑寧憂疾痛子自樂平反夏枕方供扇薰堂甫種萱那知秋暑退無復御輕軒門戶傳淸白階庭侍紫靑百年歌燕喜五福用康寧訣籙嘗觀妙旒旌謾勒銘神遊定超絶何必訊泉扃我願延陵道幾如渭水陽適傳杯泛影何意隙沉光擬補蘭陔雅翻吟薤露章支離妨執紼雨泣望楸行壽櫟堂前小山峰凌霄花盛開蔥蒨如畫因名之曰凌霄峰天風搖曳寶花垂花下仙人住翠微一夜新枝香焙暖旋薰金縷緑羅衣山容花意各翔空題作凌霄第一峰門外輪蹄塵撲地呼來借與一枝笻代兒童作立春貼門詩三首剪綵冝春勝泥金祝壽幡雪梅同雪鬢相對兩淩寒緑野添花徑靑春引杖藜家人行樂處雙勸玉東西盛族推山長修齡號櫟翁屏花春不老日日是東風代兒童作端午貼門詩三首畫閣圍香裏明窗宴坐中兵符不須篆丹轉藥爐紅管領神仙侣追陪山長家往來惟意適歌舞對年華黍筒小費名田課昌歜多浮樂聖杯笑倩艾人看外戶北窗深處詠歸來重陽不見菊二絶節物今年事事遲小春全未到東籬可憐短髮空欹帽欠了黃花一兩枝冷蕊蕭踈蝶懶飛商量何日是花時重陽過後開無害只恐先生不賦詩古風送南卿廬阜有佳人顔色皎冰玉不能時世粧蕭然古冠服紛紜倚市門組麗眩紅緑妖歌促艷舞飛上黃金屋安知乘鸞侣流落墮空谷風泉入環珮月露作膏馥梁肉豈不珍瀹雪煮黃獨聊用慰朝飢歲寒膚起粟綺叢三尺塵無路到松竹誰能撫孤桐為奏招隱曲偶至東堂岸幘蕭騷雪滿簪一間真是直千金歸來栗里多情話病後香山少醉吟久坐蒲團蕉葉放間拖藜杖蘚花深飢時喫飯慵時睡何暇將心更覓心李郎中挽詞二首聖俞劇郡思賢牧名曹失望郎六參能幾日兩鬢未全霜霅水新阡逺桐川舊隱荒絶憐垂白母淚血獨還鄉憶昔單車使惟君勇輔行馬隤招共載羝乳約同盟老去長懷舊悲來遽隔生故人凋落盡衰涕不勝橫謝江東漕楊廷秀祕監送江東集并索近詩二首逺道悠悠日暮雲愁眉今日為君軒殘燈獨照江東集短夢相尋白下門即事想多梅蕊句有誰堪共桂花樽斯文賴有斯人在會合何時得細論秃翁衰雪涕垂頤仿佛三生懶散師浹髓淪膚都是病傾囷倒廩更無詩笑看筆格網絲遍間數窗櫺花影移事業光隂今若此故人休説舊襟期霜後紀園中草木十二絶菊老芙蓉退化工少均逸蚤晚梅花動從此無間日遮藏茉莉檻纏裹芭蕉身我亦入室處忍寒待陽春製芰亦不急緼袍堪禦冬從渠抱枝稿摵摵鳴霜風種葵如種麥隔歲巳下子僅成一幹花浪備四時氣棠梨芳意多頗惜歲晼晚殷勤小春花特地慰愁眼牡丹初翦時巳具新花眼代謝不容髮笑殺鐵門限客從揚州來遺我揚州花筠籠貯枯枿明年擅春華風倒酴醿架長條頭搶地趁渠未萌芽政可相料理淸霜染柿葉荒園有佳趣留連伴歲晚莫作流紅去真珠綴玉船梧子炒可供莫嫌能墮髮老夫頭巳童桃能驅不祥霜後葉鋪地抱枝崑崙奴猶解禦魑魅門冬如佳隸長年護階除生兒乃不凡磊落玻璃珠以狨坐覆蒲龕中蠧蝕塵昏度幾年蒙茸依舊軟如綿且來助暖烏皮几莫憶衝寒紫繡韉再到虎丘不過溪橋又兩年偶隨笻竹訪幽禪有緣再踏雲巖路無處重尋石井泉擬輟半山分座住先攜一枕借牀眠覺來飽喫紅蓮飯正是塘東稻熟天虎丘石井在張又新東南水品第三今寺僧不能名其處妄指寺中一土井當之經藏後有大方井舊名觀音井上有石柱為挂轆轤之處疑此是古石井今井巳堙塞百年柱亦徙他用纍諷住山者多邈然今以語壁老虎丘六絶句點頭石當年揮麈講何經賺得堅頑側耳聽我自吟詩無法説石頭莫作定盤星千人坐聽經人散蘚花深千古誰能更賞音只好岸巾披鶴􅌁風淸月白坐彈琴白蓮池碧泓白石偃樛枝愛水嫌風老更低潭影中間龍影卧一山好處沒人題劍池石罅泓渟劍氣潛誰將樓閣苦莊嚴只知暖熱遊人眼不道蒼藤翠木嫌致爽閣碧嶂橫陳似斷鼇畫闌相對兩雄豪東軒只有雲千頃不似西山爽氣髙方丈南窗鼓板鐘魚徹曉喧誰云方外事蕭然窗間日暮寒煙重未到齋時我正眠雪寒圍爐小集席簾紙閣護香濃説有談空愛燭紅髙飣羶根澆杏酪旋融雪汁煮松風康年氣象冬三白浮世功名酒一中無事閉門渠易得何人躡屐響牆東白玉樓步虛詞六首并序趙從善示余玉樓圖其前玉階一道橫跨緑霄中琪樹垂珠網夾階兩傍緑霄之外周以玉闌闌外方是碧落階所接亦玉池中間湧起玉樓三重千門萬戶無非連璐重璧屋覆金瓦屋山綴紅牙垂璫四簷黃簾皆捲樓中帝座依約可望紅雲自東來雲中虛皇乘玉輅駕兩金龍侍衛可見者靈官法服騎而夾侍二人力士黃麾前導二人儀劍四人金圍子四人夾輅黃幡二人五色戟帶二人珠幢二人金龍旗四人負納陛而後從二人雲頭下垂將至玉階樓前仙官冠帔出迎方下階雙舞鶴行前雲駕之傍又有紅雲二其一仙官立幢節間其二女樂並奏玉樓之後又有小玉樓六其制如前寶光祥雲前後蔽虧或隱或現小案之前獨為金地亦有仙官自金地下迎傍小樓最髙處有飛橋直瑶臺仙人度橋登臺以望名數可紀者大略如此若其景趣髙妙碧落浮黎靑冥風露之境則覽者可以神會不能述於筆端此畫運思超絶必夢遊帝所者髣佛得之非世間俗史意匠可到明窗淨几盡卷展玩恍然便覺身在九霄三景之上奇事不可以不識簡齋有水府法駕導引歌詞乃倚其體作步虛詞六章以遺從善羽人有不俗者使歌之於淸風明月之下雖未得仙亦足以豪矣珠霄境却似化人宫梵氣彌羅融萬象玉樓十二倚淸空一片寶光中浮黎路依約太微間雪色寶階千萬丈人間遙作白虹看幢節度髙寒罡風起背負玉虛廷九素煙中寒一色扶闌四面是靑冥環拱萬珠星流鈴響龍馭籋雲來夾道騫華籠綵仗紅雲扶輅輾天街迎駕鶴毰毸鈞天奏流韻滿空明琪樹玲瓏珠網碎仙風吹作步虛聲相和八鸞鳴樓闌外輦道插非煙間上鬱蕭臺上看空歌來自始靑天揚袂揖飛仙送趙從善少卿將漕淮東玉筍風標右漢廷起家聊直使車星古來將相多頭黑此去功名尚鬢靑披草兩年南北巷折梅明日短長亭門前車轍從今少寂寞柴荆且暫扃范村雪後習氣猶餘燼鍾情未濕灰忍寒貪看雪諱老強尋梅尉貼愁眉展勾般笑口開直疑身健在時有句飛來寒夜觀雪靜極孤鴻響寒疑萬籟喑眼花燈下字髭斷雪中吟頗似償前債非關惜寸隂可憐蝴蝶夢翩作蠧書蟫瓶花二首水仙攜蠟梅來作散花雨但驚醉夢醒不辨香來處小梅未可折不折惜空回擁鼻撚一枝也道探春來瑞香三首小檻移秀色端來媚禪房道人不解飲醺然醉天香紫雲蹙繡被團欒覆衣篝濃薰百和韻香極却成愁一叢三百朵細細拆濃檀簾幕護花氣不知窗外寒石湖居士詩集卷三十二
