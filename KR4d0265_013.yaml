front:
  text: 石湖居士詩集卷十三
  hash: sha256:bec383702451ef3a06ab9c7895c624e12bc803bc9c9bb382c4a6b23931243786
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0265_SBCK_013-1a}
body:
  text: 與吳興薛士隆使君遊辨山石林先生故居此卷乾道壬辰冬赴廣西道中所作舊名南征小集白蘋有嘉招蒼辨得勝踐會心不憚逺乘興恐失便籃輿犯窮臘共作忍寒面溟濛雲釀雪浩蕩風落鴈松篁漸淸幽猿鶴或悲怨英英文章公作舍鎖蔥舊嶢峰俯前榮佳木秀諸院窮搜發山骨林立侍談宴西巖踞熊虎東巖峙屏案履綦故仿佛蓋瓦巳零亂經營三十年成毀一飛電摩挲土花碧小立為三歎自石林回過小玲瓏巖竇益竒昔為富人吳氏所有今一子尚幼山檢校於官一丘乃中虛洞穴四無礙却略巖岫杳􅉳糾石牀怪蒼牛飲前池碧罅灔微瀨雕鎪具百巧圖畫窘千態哀湍寫壞磴凍雨濕空翠踈梅照草棘瘦竹拔蹊隧當時閭閻子目力在塵外孤童藐難料竒事疑有待誰歟千金捐來換把茅蓋不仙亦足豪衆垤皆纍塊我評北山遊勝絶此無對玲瓏詎可小孰能為之大濯纓亭在吳興南門外淒風急雨脫然晴當道橫山似見迎野水茫茫何用許斕供遊子濯塵纓乾道已丑守括被召再過釣臺自和十年前小詩刻之柱間後五年自西掖帥桂林癸巳元日雪晴復過之再用舊韻三絶浮生渺渺但飛埃問訊星宫又獨來天上人間最髙處為君題作鬱蕭臺拙踈何計補涓埃慚愧雙旌去復來三過溪門今老矣病無腳力更登臺界天山雪淨黃埃溪上扁舟夜泛來匝地東風勸椒酒山頭今日是春臺玉山道中常山多淸溪玉山富喬木行色鬱蒼然頗亦慰愁目梅花隔籬見瓏璁照茅屋晚來風刮地想見飄香玉桃花壇下望龜峰石壇無土謾嶔岑何自能生小柏林擬擘蛤蜊龜殼上病來不殺懶登臨淸音堂與趙德莊太常小飲在餘干琵琶洲傍洲以形似得名曲浦彎環繞縣靑一杯間客兩飄零琵琶不語蒼煙暮山水淸音著意聽過鄱陽湖次遊子明韻春工釀雪無端密大塊囊風不肯收休問巉巖與欹側我今弚靡共波流野鷹兀兀平沙上折葦蕭蕭古渡頭滿眼荒寒底處所令人腸斷五湖舟豫章南浦亭泊舟二首繡檻臨滄渚牙檣插暮沙浦雲沉斷鴈江雨入昏鴉野曠天何近春寒歲未華來朝風一席隨處且浮家閏歲花光晚霜朝草色荒趂墟猶市井收潦再耕桑客路東西懶江流日夜忙長歌情不盡一酌酹滄浪淸江道中橘園甚夥芳林不斷淸江曲倒影入江江水緑未論萬戶比封君瓦屋人家衣食足暑風泛花蘭芷香秋日籬落明靑黃客舟來遲佳景盡但見碧樹愁春霜淸江臺在臨江郡圃西岡上張安國題榜南來富壽岡形勝此蟠結岑竮戴髙臺欄檻了風月蕭灘曳長煙閣皂炯殘雪江流當帶橫練練浮木末天風來無鄉萬里吹醉纈登臨信竒事忍凍亦癡絶故人春夢覺遺墨秋蛇掣浮雲真可咍揮觶酹空闊自冬徂春道中多雨至臨江冝春之間特甚遂作苦語客行無晴時涔涔如漏天東吳至西江舊歲接新年蠟屐驚踵決油衣笑鶉懸掀淖起復仆頃步如重關略似鴨與豬汨沒泥水闌我塗未渠窮一晴愧天慳倒塔橋巳斷壁破渡無船路人相告語未到先長歎薄晚得磽確稍入袁州山不辭石齧足聊免泥沒韀自古行路吟聽者凋朱顔軒渠尚能賦詩人類癡頑玉虛觀去冝春二十五里許君上升時飛白茅數葉以賜王長史王以宅為觀觀旁至今有仙茅極異常草備五味尤辛辣云久食可仙道士煮湯以設客白雲堆裏白茅飛香味芳辛勝五芝揉葉煮泉摩腹去全勝石髓畏風吹入分冝新喻渡無橋分冝橋有欄孰歟兩徼吏賢否巳判然堂上著威信四郊如目前入國政可知兹焉略窺觀方竹杖竹君箇箇面團團此士剛方獨凛然外貌中心俱壁立任從癡子削教圎遊仰山謁小釋迦塔訪孚惠二王遺迹贈長老混融堵田溪淵淸洄洄梅洲問路寒雲堆連空磴道虬尾滑竹輿直上無梯階蒼官來迎夾道立相逢無言心眼開翠微中斷雪澗吼兩耳不辦供喧豗林間靜極成斷相政要萬壑號風雷山如蓮盆繞金地龍官避席餘蒼崖祖師抱膝坐古塔大禪海浪翻天來騰空狡獪我未暇拄杖踏濕撞莓苔問龍亦借一席地解包聽雨眠西齋當年公案忌錯舉神通佛法同坑埋混融菴中的的意笑我舌本空崔巍兹事且置飽喫飯稊田米賤如黃埃大雨宿仰山翌旦驟霽混融云無乃開仰山之雲乎出山道中作此寄混融誰開大仰雲此豈吾力及日光千丈毫彈指衆峰立衡山捲隂氣海市發冬蟄韓蘇兩枯魚出語自濡濕人厄與天窮底用苦封執但喜拄杖俊仍欣芒屩澀向來三三尺泥有足似羈􅎗龍淵古橋皴獺徑寒溜泣龍淵獺徑皆山中往迹春淺山容瘦風叨澗聲急一簞寄前村野䔩旋收拾貓頭髠筍尖雀舌剝茶粒土毛冠江西斗酒況可挹聊同一笑粲緩賦百憂集初入湖南醴陵界崖樹隂隂夾暝途出山歡喜見平蕪一春客夢飽風雨行盡江南聞鷓鴣醴陵驛緑水橋通縣縣前浮橋名門前柳巳黃人稀山木壽土瘦水泉香乍脫泥中滑還嗟堠子長櫧州何日到鼓枻上滄浪湘潭道中詠芳草積雨倐然晴秀野若新沐芳草徑寸姿中有不勝緑萋萋路傍情頗亦念幽獨驅馬去不顧斷腸招隱曲初見山花三日晴泥尚沒鞾幾將風雨過年華湘東二月春才到恰有山櫻一樹花櫧洲道中煙凝山如影雲褰日射毫桃間紅樹迥麥裏緑叢髙客子歎遊倦田家甘作勞乘除吾尚可未擬賦離騷浮湘行湘山中間湘水橫緑蘋葉齊春漲生盤渦沄沄去無聲吾乘桂舟泝中􅍽揚波擊汰雙櫓獰轆轤引笮如牛鳴篙師絶叫疊鼓轟濳魚跳奔乳猿驚暖煙浮空晝夢騰山長水逺天無情吹簫拊瑟弔湘靈水妃風御繽來迎問客良苦逺征行昨者斧鉞下靑冥命我盡護安南兵嶺海一視如王庭布蕩陽春濯腐腥王事靡盬來有程匪躬之故惟爾氓芳洲杜若空靑靑九歌淒悲不可聽願賡楚調歸和平湘江洲尾快風挂帆船頭雪浪吼奔雷十丈髙帆滿意開我自只憑忠信力風應不為世情來兒童屢惜峰巒過將士猶教鼓笛催明日祝融天柱去更煩先捲亂雲堆泊湘江魚口灘知時社燕語檣竿遊子奔波自鮮歡趂客賣魚雙漿急隔林沽酒小旗寒瀟湘渾似日南落嶽麓巳從天外看薄暮灘前收百丈卧聞三老報平安謁南嶽湘中固多山夾岸萬馬屯坡陀無敢髙似遜喬嶽尊曉投望雲亭衆丘拱牆藩濃嵐忽飄蕩積翠浮雲端天柱巳峻極祝融更髙寒紫蓋鬱當中岡勢洶崩奔峙為赤帝峰下直宫壖垣角樓捧雙闕圎方模九閽炎符撫中興南正實司天草木薰協氣山林奠神姦妥靈有備物龍卷鸞旗軒走忝桂林伯與神俱南轅上謁禮亦冝為國憂元元心空禍福相古井寒無瀾杯珓不用擲但願歸田園相傳壁畫好拂拭塵埃昏弓刀立壯士劒珮班靈官後宫行樂處窈窕千雲鬟錦地舞月晝珠櫳侍春間武氏筆巳絶梗概猶淸妍後宫壁畫武洞淸筆極禁籞富貴之趣紹興二十年火後為雨所敗後人摹舊迹更畫猶有倣佛旋車闔廟去頗厭山市喧勝果招客遊徑排集賢關梵庋絢雜組衡嶽藏經皆錦絲竹簾護之孟蜀時捨簾乃其戶部侍郎彬所造錫杖鏘古鐶開山善果尊者所遺避雨勝業閣在嶽祠之南晚晴留憑欄石廩映岣嶁望眼增孱顔上封眇孤絶南臺半雲煙碧岫有靈藥朱陵巢洞仙晚晴乃盡見諸峰病倦懶幽討山僧鐫我頑松樛唐季枝柏局隋初根竒事不勝紀重遊當細論廟路三十里夾岸大松五季時馬氏所植勝業寺柏不見根偃於地出八幹龍蟠占數畝世所未之見傳為隋時物兩蟲鷓鴣憂兄行不得杜宇勸客不如歸天涯羈思難繪畫惟有兩蟲相發揮衡陽道中二絶桑下蕪菁晚髙花出短籬茅簷少春事惟記浴𧖟時黑羖鑽籬破花豬突戶開空山竹瓦屋猶有燕飛來衡州石鼓書院古磴浮滄渚新黌鎖碧蘿要津山獨立巨壑水同波俎豆彌文肅衣冠盛事多地靈鍾傑俊寧但拾儒科合江亭并序合江亭即石鼓書院今為衡州學宫一峰特立踞兩水之會湘水自右蒸水自左俱至亭下合為一江而東有感而賦韓文公所謂渌淨不可唾者即此處今有渌淨閣石鼓鬱嵯峨截然踞滄洲有如古盟主勤王會諸侯蒸湘伯叔國稟命會葵丘敢不承載書戮力朝宗周混為同軌去崩奔不敢留冝哉百谷王博大無與儔氊毳昔亂華車馬隔中州未聞齊晉勳包茅費誅求威文亦弘規尚取童子羞安知千載後但泣新亭囚我題石鼓詩願言續春秋沈家店道傍棣棠花乍晴芳草競懷新誰種幽花隔路塵緑地縷金羅結帶為誰開放可憐春邵陽口路粗惡積雨餘濘難行平生春夢境俯仰撫八極湖南天盡頭夢亦未常識豈知多病身今乃著腳歷山泉澄不淸崖土璺而赤坳堂滑勝油纍塊硬逾石貪夫一回顧壯士三歎息不知淸淑氣果復曽鬱積我豈鄙夷之短咏聊一劇馬鞍驛飯罷縱步食飽倦輿馬散䇿步前岡意行踏芳草蕭艾蓊生香春事甚寂寥山桃帶松篁遊蜂入菜花此豈堪蜜房今年𧖟出遲柘葉分寸長好晴才數日歲事未渠央黃羆嶺薄遊每違已兹行遂登危峻阪蕩胸立恍若對鏡窺傳呼半空響濛濛上煙霏木末見前驅可望不可追躋攀百千盤有頃身及之白雲叵攬擷但覺沾人衣髙木傲燒痕蔥蘢茁新荑春禽斷不到惟有蜀魄啼謂非人所寰居然見鋤犁山農如木客上下翾以飛寧知有康莊生死安嶮巇室屋了無處恐尚橧巢栖安得拔汝出王路方淸夷衡永之間山路艱澀薄晚吏卒鬨云漸近祁陽路巳平夷皆有津津之色朝登赤土嶺暮入黃泥谷春江弄花月歸夢恍在目覺來行路難杜宇叫髙木凹中泥沒踝凸處石齧足坐輿我尚病想見肩輿僕衡陽復祁陽可暫不可宿晚來出前岡路坦亭堠促將士走相賀喜色如膏沐人生本無悶逆境要先熟不從憂患來安識平為福夷塗不常遇歷險始知足書浯溪中興碑後并序乾道癸巳春三月余自西掖出守桂林九日渡湘江遊浯溪摩挲中興石刻洎唐元和至今遊客所題竊謂四詩各有定體頌者美盛德之形容以其成功告於神明者也商周魯之遺篇可以槩見今元子乃以魯史筆法婉辭含譏蓋之而章後來詞人復發明呈露之則夫磨崖之碑乃一罪案何頌之有竊以為未安題五十六字刻之石傍與來者共商略之此詩之出必有相詬病者謂不合題破次山碑此亦習俗固陋不能越拘攣之見耳余義正詞直不暇恤也三頌遺音和者希丰容寧有刺譏辭絶憐元子春秋法都寓唐家淸廟詩歌詠當諧琴搏拊䇿書自管璧瑕疵紛紛健筆剛題破從此磨崖不是碑愚溪在零陵城對岸渡江即至溪甚狹一石澗耳蓋衆山之水流出湘中一水彎環羅帶闊千古零陵擅風月取名如許安得愚因病成妍却竒絶至今鏡淨不可唾猶恐先生遺翰墨澤及溪流不庇身付與後來商巧拙我欲扁舟窮石澗春漲未生寒瀨咽紛紅駭緑四山空惟有風篁韻騷屑淸溪東去客西征鈷鉧潭邊聊駐節何時隨汝下瀟湘歸路三千櫓伊軋鈷鉧尉斗也潭形似之宿淸湘城外田家驅馬力猶強奏牀身始疲浮浮雲拂帳潏潏水鳴籬未熟燈前夢間尋道上詩湘中多夜雨客枕最先知宿深溪驛去廣右界只一程北戶書頻到南雲鴈不飛試評騎馬路何似釣魚磯擊柝黃茅店篝燈白竹扉故園桑柘暖亦有稻粱肥石湖居士詩集卷十三
