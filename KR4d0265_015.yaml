front:
  text: 石湖居士詩集卷十五
  hash: sha256:3bd7a4baefb55b1a84c6691e750fc59f119521727e6e58607996edeac72973d0
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0265_SBCK_015-1a}
body:
  text: 初發桂林有出嶺之喜但病餘便覺登頓至靈川疲甚自歎羸軀乃無一可偶陸融州有使來書此寄之桂林獨冝人無瘴古所傳北客守炎官恃此以泰然堂髙愜宴坐訟簡容佳眠不計身落南璿柄三回天今朝遂出嶺歡呼繫行纏罝兔脫豐草池魚躍淸淵那知多病身久靜翻懷安長風蕩籃輿簾箔飄以翾靈泉路喫蹶僕夫告頳肩我亦頭岑岑中若磨蟻旋走投破驛宿強飯不下咽兹事未渠央萬里蜀道難十年故倦遊況乃成華巔𧖟老當作繭不繭夫何言甘棠驛萬里三年醉嶺梅東風刮地馬頭回心勞政拙無遺愛慚向甘棠驛裏來靈泉驛後有龍惠泉泉螭無語笑經過欲拊㷀鰥奈拙何孤奉明恩雖出嶺歡顔終少汗顔多嚴關或謂之炎關桂人守險處朔雪多不入關關內外風氣迥殊人以為南北之限也回看瘴嶺巳無憂尚有嚴關限北州裹飯長歌關外去車如飛電馬如流施進之追路出嚴關且寫豫真戲題其上喚渡牂牁瘴水濱嚴關關外又逢春神仙富貴俱何在且作全家出嶺人興安乳洞有上中下三巖妙絶南州率同僚餞別者二十一人遊之山水敦夙好煙霞痼竒懷向聞乳洞勝出嶺更徘徊雪林縞萬李東風知我來華裾繡髙原故人紛後陪繫馬玉溪橋嵌根豁崔嵬蕩蕩碧瑶宫冰泉潄牆隈芝田溉石液深畦龍所開丐我一掬慳頮此炎州埃仍呼輪袍舞醉倒瑞露杯但恐驚山靈腰鼓轟春雷薪翁雜餉婦圜視歡以咍兹巖何時鑿閲世幾劫灰始有此客狂後會真悠哉南遊冠平生巳去首猶回歲月可無紀三洞俱磨崖會有好事者摩挲讀蒼苔鏵觜在興安縣五里所秦史録所作也迎海陽水壘石為壇前鋭如鏵衝水分南北下為湘灕二江功用竒偉余交代李德逺嘗修之導江自海陽至縣乃瀰迤狂瀾既奔傾中流遇鏵觜分為兩道開南灕北湘水至今舟楫利楚粵徑萬里人謀􅐁天造史祿所經始無謂秦無人虎鼠用否耳紫藤纏老蒼白石溜淸泚是聞可作社牲酒百世祀修廢者誰歟配以臨川李大通界首驛愚悃無華敢自欺寸誠珍重吏民知東風重倚庭前樹送別人情似到時陳仲思陳席珍李靜翁周直夫鄭夢授追路過大通相送至羅江分袂留詩為別相送不忍別更行一程路情知不可留猶勝輕別去二陳拱連璧仙李瑚璉具周子雋拔俗鄭子秀風度嗟我與五君曩如栖鳥聚偶投一林宿飄搖共風雨明發各飛散後㑹渺何處栖鳥固無情我輩豈漫與班荆一炊頃聽此昆弟語把酒不能觴有淚若兒女修程各著鞭慷慨中夜舞功名在公等臞儒老農圃懷桂林所思亭篸山竒絶送歸時曽榜新亭號所思桂水只今湘水外他年空有四愁詩羅江嶺北初程分外貪驚心猶自怯晴嵐如何花木湘江上也有黃茅似嶺南初入湖湘懷南州諸官今晨入湖南甘土絳以紫厥壤既殊異風氣當稱此回思始安城舊籍贅楚尾實惟荆州隸零陵之南鄙時雪度嚴關物色號淸美儻以土冝觀尚非淸湘比何況引而南焦茅數千里向我作牧時客過不停軌憧憧走官下既至輒咎悔書來無別語但說瘴鄉鬼我今幸北轅又念衆君子懷哉千金軀博此五斗米作詩諷方來南遊可以巳車輪倘無角吾詩亦金柅淸湘縣郊外雜花盛開有懷石湖午行淸湘縣妍暖春事嘉柴荆鬧桃李冥冥一川花故園豈少此愈此百倍加我寧不念歸顧作失木鴉百年北窗凉安用天一涯君恩重喬嶽敢計征路賖鄉心與官身鑿枘方聱牙橘柚走珍貢何如繫匏瓜明當復露奏天日臨幽遐儻許淸江使曵尾還汙邪珠塘未至淸湘二十里林茂鳥烏急坡長驢䭾鳴坐輿猶足痺負笈想肩頳廢廟藤遮合危橋竹織成路傍行役苦隨處有柴荆題湘山大施堂山中祖師號無量壽真身塔在焉重倚春林淚竹枝南迷風物鬢成絲難尋桂嶺千峰夢更了湘山一段竒來去別無心外法行藏休問塔中師若論大施門前事竿木逢場且賦詩淸湘驛送祝賀州南歸海內交情兩斷金離歌倡和俱吳音桃花如雨暮春酒竹箭有筠他日心萬里書來蜀道易四愁詩成湘水深田園將蕪各早計一棹五湖能見尋淸湘驛送王柳州南歸二絶南歸北去路茫茫不是行人也斷腸可惜湘江春夜月落花時節照離觴我巳兼程無腳力君猶追路有襟期從今月下共花下誰復醉吟先和詩七里店口占分手暮江寒徘徊立馬看尋常相見易倍覺別離難全守支耀卿飲餞七里倅楊仲宣復攜具至深溪酌別且乞余書走筆作此兼寄耀卿店舍煙火寒塵沙亭堠逺嫣紅糝藝緑春事亦巳晚年芳去踆踆江水來衮衮故人瀟湘逢留落一笑莞巳張七里飲更出深溪餞草間艷紅粉竹裏趣廚傳故意如許長由來共鄉縣愧我不能觴負此離歌囀別愁滿天末不醉何由遣却憶支使君風前白波捲深溪鋪中二絶追路寄呈元將仲顯二使君賀州歸去柳州還分路千山與萬山把酒故人都別盡今朝真箇出陽關只有南風捲路塵斷無南客送車輪故人合在瀟湘見却向瀟湘別故人戲題愚溪碧湍潄白石沄沄復湯湯既為人所愚安用爾許忙我昔曽經過重來巳三霜無事趼雙足奔走寧非狂溪流到江平翻笑客路長豈不有歲晚乞身還故鄉初泛瀟湘六槳齊飛急下灘碧琉璃上雪花翻越來溪色淸如此只缺磯頭一釣竿湘口夜泊南去零陵十里矣營水來自營道過零陵下湘水自桂林之海陽至此與營㑹合為一江我從淸湘發源來直送湘流入營水故人亭前合江處暮夜檣竿矗沙尾却從湘口望湘南城郭山川恍難紀萬壑千巖詩不遍惟有蒼苔痕屐齒三年瘴霧亦竒絶浮世登臨如此幾湖南山色夾江來無復瑶篸插天起坡陀狠石蹲淸漲淡蕩光風浮白芷騷人魂散若為招傷心極目春千里我亦江南轉蓬客白鳥愁煙思故壘逺遊雖好不如歸一聲鶗鴂花如洗南臺瑞應閣用壁間張安國韻衝雨上山頭臨雲看山腳松間一彈指開此寶樓閣草鞋方費錢拂子不暇握小偈出雷音千古驚猿鶴湘潭暮雨檣竿縣一灣長官立馬水雲間風吹江沫浮浮去誰在沙頭閉戶閒泊長沙楚秀亭雨從湘西來波動南楚門不知春漲髙但怪江水渾舟行風打頭陸行泥沒鞍且登裴公臺半日心眼寬題嶽麓道鄉臺山外江水黃江外滿城緑城外杳無際天低到平陸長煙貫楚尾逺勢帶吳蜀故園東北望遊子闌千曲寄題潭帥王樞使佚老堂孺子滄浪濯纓處千載新堂來卜鄰潦收無波徹底靜東湖之水堂中人濛陽花譜勝洛下竹西藥闌來海瀕新篁緑沉桂丹渥嶽立竒石蒼苔皴賞心滿眼伴閉戶天風夜下扶車輪胸中種蠡妙經濟鬢鬚白雪朱顔春蒼生未佚身朱老斯堂未可忘斯民四年西略可萬世孤撐獨立扛千鈞匹馬幡幡恃天日危言岌岌愁鬼神浮生蚤休信不惡持此欲去非吾聞客遊瀟湘逢騎吹知公巳為蒼生起公今少勞佚者多湛輩乃可寒江蓑王公自言堂去東湖頃步新得彭州牡丹揚州芍藥丹桂貓頭竹并徐氏五怪石列堂下湘隂橋口市別游子明馬首欲東舟欲西洞庭橋口暮寒時三年再別子輕去萬里獨行吾蚤衰遙憶美人湘水夢側身西望劒門詩老來不灑離亭淚今日天涯老淚垂竈渚白魚出水卧銀刀紫筍堆盤脫錦袍捫腹將軍猶未快棹船西岸摘蔞蒿大波林湖路荒寒又險艱大千空水我居間篙師晚始分南北指點靑靑漢口山連日風作洞庭不可渡出赤沙湖金沙堆前風未平赤沙湖邊波不驚客行但逐安穩去三十六灣漲痕生滄洲寒食春亦到荻芽深碧蔞芽靑汨羅水飽動荆渚嶽麓雨來昏洞庭大荒無依飛鳥絶天地惟有孤舟行慷慨悲歌續楚些倣佛幽瑟迎湘靈黃昏慘淡檥極浦雖有漁舍無人聲冬湖落􅍽此暫住春潦怒長隨傭耕吾生一葉寄萬木況復搖落浮滄溟漁蠻尚自有常處羈官方汝尤飄零寄題贑江亭陳季陵贑州書云新作此亭泉使李正之題其榜要豫詩二水之會新作亭主人文章子墨卿我記斯亭且不朽千載當與文俱鳴題榜誰歟漢使者風流好事飾儒雅平生兩君吾故人安得繫馬亭階下鼓旗西征上奔瀧所思不見心難降瞿塘縱有文鱗雙愛莫致之章貢江浯溪道中江流去不定山石來無窮步步有勝處水淸石玲瓏安得扁舟繫絶壁卧聽漁童吹短笛弄水看山到月明過盡行人不相識夜泊灣舟大風雨未至衡州一百二十里阿香攪客眠夜半驅疾雷空水受竒響如從船底來嘈嘈雨窗鬧軋軋風柁開睡魔走辟易耳界愁喧豗有頃飄驟過灘聲獨鳴哀燈婢燭囊衣篙師理檣桅煩擾到明發村雞亦喈喈泊衡州客裏仍哦對雨吟夜來星月曉還隂空江十日無春事船到衡陽柳色深步入衡山應有人家住隔溪緑隂亭午但聞雞松根當路龍筋瘦竹筍漫山鳳尾齊墨染深雲猶似瘴絲來小雨不成泥更無騎吹喧相逐散誕閒身信馬蹄重遊南嶽焚香鎮南殿過銓德觀醮注生祠庭觀道君玉符王七及八角玉印經方四寸許文曰注生真君玉印雨中登山遊南臺福嚴至瑞應擲鉢天柱諸峰之上寒甚病衰不至上封而返捨舟得馬如馭氣步入靑松三十里我從蠻嶺瘴煙來不怕雨雲埋嶽趾憶昔南征欵廟庭往來無恙神所祉當時巳有歸田願帝臨此心如白水煌煌南正館於東手握八觚溫玉璽駿奔灊霍左右輔好生不殺扶炎紀崇禋竣事曉壇空躋攀小試靑鞋底不知雲磴幾千丈但見漫山白龍尾石頭招我上南臺瑞應闌干天半倚福嚴鐘聲過橋來倣佛三生如夢裏堂中尊者巳先去苔鎖巖扉何日啓竹嫌磽確老逾瘦松畏髙寒蟠不起癯儒尚病怕深登幽討未窮行且止我評七十二髙峰鬱律穹窿少觀美儼然可瞻不可玩往往雄爭如負扆乃知嶽鎮蓋深厚不與他山爭秀偉區區獻狀眩兒童乳洞淡巖真戲耳四明人董嶧久居嶽市乞詩祝融峰下兩逢春雨宿風餐老病身莫笑五湖萍梗客海邊亦有未歸人三月十五日華容湖尾看月出雲銷澧陽風月生嶽陽水誰推赤金盤湧出白銀地徘徊忽騰上蹀蹀恐顚墜稍髙輪漸安飛彩到篷背晶晶浪皆舞靨靨星欲避兜羅世界網普現無邊際官居束戶庭有眼如幻翳向非行大荒寧有此巨麗乘除較得失漂泊非左計妻孥競歡譁渠亦知許事釣池口阻風迷失港道回風打船失西東柁癡櫓弱無適從三老號呼鐵纜墜招頭撾鼓驅魚龍千篙撐折百丈斷日暮稍與洪相通推移尋尺力千里時有黃帽來言功康莊大逵世不乏乃獨蹇産濤波中一官橫起險易相剎那憂喜隨兒童漲湖連天逺目斷且復加飯追萍蓬蒲團坐暖看香篆作止任滅如頑空鼎河口枕上作漂泊離巢燕彎跧負殼蝸瘦嫌莞席硬老覺畫屏奢報道帆當落傳呼鼓巳撾且投人處宿未到巳聞蟇安鄉縣西晚泊水闊鳥烏倦墟寒童僕飢一灣村縣過百折暮江遲曉夢孤燈見春隂病骨知簡書寧不畏旅力奈先疲澧陽江順流下沅江溯流上澧浦水深蘭芷寒漂搖憚風雨采采不盈掬何由寄逺渚洞庭浮天白遐矚莽吳楚有懷獨晤歎櫓聲與人語暮夜即維舟蒼茫定何許澧浦葦岸齊齊似碧城江船罨岸逆風行緑蘋白芷俱憔悴惟有蔞蒿滿意生澧江漁舍安鄉灃陽之間自兵火後瘡殘猶未復狡窟空來四十年沼江猶自少炊煙茫茫曠土無人問蘆荻春深緑滿川孫黃渡自此登陸至公安渡江過沙頭捨舟從陸更間關徑仄仍荒亦未乾棘刺近人牢閉眼泥塗兀馬緊扶鞍茶山盜藪路程惡麥壠人家懷抱寬擔僕輿夫盡劬瘁病翁那得更加餐潺陵舟橫攸河水馬滑潺陵道百里無鉏犁閒田生春草春草亦巳瘦栖栖晚花少落日見行人愁煙沒孤鳥老翁雪髯鬢生長識羣盜歸來四十年墟里迹如掃莫訝土毛稀須知人力槁生聚何當復兹事恐終老人言古戰場瘡痍猝難療誰使至此極天乎吾請禱將至公安前村後村啼杜宇伴人憂煎與人語雲寒日薄春一夢地闊天低淚如雨我馬虺隤我僕痡豈不懷歸畏簡書公安縣前酒可沽不如且聽提胡盧公安渡江食罷雨方作起行泥巳深伴愁多楚些吟病獨吳音莫怨馬蹄滑須愁𧖟事侵梅黃時節是未可決晴隂荆渚堤上原田何莓莓野水亂平楚大堤少人行誰與藝稷黍獨木且百歲骯髒立水滸當年識兵燼見赦幾樵斧摩挲欲問訊恨汝不能語薄暮有底忙沙頭聽鳴櫓渚宫野步題芳草草色沐新雨緑潤如得意披拂欲生煙苒苒著巾袂天涯各芳春秦吳千萬里故人攀桂枝今夕念游子發荆州自此登舟至夷陵初上篷籠竹笮船始知身是劒南官沙頭沽酒市樓暖徑步買薪江墅寒自古秦吳稱絶國于今歸峽有名灘千山萬水垂垂老只缺天西蜀道難虎牙灘又名金門十二倍屬夷陵傾崖溜雨色慘淡水墨畫辛夷碎花縣瘣木老藤挂翠莽楚甸窮黃流蜀江下一灘今始嘗三峽此其亞雨點鼓士摻雲騰挽夫跨驚心度石林破眼見村舍牛眠草色裏犬吠竹林罅步頭可檥船安穩睡殘夜峽州至喜亭斷崖卧水口連岡抱城樓下有吳蜀客檣竿立滄洲雨後漲江急黃濁如潮溝時見山峽船鐃鼓噪中流適從稠灘來白狗連黃牛渦濆大如屋九死爭船頭人鮓尚脫免虎牙不須憂初入峽山效孟東野自此登陸至秭歸峽山逼而峻峽泉湍以崎峽草如毨毛峽樹多樛枝峽禽惟杜鵑血吻日夜啼峽馬類黃狗不能長鳴嘶峽曉虎跡多峽暮人跡稀峽路如登天猿鶴不敢梯僕夫負嵎哭我亦呻吟悲悲吟不成章聊賡峽哀詩土門汙泥汨峻阪狠石卧中路睥睨無敢前趦趄屢却顧長繩引籃輿前挽後推去吏士更叫號作氣欲飛度顚墜較分寸商略營蹞步須臾氣亦竭一一汗如雨桃花鋪老蕨漫山鳳尾張靑楓直幹如攢槍山深嵐重鼻酸楚石惡淖深神慘傷隂崖風生吹客急草中枯株似人立昳晡卓幕先下程將士黃昏始相及覆盆鋪三登三降岡始斷一步一休日欲斜濁酒半瓶不得暖覆盆有鋪無漿家小望州峰頭髙絶鄰四瞰若窺井小山萬蟻垤大山拊其頂叢霄一握近罡風振衣冷似聞天人語笑我雪垂領曩侍玉案香委佩太淸境獨下赤城戲俯仰一枰頃豈其厭晨華嗅此腥腐鼎揮手謝天人伶俜愧孤影來償繭足債尚缺界天嶺老矣且倦遊歸期行可請大望州望州山頭天四低東瞰夷陵西秭歸峽江微茫細如帶江外千峰靑打圍黃牛廟磯石如劈想看驚湍虎鬚白水行陸走俱險艱安得如鳥有羽翼一百八盤疇昔辭桂林自謂巳出嶺蛻蟬蠻煙中恍若醉夢醒今來峽山路步步躡雲頂仍聞蚯蚓瘴顧與嶠南等平生行路難驚浪兀漂梗迷塗兹益逺鳥道非人境老矣法當佚懷哉跡可屏拜手天東南亟上歸田請火墨坡下嶺淸晨入岑蔚嵐重寒颼飀忽聞黃鸝語方悟麥始秋旅食法當瘦逺行人所愁況復深山中不與和氣游苦辛那敢憚病悴良可憂徒憂亦無益聊作商聲謳八場平聞猿淸猿泠泠鳴玉簫三聲西聲髙樹梢子母聯拳傳枝去忽作哀厲長鳴號天寒林深山石惡行人舉頭雙淚閣雪澗琴心未足悲須寫峽中腸斷時琴曲有雪澗聞猿鑽天三里非岡非嶺復非坡黃鵠不度吾經過妻孥下行啼且笑聯手相攜如踏歌風吹汗乾人力盡屐齒與石方相磨鑽天三里似千里四十八盤將奈何蛇倒退山前壁如削山後崖復斷嚮吾達隴首如海到彼岸那知下嶺處栗甚履冰戰牽前帶相挽縋後衣盡綻健倒輒尋丈徐行厪分寸上疑緣竹竿下劇滚金彈豈惟蛇退舍飛鳥望崖反稍喜一徑平猶有千石亂仍逢新燒畬約略似耕畔心知人境近顰末百憂散山民茆數把鬼質犢子健腰鑱走迎客再拜復三歎謂匪人所蹊官來定何幹儻為飢火驅平地豈無飯意者官事迫如馬就羈絆我乃不能答付以一笑粲大丫隘峽行五程無聚落馬頭今日逢耕鑿麥苗踈瘦豆苗稀椒葉尖新柘葉薄家家婦女布纏頭背負小兒領垂瘤山深生理却不乏人有銀叉一雙插石湖居士詩集卷十五
