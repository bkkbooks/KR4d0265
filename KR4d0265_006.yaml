front:
  text: 石湖居士詩集卷六
  hash: sha256:526014926f043316b4c13a76bcc5112f1cbd25f08bfc475e605109d56093a48d
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0265_SBCK_006-1a}
body:
  text: 次韻溫伯謀歸官路驅馳易折肱官曹隨處是愁城隨風片葉鄉心動過雨千峰病眼明一臠何須嘗世味寸田久巳廢吾耕羡君早作歸歟計屈指從今幾合并次韻溫伯雨涼感懷窮士病且飢古今同一流身安腹果然此外吾何求判司誠卑官未免塵甑憂窮山更疸暑憊卧不舉頭二物交寇我生世真如浮晨朝墨雲作疾雷破山丘排簷忽飛溜蛙蟈鳴相酬朱冠領熱屬橫潰輸一籌新涼蘇肺氣踏濕登城樓好邀雲雨仙長袖按梁州吹水添瓶罍淨洗千斛愁何從有此段冰廳冷如秋但覺詩思生爽氣入銀鈎章成竟何用知能救窮不湯子亦旅食回望家還羞倡豫敢不和共作商聲謳次韻子文雨後思歸斷雲將雨洗松篁昨夜癡龍起蟄藏人自無情孤樂事天猶有意作新涼尊前不見凌波襪樓下空聞拜月香萬事安能盡如願且來相伴壓糟牀次韻溫伯苦蚊白鳥營營夜苦飢不堪薰燎出窗扉小蟲與我同憂患口腹驅來敢倦飛慶充自黃山歸索其道中詩書一絶問之鳴騶如電馬如雷知是婆娑醉尉回常日錦囊猶有句況從三十六峰來曉出古城山落月墮眇莽殘星淡微茫竹輿亂淸溪飛蓋入嵐光松檜霧靄濕桑麻風露香空翠滴塵纓何必濯滄浪山家亦早作逮此朝氣涼林深無人聲木末炊煙蒼離離瓜芋區肅肅棗栗場田園古云樂令我思故鄉墟市稍來集筠籠轉山忙吏事亦挽我歸路盤朝陽李深之西尉同年談吳興風物再用古城韻李侯昔遊吳蓮舟鏡蒼茫風鬟與霧鬢共濯玻璃光采花不盈舫日暮雲水香還登縹眇樓羅襟酒淋浪卷箔納星月踏筵按伊梁安知有恨事但恐蒹葭蒼風吹落窮谷草深麋鹿場髙岡苦炎熱遊子悲異鄉尚喜簡書省期會無匆忙猶餘作詩苦消瘦如東陽七月五日夜雨快晴豐隆坎坎夜伐鼓靈湫老龍撇波舞褰雲掣電上淸空倒捲天潢作飛雨向來炎官作夏旱萬里彤霞烘玉宇豈惟牛馬困蚊虻壠上行人口生土我從雪浪葉舟來不謂山城熱如許天公知我愁欲病施與一涼蘇逆旅稍聞水繞屋除鳴不覺星從雲罅吐千山濯濯淨鬟髻缺月姢姢炯睂嫵浮生此景萬事足但欠淸歌對芳醑天上秋期正多事趣駕星橋跨銀渚人間四者自難并莫妒黃姑迎織女次韻宗偉溫伯冉冉流光迫歲餘靑林日夜向人踈雨滋巖桂重堆粟新安木犀秋暮再花風折庭蕉又獻書逋客解蘭思婉娩先生彈鋏厭淸虛一塵不立渾輸我即境心安是故廬宗偉新議婚溫伯病起無聊故有解蘭彈鋏之語再韻答子文浮生飽外莫求餘羈旅東來計巳踈肩聳巳髙猶索句眼明無用且翻書百年子莫占元緒萬法吾今付子虛惟有登臨心未厭黃山聞道勝衡廬道見蓼花秋風裊裊露華鮮去歲如今刺釣船歙縣門西見紅蓼此身曽在白鷗前次韻溫伯種蘭靈均墮荒寒采采紉蘭手九畹不留客髙丘一回首崢嶸路孔棘悽愴肘生柳遂令此粲者永與窮愁友不如湯子逺情事只詩酒但知愛國香此外付烏有栽培帶苔蘚披拂護塵垢孤芳亦有遇灑濯居座右君看深林下埋沒隨藜莠次韻子文幻塵久巳破狐涎身世誰能料鼠肝暮夜雨收千嶂出晨朝風卷四維寬我今無事不如夢君豈有心猶覓安但促小槽添壓石龍頭珠滴夜珊珊次韻知郡安撫九日南樓宴集三首雙旌暮捲小舂容畫棟雲生笑語中但覺山光侵酒緑不知日腳染溪紅控臨縹眇疑無地指點虛無欲馭風誰遣玉蟾催騎吹歸來人影在朦朧珠履參陪北海觴仍邀擁節舊中郎碧城香霧連天暝黃葉霜風捲地涼佳節轉頭論聚散淸波從古閲興亡明年重把茱茰醉公在叢霄貢玉堂斯民鄒魯更豐年雅道凄涼見此賢萬隴登禾新霽色千村鳴柝舊寒煙鏘金絶世詩情妙倚劒凌空隸墨鮮太守新題南樓榜珍重北窗山六六使君名與汝俱傳晚集南樓浪隨兒女怨萍蓬笑拍闌干萬事空宇宙勳名無骨相江山得句有神功掉頭莫覻秋髙鶚留眼來賔日暮鴻懶拙巳成三昧解此生還證一圎通賞雪騎鯨軒子文夜歸酒渴侍兒薦茗飲蜜漿明日以詫同遊戲為書事邀宗偉同作溪山四時佳今日更竒絶天公妙莊嚴施此一川雪飛花浩如海眩轉塞空闊水西萬珠樹玉塔照銀闕碧溪不受凍長灘瀉淸咽漁舟晚猶泛樵簷寒未歇懸知畫不到未省詩能説歸來強搜句冰硯冷於鐵不知嚴夫子迎門生暖熱梅香不可耐梅即侍兒小名但覺酒腸暍蜜融花氣動茶泛乳膏發寧辭春笋寒為暖花瓷滑瞢騰畫屏暖喚起眼餘纈笑我獨何事作此淡生活想像髙唐賦何如徑排闥從聖集乞黃巖魚鮓截玉凝膏膩白點酥粘粟輕紅千里來從何處想看舶浪帆風從宗偉乞冬筍山藥竹塢撥沙犀頂鋭藥畦粘土玉肌豐裹芽束緼能分似政及萊蕪甑釜空雪後守之家梅未開呈宗偉瓦溝凍殘雪簷溜粘輕冰破寒一竿日春隨人意生端葉再三白南枝尚含情定知司花女未肯嫁娉婷官居苦無賴一笑如河淸落木露荒山寒溪繞孤城朝暮何所見雲黃叫飢鷹東風不早計愁眼何當明北鄰小橫斜蘚地可班荆憑君趣花信把酒撼瓊英次韻溫伯城上閉戶成癡坐扶藜得意行樓臺浮霽色市井碎春聲雪盡小橋出煙消千嶂生病多無腳力遙羡落鴻輕知郡安撫以立春日揭所書新安郡榜南樓之上曉雪紛集邦人以為善祥遂開宴以落之輒賦長句一篇以附風謡之末碧瓦朱甍上牛斗妙墨新題森鎖鈕使君筆力挽春來一夜飛花暗梅柳南山與樓相對髙向來千載爭雄豪八分三字一彈壓衆峰戢戢如兒曹人間盛事天不隔急催此雪成三白未論千古福邦人先卜明年滿岡麥東風酒面吹凝酥不辭醉倒歸相扶短歌萬一傳樂府湛輩亦與公名俱次韻知郡安撫元夕賞倅廳紅梅三首春入林梢一再風破寒勻染費天工雖然媚蕩新粧別只與橫斜舊格同午枕乍醒鉛粉退曉奩初罷蠟脂融後來顔色休論似夾路漫山取次紅真色生香絶世逢煙光池面雨溶溶楚鄰不待施朱好虢國翻嫌傅粉濃晴日曖雲春照耀溫風霽月夜舂容酒闌且駐紗籠看慢破團團一壁龍司花一笑為誰開知道朱幡得得來踈影有情當洞戶蔫香無語墮空杯風生翰墨留連看月入笙歌次第催來歲如今翻舊唱五雲叢裏望三台新安絶少紅梅惟倅廳特盛通判朝議召幕僚賞之坐皆有詩亦賦古風一首華燈收盡江梅落別有橫枝照林薄天教閬苑染芳根小住山城慰蕭索騰騰醉後酒紅醺淡淡粧成笑靨新斟酌東君巳傾倒為渠都費十分春別乘胸懷有風月催喚淸尊洗愁絶花知主客得不凡一夜光風融綘雪樓頭煙暝吹單于花梢挂星光有無歸來境熟落春夢夢入鎖香紅綺疏胡宗偉罷官改秩舉將不及格往謁金陵丹陽諸使者遂朝行在頗有倦遊之歎作詩送之凍雲埋山天冥濛北風無情雪塞空道傍人稀鳥飛絶問君東遊何匆匆君言薄官淡無味免俗未能聊復爾我評兹事一鴻毛因行且看佳山水陵陽樓閣壓髙城煙屏百疊雙流橫宣城疊嶂樓雙溪閣姑孰江亭更竒絶濃黛兩抹長睂靑當塗蛾睂亭望東西梁山如雙睂山形成龍復成虎六代遺蹤供弔古謂金陵鍾山石頭大荒莽蒼江水黃雨淚風煙眇吳楚賞心亭雨花臺所見却浮一葦下長川浮玉低昂波聒天長蘆真州寺浮玉丹陽金山也梁溪南岸小停櫓一酌人間第二泉無錫惠山陸子泉閶門峨峨過吾國姑蘇僕故里閶門北門也姑蘇臨波照金碧太湖三萬六千頃上有垂虹跨南極吳江長橋三髙亭鴟夷子在焉我家越相尚神遊試從煙浪訪扁舟問訊白鷗相記否謂言久客不勝愁軟紅三尺長安道九重城闕乾坤繞西湖山寺浙江樓君昔曽遊今更好故人客館中天開非君誰上黃金臺挽著天衢五雲上却望江湖如夢回萬境何如一丘壑幾時定解冠裳縛幔亭山下桂叢深淸社向來都寂莫幔亭淸社皆宗偉舊隱故事黃伯益官舍賞梅一杯何處洗愁顔黃法曹家玉樹寒翠袖撚香留客看春風都在小闌干次韻朱嚴州從李徽州乞牡丹三首佳人絶世墮空谷破恨解顔春亦來莫對溪山話京洛碧雲西北漲黃埃歙浦煙山蟠萬疊釣臺雲日擁千章兩侯好事洗寒寶檻移春入燕香閬風苑裏司花女肯作山腰水尾來十二玉欄天一笑只今歸路五雲開時傳使君有召命送琴客許揚歸永嘉烏帽休衝九陌埃瘦藤定約到秋回龍湫鴈蕩經行處斷取松風萬壑來送李徽州赴湖北漕徂徠千丈松閲世聳絶壁髙標上霄漢峻節貫金石惟有孤生竹亭亭附微植月夜借淸景春朝分秀色託根未渠央萬牛挽山澤昂藏轉江湖夷路入王國明堂五雲上一柱屹天極可望不可攀淸都與塵隔依然此淸士空山淡愁閴悲吟發淸籟搖蕩風雨夕送通守林彥強寺丞還朝鴈蕩之山天下無奔岸絶壑不可圖地靈境秀有人物新安府丞今第一紛綸草木變暄寒竹節松心故凜然窮山薄宦我無恨識公大勝荆州韓梅風漲溪緑如酒曉插檣烏上南斗只今廣厦論唐虞斟酌正須醫國手秀睂津津雙頰丹想看鳴佩翔九關諸公倘欲持公議莫遣此賢思故山送溫伯歸福唐納婦且約復遊霅川攬秀堂前一笑傾都忘身世兩浮萍扶藜處處從君賞落筆時時得我驚荔熟閩山勞夢想蘋香苕水約逢迎袛愁誤入桃源後從此車輪四角生次韻宗偉閲番樂十日間愁晝掩關起尋一笑共淸歡罷休詩社工夫淡洗淨書生氣味酸盡遣餘錢付桑落莫隨短夢到槐安繡鞾畫鼓留花住賸舞春風小契丹題漫齋壁漢隂無械可容機歲晚功名一衲衣稿木間身隨念懶浮雲幻事轉頭非三彭巳罷庚申守五鬼從教乙丑歸富貴神仙兩俱纍此心安處是真依四月十六日拄笏亭偶題轉午聞雞日正長小亭方丈納空光緑隂一雨濃如黛何處風來百種香次韻即席留連銀燭照金荷腸斷華年一擲梭月姊有情難獨夜天孫無賴早斜河晶晶霜瓦寒生粟衮衮風幃細湧波鴰鶡曉啼鳴鵲散許多佳景奈愁何五月聞鶯二首桑隂淨盡麥頭齊江上聞鶯每歲遲不及曉風鵯鵊子迎春啼到送春時一聲初上最髙枝忙殺嘔啞百舌兒老盡西園千樹緑却憐槐眼正迷離知郡檢計齋醮禱雨登時感通輒賦古風以附輿頌六月火雲髙偃蹇使君有意憐焦卷一封紅篆驛金龍雨氣倐隨爐燎滿風師避路雷車鳴石破天驚簷溜傾不知稻本頗蘇否但覺溪聲如百霆稅駕朱幡未云久造化功成屈伸肘我評兹事與天通知公小試調元手淸壇深夜賔衆真前驅霓旌後飈輪定有靈官識仙伯報道紫皇思侍臣石湖居士詩集卷六
