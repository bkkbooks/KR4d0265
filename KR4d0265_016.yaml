  text: 石湖居士詩集卷十六
  hash: sha256:085309bf249b41f951c50ee5598785207d550bda4d806de79dba5c31040bd4f2
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0265_SBCK_016-1a}
body:
  text: 麻線堆峽口驛前大山崛起舊路攀援而上縈紆如線十五年前浮圖德寶始沿澗伐木作新路不復登山余觀峽路皆未嘗經修感德寶之事作麻線堆詩一首以風夔路使者及歸峽二州長吏沈葉管熊四君雲木蕩胸起鬱峩一峰危上有路千折縺縷如縈絲是為麻線堆厥險天下稀逼仄容半足顚墜寧復稽騰猱尚愁苦遊子將安之浮屠德寶者悲智緒等慈隨山刊古木尋壑得長磯輿梁捷飛度布石綿階梯自從新路改重趼無齎咨縣有孫少府琬琰􅥵文詞勿云此事小惟有行人知況觀峽山路由來欠平治官吏既弗迹誰肯深長思天險固自若當令略成蹊土工運畚鍤石工操鑿椎烈火敗磽確築沙填隙巇多用百夫力逺無五旬期但冀米鹽給不煩金幣支非客敢竊議道傍詢旄倪身雖雪山戍亦願助毫釐工費嗟小哉政須賢有司東有管夷陵西有葉秭歸上維沈隱侯夔臺今吏師下維熊繹孫長材佐州麾豈吾金閨彥不如林下緇懸知議克合了此一段竒舟楫避潢潦置郵疾飛馳憧憧吳蜀客來往當無時仍磨鑽天石大書四賢詩不佞願秉筆逺寄峽口碑戲書麻線堆下一身半世走奔波疑是三生宿債多折券巳饒麻線嶺責償難免竹竿坡胡孫愁傾崖當胸石齧足失勢毛氂稿幽谷王孫却走斷不到惟有哀猿如鬼哭僕夫酸嘶訴塗窮我亦付命無何中悲風忽來木葉戰落日虎嘷枯竹叢判命坡鑽天嶺上巳飛魂判命坡前更駭聞側足三分垂壞磴舉頭一握到孤雲微生敢列千金子後福猶幾萬石君早晚北窗尋噩夢故應含笑老榆枌千石嶺晨光挂髙嶺晴色媚逺客哀湍吼叢薄宿霧裊絶壁露重薊花紫風來蓬背白迷塗朴渥跳飲澗於菟迹層巔多折木迮磴有飛石不知山幾重杳杳入叢碧九盤坡布水莫惜縈回上九盤洗心雙瀑雪花寒野翁酌水煎茶獻自古人來到此難荒口十步九喫蹶百夫半􅩚􅘐豁然鳥道窮努力造其巔謂是嶺頭了一峰復當前既無反顧法仰望心茫然四十八盤詰曲不前如宦拙欹傾當面似交難若將世路比山路世路更多千萬盤紫荷車峽山此藥甚多緑英吐弱線翠葉抱修莖矗如靑旄節草中立亭亭根有却老藥鱗皺友松苓長生不暇學聊冀病身輕錦帶花東南甚珍此花峽中漫生山谷妍紅棠棣粧弱緑薔薇枝小風一再來飄颻隨舞衣吳下嫵芳檻峽中滿荒陂佳人墮空谷皎皎白駒詩入秭歸界山根繫馬得漿家罙入窮鄉事可嗟蚯蚓祟人能作瘴茱茰隨俗強煎茶幽禽不見但聞語野草無名都著花窈窕﨑嶇殊未艾去程方始問三巴早發周平驛過淸烈祠下屈平祠也祠前有獨醒亭物色近人境喜歡嚴曉裝山月雞犬聲野風麻麥香登嶺既開豁入林更淸涼三呼獨醒士儻肯釂我觴白狗峽陸路亦自峽上過西岸有玉虛洞江紋圓復破樹色昏還明連灘竹節稠洶怒奔夷陵石磯鐵色頑相望如姦朋踞岸意不佳當流勢尤獰山回水若盡但見靑竛竮慘慘疑鬼寰幽幽無人聲顚沛安危機艱難古今情俯窺得目眩却立恐神驚白雲冒巖扉下維玉虛庭神仙坐閲世應笑行人行秭歸縣周封楚子熊繹於此縣宇宋玉宅東山淸烈祠屈原宅也永日貪程客長年弔古詩悲秋荒故宅負石慘空祠峻壁鴉翻倦髙畬麥秀遲窮山熊繹國逼仄建邦時歸州竹枝歌二首東鄰男兒得湘纍西舍女兒生漢妃城郭如村莫相笑人家伐閲似渠稀東岸艬船拋石門西山炊煙連白雲竹籬茅舍作晚市靑蓋黃旗稱使君昭君臺在興山界中鄉人憐昭君築臺望之下有香溪然三峽女子十人九癭天生尤物元無種萬里巴村出靑冢髙臺望思臺巳荒東風溪漲流水香嬋娟鍾美空萬古翻使鄉山多醜女灸睂作瘢亦不須人人有癭如瓠壺人鮓甕在歸州郭下長石截然據江三之二水盛時濆淖極大號峽下最險處東岸即屈原宅自此復登舟至巫山懷沙祠下鐵色磯中流束湍張禍機與齎俱入彼可弔乘流而下吾亦危江河難犯一至此天地好生安取斯朝歌勝母古尚諱我其覆醢航秭歸巴東峽口水宿頻欹側徒行又險艱舟危神女峽馬瘦鬼門關照夜燒畬隴緣雲種笮山催成頭雪白休説鬢絲斑初入巫峽鑽火巴東岸摐金峽口船束江崖欲合潄石水多漩卓午三竿日中間一罅天偉哉神禹迹疏鑿此山川將至巫山遇雨數日快晴水落丈餘舟人方以為喜雨作即水又長矣峽行水落惟憂雨通昔淋浪怨行旅千山萬山生白煙陽臺那得雲如許箋詞騰告翠帷仙丐我一晴翻手間放開十二峰頭色重賦碧叢髙插天巫山髙并序余舊嘗用韓無咎韻題陳季陵巫山圖考宋玉賦意辨髙唐之事甚詳今過陽臺之下復賦樂府一首世傳瑶姬為西王母女嘗佐禹治水廟中石刻在焉濕雲不收煙雨霏峽船作灘梢廟磯杜鵑無聲猿叫斷惟有飢鴉迎客飛西真功髙佐禹迹斧鑿鱗皴倚天壁上有瑶簪十二尖下有黃湍三百尺蔓花虯木風煙昏蘚珮翠帷香火寒靈斿飄忽定何許時有行人開廟門楚客詞章元是諷紛紛餘子空嘲弄玉色頩顔不可干人間錯説髙唐夢刺濆淖并序濆淖盤渦之大者峽江水壯則有之或大如一間屋相傳水行峽底遇暗石則濆起巳而下旋為渦然亦未嘗有定處或無故突然而作叵測也舟行遇之小則欹傾大則與齎俱入險惡之名聞天下峽江饒暗石水狀日千變不愁灘瀧來但畏濆淖見人言盤渦耳夷險顧有間仍於非時作未可一理貫安行方尉縠無事忽翻練突如湯鼎沸翕作茶磨旋勢迫中成窪怒霽外始暈巳定稍安慰倏作更驚眩漂漂浮沫起疑有潛鯨噀勃勃駭浪騰復恐蟄鼇抃篙師瞪褫魄灘戶呀雨汗逡巡怯大敵勇往決鏖戰幸免與齎入還憂似蓬轉驚呼招竿折奔救竹笮斷九死船頭爭萬苦石上牽旁觀兢薄冰撇過捷飛電前余叱馭來山險固嘗遍今者擊楫誓豈復憚波面澎澎三峽長颭颭一葦亂既微掬指忙又匪科頭慢天子賜之履江神敢吾玩但催疊鼓轟往助雙櫓健嘲峽石并序峽山江濱亂石萬狀極其醜怪不可形容舉非世間諸所有石之比走筆戲題且以紀異峽山狠無情其下多醜石頑質賈憎垂傀狀發笑啞粗類墳壤黃沉漬鐵矢黑或如溝泥涴或似凍壁坼堆疑聚廩粟陊若壞城甓槎牙鏤朽木狼籍委枯骼礧砢包螺蚌淋漓錮鉛錫縱文瓦溝壠橫疊衣摺襞鱗皴斧鑿餘坎窞蹴踏力云何淸淑氣孕此詭譎迹我本一丘壑嗜石舊成癖端溪紫琳腴洮河緑沉色階册截肪膩泗磬鳴球擊嵌空太湖底偶立韶江側真陽􅥵千巖營道剷寸碧倦遊所閲多未易一二籍朅來兹山下刺眼昔未覿或云峽多材竒秀鬱以積絶代昭君村驚世屈原宅東家兩兒女氣足豪萬國山石何重輕奚暇更融液我亦味其言作詩曉行客勞畬耕并序畬田峽中刀耕火種之地也春初斫山衆木盡蹶至當種時伺有雨候則前一夕火之藉其灰以糞明日雨作乘熱土下種即苗盛倍收無雨反是山多磽確地力薄則一再斫燒始可藝春種麥豆作餅餌以度夏秋則粟熟矣官輸甚微巫山民以收粟三百斛為率財用三四斛了二稅食三物以終年雖平生不識粳稻而未嘗苦飢余因記吳中號多嘉榖而公私之輸顧重田家得粒食者無幾峽農之不若也作詩以勞之峽農生甚艱斫畬大山巔赤埴無土膏三刀財一田頗具穴居智占雨先燎原雨來亟下種不爾生不蕃麥穗黃剪剪豆苗緑芊芊餅餌了長夏更遲秋粟繁稅畝不什一遺秉得饜餐何曽識粳稻捫腹嘗果然我知吳農事請為峽農言吳田黑壤腴吳米玉粒鮮長腰匏犀瘦齊頭珠顆圓紅蓮勝雕胡香子馥秋蘭或收虞舜餘或自占城傳早秈與晚䆉濫吹甑甗間長腰米狹長亦名箭子齊頭白圓淨如珠紅蓮色微赤香子亦名九里香斗米入數合作飯芳香滿案舜王稻焦頭無鬚俗傳瞽瞍燒種以與之占城種來自海南䆉稏秈禾價最賤以上皆吳中米品也不辭春養禾但畏秋輸官姦吏大雀鼠盜胥衆螟蝝掠剩增釜區取盈折緡錢兩鍾致一斛未免催租瘢重以私債迫逃屋無炊煙晶晶雲子飯生世不下咽食者定遊手種者長流涎不如峽農飽豆麥終殘年巫山縣自此復登陸至夔門縣前掉石灘最險登岸以過舟謂之盤灘城樓曰髙唐門此去瞿唐不百里縣人以郭西流石堆為水信流石沒則灔澦如馬矣借馬巫山縣盤舟掉石灘梅肥朝雨細茶老暮煙寒門對髙唐起江從灔澦難流堆三尺在旅夢一枝安自巫山遵陸以避黑石諸灘大雨不可行泊驛中一日吏士自秭歸陸行者亦會巫山信是陽雲臺客行五日雲不開隂晴何常有朝暮夜雨少休明復來今朝水長不知數沒盡山根蒼石堆東磯西磯盡如削大灘小灘俱若雷不知瞿唐復何似想見萬頃淙一杯袛今水劑巳壯矣聞道陸程尤艱哉摩圍隘口石生角踏颯坡前泥似醅眼前安得故園路江沙江草便靑鞋燕子坡大山如牆缺小山如塜纍衆山直下看方知此峰危木末見夔峽一溝盎春泥中有天下險造化真兒嬉峰頂不滿笑舟中鬢成絲登髙尚超覽況乃絶俗姿鬼門關天作隴頭石闕人言要隔塵樊百年會須作鬼無事先穿鬼關離巫山好晴午後入瞿唐關憩髙齋半日一昨題詩訴苦霖果然連夜卷曽隂盡收行雨瑶姬賜不徇世情巫峽心喜鵲滿枝朝日淡哀猿何處宿雲深水門山徑髙齋外一枕淸風屏萬金髙齋即杜詩所謂暝色延山徑髙齋次水門者灔澦堆灔澦之石誰􅥵鐫惡駭天下形眇然客行五月潦始漲但見匹馬浮黃湍時時吐沫作濆淖灂灂有聲如粥煎蜀江西來巳無路鑿山作澮方成川瞿唐之口狹如帶乃欲納此江漫漫奔流下赴故逼仄汝更爭道當其前舟師欹傾落膽過石孽水禍吁難全山川丘陵皆地險惟此險絶餘難肩東坡筆端喙三尺願與作賦評嘲喧云非此石峽更怒臼頭忽作傾城妍我從巫山飛一棹歡喜偶脫蛟龍涎是非信否未暇詰且上髙齋淸晝眠夔州竹枝歌九首五月五日嵐氣開南門競船爭看來雲安酒濃麴米賤家家扶得醉人回赤甲白鹽碧叢叢半山人家草木風榴花滿山紅似火荔子天涼未肯紅新城果園連瀼西枇杷壓枝杏子肥半靑半黃朝出賣日午買鹽沽酒歸癭婦趂墟城裏來十十五五市南街行人莫笑女粗醜兒郎自與買銀叉白頭老媪篸紅花黑頭女娘三髻丫背上兒眠上山去採桑巳間當採茶百衲畬山靑間紅粟莖成穗豆成叢東屯平田粳米軟不到貧人飯甑中白帝廟前無舊城荒山野草古今情只餘峽口一堆石恰似人心未肯平灔澦如朴瞿唐深魚復陳圖江水心大昌鹽船出巫峽十日溯流無信音當筵女兒歌竹枝一聲三疊客忘歸萬里橋邊有船到繡羅衣服生光輝雲安縣春暮子規少日斜紅鵠飛兩山多布水一島幾柴扉蚓吐無窮壤人行不斷磯巴陽昨夜雨灘上水先肥杜子美詩云涪萬無杜鵑雲安詩云終日子規啼今萬州界固不聞杜鵑而雲安巳自少矣紅鵠飛時滿背純赤或云即黃鶴也峽中蚯蚓之盛無如雲安江濵墳壤戢戢無際又多大石岸有一石長里許者杜子美詩云禹功多斷石其實甚長兩山間雨後瀑泉數十百處尤可觀萬州自此後登陸州號南浦郡晨炊維下巖晚酌檥南浦波心照州榜雲腳響衙鼓前山如屏牆得得正當戶西江朝宗來循屏復東去此萬州形勢也惟親歷者當知此言之工官曹倚巖棲市井喚船渡瓦屋仄石磴猿啼鬧人語剔核杏餘酸連枝茶剩苦窮鄉固瘠薄陋俗亦寒窶土人賣杏皆先剔其核取仁以為藥也土茶甚苦不簡枝葉雜茱茰煎之營營謀食艱寂寂懷甎訴昔聞吏隱名今識吏隱處橫溪驛感懷行遍天涯與地隅筋骸那比十年初朱顔有酒且留住白髮無方能掃除未得歸田先作賦專攻種樹巳成書只今飛到南山下猶解淸晨出荷鋤午夜登嶓山疸暑嚴夜􅋔乘涼躡危嶠猿依黑林號鬼閃靑炬嘯驚鳥動危葉吟蟲滿荒草泉聲逺相隨山色近如杳夢猶風燈前身巳雲木杪浮生固有役逺道何時了豈惟失寢興亦自倒昏曉恭惟天心仁頗議民力稿我懷漢制詔來慰蜀父老熙如春臺登沃若時雨膏須知簡書急勿厭蓐食早但勤筆力淬時助詩腸攪峽石鋪由萬州至此山頂皆有長石如城壁亘數峰不斷峽山至是亦稍開廣間有稻田峰頭壁立偉天造萬雉石城如帶繞山骨鱗皴火種難山下流泉却宜稻新秧一稜緑茸茸茅花先秋雪搖風后皇嘉種不易熟野草何為攙歲功蟠龍嶺自峽歸夔萬至於梁山五郡間不知其幾嶺梁山之蟠龍峰門尤為髙峻然下嶺即有平陸吏卒皆相賀云夷陵至􅓃䏰復嶺苦絲亂初程尚勇往少日還委頓安得長劒揮盡剷疊嶂斷雖云北山愚聊快南溟運此意竟蕭索勞歌謾淒曼日日望平陸念念到彼岸人言束馬險但欠蟠龍峻摧頽強弩末黽勉焚舟戰譬如巳償逋猶有未折券山根治曉􅋔峰頂寄朝飯稍脫蚓瘴染還探虎窠玩性命乃可憂筋力何足算嶺半途有饅頭山以形得名其上多鷙獸土人謂之虎窠蟠龍瀑布自山頂漫汗淋漓分數道而下望之宛從天降當為城中布水第一銀漢來從左界天天風吹浪落蒼巔人間只見秧田潤喚作蟠龍洞裏泉峰門嶺遇雨泊梁山窮鄉誰與話悲酸駐馬看雲強自寬酒力無端妨宿病詩情不淺任塵官虎狼地僻炊煙晚風雨天低夏木寒行盡峰門千萬丈梁山鼓角報平安􅼝䢹驛大雨暮雨連朝雨長亭又短亭今朝騎馬怯平日繫船聽竹葉垂頭碧秧苗滿意靑農疇方可望客路敢遑寧墊江縣屬忠州靑泥沒髁僕頻驚黃漲平橋馬不行舊雨雲招新雨至髙田水入下田鳴百年心事終懷土一日身謀且望晴休入忠州爭米市暝鴉同宿墊江城巾子山又雨百日籃輿困局跧三晨泥坂兀躋攀晚晴幸自墊江縣今雨奈何巾子山樹色於人殊漠漠雲容憐我稍班班如今只憶雪溪句乘興而來興盡還鄰山縣山頂噓雲黑似煙修篁髙柳共昏然鳥啼一夜勸歸去誰道東川無杜鵑沒冰鋪晚晴月出曉復大雨上漏下濕不堪其憂晚色熹微暖似薰兒童歡喜走相聞無端星月照濕土依舊山川生雨雲吳諺曰星月照濕土明朝依舊雨蓋雨後微晴星月燦然必復雨占之每驗旅枕夢寒涔屋漏征衫潮潤冷爐熏快晴信是行人願又恐田家曝背耘金山嶺阪峻身頻偃崖深首屢回雲浮平地出路拂半天來但閲關山過都忘歲月催湘南初上馬猶插早春梅金山嶺險峻多古梅明日至鄰水又雨昨日方無雨今朝又不晴滿山皆屐齒隨處有泉聲頗怪隂霖差應催老病成泥塗千騎士與我共勞生殘夜至峰頂上片月挂髙嶺我行至其巔舉手欲攬擷恐驚乘鸞仙菲菲桂香動肅肅露腳寒北斗巳到地南斗猶闌干但聞浮黎音來從始靑天大星與之俱曉色明旗幡素煙渺陸海中有人所寰想見地上友啓明膏火煎星落玉宇白日生綺霞丹冰輪未肯去相看尚團團望鄉臺千山巳盡一峰孤立馬行人莫疾驅從此蜀川平似掌更無髙處望東吳蚤晴發廣安軍晚宿萍池村莊夜雨洗煩蒸曉風薦淸穆雲頭隤鐵山日腳迸金瀑暑塗一日涼逺客萬事足羈人正奔波觀者何陸續翠蓋立嚴粧靑裙行跣足俗陋介南徼物華入東蜀竹萌苦巳靑荔子酸猶緑修蘆密成籬直柏森似纛泥乾馬蹄鬆路坦亭堠速暮投何人莊窗戶暗修竹巴蜀人好食生蒜臭不可近頃在嶠南其人好食檳榔合蠣灰扶留藤一名蔞藤食之輒昏然巳而醒快三物合和唾如膿血可厭今來蜀道又為食蒜者所薰戲題旅食諳殊俗堆盤駭異聞南餐灰薦蠣巴饌菜先葷幸脫蔞藤醉還遭胡蒜熏絲蓴鄉味好歸夢水連雲嘉陵江過合州漢初縣下井徑東川縣山河古合州木根拏斷岸急雨沸中流關下嘉陵水沙頭杜老舟江花應好在無計會江樓新晴行郪水上與涪江相近塗泥初乾雨不落日色未出暑光薄畏途得晴天復涼真是腰錢更騎鶴渾渾郪水流未平悄悄涪江如鏡淸過盡江沙穿麥壠忽有靑蜩扶葉鳴小溪縣屬遂寧刈麥千平壠橫槎一小溪梓花紅綻碎粟穗緑垂低村婦猶多跣山猿遂少啼東川雖巳過錦里尚雲西茸山道中感懷侍臣筆槖舊西班大將麾幢又百蠻挂席南箕宿昔事閃旗東井何時還日增衰病復一日山隔舊遊知幾山倦拂盤陀蒼石坐歸心聊與石俱頑曉發飛鳥晨霞滿天少頃大雨吳諺云朝霞不出門暮霞行千里驗之信然戲紀其事朝霞不出門暮霞行千里今晨日未出曉氣散如綺心疑雨再作眼轉雲四起我豈知天道吳農諺云爾古來占滂沱説者類恢詭飛雲走羣羊停雲俗三豨月當天畢宿風自少女起爛石燒成香汗礎潤如洗逐婦鳩能拙穴居狸有智蜉蝣強知時蜥蜴與聞計垤鳴東山鸛堂審南柯蟻或加隂石鞭或議陽門閉或云逢庚變或自換甲始刑鵝與象龍聚訟非一理不如老農諺響應捷如鬼哦詩敢夸博聊用醒午睡遂寧府始見平川喜成短歌峽之西遂之東更無平地二千里惟有髙山三萬重不知誰人鑿混沌獨此融結何其工我本江吳弄水月忽來踏遍西南峰不知塵界在何許但怪星辰浮半空直疑飛入蝶夢境此豈應有人行蹤今朝平逺見城郭云是東川軍府雄原田坦若看掌上沙路淨如行鏡中芋區粟壠潤含雨楮林竹徑涼生風將士歡呼馬蹄快康莊直與錦里通半年﨑嶇得夷路一笑未暇憐飄蓬石湖居士詩集卷十六
