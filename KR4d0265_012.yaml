  text: 石湖居士詩集卷十二
  hash: sha256:f58448bd1e26fb446495cd8c777bf3e7213461b7b1f3f7f518cfc149479a0ebc
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0265_SBCK_012-1a}
body:
  text: 渡淮八月十一日渡盱眙過泗州順風如飛船旗衮衮徑長淮汴口人看撥不開昨夜南風浪如屋果然雙節下天來汴河汴自泗州以北皆涸草木生之土人云本朝恢復駕回即河須復開指顧枯河五十年龍舟早晚定疏川還京却要東南運酸棗棠梨莫蓊然虞姬墓在虹縣下馬鋪北三十七里劉項家人總可憐英雄無策庇嬋娟戚姬葬處君知否不及虞兮有墓田宿州五更出城鬼火滿野狐鳴鬼嘯夜茫茫元是官軍舊戰場土伯不能藏碧燐三三兩兩照前岡雷萬春墓在南京城南環以小牆榜曰忠勇雷公之墓九隕元身不隕名言言千載氣如生欲知忠信行蠻貊過墓胡兒下馬行雙廟在南京北門外張巡許逺廟也世稱雙廟南京人呼為雙王廟平地孤城寇若林兩公猶解障妖祲大梁襟帶洪河險誰遣神州陸地沉雎水雎口石門巳隤河亦塞即項羽大敗漢兵處一戰填河擁漢屯拔山意氣巳鯨吞直南即是隂陵路兵果難將勝負論伊尹墓在空桑北一里有磚堠刻云湯相伊公之墓相傳墓左右生棘皆直如矢三尺黃壚直棘邊此心終古享皇天汲書猥述流傳妄剖擊嗟無咎單篇留侯廟在陳留縣中案王原叔諸家考子房所封乃彭城留城非陳留也自宋武下教修復時其失久矣功成輕舉信良謀心與鴟夷共一舟吕媪區區無鳥喙先生輕負赤松遊西瓜園味淡而多液本燕北種今河南皆種之碧蔓凌霜卧軟沙年來處處食西瓜形模濩落淡如水未可蒲萄苜蓿誇冝春苑在舊宋門外俗名東御園狐塜獾蹊滿路隅行人猶作御園呼連昌尚有花臨砌腸斷冝春寸草無京城倚天櫛櫛萬樓棚聖代規模若化成如許金湯尚資盜古來李績勝長城護龍河在新宋門外中有綱船數十艘新郭門前見客舟淸漣淺淺抱城樓六龍行在東南國河若能神合斷流福勝閣曹太皇所建竒崛冠京城中翬飛五級半空翔指點樓欄說太皇劫火不能侵願力巋然獨似漢靈光相國寺寺榜猶祐陵御書寺中雜貨皆胡俗所需而巳傾檐缺吻護奎文金碧浮圖暗古塵聞說今朝恰開寺羊裘狼帽趂時新州橋南望朱雀門北望宣德樓皆舊御路也州橋南北是天街父老年年等駕回忍淚失聲詢使者幾時真有六軍來宣德樓虜加崇葺僞改曰承天門嶢闕叢霄舊玉京御牀忽有犬羊鳴他年若作淸宫使不挽天河洗不淸市街京師諸市皆荒索僅有人居梳行訛雜馬行殘藥市蕭騷土市寒惆悵軟紅佳麗地黃沙如雨撲征鞍金水河在舊封丘門外河中多大石皆艮嶽所隤菜市橋西一水環宫牆依舊俯淸灣誰憐磊磊河中石曽上君王萬歲山壺春堂徽廟稱道君時所居在擷芳園中俗呼為八滴水閣者松漠丹成去不歸龍髯無復有攀時芳園留得觚稜在長與都人作淚垂漸水黃河將決其地則伏流先出名曰漸水河身日徙而南過封丘至胙城界中已有漸水去汴京大約五十里耳黃流日夜向南風道出封丘處處逢紫蓋黃旗在湖海故應河伯欲朝宗李固渡洪河萬里界中州倒捲銀潢聒地流列弩燔梁那可渡向來天數亦人謀天成橋碑石蔡京書在濬州岡上驛中東廡下舊浮橋在此今河徙南行矣一岡邑屋舊河灘却望河身百里間湧土漲沙漫白道天成橋石在髙山舊滑州在濬州側積水中為河所淪久矣大伾即黎陽山西望積水不逺大伾山麓馬徘徊積水中間舊滑臺漁子不知興廢事淸晨吹笛棹船來扁鵲墓在湯隂伏道路傍相傳墓上土可療病禱而求之或得小圎如丹藥活人絶技古今無名下從教世俗趨墳土尚堪充藥餌莫嗔醫者例多盧羑里城在羑河上四垣儼然陵谷遷移尚故墟天盈商罪未蠲除古今行客同嗤罵何止三篇泰誓書文王廟在羑里城南堂堂十亂欲興周肯使君王死作囚巧笑入宫天亦笑可憐元不費深謀相州推車老人自言吾州韓魏公鄉里南北兩墳尚無恙秃巾髽髻老扶車茹痛含辛說亂華賴有鄉人聊刷恥魏公元是魯東家秦樓在相州寺中上有貴人幕而觀使客云是郡主太守之妻也大抵相臺傾城出觀異於他州欄街看幕似春遊斑犢雕車碧畫油奚女家人稱貴主縷金長袖倚秦樓翠樓在秦樓之北樓上下皆飲酒者連袵成帷迓漢官翠樓沽酒滿城歡白頭翁媪相扶拜垂老從今幾度看講武城在漳河上曹操所築周遭十數里鑿城為道而過阿瞞虓武蓋劉孫千古還將鬼蜮論縱有周遭遺堞在不如魚復陳圖尊七十二塜在講武城外曹操疑塜也森然彌望北人比常增封之一棺何用塜如林誰復如公負此心聞說羣胡為封土世間隨事有知音趙故城在邯鄲縣南延袤數十里金石笙篁絶代無鼪鼯藜藿正乘除園翁但愛城泥暖侵早鋤霜種晚𬞞邯鄲道即昔人作黃粱夢處薄晚霜侵使者車邯鄲阪峻且徐驅困來也作黃粱夢不夢封侯夢石湖藺相如墓在邯鄲縣南趙故城之西玉節經行虜障深馬頭釃酒奠踈林兹行璧重身如葉天日應臨慕藺心邯鄲驛驛後有磔犬祭天者大抵盡為胡俗漢戚夫人縣人也長安大道走邯鄲倚瑟佳人悵望間若見羶腥似今日漢宫何用憶關山叢臺在邯鄲北門外憑髙閲士劒如林故國風流變古今袨服雲仍猶左袵叢臺休恨緑蕪深臨洺鎮去洺州三十里洺酒最佳伴使以數壺及新兔見餉竟日霜寒暮解圍融融桑柘染斜暉北人爭勸臨洺酒云有棚頭得兔歸邢臺驛信德府驛也去太行最近城外有荷塘柳隄頗淸麗不類河朔太行東麓照邢州萬叠煙螺紫翠浮誰解登臨管風物枯荷老柳替人愁柳公亭在邢州城北小園中伴使邀客入遊云舊有流杯今廢園正對太行馬鞍一峰極􅍶崒主人敬客有餘情催喚繩牀坐柳亭曲水流觴非故物馬鞍山色舊靑靑內丘梨園內丘鵝梨為天下第一初熟收藏十月出汗後方佳園戶云梨至易種一接便生可支數十年吾家園者猶聖宋太平時所接汗後鵝梨爽似冰花身耐久老猶榮園翁指似還三笑曽共翁身見太平大寧河在內丘北河之東皆梨棗園二果正熟梨棗從來數內丘大寧河畔果園稠荆箱擾擾攔街賣紅皺黃團滿店頭北人謂道上聚落為店頭柏鄉唐志堯山乃古柏仁俗傳或以此柏鄉為柏人貫生名壓漢公卿自古逢讎不反兵仇虜滔天無敢動柏鄉空溷迫人名唐山即堯山金主之父名宗堯改山名山下有放勳廟勳唐遺德照淸灣百聖聞風不敢班何物苦寒胡地鬼二名猶敢廢堯山光武廟在柏鄉北兩壁有二十八將像廟前有二石人皆自腰而斷俗傳光武夜過以為生人問途不應劒斬之云雲臺列像拱真人野老猶誇建武春不用劒鋒能刜石冰河一瞥巳通神趙州石橋在城南洨河上以鐵筍卯貫石捲篷不類人工石色如霜鐵色新洨河南北尚通津不因再度皇華使誰洗奚車塞馬塵柏林院即東院趙州禪師道場在城中胡來胡現劫灰深風鼓三灾海印沈急過當年無佛處庭前空有柏森森欒城縣極草草伴使怒頓餐不精欲榜縣令跪告移時方免頽垣破屋古城邊客傳蕭寒㸑不煙明府牙緋危受杖欒城風物一淒然呼沱河即光武渡冰處在真定南五里聞道河神解造冰曽扶陽九見中興如今爛被胡羶涴不似滄浪可濯纓真定舞虜樂悉變中華惟真定有京師舊樂工尚舞髙平曲破紫袖當棚雪鬢凋曽隨廣樂奏雲韶老來未忍耆婆舞猶倚黃鐘衮六么東坡祠堂在中山府學學在化原坊化原坊裏尚黌堂聞道蘇仙有奉嘗想見當年行樂處牙旗鐵馬照金章松醪中山酒猶名松醪然甚漓松風潄罷讀離騷翰墨仙翁百代豪一笑氊裘那辦此當年嵇阮尚餔糟望都縣人多癭婦人尤甚相傳縣東接唐縣病癭者甚衆比縣蓋染其風土縣西有小阜曰由山荒寺踈鐘解客鞍由山東畔白煙寒望都風土連唐縣翁媪排門帶癭看安肅軍舊梁門三城今惟一城有人煙溏濼皆涸矣從古銅門控朔方南城煙火北城荒臺家抵死爭溏濼滿眼秋蕪襯夕陽出塞路安肅北門外大道容數車方軌當年玉帛聘遼陽出塞曽歌此路長漢節重尋舊車轍插天猶有萬垂楊白溝在安肅北十五里闊才丈餘古亦名巨馬河本朝與遼人分界處髙陵深谷變遷中佛劫仙塵事事空一水涓流獨如帶天應留作漢提封太行渡河即與太行俱北至燕猶未斷大抵東至薊門北至塞北西接奚界也若晴日無埃則出京至封丘巳望見之矣西北浮雲捲莫秋太行南麓照封丘橫峰側嶺知多少行到燕山翠未休固城自白溝十五里至固城鎮舊遼界也水味極惡用㧕作大棬汲井謂之凉罐柳棬凉罐汲泉遙味苦仍鹹似海潮却憶徑山龍井水一杯洗眼洞層霄范陽驛涿州驛牆外有尼寺二鐵塔夾塗如雪俯瞰驛中郵亭逼仄但冝冬恰似披裘坐土空枕上驚回丹闕夢屋頭白塔滿鈴風定興舊黃村虜新建為縣井邑未成新城遷次少人煙桑柘中間井徑寒亦有染人來賣纈淡紅深碧挂長竿淸逺店定興縣中客邸前有婢兩頰刺逃走二字云是主家私自黥涅雖殺之不禁女僮流汗逐氈軿云在淮鄉有父兄屠婢殺奴官不問大書黥面罰猶輕琉璃河又名劉李河在涿州北三十里極淸泚茂林環之尤多鴛鴦千百為羣煙林葱蒨帶回塘橋眼驚人失睡鄉健起褰帷揩病眼琉璃河上看鴛鴦此河大中祥符間路振乘軺録亦謂琉璃河惟嘉祐中宋敏求入番録乃謂之六里河大抵胡語難得其真灰洞在涿北燕南之間兩旁皆髙岡無風而路極狹塵土坌積咫尺不辨人物塞北風沙漲帽檐路經灰洞十分添據鞍莫問塵多少馬耳冥濛不見尖良鄉燕山屬邑驛中供金粟梨天生子皆珍果又有易州栗甚小而甘新寒凍指似排籖村酒雖酸未可嫌紫爛山梨紅皺棗總輸易栗十分甜盧溝去燕山三十五里虜以活鴈餉客積數十隻至此放之河中虜法五百里內禁採捕故也草草魚梁枕水低匆匆小駐濯漣漪河邊服匿多生口長記軺車放鴈時此河宋敏求謂之蘆菰即桑乾河也今呼盧溝燕賔館燕山城外館也至是適以重陽虜重此節以其日祭天伴使把菊酌酒相勸西望諸山皆縞云初六日大雪九日朝天種落歡也將佳節勸杯盤苦寒不似東籬下雪滿西山把菊看橙綱燕城外遇數車載新橙云修貢種之汴京擷芳園也堯舜方堪橘柚包穹廬亦復使民勞華淸荔子沾恩幸一騎回時萬騎騷踏鴟巾接送伴田彥皋愛豫巾裹求其樣指所戴踏鴟有愧色重譯知書自貴珍一生心愧踏鴟巾雨中折角君何愛帝有衣裳易介鱗耶律侍郎兵部侍郎耶律寶館伴使也不識字如提刑運使等字亦指以問乍見華書眼似麞低頭慚愧紫荷囊人間無事無竒對伏獵今成兩侍郎龍津橋在燕山宣陽門外以玉石為之引西山水灌其下燕石扶欄玉作堆柳塘南北抱城回西山剩放龍津水留待官軍飲馬來燕宫宏侈過汴京煬王亮所作金盆濯足段文昌乞索家風飽便忘他日楚人能一炬又從焦土說阿房會同館燕山客館也授館之明日守吏微言有議留使人者萬里孤臣致命秋此身何止一漚浮提攜漢節同生死休問羝羊解乳不遼人館本朝使巳謂之會同館石湖居士詩集卷十二
