front:
  text: 石湖居士詩集卷二十五
  hash: sha256:5e48ae950d8bb93879afc570292bfdc31b2d982fed17114c1ff01488d3d841b6
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0265_SBCK_025-1a}
body:
  text: 小峨睂并序近得靈璧古石絶似大峨正峰名之曰小峨睂東坡常以名廬山恐不若此石之逼真也作小峨睂歌以夸之三峨參橫大峨髙奔崖側勢倚半霄龍跧虎卧起且伏旁睨沫水沱江朝禹從岷嶓過其下奠山著籍稱雄豪告成歸來兩階舞泗濱錫貢僃九韶覽觀此石三歎息髣佛蜀鎮俱岧嶤惜哉擊拊墮簨虡輦送淮海還山椒降商訖周謹呵護磬氏無敢加鐫雕劉項蝸爭鬨靈璧血漂川谷流腥臊水官恐此被染涴氊包席裹吳中逃市門大隱閲千祀苔衣塵網薶孤標尤物顯晦定有數昨者惠顧不待招我昔西遊踏禹迹暑宿光相披重貂十年境落卧遊夢摩挲壁畫雙鬢凋天憐愛山欲成癖特設竒供慰寂寥恍然坐我寶巖上疑有太古雪未消嵌根襞積巧入妙峰頂箕踞貴不驕爐煙雲浮布銀界隙日虹貫凝金橋是時歲杪卧衰疾健起放杖驚兒曹龍鍾繞圍喜折屐龜手拂拭寒侵袍太湖未暇商甲乙羅浮天竺均鴻毛小峨之名神所卑永與野老歸漁樵作詩賀我得石友且以併賀兹丘遭煙江疊嶂煙江疊嶂太湖石也鱗次重復巧出天然王晉卿嘗畫煙江疊嶂圖東坡作詩今借以為名此石里人方氏所藏故物非近年以人功雕斫者比尤可貴太湖嵌根藏洞宫槎牙石生奫淪中波濤投隙漱且囓歲久缺罅深重重水空發聲夜鏜鎝中有晴江煙嶂疊誰歟斷取來何時山客自言藏奕葉江上愁心惟畫圖蘇仙作詩畫不如當年此石若並世雪浪仇池何足書我無俊語對巨麗欲定等差誰與議直須具眼老香山來為平章作新記天柱峰天柱峰英石也一峰峭豎特起有昻霄之意天柱本在衡山自黃帝時即以灊山輔南嶽漢氏因之遂寓其祭於灊天柱山衡灊蓋皆有天柱而灊名特彰九華鴈蕩若他山亦皆以此名峰不足算也衡山紫蓋連延處一峰巉絶擎玉宇漢家憚逺不能到寓祭灊山作天柱我今卧遊長掩關却寓此石充灊山形摹三尺氣萬仞世間培塿何由攀南州山骨孕淸淑乳孽砂牀未超俗神竒都賦小崢嶸雷雨飛來伴幽獨哦詩月明淸夜闌坐看髙影橫屋山摩霄拂雲政如此吾言實夸誰敢刪甲辰除夜吟一年三百六十日日日三椽卧衰疾旁人揶揄還歎咨問我如何度四時我言平生老行李蓐食趂程中夜起當時想像閉門間弱水迢迢三萬里如今因病得踈慵腳底關山如夢中重簾復幕白晝靜戶外車馬從西東若問四時何以度念定更無新與故瓶花開落紀春冬窗紙昏明認朝暮行年六十是明朝不暇自憐聊自嘲婪尾三杯餳一楪從今身健齒牙牢次韻龔養正送水仙花色界香塵付八還正觀不起況邪觀花前猶有詩情在還作凌波步月看元日屋角崢嶸斗柄移案頭蕭索燭花垂與時消息評新藥若節春秋憶舊詩飢飯困眠全體懶風餐露宿半生癡尊前現在休嫌老最後屠蘇把一巵正月六日風雪大作滕六無端巽二癡翻天作惡破春遲邀梅勒柳何功業誰與停杯一問之竒寒何事入芳辰不管燈枝欲試新即日反風吹盡雪東君巳費一分春元夕四首粉痕紅點萬花攢玉氣珠光寶月團簾箔通明香似霧東君無處著春寒謂吳中剪羅琉璃二燈不夜城中陸地蓮小梅初破月初圓新年第一佳時節誰肯如翁閉戶眠藥爐湯鼎煮孤燈禪版蒲團老病僧兒女強修元夕供玉蛾先避雪鬅鬙落梅穠李趂時新枯木崖邊一任春尚愛鄉音醒病耳隔牆時有賣餳人謂唱賣烏膩糖者去年多雪苦寒梅花遂晚元夕猶未盛開隔年寒力凍芳塵勒住東風寂莫濱只管苦吟三尺雪那知遲把一枝春燈烘畫閣香猶冷湯暖銅瓶玉尚皴花定有情堪索笑自憐無術喚真真寄題筠州錢有文明府新昌小道院忠厚平生心學敏明隨處民功江左幕中荒政江西縣裏仁風勿云私淑小邑可以匹休大邦健筆誰能後賦向來江夏無雙題徐熙杏花老枝當歲寒芳花春淡濘霧綃輕欲無嬌紅恐飛去題趙昌木瓜花秋風魏瓠實春雨燕脂花綵筆不可寫滴露勻朝霞題易元吉獐猿兩圖二首擇食麕相喚無人意不驚猿啼風動葉機熟兩忘情烏逐山公噪驚麕仰望疑春林無一事獝狘自生悲題張希賢紙本花四首牡丹洛花肉紅姿蜀筆丹砂染生綃多俗格紙本有真艷常春染根得靈藥無時不春風倚闌與挂壁相伴歲寒中紅梅酒力欺朝寒潮紅上粧面桃李漫同時輸了春風半雞冠號名極形似摹寫與真逼聊以畫滑稽慰我秋園寂喜沈叔晦至淡若論交味嚶其求友聲江湖幾魚沫風雨一雞鳴舊事休重説新詩莫細評煩將憶勤夢歸對海山橫驚蟄家人子輩為易踈簾二分春色到窮閻兒女祈翁出滯淹幽蟄夜驚雷奮地小窗朝爽日篩簾惠風全解墨池凍淸晝賸翻雲笈籖親友莫嗔情話少向來屏息似龜蟾韓尚書新造雲笈七籖信筆天地同浮水上萍羲娥迭耀案頭螢山中名器兩芒屩花下友朋雙玉瓶童子昔曽誇了了主翁今但諾醒醒歸田贏得多無事輸與諸公汗簡靑請息齋書事三首覆雨翻雲轉手成紛紛輕薄可憐生天無寒暑無時令人不炎涼不世情栩栩算來俱蝶夢喈喈能有幾雞鳴冰山側畔紅塵漲不隔瑶臺月露淸刻木牽絲罷戲場祭餘雨後兩相忘門雖有雀尚廷尉食巳無魚休孟嘗蝨裏趨時真是賊虎中宣力任為倀籬東舍北誰情話雞語鷗盟意却長聚蚋醯邊鬧似雷乞兒爭背向寒灰長平失勢見何晚栗里息交歸去來休問江湖魚有沫但蘄雲水鶴無媒巖扉岫幌牢扃鑰不是漁樵不與開送文季髙倅興元素衣京洛悵成緇靑鬢江吳喜未絲燭暗不眠談舊事酒闌作惡問行期琴書情話須親戚風雨殘春更別離屈指歸來重一笑掃除門巷著旌麾書懷二絶再送文季髙兼呈新帥閻才元侍郎劒關雲棧守非難函谷泥封久未刊今日漢中誰國士莫教春草上齋壇西出陽關有舊知薰風渌水泛蓮時煩君傳語詩書帥更寄臺城別後詞寄題石湖海棠二首手開芳徑越城頭紅錦屠蘇結綺樓不把萬枝銀燭照淡雲微月替人愁老懶居家似出家園林春色雨沾沙海棠尚自無心看天女何須更散花家人子輩往石湖檢校暮歸南浦回春棹東城掩暮扉兒修雞柵了女挈菜籃歸風力雖欺酒花香尚染衣衰翁牢守舍腸斷釣魚磯枕上聞蒲餅焦曉寒燕雀噤春隂珍重淸簧度好音窗色熹微欹枕聽夢成舟檥竹溪深石湖芍藥盛開向北使歸過維揚時買根栽此因記舊事二首竹西歌吹荻花秋遺老垂洟送逺遊羌笛夜闌吹出塞當年如此夢揚州萬里歸程許過家移將二十四橋花石湖從此添春色莫把蒲萄苜蓿誇次韻龔養正中秋無月三首詞客幕天淸露下老翁卧病破窗中髙吟大醉輸公等不見常娥與我同去年怪雨無端甚今歲癡雲亦復然減却新詩酸却酒乘除添得一更眠丙夜淸光些子見兒童驚喜強雄夸闌珊髙興應無幾恰似春殘看落花殊不惡齋秋晚間吟五絶好風入簾圖畫響斜照穿隙網絲明簷間雙雀有時鬭壁下一蛩終日鳴旁若無人鼠飲硯麾之不去蠅登盤天涼睡起枕痕暖日晚慵來香字寒就食遷居蟻墳壤隨風作舍蛛裊絲百年何處用三窟萬事信緣安一枝市聲洶洶鼓催陳日影駸駸潮漲痕消磨意氣默數息把玩光隂牢閉門中秋昨巳等間過重九今還如夢來霜鬢數莖羞墮幘黃花三度笑空杯老陳道人自云夢被召作地上主者又常受一貴家供祝之曰他日必來吾家作兒戲贈小頌野人何苦赴官差符使追呼撓道懷幸有于門香積供不如隨喜去羅齋題張戡蕃馬射獵圖隂山磧中射生虜馬逐箭飛如脫兔割鮮大嚼飽何求荐食中原天震怒太乙靈旗方北指掣轡逃歸莫南顧猖狂若到殺胡林郎主猶豝何況汝題趙昌四季花圖海棠梨花醉紅睡未熟淚玉春帶雨阿環不可招空寄憑肩語葵花萱草衛足保明哲忘憂助歡娛欣欣夏日永媚我幽人廬拒霜旱蓮霜天木芙蓉陸地旱蓮草水花雲錦盡不見秋風好梅花山茶月淡玉逾瘦雪深紅欲燃同時不同調聊用慰衰年乙巳十月朔開爐三首石湖今日開爐紙窗銀白新糊童子燒紅榾柮老翁睡暖氍毺石湖今日開爐兩壁仍安畫圖萬事篆煙曲几百年毳衲團蒲石湖今日開爐俗家恰似精廬抆涕雖無情緒吟詩却有工夫有歎二首春秋蘭菊殊調南北馬牛異方心醉井蛙海若眼空鵬海鳩枋貧富交情乃見炎涼歲序方成越秦本異肥瘠魯衛何曽弟兄留簡伯俊我昔賦逺遊萬里無親朋惟君同懷抱相從共茵憑踰嶺穿瘴茅捫參倚枯藤隨行一瓶鉢淡如雲水僧火馳炎熱場見此玉壺冰東歸常愧君無力相引繩長材屈小邑果以循吏稱豈不有薦墨翩然支郡丞五溪在何許水駛山崚嶒漫仕不擇地搏扶笑鯤鵬獨有故意長問疾訪薑肱亹亹談昨夢一一記吾曽中年畏離別況我雪鬅鬙此意君自解少留對靑燈枕上有感窗明似月曉光新被暖如薰睡息勻衝雨販夫牆外過故應嗤我是何人夜坐有感靜夜家家問戶眠滿城風雨驟寒天號呼賣卜誰家子想欠明朝糴米錢十月二十六日三偈聲聞與色塵普以妙香薰昔汝來迷我今吾却戲君有箇安心法無時不可行只將今日事隨分了今生窗外塵塵事窗中夢夢身既知身是夢一任事如塵石湖居士詩集卷二十五
