  text: 石湖居士詩集卷四
  hash: sha256:57675732d7e7e44eda3b7a4db5a4faa8688144d53ad0c8295fcc9d72e0ebfab3
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0265_SBCK_004-1a}
body:
  text: 賀樂丈先生南郭新居新堂燕雀喜竹籬挂藤蘿崩奔風濤裏得此巢龜荷西山效爽氣南浦供淸波會心不在逺容膝何須多先生淮海俊踏地嘗兵戈飄飄萬里道芒鞵厭關河風吹落下邑楚語成吳歌豈不有故國荒垣鞠秋莎無庸說當歸到處皆南柯卜遷不我遐一水明靑羅閉戸長獨佳奈客剥啄何會令蒼苔石屐齒如蜂窠歳旱邑人禱第五羅漢得雨樂先生有詩次韻海山之湫龍所宫濺瀑下赴聲琤琮碧矑大士何許主愛此匹練飛冥濛偶然宴坐百千劫神力悲願俱無窮向來火雲挾日走沙煎日爛千山童陸渾風髙煽熱屬涇川草肥間雨工萬口嗸嗸叫此士爐燎未吐誠先通暮塵捲地羊角暗朝霞橫天魚尾紅商羊摩霄鳶起舞居然一澍歌年豐人言佛陀入三昧斷取世界如旋蓬指麾釋梵駿奔走況爾風伯并雷公風騷老將亦替喜筆陣獨埽詩壇空嗟余嘯咏不釋手一曲何啻歌三終次韻時敘賦樂先生新居愚士繁俗如囚奴至人遺形與化俱紛紜覺夢不可辨蘧蘧栩栩知誰歟百年如泡亦如電剛欲鑄鐵充門樞列仙之臞墮山澤一席三椽良有餘平生嶔巇百戰勇頓挫久巳歸夷途光芒無用入詩句靑天白日轟雷車松煤繭紙妙揮埽芸香錦囊深貯儲紫露雙瓶春夜醉黃雲一稜秋田租誰能摶扶北溟海政爾歸卧南陽廬鴻飛冥冥隔雲雨弋人可慕不可呼病中夜坐呈致逺似霧如煙夜氣浮鶴鳴驚睡起搔頭含風竹影淡留月著雨蛩聲深怨秋萬事心空癡巳慣百骸歳晩病相投便當採藥西山去脚力蹣􅘐怕逺游戲題藥裹捲却絲綸颺却竿莫隨魚鼈弄腥涎須知別有垂鈎處枯海無風浪拍天夜歸竹輿伊軋走長街掠面風淸醉夢廻曲巷無聲門戸閉一燈猶照酒壚開田舎呼喚攜鋤至安排築圃忙兒童眠落葉鳥雀噪斜陽煙火村聲逺林菁野氣香樂哉今歳事天末稻雲黃戲題致逺書房照叢菊靨萬黃金欹架薇條半緑隂逋客巳隨丹鳳詔但餘花草怨秋深烏戍密印寺烏戍即今之烏鎭靑堆今曰靑鎭靑堆溪上水平堤烏堆東岸謂之靑堆絳瓦參差半掩扉殿用純紅瓦色爛然我與聖公俱客寓聖翁本汀州白衣巖主號定光佛者連南夫知州載神像歸寄於寺之藏前香火蕭然人傳帝子尚靈威寺有昭明太子祠勝縁齟齬三重障東佛閣三造不成今据見材取次成之猶殊勝志士辛勤十載歸鐘樓乃一僧發心束髮爲商走川廣得錢二萬緡凡十年復髠而歸樓始成花木禪房都不見但餘蝙蝠晝羣飛僧房皆爲狹門深洞極暗行百餘歩不辨人月夜泛舟新塘溪上淸風柳萬重緑煙無路月朦朧船頭忽逐回塘轉一水迢迢却向東客舎轂擊肩摩錦繡堆朝聲洶洶暮聲催忽然憶起長橋路天鏡無邊白鳥廻病中夜坐村巷秋春逺禪房夕磬深飢蚊常繞髩暗䑕忽鳴琴薄薄寒相中稜稜瘦不禁時成洛下詠却似越人吟秋芸有春緑秋芸有春緑踈籬照孤芳淸霜早晩至何草能不黃寧當念衰落政爾事容光及時且自好來日殊未量三湘怨牙檣罨晝櫓揺漾三湘浦佳人翔緑裾含顰爲誰舞拳拳新荷葉愁絶煙水暮風雲忽飄蕩隱約聞簫鼓夜發崑山歳寒人墐戸霜重獨登舟弱櫓揺孤夢踈篷蓋百憂但吟今不樂豈計幾冝休慚愧沙湖月年年照薄遊十一月十二日枕上曉作竹響風成陣窓明雪巳花柴扉吟凍犬紙瓦啄飢鴉宿酒欺寒力新詩管歳華日髙猶擁被蓐食媿鄰家南樓望雪夜月流瑶圃春風滿玉都籬踈先剥落樹密正模糊亂點橫煙鴈驚啼失木烏醉魂方浩蕩風袖不支梧除夜書懷運斗寅杓轉周天日御回夜從冬後短春逐雨中來髩緑看看雪心丹念念灰有懷憐斷鴈無思惜踈梅絮厚眼生纈𬞞寒腸轉雷燭花紅瑣碎香霧碧徘徊昨夢書三篋平生酒一杯牀頭新曆日衣上舊塵埃揺落何堪柳紛紜各夢槐隙光能幾許世事劇悠哉岐路東西變羲娥日夜催頭顱元自覺懷抱故應開踴躍金何意靑黃木自灾身謀同斥鷃政爾願蒿萊戲荅澹菴小偈莫問前程事漂然海上舟命乖逢鬼國縁合遇蓬丘畢竟非身計俱成錯路頭故鄉隨脚是流浪不知休偶書出處由人不繫天癡兒富貴更求仙東家就食西家宿世事何縁得兩全題立雪圖堂下心如鐵菴中語似雷有人參此語三箇一坑埋題日記誰言萬事轉頭空未轉頭時亦夢中若向夢中㝷夢覺覺來還入大槐宫題張氏新亭水楊成幄翠相遮猶有東風管歳華葉底靑梅無數子梢頭紅杏不多花煩將鍊火炊香飯更引長泉煮鬪茶約我詩成須疥壁莫嗔欹側似歸鴉玉臺體捲幔燈千朶鈎簾月半弓繡鴛翔瀝水金雀跂屏風細意翩長袖多情結短封銅壺從婉娩玉珮正丁東枕上明月無聲滿屋梁夢餘分影上人牀素娥脉脉翻愁寂付與風鈴語夜長斑騅斑騅別後月纎纎門外踈桐影畫簾留下可憐將不去西風吹上兩眉尖題傳記二首莫將綵筆寄朝雲紅淚羅巾隔路塵說與東風無限恨倩風吹斷去年春綵舟歸去海山靑寂莫瑶臺月自明啼雨落花春巳盡夢魂何必更多情病中絶句八首空裏情知不著花逢場將病當生涯蒲團軟暖無時節夜聽蚊雷曉聽鴉溽暑薫天地湧泉彎跧避濕挂行纏出門斟酌無忙事睡過黃梅細雨天石鼎颼颼夜煮湯亂拖芝术鬪温凉化兒幻我知何用袛與人間試藥方病中心境兩俱降猶憶江湖白鳥雙一夜雨聲鳴紙瓦聽成飛雪打船窓檐頭排溜密如簾溪上層隂定解嚴最是看山竒絶處白雲堆絮擁靑尖夜合梢頭蘸紫茸菉葱頂上拆黃封去年團扇題詩處依舊踈簾細雨中盆傾瓴建夜翻渠繞屋蛙聲一倍粗想見西堂渾不睡明朝踏濕看菖蒲謂現老晴色先從喜鵲知斜陽一抹照天西竹雞何物能無賴如許泥深更苦啼病中三偈擾擾隨流無定期波停浪息始應知一塵不偶同歸處四海無親獨歩時苦相打通俱入妙病縁纔入更何疑霜淸木落千山露笑殺東風葉滿枝一交銷取萬黃金將病求醫在用心化盡此身成藥樹不妨栽得病根深莫把無言絶病根病根深處是無言丈夫解却維摩縛八字轟開不二門雲間湖光亭微風不動斂濤湍組練晶晶色界寒斜照發揮猶未盡月明殘夜更來看髙景菴泉亭峰頭揮手笑紅塵天入雙眸洗翳昏萬里西風熟秔稻白雲堆裏著黃雲晩入盤門人語嘲喧晩吹凉萬窓燈火轉河塘兩行碧柳籠官渡一簇紅樓壓女牆何處采菱聞度曲誰家拜月認飄香輕裘駿馬慵穿市困倚蒲團入睡郷九月三十日夜出關候致逺不至風勁便輕棹霜嚴怯弊裘靑山蟠巨浸紅樹立滄洲月黒鴈猶去燈寒人更愁煙松漫小峴何處問鳴騶次韻致逺自毘陵見寄二首黃鵠髙飛碧落寒向來山水夢驚殘故情若問元眞子依舊江頭把釣竿新詞一闋話羈愁淸似寒泉咽隴頭官下有誰同此仲宣應是獨登樓元日山寺聽熟朝魚又暮鐘全將慵懶度三冬貪眠豹褥窓間日怕擁駞裘陌上風登版自憐行蹭蹬讀碑仍怪視蒙籠少年豪壯今如此略與殘僧氣味同題記事冊北山山下小菴居佛劫仙塵只故吾八萬四千空色界不離一法認毘盧寄贈致逺并呈現老草草家風節物新從來憂病不憂貧琴書稍覺浮生誤香火惟知此事眞室裏談空思二士花間對影謾三人袛愁盧李分攜後別有箜篌一曲春春後微雪一宿而晴綵勝金旛換物華垂垂天意晩平沙東君未破含春蘂靑女先飛剪水花夜逐回風鳴瓦壠曉成踈雨滴檐牙朝暾不與同雲便烘作晴空萬縷霞雪霽獨登南樓雪晴風勁晩來氷樓上竒寒病骨驚雀啄空檐銀笋墮鴉翻髙樹玉塵傾靑帘閃閃千家靜黃帽亭亭一水橫坐久天容却温麗一彎新月對長庚次時敘韻送至先兄赴調梅柳欲動風作難行人意在飛鴻間一官逺遊門戸弱百歳上䇿身心間胸次饒渠有廊廟夢魂叵使無江山栽桃種杏須付我巳辦鐵鎖遲公攀上沙遇雨快凉刮地風來健葛衣一凉便覺暑光低雲頭龍挂如垂筯雨在中峰白塔西自天平嶺過髙景菴卓筆峰前樹作團天平嶺上石成關緑隂匝地無人過落日秋蟬滿四山髙景山夜歸伊軋籃輿草露間夜凉月暗走孱顔忽逢陂水明如鏡照見沉沉倒景山白雲嶺路入千峰一線通陸離長劒立天風五年領客題詩處正在孤雲亂石中偃月泉松風竹露午猶寒知有龍蟠一掬慳我欲今年來結夏莫扃岫幌掩雲關代人七月十四日生朝秋入壺中玉宇鮮芝蘭桃李共熙然巳饒瑞莢明朝滿先借淸蟾一夜圎北闕紫泥應道路東山紅袖莫雲煙如今且醉江湖酒來歳城南尺五天題金牛洞洞在宣城之成山前此蕪廢無聞自魏公尚書發之常有笙簫仙音之瑞故郷江吳多好山筍輿篾舫相窮年春風吹入江南陌叠障雙峰如舊識聞道金牛更孱顔古來鐵鎖髙難攀自從仙伯弭芝蓋鳳舞鸞歌開洞天新詩賸說山中妙我不曽游先夢到從渠弱水隔蓬萊雲山何處無瑶草曉自銀林至東灞登舟寄宣城親戚曉山障望眼脉脉紫翠橫澄江巳不見況乃江上城結束治野裝木末浮三星羸馬隴頭嘶小車谷中鳴亭亭東灞樹練練緑浦明篙師笑迎我新漲没蘋汀徑投一葉去雲水相與平聊將塵土面照此玻瓈淸懷我二三友髙堂晨欲興風細桐葉墮露濃荷蓋傾凝香繞燕几安知路傍情讀唐太宗紀平内難宫府相圖勢不收國家何有各身謀縱無管蔡當時例業巳彎弓肯罷休弟兄相賊斁天倫自古無如舜苦辛掩井捐階危萬死不聞親殺鼻亭神佐命諸公趣夜􅋔爭言社稷要靈長就令昆季尸神器未必唐家便破亡建成回馬欲馳歸元吉行趨武德闈若使兩人俱得去却於何處極兵威嫡長承祧有大倫老公愛子本平均只知世上㝷常理爭信英雄解滅親重讀唐太宗紀立晉王父子情深苦亦深蓋天神武一沾襟想當拔刃投牀際也憶海池舟裏心承乾謀父保天年靑雀圖兄亦兩全隱刺諸兒却孥戮一私知隔幾山淵更張聊欲亢吾宗仁孝承家合至公天發殺機那可料正投阿武禍胎中石湖居士詩集卷四
