front:
  text: 石湖居士詩集卷五
  hash: sha256:7861d783aeb25df76c4b9ae2fe9de12d88e93c2b8a18893492e18d197c2182d6
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0265_SBCK_005-1a}
body:
  text: 復自姑蘇過宛陵至鄧歩出陸漿家饋食槿爲藩酒市停驂竹廡門紅樹亭亭棲晩照黃茅杳杳被髙原飲溪有跡於莬過掠草如飛朴渥翻車軌如溝平地少飽帆天鏡憶江村題南塘客舎閒裏方知得此生癡人身外更經營君看坐賈行商輩誰復從容唱渭城南塘冬夜倡和燃萁烘煖夜窓幽時有新詩趣倡酬爲問灞橋風雪裏何如田舎火爐頭寒釭欲暗吟方苦凍筆難驅字更遒絶笑兒癡生活淡略無歳晩稻粱謀游金牛洞題石壁上仙翁舊游處琅璈韻靈曲至今有餘音􅀇鶴舞幽谷衆眞期我住歳晩芝田熟腰鑱從翁來籋雲跨飛鹿淨行寺傍皆圩田每爲潦漲所決民歳歳興築患糧絶功輙不成崩濤裂岸四三年落日寒煙正渺然空腹荷鋤那辦此人功未至不關天衮山道中虎嘯狐鳴苦竹叢魂驚終日走蒙茸松林斷處前山缺又見南湖數十峰花山村舎潦退灘灘露沙虚岸岸頽澗聲穿竹去雲影過山來柳菌粘枝住桑花共葉開菴廬少來往門巷濕蒼苔淸明日狸渡道中灑灑沾巾雨披披側帽風花燃山色裏柳卧水聲中石馬立當道紙鳶鳴半空墦間人散後烏鳥正西東寒食客中有懷江郭花開也寂寥不須緑暗與紅凋疾風甚􅀨過寒食白日靑春吟大招芳景尚隨流水去故人應作綵雲飄煙波千里家何在惟有溪聲似晩潮南塘寒食書事埂外新陂緑岡頭宿燒紅裹魚蒸菜把饋鴨鎖筠籠酒侣晨相命歌場夜不空土風并節物不與故郷同周德萬攜孥赴龍舒法曹道過水陽相見留別女弟草草相逢小駐􅂳一杯和淚飲江天妹孤忍使行千里兄老那堪別數年馬轉不容吾悵望櫓鳴肯爲汝留連神如相此俱強健緑髮歸來慰眼前髙淳道中路入髙淳麥更深草泥霑潤馬駸駸􅀨歸隴首雲凝黛日漏山腰石滲金老柳不春花自蔓古祠無壁樹空隂一簞定屬前村店衮衮炊煙起竹林夜至寧菴見壁間端禮昆仲倡和明日將去次其韻杉松廡門森老蒼佛屋深夜幡花香借牀睡倒恍何處夢隨濳魚聽驚榔咿啞禽語曉光淨窸窣草鳴朝雨凉哦詩出門懷二妙春漲繞山湖水黃行唐村平野晴色妍甚煖日烘繁梅穠香撲征鞅雲煙釀春色心目兩駘蕩柳睂翠巳埽桑眼靑未放兹遊定不俗前路八千嶂嶺上紅梅霧雨臙脂照松竹江南春風一枝足滿城桃李各嫣然寂莫傾城在空谷城中誰解惜娉婷遊子路傍空復情花不能言客無語日暮淸愁相對生浙東參政􅀉示會稽蓬萊閣詩軸次韻􅀉題二首仙翁來佩玉符麟緑髮無霜照碧筠永夜闌干千嶂月淸風揮麈七州春塵埃不隔壺中境功業猶關物外身鸞鶴莫驚兵衞峻主人元是白雲人鰲背飛來紺碧浮人間還有小蓬丘不須擊水三千里巳壓中天十二樓羽駕舊曽將夢到芝田今合爲公秋玉霄有客方東望竟欲乗風馭氣遊外舅輓詞二首植德千章茂硎材百鍊剛事功纔止此物理故難量鴈序雲天逺蘭階雨露芳公無憾身後人自惜堂堂幽介聯昏援門闌閱歳更方欣承燕几何意寫銘旌笑語猶㝷夢恩勤巳隔生情傷到深處有淚不勝傾天平先隴道中時將赴新安􅁺霜橋冰澗淨無塵竹塢梅溪未放春百叠海山郷夢熟三年江路旅愁生松楸永􅀉孤窮淚泉石終收漫浪身好住鄰翁各安健歸來相訪􅀃情眞元夕泊舟霅川蓮炬光中月自圎人情草草競華年最憐一夜旗亭鼓能共鐘聲到客􅂳桐川郡圃梅極盛皆圍抱髙木浙中無有家住丹楓白葦林橫枝一笑萬黃金玉溪園裏逢千樹還盡春風未足心牧馬山道中土橋茅屋兩三家竹裏鳴泉漱白沙春色惱人無畔岸亂飄風袖拂梅花宿牧馬山勝果寺佛燈巳暗還吐旅枕纔安却驚月色看成曉色溪聲聽作松聲游寧國奉聖寺松梢臺殿鬱髙標山轉溪廻一水朝不惜褰裳呼小渡夜來春漲失浮橋自寧國溪行至宣城舟人云凡百八十灘波驚石險夜喧雷曉泊旗亭笑眼開休問行人縁底瘦適從百八十灘來次韻宣州西園二首苔茵無地着紅塵花草含芳一笑新不待東君能剪刻相公筆力挽回春星芒垂耀筆牀寒河漢波流硯滴乾棐几松跗入三昧一篇詩就一杯殘晩歩西園料峭輕寒結晩隂飛花院落怨春深吹開紅紫還吹落一種東風兩樣心送端言東君留戀一分春蜂蝶闌􅃢燕子新桃李無情空緑徑市橋楊柳送行人早發竹下結束晨裝破小寒跨鞍聊得散疲頑行衝薄薄輕輕霧看放重重叠叠山碧穗吹煙當樹直緑紋溪水趂橋彎淸禽百囀似迎客正在有情無思間小澗石礙珠旒濺灘平霧縠鋪小童能好事繫馬斸菖蒲次韻子文探梅水西春巳深猶未開水西謂歙溪而黃君謨州學記云頻江地卑蓋此水爲浙之源正可謂之江也􅀌山山下小斜橋客魂曽共暗香飄五年不踏西湖路想見黃昏淸淺處如今憔悴古江干豈有幽芳伴􅀝欄臘盡雪殘春不至坐令愁裏眼長寒霜稜未貸千林槁門外風饕人欲倒斟酌芳心正怯寒有情眞被無情惱後催租行老父田荒秋雨裏舊時髙岸今江水傭耕猶自抱長飢的知無力輸租米自從郷官新上來黃紙放盡白紙催賣衣得錢都納却病骨雖寒聊免縛去年衣盡到家口大女臨岐兩分首今年次女巳行媒亦復驅將換升㪷室中更有第三女明年不怕催租苦次韻子文衝􅀨迓使者道聞子規夢魂翾蜨翅鼻息吼鼉鼓喚起治曉裝馬嘶童僕語汨泥溷鳬鶩慚愧黃鵠舉猥吟陬隅池浪廢桔橰圃啼䳌撩客心鈎引着何許請歌蘇仙詞歸耕一犁􅀨奉題胡宗偉推官攬秀堂城外屏峰雲百叠城裏看雲笏拄頰山靈自與人爭秀明滅煙霏難應接南鄰范叔骨相寒不如􅀐曹知愛山晨霞儻可救枵腹丐君分我入朝餐次韻太守出郊曉裝緹􅀐踏芳辰江爲安瀾露浥塵棨㦸前驅留住月笙簫後備帶行春魚龍水面金杯滿鸞鶴山頭綵筆新聞道將軍寬禮數不辭酩酊吐車茵曉出古巖呈宗偉子文曉風生小寒嵐潤裛巾屨宿雲埋樹黒奔溪轉山怒東方動光彩晃晃金鉦吐千峰森隱現一氣澹回互平生癖幽討解后飽新遇那知塵滿甑晨炊午未具不愧忍飢面來㝷古巖路稻粱亦易謀烟霞乃難痼持此慰􅀛腸搜枯尚能句積雨蒸潤體中不佳頗思故居之樂戲書呈子文門外泥深蘸馬鞍墨雲未放四維寛前山忽接後山暗暑雨全如秋雨寒夢裏江湖三歎息醉中天地一憑闌斗升留滯休惆悵枳棘從來著鳳鸞簽廳夜歸用前韻呈子文簿書堆裏解歸鞍我亦蕭然轡勒寛爐􅂐無風香霧直庭柯有月露光寒閒思喜鵲塡河鼓靜數流螢繞井欄明日又驅官裏去從敎白鷺侣紅鸞聖集誇􅀃少年俊遊用韻記其語戲之京塵紅軟撲雕鞍年少王孫酒量寬􅀝袖竹風憐翠薄捧杯花露怯金寒黃雲城上栖烏曲緑水橋邊鬪鴨欄別後相思惟故物壁煤侵損扇中鸞次温伯用林公正劉慶充倡和韻前山後山梅子􅀨屯雲日夜相吞吐長林絶壑望不到時有樵歸􅀃逢虎奔溪朝來忽怒漲夾岸柳梢餘尺許屋頭未放濃嵐散苦憶淸風汎瓊宇客行落此亂山中但欲㝷人訴羈旅比鄰解后得淸士睂宇津津佳笑語杯行起舞出新句我氣巳衰聊復鼓明年與君杭太湖扁舟踏浪不踏土沉沉玉柱閟仙扃矯矯虹梁浮水府目力無窮天不盡却笑向來誰縛汝次韻温伯夜坐今日忽得舎弟到杭消息喜見於詞長風吹月來影碎竹間牖良宵坐窘束媿我塵外友平生煙霞興硉兀上南斗頗亦契三三未省計九九迷塗入簿領郷心幾回首嗟予季行役舟拂漲溪柳凌晨雙鵲鳴翫占得無咎何當從汝去履綦尋蕙畝再次韻呈宗偉温伯官居數椽間局促如瓮牑幸鄰詩酒社金薤對玉友眞淸廊廟器偉望配山斗宗偉自號眞淸居士行當侍紫極槐棘位三九館舎有竒士謂温伯髙文粲參首倡酬猥及我雙松壓孤柳生活從冷淡幸免譽與咎相從結此夏何異歸隴畝次韻温伯納凉日斜猶畏暑吏退合偷閒霞散紅綃薄溪廻碧玉彎伴人惟羽扇娛客欠風鬟且復哦新句相嘲飯顆山雨凉二首呈宗偉誰扶病客起龍鍾恩在盆傾一􅀨中問訊九關何路到擬牋歡喜謝天公驚雷隱地送凉颸起舞看山不自持􅀃與騷人須早計片雲催􅀨􅀨催詩明日復􅀨凉再用韻二首東山朝日澹冥濛一片雲生萬叠中宿􅀨未蘇焦卷盡又煩箕井喚雷公濺瓦排檐散萬絲顚狂風篠要扶持恩深到骨吾能報急賦新凉第一詩次韻慶充避暑水西寺佳晨出西郭仰視天宇淸樂哉曠士懷浩浩吞四溟新漲忽勇退籬落粘枯萍風幡招客遊曠望隔蘋汀僕夫厲淸深竹輿竦亭亭波翻石鑿落尚帶蛟龍腥華堂入松竹德人占聚星脫帽飛羽觴頽放解天刑時當行火令草腐亦化螢炎官紛陸梁空飛赤雲軿遥知隴上耘暴背愁白丁兹遊豈易得未用歎沉冥送滕子昭績溪罷歸天馬西極來目力盡九寰執轡者誰歟墮此空谷閒草深石齧足一躍度孱顔長風送逸駕蕩蕩登虎關五雲淸都上白日開帝閑鈎陳動光彩球琳鏘轡環亦復念舊羣依然歎駑頑紅塵起天末可望不可攀石湖居士詩集卷五
