body:
  text: 跋先人嘗爲莘等言自十四五始爲詩文晚而罙篤或寢疾醫以勞心見止亦以政自不能不爾謝之手編僅成帙而棄不肖之孤其尚忍言哉當從九京遊而未敢者以先人之志未承也詩文凡百有三十卷求序於楊先生誠齋求校於龔編修芥隱而刊於家之壽櫟堂春秋霜露思其志意思其所樂僾然如見愾然如聞庶得藉口以告吾先人云嘉泰三年十二月初三日莘兹謹書
