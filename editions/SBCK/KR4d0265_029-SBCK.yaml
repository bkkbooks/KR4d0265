front:
  text: 石湖居士詩集卷二十九
  hash: sha256:9f673d06aa66378cb52ff71077db27afff50f3752bed20f794385aebc2cdde8d
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0265_SBCK_029-1a}
body:
  text: 次韻虞子建見咍贖帶作醮齋祠難著野衣冠旋贖金章始見閒台架塵侵毬路暗花書墨漬笏頭斑當年馹騎傳呼賜此日村童拂拭還若比前㕔荒驛舎見存猶可一開顔兒女傳觀省見稀病身聊復借光輝莫嫌憔悴沈腰瘦且喜間關秦璧歸不是典來還酒債亦非將去換蓑衣塵魚甑釜時相阨微汝誰能爲解圍顔橋道中村村籬落緫新修處處田疇盡有秋一段農家好風景稻堆髙出屋山頭上沙舎舟村北村南打稻聲竹輿隨處欵柴荆斜陽倒景天如醉明日山行更好晴􅀫閶門五更潮落水鳴􅂳霜送新寒到枕邊報道霧􅀵紅日上野翁猶蓋短篷眠㩦家石湖賞拒霜水上晴雲綵蝀橫許多蜂蝶趁􅂳行漁樵引入新花塢兒女扶登小錦城艶粉發粧朝日麗濕紅浮影晚波淸誰知摇落霜林畔一段韶光畵不成壽櫟東齋午坐屋角靜突兀雲氣低鴻濛殘葉颭疎雨孤花側淒風北窓午睡起一笑萬事空無人共此意莎堦咽微蛩晚思蘚牆莎砌響幽蟲睡起繙書覺夢中殘暑一窓風不動秋陽入竹碎靑紅壽櫟堂枕上禪牀初著小山屏夜久秋凉枕席淸繞􅁂飛蚊妨好夢卧聽簷雨入池聲􅀫妙庭觀次東坡舊韻桂殿吹笙夜不歸蘇仙詩板挂空悲世人䑛鼎何須笑猶勝先生夢石芝􅂛降三田自有丹浪㝷盤鼎斸仙壇扣門倦客惟思睡容膝菴中一枕安觀爲董雙成故宅元祐閒修造掘地得琉璃盤銅鼎中有丹巳而盤碎失丹惟鼎存坡詩蓋紀其事鼎後爲宣和殿取去餘杭初出陸村媪羣觀笑老翁宦途何處苦龍鍾霜毛痩骨猶千騎少見行人似箇儂桐廬江中初打漿二十年前􅁂未斑下灘歸路落潮乾如今衰雪三千丈却趁潮平再上灘釣臺久矣心空客路埃兹行端爲主恩來杜陵詩是吾詩句卧病豈登江上臺和豐驛晚境惟於閉户宜出門惟有病相隨四方雖是男兒志莫忘柯山在莒時次韻龔養正病中見寄衰翁埽軌欲垂車怪子頽然也向隅激水要令風在下涸泉翻以沫相濡瘠肥邈爾自秦越􅀔利紛然皆耳餘且復放􅂳來話舊不妨蓮葉卧看書題蜀果圖四首木瓜沈沈黛色濃糝糝金沙絢却􅀏宣州房競作紅粧面櫻桃火齊寶瓔珞垂於緑繭絲幽禽都未覺和露折新枝石榴日烘古錦囊露浥紅瑪瑙玉池嚥淸肥三彭跡如埽甘瓜夏膚粗巳皴秋蔕熟將脫不辭抱蔓歸聊慰相如渴李粹伯侍御挽詞二首奕葉邯鄲後乗騘第一人交情多舊雨到處有陽春磊落功名意摧頽夢幻身黃壚髙可隱何地著經綸公昔參敷納人期到辨章珠光空月皎玉氣忽虹藏歳晚東方騎生平北海觴玳簪風雨散幾客奠楸行次韻􅀽起巖提刑遊金焦二山二首二山巉絶照南州俯看千檣緫芥舟日脚鎔金浮巨浸波聲翻雪撼髙丘鍾聞兩岸詩無敵口吸西江話巳酬别有英雄懷古意他年擊楫誓中流憶曽歸自雪邊州帆落中􅍽小繫舟食蛤坐來期汗漫駕鴻飛去揖浮丘卧遊久矣無登覽辱贈跫然有唱酬寂寞東臯舒嘯後爲君濡筆賦臨流次韻謝鄭少融尚書爲壽之作交游稀似曉來星歳月飄如水上萍桂海宦情詩可紀吳山别恨酒難平我今以病爲欣戚公合於時繫重輕安得故人來話舊碧空日日暮雲生近見尚書再和桂林詩成大與尚書相別於桂林今十二年矣鄭少融尚書初除端殿以書見及賦詩爲賀敬老尊賢大政初速郵響動報新除即從光範開門館先向文明直殿廬後日沙堤新宰相當年革履舊尚書鋒車若向吳中路應記南山有荷鋤書事三絶㸑婢請淘酒米園丁催筭花錢如許日生公事誰云窮巷蕭然日日處方候脉時時推筴禳災門外雖無車轍醫生􅁲􅅱猶來簡子約同湖棹周郎許過田廬碧雲日暮空合多病故人遂踈親鄰招集強往便歸樂天漸老欲謀歡大似蒸砂不作團巳覺笙歌無煖􅀬仍嫌風月太淸寒氣衰況復三而竭心賞尤於四者難却恐人嫌情太薄聊將花作霧中看次韻􅀽起巖常熟道中三絶句小雨蕭寒破晚晴踈踈密密滴簷聲烏鴉盤舞黃雲亂早與商量雪意生吳徑難勝四牡騑扁舟辛苦鑿冰歸簡書鞅掌吟詩苦并與東陽減帶回使君橫槊賦詩回斷取天風海雨來綵筆從今閒不得雪花梅蕊一時開次韻􅀽起巖許浦按敎水軍二絶句橫波組練試揚舲風捲魚龍海欲凝但得綈袍如挾纊何妨鐵甲冷如冰戈􅂳戰櫂疾如飛莫遣潮沙澱海湄草奏􅀡須窮利病奉身從此繫安危次韻起巖喜雪吹成一雪便吹殘風伯無端豈坐慳夜報飛花平瓦壠曉驚疎雨落簷間休敎凍解魚龍水更待誠通虎豹關准擬姑蘇臺上看春前三度老靑山􅀽詩猶以雪未甚積必念此意當益感通矣枕上聞雪復作方以爲喜起巖再示新詩復次韻三白何憂稼穡艱天於玉粒未吾慳不知夜色明空外但覺朝寒到夢間誰子騎驢吟灞上何人跋馬客藍關爭如睡熟蒲團上靜聽飢鴉啄屋山起巖又送立春日再得雪詩亦次韻十分佳景媚冬殘好事天心不復慳巳遣梅花斜竹外更飄瑞葉向人間漁蓑晚色都堪畵羌笛春光亦度關想得東風來處路白銀宫闕鎻三山同年楊廷秀秘􅁥接伴北道道中走寄見懷之什次韻荅之昨遣長鬚迓詩老人言巳過閶門了梅邊腸斷傍寒溪詩老官忙應未知何時眞訪山中許巳辦竹深留客處只恐歸程官更忙天騶催上沙堤去曉枕聞雨暗淡更殘景低迷病酒懷剔燈寒作伴添被厚如埋膽冷都無夢心空却似齋地爐煎粥沸聽作雨鳴堦雪意方濃復作雨擬看飛花陣翻成建水聲雨吾寧不識雪汝幾時成三白從今􅁲干倉待此盈黃雲如有意靑女莫無情春朝早起莫􅀏眠常早還憐起不遲穠香温夜氣小雨濕春姿瘦比中年甚寒惟病骨知羡渠兒女健繞屋探南枝詠懷自嘲簷溜春猶凍門扉晚未開退閒驚客至衰懶怕書來日日敎澆竹朝朝遣探梅園丁應竊笑猶自􅀃心灰早衰早衰頭腦巳冬烘信拙心情似苦空僚舊姓名多健忘家人長短緫佯聾一窓煖日棋聲裏四壁寒燈藥氣中晚景只消如此過不堪拈出敎兒童習間習閒成懶懶成癡六用都藏縮似􅀛雪巳許多猶不飲梅今如此尚無詩閒看猫暖眠氊褥靜聽猧寒叫竹籬寂寞無人同此意時時惟有睡魔知一龕一龕窄似鳥窠禪世界悠悠任大千與老有情冬後煖去仙無幾日髙眠斫開竹後初三逕忘却詩來又一年破戒忽題無味句劣能成字不成篇隂寒終日兀坐東風微解綴簷冰仍喜朝來井水淸臘淺得春全未煖雪慳和雨最難晴小窓日煖猶棋局窮巷更深尚屐聲莫把摧頽嫌暮景且將閒散替勞生親戚小集避濕違寒不出門一冬未省正冠巾月從雪後皆奇夜天向梅邊有別春秉燭登臨空語舊擁爐情味莫懷新榮華􅀔利輸人慣贏得尊前現在身立春枕上擇蔬翻餅閙殘更兒女喧喧短夢驚想得春風連夜到東禪粥鼓忽分明睡覺尋思斷夢半瞢騰漸見天窓􅁓瓦明􅀫鳥噪羣穿竹去縣前猶自打殘更石湖居士詩集卷二十九
