  text: 石湖居士詩集卷二十
  hash: sha256:7e566146bbc3307a5a8767f3af8beb922e2240215cc902e203e7a01e9c0fbe94
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0265_SBCK_020-1a}
body:
  text: 淳熙五年四月二日􅀡宿玉堂懷舊桂海冰天老歳華􅀡廬重上玉皇家當年曽識青青鬢惟有東墻一架花雪山刁斗不停撾夜把軍書敢顧家珍重玉堂今夜夢靜聞宫漏隔宫花初歸石湖曉霧朝暾紺碧烘橫塘西岸越城東行人半出稻花上宿鷺孤明菱葉中信脚自能知舊路驚心時復認鄰翁當時手種斜橋柳無限鳴蜩翠埽空􅀉蜀州楊道人老來萬事緫蕭然猶憶西州暑雪邊爲報岷峨山水道如今眞箇得歸田送同年萬元亨知階州老我曽頒萬里春憐君飛棹也浮秦當年千佛名經裏又見西遊第二人路入南山舊漢畿油油淸渭照牙旗古來百戰功名地正是雞鳴起舞時十年關隴困科輸聖德如天盡埽除臨遣中和二千石好乗春日下寛書次韻蜀客西歸者來過石湖并􅀉成都舊僚走徧塵埃倦鳥還故鄉元在水雲間黃粱飯裏夢魂醒靑篛笠前身世閒鷗鷺飛來俱玉立松篁歳晚各蒼顔岷峨交舊如相問鐵鎖無扃任客攀十一月大霧中自胥口渡太湖白霧漫空白浪深舟如竹葉信浮沉科頭晏起吾何敢自有山川印此心靈祐觀即古神景宫也相傳舊宫廊百間繞三大殿謂之百廊三殿今不復有堂前有垂絲檜三本暘谷西門鎖洞宫古苔斑駁檜蒙茸百廊三殿惟眢井萬壑千巖有瘦笻林屋洞仙經一名左神幽虚洞天正洞門左觀中出觀左門又有二門一名雨洞一名暘谷洞擊水摶風浪雪翻煙銷日出見仙村舊知浮玉北堂路今到幽墟三洞門石燕翾飛遮炬火金籠深阻護嵌根寶鐘靈鼓何須叩庭柱宵晨巳黙存包山寺在毛公壇前別峰下慈受深老所作深老入山時手植二竹今遂成林山上松多非種植風吹松子自成謂之飛松仙塢遜半坐精廬遷古幢槁衲昔開山至今坐道場熾然􅀃慈忍禪海薰戒香穉竹暗寒碧飛松盤老蒼􅂳鼓入宴坐紅塵隔滄浪藤杖嬾歸去共􅀝蒲團牀毛公壇福地西山最深處毛公劉根也身生緑毛故云有劉道人作小菴在隱泉之上松蘿滴翠白晝隂七十二峰中最深緑毛仙翁巳仙去惟有石壇留竹塢竹隂埽壇石槎牙漢時風雨生蘚花山中笙鶴尚遺響湖外人煙驚歳華道人眸子照秋色邀我分山築丹室驅丁役甲莫兒嬉渴飲隱泉飢餌术上方寺在銷夏灣上檥棹古銷夏搘笻新上方珠灣鎖員折冰鏡沉空光楓纈醉晴日橘黃明蚤霜閒門松竹徑隨處有淸凉銷夏灣吳王避暑處平湖循山一灣雲水勝絶蓼磯楓渚故離宫一曲淸漣九里宫縱有暑光無著處靑山環水水浮空橘園橘中有佳人招客果下遊胡牀到何許坐我金碧洲沉沉剪綵山垂垂萬星毬竒采日中麗生香風外浮折贈黃團雙珍逾桃李投拆開甘露嚢快吸冰泉甌􅀬腦散五濁豈止沉疴瘳未知商山樂能如洞庭不華山寺在西山盡處多泉泓僧房數處有之有湯岐公胡茂老樞密孫仲益尚書諸公題詩五湖西岸孤絶處旃檀大士來同住性空眞水徧淸凉隨縁出現無方所蒙泉新潔鑑泉明瀹茗羮藜甘似乳何須苦問蓮開未桂子菖花了今古三翁綵筆照靑霞從此他山都不數我今閒行作閒客暫借雲窓解包具魂淸骨冷不成眠徹曉跏趺聽粥鼓脚力有餘西塢盡明日灣頭更鳴櫓却上東山喚德雲別峰應在銀濤許縹緲峰西山最髙峰滿載淸閒一棹孤長風相送入仙都莫愁懷抱無消豁縹緲峰頭望太湖鎮下放􅂳過東山二首打頭風急鼻雷鼾醉夢閒心鐵石頑惟有愛山貪未厭西山纔了又東山老禪竿木各逢場詩客端來共葦航一任顚風聒髙浪滿􅂳歡笑和詩忙翠峰寺在東山雪竇顯老道場山半有悟道井庭下大羅漢木兩株虬屈蟠壯甚竒古來從第九天橘社繫歸􅂳借問翠峰路誰參雪竇禪應眞庭下木􅀃法井中泉公案新翻出諸方一任傳社山放􅂳社下鐘聲送客􅂳凌波撾鼓轉滄灣橫煙裊處雞豚社落日濃邊橘柚山八表茫茫孤鳥去萬生擾擾一舟閒湖心行路平如鏡陸地風波却險艱東山渡湖渡􅂳帆飽如張弓倐忽世界寒浺瀜堪輿無垠日夜汎浩浩元氣蓬蓬風湖光日色不可辨但見水精火齊合集成虚空波臣川后敬愛客約束祕怪驅魚龍大千緫作大圓鏡光中飛度迷西東蒼茫一身無四壁八方上下惟孤篷毛仙出迎笑相問何乃自苦荒寒中吾生蓋頭乏片瓦到處漂摇稱寓公猶嫌塵土礙人眼兹遊勝絶餘難同九衢車馬恍昨夢付與一笑隨飛鴻與游子明同過石湖契闊相逢一笑歡當年森桂共驂鸞試談舊事醒村酒仍趂新晴暖客鞍梅粉都皴啼宿雨柳黃不展噤春寒從今鼎鼎多幽事仍喜蛙聲不在官次韻同年楊廷秀使君􅀉題石湖儀凰當瑞九韶成何事栖鸞滯碧城公退蕭然眞吏隱文名藉甚更詩聲句從月脇天心得筆與冰甌雪椀淸書到石湖春亦到平堤梅影縠紋生半世輕隨出岫雲如今歸作卧雲人小山有賦招遊子大塊無私佚老身禪版夢中千嶂曉鬢絲風裏萬花春新年社瓮鵞黃滿賸醉田頭紫領巾自閶門􅀐馬入越城日影穿雲亦未濃夜來踈雨洗淸空村前村後東風滿略數桃花一萬重斷橋隤岸數家村雨少晴多減漲痕雪白鵞兒緑楊柳日髙猶自掩柴門姚夫人輓歌詞衿帨虞鰥後詩書孟母鄰髙懷琴意靜晚福詔恩新自古悲風木于今詠澗蘋松銘無溢美百世考堅珉北山草堂千巖觀新成徐叔智運使吟古風相賀次韻謝之北山松竹堪怡顔千巖觀前多好山誰云都無卓錐地亦尚有此茅三間洞門無鑰常不關小徑百曲蒼龍盤衆芳迷人不知處片雲與我俱忘還花前一杯重鼎吕明日戽田并灌圃種苗種豆從此忙昨夜驚雷送膏雨贈舉書記歸雲丘一枕淸風四十霜孤生無處話淒凉相看只有龎睂客還在雲丘舊草堂四股澗松雷斧碎十圍巖桂燒痕枯不知堦下跳珠處舊竹春來有筍無靑山面目想依依水石風林入夢思白髮蒼顔心故在只如當日看山時題查山林氏菴戸庭淸深宅翠微雪如佳壁喚題詩煙梢矗矗靑圍屋露葉鮮鮮緑滿籬宿雨一春纔汎鴨新蕪幾日巳藏碑山僧見客如枯木疑是懶殘南嶽師木瀆道中風雨震雷大作惡風奔雲何壯哉溪水欲立山欲摧石岸迸裂纜邊樹胡牀動揺􅂳底雷靈巖塔後雨脚挂胥口廟前浪花來篷漏衣沾不足惜酒瓶傾倒愁空罍光福塘上指􅀧炊煙隔莽蒼午餐應可􅀉前莊雞聲人語小家樂木葉草花深巷香春去巳空衣尚絮雨來何晚稻初芒秪今農事村村急第一先陂貯水塘與至先兄遊諸園看牡丹三日行徧柱杖無邊處處過粉圍紅繞奈春何閶門昨日看不足今日婁門花更多蜂蝶蕭騷草露漫小家籬落閉荒寒欲知國色天香句須是􅀝闌燒燭看次韻同年楊使君回自毘陵同泛石湖舟中見贈客舫中流下人家夾岸看洛花堆錦煖吳藕鏤冰寒莫厭淸歡暫須知後會難小詩煩本事任秃綵毫端曲誤不須顧客狂當好看日斜雙槳急風駛夾衣寒賸􅀃歸田樂休歌行路難石湖三萬頃何處覓憂端北渚乗風渡西山帶霧看袖單嫌翠薄杯淺怯金寒宿雨收全易春酲解却難且留行色住重肯過蘇端頃乾道辛卯歳三月望夜與周子充内翰泛舟石湖松江之間夜艾歸宿農圃距今淳熙巳亥九年矣余先得歸田復以是夕泛湖有懷昔遊賦詩紀事石湖花月浮春空憶共仙人同短篷三更半醉吹笛去櫂入濕銀天鏡中鶴鳴喚歸斗未没却歩扶踈花底月不知行到碧桃邊但見天風吹積雪月圓月缺今幾回依舊滿湖金碧堆仙人還上玉堂宿合有片時淸夢來一笑流光飛電抺嫦娥相對兩愁絶桂枝應亦老無花蟾兔不須疑鶴髮嬾牀午坐晴霄垂北窓卧我翠幄中不知幾斧鑿成此太虚空前雲稍過盡後雲來無窮鳥雀有底忙激彈過牆東不如雙飛蝶欵欵弄微風我亦困思生抛書眼蒙茸秋前三日大雨暑殘堪喜亦堪憎恰似沙場喋血兵縱有背城餘燼在能禁幾度瀉檐聲秋前風雨頓凉秋期如約不須催雨脚風聲兩快哉但得暑光如宼退不辭老景似潮來酒杯觸撥詩情動書卷招邀病眼開明日更凉吾巳􅁲暮雲渾作亂峰堆立秋後二日泛舟越來溪三絶西風初入小溪帆旋織波紋縐淺藍行入鬧荷無水面紅蓮沉醉白蓮酣一川新漲熨秋光挂起篷窓受晚凉楊柳無窮蟬不斷好風將夢過橫塘飯後茶前困思生水寛風穩信篙撐不知浪打􅂳頭響聽作凌波解佩聲采菱戸采菱辛苦似天刑刺手朱殷􅀑質靑休問揚荷渉江曲只堪聊誦楚詞聽曉起聞雨老來稍喜睡魔淸兀坐枯株聽五更蕭索輪囷憐燭燼飛揚跋扈厭蚊聲登髙事了從敎雨刈熟人忙却要晴莫道西成便無慮大須濃日㬠香秔􅀃虎軒夜坐白雲深處卧癡頑挂起東窓水月寬但得好詩生眼底何須寶刹現毫端一身莫作官身想萬境都如夢境看蠏舎鄰翁能日醉呼來分與一蒲團偶書太行巫峽費車舟休向滄溟認一漚日下冰山難把玩雨中土偶任漂流元無刻木牽絲技但合收繩卷索休惟有酒缸并飯甑却須秔秫十分收睡覺漏箭聲中斷角哀界窓猶有月徘徊心兵休爲一蚊動句法却從孤鴈來潄罷玉池甘似醴夢餘金鼓辯如雷夜長展轉添許事推枕蕭然一笑咍閶門行送胡子逺著作守漢川前年送君朝明光今年送君還故鄉錦官樓上一樽酒萬里閶門折楊柳吳波沄沄蜀山蒼人生行路如許長相逢相送鬢如雪人生能禁幾離別房湖風月開春臺石湖水雲歸去來西棹東帆君未了相逢還向閶門道嘲蚊四十韻暑魃方肆行羽孽亦厲習肖翹極么魔坱圠累闢翕濕生同糞蝎腐化類宵熠初來鬧郭郛少進亘原隰嚶如蠅聲薨聚若螽羽揖俄爲殷雷鬨遂作密霰集口銜鋼針鋒力洞衲衣襲啾聲先計議著肉便嘘吸立豹猶未定卓錐巳深入血隨姑嘬升􅀔甚轆轤汲沉酣尻益髙飽滿腹漸急晶晶紫蟹眼滴滴紅飯粒拂掠倦體煩爬搔瘁肌澁捄東不虞西擒一巳竄十新瘢蓓蕾漲宿暈斑斕浥竟夜眠轉展連牀歎於悒云何人戚欣乃係汝張歙驅以葵扇風熏以艾煙濕檠長鎭藏遮帳􅂩亟補葺火攻憚穢臭手拍嫌腥汁伏翼佐埽除網蛛助收拾薄暮洶交攻大明訌未戢牛革厚逾氊鱟介銛勝鈒遭汝若欲困嗟人何以給夏蟲雖衆多罪性相百什蜂蠆豈房櫳蟣蝨但褌褶羊羶蟻登爼驥逸蝱附􅎗蠓惟舞醯瓮蟫止祟書袠蚤爲鵂所撮蠅亦虎能執彼愆可貰死汝罪當獻級凉飊倐然至醜類殆哉岌一吹觜吻破再鼓翅翎縶三千蹀頡利百萬走㝷邑快哉六合内蔑有一塵立虚空旣淸凉家巷得寧輯雞窓夜可誦蛩機曉猶織雨簾繡浪卷風燭淚珠泣客來添羽觴人靜拂塵笈恍還神明觀似啓坏戸蟄消長誰使然智力詎能及閶門戲調行客日夜飛帆與跨鞍閶門川陸路漫漫人生自苦身餘幾天色無情歳又寒萬事惟堪六如觀一杯莫信四并難重陽雖過黃花少尚有遲開玉雪團九月二十八日湖上檢校籬落村北村南打稻聲荒園屐齒亦嬉晴菊邊更覺朝陽好松下偏聞晚吹淸一歳無非吾樂事千金不博此閒行周遭踏徧芙蓉岸足痺腰頑栩栩輕晚歩吳故城下意行殊不計榛菅風袖飄然勝羽翰拄杖前頭雙雉起浮圖絶頂一鵰盤醉紅匝地斜曛暖熨練涵空漲水寒却向東臯望煙火缺蟾先暎槲林丹上沙田舎更無雲物起微隂壠畝人家各好音歳晚陽和歸稻把夜來霜力到楓林兒童笑裏豐年面烏鳥聲中落日心釀秫炊秔都入手賸􅂸腰脚辦登臨與現壽二長老遊壽泉因話去年林屋之遊題贈何年錫杖劚淸甘天遣深源壽此菴金靨萬枝浮倒影爲君題作菊花潭松風放浪入雲關二衲相從一士閒人與瘦笻俱老健去年今日在包山渡太湖嚢風閣雨半晴隂慘淡誰知造化心委命浮沉惟一葉計身輕重亦千金紅塵猶道不勝險白浪莫嗔如許深晚得薌山堪􅀉纜卧聽鼉吼與龍吟再渡胥口古來此地快蓬心天繞明湖日照臨一鴈雲平時隱現兩山波動對浮沉衰髯都共荻花老醉面不如楓葉深􅊻戸釣徒來問訊去年盟在肯重㝷跨馬過練墟喜晴稻穗初乾怕雨時晚來蒸煖欲霏微西風若肯吹雲盡不惜飄飄側帽歸晚歸石湖何須駟馬衒鄉關只作歸農老圃看夢裏曽腰綪結佩年來新著惰遊冠和煙種竹聊醫俗帶月聞蛙不在官久矣此心恬不動如今併與此身安北山堂開爐夜坐困眠醒坐一龕多竹洞無關斷客過貪向爐中煨榾柮懶從掌上看菴摩閒無雜念惟詩在老不甘心奈鏡何八萬四千安樂法元無祕密可伽陀入城十里淸風一餉間片帆眞欲解人顔林家莊近聞鵞鴨􅂳到閶門儘未關儘字俗用巳久據理只合用盡字次韻蚤蚊羽蟲么魔塞區寰造化胡爲弗疾頑長養汙泥草木處縱横大地山河間夜聲雷動人力屈秋喙花開天理還但願江湖無白鳥何須金鼎鑄神姦冬至晚起枕上有懷晉陵楊使君新衣兒女鬧燈前夢裏莊周正栩然􅀐馬十年聽曉鼓人生元有日髙眠多稼亭邊有所思冬來撚却幾行髭也應坐擁黃紬被斷角孤鴻緫要詩寒雨何事冬來雨打窓夜聲滴滴曉聲淙若爲化作漫天雪徑上孤篷釣晚江戲贈脚婆日滿東窓照被堆宿窓猶自煖如煨尺三汗脚君休笑曽踏鞾霜待漏來除夜前二日夜雨雪不成花夜雨來壠頭一洗定無埃小童却怕溪橋滑明日先生合探梅次韻章秀才北城新圃方流桃花塢窈窕入壺天碧城當巖岫淸灣如澗泉風月欲無價聊費四萬錢雪後春事起紅雲蜂蝶邊西城如西塞桃花古來多釣艇鱖魚肥前身張志和煙霏幾白鷺風雨一緑蓑淸江韻新引淸絶勝陽阿夢中作漠漠人間一氣平虚無宫殿鎖飛瓊碧雲萬里海光動何處書來金鶴鳴北城爲雪所厄凍蘂粘枝瘦欲乾新年猶未有春看雪花衹欲欺紅紫不道梅花也怕寒雪後六言二首雨聲和深巷屐風力到短檠燈可惜滴殘檐雪從敎漂盡河冰歳寒破屋萬卷風急踈窓一燈髙卧眼生醉纈逺遊鬚有堅冰元夕大風雨二絶東風無賴妒華年一夜淒寒到酒邊放盡珠簾遮畵炬莫敎檐雨濕靑煙河傾海立夜翻盆不獨妨燈更損春凍澁笙簧猶可耐滴皴梅頰􅀔須嗔春懐柳顰梅笑各相惱詩債棋讎俱見㝷莫道幽居無一事春來風物緫關心自橫塘橋過黃山陣陣輕寒細馬驕竹林茅店小帘招東風巳緑南溪水更染溪南萬柳條次韻謝李叔玠追路送筍墮地錦䙀茁解衣温玉姿來償食竹債大勝伏雌炊少日羮藜子老來煨芋師盤餐登異味指動巳先知石湖居士詩集卷二十
