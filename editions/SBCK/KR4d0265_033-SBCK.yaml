front:
  text: 石湖居士詩集卷三十三
  hash: sha256:5f87292e66a83a68602973543b3c783cb249b0b7dad233e40fdc94f5506129b5
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0265_SBCK_033-1a}
body:
  text: 廛居久不見山或勸作小樓以助登覽又力不能辦今年益衰此興亦闌矣結廬占城市初豈􅁲云吉謁醫并治庖二事便衰疾乗除徐自笑翻覺此計失經年不見山無異處暗室平生痼煙霞歲晚成俗物安得百尺樓屋上髙突兀列岫擁靑來爽氣助佔畢嘗試與匠謀工費蝟毛出俸餘強弩末家事空嚢澀經營十年餘髙興竟蕭瑟人生不如意十事常六七身今況遲暮長算屈短日縱成此段竒髮白何由漆且學商山翁彎跧蟄霜橘愛雪歌平生愛雪如子猷江湖乗興常泛舟長篙斲冰隂火迸玉板破碎凝不流淙琤大響出􅂳底兩舷戛擊鏘鳴球棹夫披蓑舞白鳳灘子挽繂拖素虬四開篷窓愛淸供風卷花絮飛來稠飄飄著衣寶唾住片片入酒春酥浮醉中榜入玉煙去耳􅀬不管寒颼颼大千空濛到何許日暮未肯回􅂳頭夜深凍合隨處泊歌呼達曉魚龍愁明朝掬雪頮且潄揮毫落紙雲煙遒新詩往往成故事至今句法留滄洲推遷華年絃柱換俛仰歸鬢塘蒲秋曉衾聞雪亦健起徑欲一棹追昔遊氊衫肨肛束渾脫絮帽匼匝蒙兜鍪十歩出門九歩坐兒女遮􅀃相苛留謂言此是少年事歳晚牖戸當綢繆萬景無窮鼎鼎至百年有限垂垂休夢隨落鴈墮沙觜愁對飢鴟蹲瓦溝重㝷勝踐可復許且挹淸寒揩病眸須􅁷未遽妨性命呼童盡捲風簾鈎牆外賣藥者九年無一日不過吟唱之聲甚適雪中呼問之家有十口一日不出即飢寒矣十日啼號責望深寧容安穩坐氊針長鳴大咤欺風雪不是甘心是苦心大雪送炭與芥隱無因同撥地爐􅁅想見柴荆晚未開不是雪中須送炭聊􅋔風景要詩來雪後苦寒旋融簷滴凍琅玕風力如刀刮面寒雪陣攪空風却軟天公知我􅀝闌干新歲書懷門閴知閒好窓晴與睡宜歲華書户筆年例探梅詩看長棊三著量添飯兩匙豁除身外事未是苦衰遲次韻養正元日六言歳踰耳順俄七年去古稀只三從今蓮葉巢穩誰在槐柯戰酣臍下丹田休想口邊白醭罷參渴飲飢餐困睡是名眞學瞿聃養正詩云流年五十踰二明日半百過三上魏文帝語下樂天語養正今年五十三此句甚工余今年六十七亦自撰三字韻二句次韻姜堯章雪中見贈玉龍陣長空皐比忽先犯鱗甲塞天飛戰逐三百萬當時訪戴舟却訪一寒范新詩如美人蓬蓽愧三粲次韻徐提舉游石湖三絶三徑荒蕪岫幌開錦車何事肯徘徊春風想爲髙人住落絮殘花好在哉日脚烘晴巳破煙山頭雲氣尚披綿却須多謝朝來雨洗淨明湖鏡裏天天上麒麟翰墨林當家手筆擅文心欲知萬頃陂中意但向三篇句裏㝷閏月四日石湖衆芳爛熳北垞南岡緫是家兒童隨逐任驩譁開嘗臘尾蒸來酒􅀧數春頭接過花盡把園林蒙錦繡多添門户鎖煙霞杖藜想被春風笑扶却衰翁管物華檢校石湖新田今朝南野試開荒分手耘鋤草棘場下地若干全種秫髙原無幾謾栽桑蘆芽碧處重増岸梅子黃時早濬塘田里只知温飽事從今􅂸却半年忙致政孫從政挽詞丈室推居士安居稱老夫回骸桑下餓續命轍中枯重道幾三叟輕財似八廚欲知潛德報靑紫付遺孤􅀉題林景思雪巢六言三首大地九冰徹底小巢四壁俱空只有梅花同調雪中無限春風何處温泉火井誰家熊席狐裘堂燕幾番炎􅀬冰􅁞一繭綢繆萬境人蹤盡絶百圍天籟都沉惟餘冷淡生活時復撚髭凍吟枕上二絶效楊廷秀藤枕頻移觸畵屏無憀滋味厭殘更寒雞且道貪眠著窓紙如何不肯明枕前百忍忽紛然舊學新聞緫現前現到天明無可現依前還我日髙眠送文處厚歸蜀類試萬里東來萬里歸正憐寡婦與孤兒死生契闊心如鐵風雨飄摇鬢欲絲早集漢庭陪振鷺莫留岷嶺戀蹲鴟故家零落今餘幾門户非君更屬誰處厚族弟季髙客死成都制置使京仲逺諉送其家扶護還吳􅁣然逺來忘其勞費重送文處厚因􅀉蜀父老三首江上連檣叠鼓行不爭微利即爭名算來無似君瀟灑來往空􅂳載月明下峽東歸十五年因君話舊意茫然煩將逺道悠悠夢􅀡到天西暑雪邊灌口江源不斷流峨睂山月幾番秋江山好處吾能記爲問江山記客否虎丘新復古石井泉太守沈虞卿舎人勸農過之爲賦三絶謹次韻勸耕堂上醉髙年和氣春風共藹然大士亦修隨喜供夜來古井躍新泉落紙雲煙墮翠巒一泓潭月鬭淸寒鳳凰池上揮毫手却掬山泉淬筆端傳聞公作新亭好先報儂家拄杖知便擬挈瓶來煮茗繞闌干角徧㝷詩連夕大風凌寒梅巳零落殆盡三絶枝南枝北玉初匀夜半顚風捲作塵春夢都無三日好一冬忙殺探梅人玉雪飄零賤似泥惜花還記賞花時賞花不許輕攀折只許家人戴一枝花開長恐賞花遲花落何曽報我知人自多情春不管強顔猶作送春詩唐懿仲諸公見過小飲凌寒殘梅之下二絶春風動是隔年期更對殘花把一巵少待和煙和月看依稀猶似未開時問人何處是花蹊香玉勻鋪不見泥莫怪山翁行歩澀更無空處著枯藜雲露堂前杏花蠟紅枝上粉紅雲日麗煙濃看不眞浩蕩光風無畔岸如何鎖得杏園春夢覺作年増血氣減藥密飲食稀氣象不堪􅀃頭顱從可知忽作少年夢嬌癡逐兒嬉覺來一惘然形骸乃爾衰夢中觀河見只是三歲時方悟夢良是却疑覺爲非次韻陳融甫支鹽年家見贈二首范村如荒村一老雪垂領髙軒欵門來驚破雀羅靜披草出迎客玉筍森秀整短章雖寂莫染指巳嘗鼎歸驂不可駐晨昏思定省乃翁一經傳播穫了家事短檠寓眞樂尺璧豈良貴年家有寧馨令我喜無寐加鞭翰墨場一躍羣空冀聞石湖海棠盛開亟攜家過之三絶東風花信十分開細意留連待我來開過十分風不動更無一片􅀧蒼苔家人扶上錦城頭蜂蝶團中爛熳遊報荅春光須小醉紅雲洞裏按伊州低花妨帽小攜笻深淺臙脂一萬重不用髙燒銀燭照煖雲烘日正春濃􅀉題毛君先生蓮華峰菴天台一萬八千丈蓮華峰在諸峰上峰前結屋屋打頭獨有幽人自來往湖海雲遊二十春歸來還作住菴人漫山苦蕒食不盡繞屋長松爲四鄰丹訣三千滿雲笈往來且喜無交渉淸晨石上一爐香此時天地皆訢合我衰無力供樵蘇尚能相伴煖團蒲但願瘦笻縁未斷會把蓮峰分一半石湖居士詩集卷三十三終
