front:
  text: 石湖居士詩集卷二十七
  hash: sha256:07b2437b8901e95b299077c2be5419c0a5ed78ea9651ce89c34a5445eb0285b8
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0265_SBCK_027-1a}
body:
  text: 四時田園雜興六十首并引淳熙丙午沉疴少紓復至石湖舊隱野外即事輒書一絶終歳得六十篇號四時田園雜興柳花深巷午雞聲桑葉尖新緑未成坐睡覺來無一事滿窓晴日看􅁞生土膏欲動雨頻催萬草千花一餉開舎後荒畦猶緑秀鄰家鞭筍過牆來髙田二麥接山靑傍水低田緑未耕桃杏滿村春似錦踏歌椎鼓過淸明老盆初熟杜茅柴攜向田頭祭社來巫媪莫嫌滋味薄旗亭官酒更多􅁅社下燒錢鼓似雷日斜扶得醉翁回靑枝滿地花狼藉知是兒孫鬭草來􅀐吹東來里巷喧行春車馬鬧如煙繫牛莫礙門前路移繫門西碌碡邊寒食花枝插滿頭蒨裙靑袂幾扁舟一年一度遊山寺不上靈巖即虎丘郭裏人家拜埽回新開醪酒薦靑梅日長路好城門近借我茅亭煖一杯歩屧㝷春有好懷雨餘蹄道水如杯隨人黃犬攙前去走到溪邊忽自廻種園得果廑償勞不奈兒童鳥雀搔巳插棘針樊筍徑更鋪漁網蓋櫻桃吉日初開種稻包南山雷動雨連宵今年不欠秧田水新漲看看拍小橋桑下春􅂼緑滿畦菘心靑嫩芥薹肥溪頭洗擇店頭賣日暮裹鹽沽酒歸右春日田園雜興十二絶紫靑蓴菜卷荷香玉雪芹芽拔薤長自擷溪毛充晚供短篷風雨宿橫塘湖蓮舊蕩藕新翻小小荷錢没漲痕斟酌梅天風浪緊更從外水種蘆根胡蝶雙雙入菜花日長無客到田家雞飛過籬犬吠竇知有行商來買茶湔裙水滿緑蘋洲上巳微寒懶出遊薄暮蛙聲連曉鬧今年田稻十分秋吳下以上巳蛙鳴則知無水災新緑園林曉氣凉晨炊蚤出看移秧百花飄盡桑麻小夾路風來阿魏香三旬􅁞忌閉門中鄰曲都無歩往蹤猶是曉晴風露下采桑時節暫相逢汙萊一稜水周圍歳歳蝸廬没半扉不看茭靑難護岸小舟撐取葑田歸茅針香軟漸包茸蓬櫑甘酸半染紅采采歸來兒女笑杖頭髙挂小筠籠榖雨如絲復似塵煮瓶浮蠟正嘗新牡丹破萼櫻桃熟未許飛花減却春雨後山家起較遲天窓曉色半熹微老翁欹枕聽鶯囀童子開門放燕飛海雨江風浪作堆時新魚菜逐春回荻芽抽筍河魨上楝子開花石首來烏鳥投林過客稀前山煙暝到柴扉小童一棹舟如葉獨自編䦨鴨陣歸右晚春田園雜興十二絶梅子金黃杏子肥麥花雪白菜花稀日長籬落無人過惟有蜻蜓蛺蝶飛五月江吳麥秀寒移秧披絮尚衣單稻根科斗行如塊田水今年一尺寛二麥俱秋斗百錢田家喚作小豐年餅爐飯甑無飢色接到西風熟稻天百沸繰湯雪湧波繰車嘈囋雨鳴蓑桑姑盆手交相賀綿繭無多絲繭多小婦連宵上絹機大耆催稅急於飛今年幸甚􅁞桑熟留得黃絲織夏衣下田戽水出江流髙壠翻江逆上溝地􅀔不齊人力盡丁男長在踏車頭晝出耘田夜績麻村莊兒女各當家童孫未解供耕織也傍桑隂學種瓜槐葉初勻日氣凉蔥蔥䑕耳翠成雙三公只得三株看閒客淸隂滿北窓黃塵行客汗如漿少住儂家潄井香借與門前磐石坐柳隂亭午正風凉千頃芙蕖放棹嬉花深迷路晚忘歸家人暗識􅂳行處時有驚忙小鴨飛采菱辛苦廢犁鉏血指流丹􅀑質枯無力買田聊種水近來湖面亦收租蜩螗千萬沸斜陽蛙黽無邊聒夜長不把癡聾相對治夢魂爭得到藜牀右夏日田園雜興十二絶􅂎菊垂珠滴露紅兩蛩相應語莎叢蟲絲􅇢盡黃葵葉寂歷髙花側晚風朱門巧夕沸歡聲田舎黃昏靜掩扃男解牽牛女能織不須徼福渡河星橘蠧如􅁞入化機枝間垂繭似蓑衣忽然蛻作多花蝶翅粉纔乾便學飛靜看簷蛛結網低無端妨礙小蟲飛蜻蜓倒挂蜂兒窘催喚山童爲解圍垂成穡事苦艱難忌雨嫌風更怯寒牋訴天公休掠剰半償私債半輸官秋來只怕雨垂垂甲子無雲萬事宜穫稻畢工隨曬榖􅀡須晴到入倉時中秋全景屬潛夫棹入空明看太湖身外水天銀一色城中有此月明無新築場泥鏡面平家家打稻趂霜晴笑歌聲裏輕雷動一夜連枷響到明租􅂳滿載候開倉粒粒如珠白似霜不惜兩鍾輸一斛尚贏糠覈飽兒郎菽粟瓶罌貯滿家天敎將醉作生涯不知新滴堪篘未今歳重陽有菊花細擣棖虀買鱠魚西風吹上四腮鱸雪鬆酥膩千絲縷除却松江到處無新霜徹曉報秋深染盡靑林作纈林惟有橘園風景異碧叢叢裏萬黃金右秋日田園雜興十二絶斜日低山片月髙睡餘行藥繞江郊霜風擣盡千林葉閒􅀝笻枝數鸛巢炙背檐前日似烘煖醺醺後困蒙蒙過門走馬何官職側帽籠鞭戰北風屋上添髙一把茅密泥房壁似僧寮從敎屋外隂風吼卧聽籬頭響玉簫松節然膏當燭籠凝煙如墨暗房櫳晚來拭淨南窓紙便覺斜陽一倍紅乾髙寅缺築牛宫巵酒豚蹄酹土公牯牸無瘟犢兒長明年添種越城東放􅂳閒看雪山晴風定竒寒晚更凝坐聽一篙珠玉碎不知湖面巳成冰撥雪挑來踏地菘味如蜜藕更􅏂醲朱門肉食無風味只作㝷常菜把供榾柮無煙雪夜長地爐煨酒煖如湯莫嗔老婦無盤飣笑指􅁅中芋栗香煮酒春前臘後蒸一年長饗甕頭淸􅌀居何似山居樂秫米新來禁入城黃紙蠲租白紙催皂衣旁午下鄉來長官頭腦冬烘甚乞汝靑錢買酒廻探梅公子欵柴門枝北枝南緫未春忽見小桃紅似錦却疑儂是武陵人村巷冬年見俗情鄰翁講禮拜柴荆長衫布縷如霜雪云是家機自織成右冬日田園雜興十二絶自晨至午起居飲食皆以牆外人物之聲爲節戲書四絶巷南􅃻板報殘更街北彈絲行誦經巳被兩人驚夢斷誰家風鴿鬭鳴鈴菜市喧時窓透明餅師叫後藥煎成閒居日出都無事惟有開門埽地聲北砦敎回撾鼓逺東禪飯熟打鐘頻小童三喚先生起日滿東窓煖似春起傍東窓手把書華顚種種不禁梳朝餐欲到須巾裹巳有重來晚市魚舫齋信筆燕居故可樂病卧翻可憐身閒儻更健其人半神仙旣無揚州鶴龍鍾任吾年南齋深而明略似西江􅂳􅂳中何所有藥氣雜爐煙親朋稀老伴暫來即飄然秋蠅獨戀戀終朝相撲縁霜晴日色濃窓紙烘春妍但愁添眼花暝坐聊參禪困從定中生瞢騰夢相牽三昧未得力十魔方現前欠伸付一笑朽腐難琱鐫東藍午齋動風順鐘鼓傳家人亦相呼趣具先生餐牛呞能幾何蟬腹易便便此日雖可惜姑付食與眠病中不復問節序四遇重陽旣不能登髙又不觴客聊書老懷四時變遷翻覆手百卉於人亦何有騷客顚詩亦狂酒強惜黃花愛重九少年習氣似陶公采采金英滿衣袖攜壺木末最關情欹帽風前幾搔首饞吻偏憐粽栗香新衣不管嚢茰臭貪將節物趁遨頭肯向賓筵稱病􅅱如今衰颯悟空華現在去來飛電走登臨舊迹如夢斷觴詠故人多骨朽百年長短隨􅂩駒萬化陳新􅀡芻狗不堪把玩堪一笑安用歳時歌拊缶家人亦復探新篘插花洗醆爲翁壽蒲團困坐眼慵開莫把故情看老醜挽鬚兒女太癡生更問今年有詩否閶門初泛二十四韻淳熙丙午重九後十日家人輩以余久病適新修小舫勸扶頭一出以禳祓屯滯遂至北城檢校桃花塢岀關傍漕河望楓橋橫塘中路而還故有即事詠景唐律之作好在馳煙路平生載酒行摧藏身久病契闊歳頻更昨夜燈花曉今朝稻把晴出門新夢境觸目舊詩情水逺推篷眩天寬􅀝柁驚轉灣添繂挽罨岸併篙撐舫後􅋔兒女艫前酌弟兄醅香新麴嫩茗味小春輕紅皺分霜果黃蔫撚夕英纈林踈露屋朱閣靜臨城桃塢論今昔楓橋管送迎山腰樵擔動木末酒旗明竟日窑煙􅀡中流塔影橫數帆殘照滿一笛暮江平㬠網楓邊桁牽􅊻柳際棚岫雲縈石住田水穴堤鳴過渡牛歸速穿籬犬吠獰魚寒猶作陣鴈逺更聞聲急㯭潮痕出踈鐘暝色生鄰翁欣問訊逋客愧寒盟一昨成歸卧于今􅀒耦耕生涯都塌颯心曲漫崢嶸猿鶴休多怨菰蓴尚可羹藥嚢吾厭苦扶憊且班荆小春海棠來禽東君好事惜年華偏愛荒園野老家一任西風管揺落小春自管數枝花丙午東宫壽詩國絫丁年盛天開甲觀祥黃離増煥炳赤伏衍明昌一日三天見元辰萬國康姿神輝玉裕德業燦金相書聖規宸藻文心儷漢章乾坤參久大日月並升常祖武瞻興慶親庭拱未央晨昏兩慈壼詩禮一賢王道統家傳正炎圖國本強桑弧仍榖旦銅律又淸商舊事蘭猗殿新凉桂子香黃華先浥露靑女緩行霜史賀星同軌農歌稼滌場與齡占夢帝多祜叶思皇磐石重山固靈源少海長三宫同壽域歳歳頌無疆重陽後菊花二首寂莫東籬濕露華依前金靨照泥沙世情兒女無髙韻只看重陽一日花過了登髙菊尚新酒徒詩客斷知聞恰如退士垂車後􅀔利交親不到門驟寒吟九月竒寒前未聞巷南巷北無行人冥凌盡用大冬手肯爲歳華留小春隂風吹雨作冰屑駞裘如鐵綿裘折可憐籬下木芙蓉不獨宜霜更宜雪重陽後半月天氣温麗忽變竒寒晦日大雪鄉人御冬之計多未辦狂飇吹小春刮面劇劒鋩雲氣潑濃墨午窓變曛黃六花大如掌浩蕩來無鄉靑女正熟睡不記行新霜寒暑故密移滕巽乃爾狂南鄰炭未買北鄰綿未􅋔敢論酒價湧束薪逾桂芳豈不解蚤計善舞須袖長頻年田薄收十家九空囊被凍知不免但恨太悤忙今朝復何朝晴色挂屋梁人物各解嚴兒童笑相將熙如谷黍温免作溝木僵兩鄰報無恙爲汝歌􅁣慷戲詠絮帽簡伯俊傳此様睡中甚禦寒氣尖斜緇撮似兜鍪緊護風寒煖白頭不解兵前當箭鑿解令曉枕睡􅋜􅋜雪中送炭與龔養正立春前五日誰與幽人煖􅀡身筠籠衝雪送烏薪煩君笑領婆歡喜探借新年五日春代門生作立春書門貼子詩四首煖日黃金柳光風白玉梅門䦨開壽域人物滿春臺有喜何須藥無塵即是仙壺中春日月聊數八千年草木霑雲露峰巒近壁奎新春行樂處南北共花溪日月添書帙湖山引杖藜賸周花甲子多醉玉東西石湖居士詩集卷二十七
