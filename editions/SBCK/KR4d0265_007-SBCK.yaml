front:
  text: 石湖居士詩集卷七
  hash: sha256:eca06f49a5adc9295871f917111586af51cc06cc79668434903e20ec2211b732
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0265_SBCK_007-1a}
body:
  text: 送子文雜言隂谷雲低梅􅀨多黃山滌源溪湧波南風匝地送歸客雙槳下瀨如投梭嚴夫子君舉酒我其爲君歌萬山叢叢石鑿鑿官居破屋巢煙蘿杜鵑曉啼猿暮叫客行到此眞蹉跎窮愁無復理一飲三歎息城東黌舎有佳人解后使我加餐食同郷更同調目擊心巳傳蟄蟲欲作雷奮地萬籟方寂風行山吹竽喚我醒連鼓相追攀飈車電轂不可軰但覺兩腋生飛翰狂歌不必終曲戲奕不必滿局有時不揖上馬去出門大笑驚僮僕窮郷眼冷見未曽道上囁嚅相指目云此陿隘何以有二士直恐翩翩跨黃鵠廣文組解登王畿諸公貴人爭勸歸常日心期有定論贈行不惜重費詞腰金佩璐衆目好汗簡沉碑千載癡一尊有意重山嶽五鼎無心輕網絲嚴夫子應領略別後頻書相發藥我旣爲萬頃之狎鷗君勿作九皐之鳴鶴新館露稻粘明璫風茅衮髙浪荒煙暗白道行行亂蛩響日脚午未吐雲頭晩猶漲欣此半日凉籃輿走淸曠病客不堪暑兹行天肯相蚊蝱埽無跡秋意滿千嶂稍㝷泉石盟略褫簿書障鴒原定相念因風報無恙臨溪寺萬山繞竮竛二水奔澒洞亭亭林中寺金碧燦櫩棟解鞍得蒲團卧受瓦爐供少捐一炊頃暫作百年夢無人自驚覺幽禽正淸哢倦客如殘僧無力供世用此行端爲山紫翠迭迎送潄井出門去驚塵撲飛鞚盤龍驛聞雞一唱罷占斗三星没天髙月徘徊野曠山突兀暗蛩泣草露怨亂語還咽凉螢不復舉􅀧綴稻花末惟餘絡緯豪悲壯殷林樾小蟲亦何情孤客心斷絶魂驚板橋穿足側石子滑行路如許難誰能不華髮髙城謾回首叠嶂屹天闕遥知秋衾夢千里一飄忽竹下松杉晨氣淸桑柘暑隂薄稻穗黃欲卧槿花紅未落秋鶯尚嬌姹晩蝶成飄泊犬騃逐車馬雞驚撲籬落道逢行商問平生幾芒屩頳肩走四方爲口不計脚劣能濡簞瓢何敢議囊橐我亦縻斗升三年去丘壑二俱亡羊耳未用苦商略寒亭溝塍與澗合隴畝抱山轉向來六月旱此地免焦卷早穗巳垂垂晩苗猶剪剪一川豐年意比屋鬧雞犬老農霜須􅁂矍鑠黃犢健自云足踏地常賦何能免刈熟倩人輸不識長官面康年無復事但恐社酒淺我亦有二頃收拾尚可繭懷哉笠澤路歸鏟犂頭蘚淸逸江微生本漁樵長日渺江海扣舷濯滄浪尚􅀃天宇隘朅來車馬路悒悒佳思敗黃塵撲睂鬚驅逐似償債羸驂繫偪仄狂犬吠荒怪郷心入旅夢一葉舞澎湃晨興過墟市喜有魚鰕賣眼明見淸江積􅀨助橫潰褰裳喚扁舟臲卼不勝載不辭野渡險弄水聊一快隱靜山杯渡師道塲五峰抱巖扉千柱奠雲壑荒原蕞爾縣有此寶樓閣維昔經營初衣錫化雙鶴杖頭具隻眼矯矯雲中落尊者一笑許璇題照林薄庭柏有祖意石泉韻天樂淸簧轉碧雞飛梭擲蒼鵲號風飢虎怒失木啼猿愕英遊偶然同吏檄乃不惡題名記吾曽醉墨疥丹堊新嶺瘦馬兀瞢騰荒雞號莽蒼絲窠罥朝露籬落萬珠網宿雲拂樹過飛泉擘山響老桑跼濳虯怪蔓掛騰蟒山行何許深空翠滴羈鞅釀愁積􅀨寒破悶朝日放曈曈赤幟張昱昱金鉦上浮動草花馥淸和野禽唱僕夫有好語沙平路如掌惟憂三溪阻橋斷山水漲送通守趙積中朝議請祠歸天台城頭千峰靑繞屋城下灘流三百曲誰云偪仄復偪仄尚有髙軒肯來辱紅梅花下兩芳春春風惠和如主人搶攘塵土簿書裏見此繅籍天球温厚禄故人車結轍掉頭獨泛淸溪月不從世外得超然世間誰肯如公決生平我亦一沙鷗葦白蘆黃今正秋送公使我歸思動破煙衝􅀨憶扁舟明年想見東山起我亦煎茶石橋水道逢蓑笠把漁竿即是馬曹狂􅁺史送詹道子敎授奉祠養親新安學宫天下稀先生孝友眞吾師斑衣悞作長裾曳二年思歸今得歸牋詞上訴人叵挽璽書賜可羣公歎靑山百匝不留人空與諸生遮望眼白雲孤起越南天向來恨身無羽翰下馬入門懷橘拜身今却在白雲邊鶴髮鬖鬖堂上坐兒孫稱觴婦供果世間此樂幾人同看我風前孤淚墮一杯送舟下水西我欲贈言無好詞徑須喚起束廣微爲君重補南陔詩道子敎授奉祠諸生率余祖席如意院暫移三席欵雲關木末闌干暮紫間絳帳莫貪江上路靑鞵先試水西山伯陽有道來重趼禦寇他年憶解顔怪我抗塵驅俗駕諸公何事許追攀淳安以後十五首㳂檄嚴杭道中篙師叫怒破濤瀧水石如鐘自擊撞欲識人間竒險處但從歙浦過桐江嚴州舟人云自徽至嚴二百灘城府黃塵撲馬鞍一篙重探水雲寒耳邊眼底無公事睡過嚴州二百灘釣臺臺上題詩甚多其最膾炙者曰世祖功臣二十八雲臺爭似釣臺髙山林朝市兩塵埃邂逅人生有往來各向此心安處住釣臺無意壓雲臺桐廬濕雲垂野淡踈林十日山行九日隂梅子弄黃應要􅀨不知客路巳泥深富陽不到江湖恰五年歙山靑繞屋頭邊富春渡口明人眼落日孤舟浪拍天餘杭春晩山花各靜芳從敎紅紫送韶光忍冬淸馥薔薇釅薫滿千村萬落香於濳俚語云於濳昌化􅀑見亦怕邑居官寺兩淒淸晩市都無菜可􅃵何處直能令􅀑怕衹今猶自有人行昌化雙溪館絶景也翠染南山擁縣門一洲橫截兩溪分長官日永無公事卧聽灘聲看白雲百丈山壽聖寺僧房甚雅潔去王干嶺尚六十里沐􅀨梳風有底忙解鞍來宿賛公房傳聞三嶺連天峻未到王千巳斷腸昱嶺竹輿揺兀走婆娑石滑泥融側足過昱嶺不髙人巳困晩登新嶺奈君何王千嶺山靈設險合崢嶸行客何須向此行羸馬不前人􅀨汗此身安得諱勞生刈麥麥熟連􅀨妨刈老農云得便晴即大獲不爾當減分數麥頭熟顆巳如珠小阨惟憂積􅀨餘匄我一晴天易耳十分終惠莫乗除插秧種密移踈緑毯平行間淸淺縠紋生誰知細細靑靑草中有豐年擊壤聲曬繭俗傳葉貴即􅁞熟今歳正爾隔籬處處雪成窩牢閉柴荆斷客過葉貴􅁞飢危欲死尚能包裹一絲窠科桑斧斤留得萬枯株獨速槎牙立暝途飽盡春􅁞收罷繭更殫餘力付樵蘇龍學尚書新安侯羅公挽詞二首汝楫今代丹臺籍頻年緑野居鐵冠眞御史革履舊尚書短世浮雲盡平生半稿餘人言公不朽蘭玉照前除一昨更調瑟如聞欲賜環途殫泣西狩望絶起東山華屋林霏慘新阡草露班春風埋玉淚重爲庾公􅏰龍學侍郎淸河侯張公輓詞二首白水名多士淸河最有聲人危孔北海帝識柳冝城蜀險談間固蠻訌檄到平凌煙何處在風雨上銘旌太息逢萋錦平生付薄冰滄溟淙赤舌白日照靑蠅嶽麓身猶健星維馭巳升天如遺一老人亦望三登新安侯夫人俞氏輓詞蚤兆于凰􅁲來嬪駟馬車夫君冝竹帛子舎各詩書露薤丹旌舉風楊組帳虚空餘彤管訓他日照郷閭次韻甄雲卿晩登浮丘亭賔筵舊壓三千客燕榭新髙十二城潑墨雲頭連樹暗垂絲雨脚過溪生葛巾羽扇吾身健雪椀冰甌子句淸從此相從須痛飲故應此事勝公榮古風上知府秘書二首神仙絶世立功行聞淸都玉符賜長生籋雲遊紫虚雞犬爾何知偶䑛藥鼎餘身輕亦仙去罡風與之俱俯視舊籬落眇莽如積蘇非無鳳與麟終然侣蟲魚微物豈有命政爾謝泥塗時哉適丁是邂逅眞良圖大鵬上扶揺南溟聒天沸斥鷃有羽翼意滿蓬蒿裏不如附驥蠅掣電抺荆薊誰云極么麽俛仰且萬里向來庭戸間決起不踰咫飄颻托方便意氣乃如此物生未可料旦暮倘逢世君看功名場得失一交臂拄笏亭晩望林泉隨處有淸凉山繞闌干客自忙溪雨不飛虹尚飲亂蟬髙柳滿斜陽乳灘徽嚴之間灘如竹節乳灘之險居第一淸溪可怖亦可喜造化於人眞虐戲轟雷捲雪􅁂成絲一擲平生來此試險絶無雙是乳灘舟如滚石下髙山畵樓正􅀝黃昏雨豈識江間行路難浮丘亭知郡秘書新作以望黃山有浮丘容成峰浮丘公容成子之所遊也黟山鬱律神仙宅三十六峰雷雨隔碧城欄檻偃雙旌笑挹浮丘爲坐客巖扉無鎖晝長開紫雲明滅多樓臺雲中仙馭參差是肯爲使君乗興來西崑巉絶不可至東望蓬萊愁弱水誰知芳草徧天涯玉京只在珠簾底他年麟閣上淸空却訪舊遊㝷赤松我亦從公􅀒丹鼎來斸砂牀汲湯井朱砂峰温泉皆在黃山黟山即黃山風月堂章倅新作洪守名而記之天風無邊吹海月景入溪山更竒絶太守文章別乗賢平生付與金杯滑門闌我亦似彭宣想聞橫玉叫蒼煙讀碑索句仍投轄誰是揚州控鶴仙􅀉贈泉石使李元直入覲漢圖昔中天百六啓眞主當時鄧髙密徒歩赴光武諸公上雲臺一葉渺湘浦聲名三十年玉氣貫晴宇向來宣室問天語道舊故不圖太平日復見起兵簿雙旌奠侯服三節臨江滸垂欲大用公少駐議圜府人言山澤官底用廟廊具果聞一乗傳巳踵追鋒去翔鳳覽輝來風采照鴛鷺平生經濟心十不一二吐兹行公勿遜安國如鼎吕休寧南街豪郡城東圃壓州宅誰云沸鑊地氣象不偪仄林園富瓜筍堂密美杉柏山醪極可人溪女能醉客吳子邑中彦毫端萬人敵傳杯相勞苦不覺東方白吳益恭豪士也祁門石梁平波心金刹駕巖腹溪藤卷霜繒山骨琢紫玉東堂有嘉名窈窕窓紗緑落花埽無迹蕉葉森似束主人甚愛客挽袖語陸續衝􅀨出門去役役媿童僕靈山口陵髙類登天斗下劇窺井衡從十里近底用許多嶺秋􅀨釀春泥掀淖力扛鼎僕夫負隅哭邂逅憂性命舊嗤子猷狂夜半槳歸艇方知興盡處頃歩令人癭浮梁大灘石如林小灘石如枿微生拋擲過兩槳砉將割一灘復一灘食頃經七八﨑嶇幸脫免巳足凋􅁂髮我家五湖船鏡面貼天闊行迷勿浪逺歸歟泛花月番陽湖淒悲鴻鴈來泱漭魚龍蟄雷霆一鼓罷星斗萬里濕波翻漁火碎月落村舂急折葦巳紛披衰楊尚僵立長年畏簡書今夕念簔笠江湖有佳思逆旅百憂集回黃坦渥丹楓凋零濃黛柏幽獨畦稻晩巳黃陂草秋重緑平逺一橫看浩蕩供醉目落帆金碧溪嘶馬錦繡谷世界眞莊嚴造物極不俗向非來逺遊那有此竒矚桑嶺回腸山百盤揮手天一握俯驚危棧穿仰詫飛石落挽輿如挽舟絶叫斷雙筰怪蔓􅅶枯槎瘠草被幽壑此豈車馬路誰云強刊鑿人言逺遊好呼來試着脚天都峰黃山維帝有下都作鎭此南國孤撐紫玉樓橫絶太霄碧晶熒砂竇紅夭矯泉紳白晴雲無盡藏竟日裊幽石諸峰三十五離立侍傍側會稽眇小哉請議職方籍温泉黃山朱砂峰下砂牀毓靈源石液潄和氣鬱攸甑常蒸觱沸鼎百沸人生本無垢安用滌腸胃一瓢灔淸肥回首謝羅罻山深人跡罕政以逺爲貴君看華淸池談者至今諱石湖居士詩集卷七
