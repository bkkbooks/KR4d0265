front:
  text: 石湖居士詩集卷三
  hash: sha256:14eac63991ec2209d250cea6c2145e048fadf200b4a43a444c55b08d4c0dc5fe
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0265_SBCK_003-1a}
body:
  text: 擬古彎環樓前月掩抑樓上人人月不得語相看兩凝顰西窓回紋機織徧錦字春聊可自持翫何由將􅀉君立春日郊行竹擁溪橋麥蓋坡土牛行處亦笙歌麴塵欲暗垂垂柳醅面初明淺淺波日滿縣前春市合潮平浦口暮帆多春來不飲兼無句奈此金旛綵勝何次韻漢卿舅即事二絶風捲南枝一夜休孤芳寧肯爲人留淡粧素服眞成夢落月橫參各自愁萬木垂垂欲改柯根萌焦渴奈春何晩來礎汗南風壯會有溪雲載􅀨過晩潮東風吹􅀨晩潮生叠鼓催船鏡裏行底事今年春漲小去年曽與畵橋平一篙一篙新緑浦東西雪絮漫江鴈不飛宿􅀨纔晴風又轉片帆那得及時歸碧瓦碧瓦樓頭繡幙遮赤欄橋外緑溪斜無風楊柳漫天絮不􅀨棠梨滿地花題記事冊庚午劃破虚空一劒間六根同轉上頭關如今宴坐菴中事政在凡夫道法間暮春上塘道中店舎無煙野水寒競船人醉鼓闌􅃢石門柳緑淸明市洞口桃紅上巳山飛絮著人春共老片雲將夢晩俱還明朝遮日長安道慚愧江湖釣手閒江上天色無情淡江聲不斷流古人愁不盡留與後人愁餘杭道中落花流水淺深紅盡日帆飛繡浪中桑眼迷離應欠􅀨麥鬚騷殺巳禁風牛羊路杳千山合雞犬村深一徑通五柳能消多許地客程何苦鎭怱怱陳侍御園坐上愁眼逢歡春水明詩情得酒春雲生花梢蝴蝶作團去竹裏鵓鳩相對鳴邂逅浮生此日好􅅶綿俗累何時輕擘牋沫墨乏竒句擫笛當筵慚妙聲獨遊虎跑泉小菴苔徑彎環入茅齋取次成蔓花縁壁起閒草上堦生宿􅀨松篁色新晴燕雀聲筒泉烹御米聊共老僧傾王希武通判挽詞二首當代名臣後惟公奕世賢及親三釜養遺子一經傳藥石探竒字芸香緝斷編堂堂今不見塵迹自依然事契從先世姻聯亦近親遽爲重壤去凄斷十年鄰物理眞飄忽家聲正隱轔門闌可三戟何止駟車云劇暑赫赫炎官張傘赤帝􅀐龍安得雷轟九地會令雨起千峰次韻時敘新春殘春一夢間夢中兀兀長閉關今朝出門春巳去但見新笋齊屋山作詩惜春聊復爾春亦何能與人事閒心如絮久沾泥但愛日長添午睡夜宴曲以下共二首效李賀金麟噴香煙龍蟠玉燈九枝靑闌干明瓊帶湘簾斑風幃繡浪千飛鸞舞娥紫袖如弓彎雲中一笑天解顔銜杯快卷玻瓈乾花樓促箭春宵寒二十五聲宫􅀧闌神絃雙娥一去三千秋粉篁春淚凝古愁神鼉悲鳴老龍怨水爲翻瀾雲爲留素空逗露晚花泣神官行水鱗僮濕潮聲不平江風急蒼梧冥茫九山立樂神曲以下共四首效王建豚蹄滿盤酒滿盃淸風蕭蕭神欲來願神好來復好去男兒拜迎女兒舞老翁翻香笑且言今年田家勝去年去年解衣折租價今年有衣著祭社繰絲行小麥靑靑大麥黃原頭日出天色凉姑婦相呼有忙事舎後煮繭門前香繰車嘈嘈似風雨繭厚絲長無斷縷今年那暇織絹著明日西門賣絲去田家留客行行人莫笑田家小門戸雖低堪洒埽大兒繫驢桑􅀣邊小兒拂席軟勝氊木臼新舂雪花白急炊香飯來看客好人入門百事冝今年不憂􅁞麥遲催租行輸租得鈔官更催踉蹡里正􅃻門來手持文書雜嗔喜我亦來營醉歸耳牀頭慳囊大如拳撲破正有三百錢不堪與君成一醉聊復償君草鞋費緘口翁張達夫大卿酒尊名酒尊不應緘口客令僕嘲之君子取中道常在語黙間多言固自費不語良獨難此翁身如鄭文淵辨如懸河思如泉邇來緘口欲挂壁囁嚅畏客翻可憐君不見東家玉壺本弟兄叩之猶解語分明願聞胚渾甚深義定自能令一座傾春思沙際緑蘋滿樓頭芳􅀣多光風入網戸羅幕生繡波前年花開憶湘水今年花開淚如洗園􅀣傷心三見花依舊銀屏夢千里次韻漢卿舅臘梅二首垂垂瘦萼泫微霜剪剪纎英鎖暗香金雀釵頭金蛺蝶春風傳得舊宫粧湘袂朝天紫錦裳光風微度絳霄香壽陽信美無仙骨空把心情學澹粧宿東寺二首淡天如水霧如塵殘雪和霜凍瓦鱗織女無言千古恨素娥有意十分春一聲黃鵠夜深歸栖雀驚鳴觸殿扉北斗半垂樓閣外風旛渾欲上雲飛範老前歳相別約歸括蒼便游四明今不知何地暇日有懷春色重來意未闌故人一去肯復還括蒼洞天埽舊隱補陀海岸尋神山杖屨雲煙逺遊樂衣裳風雪行路難鴻飛冥冥鷗浩蕩安得置之雞鶩間癸亥日泊舟吳會亭去年春盤浙江驛湛湛淸波動浮石今年春盤吳會亭冥冥細􅀨濕髙城天邊作客風沙裏今年去年成老矣客心古井冷無波過眼人情亦如水憶昔三生住翠微偶來平地著征衣山中故人應大笑扁舟坐穩何當歸時敘火後意不釋然作詩解之潘郎曉衾夢蘧蘧舞馬竟與融風俱前驅炎官後􅀬屬席捲不貸淵明廬淵明有火後詩君家十年四立壁震風凌􅀨啼妻孥平生白眼蓋九州閉戸不納結駟車淸貧往往被􅀑笑付與一炬相揶揄井垔木刊烏䑕赭汝則暫戲吾何辜天闕悠悠虎豹怒叱閽上訴非良圖作詩聊復相料理甑墮巳破空踟􅦚浮生適來且適去況此茅屋三間餘埽除刼􅁅得空闊新月恰上東牆隅幕天席地正可樂爲君鼓旗助歌呼題湯致逺運使所藏隆師四圖欠伸春風吹夢驀江飛行盡江南只片時深院無人自驚覺夕陽芳􅀣乳鴉啼背立粧臺髻鬟懶鏡鸞應見茸茸眼不須回首更嫣然劉郎巳自無腸斷倦繡猧兒弄煖縁堦走花氣薫人濃似酒困來如醉復如愁不管低鬟釵燕溜無端心緒向天涯想見檣竿旛脚斜槐隂忽到簾旌上遲却㝷常一線花􅀝竹輕薄人情翻覆手冰容却耐幽居久關中舊事逐春休付與新人莫廻首目送斜陽忘却歸竹風揺曳翠羅衣君看脉脉無言處中有杜陵飢客詩嗅梅雪意勒花愁未解背隂一朶寒先退東風還是去年香不比人心容易改宿酒瞢騰正耐春花枝人面兩時新相看好作風流伴只恐花枝却妒人晩歩排門簾幕衣香飄燈火人聲小市橋滿縣月明春意好旗亭吹笛近元宵題開元天寶遺事四首御前羯鼓透春空笑覺花奴手未工一曲打開紅杏蘂須知天子是天公謝蠻舞袖貴妃絃秦國如花虢國妍不賞􅅶頭三百萬阿姨何處費金錢朝天車馬詔頻催斸得新湯未敢開忽報豬龍掀宇宙阿瞞虚讀相書來剥啄延秋屋上烏明朝箭道入東都宫中亦有風流陣不及漁陽突􅀐粗讀甘露遺事二首神理人情本不同絶憐䑕輩倖元功天公盍假毛􅈊助成敗都懸反掌中上林輦路草靑靑誰向憑髙識聖情謾展東封圖畵看不如醲酒亂平生半塘以下二十首城西道中柳暗閶門逗曉開半塘塘下越溪回炊煙擁柂船船過芳草縁堤歩歩來楓橋朱門白壁枕彎流桃李無言滿屋頭牆上浮圖路傍堠送人南北管離愁橫塘南浦春來緑一川石橋朱塔兩依然年年送客橫塘路細雨垂楊繫畵船胥口扁舟拍浪信西東何處孤帆萬里風一􅀨快晴雲放􅀣兩山中斷水粘空香山吳王種香處採香徑裏木蘭舟嚼蘂吹芳爛熳遊落日靑山都好在桑間蕎麥滿芳洲上沙水邊犬吠隔踈林籬落蕭森日半隂繁杏鎖紅春意淺晩梅飄粉暮寒深天平寺以下天平山舊遊彷彿記三年轟飲題詩夜滿山山上白雲應解笑又將塵土涴朱顔三年前至先兄與余同唐少梁登山絶頂比歸迷路捫蘿而下夜巳午主僧散遣羣童秉炬求余三人久而莫得以爲巳仙也是夜宿寺中聯句達曉東坡曰自從有此山白石封蒼苔何常有此樂將去復徘徊至今往來於余心白雲泉泉色正白蓋乳泉龍頭髙啄嗽飛流玉醴甘渾乳氣浮捫腹煮泉烹鬪胯眞成􅀐鶴上揚州山頂翠屏無路強攀縁我與枯藤各半仙不敢髙聲天闕近人間漠漠但寒煙山徑以下髙景山雲根新徑絡山腰暗緑交隂宿露飄行到竹深啼鳥鬧鵓鳩老怨畵眉嬌泉亭收拾風煙鎖翠微亂山窮處結巖扉靑天不盡鳥飛盡吳楚川原似衲衣金氏菴菴廢無人居醉墨題窓側暮鴉蔓藤縁壁走靑蛇春深有燕捎飛蝶日暮無人埽落花平雲閣以下南峰背􅀝天峰湧化宫橫空閣道拖雙虹火雲六月應竒絶靑瑣玲瓏八面風鐵錫支道林遺物八環流韻寶枝鳴古鐵無花紫翠明莫遣閒人容易振泉飛石落􅀑寰驚放鶴亭亦道林故事石門關外古亭基􅀣老藤枯野徑微放鶴道人今不見故應人與鶴俱飛馬跡石傳云道林􅀐白馬升天遺跡今石上雙跡儼然類蹄涔者後人爲小塔識其處跨馬凌空亦快哉龍腰鶴背謾徘徊遊人欲識仙蹤處但覓蒼崖白塔來金沙沙中麩金燦然人或煉取多不成莊嚴福地守靈仙不爲人間計子錢一掬斕斒光照眼路傍饞隷枉流涎龍母廟以下澄照寺孝龍分職隷湘西天許寧親歳一歸風雹春春損桃李山中寒食尚冬衣白蓮堂古木參天護碧池靑錢弱葉戰漣漪怱怱遊子怱怱去不見風淸月冷時白善坑鑿山成井深數十丈復轉爲隧道以取之危險不可逼視銀鬚玉璞紫金精犯難窮探亦有名白堊區區土同價吳儂無事亦輕生石湖居士詩集卷三
