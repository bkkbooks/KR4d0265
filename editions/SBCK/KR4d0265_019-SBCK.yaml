  text: 石湖居士詩集卷十九
  hash: sha256:066420a6ccc1530ed839fc7e4aa3f13b692377b74e905a0052d418950832b776
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0265_SBCK_019-1a}
body:
  text: 犍爲江樓河邊堵立看歸篷三老開頭暮欲東漲水稠灘連峽内淺山浮石似湘中無人驛路榛榛草有客江樓浩浩風種落塵消少公事賸裁新語􅀉詩筒縣令師永錫同年能詩宣化道中瘦草蕭踈巳似秋盤陀山骨束江流兩崖若不頑如鐵爭得狂瀾拍岸休將至敘州亂山滿平野漲水豪大川仄徑無轍跡踈林有炊煙山農旦燒畬蠻賈暑荷氈窮鄉足荒怪打鼓催我􅂳七夕至敘州登鎖江亭山谷謫居時屢登此亭有詩四篇敬用其韻水口故城丘壠平新亭乃有縆鐵橫舊戎州在對江山趾下臨馬湖蠻江路蠻自江出必過城下故寘鎖以爲限今􅁶城過江巳失形勝而猶於亭鎖江特以攔稅而巳非本旨也歸艎擊汰若飛渡一雨徹明秋漲生東樓鎖江兩重客筆墨當代俱詩鳴我來但醉春碧酒星橋脉脉向三更郡醖舊名重碧取杜子美東樓詩重碧酤春酒之句余更其名春碧語意便勝江安道中近瀘州最險處號張旗三灘言張旗之頃巳過三灘其湍急如此瀘戎之間有渡瀘亭然不知孔明竟出何路今鎖江對岸廢城下臨馬湖有韋髙紀功碑巋然荒榛中疑此或是古迹穠緑連村荔子丹瘴雲將雨暗前灣張旗且喜三灘駛叱馭曽驚九折艱瀘水舟閒迷古渡馬湖碑缺伴荒山威名功業吾何有無事飄飄犯百蠻瀘州南定樓歸艎東下興悠哉小住危闌把一杯樓下沄沄内江水明朝同入大江來題譚德稱扇德稱與楊商卿父子送余逺至瀘之合江以扇求詩各爲題一絶蠻風吹雨瘴江肥短草荒山鳥不飛盡是瀘南腸斷句如今分與故人歸題楊商卿扇君歸我去兩銷魂愁滿千山鎖瘴雲後夜短檠風雨暗誰能相伴細論文題楊子容扇雙竹軒窓聽讀書垂天雲翼要摶扶與君只作三年別射䇿東來過石湖譚德稱楊商卿父子送余自成都合江亭相從至瀘南合江縣始分袂水行踰千里作詩以別合江亭前送我來合江縣裏別我去江流好合人好乖明日東西南北路千里追隨不忍歸一杯重把知何處臨岐心曲兩茫然但祝頻書無別語發合江數里􅀉楊商卿諸公臨分滿意􅀃離愁草草無言衹淚流􅂳尾竹林遮縣市故人猶自立沙頭過江津縣睡熟不暇梢􅂳西風扶櫓似乗槎水闊灘沉浪不花夢裏竹間喧急雪覺來􅂳底滚鳴沙恭州夜泊􅒝山磽确強田疇村落熙然粟豆秋翠竹江村非錦里靑溪夜月巳渝州小樓髙下依盤石弱纜西東戰急流入峽初程風物異布裙跣婦緫垂瘤大􅀬泊樂温有懷商卿德稱暑候秋逾濁江流晚更渾瘴風如火焮嵐月似煙昏城郭廩君國山林妃子園故人新判袂得句與誰論涪州江險不可泊入黔江檥舟黃沙翻浪攻排亭濆淖百尺呀成坑坳窪眩轉久乃平一渦熨帖千渦生篙師絶叫􅇌川靈鳴鐃飛渡如奔霆水從岷來如濁涇夜榜黔江聊濯纓玻瓈徹底鏡面淸忽思短棹中流橫釣絲隨風浮月明妃子園涪陵荔子天寶所貢去州里所有此園然峽中荔子不及閩中逺甚陳紫又閩中之最也露葉風枝驛􅀐傳華淸天上一嫣然當時若識陳家紫何處蠻村更有園豐都觀在豐都縣後三里平都山舊名仙都觀相傳前漢王方平後漢隂長生得道處隂君上升時五雲從地湧出丹竈古柏皆其故物晉隋殿宇無恙壁畵悉是當時遺蹟内王母朝元隊仗尤竒道士云此地即所謂北都羅豐所住又名平都福地也神仙得者王方平誰其繼之隂長生飄然空飛五雲軿土賓寥陽留玉京石爐丹氣常夜明寵光萬柏森千齡峽山偪仄岷江縈洞宫福地古所銘云有北隂神帝庭太隂黒簿囚􅀑靈自從仙都啟巖扃明霞流電飛陽晶暉景下墮鑠九冰塞絶苦道升無形至今臺殿棲竛竮隋圬唐堊留丹靑十仙怪竒溪女淸瑶池仙仗紛娉婷琅璈赴節鏘欲鳴我來秋暑如炊蒸汗流呀氣扶枯藤摩挲衆蹟不暇評聊記梗槩知吾曽萬州西山湖亭秋荷尚盛叢薈忽明眼山腰灔湖光列岫繞雲錦深林護風香西山即太華玉井餘秋芳隔江招岑仙共擘雙蓮房下巖疇昔中巖一夢殘下巖風景亦髙寒峽中無處堪停棹雨後今朝始凭闌不用苦求毫相現衹敎長挂水簾看山僧勸我題蒼壁坡谷前頭未敢刊魚復浦泊舟望月出赤甲山山形斷缺如鼉龍坐而張頤月自缺中騰上山頂月出赤甲如金盆蹲龍呀口吐復吞長風浩浩挾之出影落半江沉復翻天髙夜靜四山寂惟有灘聲喧水門髙齋詩翁不可作我亦不眠終夕看夔門即事自東川入峽路至恭州便有癭俗夾岸山悉痺小入夔界山皆傑然連三峽夔水不可飲取之卧龍十里之外雲安麴米春自唐以來稱之今夔酒乃不佳峽行風物不堪論袢暑驕陽雜瘴氛人入恭南多附贅山從夔子盡侵雲竹枝舊曲元無調麴米新篘但有聞試覓淸泠一杯水筒泉須自卧龍分瞿唐行七月十九日至夔子灔澦撒髮不可犯是夜水漲及山腹詰旦視灔澦則巳在水中土人云此靑草齊也可以冒險而入遂鼓棹畧其頂而過郡中遣候兵立山上每一舟平安則揺幟以招後舟白鹽赤甲皆峽口大山黃嵌黒石皆峽中至險處入峽西岸有聖泉舟人或向之疾呼曰人渴也泉即迸下一杯許復乾余舟過甚急未之試也川靈知我歸有程一夜漲痕千丈生中流擊楫洶作氣夾岸簸旗呀失聲不知灔澦在􅂳底但覺瞿唐如鏡平鑿峽䟽川狠石破號山索飲飛泉驚白鹽赤甲轉頭失黒石黃嵌􅂸命輕草齊増肥無泊處竹枝凝咽空餘情人間險路此竒絶客裏驚心吾飽更劒閣翻成蜀道易請歌范子瞿唐行夜泊歸舟州有宋玉宅昭君臺舊國風煙古新凉瘴癘淸片雲將客夢微月照江聲細和悲秋賦遥憐出塞情荒山餘閥閱兒女擅嘉名秭歸郡圃絶句二首花竹蕭騷小圃畦官居翻似隱淪棲巴山四合秋陽滿杜宇黃鸝相對啼孤城偪仄復偪仄前山後山靑欲來市聲蕭條衙鼓靜惟有叱灘喧萬雷叱灘即黃魔灘下連人鮓甕宋玉宅相傳秭歸縣治即其舊址縣左旗亭好事者題作宋玉東家悲秋人去語難工揺落空山草木風猶有市人傳舊事酒壚還在宋家東後巫山髙一首余前年入峽常賦巫山髙今復作一篇十二峰中東西各一峰最竒不可繪畵左右前後餘峰之可觀者尚多不止十二峰也不問隂晴雲物常相暎帶尤爲勝絶但以漲江湍怒難檥泊鼓棹而過不復登廟前余以水暴漲得下瞿唐至巫山縣人云却須水退始可入巫峽一夜水落十餘丈遂不復滯留凝眞宫前十二峰兩峰娟妙翠插空餘峰競秀尚多有白壁蒼崖無數重秋江潄石半山腹􅀝天削鐵荒行蹤造化鍾竒矗瑶巘眞靈擇勝深珠宫朝雲未罷暮雲起隂晴竟日長冥濛瑶姬作意送歸客一夜收潦仍回風仰看館御飛檝過回首巳在虚無中惟餘烏鴉作使者迎􅂳送􅂳西復東黃牛峽廟爲黃牛神所居即石馬繫祠門處東坡所書歐公詩及本事碑石在東廡祠後髙峰之上有黃牛迹客舟甚敬之以歐公故石馬亦有靈扁護甚嚴朝離悲秋宅午榜叠石磯小留黃牛廟細讀石馬詩黃牛隱見蒼山裏石馬至今猶馘耳當年夢境識仙翁馬爲迎門神爲起物生不朽繫所逢歐詞蘇筆蒼苔封山髙水長翁之風石馬亦與翁無窮假十二峰即黃牛峽山自此􅀡至平喜埧千峰重複靡不竒峭巴東三峽數巫陽山入西陵更鬱蒼何以假爲非確論􅀡疑溟涬弟髙唐扇子峽兩岸山尤竒殆過巫峽蝦蟇碚在南岸兹行看山眞飽諳今晨出峽仍窮探南磯北磯白鐵壁千峰萬峰蒼玉篸橫前􅀡疑江巳斷崛起競與天相攙蜀山欲窮此盤礴禹力巳盡猶鐫􅥵望舒宫中金背蟾泥塗脫盡餘老饞下飲岷江不知去流涎落吻如排髯挈瓶檥棹􅆽淸甘未暇煮茗和薑鹽聊將滌硯濡我筆恍惚詩律髙巉巖荆渚中流回望巫山無復一􅀧戲成短歌千峰萬峰巴峽裏不信人間有平地渚宫回望水連天却疑平地元無山山川相迎復相送轉頭變滅都如夢歸程萬里今三千幾夢即到石湖邊魯家洑入沌三江口即岳陽路水大難行遂入沌行沌中最空夐處名百里荒盜區也過盡巴東巫峽長荆川鼓棹更茫茫避風怕入三江口乗月貪行百里荒夜後逢人盡刀劒古來踏地皆耕桑可憐行路難如此一簇寒蘆尚稅場鄂州南樓誰將玉笛弄中秋黃鶴飛來識舊游漢樹有情橫北渚蜀江無語抱南樓燭天燈火三更市揺月旌旗萬里舟却笑鱸鄉垂釣手武昌魚好便淹留題黃州臨臯亭夏口風帆赤壁磯雪堂釃酒竹樓棋繫舟一日黃州下只辦登臨不辦詩江州􅁃樓夜宴前瞰大江後臨廬山登臨名勝殆甲他處􅁃亮南樓乃在武昌非此也亮常刺江州後人製此名非斯樓之要岷江潄北渚廬阜窺南窓名山復大川超覽兹樓雙何必元規塵自足豪他邦使君秫田熟新凉篘酒缸落景澹碧瓦長虹吐金釭客從三峽來噩夢隨奔瀧小留聽琵琶􅂳旗卷修杠請呼裂帛絃爲拊洮河腔曲終四憑闌倦遊心始降明發挂帆去曉鐘煙外撞東林寺慧逺師白蓮社也傍有樂天草堂對山絶頂即天池文殊現燈處李成焚劫南北山獨不毀二林談易繙經宰木春三生猶自裊煙熏客塵長隔虎溪水劫火不侵香谷雲老矣懶供蓮社課歸哉忺讀草堂文山頭一任天燈現箇事何曽落見聞過虎溪對東林蒼巖翠樾下浸大澗宛似靈隱冷泉囑長老法才作亭名曰過溪且爲率山丁薙草定基一朝而畢過溪無限翠屏開大笑從敎虎子猜不獨山中添故事仍敎題作小飛來病倦不能過谷簾三峽􅀉題白龍靑峽紫煙爐山北山南只半塗􅀃與同來緑玉杖他年終補卧遊圖湖口望大孤廬阜岡􅀔斷江流漭相通大孤如小冠插入奫淪中我欲蛻濁浪往馭揚瀾風晃晃銀色界濙濙水晶宫濯足望八荒列宿羅心胸客帆詎肯駐搔首蒼煙叢澎浪磯阻風浦口舟藏㝷丈慳篙師抱膝朝暮閒逆風來從水府廟濁浪欲碎小孤山太白猶髙缺蟾墮長江未盡歸鬢斑短歌聊復怨行路當有聽者凋朱顔馬當洑阻風居人云非五日或七日風不止謂之重陽信拍岸回流逆上磯枯楊折葦靜相依趂墟漁子晨爭渡賽廟商人晚醉歸重九信來風未憗大千行徧昨俱非羈愁萬斛從頭數帶眼今秋又減圍碧葦無思連天生靑山有情終日橫風聲洶怒木朝拔川氣流光珠夜明誰能坐守白頭浪我欲往􅀐金背鯨俛仰之間撫四海可憐歩歩愁江程長風沙夕陽明逺帆髙浪兀孤嶼綿綿淮山來閃閃沙鳥去落木兩山家炊煙南北渡睂伸擊汰行夢愕阻風處九月八日泊池口斜景下天末煙霏酣夕紅餘暉染江色瀲灔琥珀濃我從落日西忽到大江東回首舊遊處曛黃錦城中藥市并樂事歌樓沸晴空故人十二闌豈復念此翁池州九日用杜牧之齊山韻年年佳節歌式微秋浦片帆還欲飛萬里蜀魂思逺道九歌楚調送將歸杯中山影分秋色木末江光借夕暉細撚黃花一枝盡霏霏金屑滿征衣離池陽十里淸溪口復阻風恰從秋浦挂籧篨又泊淸溪十里餘愁水愁風吹帽後作雲作雨授衣初逺㝷草市沽新酒牢閉篷窓理舊書行路阻艱催老病騷騷落雪滿晨梳梅根夾辛苦凌波棹平安入夾􅂳日明漁浦網風側瓦窑煙老圃容挑菜村巫橫索錢且投人處宿終夜得佳眠宿長蘆寺方丈塔廟新浮水汀洲舊布金聊憑一葦力與障萬波侵帆影窺門近鐘聲出院深夜闌雷破夢欹枕聽潮音將至吳中親舊多來相迓感懷有作望見家山意欲飛古來燕晉一沾衣回思客路豈非夢乍聽鄉音眞是歸新事略從年少問故人差覺坐中稀不須更􅀃桑榆晚霜後鱸魚也自肥石湖居士詩集卷十九
