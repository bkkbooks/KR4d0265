front:
  text: 石湖居士詩集卷九
  hash: sha256:5d742b12de96dc2098b88292c8d27168de993fbd440efc6402e2fc2eb48d7552
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0265_SBCK_009-1a}
body:
  text: 次韻尹少稷察院九宫壇齋宿草草馳三里蕭蕭共一餐吏方緜禮蕝公自將詩壇􅂩月窺牀近窓風刮坐寒鴉鳴未忍散端爲四并難冬祠太乙六言四首三一舊傳神呪十神今濟時艱願挽靈旗北指爲君直擣隂山月色朧明碧瓦蠟煙浮動黃簾罡􅀐飈輪欲下一天飛霰纎纎雲木栖烏未動風庭警鶴先鳴殘夜百靈夙駕人間鼻息雷驚行道羽衣縹緲捲班玉珮冬瓏回首金鋪獸面歩虚聲在天風次韻李子永雪中長句黃昏苦寒烏鳥稀吹沙走石交橫飛布衾如鐵復似水夢想東風來解圍豈知天地有竒事夜半窓紙生光輝兠羅寶界佛所現冥凌不敢專璿璣開門􅀝杖眩一色迥立此世空無依少年行樂怳尚記瑶林珠樹中成蹊犬驕鷹俊馬蹄快狡穴未盡須窮追湖海粗豪今豈在但憶鳴哮如餓鴟北鄰亦復淡生活要我忍寒吟此詩手􅀛筆退不可捉墨泓齟齬氷生衣次韻子永見贈建除體建子玉杓直黃昏月如霜除道啓柴扃客來巾履忙滿炷寒缸油共此書檠光平生􅁲鄰願何意登我堂定交吾豈敢南榮慚伯陽執手道古作遺篇記河梁破窓風鳴悲孤客多􅁣傷危腸不捄飢我詩安得昌成章類村歌但可侣牛羊收功翰墨藪微子誰能良開卷得雅音玉鑾導旂常閉戸坐相念雪深梅暗香與胡經仲陳朋元遊照山堂梅數百株盛開九陌緇塵滿客􅁭錢塘門外有園林胡牀住處梅無限酒斾垂邊柳未深晴日煖風千里目殘山剰水一人心元方伯始皆吾黨解后淸遊直萬金次韻胡邦衡祕監斯言向來立千古敢疵瑕有命孤蓬轉何心勁箭加人窮名滿世天定客還家回首冥恩怨虚空不著花三月四日驟煖日脚融晴晩氣暄睡餘初覺薄羅便如何柳絮沾泥處煖似槐隂轉午天久雨地濕汗礎經旬未肯乾破窓隨處有蝸涎衹今不耐春隂得想見黃梅細雨天晝錦行送陳福公判信州漢家麟閣多王侯冠佩相望經幾秋晝錦聲名兩榮耀惟有信州如相州國南門頭折楊柳借問江津垂白叟住在行都四十年曽見歸舟似公否人言公與赤松期飊車羽輪來何時雲出雲歸俱是道苦學赤松還未妙君不見補陀大士海復山隨喜却來觀世間送張眞甫中書奉祠歸蜀種成桃李恰新隂忽憶家山叢桂林客路莫嫌歸計拙春江爭似駭機深一封朝奏鈞天夢萬里江行魏闕心後日還朝飽風露黒頭應有雪絲侵送周子充左史奉祠歸廬陵黃鵠飄然下九關江􅂳載月客俱還名髙豈是孤臣願身退聊開壯士顔傾蓋當年眞旦暮沾巾明日有河山後期淹速都難料相對猶憐􅁂未斑送陳天予大監同年使閩春關十載記英遊蚤喜時才近采旒夷路着鞭方逸駕急流回首忽扁舟雲霄正穩君猶去塵土無邊我合休問訊後車容客否茶山茘浦看南州送陸務觀編修監鎭江郡歸會稽待闕寶馬天街路煙篷海浦心非關愛京口自是憶山隂髙興餘飛動孤忠有照臨浮雲付舒卷知子道根深見􅀃雲門好全家住翠微京塵成歳晩江􅀨送人歸邊鎖風雷動軍書日夜飛功名袖中手世事巧相違送李仲鎭宰溧陽相逢巳歎十年遲冷淡貧交又語離玉筍換班通籍後黃梅催雨送帆時月巖家世猶爲縣仲鎭方叔孫也金瀨溪山好賦詩喚起酸寒孟東野倒流三峽洗餘悲送吳元茂丞浦江玉筍翻乗縣佐車飄然不肯待新除才名巳被人爭􅀃官薄何妨計小踈憶昨西湖同我載從今南浦望君書遥知斂板趨風後始覺丞哉果負予雪晴呈子永碧空無處泊同雲晴入荒園鳥雀馴冰面小風池欲動雪邊濃日瓦如薫塵容俗狀長爲客冷蘂踈枝又作去聲春詩卷豈能生煖􅀬犯寒聊復惱比鄰次韻子永雪後見贈雪瓴待伴半隂晴竟日檐冰溜􅀨聲九陌泥乾塵未動南山石露塔猶明稍聞吉語占農事便覺歸心勝宦情想得秫田來歳好瓦盆加釀灌愁城次韻郊祀慶成帝德重堯緒天心與舜禋慶期符後甲元日際初辛土緯扶南極旄胡拱北辰律諧風自艮衡正斗垂寅桂燎靈宫曉蕭脂太室晨百神森壁壘萬衞密鉤陳日月靑旂色雷霆玉輅塵洗兵銀漢水收雪紫壇春天歩臨黃道仙班像玉宸陶匏宗素樸琮璧慕精純祕祝裒時對髙斿歘下賔金鐘鳴傑簴朱火熭芳薪日麗雞竿矗天旋鳳律新端門敷錫後六合共絪緼從巨濟乞蠟梅寂寥人在曉雞窓苦憶花前續斷腸全樹折來應不惜君家眞色自生香次韻朋元賣花處見梅煙濃日淡不多寒擔上看花雪作團想得竹邊春巳暗明朝走馬過溪看與正夫朋元遊陳侍御園沙際春風捲物華意行聊復到君家年年我是曽來客處處梅皆舊識花官減不妨詩事業地寒猶辦醉生涯城中馬上那知此塵滿長裾席帽斜正月十四日雨中與正夫朋元小集夜歸燈市淒淸燈火稀雨巾風帽笑歸遲月明想在雲堆處客醉都忘馬滑時老去樽前花隔霧春來句裏􅁂成絲浮生不了悲歡事作劇兒童緫未知次韻子永夜雨辦作長愁客工哦苦雨吟挑燈今夕意欹枕故園心漏屋踈踈滴空檐細細斟相過巷南北屐齒怕泥深次韻朋元遊王氏園聯翩歩屧翠微間回首紅塵自鮮歡捲地雨􅄈千澗急擁門雲鎖兩山盤絶憐茶笋能留客仍喜蛙聲不在官雪白楊梅消息未重來應至麥秋寒遊靈石山寺寺門頰壁有仙人顔禹李甲蕭筠三人題詩方運筆時伸臂丈餘閽人驚報王僧回顧巳失矣西湖富淸麗城府塵事并我獨數能來不􅀒雙眼明騷騷殘絮罷颭颭新荷成歳華日夜好遊子能無情午隂釀初暑稍喜巾袂輕小風吹􅁂毛將我入松聲崖寺金碧暗石泉肝膽淸壽藟萬蛟舞靈峰雙髻撐仙人昔來游筆墨上朱甍舉臂㝷丈髙聊得兒童驚老矣謝狡獪題詩記吾曽次韻李器之編修靈石山萬歳藤歌君不見東林怪蔓之詩三百年字如金繩鐵索相糾􅅶不如李侯靈石句筆陣壓倒長城堅藤隂詩律兩秀發此段竒事今無前吾聞草木未有不黃落雨荒霜倒相後先緜緜紫藟天所壽風雨不動常蒼然堅姿絶鄰傲一所深本無極融三泉騰虯舞蛟矯欲去流蘇絡帶翩如仙班荆芘藾得吾黨酌泉共吸杯中天詩成一斗屬太白擘牋揮埽如雲煙北門西掖君自有坐擁紅藥然金蓮山腰澗底莫濡滯早晩天風吹蛻蟬次韻正夫遊王園會者六人丘園窈窕復﨑嶇草木生香景倍殊花下百杯齊物我雲邊一眼盡江湖不知朱戸趦趄者能勝靑山放浪無六逸蕭然眞可畵爲君題作竹溪圖四月五日集陳園照山堂㝷壑經丘到此堂官閑聊作送春忙短籬水面殘紅滿團扇風前衆緑香盡捲簾旌延竹色深斟杯酒納山光洞門無鎖城門近轉午雞啼日正長題寶林寺可賦軒十里山行雜市聲道傍無處濯塵纓寶林寺裏逢修竹方有詩情約略生次韻朋元久􅀨誰釀愁䨧玉宇間都縁梅子要斕斑騰騰困思午猶夢擾擾奔雲風未還休問滿城􅀐馬滑不妨長日閉門閑今朝晴色熹微似乾鵲飛來語屋山韓無咎檢詳出示所賦陳季陵戸部巫山圖詩仰窺髙作歎息彌襟余嘗攷宋玉談朝雲事漫稱先王時本無據依及襄王夢之命玉爲賦但云頩顔怒以自持曽不可乎犯干後世弗察一切溷以媟語曹子建賦宓妃亦感此而作此嘲誰當解者輙用此意次韻和呈以資撫掌瑶姬家山髙插天碧叢竒秀古未傳向來題目經楚客名字徑度岷峨前是邪非邪莽誰識喬林古廟常秋色暮去行􅀨朝行雲翠帷瑶席知何人峽􅂳一息且千里五兩竿頭見旛尾仰窺仙館至今疑行人問訊居人指千年遺恨何當申陽臺愁絶如荒村髙唐賦裏人如畵玉色頩顔元不嫁後來飢客眼長寒浪傳樂府吹復彈此事牽連到温洛更憐塵韈有無間君不見天孫住在銀濤許塵間猶作兒女語公家春風錦瑟傍莫爲此圖虚斷腸次韻樂先生吳中見􅀉八首金鶴飛來尺素通新詩字字挾光風三年湖海關心處都在先生句子中官居門巷果園西桃李成蹊杏壓枝如許年芳忙裏過斬新今日試題詩墓林棲鳥各深枝燕子知巢觸幔飛倘有三椽今巳去不關五斗解忘歸懶不看書似姓邊夢魂飛繞白鷗前須知席帽衝塵出不似篷窓聽􅀨眠送春濛􅀨漲蘋灘荷葉田田柳絮闌想見垂虹三萬頃拍天湖水釣絲寒知從了義透音聞古井無波豈更渾便好一坑埋衆妙何須六結解諸根幾多螻蟻與王侯往古來今共一丘遮莫功名掀宇宙百年兩角􅀉蝸牛粟囊聊復􅀉三餐埋没緇塵懶濯冠紅紫百般紛過眼郷山歳晩自蒼官胡長民監元挽詞太學虀鹽舊中吳翰墨聲關山題柱筆風露讀書檠夜􅀨緑荷破孤墳丹桂生空將擅場手往記玉樓成次韻朋元正夫夜飲歌豪仍作家奕勝豈徼幸莫嗤老非少乃尚可以逞玉瓶引杯長政爾寒漏永二三文章公共此銀燭影陳卿得秀句劉郎一笑領羸驂兀殘夢乗墜恍難省曉枕訌更潮俱墮無何境次韻趙正之同年客中淸班合列大明宫自要牛刀試一同踏徧巉巖吾道在莫將㝷尺較窮通氊車席帽各靑春花下驊騮一鬨塵離合飄零十霜露咸陽客舎有詩人可憐山縣五斤手不識王孫八斗才君自扶揺有霄漢從渠蜩鷃舞蒿萊次韻陳季鄰戸部旦過菴宦遊觸處似懸匏北嶽南山想獻嘲拍手百年休鑄鐵蓋頭一把暫誅茅玉京歳晩梧桐落水國霜淸橘柚包飛錫巳隨歸夢去何人頂上鵲成巢朋元不赴湖上觀雪之集明日余召試玉堂見􅀉二絶次其韻雪溪淸興未渠闌晩上西樓帶月看公子自貪低唱酒肯來同對玉峰寒文場寧復􅁂霜冝白玉堂前雪霽時不惜狂言棖忌諱秃毫冰硯竟無竒石湖居士詩集卷九
