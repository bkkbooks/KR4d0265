front:
  text: 石湖居士詩集卷三十
  hash: sha256:6c72f03e0db451a50f7bc9c4fecc89f6fb68cf905e0e5a141a3d524d17ab6a07
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0265_SBCK_030-1a}
body:
  text: 臘月村田樂府十首并序余歸石湖往來田家得歳暮十事採其語各賦一詩以識土風號村田樂府其一冬舂行臘日舂米爲一歳計多聚杵臼盡臘中畢事藏之土瓦倉中經年不壞謂之冬舂米其二燈市行風俗尤競上元一月前巳買燈謂之燈市價貴者數人聚博勝則得之喧盛不減燈市其三祭竈詞臘月二十四夜祀竈其􅀃謂竈神翌日朝天白一歲事故前期禱之其四口數粥行二十五日煮赤豆作糜暮夜闔家同饗云能辟瘟氣雖逺出未歸者亦留貯口分至襁褓小兒及僮僕皆預故名口數粥豆粥本正月望日祭門故事流傳爲此其五爆竹行此他郡所同而吳中特盛惡􅀑蓋畏此聲古以歳朝而吳以二十五夜其六燒火盆行爆竹之夕人家各又於門首燃薪滿盆無貧冨皆爾謂之相暖􅀬其七照田蠶詞與燒火盆同日村落則以秃帚若麻䕸竹枝輩燃火炬縛長竿之杪以照田爛然徧野以祈絲穀其八分歲詞除夜祭其先竣事長幼聚飲祝頌而散謂之分歲其九賣癡獃詞分歲罷小兒繞街呼叫云賣汝癡賣汝獃世傳吳人多獃故兒輩諱之欲賈其餘益可笑其十打灰堆詞除夜將曉鷄且鳴婢獲持杖擊糞壤致詞以祈利市謂之打􅁅堆此本彭蠡淸洪君廟中如願故事惟吳下至今不廢云冬舂行臘中儲蓄百事利第一先舂年計米群呼步碓滿門庭運杵成風雷動地篩勻箕健無粞糠百斛只費三日忙齊頭圎潔箭子長隔籮耀日雪生光土倉瓦龕分蓋藏不蠧不腐常新香去年薄收飯不足今年頓頓炊白玉春耕有種夏有糧接到明年秋刈熟鄰􅅱來觀還歎嗟貧人一飽不可賖官租私債紛如麻有米冬舂能幾家燈市行吳臺今古繁華地偏愛元宵燈影戲春前臘後天好晴巳向街頭作燈市疊玉千絲似􅀑工剪羅萬眼人力窮兩品爭新最先出不待三五迎東風兒郎種麥荷鋤倦偷閒也向城中看酒壚博簺雜歌呼夜夜長如正月半災傷不及什之三歳寒民氣如春酣儂家亦幸荒田少始覺城中燈市好祭竈詞古傳臘月二十四竈君朝天欲言事雲車風馬小留連家有盃盤豐典祀猪頭爛􅀬雙魚鮮豆沙甘鬆粉餌團男兒酌獻女兒避酹酒燒錢竈君喜婢子􅃲爭君莫聞猫犬觸穢君莫嗔送君醉飽登天門杓長杓短勿復云乞取利市歸來分口數粥行家家臘月二十五淅米如珠和豆煮大杓轑鐺分口數疫􅀑聞香走無處鎪薑屑桂澆蔗糖滑甘無比勝黃􅆝全家團欒罷晚飯在逺行人亦留分褓中孩子強敎嘗餘波徧沾獲與臧新元叶氣調玉燭天行巳過來萬福物無疵癘年榖熟長向臘殘分豆粥爆竹行歳朝爆竹傳自昔吳儂政用前五日食殘豆粥埽罷塵截筒五尺煨以薪節間汗流火力透健僕取將仍疾走兒童却立避其鋒當堦擊地雷霆吼一聲兩聲百􅀑驚三聲四聲􅀑巢傾十聲百聲神道寧八方上下皆和平却拾焦頭叠牀底猶有餘威可驅癘屏除藥裹添酒杯晝日嬉遊夜濃睡燒火盆行春前五日初更後排門然火如晴晝大家薪乾勝豆䕸小家帶葉燒生柴靑煙滿城天半白棲鳥驚啼飛格磔兒孫圍坐犬鷄忙鄰曲歡笑遥相望黃宫氣應纔兩月歳隂猶驕風栗烈將迎陽艶作好春政要火盆生煖􅀬照田􅁞行鄉村臘月二十五長竿然炬照南畝近似雲開森列星逺如風起飄流螢今春雨雹繭絲少秋日雷鳴稻堆小儂家今夜火最明的知新歲田蠶好夜闌風焰西復東此占最吉餘難同不惟桑賤榖芃芃仍更苧麻無節菜無蟲分歲詞質明奉祠今古同吳儂用昏蓋土風禮成廢徹夜未艾飲福之餘即分歳地爐火輭蒼术香飣盤果餌如蜂房就中脆餳專節物四座齒頰鏘冰霜小兒但喜新年至頭角長成添意氣老翁把盃心茫然増年翻是減吾年荆釵勸酒仍祝願但願尊前且強健君看今歲舊交親大有人無此盃分老翁飲罷􅀏撚鬚明朝重來醉屠蘇賣癡獃詞除夕更闌人不睡厭禳鈍滯迎新歳小兒呼叫走長街云有癡獃召人買二物於人誰獨無就中吳儂仍有餘巷南巷北賣不得相逢大笑相捓揄櫟翁塊坐重簾下獨要買添令問價兒云翁買不須錢奉賒癡獃千百年打􅁅堆詞除夜將闌曉星爛糞埽堆頭打如願杖敲􅁅起飛撲籬不嫌􅁅涴新節衣老媪當前再三祝只要我家長冨足輕舟作商重􅂳歸大牸引犢鷄哺兒野繭可繅麥兩岐短衲換著長衫衣當年婢子挽不住有耳猶能聞我語但如我願不汝呼一任汝歸彭蠡湖自嘲二絶終日嘵嘵漫􅀃空觸來依舊與爭鋒登時覺悟忙收拾巳是闍黎飯後鐘惡聲惡色橫相干覿面須㬰萬箭攢有客癡聾都不動方知我被見聞漫海棠欲開雨作春睡花枝醉夢回安排銀燭照粧臺蒼茫不解東風意政用此時吹雨來雨再作政妨海棠漂紅濕紫滿莓苔潑墨濃雲尚送雷風雨豈無他日再何須隨却海棠來蠻觸蠻觸紛拏室未虛心知懲忿欠工夫腹須空洞方容物事過淸凉巳喪吾萬仞我山髙不極一團心火蔓難圖從今立示寒灰觀笑看蒼黃走鄭巫偶然偶然寸木壓岑樓且放渠儂出一頭鯨漫橫江無奈螘鵬雖運海不如鳩躬當自厚人何責世巳相違我莫求石火光中爭底事寛顔收拾付東流曉泊橫塘短夢難成却易驚披衣起潄玉池淸遥知中夜南風轉洶洶前村草市聲次韻􅀽起巖瑞麥此麥兩岐巳黃熟其間又出一靑枝亦巳秀實傳記所未載也民和神福固其宜況有仁先四者施吳稻即看收再熟周牟先巳秀雙岐蕙風半老黃金穗梅雨重春緑玉枝樂不可支聊發詠田間日日是芳時次韻􅀽起巖甘雨即日應祈天遣賢侯惠此州隨車一雨緩千憂藥寮坐看雲穿屋蓮棹歸將葉蓋頭三伏凉來􅃚易得百年飽外更何求合詞但祝爲霖手早侍薰絃十二旒劉德修少卿避暑惠山因便寄贈鳴鳯朝陽尺五天怱怱忽過白鷗邊遥憐海内無雙士獨酌人間第二泉決去君今身似葉贈行誰有筆如椽老夫但祝重相見未擬消魂賦黯然幽棲幽棲先自嬾衣裳秋暑薰肌汗似漿對客緒言多勉強謀家生事緫荒唐蚤眠不待星當戸晚飯常占日半牆莫道閒中無外慕朝朝屈指望新凉園林園林隨分有淸凉走徧人間夢幾塲鐵硯磨成雙􅁂雪桑弧射得一繩麻光隂畵紙爲碁局事業看題檢藥囊受用切身如此爾莫於身外更乾忙七月十八日濃霧作雨不成曉霧障朝暉日脚戰未透儻然成一雨亦足洗塵瞀江南富秋暑老穉呻永晝田間翻畏凉能粃嘉穀秀昨朝東有虹光彩照髙柳占云天掠剰政恐耗􅂛斗陽光趣堅實乗除或相捄臞儒雖病暍且復忍汙垢吳人謂立秋後虹爲天收雖大稔亦減分數戲贈勤長老從君揮麈演金乗我巳無心􅅶葛藤第一圎通三鼔夢大千世界一窓燈罷參柏子庭前意權作梅花樹下僧飯飽閒行復閒坐人間有味是無能次韻􅀽起巖送示郡沼雙蓮圖珠淵玉水折方貟湧出雙蓮照酒邊壓倒小湖三級草増光後沼兩重蓮苕華名字元相並桃葉根株本自連好把吳歈翻楚㱔楊荷新曲勝當年洞庭小湖寺舊得瑞象有草繞之投草湖中生三級紅蓮皮日休有木蘭後池重臺蓮詩云兩重元是一重心皆吳中瑞故事而未有雙蓮之傳也次王正之提刑韻謝􅀽起巖知府送茉莉二檻千里移根自海隅風颿破浪走天吳散花忽到毘耶室似欲橫機試病夫燕寢香中暑氣淸更煩雲􅁂插瓊英明籹暗麝俱傾國莫與礬仙品弟兄再賦茉莉二絶薰蒸沉水意微茫全樹飛來爛熳香休向寒鴉看日景祗今飛燕侍昭陽憶曽把酒泛湘灕苿莉毬邊擘荔枝一笑相逢雙玉樹花香如夢􅁂如絲再賦郡沼雙蓮三絶館娃魂散碧雲沉化作雙葩􅀉恨深千載不償連理願一枝空有合歡心池光闌檻􅀝斜暉把酒看花醉不歸但許鴛鴦相對浴休驚翡翠一雙飛兩岐秀罷巳蒿萊春意還從菡萏回不是使君和氣勝此花應向別人開范村午坐好風入修篁槁葉舞而墮斷續一蛩吟髙下雙蝶過凍樾午隂圎靜極成癡坐老便几杖供慵廢誦弦課蒲團輭易煖困來百骸惰四傍無人聲誰驚短夢破石湖居士詩集卷三十
