  text: 石湖居士詩集卷二十八
  hash: sha256:b9c04d664e6e723712e44b2b3da5414c7af58f7c0d95a8f81a7444e8ba0f00f2
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0265_SBCK_028-1a}
body:
  text: 送聞人伯卿赴銅陵雪壓關山晝掩扃故人何事短長亭折腰􅀡爲瓶無粟便腹猶憐笥有經牒訴塵埃頭更白簡編燈火眼終靑可憐東壁輝光外寥落江湖處士星重送伯卿雪花來無時入春遂三作冰柱凍不解去地纔一握東風畏奇寒未敢破梅萼巳僵員嶠蠶􅃚問紇干雀萬徑無行蹤扣戸驚剥啄故人竹葉舟歳晚夢漂泊自云飢所驅豈不念丘壑經誼金華省文采石渠閣平生百未試墨綬嚇猿鶴取舎一熊掌得喪兩蝸角不嫌干進鈍俯仰無愧怍低回簿書叢萬卷無處著惜哉小舉袖負此不􅀛藥頗聞江臯縣訟簡民氣樂政成松竹林詁訓緝家學廼翁力菑畬待子收播穫三年此書出衆􅀃眇螢皭持歸許窺觀慰我久離索今朝雲潑墨霰雨縱橫落檣竿挽不住帆峭北風惡難忘昆弟語易散淸夜酌怱怱別知賦掩涕倚郛郭送壽老往雲閒行化天平􅂳子過華亭舎衞城中次第行留取鉢盂歸院洗東巖新出一泉淸次韻知府王仲行尚書鹿鳴燕古風昔人重逺行供帳餞出祖矧今燕嘉賔宜有贈行語府公文章公靑紫拾芥取聯翩二百言字字勸稽古戒之書魚蠧勉以雲鵬舉作霖要實用洗兵嫌不武諸生承意氣脫迹蛻農圃明年一聲雷幽蟄起平楚班行入鵷鷺榜貼綴龍虎回頭謝府公公言非漫與府公亦廟廊來蒞瓊林俎千載吳趨行愁絶白紵舞我聞有此作病卧嗟未睹今晨梅驛動副墨到衡宇調髙瑟音希芒寒劍光吐誰云鹿鳴廢正賴廣微補當年羣玉㑹方駕肅飇羽倡酬久寂莫解后相勞苦世故萬浮雲交情一舊雨誰當將詩壇君實東道主苦寒六言簷冰低挂闌角􅂩雪斜侵坐隅春後一寒如此梅花有信來無丁未春日瓶中梅殊未開二首暖閤無人到寒枝爲我橫情鍾吹蘂破靜極覺香生老去魂休斷春來眼且明逃禪時索笑百匝傍窓行夜雪臘前凍朝陽春後蘇人憐踈蘂瘦花笑病翁臞露白能多少尋春似有無詩催全不力煮水換銅壺再題瓶中梅花園林籬落凍芳塵南北枝間玉蘂皴風袂挽香雖淡薄月窓橫影巳精神雪霜春事年年晚今古詩情日日新鐵石如翁猶索句眞成嚼蠟對橫陳王仲行尚書録示近詩聞今日勸農靈巖次韻紀事館娃宫殿壓雲頭自昔登臨隘九州雪浪長風三萬頃蒼煙古木二千秋賔僚誰伴作詩苦父老競傳敷政優想見歸驂穿夜市月邊燈火滿西樓仲行再示新句復次韻述懷神仙懶學古浮丘祖意慵參老趙州四壁塵埃心似水一生風露􅁂先秋病衰謹謝吳中客技拙甘同楚國優斥鷃蓬蒿元自足世閒何必卧髙樓李子永赴溧水過吳訪別戲書送之萬壑斷流冰塞川千巖森玉雪漫天怱怱葉縣雙鳬舄換却山隂訪戴􅂳犯寒書劍出春蘿風雪橋邊得句多牒訴􅌭紛似煙海梅花時節奈君何民病春疫作詩憫之乖氣肆行傷好春十家九空寒螿呻隂陽何者強作孽天地豈其眞不仁去臘奇寒衾似鐵連年薄􅀬甑生塵疲甿憊矣可更病我作此詩當感神題夫差廟縱敵稽山禍巳胎垂涎上國更荒哉不知養虎自遺患只道求魚無後災夢見梧桐生後圃眼看麋鹿上髙臺千齡只有忠臣恨化作濤江雪浪堆翻襪菴夜坐聞雨閒門冷落靜無譁小閣􅄕幃密自遮日晚課程丹竈火夜深光景佛燈花人生寧有病連歳身世略如僧在家步屧尋春非老伴任敎風雨喚雷車睡起憨憨與世共兒嬉兀兀從人笑我癡閒裏事忙晴晒藥靜中機動夜爭棋心情詩卷無佳句時節梅花有好枝熟睡覺來何所欠氊根香軟飯流匙賞海棠三絶芳春隨分到貧家兒女多情惜歳華聊爲海棠修故事去年燈燭去年花燭光花影兩相宜占斷風光二月時但得常如妃子醉何妨獨欠少陵詩憶向宣華夜倚闌花光妍煖月光寒如今蹋颯嫌風露且只銅瓶滿插看午窓遣興家人謀過石湖雲日初収破柱雷小窓坐穩興悠哉燻爐花氣朝酲解茶鼎松風午夢廻謝客門䦨風動竹惜春時節雨肥梅畵􅂳破浪亦一快聞道湖光如潑醅將至石湖道中書事水緑鷗邊漲天靑雁外晴柳堤隨草逺麥隴帶桑平白道吳新郭蒼煙越故城稍聞鷄犬閙僮僕想來迎三月十六日石湖書事三首春事日以闌暑隂正淸美拖笻入林下秀緑照衣袂盧橘梅子黃櫻桃桑椹紫荷依浪花顫筍破苔色起風日收􅀫隂物色有新意鄰曲知我歸爭來問何似病惱今有無加飯日能幾掀髯謝父老衰雪巳如此種木二十年手開南野荒苒苒新歳月依依舊林塘汙萊擅下濕岑蔚驕衆芳菱母尚能痩竹孫如許長憶初學圃時刀笠冒風霜今玆百不堪裹帽人扶將龍鍾數能來猶勝兩相忘湖光明可鑑山色淨如沐閒心愜舊觀愁眼快竒矚依然北窓下凝塵滿書簏訪我烏皮几拂我靑氊褥荒哉賦逺遊幸甚遂初服老紅餞餘春衆緑自幽馥好風吹晚晴斜照入踈竹兀坐胎息匀不覺淸夢熟或勸病中不宜數親文墨醫亦歸咎題四絶以自戒末篇又以解嘲作字腕中百斛吟詩天外片心習氣吹劍一吷病軀垂堂千金意馬塲中汗血􅂩駒影裏心灰吉蠲筆墨安用付與蛛絲壁煤詩成徒能泣􅀑博塞未必亡羊剛將妄言綺語認作錦心繡膓師熸尚合餘燼羹􅀬休吹冷虀解酲縱無五斗且復月攘一鷄送遂寧何道士自潭湘歸蜀塵埃波浪幾東西歸去丹瓢挂杖藜戊已爐中眞造化功成分我一刀圭書劍飄然席未温火雲撲地暑煙昏山黃水濁湖南路竹月荷風憶范村立秋二絶戴楸葉食瓜水吞赤小豆七粒皆吳中節物也三伏熏蒸四大愁暑中方信此生浮歳華過半休惆悵且對西風賀立秋折枝楸葉起園瓜赤小如珠嚥井花洗濯煩襟酬節物安排笑口問生涯秋雷歎吳諺云秋孛轆損萬斛謂立秋日雷也立秋之雷損萬斛吳儂記此占年榖汰哉豐隆無藉在政用此時鳴孛轆向來夏旱連三月吁嗟上訴聲滿屋訟風未慗復占雷助魃爲妖天更酷我雖閒寂忝祠史家請官供尚倉粟塵甑貧交滿目前卒歳將何救􅑎腹但願吳儂言不驗共割黃雲炊白玉天人逺近叵戲論禆竈安能尸禍福用漢中帥閻才元侍郎韻送樊子南西歸兼呈侍郎萬里山巓與水涯春風招看杏園花向來科第直溷子此去文章應滿家休學遊仙窮越巂且從知己控襃斜南樓東望當思我藥裹堆中兩􅁂華子南嘗自岷山西遊窮探勝境多見異人南樓侍郎新作書樊子南遊西山二記後仙山草木鎻卿雲不到花平不離塵十丈牡丹如錦蓋人間姚魏却爭春右牡丹瓶春晚娑羅百葉開仙翁精舎長蓬萊朝元未罷門深閉不管人間有客來右大面題天平壽老方丈二十三年再入山此山於我有前縁時人不用憐衰病天與丹房一線泉壽老近於半山石壁之中得泉眼如筯淸泉如一線涓涓而出大旱不増減欲爲余作小菴於泉傍以煉丹云再遊天平有懷舊事且得卓菴之處呈壽老訪舊光隂二十年殘僧相對兩依然木蘭巳老無花發石竹依前有麝眠萬戸􅀡須􅀛手藥一龕何用買山錢從今半座須分我共􅀃昏昏一覺禪重九日行營壽藏之地家山隨處可行楸荷鍤攜壺似醉劉縱有千年鐵門限終須一箇土饅頭三輪世界猶灰刦四大形骸強首丘螻蟻烏鳶何厚薄臨風拊掌菊花秋得壽藏於先隴之傍俯酬素願感槩交懷密邇松楸地一隅會心何必問靑烏亢宗雖愧鎭公子􅃿世尚從先大夫京兆漢阡賢問望邢山鄭冢儉規模家庭遺訓焄蒿在不學邠卿畵古圗晚登木瀆小樓萬象當樓黼繡張闌干一士立蒼茫雲堆不動山深碧星出無多月淡黃􅀫鳥盡時猶數􅀧歸鴻驚處更斜行松陵政有鱸魚上安得長竿坐釣航題秋鷺圖昨夜新霜冷釣磯緑荷消痩碧蘆肥一江秋色無人問盡屬風標兩雪衣送蘇秀才歸永嘉再入庭闈再入山偷閒百日了金丹他年拔宅上􅂛後休道使親忘我難大道凝神術養形形神俱煉始功成勸君觀妙還觀徼先作頑仙地上行東宫壽詩丁未年有赫題期盛無疆嗣歷昌中興歸濬哲重慶啓元良兩亥開基逺三丁系統長恭惟藝祖太宗皇帝元命皆在亥今太上主上殿下元命皆在丁帝咨同物瑞人􅁲降年祥離日融雙照乾天秉少陽晨昏周内寢詩禮舜巖廊極右辰居煥心前火德光與齡偕聖父德壽協虛皇銅律風占兊瑶山樂奏商􅕴芳鄰五位菊色麗中央視膳斑衣拱傳觴玉契將宸楓霜獻葉仙桂月輸香薫炷爭延祝吟牋曷讚揚形容仁與孝步障有雲章送同年朱師古龍圖赴潼川杏園耆舊如晨星白頭相對眼故靑奉常禮樂照東蜀十年淸名留漢廷蜀人減估天恩厚髙議淸隂猶記否邇來聞道更蠲除此段始終君一手歸見岷峨無愧詞父老笑迎還歎咨賈生未可去宣室屯膏一州誰謂宜魏闕江湖􅀜出處招頭不用催鳴㯭遥知夢境尚京塵啞咤滿􅂳聞魯語蜀士仕於朝者所買婢妾例不肯隨歸獨師古家無一人肯相舎傳以爲奇事蜀人以中原語音爲魯語題趙希逺案鷹圗學射春山萬歳湖牙門列騎卷平蕪如今黃土原邊夢猶識呼鷹嗾犬圖題米元暉吳興山水橫卷道塲山麓接何山影落苕溪浸碧瀾只欠荷花三十里橛頭􅂳上把漁竿圍田歎四絶萬夫陻水水乾源障斷江湖極目天秋潦灌河無洩處眼看漂盡小家田山邊百畝古民田田外新圍截半川六七月間天不雨若爲車水到山邊壑鄰罔利一家優水旱無妨衆戸愁浪􅀃新收若干稅不知逋失萬新收臺家水利有科條膏潤千年廢一朝安得能言兩黃鵠爲君重唱復陂謡素羹氊芋凝酥敵少城土藷割玉勝南京合和二物歸藜糝新法儂家骨董羮夜雨燭花垂穗伴空齋心事如灰入壯懷老倦更闌惟熟睡任他踈雨滴空堦野景菰蒲聲裏荻花乾鷺立江天水鏡寬畵不能成詩不到筆端無處著荒寒除夜地爐書事節物閒門裏人情老境中雁聲凌急雨燈影戰斜風糟䤑新醅白柴錐軟火紅人家忺夜話我巳困蒙茸吳人酌酒瓮浮醅謂之撆䤑酒之精英也元日立春感歎有作二首元日兼春日霜寒又雪寒併煩傳菜手同捧頌椒盤疊膝稀穿履扶頭懶正冠五年如此度寧得諱衰殘元日兼春日閒身是老身行年申􅀡戊交運丑支辛豈敢綦安佚聊希刮鈍屯童兒看書户把筆巳如神古鼎作香爐雲雷縈帶古文章子子孫孫永奉常辛苦勒銘成厎事如今流落管燒香偶書揑目華中影現身有爲皆妄懶方眞巳甘搰搰勤爲圃休向滔滔苦問津書至五千空拄腹錢非十萬不通神君看汗簡沉碑者隨水隨風幾窖塵太上皇帝靈駕發引輓歌詞六首紹運鍾陽九興王撫半千斷鼇媧立極翔鳯漢中天宵旰三星紀希夷十閏年聲容彌宇宙浯石不勝􅒢自將吳津騎誰嬰泰一鋒旄頭連夜落京觀隔江封舞武三成備書文九譯重修攘遺䇿在嗣聖續車攻簫勺妖氛靜甄陶叶氣還春回􅄌殿駕天作祐陵山開闢風雲慘登平日月間艱難雖獨􅇤壽域徧人間傳聖家人禮凝神象帝先勲華今曆數汾社古山川衆父尊歸父中天更有天壽宫何所厭亟上白雲仙帝業雖天廣皇心本谷虛神應游混沌夢不返華胥挍德難涯涘銘功緫緒餘誰能言大道第入四墳書文德堯新廟威靈舊禹山海門賔羽衞地軸啓雲關無路攀仙駕當年拱聖顔小臣衰疾淚空望帝鄉澘别擬太上皇帝輓歌詞六首不進身濟投艱業時乗撥亂機荆榛荒帳殿風雨頮戎衣有日臨黃道無星彗紫微至今淮海上猶詠六龍飛太上皇帝初載御製詩云六龍轉淮海萬騎臨吳津大孝天孚佑精誠敵可摧龍輴遷座至騩馭及泉回永祐千章木􅄌寧萬壽杯古今無此事絶德詔方來斂福開皇極儲祥握赤符宼降千猰㺄胡拜兩單于遺誥之下淮北父老涕泣曰太上皇帝眞主也實受北虜兩朝之拜謂亶亮二首皆嘗在聘使中洗甲民安枕垂衣國覆盂有生何以報壽域亘綿區與子傳神器承家得聖人堦庭天下養壺嶠海中春四葉斑衣樂三加玉􅁽新壽宫如帝所何必上霄晨舞羽修文後投歌講藝時天章雲漢麗國典日星垂麟絶仲尼筆猿啼神禹碑傷心河洛水無處問龍􅀛甫賀蠅傳赦俄驚鶴馭風首山銅鼎就前殿玉巵空日豈揮戈及天無鍊石功如何千萬壽不待九齡終送許耀卿􅁥丞同年赴靜江倅四絶南國春深雁欲回湘江花浪一帆開知君不爲驂鸞去􅀡爲淵明五斗來羅帶江流碧玉峰舊游如夢一星終煩披蘚石㝷題字定有人能記此翁鴈塔交親比斷金故人歳晚更情深只今不隔同年面想見靑雲異日心官塗眞有上竿魚玉筍翻乗别駕車聞道留行有公論從今日日看除書石湖居士詩集卷二十八
