body:
  text: 石湖詩集巻三十一宋范成大撰讀白傅洛中老病後詩戲書樂天號逹道晚境猶作惡陶寫頼歌酒意象頗沉著謂言老将至不飲何時樂未能忘煖熱要是怕冷落我老乃多戒頗似僧律縳閒心灰不然壮氣鼓難作豈惟背聲塵亦自屏杯酌日課數行書生經一囊藥若使白公見應譏太蕭索當否竟如何我友試商略秋夕不能佳眠晝坐既摧頽夜卧亦展轉檢校百骸間無一得安穩四大元假合解散㑹歸盡何煩造化兒前期苦相窘咄咄方書空忽發一笑囅都縁有我相浪把此身認於中有安否隨即生喜愠蟬聲耳根響蠅翅目中暈無明徧大千祇自植愁本化兒安在哉作詩謝不敏王正之提刑見和茉莉小詩甚工今日茉莉漸過木犀正開復用韻奉呈二絶南花宜夏不禁凉猶繞珍叢覔舊香留得典刑傳菊圃别篘新酒待重陽吴中有末利菊花末利吟餘又木犀碧瑶葉底露金支從今日日須捜句莫遣硯池生網絲復用韻記昨日坐中劇談及趙家琵琶之妙呈王正之提刑二絶病來六結總龜藏不用濃薰戒定香花下酒邉非我事但餘消瘦是東陽曹穆新聲和者稀如今妙手屬天支轉關濩索都傳得想見飛凰舞緑絲正之云轉關六么濩索梁州歴統薄媚醉吟商胡渭州此四曲承平時専入琵琶今不復有能傳者余按北夣𤨏言載黔南節度王保義女善彈琵琶夢吴人授曲内有醉吟商一調其來逺矣再題白傅詩香山晚歳惜芳辰索酒尋花一笑欣列子御風猶有待鄒生吹律強生春若将外物關舒慘直恐中途混主賔此老故應深解此逢塲聊戲眼前人石湖中秋二十韻十二年前嘗與工部兄及賔客為此遊今有隔世者感今懐舊而作野外行吾意城中寄却愁半秋三夜月千古五湖舟湧地金芒發行天玉鏡流珠星沉不現銀漢黯如収髙浪連三境長風近十洲水天雙對鏡身世一浮漚迥白包元氣空明熨病眸只憐心浩蕩不管􅁂颼飀放棹真狂矣關門有此不四并非易事一笑亦難謀急管參漁笛清歌間棹謳逢迎成解后嘯咏勸綢繆女擷蘋花獻妻傾竹葉酬今宵如不飲何處可忘憂憶昔誰同賞于今歳恰周陟岡睽魯衛伐木愴應劉獨歎靈光在能追汗漫遊大都縁未盡豈是病都瘳縱意褰篷席輕生倚柁樓節宣誠小爽猶勝賦悲秋中秋後兩日自上沙回聞千巖觀下巖桂盛開復檥石湖留賞一日賦兩絶金粟枝頭一夜開故應全得小詩催籃輿緩緩隨兒女引入天香洞裏來千巖觀下碧瑶林歳晚青青共此心隱士歸兮花未老每年來把一杯深有㑹而作拙是天資􅈸是真本來何用戒香薫強陽氣盡冥恩怨杜徳機深泯見聞念動即時漂鬼國心空隨處走魔軍室中已自空諸有休負天機與地文戲題無常鐘二絶著衫脫袴兩浮休切莫隨渠認路頭三尺蒲牢關底事尋聲接響大悠悠合成四大散成空草木經春便有冬生滅去來相對代為君題作有常鐘自箴有對易成畛域無情那有從違癡人妄認逆境平地自生鐵圍白傅病猶牽愛晁公老未斷嗔莫問是情是性但參無我無人俗物汨陳大好家奴倒迕何誅泡幻初無典要光隂况已桑榆題畢少董繙經圗綘帳胡沙暗青編古意深誰知洛下詠中有越人吟次韻袁起巖喜雨使君精禱動仙靈月御俄從畢噣經昨夜雲頭隨皂盖今朝雨脚挂青𠖇池光拍岸浮州宅湖面粘天漲洞庭賸采吴歈歌歳事傳歸擊壌調中聽昨議復池光亭額故因及之再次喜雨詩韻以表隨車之應仙驅龍效水靈佛螺吹梵演雲經何煩礎汗生蒸潤便借爐薰作晦𠖇一念故應周法界萬神元不隔明庭昌時圭璧形聲應不似周時莫我聽三次喜雨詩韻少伸嘉頌嚮非賢牧政通靈幾負松陵耒耜經天􅄜侵晨占少女雨師連夜檄元㝠作霖豈必求商野召見誰能右漢庭聞有追鋒傳好語從今側耳為君聴府公録示和提幹喜雨之作輙次元韻雨挾潮㾗漲具區流渠决决繞幽居荷鋤日課都忘倦抱甕天機本不踈且喜水平昌谷稻莫教雷假介休車老翁飽外還多事更把林間種樹書雨後田舍書事再用前韻村村畦圃蓺新區處處田廬葺舊居熟透晚梅紅的皪展開新籜翠扶踈向來矜寡猶遺秉此去汙耶又滿車誰解續經如魯史為将連歳有年書放下菴即事二絶無風香吐長絲書架凝塵不下帷鳥雀聲和晴日暖午窓捫蝨坐多時病後天魔不戰降夢中千頃白鷗江心空境寂聲塵盡却愛秋蠅撲紙窓閉門幽僻斷經過静極兼無雀可羅林下故人知幾箇就中老子得閒多寄題西湖并送淨慈顯老三絶南北髙峰舊徃還芒鞋踏徧兩三間近來却被官身累三過西湖不見山膏肓泉石痼煙霞半世遊山不著家老入蒲團三昧定坐看穿膝長蘆芽中秋月了又黄花卯後新醅午後茶别没工夫譚不二文殊休更問毘耶題藥簏合成四大本非真便有千般病染身地水火風都散後不知染病是何人淨慈顯老為衆行化且示近所冩真戲題五絶就作畫賛孤雲野鶴本無求剛被差充粥飯頭擔負一􅓕牙齒債鐘鳴鼓響幾時休冐雪敲氷乞米廻齋堂如海鉢單開衆中若有知恩者一粒何曽齩破來千里驅馳出為人顔容消瘦老於真食輪轉後無餘事莫學諸方轉法輪何時平地起浮圗化得冬糧但付厨推倒禪牀并拄杖飢來喫飯看西湖殿中泥佛已丹青堂上禪師也畫成笑我形骸枯木様無禪無佛太麤生老態浮生自有老規模寒燠隨宜不用拘未盡九秋先挾纊猶賖十月已開爐一心定後㝠欣厭四大安時適慘舒若使強追年少樂直成赤手縳於菟憶昔鉛刀曽齒莫邪銛遊倦歸歟雪滿髯栁帯受風元不結荷盤承露竟無黏逢塲鼓笛如灰冷送老虀鹽似宻甜留得本來真面目行藏何假問龜占梅林先生夫人徐氏挽詞二首擇對鳴珂里宜家駟馬門肅雍成孝敬燕喜助平反閱世彌三夀還鄉忽九原松風揺草露愁絶後堂萱昔簉鯉庭後嘗瞻林下風一從隨地逺五度閱星終教載恩勤在驚呼夢幻空送車知幾兩獨欠舊孤童胡長文給事挽詞三首結綬參髙妙垂紳侍邃清紫荷青𤨏闥玉帳錦官城行矣超龜列終然鬱驥程寂寥經濟事遺恨入銘旌許國心如日還家鬢未星四并供燕喜萬事付攖寧東牖樽猶湛南園醉不醒淒凉招隠格苔蝕履綦青姻館交情厚官聨事契長鳴珂朝並轡秉燭夜傳觴何意塘蒲晚翻哦露薤章羸軀如可強慟哭踞湖岡次韻王正之提刑大卿病中見寄之韻正之得請歸四明并以餞行名卿緒前輩風格如玉山纍纍培塿中見此髙孱顔攬轡忽思歸無人解縻賢飄颻駕紫車浮雲眎朱丹向來小病惱體力今已安胡為犯風雪江湖行路難呼酒煖征衫寧計斗十干倡酬悔不數長懐悲短縁離合固常事怱忙増惘然浩蕩海山春登臨想臞仙笑我守荒徑老繭深裹纒擬題憶鄞句思咽氷下泉遲公寄新作使我頭風痊戲題趙從善兩畫軸三首王正之云從善家有琵琶妓甚工病翁未得見借此畫以戲之一枝香杏一枝梅各占東風挂玉釵居士石腸都似夢王孫心眼怎安排無笑無言兩斷魂一杯誰為煖霜寒情知别有真真在試與千呼萬唤看搔頭珠重歩㣲揺約臂金寒束未牢要見低鬟揎玉腕更須斜抱紫檀槽枕上六言二首寒更寂歴向曉短夣參差屢驚鷄鳴似唤我醒犬吠知有人行獨眠被出圭角晏起帳承隙光一老綢繆牖户幾人顛倒衣裳喜収知舊書復畏答書二絶故人寥落似晨星珍重書來問死生筆意不如當日健􅁂邉應也雪千莖強裁尺素荅相思兩目眵昏腕力疲牽率老夫令至此門前猶說報書遲簡畢叔滋覔牡丹冷落韶光榖雨寒一年孤負倚䦨干欲知春色偏濃處須向香風逕裡看畢園花逕名香風再賦簡養正南北梅枝噤雪寒玉梨皴雨淚䦨干一年春色摧殘盡更覔姚黄魏紫看石湖詩集巻三十一
