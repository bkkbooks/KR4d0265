body:
  text: 石湖詩集巻二十一宋范成大撰秀州門外泊舟拍岸清波撲岸埃黑頭霜􅁂幾徘徊禾興門外官楊栁又見扁舟上堰來臨平道中煙雨桃花夾岸栽低低渾欲傍船來石湖有此紅千葉前日春寒緫未開夜過越上不得遊覽王程公事兩相催衝雨片帆連夜開千巖萬壑在何處山隂道中無好懷豈有酒船尋賀老興盡那能訪安道鑑湖春色漫芳菲付與青青湖畔草道中古意二絶桃李寂無言垂楊照溪緑不見苧蘿人空吟若邪曲浣紗寂不好辛苦觸戰箭東施無麗質安穩嫁鄉縣觀禊帖有感三絶古人賦多情無事輒愁苦蘭亭一觴詠感慨乃如許寳章薶九泉摹本範百世白鵞滿波間誰識腕中意三日天氣新禊飲傳自古今人不好事佳節棄如土浙東舟中處處槿樊圃家家桃廡門魚鹽臨水市煙火隔江村雨過張帆重潮來汲井渾彎跧短篷底休說兩朱轓初赴明州四征惟是欠東征行李如今忽四明海接三韓諸島近江分七堰兩潮平擬將寛大來宣詔先趂清和去勸耕頂踵國恩元未報驅馳何敢歎勞生昌國縣圖障於海中題字云自此與髙麗國接界蓋宇内極東處也寄虎丘範長老誰云簪紱坐成禽亦漫為官漫好音身已備嘗生老病心何曾住去來今一波不動月空照萬籟無情風自吟持此東歸似同志故應分我半山林次韻汪仲嘉尚書喜雨雨雲渾似雪雲同天意人心本自通吏役驅驅騎馬滑何如欹枕閉門中老身窮苦不須憂未有毫分慰此州但得田間無歎息何須地上見錢流曉起窻明驚起倒裳衣鈐索頻揺定怪遲即入簿書叢裏去少留欹枕聽黄鸝大風四明亦有颶風颶母來從海若家青天白地忽飛沙煩將殘暑驅除盡只莫顛狂損稻花大黄花大芋髙荷半畝隂玉英危綴碧瑶簪誰知一葉蓮花面中有將軍劔㦸心進修堂前荷池方池留水勝埋盆露入蓮腮沁粉痕鈴索無聲人不到小禽飛入閙荷根州宅堂前荷花凌波仙子静中芳也帶酣紅學醉粧有意十分開曉露無情一餉斂斜陽泥根玉雪元無染風葉青葱亦自香想得石湖花正好接天雲錦畫船凉新茘枝四絶茘浦園林瘴霧中戎州沽酒擘輕紅五年食指無占處何意相逢萬壑東海北天西兩􅁂蓬閩山猶欠一枝笻鄞船茘子如新摘行脚何須更雪峰甘露凝成一顆冰露穠冰厚更芳馨夜凉將到星河下擬共嫦娥鬬月明趠泊飛來不作難紅塵一騎笑長安孫郎皺玉無消息先破潘郎玳瑁盤四明海舟自福唐來順風三數日至得茘子色香都未減大勝戎涪間所産莆陽孫使君許寄蜜茘過期不至貳車潘進奏餉玳瑁一種亦佳并賦之角東道院午坐一夜西風轉酒旗午餘殘暑不多時緑荷半蝕霜前葉丹桂全封雨後枝忙裏有詩償日課老来無賦為秋悲梳頭小隷那知此强向窻前數􅁂絲東門外觀刈熟民間租米船相銜入城喜作二絶菊莎把棘㸑無煙日日文書横索錢今日甬東官况好東津門外看租船文書謂諸司督逋者潮到靈橋緑繞船海邊力穡屢豐年淡青山色深黄稻恰似胥門九月天探木犀秋半秋香花信遲攀枝擘葉看纎微昨朝尚作茶槍瘦今雨催成粟粒肥九月五日晴煖歩後園海氣烘晴入斷霞半空雲影界山斜輕羅小扇游蜂畔只比東風有菊花九日憶菊坡菊坡長恨隔横塘城郭山林自不雙放棹松江花已逺濤江之外更鄞江重陽九經堂作俗間佳節自悤悤老去悲秋又客中青嶂捲簾三面月黄花吹􅁂幾絲風十年故國新栽栁萬里他鄉舊轉蓬誰與安排今夜夢片帆飛到小籬東真瑞堂前丹桂血色凡花太俗生花工新意染秋英􅂁紅太重鞓紅淺畫不能摹句寫成官忙風月鎮長閒開遍香紅酒尚寒若要與花相領略千巖隨分有闌干石湖千巖觀前手植丹桂二畝題羔羊齋外木芙蓉慵粧酣酒夕陽濃洗盡霜痕看綺叢緑地團花紅錦障不知庭院有西風進思堂夜坐懷故山塵事潮來不可推身如病鶴强毰毸簿書遮斷尋詩路風雨驚殘問月杯想得竹門無客到直須雪夜有船㢠廻鱸鄉望眼雙明處祇欠凌霄萬仞臺楊少監寄西征近詩來因賦二絶為謝詩巻第一首乃石湖作别時倡和也柴門重客醉中歸尚憶揮毫索紙時何物與儂供不朽西征巻首石湖詩錦囊隨上越王臺天海風濤亦壯哉書到嶺頭梅恰動一枝應伴一篇來羔羊齋小池兩涘木芙蓉盛開有懷故園洞户掩秋深畫橋横晚静嫋嫋芙蓉風池光㺯花影懷我白鷗邊錦帳繚千頃明河拍岸平紅緑染天鏡釣船無畔岸收拾入簿領牆籓束院落寒窘令人癭鹿鳴席上贈貢士登陸由來說四明台星光處更魁星海濵二老尊周室館下諸生右漢廷秋賦重增人物志春闈俱上佛名經一飛好趂扶揺便咫尺西興是北溟大廳後堂南窻負暄萬壑無聲海不波一窻油紙暮春和醉眠陡覺氍毹贅圍坐翻嫌榾柮多水煖玉池添潄嚥花生銀海費揩摩端如擁褐茅檐下祇欠烏烏擊缶歌晚歩北園刮地晴飊退海痕出門無扇可障塵麥粘瘠土何時雪梅糝踈林昨夜春天鏡風煙疑夢事􅁂霜時節尚官身裹章束帶朝還暮慚愧青鞋紫領巾謝賜臘藥感遇之什鴻寳刀圭下九關十年長奉璽封看扶持蒲栁身猶健收拾桑榆嵗又寒天地恩深雙鬢雪山川途逺一心丹疲甿疾苦今何似拜手歸來愧伐檀立春後一日作浮生萬法本悠哉大笑羲娥轉轂催官事已邀癡作伴春風應共老俱來雲容雪意將詩問栁眼花心待酒媒九十韶光天不斳人間笑口自難開春前十日作臘淺猶賒十日春官忙長愧百年身雪催未動詩無力愁遣還來酒不神節物何曾欺老病書生自慣說悲辛終期戚促成何事今古紛紛一窖塵三江亭觀雪隂山陽朔雪中廻行到天西玉作堆乘興却遊東海上白銀宫闕認蓬萊懷歸寄題小艇日出塵生萬劫忙可憐虛費隙駒光若教閒裏工夫到始覺淡中滋味長嵗晚角巾思芋栗年來手版愧耕桑松風蘿月須相信春水深時上野航雪後雨作瑞葉飛來麥已青更煩膏雨發欣榮東風不是厭滕六却怕雪天容易晴再雪銀竹方依檐住瑶花又入簾窺一白本憐麥瘦重來應為梅遲立春日陪魏丞相登三江亭佳節登臨始此囘聊從晻靄望蓬萊水分江北渡頭去風自海東潮外來太白天寒猶帶雪十洲池煖已浮醅一尊往酹發船鼓我亦歸帆相次開寄題鹿伯可見一堂夢覺春闈俱轉蓬仙凡今隔玉霄東聊攀鐵鎖問何似豈敢避堂邀蓋公生來於君一嵗長決去愧我三年遲今世誰不落第二著鞭尚續堂中詩雪溪興盡船當廻却擬登陸遊天台經行見一堂前路轉入湖山尋悞來將赴建康出城牒訴繽紛塞甕天經年癡坐兩三椽出門納納乾坤大依舊青山繞畫船寺莊大麥成苞小麥深秧田水滿緑浮針今年一飽全無慮寛盡歸舟去客心育王方丈窻紙悲嘶萬壑風石梁飛澗倒枯松因勤昨夜三更雨添作投淵雪色龍鰻井決甃神通未易論雨聲留客夜翻盆不辭客路春泥滑且足秧田舊水痕妙喜泉二士共談碑上法千僧同酌沼中泉法門泉味知多少水桶繩頭一串穿明月堂古來禪窟銷巖扃拂子崔嵬拄杖横塔上佛光堂上月莫言公案不分明自育王過天童松林三十里竹輿窈窕入蕭森逗雨梳風冷客襟翠錦屠蘇三十里不知脚㡳白雲深香山抖擻軒裳一鬨塵任教空翠滴烏巾老身已到籃輿上處處青山是故人育王望海亭海雲晻靄日蘢葱案指光中萬象空想見蓬萊西望眼也應知我立長風天童三閣千佛羅漢善財松蘿羃天墮空翠迎面風香三千里曾宫亭亭隔瑶水碧瓦瓊榱五雲裏千佛當門無半偈聲聞未解祖師意徧參踏破青鞋底前樓後閣玲瓏起閒客那知如許事東齋聽雨爛熳睡覺來一轉聊布施普請雲堂來擬議石湖詩集卷二十一
