閒散替勞生親戚小集避濕違寒不出門一冬未省正冠巾月從雪後皆竒夜天向梅邉有别春秉燭登臨空話舊擁爐情味莫懐新榮華勢利輸人慣贏得尊前現在身立春枕上擇蔬翻餅閙殘更兒女喧喧短夢驚想得春風連夜到東禪粥鼓忽分明睡覺尋思斷夢半瞢騰漸見天窓紙瓦明宿鳥噪羣穿竹去縣前猶自打殘更石湖詩集巻二十九欽定四庫全書石湖詩集卷三十宋范成大撰臘月村田樂府十首并序余歸石湖往來田家得歳暮十事採其語各賦一詩以識土風號村田樂府其一冬舂行臘日舂米為一歳計多聚杵臼盡臘中畢事藏之土瓦倉中經年不壞謂之冬舂米其二燈市行風俗尤競上元一月前已買燈謂之燈市價貴者數人聚博勝則得之喧盛不減燈市其三祭竈詞臘月二十四夜祀竈其說謂竈神翌日朝天白一歳事故前期禱之其四口數粥行二十五日煮赤豆作麋暮夜闔家同饗云能辟瘟氣雖逺出未歸者亦留貯口分至襁褓小兒及僮僕皆預故名口數粥豆粥本正月望日祭門故事流傳為此其五爆竹行此他郡所同而吴中特盛惡鬼盖畏此聲古以歳朝而吴以二十五夜其六燒火盆行爆竹之夕人家各又於門首燃薪滿盆無貧冨皆爾謂之相暖熱其七照田蠺行與燒火盆同日村落則以秃帚若麻䕸竹枝輩燃火炬縳長竿之杪以照田爛然徧野以祈絲榖其八分歳詞除夜祭其先竣事長幼聚飲祝頌而散謂之分歳其九賣癡獃詞分嵗罷小兒繞街呼叫云賣汝癡賣汝獃世傳吴人多獃故兒輩諱之欲賈其餘益可笑其十打灰堆詞除夜将曉鷄且鳴婢獲持杖擊糞壌致詞以祈利市謂之打灰堆此本彭蠡清洪君廟中如願故事惟吳下至今不廢云冬舂行臘中儲蓄百事利第一先舂年計米群呼歩碓滿門庭運杵成風雷動地篩勻箕健無粞糠百斛只費三日忙齊頭圎潔箭子長隔籮耀日雪生光土倉瓦龕分盖藏不蠧不腐常新香去年薄収飯不足今年頓頓炊白玉春耕有種夏有糧接到明年秋刈熟鄰叟來觀還歎嗟貧人一飽不可賖官租私債紛如麻有米冬舂能幾家燈市行吴臺今古繁華地偏愛元宵燈影戲春前臘後天好晴已向街頭作燈市疊玉千絲似鬼工剪羅萬眼人力窮兩品争新最先出不待三五迎東風兒郎種麥荷鋤倦偷閒也向城中看酒壚博簺雜歌呼夜夜長如正月半災傷不及什之三歳寒民氣如春酣儂家亦幸荒田少始覺城中燈市好祭竈詞古傳臘月二十四竈君朝天欲言事雲車風馬小留連家有盃盤豐典祀猪頭爛熱雙魚鮮豆沙甘鬆粉餌圎男兒酌獻女兒避酹酒燒錢竈君喜婢子闘爭君莫聞猫犬觸穢君莫嗔送君醉飽登天門杓長杓短勿復云乞取利市歸來分口數粥行家家臘月二十五淅米如珠和豆煮大杓轑鐺分口數疫鬼聞香走無處鎪薑屑桂澆蔗糖滑甘無比勝黄粱全家團欒罷晚飯在逺行人亦留分褓中孩子強教嘗餘波徧沾獲與臧新元叶氣調玉燭天行已過來萬福物無疵癘年榖熟長向臘殘分豆粥爆竹行歳朝爆竹傳自昔吴儂政用前五日食殘豆粥埽罷塵截筒五尺煨以薪節間汗流火力透健僕取将仍疾走兒童却立避其鋒當堦擊地雷霆吼一聲兩聲百鬼驚三聲四聲鬼巢傾十聲百聲神道寧八方上下皆和平却拾焦頭叠牀底猶有餘威可驅癘屏除藥裹添酒杯晝日嬉遊夜濃睡燒火盆行春前五日初更後排門燃火如晴晝大家薪乾勝豆䕸小家帶葉燒生柴青煙滿城天半白棲鳥驚飛啼格磔兒孫圍坐犬鷄忙鄰曲歡笑遥相望黄宫氣應纔兩月歳隂猶驕風栗烈将迎陽艶作好春政要火盆生煖熱照田蠺行鄉村臘月二十五長竿然炬照南畝近似雲開森列星逺如風起飄流螢今春雨雹繭絲少秋日雷鳴稻堆小儂家今夜火最明的知新歳田蠺好夜䦨風焰西復柬此占最吉餘難同不惟桑賤榖芃芃仍更苧麻無節菜無蟲分嵗詞質明奉祠今古同吴儂用昏盖土風禮成廢徹夜未艾飲福之餘即分歳地爐火軟蒼术香飣盤果餌如蜂房就中脆餳專節物四座齒頰鏘氷霜小兒但喜新年至頭角長成添意氣老翁把盃心茫然増年翻是減吾年荆釵勸酒仍祝願但願尊前且強健君看今歳舊交親大有人無此盃分老翁飲罷笑撚鬚明朝重來醉屠蘇賣癡獃詞除夕更䦨人不睡厭禳鈍滯迎新歳小兒呼叫走長街云有癡獃召人買二物於人誰獨無就中吴儂仍有餘巷南巷北賣不得相逢大笑相捓揄櫟翁塊坐重簾下獨要買添令問價兒云翁買不須錢奉賖癡獃千百年打灰堆詞除夜将䦨曉星爛糞埽堆頭打如願杖敲灰起飛撲籬不嫌灰涴新節衣老媪當前再三祝只要我家長富足輕舟作商重船歸大㹀引犢鷄哺兒野繭可繅麥兩岐短衲换著長衫衣當年婢子挽不住有耳猶能聞我語但如我願不汝呼一任汝歸彭蠡湖自嘲二絶終日嘵嘵漫說空觸來依舊與争鋒登時覺悟忙収拾已是闍黎飯後鐘惡聲惡色横相干覿面須臾萬箭攅有客癡聾都不動方知我被見聞瞞海棠欲開雨作春睡花枝醉夢囬安排銀燭照粧臺蒼茫不解東風意政用此時吹兩來雨再作政妨海棠漂紅濕紫滿莓苔潑墨濃雲尚送雷風雨豈無他日再何湏隨却海棠來蠻觸蠻觸紛拏室未虚心知懲忿欠工夫腹須空洞方容物事過清凉已䘮吾萬仞我山髙不極一團心火蔓難圗從今立示寒灰觀笑看蒼黄走鄭巫偶然偶然寸木壓岑樓且放渠儂出一頭鯨漫横江無奈螘鵬雖運海不知鳩躬當自厚人何責世已相違我莫求石火光中爭底事寛顔収拾付東流曉泊横塘短夢難成却易驚披衣起潄玉池清遥知中夜南風轉洶洶前村草市聲次韻袁起巖瑞麥此麥兩岐已黄熟其間又出一青枝亦已秀實傳記所未載也民和神福固其宜况有仁先四者施吴稻即看収再熟周牟先已秀雙岐蕙風半老黄金穂梅雨重春綠玉枝樂不可支聊發詠田間日日是芳時次韻袁起巖甘雨即日應祈天遣賢侯惠此州隨車一雨緩千憂藥寮坐看雲穿屋蓮棹歸將葉盖頭三伏凉來那易得百年飽外更何求合詞但祝為霖手早待薫絃十二旒劉徳修少卿避暑惠山因便寄贈鳴鳯朝陽尺五天怱怱忽過白鷗邉遥憐海内無雙土獨酌人間第二泉決去君今身似葉贈行誰有筆如椽老夫但祝重相見未擬消魂賦黯然幽棲幽棲先自嬾衣裳秋暑薫肌汗似漿對客緒言多勉強謀家生事總荒唐蚤眠不待星當户晚飯常占日半牆莫道閒中無外慕朝朝屈指望新凉園林園林隨分有清凉走徧人間夢幾塲鐵硯磨成䨇􅁂雪桑弧射得一繩牀光隂畫紙為碁局事業看題檢藥嚢受用切身如此爾莫於身外更乾忙七月十八日濃霧作雨不成曉霧障朝暉日脚戰未透儻然成一雨亦足洗塵瞀江南富秋暑老穉呻永晝田間翻畏凉能粃嘉榖秀昨朝東有虹光彩照髙栁占云天掠剰政恐耗升斗陽光趣堅實乗除或相捄臞儒雖病暍且復忍汙垢吴人謂立秋後虹為天収雖大稔亦減分數戲贈勤長老從君揮麈演金乗我已無心纒葛藤第一圎通三鼔夢大千世界一窓燈罷參柏子庭前意權作梅花樹下僧飯飽閒行復閒坐人間有味是無能次韻袁起巖送示郡沼雙蓮圗珠淵玉水折方員湧出雙蓮照酒邉壓倒小湖三級草増光後沼兩重蓮苕華名字元相並桃葉根株本自連好把吴歈翻楚些楊荷新曲勝當年洞庭小湖寺舊得瑞象有草繞之投草湖中生三級紅蓮皮日休有木蘭後池重臺蓮詩云兩重元是一重心皆吴中瑞故事而未有雙蓮之傳也次王正之提刑韻謝袁起巖知府送茉莉二檻千里移根自海隅風颿破浪走天吴散花忽到毘耶室似欲横機試病夫燕寢香中暑氣清更煩雲􅁂插瓊英明粧暗麝俱傾國莫與礬仙品弟兄再賦茉莉二絶薫蒸沉水意㣲茫全樹飛來爛熳香休向寒鴉看日景祇今飛燕侍昭陽憶曽把酒泛湘灕茉莉毬邉擘荔枝一笑相逢雙玉樹花香如夢􅁂如絲再賦郡沼雙蓮三絶館娃魂散碧雲沉化作雙葩寄恨深千載不償連理願一枝空有合歡心池光䦨檻倚斜暉把酒看花醉不歸但許鴛鴦相對浴休驚翡翠一雙飛兩岐秀罷已蒿萊春意還從菡萏囬不是使君和氣勝此花應向别人開范村午坐好風入修篁槁葉舞而墮斷續一蛩吟髙下雙蝶過凍樾午隂圎静極成癡坐老便几杖供慵廢誦弦課蒲團輭易煖困來百駭惰四傍無人聲誰驚短夣破石湖詩集巻三十欽定四庫全書石湖詩集巻三十一宋范成大撰讀白傅洛中老病後詩戲書樂天號逹道晚境猶作惡陶寫頼歌酒意象頗沉著謂言老将至不飲何時樂未能忘煖熱要是怕冷落我老乃多戒頗似僧律縳閒心灰不然壮氣鼓難作豈惟背聲塵亦自屏杯酌日課數行書生經一囊藥若使白公見應譏太蕭索當否竟如何我友試商略秋夕不能佳眠晝坐既摧頽夜卧亦展轉檢校百骸間無一得安穩四大元假合解散㑹歸盡何煩造化兒前期苦相窘咄咄方書空忽發一笑囅都縁有我相浪把此身認於中有安否隨即生喜愠蟬聲耳根響蠅翅目中暈無明徧大千祇自植愁本化兒安在哉作詩謝不敏王正之提刑見和茉莉小詩甚工今日茉莉漸過木犀正開復用韻奉呈二絶南花宜夏不禁凉猶繞珍叢覔舊香留得典刑傳菊圃别篘新酒待重陽吴中有末利菊花末利吟餘又木犀碧瑶葉底露金支從今日日須捜句莫遣硯池生網絲復用韻記昨日坐中劇談及趙家琵琶之妙呈王正之提刑二絶病來六結總龜藏不用濃薰戒定香花下酒邉非我事但餘消瘦是東陽曹穆新聲和者稀如今妙手屬天支轉關濩索都傳得想見飛凰舞緑絲正之云轉關六么濩索梁州歴統薄媚醉吟商胡渭州此四曲承平時専入琵琶今不復有能傳者余按北夣𤨏言載黔南節度王保義女善彈琵琶夢吴人授曲内有醉吟商一調其來逺矣再題白傅詩香山晚歳惜芳辰索酒尋花一笑欣列子御風猶有待鄒生吹律強生春若将外物關舒慘直恐中途混主賔此老故應深解此逢塲聊戲眼前人石湖中秋二十韻十二年前嘗與工部兄及賔客為此遊今有隔世者感今懐舊而作野外行吾意城中寄却愁半秋三夜月千古五湖舟湧地金芒發行天玉鏡流珠星沉不現銀漢黯如収髙浪連三境長風近十洲水天雙對鏡身世一浮漚迥白包元氣空明熨病眸只憐心浩蕩不管􅁂颼飀放棹真狂矣關門有此不四并非易事一笑亦難謀急管參漁笛清歌間棹謳逢迎成解后嘯咏勸綢繆女擷蘋花獻妻傾竹葉酬今宵如不飲何處可忘憂憶昔誰同賞于今歳恰周陟岡睽魯衛伐木愴應劉獨歎靈光在能追汗漫遊大都縁未盡豈是病都瘳縱意褰篷席輕生倚柁樓節宣誠小爽猶勝賦悲秋中秋後兩日自上沙回聞千巖觀下巖桂盛開復檥石湖留賞一日賦兩絶金粟枝頭一夜開故應全得小詩催籃輿緩緩隨兒女引入天香洞裏來千巖觀下碧瑶林歳晚青青共此心隱士歸兮花未老每年來把一杯深有㑹而作拙是天資􅈸是真本來何用戒香薫強陽氣盡冥恩怨杜徳機深泯見聞念動即時漂鬼國心空隨處走魔軍室中已自空諸有休負天機與地文戲題無常鐘二絶著衫脫袴兩浮休切莫隨渠認路頭三尺蒲牢關底事尋聲接響大悠悠合成四大散成空草木經春便有冬生滅去來相對代為君題作有常鐘自箴有對易成畛域無情那有從違癡人妄認逆境平地自生鐵圍白傅病猶牽愛晁公老未斷嗔莫問是情是性但參無我無人俗物汨陳大好家奴倒迕何誅泡幻初無典要光隂况已桑榆題畢少董繙經圗綘帳胡沙暗青編古意深誰知洛下詠中有越人吟次韻袁起巖喜雨使君精禱動仙靈月御俄從畢噣經昨夜雲頭隨皂盖今朝雨脚挂青𠖇池光拍岸浮州宅湖面粘天漲洞庭賸采吴歈歌歳事傳歸擊壌調中聽昨議復池光亭額故因及之再次喜雨詩韻以表隨車之應仙驅龍效水靈佛螺吹梵演雲經何煩礎汗生蒸潤便借爐薰作晦𠖇一念故應周法界萬神元不隔明庭昌時圭璧形聲應不似周時莫我聽三次喜雨詩韻少伸嘉頌嚮非賢牧政通靈幾負松陵耒耜經天􅄜侵晨占少女雨師連夜檄元㝠作霖豈必求商野召見誰能右漢庭聞有追鋒傳好語從今側耳為君聴府公録示和提幹喜雨之作輙次元韻雨挾潮㾗漲具區流渠决决繞幽居荷鋤日課都忘倦抱甕天機本不踈且喜水平昌谷稻莫教雷假介休車老翁飽外還多事更把林間種樹書雨後田舍書事再用前韻村村畦圃蓺新區處處田廬葺舊居熟透晚梅紅的皪展開新籜翠扶踈向來矜寡猶遺秉此去汙耶又滿車誰解續經如魯史為将連歳有年書放下菴即事二絶無風香吐長絲書架凝塵不下帷鳥雀聲和晴日暖午窓捫蝨坐多時病後天魔不戰降夢中千頃白鷗江心空境寂聲塵盡却愛秋蠅撲紙窓閉門幽僻斷經過静極兼無雀可羅林下故人知幾箇就中老子得閒多寄題西湖并送淨慈顯老三絶南北髙峰舊徃還芒鞋踏徧兩三間近來却被官身累三過西湖不見山膏肓泉石痼煙霞半世遊山不著家老入蒲團三昧定坐看穿膝長蘆芽中秋月了又黄花卯後新醅午後茶别没工夫譚不二文殊休更問毘耶題藥簏合成四大本非真便有千般病染身地水火風都散後不知染病是何人淨慈顯老為衆行化且示近所冩真戲題五絶就作畫賛孤雲野鶴本無求剛被差充粥飯頭擔負一􅓕牙齒債鐘鳴鼓響幾時休冐雪敲氷乞米廻齋堂如海鉢單開衆中若有知恩者一粒何曽齩破來千里驅馳出為人顔容消瘦老於真食輪轉後無餘事莫學諸方轉法輪何時平地起浮圗化得冬糧但付厨推倒禪牀并拄杖飢來喫飯看西湖殿中泥佛已丹青堂上禪師也畫成笑我形骸枯木様無禪無佛太麤生老態浮生自有老規模寒燠隨宜不用拘未盡九秋先挾纊猶賖十月已開爐一心定後㝠欣厭四大安時適慘舒若使強追年少樂直成赤手縳於菟憶昔鉛刀曽齒莫邪銛遊倦歸歟雪滿髯栁帯受風元不結荷盤承露竟無黏逢塲鼓笛如灰冷送老虀鹽似宻甜留得本來真面目行藏何假問龜占梅林先生夫人徐氏挽詞二首擇對鳴珂里宜家駟馬門肅雍成孝敬燕喜助平反閱世彌三夀還鄉忽九原松風揺草露愁絶後堂萱昔簉鯉庭後嘗瞻林下風一從隨地逺五度閱星終教載恩勤在驚呼夢幻空送車知幾兩獨欠舊孤童胡長文給事挽詞三首結綬參髙妙垂紳侍邃清紫荷青𤨏闥玉帳錦官城行矣超龜列終然鬱驥程寂寥經濟事遺恨入銘旌許國心如日還家鬢未星四并供燕喜萬事付攖寧東牖樽猶湛南園醉不醒淒凉招隠格苔蝕履綦青姻館交情厚官聨事契長鳴珂朝並轡秉燭夜傳觴何意塘蒲晚翻哦露薤章羸軀如可強慟哭踞湖岡次韻王正之提刑大卿病中見寄之韻正之得請歸四明并以餞行名卿緒前輩風格如玉山纍纍培塿中見此髙孱顔攬轡忽思歸無人解縻賢飄颻駕紫車浮雲眎朱丹向來小病惱體力今已安胡為犯風雪江湖行路難呼酒煖征衫寧計斗十干倡酬悔不數長懐悲短縁離合固常事怱忙増惘然浩蕩海山春登臨想臞仙笑我守荒徑老繭深裹纒擬題憶鄞句思咽氷下泉遲公寄新作使我頭風痊戲題趙從善兩畫軸三首王正之云從善家有琵琶妓甚工病翁未得見借此畫以戲之一枝香杏一枝梅各占東風挂玉釵居士石腸都似夢王孫心眼怎安排無笑無言兩斷魂一杯誰為煖霜寒情知别有真真在試與千呼萬唤看搔頭珠重歩㣲揺約臂金寒束未牢要見低鬟揎玉腕更須斜抱紫檀槽枕上六言二首寒更寂歴向曉短夣參差屢驚鷄鳴似唤我醒犬吠知有人行獨眠被出圭角晏起帳承隙光一老綢繆牖户幾人顛倒衣裳喜収知舊書復畏答書二絶故人寥落似晨星珍重書來問死生筆意不如當日健􅁂邉應也雪千莖強裁尺素荅相思兩目眵昏腕力疲牽率老夫令至此門前猶說報書遲簡畢叔滋覔牡丹冷落韶光榖雨寒一年孤負倚䦨干欲知春色偏濃處須向香風逕裡看畢園花逕名香風再賦簡養正南北梅枝噤雪寒玉梨皴雨淚䦨干一年春色摧殘盡更覔姚黄魏紫看石湖詩集巻三十一欽定四庫全書石湖詩集卷三十二宋范成大撰春日覽鏡有感習氣不解老壯心故嵯峨忽與鄉曲齒方驚年許多有眼不自見尚謂朱顔酡今朝鏡中逢憔悴如枯荷形骸既遷變歳華復蹉跎悟此吁已晚既悟當若何烏兔兩惡劇不滿一笑呵但淬割愁劍何須揮日戈兒童競佳節呼喚儛且歌我亦興不淺健起相婆娑故太夫人章氏挽詞二首張子儀縂領之母洵美相門裔有齊邦媛賢藻蘋南澗下萱竹北堂前孝敬三從謹哀榮五福全松銘諸健筆題作晉陵阡積慶今如許生兒得寧馨軻親躬授教韋子世傳經壽斚明卿月安輿拱使星市橋何處在夢斷一溪青舅母太夫人方氏挽詞三首四徳儀邦族三遷奠里門姑寧憂疾痛子自樂平反夏枕方供扇薰堂甫種萱那知秋暑退無復御輕軒門户傳清白階庭侍紫青百年歌燕喜五福用康寧訣籙嘗觀妙旒旌謾勒銘神遊定超絶何必訊泉扃我願延陵道幾如渭水陽適傳杯泛影何意隙沉光擬補蘭陔雅翻吟薤露章支離妨執紼雨泣望楸行壽櫟堂前小山峰凌霄花盛開葱蒨如畵因名之曰凌霄峰天風揺曳寶花垂花下仙人住翠微一夜新枝香焙煖旋薰金縷緑羅衣山容花意各翔空題作凌霄第一峰門外輪蹄塵撲地呼来借與一枝笻代兒童作立春貼門詩三首剪綵宜春勝泥金祝壽幡雪梅同雪􅁂相對兩凌寒緑野添花逕青春引杖藜家人行樂處䨇勸玉東西盛族推山長修齡號櫟翁屏花春不老日日是東風代兒童作端午貼門詩三首畵閤圍香裏明窓宴坐中兵符不須篆丹轉藥爐紅管領神仙侣追陪山長家往来惟意適歌舞對年華黍筒小費名田課昌歜多浮樂聖杯笑倩艾人看户外北窓深處詠歸来重陽不見菊二絶節物今年事事遲小春全未到東籬可憐短髪空欹㡌欠了黃花一兩枝冷蕊蕭踈蝶􅂴飛商量何日是花時重陽過後開無害只恐先生不賦詩古風送南卿廬阜有佳人顔色皦冰玉不能時世粧蕭然古冠服紛紜倚市門組麗眩紅緑妖歌促艶舞飛上黄金屋安知乘鸞侣流落墮空谷風泉入環珮月露作膏馥粱肉豈不珍瀹雪煮黄獨聊用慰朝飢歳寒膚起粟綺叢三尺塵無路到松竹誰能撫孤桐為奏招隐曲偶至東堂岸幘蕭騷雪滿簮一閒真是直千金歸来栗里多情話病後香山少醉吟乆坐蒲團蕉葉放閒拖藜杖蘚花深飢時喫飯慵時睡何暇將心更覓心李中郎挽詞二首聖俞劇郡思賢牧名曹失望郎六叅能幾日兩􅁂未全霜霅水新阡逺桐川舊隐荒絶憐垂白母淚血獨還鄉憶昔單車使惟君勇輔行馬隤招共載羝乳約同盟老去長懐舊悲来遽隔生故人凋落盡衰涕不勝横謝江東漕楊廷秀秘監送江柬集并索近詩二首逺道悠悠日暮雲愁眉今日為君軒殘燈獨照江東集短夢相尋白下門即事想多梅蕊句有誰堪共桂花樽斯文頼有斯人在㑹合何時得細論秃翁衰雪涕垂頤仿佛三生􅂴散師浃髓淪膚都是病傾囷倒廩更無詩笑看筆格網絲徧閒數窓櫺花影移事業光隂今若此故人休説舊襟期霜後紀園中草木十二絶菊老芙蓉退化工少均逸蚤晚梅花動從此無閒日遮藏茉莉檻纒裹芭蕉身我亦入室處忍寒待陽春製芰亦不急緼􅂁堪禦冬從渠抱枝槁摵摵鳴霜風種葵如種麥隔歳已下子僅成一榦花浪備四時氣棠梨芳意多頗惜歳晼晚殷勤小春花特地慰愁眼牡丹初翦時已具新花眼代謝不容髮笑殺鐡門限客從揚州来遺我揚州花筠籠貯枯枿明年擅春華風倒酴醿架長條頭搶地趁渠未萌芽政可相料理清霜染柿葉荒園有佳趣留連伴歳晚莫作流紅去真珠綴玉船梧子炒可供莫嫌能墮髮老夫頭已童桃能驅不祥霜後葉鋪地抱枝崑崙奴猶解禦魑魅門冬如佳𨽻長年䕶階除生兒乃不凢磊落玻璃珠以狨坐覆蒲龕中蠧鉵塵昏度幾年䝉茸依舊輭如綿且来助煖烏皮几莫憶衝寒紫繡韉再到虎丘不過溪橋又兩年偶隨笻竹訪幽禪有縁再踏雲巖路無處重尋石井泉擬輟半山分座住先攜一枕借牀眠覺来飽喫紅蓮飯正是塘東稻熟天虎丘石井在張又新東南水品第三今寺僧不能名其處妄指寺中一土井當之經藏後有大方井舊名觀音井上有石柱為挂轆轤之處疑此是古石井今井已陻塞百年柱亦徙他用累諷住山者多邈然今以語壁老虎丘六絶句㸃頭石當年揮麈講何經賺得堅頑側耳聼我自吟詩無法説石頭莫作定盤星千人坐聼經人散蘚花深千古誰能更賞音只好岸巾披鶴氅風清月白坐彈琴白蓮池碧泓白石偃樛枝愛水嫌風老更低潭影中間龍影卧一山好處沒人題劍池石罅泓渟劍氣潛誰將樓閣苦莊嚴只知煖熱遊人眼不道蒼藤翠木嫌致爽閣碧嶂橫陳似斷鼇畵闌相對兩雄豪東軒只有雲千頃不似西山爽氣髙方丈南窓鼓板鐘魚徹曉喧誰云方外事蕭然窓間日暮寒煙重未到齋時我正眠雪寒圍爐小集席簾紙閣䕶香濃説有談空愛燭紅髙飣羶根澆杏酪旋融雪汁煮松風康年氣象冬三白浮世功名酒一中無事閉門渠易得何人躡屐響牆東白玉樓歩虛詞六首并序趙從善示余玉樓圗其前玉階一道横跨緑霄中琪樹垂珠網夾階兩傍綠霄之外周以玉闌闌外方是碧落階所接亦玉池中間湧起玉樓三重千門萬户無非連璐重璧屋覆金瓦屋山綴紅牙垂璫四簷黃簾皆捲樓中帝座依約可望紅雲自東来雲中虛皇乗玉輅駕兩金龍侍衞可見者靈官法服騎而夾侍二人力士黄麾前導二人儀劍四人金圍子四人夾輅黄幡二人五色㦸帯二人珠幢二人金龍旗四人負納陛而後從二人雲頭下垂將至玉階樓前仙官冠帔出迎方下階䨇舞鶴行前雲駕之傍又有紅雲二其一仙官立幢節間其二女樂並奏玉樓之後又有小玉樓六其制如前寶光祥雲前後蔽虧或隐或現小案之前獨為金地亦有仙官自金地下迎傍小樓最髙處有飛橋直瑶臺仙人度橋登臺以望名數可紀者大略如此若其景趣髙妙碧落浮黎青㝠風露之境則覽者可以神㑹不能述於筆端此畫運思超絶必夢遊帝所者彷彿得之非世間俗史意匠可到明窓净几盡卷展玩恍然便覺身在九霄三景之上竒事不可以不識簡齋有水府法駕導引歌詞乃倚其體作歩虛詞六章以遺從善羽人有不俗者使歌之於清風明月之下雖未得仙亦足以豪矣琳霄境却似化人宫梵氣彌羅融萬象玉樓十二倚清空一片寳光中浮黎路依約太微間雪色寶階千萬丈人間遥作白虹看幢節度髙寒罡風起背負玉虛廷九素煙中寒一色扶闌四面是青㝠環拱萬珠星流鈴響龍馭籋雲来夾道騫華籠綵仗紅雲扶輅輾天街迎駕鶴毰毸鈞天奏流韻滿空明琪樹玲瓏珠網碎仙風吹作歩虚聲相和八鸞鳴樓闌外輦道插非煙閒上鬱蕭臺上看空歌来自始青天揚袂揖飛仙送趙從善少卿將漕淮東玉筍風標右漢廷起家聊直使車星古来將相多頭黒此去功名尚􅁂青披草兩年南北巷折梅明日短長亭門前車轍從今少寂寞柴荆且暫扃范村雪後習氣猶餘燼鍾情未濕灰忍寒貪看雪諱老强尋梅熨貼愁眉展勾般笑口開直疑身健在時有句飛来寒夜觀雪靜極孤鴻響寒疑萬籟喑眼花燈下字髭斷雪中吟頗似償前債非闗惜寸隂可憐蝴蝶夢翩作蠧書蟫瓶花二首水仙攜蠟梅来作散花雨但驚醉夢醒不辨香来處小梅未可折不折惜空回擁鼻撚一枝也道探春来瑞香三首小檻移秀色端来媚禪房道人不解飲醺然醉天香紫雲蹙繡被團欒覆衣篝濃薰百和韵香極却成愁一叢三百朶細細拆濃檀簾幕䕶花氣不知窓外寒石湖詩集巻三十二欽定四庫全書石湖詩集卷三十三宋范成大撰廛居乆不見山或勸作小樓以助登覽又力不能辦今年益衰此興亦闌矣結廬占城市初豈卜云吉謁醫并治庖二事便衰疾乗除徐自笑翻覺此計失經年不見山無異處暗室平生痼煙霞歳晚成俗物安得百尺樓屋上髙突兀列岫擁青来爽氣助佔嗶嘗試與匠謀工費蝟毛出俸餘强弩末家事空囊澀經營十年餘髙興竟蕭瑟人生不如意十事常六七身今况遲暮長算屈短日縱成此段竒髮白何由漆且學商山翁彎跧蟄霜橘愛雪歌平生愛雪如子猷江湖乗興常泛舟長篙斲冰隂火迸玉板破碎凝不流淙琤大響出船底兩舷戛擊鏘鳴球棹夫披蓑舞白鳳灘子挽繂拖素虬四開篷窓愛清供風捲花絮飛来稠飄飄著衣寶唾住片片入酒春酥浮醉中榜入玉煙去耳熱不管寒颼颼大千空濛到何許日暮未肯回船頭夜深凍合隨處泊歌呼逹曉魚龍愁明朝掬雪頮且潄揮毫落紙雲煙遒新詩往往成故事至今句法留滄洲推遷年華絃柱換俛仰歸􅁂塘蒲秋曉衾聞雪亦健起徑欲一棹追昔遊氊衫肨肛束渾脱絮㡌匼匝䝉兜鍪十歩出門九歩坐兒女遮説相苛留謂言此是少年事歳晚牖户當綢繆萬景無窮鼎鼎至百年有限垂垂休夢隨落鴈墮沙觜愁對飢䲭蹲瓦溝重尋勝踐可復許且挹清寒揩病眸須臾未遽妨性命呼童盡捲風簾鉤牆外賣藥者九年無一日不過吟唱之聲甚適雪中呼問之家有十口一日不出即飢寒矣十口啼號責望深寧容安稳坐氊針長鳴大咤欺風雪不是甘心是苦心大雪送炭與芥隐無因同撥地爐灰想見柴荆晚未開不是雪中須送炭聊裝風景要詩来雪後苦寒旋融簷滳凍琅玕風力如刀刮面寒雪陣攪空風却軟天公知我倚闌干新歳書懐門閴知閒好窓晴與睡宜歳華書户筆年例探梅詩看長棊三著量添飯兩匙豁除身外事未是苦衰遲次韻養正元日六言歳踰耳順俄七年去古稀只三從今蓮葉巢稳誰在槐柯戰酣臍下丹田休想口邉白醭罷參渇飲飢餐困睡是名真學瞿聃養正詩云流年五十踰二明日半百過三上魏文帝語下樂天語養正今年五十三此句甚工余今年六十七亦自撰三字韻二句次韻姜堯章雪中見贈玉龍陣長空臯比忽先犯鱗甲塞天飛戰逐三百萬當時訪戴舟却訪一寒范新詩如美人蓬蓽愧三粲次韻徐提舉游石湖三絶三徑荒蕪岫幌開錦車何事肯徘徊春風想為髙人住落絮殘花好在哉日脚烘晴已破煙山頭雲氣尚披綿却須多謝朝来雨洗淨明湖鏡裏天天上麒麟翰墨林當家手筆擅文心欲知萬頃陂中意但向三篇句裏尋閏月四日石湖衆芳爛熳北垞南岡總是家兒童隨逐任驩譁開嘗臘尾蒸来酒㸃數春頭接過花盡把園林䝉錦繡多添門户鎖煙霞杖藜想被東風笑扶却衰翁管物華檢校石湖新田今朝南野試開荒分手耘耡草棘場下地若干全種秫髙原無幾謾栽桑蘆芽碧處重増岸梅子黄時早濬塘田里只知温飽事從今􅂸却半年忙致政孫從政挽詞丈室推居士安車稱老夫回骸桑下餓續命轍中枯重道幾三叟輕財似八厨欲知潜德報青紫付遺孤寄題林景思雪巢六言三首大地九冰徹底小巢四壁俱空只有梅花同調雪中無限春風何處温泉火井誰家熊席狐裘堂燕幾畨炎熱冰蠶一繭綢繆萬境人蹤盡絶百圍天􅄜都沉惟餘泠淡生活時復撚髭凍吟枕上二絶效楊廷秀藤枕頻移觸畫屏無憀滋味厭殘更寒雞且道貪眠著窓紙如何不肯明枕前百念忽紛然舊學新聞緫現前現到天明無可現依前還我日髙眠送文處厚歸蜀類試萬里東来萬里歸正憐寡婦與孤兒死生契闊心如鐡風雨飄揺鬢欲絲早集漢庭陪振露莫留岷嶺戀蹲䲭故家零落今餘幾門户非君更屬誰處厚族弟季髙客死成都制置使京仲逺諉送其家扶䕶還吳慨然逺来忘其勞費重送文處厚因寄蜀父老三首江上連檣叠鼓行不爭微利即爭名算来無似君瀟灑来徃空船載月明下峡東歸十五年因君話舊意茫然煩將逺道悠悠夢直到天西暑雪邊灌口江源不斷流峨眉山月幾番秋江山好處吾能記為問江山記客不虎丘新復古石井泉太守沈虞卿舍人勸農過之為賦三絶謹次韻勸耕堂上醉髙年和氣春風共藹然大士亦修隨喜供夜来古井躍新泉落紙雲煙墮翠巒一泓潭月鬬清寒鳳凰池上揮毫手却掬山泉淬筆端傳聞公作新亭好先報儂家拄杖知便擬挈瓶来煮茗繞闌干角徧尋詩連夕大風凌寒梅已零落殆盡三絶枝南枝北玉初勻夜半顛風捲作塵春夢都無三日好一冬忙殺探梅人玉雪飄零賤似泥惜花還記賞花時賞花不許輕攀折只許家人戴一枝花開長恐賞花遲花落何曽報我知人自多情春不管强顔猶作送春詩唐懿仲諸公見過小飲凌寒殘梅之下二絶春風動是隔年期更對殘花把一巵少待和煙和月看依稀猶似半開時問人何處是花蹊香玉勻鋪不見泥莫怪山翁行歩澀更無空處著枯藜雲露堂前杏花蠟紅枝上粉紅雲日麗煙濃看不真浩蕩風光無畔岸如何鎖得杏園春夢覺作年増血氣減藥密飲食稀氣象不堪説頭顱從可知忽作少年夢嬌癡逐兒嬉覺来一惘然形骸乃爾衰夢中觀河見只似三歳時方悟夢良是却疑覺為非次韻陳融甫支鹽年家見贈二首范村如荒村一老雪垂領髙軒欵門来驚破雀羅靜披草出迎客玉筍森秀整短章雖寂寞染指已嘗鼎歸驂不可駐晨昏思定省乃翁一經傳播穫了家事短檠寓真樂尺璧豈良貴年家有寧馨令我喜無寐加鞭翰墨場一躍羣空冀聞石湖海棠盛開亟攜家過之三絶東風花信十分開細意留連待我来開過十分風不動更無一片㸃蒼苔家人扶上錦城頭蜂蝶團中爛熳遊報答春光須小醉紅雲洞裏按伊州低花妨㡌小攜笻深淺臙脂一萬重不用髙燒銀燭照煖雲烘日正春濃寄題毛君先生蓮華峰菴天台一萬八千丈蓮華峰在諸峰上峰前結屋屋打頭獨有幽人自来往湖海雲遊二十春歸来還作住菴人漫山苦蕒食不盡繞屋長松為四鄰丹訣三千滿雲笈往来且喜無交渉清晨石上一爐香此時天地皆訢合我衰無力供樵蘇尚能相伴煖團蒲但願瘦笻縁未斷㑹把蓮峰分一半石湖詩集巻三十三欽定四庫全書石湖詩集巻三十四宋范成大撰賦附館娃宫賦并序靈巖山寺故吳館娃宫也山上下閒臺别館之迹彷彿可考余少長遊焉感遺事而賦之洶西山之南奔勢鬱嵂其巉空若大敵之在前忽踞虎而跧龍半紫崖而砥平訪館娃之故宫是為逸王之舊遊有墟國之遺恫焉嗟乎汰哉愎賢胥之忠告巽隂嚭之詖説暗養虎之後患縱處女使兔脱迨甞膽之謀成駭疽囊之潰裂蓋自有以賈禍非天為之孽方其銜哀茹痛抆淚飲血儼拂士於前庭尅三年而報越訖甘心而一快夫何初志之英發及其見棲於姑蘇遽雌伏而大壊援宿恩而乞憐或赦圗於臣罪當是之時又何其憊也韙禍福之無門曷今愚而昨賢後千載之嗤㸃莫不鍾咎於嬋娟固尤物之移人抑猶有可得而言蓋嘗觀於若人矣好大而欲速厭嘗而棄舊狃㑹稽之得意謂周鼎其唾手闖齊楚以朶頤睨陳蔡而驤首道甚逺而疾驅氣已餒而猶鬬外未寧而内憂東略之而西否阻闗河以頓兵撤牆屋而致冦亟歸視其四封蔑一夫之能守是猶螳螂之慕蟬不知黄雀之議其後也然以蕞爾之旅衡行四方攻靡堅郛戰無距行事便時利如徑乎無人之鄉惜也未聞大道宜其逸樂而志荒次有䑓池宿有嬪嬙左攜修明右撫夷光粲二八以前列咸絶世而浩倡嗟浣紗之彼姝乃獨繫於興亡蕩龍舟之水嬉擷香徑之春芳載夕陽以俱還秉遊燭於夜長灔金鍾之千石倣酒池於舊商歌吳歈而楚舞薦萬夀於君王悵星河之易翻嘉来日之未央錚銅壺之鳴悲爛急烽之森芒惨梧宫之生愁踐桐夢之不祥歘髙陵與深谷委盛麗於蒼茫所謂玉檻銅溝朱簾椒房理鏡之軒響屧之廊杳煙蕪與露蔓紛日暮之牛羊况捧心之百媚濯粉之餘粧者哉今則雲雨之巔仙聖是宅硯沼蓴浮琴臺松崛封古蘚於井甃宿暗芳於洞穴木鯨吼以清厲金磬隐其蕭瑟彼方外之徒龜藏而蠖屈者又安知往古與来今方枯禪而縛律翩鴻影之拂坐見前山之銜石問天醫賦并序余幼而氣弱常慕同隊兒之强壯生十四年大病瀕死至紹興壬申又十三年矣疾痛疴癢無時不有夏至前一日得寒疾夢謁天醫星問答了然獨未知天醫為何神案晉書卷舌六星其一曰天讒主巫醫而孫氏千金書以日辰推天醫所在其是歟皆未可必也雖然吾疾自是其有間哉乃敘其夢為問天醫賦吳山之臞不達不聞有門常闗日與病親歳直壬申亢中於昏薄寒中之不良睡眠覺邪夢邪陸離紛紜神馬具裝出於頂門驅風鞭霆莫知所從紫城翠樓千窓萬櫳玉書垂芒天醫之宫中有一人瑶冠紫衣如帝如尊衆真繞圍我瞻而思是其天醫者邪竊樂其名幸已我疾次且而前再拜以出仰而稱曰蟣蝨之臣有鬱弗宣幸遭聖靈利用乞憐願賜清德聼臣苦言天生下人如沙如塵長養安樂壽其天真臣獨多疾支離輪囷炎黄之經厥病四百去半取半臣悉經歴五日一曳杖十日一卧簀茁為痤疿潰為瘇癧遊為痺頑尼為否塞䟽為洞盪節為闗格躁為囂呼靜為爽惑榮衞挟寒而留行溪谷流温而横溢襲於皮毛客於絡脉次於焦府盎於形色攣拳惰其四支䵟黣淫乎大宅百骸九竅無一得適十巫遞進三醫更謁探金匱之寶藏紬玉函之袐䇿方書堆於几案藥物庤於牆壁訪和扁以制度招桐雷使炮炙參以天泉左右之運列以君臣佐使之職配合者相須畏惡者相敵參术芝桂鉛汞乳礫果菜之英醪醴之液萬歳之藟千年之珀莫潤於養血之茸莫濇於委蛻之骼厭逺効於中和要近功於武力三建若燎五毒若螫入口如荼下咽如㦸燥剛以發舒酸苦以湧洩杵臼無停鳴鐺鼎不暇滌瞑眩酷烈疾戰縱擊外邪未潰中氣先踣久立則蹐乆行則躄語多則逆卧多則惕先寒而裘未暑而綌席避風而五遷衣惡濕而再襞旦欲興而三休夜將誦而九息聼蟻為牛視朱作碧中憒憒其結轖頭岑岑而戴石人生世間居處飲食臣以病故跬歩榛棘春醅珠紅暑醴玉白翠瓤之瓜青房之菂泫梨液之流膚滃橘泉之破隙臣欲過門而大嚼黄媪推臣以避席清空穴寥霧旦霜夕駕牛西上騎鯨東極納寒月於半嶺御罡風於兩腋臣欲褰裳而往從皓華挟臣以辟易弱栁怪其早衰癭木嗤其多瘠怠侮出於家人煩勞困於僕役羣居之中軋軋厭厭狎者臣嘲䟽者臣嫌獨疚臣身不可任堪人之多疾自取自探不一其凢大略有三其一者心根泄機命門喪阻明消精散形弊神苦擲温玉以畀火奉甘餐而戲虎隂惑陽而化蜮風落山而成蠱若是者得於晦淫命曰伐性之斧其二者愁莫愁於生離痛莫痛於死别哭不淚而神傷歎無聲而怨結魂欲升而中斷腸將思而已絶孤憤為丹心之灰隐憂為青鬢之雪若是者得於情鍾命曰蠧心之孽其三曰深居奥處温燠窈窕重帷複幄風日不到枵然如乆繫之匏薾然如隂處之草玉體軟脆動輒感冐若是者得之於貴遊命曰煬和之竈凢此三者臣非有之呻號弊尫誰職為之孰祟孰厲孰攻孰襲何方而来何門而入抑嘗聞之造化為爐人物為象洪鈞無心大放厥帑元陽之氣可斤可兩人受其中有瘠有䑋故有禀生多艱形枯德腴委隨惰窳命也如何子房所以辟榖長卿所以閒居士安散髮黽勉扶輿希逸惙惙疢與生俱天實為之非人速辜臣也不肖殆類此乎地産之藥方家之書嫓寒配温僻違怪迂欲持人以勝天嗟慮密而功䟽竊聞大神天醫之王範圍堪輿運平隂陽起死回骸斡旋天藏揉太和以為劑酌沆瀣而為漿嘘碧落以發英糜朝霞而薦芳神火氣簁日暾星芒度人千億奮飛仙鄉賜臣刀圭刮摩膏肓濡枯充虚豐羸植僵解臣朽骨濯臣腐腸宅胎仙以葆真凝虚白而發光碎鼎槌罏破瓢褫囊脱兔彭殤之囿蜕蟬人鬼之場不老不衰来歸帝傍臣之願也非所敢望語未竟仰聞太息曰有是哉汝之憂也凢汝所苦可以理測凢汝所求吾不汝嗇病自汝得造化吾知汝窮汝原何藥之為今即汝身示汝三機隐几遐思載撫四維汝身塊然汝方火馳甘寐於牀委骸陳尸夢遊何方悲啼笑嘻溘焉以死烏鳶狐狸生汝安住死汝安歸形與化遷汝豈變移虚空無傍奚所據依厥狀維何為青為黄為一為多為短為長未病何形已病何色癢苛酸辛誰覺誰識吾將逺遊汝速返去試用我言周徧求汝脱焉得之解痼釋痾不然已矣將奈汝何叩稽玉階退而下歸形開神澂汗濡寢衣嗚呼異哉為信為欺是邪非邪至今疑之望海亭賦并序㑹稽太守參政魏公作望海亭於卧龍之巔率其屬為歌詩以落成錄與書来且使賦之予謹掇其膏馥之餘擬賦一首以寄後日獲從杖屨其上於山川之神尚有舊焉其辭曰諸侯之客有来自東而姹㑹稽之遊者曰佳乎麗哉越之為邦也縈山帶湖樓觀相望背卧龍而崛起煥丹碧之翬翔躋攀下臨顧瞻無旁平疇蔚以穉綠喬木森其老蒼淙萬壑之春聲寫千巖之秋光朝霞暝霏扶踈微茫望山河之故墟弔草木之餘社夏后萬國之朝勾踐百戰之野興亡梗概猶有存者至於流觴泛雪髙人之舊事浣紗采蓮游女之遺跡鬱溪山之如畫尚彷彿其可識訪故老以問訊興慨歎於疇昔是為遊覽之大略而蓬莱觀風之所得雖然士固多感而况於對景以懐古撫事而凝情往往使人魂斷意折洒澹而歌不平故麗則麗矣而未擅乎登臨之勝也若夫浩蕩軒豁孤髙伶俜騰駕碧寥指麾滄溟墮憂端於眇莽挹顥氣於空明飄飄焉有連鼇跨鯨之意舉莫如望海之新亭嘗試登兹而望焉沃野既盡遥見東極送萬折之傾注艶寒光之迸射浸地軸以上浮盪天容而一色珠輝具芒矗蝀横霓快宇宙之清寛悵百年之偪仄當其三星曉横萬境俱寂浴日未動晨光先激波鱗鱗而躍金天晃晃而半赤頳輪騰上東方皆白煙消塵作栖鳥振翼俯羣動而紛起寄一笑於遐覿永我暇日苒其將夕餞斜暉於孤嶂候佳月於滄浦沉沉上下杳無處所驚玉虬之破碎漾銀盤而吞吐忽褰雲而擁霧獻霜影於庭宇夜色既合初聞鐘鼔觴屢至而不辭詩欲成而起舞又若潮生海門萬里一息浮光如綫濤頭千尺方鐡馬之横潰倐銀山之崩坼氣平怒霽水面如席吳㠶越檣飛上空碧此亦天下之偉觀然猶未極乎目力燕香舂容俗客莫陪神清意消徙倚徘徊天風激吹波濤闔開五雲明滅丹宫絳臺睇三山之不逺其為公而飛来遂招汗漫之勝遊下飈車之逸軌屬紫霄之妙質侑玉斚之清醴勤歌鸞與舞鳳壽仙栢以多祉恍風雨之皆散但驚塵之四起悟真靈之不隔而何有乎弱水之三萬里也噫昔之居此者多矣曽靡暇於經營逮山靈之効竒發遺址於巖扃殫妙巧於天藏超埃􅅽而上征極觀聼之所接遂杳渺而難名嗟此樂之無央與来者而同登决眥盪胸雪其塵纓且安知前日之蒼煙白露斷蔓而荒荆者哉顧客子之所能道者纔管中之一斑惟覽者之自得㑹絶景於憑闌心凝神釋浩如飛翰而後知兹亭之仙意而臨虚御風之無難主人瞿然而起曰有是哉吾將觀焉惜交賦并序屈原既遭子蘭子椒之譖傷楚國之俗朋友道薄始合之難而終以輕背故著惜交之詞道知心之難遇故舊之不再得動心忍性徘徊不能去君子覽之有以増義合之重焉余既有此淑質兮昔幽處而無仇悵佳人之眇覿兮走六漠而周求歳甲子之初春兮維元日吾始遊紉木蘭以為蓋兮抗杜蘅以為斿詔凍雨俾清道兮戒日星使燭幽恐駟驪之選軟兮又命飛廉而挾輈羾天綋而騖列缺兮頫幽都與𤣥丘天地四方多賊姦兮忽吾班乎齊州恍神釋而目粲兮悦夫人之好修佩轇轕之連璐兮戴陸離之髙冠紛雞鶩之朋飛兮儼黄鵠之蹁蹮葆衆美以自畀兮夫何獨處之嬋娟吾恐始合之易兮終離之者不難號百靈而訊之兮筮告予曰吉哉余令巫咸往招兮介蹇修而為媒枉若人之嘉惠兮命保介而載予摻脩袂而約言兮曰歳晚其與俱入既與之同袍兮出又與之同車投我以蒼玉之連環兮予報以獨繭曳緒玉宛轉而不斷兮繭縈紆而連縷谷風習其自東兮固維風而及雨汝行前而予殿兮予安歌而汝舞至於今其十年兮固知美惡周必復敏予德而日新兮羗未變乎初也修予容其滋媚兮嗟采色其猶未暮也妬被離而害交兮讒翕脇而敗度雖君子之石腸兮固將徇乎市虎兩造膝而笑言兮慘其間之容斧予冶容虞予善泆兮頩顔謂予汝怒髮甚短而怨長兮輿則固而路艱蹇中道而如遺兮予既寡而汝鰥夫豈無他人兮焉有夫君之好賢雖得汝於萬一兮終不及當時之纒綿彼日而食兮此月而虧物不終盡剝兮信復盈之有時涕承睫而交下兮若孟津之流澌敢誦言而怨慕兮恐衆人之汝窺曼予聲以悲吟兮託長風而要之政木石必回睠兮將白首而為期儻曽飛而不顧兮嗟此怨之誰歸荔枝賦并序紹興丙子夏有自行都餉貢餘新茘子者坐客稱歎窮山所未嘗有呼酒更酌鼓琴以侑之且為之賦時為新安掾吾聞南國之南水激而山蟠鍾具美於一物繄化工之所難撋絳綃以袨服襲蒨桃而中單湛氷明之漼漼粲玉粒之團團蓊生香之令芳泫仙液於微瀾走候置其萬里上玉宸與金鑾顧人間之流落纔千倉之一簞餉江南之病客索孤笑於顰端斥蜂蜜之黄膩謝佛桑之紅乾覺龍目之么麽咍蒲萄之甘酸藉以秋雲之巾薦以水晶之􅌉羞以燒春之浮醅相以流水之清彈迨風月之温麗耿星河其未翻予一嚼而三嚥灔玉池之清寒恍醉夢之翾飛掖九天之風翰望涪江與閩嶺麾八極於雷鼾方溟濛其略暗儵浩蕩其天寛岌芳宫與繡户窈玉聲之闌珊欵茘枝之仙人若平生之所歡謂客子其少留紛擘綠而破丹招玉環於東虚御清空之䨇鸞訪長生之舊曲有千載之遺歎悵三山之回風驚南斗之闌干亂梧竹之滿庭渺雲海之漫漫桂林中秋賦并序乾道癸巳中秋湘南樓月色甚佳病起不觴客又祈雨蔬食清坐黙數年來九遇此夕皆不常其處乙酉值三館丙戌與嚴子文游松江有来歳復㑹之約丁亥又以薄遽走陽羨與周子充遇於罨畫溪上戊子守括蒼己丑以經筵内宿庚寅北使次於睢陽辛卯出西掖泊舟吳興門外壬辰始歸石湖而今復踰嶺歎此生之役役次其事而賦之登湘南以獨夜兮挹訾洲之横煙絳霄艶其光景兮湧冰鏡於蒼巔悵旻宇之佳節兮并四者其良難矧吾生之飄泊兮寄蘧廬於八埏九得秋而九徙兮靡一枝之能安上瀛洲而瀑飲兮當作噩之初元旋水宿於垂虹兮滉金碧之浮天剋後期而竟爽兮忽罨畫之滄灣既戊子而守括兮摘少微於樓欄丑寓直於玉堂兮聼宫漏之清圓再西風而北征兮胡笳咽於夜闌迨返斾之期月兮放苕霅之歸船幸故歳之還吳兮帶夕暉而灌園甘土偶之遇雨兮就一丘而考槃今又飄飄而桂海兮賓望舒於南躔訪農圃之昨夢兮杳征路之三千月亦隨予而四方兮不擇地而嬋娟諒素娥之我咍兮老色涴於朱顔原闕觀月之曩見兮炯不動而超然適病餘而閉閣兮屏危柱與哀絃復訟風而閔雨兮謝鼎食之芳鮮閴清齋而晤歎兮驚足跡之間闗誰職為此驅逐兮豈不坐夫微官知明年之何處兮莞一笑而無眠楚辭幽誓天風厲兮山木黄歳晼晚兮又早霜虎號崖兮石飛下山中人兮孰虞予造軔兮挟輈紛不可兮此淹留靈曄兮遄邁趣駕兮逺遊予髙馳兮雨濡蓋予揭淺兮水漸珮横四方兮未極泥盎盎兮予車以敗望夫君兮天東南江復山兮斯路巉恍欲遇兮忽不見奄晝晦兮雲曇曇前馬兮無路税駕兮無所誰與共兮芳馨獨蒼茫兮愁苦愍遊君何為兮逺遊蹇行迷兮路阻脩朝予濟兮滄海靈胥怒兮蛟躒舟暮予略兮太行車墮輻兮驂决攀援怪蔓兮一息雷晝闞兮山裂四無人兮又風雨靈幽幽兮為予愁絶君何為兮逺道委玉躬兮荒草與魑魅兮争光與虎兕兮羣嘷君之居兮社木蒼然衡門之下兮可以休老歸來兮婆娑芳滿堂兮儛歌奉君子兮眉壽光風蕩兮酒生波雲日兮同社月星兮偕夜千秋兮歳華弭予蓋兮紲予馬悲莫悲兮天涯樂莫樂兮還家交難美一人兮巖之扃珮璧月兮間珠星歳既單兮不圭幣路巉絶兮逺莫致稼石田兮長飢誰與此兮蓺之藉予玉兮䨇㲄先予締兮五兩不萬一兮當此託長風兮寄想長風兮無旁吾媒乏兮鳳凰謂蘋若兮蒿艾鳳告予兮不祥恐青女兮行秋奄銷歇兮衆芳搴芳華兮玉蕤將以遺兮所思玉蕤兮霜露所思兮未知歸將輿不濟兮中河日欲暮兮情多子蘭橈兮蕙棹願因子兮凌波眢壑兮以漁周落兮以驅驪龍兮飛度郊之麟兮去汝波河濆兮迷塗黄流怒兮不可以桴目八極兮悵望獨顧懐兮此都御右兮告病鑾鈴兮靡騁河之水兮洋洋不濟此兮有命石湖詩集巻三十四䟦先人嘗為莘等言自十四五始為詩文晚而罙篤或寝疾醫以勞心見止亦以政自不能不爾謝之手編僅成帙而棄不肖之孤其尚忍言哉當從九京遊而未敢者以先人之志未承也詩文凡百有三十巻求序於楊先生誠齋求校於龔編修芥隠而刋於家之夀櫟堂春秋霜露思其志意思其所樂僾然如見愾然如聞庶得藉口以告吾先人云嘉泰三年十二月初三日莘兹謹書
