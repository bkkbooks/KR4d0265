body:
  text: 石湖詩集目錄别集類三宋巻一詩巻二詩巻三詩巻四詩巻五詩巻六詩巻七詩巻八詩巻九詩巻十詩巻十一詩巻十二詩巻十三詩巻十四詩巻十五詩巻十六詩巻十七詩巻十八詩巻十九詩巻二十詩巻二十一詩巻二十二詩巻二十三詩卷二十四詩卷二十五詩卷二十六詩卷二十七詩卷二十八詩巻二十九詩巻三十詩巻三十一詩巻三十二詩巻三十三詩巻三十四賦楚辭跋臣等謹案石湖詩集三十四巻宋范成大撰成大有呉郡志已别著錄案陳振孫書錄解題成大有集一百三十六巻宋史藝文志亦載石湖大全集一百三十六巻與陳氏著錄同又石湖别集二十九巻又石湖居士文集亡其巻數明代刻本僅一百三巻未詳其故此本長洲顧嗣立等所訂乃於全書之中獨摘其詩别行而附以賦一巻前有楊萬里陸㳺二序然萬里所序者乃其全集不專序詩㳺所序者乃其西征小集亦非序全詩以名人之筆嗣立等姑取以弁首耳據萬里序集乃成大所自編考十一巻末有自註云以下十五首三十年前所作續得殘稿附此卷末其餘諸詩亦皆註以下某處作今所傳者猶自編之舊本矣詩不分體亦不分立名目惟編年為次然送洪邁使金詩凡四首其兩首在第八巻列於邁使還入境以詩迓之之前其兩首乃列於第十巻何溥挽詞之後邁未嘗再使金則送别之詩不應前後兩見又南徐道中詩下註曰以下赴金陵漕試作則是當在第二巻之首不應孤贅第一巻之末疑後人亦有所竄亂割併故與宋本巻數不符歟成大在南宋時與尤袤楊萬里陸㳺齊名袤集久佚世所傳者僅尤侗所輯之一巻篇什寥寥未足定其優劣今以楊陸二集相較其才調之健不及萬里而亦無萬里之粗豪氣象之濶不及㳺而亦無㳺之窠臼初年吟詠實沿溯中唐以下觀第三巻夜宴曲下註曰以下二首效李賀樂神曲下註曰以下四首效王建巳明明言之其他如西江有單鵠行河豚嘆則雜長慶之體嘲里人新婚詩春晚三首隆師四圖諸作則全為晚唐五代之音其門徑皆可覆按自官新安掾以後骨力乃以漸而遒盖追溯蘇黄遺法而約以婉峭自為一家伯仲於楊陸之間固亦宜也乾隆四十四年二月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀石湖詩集原序予疇昔之晨與客坐堂上遥見一健步黄衣負一笈至庭下呼而諏其奚自曰自參政公范氏也發其笈公之文集在焉索其書讀之則公之子莘叩頭請曰莘不夭不自霣越而先公一夕奄忽棄其孤莘欲死而不敢者有先公付託之重任在方先公之疾而未病也日夜手編其詩文數年成集凡若干巻逮將易簀執莘手而授之且曰吾集不可以無序編有序篇非序篇寧無序篇也今四海文字之友惟江西楊誠齋與吾好且我知微斯人疇可以屬斯事小子識之若莘則何敢請而先公之治命不敢墜惟先生哀而諾之予執書抱遺編而泣曰萬里與公同年進士也公先進至為朝廷大臣與天子論道發政坐廟堂進退百官而萬里環堵荒寒之士也何敢與公友公不我薄陋而辱友之萬里不敢拒公亦不敢以執政俟公也今忍死丁寧之託其何敢辭初公以文學材氣受知壽皇自致大用至杖漢節使強敵即其庭伏穹廬不肯起袖出私書切責之君臣大驚有自階闥之嬖竊位樞臣者其勢方震赫公沮之竟不奉詔而去其所立又有不凡者矣若夫劌心於山水風月之埸彫龍於言語文章之囿此吾輩羈窮酸寒無聊不平之音也公何必能此哉古語曰爭名者必於朝爭利者必於市是二人者使之以此易彼或以彼易此二人者其肯乎哉非不肯也不願也非不願也亦各樂其樂也詩人文士挾其所樂足以敵王公大人之所樂不啻也猶將愈之故王公大人無以傲夫士而士亦無所折於王公大人今公乃自屏其所可樂而復力爭夫士之所甚樂所謂不虞君之涉吾地者其不多取乎然公之詩文非能工也不能不工耳公風神英邁意氣傾倒㧞新領異之談登峰造極之理蕭然如晉宋間人物他人戛戛吃吃而不能出諸口者公矉呻噫欠之間猝然談笑而道之則其詩文之工豈十日一水五日一石之謂也哉甚矣文之難也長於臺閣之體者或短於山林之味諧於時世之嗜者或漓於古雅之風牋奏與記序異曲五七與千百不同調非文之難兼之者難也至於公訓語具西漢之爾雅賦篇有杜牧之之刻深騷詞得楚人之幽婉序山水則栁子厚傳任俠則太史遷至於詩大篇決流短章歛芒縟而不釀縮而不僒清新嫵麗奄有鮑謝奔逸儁偉窮追太白求其隻字之陳陳一倡之鳴鳴而不可得也今海内詩人不過三四而公皆過之無不及者予於詩豈敢以千里畏人者而於公獨斂袵焉於是文士詩人之難者易偏者兼矣其不盛矣乎嘻人琴今俱亡矣廣陵散今此聲遂絶矣惠子不生莊子不死復何道哉公之别墅曰石湖山水之勝東南絶境也壽皇嘗為書兩大字以揭之故號石湖居士云公諱成大字至能世為姑蘇人其世次言行職官則有少保大觀文大丞相益公周公之銘詩在紹熙五年六月十一日誠齋野客楊萬里謹序石湖居士范公待制敷文閣来帥成都兼制置成都潼川利夔四道成都地大人衆事巳十倍他鎮而四道大抵皆帶蠻夷且北控秦隴所以臨制捍防一失其冝皆足致變故於呼吸顧盻之間以是幕府率窮日夜力理文書應期㑹而故時巨公大人亦或不得少休及公之至也定規模信命令施利惠農選將治兵未數月聲震四境嵗復大登幕府益無事公時從其屬及四方之賓客飲酒賦詩公素以詩名一代故落紙墨未及燥士女萬人己更傳誦被之樂府弦歌或題寫素屏團扇更相贈遺蓋自蜀置帥守以来未有也或曰公之自桂林入蜀也舟車鞍馬之間有詩百餘篇號西征小集尤雋偉蜀人未有見者盍請於公以傳屢請而公不可彌年乃僅得之於是相與刻之而屬㳺為序淳熙三年上巳日朝奉郎成都府路安撫司參議官兼四川制置使司參議官山隂陸游序欽定四庫全書石湖詩集巻一宋范成大撰行路難贈君以丹棘忘憂之草青棠合歡之花馬腦遊仙之夢枕龍綜辟寒之寳紗天河未翻月未落夜長如年引春酌昔人安在空城郭今夕不飲何時樂西江有單鵠行西江有單鵠託身萬里雲猥為稻粱謀墮此鷗鷺羣朝遊楓葉杪暮宿蘆花根懷安浦漵暖忘記雲海寛忽有孤征鴻驚飛落江濵眼明見黄鵠解后傾情眞羽毛雖不同意氣頗相親言鵠有六翮何不髙飛翾水鳥不足羣朝暮徒嘲喧相將乗風去一上盤秋旻渴飲顥露滋飢吸晴霞暾方知翅翎俊可以凌埃塵東風昨解凍春光暖如薫陽鳥當北鄉行止倐已分儻欲相逐去關山隔吳秦兩鳥竟分飛鳴聲動行人豈不有歳晚鴻當復來賔但愁山海闊岐路多糾紛復來失故道那得相知聞鴻歸有儔侣鵠住長悲辛車遥遥篇車遥遥馬憧憧君遊東山東復東安得奮飛逐西風願我如星君如月夜夜流光相皎潔月暫晦星常明留明待月復三五共盈盈放魚行水落塘枯魚臥陸小兒抱取不濡足昂藏赤鯶亦垂頭背負𤣥鱗三十六家人滌砧不辭勞云有素書金錯刀嗟予贖放豈儌福忍把汝命供吾饕如今已脫張胡子好上龍門飲湖水不然崛起載飛仙切莫顚狂稱長史晚歩東郊水墨依林寺青黄負郭田斜陽猶滿地片月早中天䇿䇿鴉飛急冥冥樹影圎西山元自好那更著雲煙元夜憶羣從愁裏仍蒿徑閒中更蓽門青燈聊自照濁酒為誰温隙月知無夢窓梅寄斷魂遥憐好兄弟飄泊兩江村登西樓少年豪氣合摧鋒青鬢朱顔萬事慵疇昔四愁無夢到及時一笑有誰供詩情飲興如雲薄草色花光似酒醲千里春心吟不盡下樓分付晚煙鐘不寐南風釀卑濕􅉸滑病履舄竟日隱几坐拳局不得適丹田恍澒洞銀海眩眵黒髀弱類跨鞍臂強如運甓合體競酸嘶莫夜輒増極奏牀不得眠耿耿到明發黃妳共住乆來夢乃其職睡魔吾故人曩是不速客招呼各偃蹇莫効尺寸力周公無由來咫尺今古隔彭尸不得去罡騎無行色主客兩愁緒虛室浪生白人言老禪師兩脇不到席兹事恐未暇但願了今夕平生北窓眠栩栩即聖域睡僊吾所慕行歩亦鼾息河豚歎鯫生藜莧腸食事一飽足腥腐色所難況乃衷酖毒彭亨強名魚殺氣孕慘黷旣非養生具冝謝砧几酷吳儂眞差事網索不遺育捐生決下箸縮手汙童僕朝來里中子饞吻不待熟濃睡喚不譍已落新鬼録百年三寸咽水陸富肴䔩一物不登爼未負將軍腹為口忘計身饕死何足哭作俑者誰與至今走末俗或云先王意除惡如萟菽逆梟與毒獍歳歳參幣玊芟夷入薦羞蓋欲殱種族生死有定數斷命烏可續適丁是時者未易一理局黿鼎子公怒羊羮華元䘐異味古所珍無事苦畏縮駢頭訌此語戒諭袛取瀆聾肓死不悟明知諒己燭續長恨歌七首金杯瀲灔曉粧寒國色天香勝牡丹白鳯詔書來已暮六宫鉛粉半春闌紫薇金屋閉春陽石竹山花却自芳莫道故情無覓處領巾猶有隔生香聞道蓬壺重見時瘦來全不耐風吹無端却作塵間念己被仙官聖得知别後相思夢亦難東虛雲路海漫漫仙凡頓隔銀屏影不似當時取次看人似飛花去不歸蘭昌宫殿幾斜暉百年只有雲容姊留得當時舊舞衣驪山六十二髙樓突兀華清最上頭玉羽川長湘浦暗三郎無事更神遊帝鄉雲馭若為留八景三清好在不玉笛不隨雙鶴去人間猶得聽梁州雷雨鄰舎起龍雨工避事欲蟠泥帝遣豐隆執以歸連鼓一聲人失箸不知挂壁幾梭飛次韻唐致逺雨後喜凉老陽作氣再三衰鼓竭之餘不支雨搴旗拔幟埽迹空一㸃新凉破殘暑飛蚊薨薨已無竒蜻蜓翅淨摩天嬉竹窓日暮轉蕭瑟喜有促織鳴聲悲秋日二絶碧蘆青栁不冝霜染作滄洲一帶黃莫把江山誇北客冷雲寒水更荒凉新秋病骨頓成衰不度溪橋半月來無事閉門非左計饒渠屐齒上青苔窓前木芙蓉辛苦孤花破小寒花心應似客心酸更憑青女留連得未作愁紅怨緑看嘲里人新婚冷艷頩容一笑開休將鸞扇更徘徊箜篌細寫歸舟字彷彿遊仙夢裏來過松江長虹斗起蛟龍穴朱碧欄干夜明滅太湖三萬六千頃多少清風與明月青鷁驚飛白鷺閒丹楓未老黃蘆折誰將橫笛叫蒼煙無限驚波翻白雪洞庭林屋舊遊處玉柱金庭路巉絶水仙逢迎摻脩袂問我歸計何當決去年匹馬兀春寒今此孤篷窘秋熱人生意氣得失間輕重劒頭吹一吷莫將塵土涴朱顔却待丹砂回白髮過平望寸碧闖髙浪孤墟明夕陽水桞揺病緑霜蒲蘸新黄孤嶼乍舉網蒼烟忽鳴榔波明荇葉顫風熟蘋花香雞犬各村落蓴鱸近江鄉野寺對客起樓隂濯滄浪古來離别地清詩斷人腸亭前舊時水還照兩鴛鴦長安閘斗門貯淨練懸板淙驚雷黃沙古岸轉白屋飛檐開是間袤丈許舳艫蔽川來千車擁孤隧萬馬盤一坏篙尾亂若雨檣竿束如堆摧摧勢排軋洶洶聲喧豗偪仄復偪仄誰肯少徘徊傳呼津吏至弊蓋凌髙埃囁嚅議譏征叫怒不可裁吾觀舟中子一一皆可哀大為聲利驅小者飢寒催古今共來往所得隨飛灰我乃畸於人胡為乎來哉榮木并序卧病十日緑隂滿庭因誦淵明榮木詩其序曰日月推遷已復有夏緫角聞道白首無成犁然有感乃和其韻薰風南來木榮於兹木榮幾時黃落從之逝其須㬰坐成四時今我不學殆其已而天旋地遊日月其根形息氣徂不亡者存去鄉離家莫肯過門猗歟先師不我疵陋褰衣示珠俾我復舊自我來歸十年不富孰蠧孰蠱惟汝自疚冉冉榮木霜華將墜天黒路長屹蹶可畏隷也不力奚取六驥脂車着鞭一息而至兩木并序壬申五月卧病北窓惟庭柯相對手植緑橘枇杷森然出屋枇杷已著子橘獨十年不花各賦一詩枇杷昔所嗜不問甘與酸黃泥裹餘核㪚擲籬落間春風拆勾萌樸􅈪如榛菅一株獨成長蒼然齊屋端去年小試花瓏瓏犯冰寒花成黃金彈同登桃李盤大鈞播羣物斡旋不作難樹老人何堪攬鏡覓朱顔頷髭爾許長大笑欹巾冠緑橘生西山得自髯翁家云此接活根是歳當著花俛仰乃十霜垂蠧紛相遮芳意竟寂莫枯枝謾槎牙風土諒非冝翁言豈予夸㑹令返故山髙深謝汙邪石液滋舊根山英擢新葩黃團挂霜實大如崆峒瓜當有四老人來駐七香車道中月冷吟蛩草湖平宿鷺沙客愁無錦字鄉信有燈花蹤跡隨風葉程途犯斗槎君看枝上鵲薄暮亦還家落鴻落鴻聲裏怨關山淚濕秋衣不肯亁只道一番新雨過誰知雙袖倚樓寒題山水橫看二首煙山漠漠水漫漫老栁知秋渡口寒盡是西溪腸斷處憑君將與故人看霜入丹楓白葦林橫煙平逺暮江深君看鴈落帆飛處知我秋風故國心瑞香花萬粒叢芳破雪殘曲房深院閉春寒紫紫青青雲錦被百叠薫籠晚不翻酒惡休拈花蘂嗅花氣醉人醲勝酒大將香供惱幽禪恰在蘭枯梅落後讀史登壇䇿劉項卧廬料曹孫探懷取事業一一如印圈英豪蓋天資八極入控摶由來事成毁只繫手覆翻玉虹朝貫日劒氣夜燭天雖欲避功名何處蟄龍鸞我生後千載愚暗難具言長大但食粟閔凶不能文麥豆已難辨楣梲固不分抱瓮灌圃畦截竿避城門智略類如此何以超籬籓龜刳始神筴木斷方犧尊朝市有機穽冠裳或鉗髠兹事定不原闕吾其老泥蟠敢云善用短聊復強自寛浙江小磯春日客裏無人共一杯故園桃李為誰開春潮不管天涯恨更捲西興暮雨來代聖集贈别一曲悲歌水倒流尊前何計緩千憂事如夢斷無尋處人似春歸挽不留草色粘天鶗鴂恨雨聲連曉鷓鴣愁迢迢緑浦帆飛逺今夜新晴獨倚樓二月三日登樓有懷金陵宣城諸友百尺西樓十二欄日遲花影對人閒春風已入片時夢寒食從今數日間折栁故情多望斷落梅新曲與愁關詩成欲訪江南便千里煙波萬叠山寒食郊行書事二首野店垂楊歩荒祠苦竹叢鷺窺蘆箔水烏啄紙錢風媪引濃粧女兒扶爛醉翁深村時節好應為去年豐隴麥欣欣緑山桃寂寂紅帆邊漁蕝浪木末酒旗風信歩隨芳草迷途問小童賞心添脚力呼渡過溪東初夏二首清晨出郭更登臺不見餘春只麽回桑葉露枝蠶向老菜花成莢蝶猶來晴絲千尺挽韶光百舌無聲燕子忙永日屋頭槐影暗微風扇裏麥花香夏夜脉脉惜佳夜泠泠成浩歌儻無詩句子將奈月明何露氣濛花重風聲入樹多清歡殊未辦桂影墮江波與時敘現老納凉池上時敘誦新詞甚工㑹心不在逺頃歩便得之長風吹月來清影落半池屋頭見木葉玲瓏剪琉璃紅塵絆兩足大笑兒輩癡老禪挽我遊髙論方軒眉潘郎忽鼎來談詩解人頤晚誦雲髻篇濯濯餘春姿想見篇中人淸潤如君詩笑我兩枯木獨與三冬期林元復輓詩胸次崢嶸滿貯書十年名字徧江湖張公閱世詩千首揚子傳家宅一區謾道春風須得意那知秋雨不成珠自從雪魄氷魂散魯國今誰更服儒戲贈少梁屈膝銅鋪晝掩關薫爐誰伴夕香寒秋來合有相思字㑹待風前片葉看南徐道中以下赴金陵漕試作生憎行路與心違又逐孤帆擘浪飛吳岫湧雲穿望眼楚江浮月冷征衣長歌悲似垂垂淚短夢紛如草草歸若有一廛供閉户肯將篾舫换柴扉石湖詩集巻一欽定四庫全書石湖詩集巻二宋范成大撰望金陵行闕聖代規模跨六朝行宫臺殿壓金鼇三山落日青鸞近雙闕清風紫鳯髙石虎蹲江蟠王氣玉麟湧地鎮神臯太平不用千尋鎖静聽西城打夜濤金陵道中山晚黄羊隨日下天寒白犢弄風歸愁埃百轉西州路笑憶沙湖一棹飛晚行官塘驛篝燈驛吏喚人行寥落星河向五更馬上誰驚千里夢石頭岡下小車聲秦淮不將行李試間關誰信江湖道路難腸斷秦淮三百曲船頭終日見方山重九獨登賞心亭誰教佳節滯天涯強展愁眉管物華每歳有詩題白鴈今年無酒對黄花悠悠造化占斜日草草登臨記落霞宇宙此身元是客不湏彈鋏更思家賞心亭再題天險東南重兵雄百二尊拂雲千雉繞截水萬崖奔赤日吳波動蒼煙楚樹昏向無形勝地何以控乾坤宿義林院暝氣昏如雨禪房冷似氷竹間東嶺月松杪上方燈驚鶻盤金刹流螢拂玉繩明朝窮脚力連夜斬崖蕂荆公墓二首百歳誰人巧拙一丘底處虧成半世青苗法意當年雪竹詩情本意治功徙木何心黨祸揚塵報讎豈教行刼作俑翻成害仁十月朔客建業不得與兄弟上冡之列悲感成詩歳已看成暮身今未得歸風塵孤淚盡霜露寸心違南磵新流水西山舊落暉煙松應好在宿草定成非逝水方東去浮雲浪北飛危魂先自斷不待更沾衣白鷺亭倦遊客舎不勝閒日日清江見倚闌少待西風吹雨過更從二水看淮山臙脂井三首昭光殿下起樓臺􅂸得山河付酒杯春色已從金井去月華空上石頭來午醉醒來一夢非怱怱玉樹逐春歸臙脂却作千年計不似愁魂四散飛腰支旅拒更神遊桃葉山前水自流三十六書都莫恨煩將歌舞過揚州秦淮并序自金陵復泛秦淮宛轉數百曲世傳始皇東巡自江乗渡望氣者以為金陵有天子氣乃鑿長岡引潮水入焉號曰秦淮逶迤屈曲不類人功故又傳為龍所開也祖龍驅羣龍䟽此萬丈溝雨工戀故棲十步九回頭至今秦淮曲蜿若春蛇遊舟師厭回互歎息倚柂樓維昔東巡初八極圍寸眸天端有佳氣鬱鬱東南浮卜云當興王在後五百秋叱咤召六丁慘淡風雲愁鑿渠斷地脉自謂神與謀乾坤有端倪已露不可收大帝開吳天定鼎臨江陬融融秣陵日始照十二斿經營曁六代兹地稱神州乃知歴數定昧者徒私憂兹事故老傳未知信然不姑置勿重陳作詩歎遲留九月三日宿胥口始聞鴈以下歸崑山作故人久不見乍見雜悲喜新鴈如故人一聲驚我起把酒不能觴送目問行李曽雲行路難空濛千萬里塞北多關山江南𣺌雲水風髙吹汝瘦旅伴今餘幾斜行不少駐滅没蒼煙裏羈遊吾亦倦客程殊未已扁舟費年華短纜繫沙尾物生各有役冥心聽行止江郊匝地熟場圃平如砥歸期且勿念共飽豐年米欲雪烏鴉撩亂舞黄雲樓上飛花已唾人説與江梅須早計馮夷無頼欲爭春讀史三首百歳虧成費械機烏鳶螻蟻竟同歸一檠燈火挑明滅兩眼昏花管是非堂堂列傳冠元功紙上浮雲萬事空我若材堪當世用他年應只似諸公鏤氷琢雪戰毛氂畫餅聲名骨朽時汗簡書青已兒戲峴山辛苦更沉碑宴坐菴四首油燈已暗忽微明石鼎將乾尚有聲衲被蒙頭籠兩袖藜牀無地著功名五更風竹閙軒窓聽作江船浪隱牀枕上翻身尋斷夢故人待漏滿鞾霜粥魚吼罷鼓逄逄卧聽飢鼯上曉釭一㸃斜光明紙帳悟知檐雀已穿窓跏趺合眼是無何靜裏惟聞鳥雀多俗客叩門稱問字又煩居士起穿鞾青青磵上松送致逺入官青青磵上松鬱鬱磵底栢松森上曽雲柏跼抱幽石偃植雖不同臭味乃相得千霜與百雪偶立衆芳側衆芳豈不好歳晏埽無迹廣厦罩羣木萬牛挽山澤松材可世用攀援入王國草木豈有情亦復念離析君看此翠栢錯莫無顔色孤隂愁月夜獨籟怨風夕蒼官何當歸相望長相憶除夜感懷松楸百年哀霜露終歳悲天地豈汝偏鬼神諒無私孤窮罪當爾我今怨尤誰噎絶夢自語伶俜影相隨豈無一經傳政坐五鬼嗤鑿枘共齟齬榛荆費耘耔付畀踰丘山奉承劣毫釐生男九族歡所願作門楣時命有大謬生男竟何禆匏瓜謾枵腹蒲柳無眞姿蹙縮髙顴頰蕭騷短髯髭貧病老歳月斗杓坐成移曉風凄以寒簾幕相紛披月星炯我冠霧雨泫我衣焄蒿奉祠事苦淚落酒巵逝者日已逺生者日以衰羸驂駕九折日暮抱長飢岐路正巉絶耿耿誰當知次韻唐子光席上賞梅玉枝横斜照清空纎手撚香原闕公水部無人廣平去後來我輩猶情鍾誰噴昭華送愁絶叫雲三弄怨斜月徑須踏雪問前村莫待馬蹄如踣鐡春風壓盡百花橋尊前仍有董嬌嬈惜無楚客歌成雪空有蕭郎眼似刀夜行上沙見梅記東坡作詩招魂之句玉妃謫人世乃在流水村天風吹嬋娟飄墮寂莫濵芳心怨命薄玉色凄路塵佳人來無期日暮多碧雲溪聲為咽絶月亦低微顰相逢倦遊子一笑不復珍脉脉問不語亭亭意彌眞要我氷雪句招此欲斷魂蘇仙上賔天妙意終難陳璿柄忽傾墮曉嵐愁翠昏次韻唐子光教授河豚世間尤物美惡并江鄉未用誇吳羹清宫洞房寒熱媒深山大澤龍蛇生胡夷信美胎殺氣不奈吳兒苦知味楊花欲動荻芽肥汙手死心揺食指食魚要是原闕黃粱古來不必須河魴君看嗔腹似渾脫寧肯滑甘隨芥薑先生法語峻立壁譏評不使一錢直膨亨從此迹如埽坐令梅老詩無力懸知仙骨有青冥風香久已滌羶腥大笑日華解毒法何如肘後餐霞經題如夢堂壁勃姑午啼喚雨鵯鵊曉囀留春片雲不載歸夢兩髩全供客塵曉起簾額繡波蕩漾燭盤紅淚闌干夢裏五更風急愁邊一半春殘再遊上方僧共老花俱在客將春鴈同回范叔一寒如此劉郎前度曽來即事醉袖籠鞭轉柳塘青門芳樹掩殘香誰驚翡翠雙飛去祗有蓮花對斷腸春晚即事屋頭清樾暗荆扉紫葚斕斑翠莢肥春晚軒窓人獨困日長籬落燕雙飛春晚三首隂隂垂柳閉朱門一曲闌干一斷魂手把青梅春已去滿城風雨怕黄昏客去鉤窓詠小詩遊絲撩亂栁花稀微風盡日吹芳草蝴蝶雙雙貼地飛夕陽槐影上簾鈎一枕清風夢昔遊夢見錢塘春盡處碧桃花謝水西流樂先生闢新堂以待􅆚藥酴醿作詩奉贈􅆚藥有國色酴醿乃天香二妙絶世立百草為不芳先生絶俗姿風味本無雙年來悟結習欲試安心方天魔巧伺便作計廻剛腸多情開此花艷絶温柔鄉道人為一笑正爾未易忘呼童葺荷芷擇勝開軒窓啼鶯不愁思遊蜂亦猖狂百年顰呻頃共此過隙光朝為春條緑暮為秋葉黃把翫尚無幾況以憂愁妨願言秉燭遊迨此春宵長題城山晚對軒壁一枕清風夢緑蘿人間隨處是南柯也知睡足當歸去不奈溪山留客何題城山挂月堂壁百叠煙鬟得眼明坐來心跡喜雙清秋陽滿地西風起猶有啼鶯四五聲姑惡并序姑惡水禽以其聲得名世傳姑虐其婦婦死所化東坡詩云姑惡姑惡姑不惡妾命薄此句可以泣鬼余行苕霅始聞其聲晝夜哀厲不絶客有惡之以為此必子婦之不孝者予為作後姑惡詩姑惡婦所云恐是婦偏辭姑言婦惡定有之婦言姑惡未可知姑不惡婦不死與人作婦亦大難已死人言尚如此大暑舟行含山道中雨驟至霆奔龍挂可駭隤雲曖前驅連鼓訌後殿駸駸失髙丘擾擾暗古縣白龍起幽蟄黒霧佐神變盆傾耳雙聵斗暗目四眩帆重腹逾飽櫓潤鳴更健圎漪暈雨㸃濺滴走波面伶俜愁孤鴛颭閃亂飢燕麥老枕水卧秧穉與風戰牛蹊岌城沉蟻隧洶瓴建水車競施行歳事敢休宴咿啞嘯簧鳴轣轆連鎖轉駢頭立婦子列舎望宗伴東枯駭西潰寸涸驚尺澱嗟余豈能賢與彼亦何辨扁舟風露熟半世江湖徧不知憂稼穡但觧加餐飯遥憐老農苦敢厭遊子倦題畵巻五首鑿落秋江水石明髙楓老栁兩灘横君看叠巘雲容變又有中宵雨意生欹傾棧路繞山明隔隴人家犬吠聲無限白雲堆去路不知誰識許宣平春隂十日溪頭暗夜半西風雨脚收但覺奔霆吼空谷遥知萬壑正爭流暑雲潑墨送驚雷坐見前山驟雨來今夜一凉千萬里更無焦巻與塵埃秋晚黃蘆斷岸江南野水連天日色微明魚網鴈行飛入蒼煙六月七日夜起坐殿廡取凉畏暑中夜起出門月露清晶熒臥銀漢錯落低玉繩網户閉妙香石樓棲古燈風從何處來殿閣微凉生桂旗儼不動藻井森上征榱楣共突兀鬼物相枝撐彭觥鐵拄杖磔磔棲燕驚俗人豈觧事鼻息春雷鳴大星送曉來四窓炯微明顥氣澡肌骨栩栩兩腋輕乗風欲歸去驂鸞羾靑冥却恐方平知浪得狡獪名中秋卧病呈同社人間佳風月浩浩滿大千俗子不解愛我乃知其天以此有盡姿翫彼無窮妍受用能幾何北溟一杯然天公尚齟齬不肯畀其全卧病窘詩料坐貧羞酒錢瓊樓與金闕想像屋角邊如聞眞率社勝遊若登仙四者自難并造物豈我偏秋日雜興六首我友蓬蒿士却埽謝四鄰内無三尺童外無雙蒲輪豈非騏驥姿執轡難其人無衣可御冬忍寒待陽春仰雲發永歎夜作寒螿呻奓户勸之起懷寳善自珍秋月耿清夜秋風捲曽雲佳哉為誰歟定為我與君莫嫌酒味薄聊復相歡欣夕陽下桑柘餘暉挂西山西山在何許冉冉紫翠間綵雲無朝昏緑蘿竟暄寒昔與霞上人同跨雙飛翰上凌紫霄峰下弄白石湍風吹墮𣺌莽及此行路難佳人應望予我豈眞忘還秋髙氣彌清歳晏天雨霜繁枝各病緑況乃枝上香向來不勝春𣺌在無何鄉樂極定自悲誰歟此更張春秋無終窮榮落殊未央嫣嫣芙蓉花秀出清霜晨衆卉已昨夢孤芳若為新寒蜂無儇飛一笑靜自珍誰令嬋娟姿墮此寂寞濵絶世貴獨立後時莫酸辛回風佐小舞薄日生微醺即事亦足樂何必桃李塵蒼筠如蒼玉鄉是磵壑姿朅來西窓下死生付汙泥蟲縁有病葉土瘦無新枝太陽豈我偏檐影為蔽虧昔如松栢獨今作蒲桞衰暮夜風雨急歳晏誰與歸屋東雙梧桐婉娩無眞姿朝為春風條暮為秋霜枝夜久風葉鳴驚鵲一再飛梧桐不足愁㑹有明年期人老眞可歎寧復遊冶時石湖詩集巻二欽定四庫全書石湖詩集巻三宋范成大撰擬古彎環樓前月掩抑樓上人人月不得語相看兩凝顰西窓回紋機織徧錦字春聊可自持翫何由將寄君立春日郊行竹擁溪橋麥蓋坡土牛行處亦笙歌麴塵欲暗垂垂柳醅面初明淺淺波日滿縣前春市合潮平浦口暮帆多春來不飲兼無句奈此金旛綵勝何次韻漢卿舅即事二絶風捲南枝一夜休孤芳寧肯為人留淡粧素服眞成夢落月横參各自愁萬木垂垂欲改柯根萌焦渴奈春何晚來礎汗南風壯㑹有溪雲載雨過晚潮東風吹雨晚潮生叠鼓催船鏡裏行底事今年春漲小去年曽與畵橋平一篙一篙新緑浦東西雪絮漫江鴈不飛宿雨纔晴風又轉片帆那得及時歸碧瓦碧瓦樓頭繡幙遮赤欄橋外緑溪斜無風楊桞漫天絮不雨棠梨滿地花題記事册庚午劃破虛空一劒間六根同轉上頭關如今宴坐菴中事政在凡夫道法間暮春上塘道中客舎無煙野水寒競船人醉鼓闌珊石門柳緑清明市洞口桃紅上己山飛絮著人春共老片雲將夢晚俱還明朝遮日長安道慚愧江湖釣手閒江上天色無情淡江聲不斷流古人愁不盡留與後人愁餘杭道中落花流水淺深紅盡日帆飛繡浪中桑眼迷離應欠雨麥鬚騷殺已禁風牛羊路杳千山合雞犬村深一徑通五柳能消多許地客程何苦鎭怱怱陳侍御園坐上愁眼逢歡春水明詩情得酒春雲生花梢蝴蝶作團去竹裏鵓鳩相對鳴邂逅浮生此日好纒綿俗累何時輕擘牋沫墨乏竒句擫笛當筵慚妙聲獨遊虎跑泉小菴苔徑彎環入茅齋取次成蔓花縁壁起閒草上堦生宿雨松篁色新晴燕雀聲筒泉烹御米聊共老僧傾王希武通判挽詞二首當代名臣後惟公奕世賢及親三釜養遺子一經傳藥石探竒字芸香緝斷編堂堂今不見塵迹自依然事契從先世姻聨亦近親遽為重壤去凄斷十年鄰物理眞飄忽家聲正隱轔門闌可三㦸何止駟車云劇暑赫赫炎官張傘原闕赤帝騎龍安得雷轟九地㑹令雨起千峰次韻時敘新春殘春一夢間夢中兀兀長閉關今朝出門春已去但見新笋齊屋山作詩惜春聊復爾春亦何能與人事閒心如絮久沾泥但愛日長添午睡夜宴曲以下共二首效李賀金麟噴香煙龍蟠玉燈九枝青闌干明瓊翠帶湘簾斑風幃繡浪千飛鸞舞娥紫袖如弓彎雲中一笑天解顔銜杯快巻玻瓈乾花樓促箭春宵寒二十五聲宫㸃闌神絃雙娥一去三千秋粉篁春淚凝古愁神鼉悲鳴老龍怨水為翻瀾雲為留素空逗露晚花泣神官行水鱗僮濕潮聲不平江風急蒼梧冥茫九山立樂神曲以下共四首效王建豚蹄滿盤酒滿盃清風蕭蕭神欲來願神好來復好去男兒拜迎女兒舞老翁翻香笑且言今年田家勝去年去年解衣折租價今年有衣著祭社繰絲行小麥青青大麥黄原頭日出天色凉姑婦相呼有忙事舎後煮繭門前香繰車嘈嘈似風雨繭厚絲長無斷縷今年那暇織絹著明日西門賣絲去田家留客行行人莫笑田家小門户雖低堪洒埽大兒繫驢桑樹邊小兒拂席軟勝氊木臼新舂雪花白急炊香飯來看客好人入門百事冝今年不憂蠶麥遲催租行輸租得鈔官更催踉蹡里正敲門來手持文書雜嗔喜我亦來營醉歸耳牀頭慳囊大如拳撲破正有三百錢不堪與君成一醉聊復償君草鞋費緘口翁張逹夫大卿酒尊名酒尊不應緘口客令僕嘲之君子取中道常在語黙間多言固自費不語良獨難此翁身如鄭文淵辨如懸河思如泉邇來緘口欲挂壁囁嚅畏客翻可憐君不見東家玉壺本弟兄叩之猶解語分明願聞胚渾甚深義定自能令一座傾春思沙際緑蘋滿樓頭芳樹多光風入網户羅幕生繡波前年花開憶湘水今年花開淚如洗園樹傷心三見花依舊銀屏夢千里次韻漢卿舅蠟梅二首垂垂瘦萼泫微霜剪剪纎英鎖暗香金雀釵頭金蛺蝶春風傳得舊宫粧湘袂朝天紫錦裳光風微度綘霄香壽陽信美無仙骨空把心情學澹粧宿東寺二首淡天如水霧如塵殘雪和霜凍瓦鱗織女無言千古恨素娥有意十分春一聲黄鵠夜深歸栖雀驚鳴觸殿扉北斗半垂樓閣外風旛渾欲上雲飛範老前歳相别約歸括蒼便游四明今不知何地暇日有懷春色重來意未闌故人一去肯復還括蒼洞天埽舊隱補陀海岸尋神山杖屨雲煙逺遊樂衣裳風雪行路難鴻飛冥冥鷗浩蕩安得置之雞鶩間癸亥日泊舟吳㑹亭去年春盤浙江驛湛湛清波動浮石今年春盤吳㑹亭冥冥細雨濕髙城天邊作客風沙裏今年去年成老矣客心古井冷無波過眼人情亦如水憶昔三生住翠微偶來平地著征衣山中故人應大笑扁舟坐穩何當歸時敘火後意不釋然作詩解之潘郎曉衾夢蘧蘧舞馬竟與融風俱前驅炎官後熱屬席捲不貸淵明廬淵明有大後詩君家十年四立壁震風凌雨啼妻孥平生白眼蓋九州閉户不納結駟車清貧往往被鬼笑付與一炬相揶揄井堙木刊烏䑕赭汝則暫戲吾何辜天闕悠悠虎豹怒叱閽上訴非良圖作詩聊復相料理甑墮已破空踟蹰浮生適來且適去況此茅屋三間餘埽除刼灰得空闊新月恰上東牆隅幕天席地正可樂為君鼓旗助歌呼題湯致逺運使所藏隆師四圖欠伸春風吹夢驀江飛行盡江南只片時深院無人自驚覺夕陽芳樹乳鴉啼背立粧臺髻鬟懶鏡鸞應見茸茸眼不須回首更嫣然劉郎已自無腸斷倦繡猧兒弄煖縁堦走花氣薫人濃似酒困來如醉復如愁不管低鬟釵燕溜無端心緒向天涯想見檣竿旛脚斜槐隂忽到簾旌上遲却尋常一線花倚竹輕薄人情翻覆手冰容却耐幽居乆關中舊事逐春休付與新人莫廻首目送斜陽忘却歸竹風揺曵翠羅衣君看脉脉無言處中有杜陵飢客詩嗅梅雪意勒花愁未解背隂一朶寒先退東風還是去年香不比人心容易改宿酒瞢騰正耐春花枝人面兩時新相看好作風流伴只恐花枝却妒人晚歩排門簾幕夜香飄燈火人聲小市橋滿縣月明春意好旗亭吹笛近元宵題開元天寳遺事四首御前羯鼓透春空笑覺花奴手未工一曲打開紅杏蘂須知天子是天公謝蠻舞袖貴妃絃秦國如花虢國妍不賞纒頭三百萬阿姨何處費金錢朝天車馬詔頻催斸得新湯未敢開忽報豬龍掀宇宙阿瞞虚讀相書來剥啄延秋屋上烏明朝箭道入東都宫中亦有風流陣不及漁陽突騎粗讀甘露遺事二首神理人情本不同絶憐䑕輩倖元功天公盍假毛氂助成敗都懸反掌中上林輦路草青青誰向憑髙識聖情謾展東封圖畵看不如醲酒亂平生半塘以下二十首城西道中桞暗閶門逗曉開半塘塘下越溪回炊烟擁柂船船過芳草縁堤歩歩來楓橋朱門白壁枕彎流桃李無言滿屋頭牆上浮圖路傍堠送人南北管離愁橫塘南浦春來緑一川石橋朱塔兩依然年年送客橫塘路細雨垂楊繫畵船胥口扁舟拍浪信西東何處孤帆萬里風一雨快晴雲放樹兩山中斷水粘空香山吳王種香處採香徑裏木蘭舟嚼蘂吹芳爛熳遊落日青山都好在桑間蕎麥滿芳洲上沙水邊犬吠隔踈林籬落蕭森日半隂繁杏鎖紅春意淺晚梅飄粉暮寒深天平寺以下天平山舊遊彷彿記三年轟飲題詩夜滿山山上白雲應解笑又將塵土涴朱顔三年前至先兄與余同唐少梁登山絶頂比歸迷路捫蘿而下夜已午主僧散遣羣童秉炬求余三人乆而荚得以為已仙也是夜宿寺中聨句逹曉東坡曰自從有此山自石封蒼苔何常有此樂將去復徘徊至今往來於余心白雲泉泉色正白蓋乳泉龍頭髙啄嗽飛流玉醴甘渾乳氣浮捫腹煮泉烹鬪胯眞成騎鶴上揚州山頂翠屏無路強攀縁我與枯藤各半仙不敢髙聲天闕近人間漠漠但寒煙山徑以下髙景山雲根新徑絡山腰暗緑交隂宿露飄行到竹深啼鳥閙鵓鳩老怨畫眉嬌泉亭收拾風煙鎖翠微亂山窮處結巖扉青天不盡鳥飛盡吳楚川原似衲衣金氏菴菴廢無人居醉墨題窓側暮鴉蔓藤縁壁走青蛇春深有燕捎飛蝶日暮無人埽落花平雲閣以下南峰背倚天峰湧化宫橫空閣道拖雙虹火雲六月應竒絶青瑣玲瓏八面風鐵錫支道林遺物八環流韻寳枝鳴古鐵無花紫翠明莫遣閒人容易振泉飛石落鬼寰驚放鶴亭亦道林故事石門關外古亭基樹老藤枯野徑微放鶴道人今不見故應人與鶴俱飛馬跡石傳云道林騎白馬升天遺跡今石上雙跡儼然類蹄涔者後人為小塔識其處跨馬凌空亦快哉龍腰鶴背謾徘徊遊人欲識仙蹤處但覓蒼崖白塔來金沙沙中麩金燦然人或煉取多不成莊嚴福地守靈仙不為人間計子錢一掬斕斒光照眼路傍饞隷枉流涎龍母廟以下澄照寺孝龍分職隷湘西天許寧親歳一歸風雹春春損桃李山中寒食尚冬衣白蓮堂古木參天護碧池青錢弱葉戰漣漪怱怱遊子怱怱去不見風清月冷時白善坑鑿山成井深數十丈復轉為隧道以取之危險不可逼視銀鬚玉璞紫金精犯難窮探亦有名白堊區區土同價吳儂無事亦輕生石湖詩集巻三欽定四庫全書石湖詩集巻四宋范成大撰賀樂丈先生南郭新居新堂燕雀喜竹籬挂藤蘿崩奔風濤裏得此巢龜荷西山效爽氣南浦供清波㑹心不在逺容膝何須多先生淮海俊踏地嘗兵戈飄飄萬里道芒鞵厭關河風吹落下邑楚語成吳歌豈不有故國荒垣鞠秋莎無庸說當歸到處皆南柯卜遷不我遐一水明青羅閉戸長獨佳奈客剥啄何㑹令蒼苔石屐齒如峰窠歳旱邑人禱第五羅漢得雨樂先生有詩次韻海山之湫龍所宫濺瀑下赴聲琤琮碧矑大士何許主愛此匹練飛冥濛偶然宴坐百千劫神力悲願俱無窮向來火雲挾日走沙煎日爛千山童陸渾風髙煽熱屬涇川草肥間雨工萬口嗸嗸叫此士爐燎未吐誠先通暮塵捲地羊角暗朝霞横天魚尾紅商羊摩霄鳶起舞居然一澍歌年豐人言佛佗入三昧斷取世界如旋蓬指麾釋梵駿奔走況爾風伯并雷公風騷老將亦賛喜筆陣獨埽詩壇空嗟余嘯咏不釋手一曲何啻歌三終次韻時叙賦樂先生新居愚士繁俗如囚奴至人遺形與化俱紛紜覺夢不可辨蘧蘧栩栩知誰歟百年如泡亦如電剛欲鑄鐵充門樞列仙之臞墮山澤一席三椽良有餘平生嶔巘百戰勇頓挫久已歸夷途光芒無用入詩句青天白日轟雷車松煤繭紙妙揮埽芸香錦囊深貯儲紫露雙瓶春夜醉黃雲一稜秋田租誰能摶扶北溟海政爾歸卧南陽廬鴻飛冥冥隔雲雨弋人可慕不可呼病中夜坐呈致逺似霧如煙夜氣浮鶴鳴驚睡起搔頭含風竹影淡留月著雨蛩聲深怨秋萬事心空癡已慣百骸歳晚病相投便當採藥西山去脚力蹣跚怕逺游戲題藥裹捲却絲綸颺却竿莫墮魚鼈弄腥涎須知别有垂鈎處枯海無風浪拍天夜歸竹輿伊軋走長街掠面風清醉夢廻曲巷無聲門戸閉一燈猶照酒壚開田舎呼喚攜鋤至安排築圃忙兒童眠落葉鳥雀噪斜陽煙火村聲逺林菁野氣香樂哉今歳事天末稻雲黃戲題致逺書房照叢菊靨萬黄金欹架薇條半緑隂逋客已隨丹鳯詔但餘花草怨秋深烏戍密印寺烏戍即今之烏鎮靑堆今曰青鎮青堆溪上水平堤烏堆東岸謂之青堆絳瓦參差半掩扉殿用純紅瓦色爛然我與聖公俱客寓聖翁木汀州白衣巖主號定光佛者連南夫知州載神像歸寄於寺之藏前香火蕭然人傳帝子尚靈威寺有昭明太子祠勝縁齟齬三重障東佛閣三造不成今据見材取次成之猶殊勝志士辛勤十載歸鐘樓乃一僧發心束髪為商走川廣得錢二萬緍凡十年復髠而歸樓始成花木禪房都不見但餘蝙蝠晝羣飛僧房皆為狹門深洞極暗行百餘歩不辨人月夜泛舟新塘溪上清風柳萬重緑煙無路月朦朧船頭忽逐回塘轉一水迢迢却向東客舎轂擊肩摩錦繡堆朝聲洶洶暮聲催忽然憶起長橋路天鏡無邊白鳥廻病中夜坐村巷秋舂逺禪房夕磬深飢蚊常繞髩暗䑕忽鳴琴薄薄寒相中稜稜瘦不禁時成洛下詠却似越人吟秋芸有春緑秋芸有春緑踈籬照孤芳清霜早晚至何草能不黃寧當念衰落政爾事容光及時且自好來日殊未量三湘怨牙檣罨晝櫓揺漾三湘浦佳人翔緑裾含顰為誰舞拳拳新荷葉愁絶煙水暮風雲忽飄蕩隱約聞簫鼓夜發崑山歳寒人墐户霜重獨登舟弱櫓揺孤夢踈篷蓋百憂但吟今不樂豈計幾冝休慚愧沙湖月年年照薄遊十一月十二日枕上曉作竹響風成陣窓明雪已花柴扉吟凍犬紙瓦啄飢鴉宿酒欺寒力新詩管歳華日髙猶擁被蓐食媿鄰家南樓望雪夜月流瑶圃春風滿玉都籬踈先剥落樹密正模糊亂㸃横煙鴈驚啼失木烏醉魂方浩蕩風袖不支梧除夜書懷運斗寅杓轉周天日御回夜從冬後短春逐雨中來髩緑看看雪心丹念念灰有懷憐斷鴈無思惜踈梅絮厚眼生纈蔬寒腸轉雷燭花紅瑣碎香霧碧徘徊昨夢書三篋平生酒一杯牀頭新厯日衣上舊塵埃揺落何堪柳紛紜各夢槐隙光能幾許世事劇悠哉岐路東西變羲娥日夜催頭顱原自覺懷抱故應開踴躍金何意靑黃木自灾身謀同斥鷃政爾願蒿萊戲荅澹菴小偈莫問前程事漂然海上舟命乖逢鬼國縁合遇蓬丘畢竟非身計俱成錯路頭故鄉隨脚是流浪不知休偶書出處由人不繫天癡兒富貴更求仙東家就食西家宿世事何縁得兩全題立雪圖堂下心如鐵菴中語似雷有人參此語三箇一坑埋題日記誰言萬事轉頭空未轉頭時亦夢中若向夢中尋夢覺覺來還入大槐宫題張氏新亭水楊成幄翠相遮猶有東風管嵗華葉底青梅無數子梢頭紅杏不多花煩將鍊火炊香飯更引長泉煮闘茶約我詩成須疥壁莫嗔欹側似歸鴉玉臺體捲幔燈千朶鈎簾月半弓繡鴛翔瀝水金雀跂屏風細意翩長袖多情結短封銅壺從婉娩玉珮正丁東枕上明月無聲滿屋梁夢餘分影上人牀素娥脉脉翻愁寂付與風鈴語夜長斑騅斑騅别後月纎纎門外踈桐影畫簾留下可憐將不去西風吹上兩眉尖題傳記二首莫將綵筆寄朝雲紅淚羅巾隔路塵說與東風無限恨倩風吹斷去年春綵舟歸去海山青寂莫瑶臺月自明啼雨落花春已盡夢魂何必更多情病中絶句八首空裏情知不著花逢場將病當生涯蒲團軟暖無時節夜聽蚊雷曉聽鴉溽暑薫天地湧泉彎跧避濕挂行纒出門斟酌無忙事睡過黃梅細雨天石鼎颼颼夜煮湯亂拖芝术闘温涼化兒幻我知何用祗與人間試藥方病中心境兩俱䧏猶憶江湖白鳥雙一夜雨聲鳴紙瓦聽成飛雪打船窓檐頭排溜密如簾溪上層隂定解嚴最是看山竒絶處白雲堆絮擁青尖夜合梢頭蘸紫茸菉葱頂上拆黃封去年團扇題詩處依舊踈簾細雨中盆傾瓴建夜翻渠繞屋蛙聲一倍粗想見西堂渾不睡明朝踏濕看菖蒲謂現老晴色先從喜鵲知斜陽一抹照天西竹雞何物能無賴如許泥深更苦啼病中三偈擾擾隨流無定期波停浪息始應知一塵不偶同歸處四海無親獨歩時苦相打通俱入妙病縁纔識更何疑霜清木落千山露笑殺東風葉滿枝一交銷取萬黃金將病求醫枉用心化盡此身成藥樹不妨栽得病根深莫把無言絶病根病根深處是無言丈夫解却維摩縛八字轟開不二門雲間湖光亭微風不動斂濤湍組練晶晶色界寒斜照發揮猶未盡月明殘夜更來看髙景菴泉亭峰頭揮手笑紅塵天入雙眸洗翳昏萬里西風熟秔稻白雲堆裏著黃雲晚入盤門人語嘲喧晚次凉萬窓燈火轉河塘兩行碧柳籠官渡一簇紅樓壓女牆何處采菱聞度曲誰家拜月認飄香輕裘駿馬慵穿市困倚蒲團入睡鄉九月三十日夜出關候致逺不至風勁便輕棹霜嚴怯弊裘青山蟠巨浸紅樹立滄洲月黒鴈猶去燈寒人更愁煙松漫小峴何處問鳴騶次韻致逺自毘陵見寄二首黃鵠髙飛碧落寒向來山水夢驚殘故情若問元眞子依舊江頭把釣竿新詞一闋話羈愁清似寒泉咽隴頭官下有誰同此闕仲宣應是獨登樓元日山寺聽熟朝魚又暮鐘全將慵懶度三冬貪眠豹褥窓間日怕擁駞裘陌上風登版自憐行蹭蹬讀碑仍怪視蒙籠少年豪壯今如此略與殘僧氣味同題記事冊北山山下小菴居佛劫仙塵只故吾八萬四千空色界不離一法認毘盧寄贈致逺并呈現老草草家風節物新從來憂病不憂貧琴書稍覺浮生誤香火惟知此事眞室裏談空思二士花間對影漫三人祗愁盧李分攜後别有箜篌一曲春春後微雪一宿而晴綵勝金旛換物華垂垂天意晚平沙東君未破含春蘂青女先飛剪水花夜逐回風鳴瓦壠曉成踈雨滴檐牙朝暾不與同雲便烘作晴空萬縷霞雪霽獨登南樓雪晴風勁晚來氷樓上竒寒病骨驚雀啄空檐銀笋墮鴉翻髙樹玉塵傾青帘閃閃千家静黃帽亭亭一水橫坐久天容却温麗一彎新月對長庚次時敘韻送至先兄赴調梅柳欲動風作難行人意在飛鴻間一官逺遊門戸弱百歳上䇿身心間胸次饒渠有廊廟夢魂叵使無江山栽桃種杏須付我已辦鐵鎖遲公攀上沙遇雨快凉刮地風來健葛衣一凉便覺暑光低雲頭龍挂如垂筯雨在中峰白塔西自天平嶺過髙景菴卓筆峰前樹作團天平嶺上石成關緑隂匝地無人過落日秋蟬滿四山髙景山夜歸伊軋籃輿草露間夜凉月暗走孱顔忽逢陂水明如鏡照見沉沉倒景山白雲嶺路入千峰一線通陸離長劒立天風五年領客題詩處正在孤雲亂石中偃月泉松風竹露午猶寒知有龍蟠一掬慳我欲今年來結夏莫扃岫幌掩雲關代人七月十四日生朝秋入壺中玉宇鮮芝蘭桃李共熈然已饒瑞莢明朝滿先借清蟾一夜圎北闕紫泥應道路東山紅䄂莫雲煙如今且醉江湖酒來歳城南尺五天題金牛洞洞在宣城之成山前此蕪廢無開自魏公尚書發之常有笙簾仙音之瑞故鄉江吳多好山筍輿篾舫相窮年春風吹入江南陌叠障雙峰如舊識聞道金牛更孱顔古來鐵鎖髙難攀自從仙伯弭芝蓋鳯舞鸞歌開洞天新詩賸說山中妙我不曽游先夢到從渠弱水隔蓬萊雲山何處無瑶草曉自銀林至東灞登舟寄宣城親戚曉山障望眼脉脉紫翠横澄江已不見況乃江上城結束治野裝木末浮三星羸馬隴頭嘶小車谷中鳴亭亭東灞樹練練緑浦明篙師笑迎我新漲没蘋汀徑投一葉去雲水相與平聊將塵土面照此玻瓈清懷我二三友髙堂晨欲興風細桐葉墮露濃荷蓋傾凝香繞燕几安知路傍情讀唐太宗紀平内難宫府相圖勢不收國家何有各身謀縱無管蔡當時例業已彎弓肯罷休弟兄相賊斁天倫自古無如舜苦辛掩井捐階危萬死不聞親殺鼻亭神佐命諸公趣夜􅋔爭言社稷要靈長就令昆季尸神器未必唐家便破亡建成回馬欲馳歸元吉行趨武徳闈若使兩人俱得去却於何處極兵威嫡長承祧有大倫老公愛子本平均只知世上尋常理爭信英雄解滅親重讀唐太宗紀立晉王父子情深苦亦深蓋天神武一沾襟想當拔刃投牀際也憶海池舟裏心承乾謀父保天年青雀圖兄亦兩全隱刺諸兒却孥戮一私知隔幾山淵更張聊欲亢吾宗仁孝承家合至公天發殺機那可料正投阿武禍胎中石湖詩集巻四欽定四庫全書石湖詩集巻五宋范成大撰復自姑蘇過宛陵至鄧歩出陸漿家饋食槿為藩酒市停驂竹廡門紅樹亭亭棲晚照黃茅杳杳被髙原飲溪有跡於莬過掠草如飛朴渥翻車軌如溝平地少飽帆天鏡憶江村題南塘客舎閒裏方知得此生癡人身外更經營君看坐賈行商輩誰復從容唱渭城南塘冬夜倡和燃萁烘煖夜窓幽時有新詩趣倡酬為問灞橋風雪裏何如田舎火爐頭寒釭欲暗吟方苦凍筆難驅字更遒絶笑兒癡生活淡略無歳晚稻粱謀游金牛洞題石壁上仙翁舊游處琅璈韻靈曲至今有餘音𤣥鶴舞幽谷衆眞期我住歳晚芝田熟腰鑱從翁來籋雲跨飛鹿淨行寺傍皆圩田每為潦漲所決民歳歳興築患糧絶功輙不成崩濤裂岸四三年落日寒煙正渺然空腹荷鋤那辦此人功未至不關天衮山道中虎嘯狐鳴苦竹叢魂驚終日走蒙茸松林斷處前山缺又見南湖數十峰花山村舎潦退灘灘露沙虚岸岸頽澗聲穿竹去雲影過山來柳菌粘枝住桑花共葉開菴廬少來往門巷濕蒼苔清明日狸渡道中灑灑沾巾雨披披側㡌風花燃山色裏柳卧水聲中石馬立當道紙鳶鳴半空墦間人散後烏鳥正西東寒食客中有懷江郭花開也寂寥不須緑暗與紅凋疾風甚雨過寒食白日青春吟大招芳景尚隨流水去故人應作綵雲飄煙波千里家何在惟有溪聲似晚潮南塘寒食書事埂外新陂緑岡頭宿燒紅裹魚蒸菜把饋鴨鎖筠籠酒侣晨相命歌場夜不空土風并節物不與故鄉同周徳萬攜孥赴龍舒法曹道過水陽相見留别女弟草草相逢小駐船一杯和淚飲江天妹孤忍使行千里兄老那堪别數年馬轉不容吾悵望櫓鳴肯為汝留連神如相此俱強健緑髮歸來慰眼前髙淳道中路入髙淳麥更深草泥霑潤馬駸駸雨歸隴首雲凝黛日漏山腰石滲金老柳不春花自蔓古祠無壁樹空隂一簞定屬前村店衮衮炊煙起竹林夜至寧菴見壁間端禮昆仲倡和明日將去次其韻杉松廡門森老蒼佛屋深夜幡花香借牀睡倒恍何處夢隨濳魚聽驚榔咿啞禽語曉光淨窸窣草鳴朝雨凉哦詩出門懷二妙春漲繞山湖水黃行唐村平野晴色妍甚煖日烘繁梅穠香撲征鞅雲煙釀春色心目兩駘蕩柳睂翠已埽桑眼青未放兹遊定不俗前路八千嶂嶺上紅梅霧雨臙脂照松竹江南春風一枝足滿城桃李各嫣然寂莫傾城在空谷城中誰解惜娉婷遊子路傍空復情花不能言客無語日暮清愁相對生浙東參政寄示㑹稽蓬萊閣詩軸次韻寄題二首仙翁來佩玉符麟緑髮無霜照碧筠永夜闌干千嶂月清風揮麈七州春塵埃不隔壺中境功業猶關物外身鸞鶴莫驚兵衞峻主人元是白雲人鰲背飛來紺碧浮人間還有小蓬丘不須擊水三千里已壓中天十二樓羽駕舊曽將夢到芝田今合為公秋玉霄有客方東望竟欲乗風馭氣遊外舅輓詞二首植德千章茂硎材百鍊剛事功纔止此物理故難量鴈序雲天逺蘭階雨露芳公無憾身後人自惜堂堂幽介聨昏援門闌閲歳更方欣承燕几何意寫銘旌笑語猶尋夢恩勤已隔生情傷到深處有淚不勝傾天平先隴道中時將赴新安掾霜橋冰澗淨無塵竹塢梅溪未放春百叠海山鄉夢熟三年江路旅愁生松楸永寄孤窮淚泉石終收漫浪身好住鄰翁各安健歸來相訪說情眞元夕泊舟霅川蓮炬光中月自圎人情草草競華年最憐一夜旗亭鼓能共鐘聲到客船桐川郡圃梅極盛皆圍抱髙木浙中無有家住丹楓白葦林橫枝一笑萬黃金玉溪園裏逢千樹還盡春風未足心牧馬山道中土橋茅屋兩三家竹裏鳴泉漱白沙春色惱人無畔岸亂飄風袖拂梅花宿牧馬山勝果寺佛燈已暗還吐旅枕纔安却驚月色看成曉色溪聲聽作松聲游寧國奉聖寺松梢臺殿鬱髙標山轉溪廻一水朝不惜褰裳呼小渡夜來春漲失浮橋自寧國溪行至宣城舟人云凡百八十灘波驚石險夜喧雷曉泊旗亭笑眼開休問行人縁底瘦適從百八十灘來次韻宣州西園二首苔茵無地着紅塵花草含芳一笑新不待東君能剪刻相公筆力挽回春星芒垂耀筆牀寒河漢波流硯滴乾棐儿松跗入三昧一篇詩就一杯殘晚歩西園料峭輕寒結晚隂飛花院落怨春深吹開紅紫還次落一種東風兩様心送端言東君留戀一分春蜂蝶闌珊燕子新桃李無情空緑徑市橋楊柳送行人早發竹下結束晨裝破小寒跨鞍聊得散疲頑行衝薄薄輕輕霧看放重重叠叠山碧穗吹煙當樹直緑紋溪水趂橋彎清禽百囀似迎客正在有情無思間小澗石礙珠旒濺灘平霧縠鋪小童能好事繫馬斸菖蒲次韻子文探梅水西春已深猶未開水西謂歙溪而黃君謨州學記云頻江地卑蓋此水為浙之源正可謂之江也孤山山下小斜橋客魂曽共暗香飄五年不踏西湖路想見黃昏清淺處如今憔悴古江干豈有幽芳伴倚欄臘盡雪殘春不至坐令愁裏眼長寒霜稜未貸千林槁門外風饕人欲倒斟酌芳心正怯寒有情眞被無情惱後催租行老父田荒秋雨裏舊時髙岸今江水傭耕猶自抱長飢的知無力輸租米自從鄉官新上來黃紙放盡白紙催賣衣得錢都納却病骨雖寒聊免縛去年衣盡到家口大女臨岐兩分首今年次女已行媒亦復驅將換升㪷室中更有第三女明年不怕催租苦次韻子文衝雨迓使者道聞子規夢魂翾蜨翅鼻息吼鼉鼓喚起治曉裝馬嘶童僕語汨泥溷鳬鶩慚愧黃鵠舉猥吟陬隅池浪廢桔橰圃啼䳌撩客心鈎引着何許請歌蘇仙詞歸耕一犁雨奉題胡宗偉推官攬秀堂城外屏峰雲百叠城裏看雲笏拄頰山靈自與人爭秀明滅煙霏難應接南鄰范叔骨相寒不如騎曹知愛山晨霞儻可救枵腹丐君分我入朝餐次韻太守出郊曉裝緹騎踏芳辰江為安瀾露浥塵棨㦸前驅留住月笙簫後備帶行春魚龍水面金杯滿鸞鶴山頭綵筆新聞道將軍寬禮數不辭酩酊吐車茵曉出古巖呈宗偉子文曉風生小寒嵐潤裛巾屨宿雲埋樹黒奔溪轉山怒東方動光彩晃晃金鉦吐千峰森隱現一氣澹回互平生癖幽討解后飽新遇那知塵滿甑晨炊午未具不愧忍飢面來尋古巖路稲梁亦易謀烟霞乃難痼持此慰龜腸搜枯尚能句積雨蒸潤體中不佳頗思故居之樂戲書呈子文門外泥深蘸馬鞍墨雲未放四維寛前山忽接後山暗暑雨全如秋雨寒夢裏江湖三歎息醉中天地一憑闌斗升留滯休惆悵枳棘從來著鳯鸞簽廳夜歸用前韻呈子文簿書堆裏解歸鞍我亦蕭然轡勒寬爐篆無風香霧真庭柯有月露光寒閒思喜鵲塡河鼓靜數流螢繞井欄明日又驅官裏去從教白鷺侣紅鸞聖集誇說少年俊遊用韻記其語戲之京塵紅軟撲雕鞍年少王孫酒量寬倚袖竹風憐翠薄捧杯花露怯金寒黃雲城上栖烏曲緑水橋邊闘鴨欄别後相思惟故物壁煤侵損扇中鸞次温伯用林公正劉慶充倡和韻前山後山梅子雨屯雲日夜相吞吐長林絶壑望不到時有樵歸說逢虎奔溪朝來忽怒漲夾岸柳梢餘尺許屋頭未放濃嵐散苦憶清風汎瓊宇客行落此亂山中但欲尋人訴羈旅比鄰觧后得清士睂宇津津佳笑語杯行起舞出新句我氣已衰聊復鼓明年與君杭太湖扁舟踏浪不踏土沉沉玉柱閟仙扃矯矯虹梁浮水府目力無窮天不盡却笑向來誰縛汝次韻温伯夜坐今日忽得舎弟到杭消息喜見於詞長風吹月來影碎竹間牖良宵坐窘束媿我塵外友平生煙霞興硉兀上南斗頗亦契三三未省計九九迷塗入簿領鄉心幾回首嗟予季行役舟拂漲溪柳凌晨雙鵲鳴翫占得無咎何當從汝去履綦尋蕙畝再次韻呈宗偉温伯官居數椽間局促如瓮牖幸鄰詩酒社金薤對玉友眞清廊廟器偉望配山斗宗偉自號眞清居士行當侍紫極槐棘位三九館舎有竒士謂温伯髙文粲參首倡酬猥及我雙松壓孤柳生活從冷淡幸免譽與咎相從結此夏何異歸隴畝次韻温伯納凉日斜猶畏暑吏退合偷閒霞散紅綃薄溪廻碧玉彎伴人惟羽扇娛客欠風鬟且復哦新句相嘲飯顆山雨凉二首呈宗偉誰扶病客起龍鍾恩在盆傾一雨中問訊九關何路到擬牋歡喜謝天公驚雷隱地送凉颸起舞看山不自持說與騷人須早計片雲催雨雨催詩明日復雨凉再用韻二首東山朝日澹冥濛一片雲生萬叠中宿雨未蘇焦巻盡又煩箕井喚雷公濺瓦排檐散萬絲顚狂風篠要扶持恩深到骨吾能報急賦新凉第一詩次韻慶充避暑水西寺佳晨出西郭仰視天宇清樂哉曠士懷浩浩吞四溟新漲忽勇退籬落粘枯萍風幡招客遊曠望隔蘋汀僕夫厲清深竹輿竦亭亭波翻石鑿落尚帶蛟龍腥華堂入松竹徳人占聚星脫帽飛羽觴頽放解天刑時當行火令草腐亦化螢炎官紛陸梁空飛赤雲軿遥知隴上耘暴背愁白丁兹遊豈易得未用難沉冥送勝子昭績溪罷歸天馬西極來目力盡九寰執轡者誰歟墮此空谷間草深石齧足一躍度孱顔長風送逸駕蕩蕩登虎關五雲清都上白日開帝閑鈎陳動光彩球琳鏘轡環亦復念舊羣依然難駑頑紅塵起天末可望不可攀石湖詩集巻五欽定四庫全書石湖詩集巻六宋范成大撰次韻温伯謀歸官路驅驅易折肱官曹隨處是愁城隨風片葉鄉心動過雨千峰病眼明一臠何須嘗世味寸田久已廢吾耕羨君早作歸歟計屈指從今幾合并次韻温伯雨凉感懷窮士病且飢古今同一流身安腹果然此外吾何求判司誠卑官未免塵甑憂窮山更癉暑憊卧不舉頭二物交寇我生世眞如浮晨朝墨雲作疾雷破山丘排檐忽飛溜蛙蟈鳴相酬朱冠領熱屬橫潰輸一籌新凉蘇肺氣踏濕登城樓好邀雲雨仙長袖按梁州吹水添瓶罍淨洗千斛愁何從有此段冰廳冷如秋但覺詩思生爽氣入銀鈎章成竟何用知能救窮不湯子亦旅食回望家還羞倡予敢不和共作商聲謳次韻子文雨後思歸斷雲將雨洗松篁昨夜癡龍起蟄藏人自無情孤樂事天猶有意作新凉尊前不見凌波襪樓下空聞拜月香萬事安能盡如願且來相伴壓糟牀次韻温伯苦蚊白鳥營營夜苦飢不堪薫燎出窓扉小蟲與我同憂患口腹驅來敢倦飛慶充自黃山歸索其道中詩書一絶問之鳴騶如電馬如雷知是婆娑醉尉廻常日錦囊猶有句況從三十六峰來曉出古城山落月墮眇莽殘星澹微茫竹輿亂清溪飛蓋入嵐光松檜霧靄濕桑麻風露香空翠滴塵纓何必濯滄浪山家亦早作迨此朝氣凉林深無人聲木末炊煙蒼離離瓜芋區肅肅棗栗場田園古云樂令我思故鄉墟市稍來集筠籠轉山忙吏事亦挽我歸路盤朝陽李深之西尉同年談吳興風物再用古城韻李侯昔遊吳蓮舟鏡蒼茫風鬟與霧髩共濯玻瓈光采花不盈舫日暮雲水香還登縹緲樓羅襟酒淋浪巻箔納星月踏筵按伊梁安知有恨事但恐蒹葭蒼風吹落窮谷草深麋鹿場髙岡苦炎熱游子悲異鄉尚喜簡書省期㑹無怱忙猶餘作詩苦消瘦如東陽七月五日夜雨快晴豐隆坎坎夜伐鼓靈湫老龍撇波舞褰雲掣電上清空倒捲天潢作飛雨向來炎官作夏旱萬里彤霞烘玉宇豈惟牛馬困蚊蝱壠上行人口生土我從雪浪葉舟來不謂山城熱如許天公知我愁欲病施與一凉蘇逆旅稍聞水繞屋除鳴不覺星從雲罅吐千山濯濯淨鬟髻缺月姢姢炯睂嫵浮生此景萬事足但欠清歌對芳醑天上秋期正多事趣駕星橋跨銀渚人間四者自難并莫妒黃姑迎織女次韻宗偉温伯冉冉流光迫歳餘青林日夜向人踈雨滋巖桂重堆粟新安木犀秋暮再花風折庭蕉又獻書逋客解蘭思婉娩先生彈鋏厭清虛一塵不立渾輸我即境心安是故廬宗偉新議婚温伯病起無聊故有解蘭彈鋏之語再韻荅子文浮生飽外莫求餘羈旅東來計已踈肩聳已髙猶索句眼明無用且繙書百年子莫占元緒萬法吾今付子虚惟有登臨心未厭黃山聞道勝衡廬道見蓼花秋風裊裊露華鮮去歳如今刺釣船歙縣門西見紅蓼此身曽在白鷗前次韻温伯種蘭靈均墮荒寒采采紉蘭手九畹不留客髙丘一廻首崢嶸路孔棘悽愴肘生柳遂令此粲者永與窮愁友不如湯子逺情事只詩酒但知愛國香此外付烏有栽培帶苔蘚披拂䕶塵垢孤芳亦有遇洒濯居座右君看深林下埋没隨藜莠次韻子文幻塵久已破狐涎身世誰能料䑕肝暮夜雨收千嶂出晨朝風巻四維寬我今無事不如夢君豈有心猶覓安但促小槽添壓石龍頭珠滴夜珊珊次韻知郡安撫九日南樓宴集三首雙旌暮捲小舂容畵棟雲生笑語中但覺山光侵酒緑不知日脚染溪紅控臨縹緲疑無地指㸃虚無欲馭風誰遣玉蟾催騎吹歸來人影在朦朧珠履參陪北海觴仍邀擁節舊中郎碧城香霧連天暝黃葉霜風捲地凉佳節轉頭論聚散清波從古閱興亡明年重把茱茰醉公在叢霄貢玉堂斯民鄒魯更豐年雅道凄凉見此賢萬隴登禾新霽色千村鳴柝舊寒煙鏘金絶世詩情妙倚劒凌空𨽻墨鮮太守新題南樓榜珍重北窓山六六使君名與汝俱傳晚集南樓浪隨兒女怨萍蓬笑拍闌干萬事空宇宙勲名無骨相江山得句有神功掉頭莫覰秋髙鶚留眼來賔日暮鴻懶拙已成三昧解此生還證一圎通賞雪騎鯨軒子文夜歸酒渴侍兒薦茗飲蜜漿明日以詫同游戲為書事邀宗偉同作溪山四時佳今夕更竒絶天公妙莊嚴施此一川雪飛花浩如海眩轉塞空闊水西萬珠樹玉塔照銀闕碧溪不受凍長灘瀉清咽漁舟晚猶汎樵擔寒未歇懸知畵不到未省詩能說歸來強搜句冰硯冷於鐵不知嚴夫子迎門生煖熱梅香不可耐梅即侍兒小名但覺酒腸㷎蜜融花氣動茶泛乳膏發寧辭春笋寒為暖花滑瞢騰畵屏暖喚起眼餘纈笑我獨何事作此淡生活想像髙唐賦何如徑排闥從聖集乞黃巖魚鮓截玉凝膏膩白㸃酥粘粟輕紅千里來從何處想看舶浪帆風從宗偉乞冬筍山藥竹塢撥沙犀頂銳藥畦粘土玉肌豐裹茅束緼能分似政及萊蕪甑釜空雪後守之家梅未開呈宗偉瓦溝凍殘雪檐溜粘輕冰破寒一竿日春隨人意生瑞葉再三白南枝尚含情定知司花女未肯嫁娉婷官居苦無賴一笑如河清落木露荒山寒溪繞孤城朝暮何所見雲黃叫飢鷹東風不早計愁眼何當明北鄰小橫斜蘚地可班荆憑君趣花信把酒撼瓊英次韻温伯城上閉戸成癡坐扶藜得意行樓臺浮霽色市井碎春聲雪盡小橋出煙消千嶂生病多無脚力遥羡落鴻輕知郡安撫以立春日揭所書新安郡榜南樓之上曉雪紛集邦人以為善祥遂開宴以落之輙賦長句一篇以附風謡之末碧瓦朱甍上牛斗妙墨新題森鎖鈕使君筆力挽春來一夜飛花暗梅栁南山與樓相對髙向來千載爭雄豪八分三字一彈壓衆峰戢戢如兒曹人間盛事天不隔急催此雪成三白未論千古福邦人先卜明年滿岡麥東風酒面吹凝酥不辭醉倒歸相扶短歌萬一傳樂府湛輩亦與公名俱次韻知郡安撫元夕賞倅㕔紅梅三首春入林梢一再風破寒匀染費天工雖然媚蕩新粧别只與橫斜舊格同午枕乍醒鉛粉退曉奩初罷蠟脂融後來顔色休論似夾路漫山取次紅眞色生香絶世逢煙光池面兩溶溶楚鄰不待施朱好虢國翻嫌傅粉濃晴日曖雲春照耀温風霽月夜舂容酒闌且駐紗籠看慢破團團一壁龍司花一笑為誰開知道朱幡得得來踈影有情當洞户蔫香無語墮空杯風生翰墨留連看月入笙歌次第催來歳如今翻舊唱五雲叢裏望三台新安絶少紅梅惟倅㕔特盛通判朝議召幕僚賞之坐皆有詩亦賦古風一首華燈收盡江梅落别有橫枝照林薄天教閬苑染芳根小住山城慰蕭索騰騰醉後酒紅醺淡淡粧成笑靨新斟酌東君已傾倒為渠都費十分春别乗胸懷有風月催喚清尊洗愁絶花知主客得不凡一夜光風融綘雪樓頭煙暝吹單于花梢挂星光有無歸來境熟落春夢夢入鎖香紅綺䟽胡宗偉罷官改秩舉將不及格往謁金陵丹陽諸使者遂朝行在頗有倦游之歎作詩送之凍雲埋山天冥濛北風無情雪塞空道傍人稀鳥飛絶問君東遊何怱怱君言薄官淡無味免俗未能聊復爾我評兹事一鴻毛因行且看佳山水陵陽樓閣壓髙城煙屏百叠雙流橫宣城叠嶂樓雙溪閣姑孰江亭更竒絶濃黛兩抹長睂青當塗蛾睂亭望東西梁山如雙睂山形成龍復成虎六代遺蹤供弔古謂金陵鐘山石頭大荒莽蒼江水黃兩涘風煙眇吳楚賞心亭雨花臺所見却浮一葦下長川浮玉低昂波聒天長蘆眞州寺浮玉丹陽金山也梁溪南岸小停櫓一酌人間第二泉無錫惠山陸子泉閶門峨峨過吾國姑蘇僕故里閶門北門也姑蘇臨波照金碧太湖三萬六千頃上有垂虹跨南極吳江長橋三髙亭䲭夷子在焉我家越相尚神遊試從煙浪訪扁舟問訊白鷗相記否謂言久客不勝愁軟紅三尺長安道九重城闕乾坤繞西湖山寺浙江樓君昔曽遊今更好故人客館中天開非君誰上黃金臺挽着天衢五雲上却望江湖如夢廻萬境何如一丘壑幾時定觧冠裳縛幔亭山下桂叢深清社向來都寂莫幔亭清社皆宗偉舊隱故事黃伯益官舎賞梅一杯何處洗愁顔黃法曹家玉樹寒翠袖撚香留客看春風都在小闌干次韻朱嚴州從李徽州乞牡丹三首佳人絶世墮空谷破恨解顔春亦來莫對溪山話京洛碧雲西北漲黄埃歙浦煙山蟠萬叠釣臺雲日擁千章兩侯好事洗寒原闕寳檻移春入燕香閬風苑裏司花女肯作山腰水尾來十二玉欄天一笑只今歸路五雲開時傳使君有召命送琴客許揚歸永嘉烏㡌休衝九陌埃瘦藤定約到秋廻龍湫鴈蕩經行處斷取松風萬壑來送李徽州赴湖北漕徂徠千丈松閱世聳絶壁髙標上霄漢峻節貫金石惟有孤生竹亭亭附微植月夜借清景春朝分秀色託根未渠央萬牛挽山澤昂藏轉江湖夷路入王國明堂五雲上一柱屹天極可望不可攀清都與塵隔依然此清士空山淡愁閴悲呤發清籟揺蕩風雨夕送通守林彦強寺丞還朝鴈蕩之山天下無奔岸絶壑不可圖地靈境秀有人物新安府丞今第一紛綸草木變暄寒竹節松心故凛然窮山薄宦我無恨識公大勝荆州韓梅風漲溪緑如酒曉插檣烏上南斗只今廣厦論唐虞斟酌正須醫國手秀睂津津雙頰丹想看鳴佩翔九關諸公倘欲持公議莫遣此賢思故山送温伯歸福唐納婦且約復游霅川攬秀堂前一笑傾都忘身世兩浮萍扶藜處處從君賞落筆時時得我驚荔熟閩山勞夢想蘋香苕水約逢迎祗愁誤入桃源後從此車輪四角生次韻宗偉閱番樂十日閒愁晝掩關起尋一笑共清歡罷休詩社工夫淡洗淨書生氣味酸盡遣餘錢付桑落莫隨短夢到槐安繡鞾畵鼓留花住賸舞春風小契丹題漫齋壁漢隂無械可容機歳晚功名一衲衣槁木閒身隨念懶浮雲幻事轉頭非三彭已罷庚申守五鬼從教乙丑歸富貴神仙兩俱累此心安處是眞依四月十六日拄笏亭偶題轉午聞雞日正長小亭方丈納空光緑隂一雨濃如黛何處風來百種香次韻即席留連銀燭照金荷腸斷華年一擲梭月姊有情難獨夜天孫無賴早斜河晶晶霜瓦寒生粟衮衮風幃細湧波鴰鶡曉啼鳴鵲散許多佳景奈愁何五月聞鶯二首桑隂淨盡麥頭齊江上聞鶯每歳遲不及曉風鵯鵊子迎春啼到送春時一聲初上最髙枝忙殺嘔啞百舌兒老盡西園千樹緑却憐槐眼正迷離知郡檢計齋醮禱雨登時感通輙賦古風以附輿頌六月火雲髙偃蹇使君有意憐焦巻一封紅篆驛金龍雨氣倐隨爐燎滿風師避路雷車鳴石破天驚檐溜傾不知稻本頗甦否但覺溪聲如百霆稅駕朱旛未云乆造化功成屈伸肘我評兹事與天通知公小試調元手清壇深夜賔衆眞前驅霓旌後飈輪定有靈官識仙伯報道紫皇思侍臣石湖詩集巻六欽定四庫全書石湖詩集巻七宋范成大撰送子文雜言隂谷雲低梅雨多黃山滌源溪湧波南風匝地送歸客雙槳下瀨如投梭嚴夫子君舉酒我其為君歌萬山叢叢石鑿鑿官居破屋巢烟蘿杜鵑曉啼猿暮叫客行到此真蹉跎窮愁無復理一飯三歎息城東黌舍有佳人解后使我加餐食同郷更同調目擊心已傳蟄蟲欲作雷奮地萬籟方寂風行山吹竽喚我醒連鼓相追攀飈車電轂不可輦但覺兩腋生飛翰狂歌不必終曲戲奕不必滿局有時不揖上馬去出門大笑驚僮僕窮鄉眼冷見未曽道上囁嚅相指目云此陿隘何以有二士直恐翩翩跨黃鵠廣文組解登王畿諸公貴人爭勸歸常日心期有定論贈行不惜重費詞腰金佩璐衆目好汗簡沉碑千載癡一尊有意重山嶽五鼎無心輕網絲嚴夫子應領略别後頻書相發藥我既為萬頃之狎鷗君勿作九臯之鳴鶴新館露稻粘明璫風茅衮髙浪荒烟暗白道行行亂蛩響日脚午未吐雲頭晚猶漲欣此半日凉籃輿走清曠病客不堪暑兹行天肯相蚊蝱埽無跡秋意滿千嶂稍尋泉石盟略褫簿書障鴒原定相念因風報無恙臨溪寺萬山繞竛竮二水奔澒洞亭亭林中寺金碧燦櫩棟解鞍得蒲團卧受瓦爐供少捐一炊頃暫作百年夢無人自驚覺幽禽正清哢倦客如殘僧無力供世用此行端為山紫翠迭迎送潄井出門去驚塵撲飛鞚盤龍驛聞雞一唱罷占斗三星没天髙月徘徊野曠山突兀暗蛩泣草露怨亂語還咽凉螢不復舉㸃綴稻花末惟餘絡緯豪悲壯殷林樾小蟲亦何情孤客心斷絶魂驚板橋穿足側石子滑行路如許難誰能不華髮髙城謾回首叠嶂屹天闕遥知秋衾夢千里一飄忽竹下松杉晨氣清桑柘暑隂薄稻穗黃欲卧槿花紅未落秋鶯尚嬌姹晚蝶成飄泊犬騃逐車馬雞驚撲籬落道逢行商問平生幾芒屩頳肩走四方為口不計脚劣能濡簞瓢何敢議囊橐我亦縻斗升三年去丘壑二俱亡羊耳未用苦商略寒亭溝塍與澗合隴畝抱山轉向來六月旱此地免焦巻早穗已垂垂晚苖猶剪剪一川豐年意比屋閙雞犬老農霜鬚鬢矍鑠黃犢健自云足踏地常賦何能免刈熟倩人輸不識長官面康年無復事但恐社酒淺我亦有二頃收拾尚可繭懷哉笠澤路歸鏟犂頭蘚清逸江微生本漁樵長日渺江海扣舷濯滄浪尚說天宇隘朅來車馬路悒悒佳思敗黃塵撲睂鬚驅逐似償債羸驂繫偪仄狂犬吠荒怪鄉心入旅夢一葉舞澎湃晨興過墟市喜有魚蝦賣眼明見清江積雨助橫潰褰裳喚扁舟臲卼不勝載不辭野渡險弄水聊一快隱靜山杯渡師道塲五峰抱巖扉千柱奠雲壑荒原蕞爾縣有此寶樓閣維昔經營初衣錫化雙鶴杖頭具隻眼矯矯雲中落尊者一笑許璇題照林薄庭柏有祖意石泉韻天樂清簧轉碧雞飛梭擲蒼鵲號風飢虎怒失木啼猿愕英遊偶然同吏檄乃不惡題名記吾曽醉墨疥丹堊新嶺瘦馬兀瞢騰荒雞號莽蒼絲窠罥朝露籬落萬珠網宿雲拂樹過飛泉擘山響老桑跼潛虯怪蔓掛騰蟒山行何許深空翠滴羈鞅釀愁積雨寒破悶朝日放曈曈赤幟張昱昱金鉦上浮動草花馥清和野禽唱僕夫有好語沙平路如掌惟憂三溪阻橋斷山水漲送通守趙積中朝議請祠歸天台城頭千峰青繞屋城下灘流三百曲誰云偪仄復偪仄尚有髙軒肯來辱紅梅花下兩芳春春風惠和如主人搶攘塵土簿書裏見此繅籍天球温厚禄故人車結轍掉頭獨泛清溪月不從世外得超然世間誰肯如公決生平我亦一沙鷗葦白蘆黃今正秋送公使我歸思動破烟衝雨憶扁舟明年想見東山起我亦煎茶石橋水道逢蓑笠把漁竿即是馬曹狂掾史送詹道子教授奉祠養親新安學宫天下稀先生孝友真吾師斑衣悞作長裾曳二年思歸今得歸牋詞上訴人叵挽璽書賜可羣公歎青山百匝不留人空與諸生遮望眼白雲孤起越南天向來恨身無羽翰下馬入門懷橘拜身今却在白雲邊鶴髮鬖鬖堂上坐兒孫稱觴婦供果世間此樂幾人同看我風前孤淚墮一杯送舟下水西我欲贈言無好詞徑須喚起束廣微為君重補南陔詩道子教授奉祠諸生率余祖席如意院暫移三席欵雲闗木末闌干暮紫間絳帳莫貪江上路青鞵先試水西山伯陽有道來重趼禦寇他年憶解顔怪我抗塵驅俗駕諸公何事許追攀淳安以後十五首㳂檄嚴杭道中篙師叫怒破濤瀧水石如鐘自擊撞欲識人間竒險處但從歙浦過桐江嚴州舟人云自徽至嚴二百灘城府黃塵撲馬鞍一篙重探水雲寒耳邊眼底無公事睡過嚴州二百灘釣臺臺上題詩甚多其最膾炙者曰世祖功臣二十八雲臺爭似釣臺髙山林朝市兩塵埃邂逅人生有徃來各向此心安處住釣臺無意壓雲臺桐廬濕雲垂野淡踈林十日山行九日隂梅子弄黃應要雨不知客路已泥深富陽不到江湖恰五年歙山青繞屋頭邊富春渡口明人眼落日孤舟浪拍天餘杭春晚山花各靜芳從教紅紫送韶光忍冬清馥薔薇釅薫滿千村萬落香於潛俚語云於潛昌化鬼見亦怕邑居官寺兩淒清晚市都無菜可羮何處直能令鬼怕衹今猶自有人行昌化雙溪館絶景也翠染南山擁縣門一洲橫截兩溪分長官日永無公事卧聴灘聲看白雲百丈山夀聖寺僧房甚雅潔去王干嶺尚六十里沐雨梳風有底忙解鞍來宿賛公房傳聞三嶺連天峻未到王干已斷腸昱嶺竹輿揺兀走婆娑石滑泥融側足過昱嶺不髙人已困晚登新嶺奈君何王干嶺山靈設險合崢嶸行客何須向此行羸馬不前人雨汗此身安得諱勞生刈麥麥熟連雨妨刈老農云得便晴即大獲不爾當減分數麥頭熟顆已如珠小阨惟憂積雨餘匄我一晴天易耳十分終惠莫乗除插秧種密移踈緑毯平行間清淺縠紋生誰知細細青青草中有豐年擊壤聲曬繭俗傳葉貴即蠶熟今嵗正爾隔籬處處雪成窩牢閉柴荆斷客過葉貴蠶飢危欲死尚能包裹一絲窠科桑斧斤留得萬枯株獨速槎牙立暝途飽盡春蠶收罷繭更殫餘力付樵蘇龍學尚書新安侯羅公挽詞二首汝楫今代丹臺籍頻年緑野居鐡冠真御史革履舊尚書短世浮雲盡平生半稿餘人言公不朽蘭玉照前除一昨更調瑟如聞欲賜環途殫泣西狩望絶起東山華屋林霏慘新阡草露班春風埋玉淚重為庾公􅏰龍學侍郎清河侯張公輓詞二首白水名多士清河最有聲人危孔北海帝識柳冝城蜀險談間固蠻訌檄到平凌烟何處在風雨上銘旌太息逢萋錦平生付薄冰滄溟淙赤舌白日照青蠅嶽麓身猶健星維馭已升天如遺一老人亦望三登新安侯夫人俞氏輓詞蚤兆于凰卜來嬪駟馬車夫君冝竹帛子舍各詩書露薤丹旌舉風楊組帳虚空餘彤管訓他日照鄉閭次韻甄雲卿晚登浮丘亭賔筵舊壓三千客燕榭新髙十二城潑墨雲頭連樹暗垂絲雨脚過溪生葛巾羽扇吾身健雪椀冰甌子句清從此相從須痛飲故應此事勝公榮古風上知府秘書二首神仙絶世立功行聞清都玉符賜長生籋雲遊紫虚雞犬爾何知偶䑛藥鼎餘身輕亦仙去罡風與之俱俯視舊籬落眇莽如積蘇非無鳳與麟終然侣蟲魚微物豈有命政爾謝泥塗時哉適丁是邂逅真良圖大鵬上扶揺南溟聒天沸斥鷃有羽翼意滿蓬蒿裏不如附驥蠅掣電抺荆薊誰云極么麽俛仰且萬里向來庭户間決起不踰咫飄颻托方便意氣乃如此物生未可料旦暮倘逢世君看功名場得失一交臂拄笏亭晚望林泉隨處有清凉山繞䦨干客自忙溪雨不飛虹尚飲亂蟬髙柳滿斜陽乳灘徽嚴之間灘如竹節乳灘之險居第一清溪可怖亦可喜造化於人真虐戲轟雷捲雪鬢成絲一擲平生來此試險絶無雙是乳灘舟如滚石下髙山畵樓正倚黃昏雨豈識江間行路難浮丘亭知郡秘書新作以望黃山有浮丘容成峰浮丘公容成子之所遊也黟山鬱律神仙宅三十六峰雷雨隔碧城欄檻偃雙旌笑挹浮丘為坐客巖扉無鎖晝長開紫雲明滅多樓臺雲中仙馭參差是肯為使君乗興來西崑巉絶不可至東望蓬萊愁弱水誰知芳草徧天涯玉京只在珠簾底他年麟閣上清空却訪舊遊尋赤松我亦從公負丹鼎來斸砂牀汲湯井朱砂峰温泉皆在黃山黟山即黄山風月堂章倅新作洪守名而記之天風無邊吹海月景入溪山更竒絶太守文章别乗賢平生付與金杯滑門闌我亦似彭宣想聞橫玉叫蒼烟讀碑索句仍投轄誰是揚州控鶴仙寄贈泉石使李元直入覲漢圖昔中天百六啓真主當時鄧髙密徒歩赴光武諸公上雲臺一葉渺湘浦聲名三十年玉氣貫晴宇向來宣室問天語道舊故不圖太平日復見起兵簿雙旌奠侯服三節臨江滸垂欲大用公少駐議圜府人言山澤官底用廟廊具果聞一乗傳已踵追鋒去翔鳳覽輝來風采照鴛鷺平生經濟心十不一二吐兹行公勿遜安國如鼎吕休寧南街豪郡城東圃壓州宅誰云沸鑊地氣象不偪仄林園富瓜筍堂密美杉柏山醪極可人溪女能醉客吳子邑中彦毫端萬人敵傳杯相勞苦不覺東方白吳益恭豪士也祁門石梁平波心金刹駕巖腹溪藤巻霜繒山骨琢紫玉東堂有嘉名窈窕忩紗緑落花埽無迹蕉葉森似束主人甚愛客挽袖語陸續衝雨出門去役役媿童僕靈山口陵髙類登天斗下劇窺井衡從十里近底用許多嶺秋雨釀春泥掀淖力扛鼎僕夫負隅哭邂逅憂性命舊嗤子猷狂夜半槳歸艇方知興盡處頃歩令人癭浮梁大灘石如林小灘石如枿微生拋擲過兩槳砉將割一灘復一灘食頃經七八﨑嶇幸脫免已足凋鬢髮我家五湖船鏡面貼天闊行迷勿浪逺歸歟泛花月番陽湖淒悲鴻鴈來泱漭魚龍蟄雷霆一鼔罷星斗萬里濕波翻漁火碎月落村舂急折葦已紛披衰楊尚僵立長年畏簡書今夕念簔笠江湖有佳思逆旅百憂集回黃坦渥丹楓凋零濃黛柏幽獨畦稻晚已黃陂草秋重緑平逺一橫看浩蕩供醉目落帆金碧溪嘶馬錦繡谷世界真莊嚴造物極不俗向非來逺遊那有此竒矚桑嶺回腸山百盤揮手天一握俯驚危棧穿仰詫飛石落挽輿如挽舟絶叫斷雙筰怪蔓纒枯槎瘠草被幽壑此豈車馬路誰云強刋鑿人言逺遊好呼來試着脚天都峰黃山維帝有下都作鎮此南國孤撐紫玉樓橫絶太霄碧晶熒砂竇紅夭矯泉紳白晴雲無盡藏竟日裊幽石諸峰三十五離立侍傍側㑹稽眇小哉請議職方籍温泉黃山朱砂峰下砂牀毓靈源石液潄和氣鬱攸甑常蒸觱沸鼎百沸人生本無垢安用滌腸胃一瓢灔清肥回首謝羅罻山深人跡罕政以逺為貴君看華清池談者至今諱石湖詩集巻七欽定四庫全書石湖詩集巻八宋范成大撰伏聞知府祕書欲取小杜桐廬詩語以見花名堂成大記東坡送鄭户曹詩云蕩蕩清河壖黃樓我所開遲君為坐客新詩出瓊瑰樓成君已去人事固多乖此段大類今日成大行且受代計梅開堂成歸舟已下南浦欲為坐客不可得懷不能已請先為公賦之使君來煖東堂席又見堂前花信息小白猶封竹外枝微黃已㸃睂間色山城十月如春臺聞有細書天上來說與橫斜應早計不須更待雪花催知府秘書遣帳下持新詩追路贈行輙次韻寄上冷雲去仍來凍雨落還歇平明一篙漲珍重送船發端成南溪泛寧復東堂謁何時公三日請澤看山笏恩勤一未報終古銘肌骨幡幡跡雖逺耿耿心不没門闌如水波永印此孤月寄上鄙句之明日舟次梅口南枝已有春意復次知府祕書贈行髙韻晏温解船去暮夜㰕船歇橫斜隘梅村玉蓓粲將發城中三輔豪指日承明謁髙懷妙康濟未試君前笏周南又小春微温入花骨我瞻浮丘亭山髙璿柄没飛鳥正飄蕩空繞南枝月晞真閣留别方道士賓實東山西山雙袖舞中有清宫蟠萬礎雲橫朱閣碧梧寒風埽石壇蒼檜古道人賓實其姓方來從何許今幾霜誅蒿仆蓬殿突兀玉華紫氣騰真香胸竒腹憤無人識我獨相從似疇昔時時苦語見鍼砭邂逅天涯得三益明朝歸客上歸艎重到晞真計渺茫只有雙魚相問訊歙江之水通吳江程助教逺餞求詩殘山剰水帶離亭送客煩君逺作程直欲明年擊吳榜白沙翠竹是柴荆次伯安推官贈别韻交情彌嵗竟怱怱短棹歸尋一畝宫塞責文書容我懶及時盃酒賴君同披雲峰頂城頭月攬秀堂前扇裏風千里音書慰離索莫言天逺費鱗鴻次景琳録事贈别韻放船鳴櫓便秦吳送别空煩長者車宿霧鎖山常羃羃斷雲將雨忽踈踈髙城五嶺花深處短棹三江木落初賴得溪流通尺素蒲根仍有一雙魚次黃必先主簿同年贈别韻二首當年仗外揖髙標繡䪌蘆鞭寶馬驕瓊苑天香飄合坐碧城山色照同僚思歸意決吾張翰贈别情深子繞朝蠏籪魚梁從此去他年書札墮烟霄山郭官閒得爛遊彌年還徃話綢繆西園剥栗催奴課東院尋梅勸客留皆簿廳故事筆下修鋒千首富談間和氣兩睂浮别來悵望何時見謾上重城謾上樓次胡經仲知丞贈别韻先生有道抗浮雲拄頰看山意最真霜鬢不堪痟首疾翠蛾常作捧心顰官如斯立藍田小家似淵明栗里貧俯仰别來蓂莢換衹今誰與話情親經仲與侍兒皆多病又不樂賛邑賦歸去來詞次諸葛伯山贍軍贈别韻歙維羣山囿漫仕富英傑清標照人寒玉筍森積雪嗟余獨委瑣無用等木屑又如道傍李味苦不堪折歸舟坐成泛去馬亦已刷三年風波險盡付一笑閱惟君同懷抱各坐天機拙我家鴟夷子竹帛照吳越雲仍無肖似頫首媿前哲若家卧龍公事業管蕭埒期君踵祖武勿惜兒女别言狂舉白浮醉倒霜松折次韻樂先生除夜三絶團蒲曲几坐成癡北看南觀恍是非道眼已空詩眼在梅花欲動雪花稀天邊客裏五迎冬爭信還郷似寓公人事都非城郭是獨憐雞犬識新豐牀頭厯日鬢絲絲懶倦慵吟守嵗詩冝入新年須吉利明朝把筆寫門楣次韻唐幼度客中幼度相别數年復㑹於錢塘湖上西湖冰泮緑生鱗料峭東風欲中人花片不禁寒食雨鬢絲猶那湧金春江山契闊詩情在京洛追隨客夢新喚取歌聲不愁思為君吹水引盃頻客中呈幼度手板頭銜意已慵墨池書枕興無窮釀泥深巷五更雨吹酒小樓三面風草色有無春最好客心去住水長東今朝合有家書到昨夜燈花綴玉蟲奠唐少梁晉仲兄弟墓下當年連璧氣如蜺人許躋攀九列齊黃壤一時埋玉樹青雲何處用丹梯生平書札頻雙鯉嵗晚交情但隻雞眼底傷心難制淚寧論宿草已萋萋鎮東行送湯丞相帥紹興吳波鱗鱗越山紫鎮東旌斾東風裏前驅傳道相君來一夜鑑湖春漲起鑑湖如鑑涵空明相君出處如湖清十年勲業泰山重五鼎富貴浮雲輕人言公如裴相國緑野堂髙貯風月我獨願公如子牟身在江湖心魏闕浯溪有石髙嵯峨公方東征如此何丁寧湖水莫斷渡早晚歸來絶江去水月菴謁現老不值有客叩巖扃無人管送迎片雲閒出岫水月自空明次韻邊公辨錯落參旗罥竹梢柴荆臨水閉蓬蒿清風吹曉玉蟾墮穠露洗空銀漢髙雙鵲繞枝應也倦一蛩吟壁已能豪新秋只合添詩興莫學潘郎歎二毛中秋無月復次韻屋山從捲杜陵茅門徑慵芟仲蔚蒿澹澹白虹風暈壯紛紛蒼狗雨雲髙凌空累筯仙無術半夜撞鐘句謾豪枵腹題詩將底用真成兔角與龜毛公辨用前韻見贈復次韻先生筆力玉山鼇氣壓明堂一柱蒿雪椀滌毫詞絶妙朱絃縮瑟調彌髙心兵不起無三粲坐客常多似四豪喜有過從南北巷蘇蘭薪桂瀹溪毛公辨再贈復次韻書生活計極蕭騷爝火微明似束蒿犬子地寒徒壁立元龍身懶謾樓髙筆端未辦誇三絶酒裏猶能埽二豪又向詩壇蘄借一強磨鉛鈍齒吹毛送施元光赴江西幕府鎮南旌斾照江臯入幕如今客最髙月暗秋城稀擊柝雲飛朝棟賸揮毫長亭酒盡歌三叠半夜溪深雨一篙莫戀陽闗更西路九闗歸路踏金鼇次韻林子章阻淺留滯客行端似未歸雲指㸃璿杓幾易辰喜有風花黃作暈似聞溪漲緑生鱗我從走俗言無味君已鳴文筆有神繡段炳然空辱贈急繙緹襲埽蛛塵次韻馬少伊木犀月窟飛來露已凉斷無塵格惹蜂黃纎纎緑裹排金粟何處能容九里香水尾山腰樹影蒼一天風露不供香誰家鏡裏能消得付與詩人古錦囊密密嬌黃侍翠輿避風遮日小扶踈畵䦨想見懸秋晚無限宫香緫不如林夫人挽詞黃中之妹知書翰墨門䦨正巋然故應婉娩亦儒先與聞古學三千禮能誦家書四百篇卜協媯姜占永世夢呼辰已䜟凋年班姬合有遺文在後日從容訪孟堅李仲鎮懶窩求名當着鞭訪道亦重趼二邊俱不住三昧不如懶向來南嶽師自謂極蕭散收涕且無緒客至那可欵爭如懶窩髙門外轍常滿殊不妨嘯歌秉燭苦夜短天寒雪欲花屋角黃雲晚徑須煩二妙對洗玻瓈盞次韻陳季陵寺丞求歙石睂子硯金星熒熒睂子緑婺源琢石如琢玉寶玩何曽捄枵腹但愛文君逺山蹙丈人筆陣森五兵書品入妙仍詩名我有陂陀天海様與公文字俱金聲梟盧一擲不須呼況敢定價論車渠只煩將到粧臺下試比何如京兆畵次韻季陵貢院新晴鎖闈令嚴深復深五星簾幕晴若隂澹雲微月謾清夜短檠政自闗人心看燈作暈生睡色江南行處夢不隔覺來快讀新晴篇怳然寘我鶯花前徑欲觴公後堂酒倘煩春衫小垂手次韻周子充正字館中緋碧兩桃花碧城香霧赤城霞染出劉郎未見花憑仗天風扶絳節為招萼緑過羊家明日子充折贈次韻謝之海上三山冠綵霞六時髙㑹雨天花歩虚聲裏隨風下吹落尋常百姓家明日大雨復折贈再次韻一天雲葉翳朝霞風巻泥沾不惜花羣玉山髙春好在人間烟雨暗千家張恭甫正字折贈館中碧桃因次子充韻次年滿枝晴雪照青霞舊識桃源暈碧花俯仰京塵隔年夢東風猶認故人家雨中報謁呈劉韶美侍郎花落滿城雨雨餘雲重隂驅車有底急巷泥三尺深平生黃篾舫漁榔有清音斗升得苦相懷刺衝愁霖歸來掩闗卧一枕直兼金作詩詫比鄰幸勿譏褊心雨中集水月獻之今年不堪暑天亦相憐病良苦明便中秋法合涼夜半行雲曉行雨蘄州竹簟清如氷飢蚊倔強猶鳴聲下牀蚤喜衣裳健出門更覺山川明曳屐扶藜尋水月不惜垂垂巾角折竹間松下已淒然却要芳樽生煖熱送洪景盧内翰北使二首金章玉色照離亭戰伐和親決此行國有威靈雙節重家傳忠義一身輕平生海内文場伯今日胸中武庫兵萬里徃來公有相淮濆隂德貫神明近日兩淮戰地掩骼公之請也檄到中原殺氣銷穹廬那敢說天驕今年蕃始來和漢即日燕當逺徙遼北土未乾遺老淚西陵應望孝孫朝著鞭徃矣功名㑹麟閣丹青上九霄次韻嚴子文旅中見贈杯中疇昔共江天傾座新詩報警聮海浦寸心空共月京華雙髩各凋年交情敢說同方友句法甘從弟子貟有意數從文字飲何須爭着祖生鞭次韻子文客舍小樓客裏仍攜一束書閉門虹氣自凌虚未聞光範延珠履誰向甘泉從玉車散盡生涯千荅布收將文價百車渠淹留且結西湖夏同到秋風賦遂初次韻劉韶美大風雨壞門屋雲烟揮翰墨池翻緗縹如山晝掩闗已許六丁收散落只愁雷電費牆藩洪景盧内翰使還入境以詩迓之玉帛干戈洶並馳孤臣叱馭觸危機闗山無極申舟去天地有情蘇武歸漢月凌秋隨使節胡塵捲暑避征衣國人渴望公顔色為報褰帷入帝畿寄題向撫州采菊亭一葉起秋色衆緑凋嵗華耿耿霜露側餘此黃金葩西風滿天地孤芳照塵沙殷勤開小築花氣日夕嘉落英楚纍手東籬陶令家兩窮偶寓意豈必真愛花不如亭中人一笑了天涯采采勿虚度門前欲髙牙古風二首上湯丞相抱瑟游孔門豈識宫與商古曲一再行乃雜巴人倡知音顧之笑解絃為更張歸來掩闗卧冰炭交愁腸平生桑濮手未省歌虞唐明發理朱絲復登君子堂遺音入三歎山髙水湯湯空山學仙子窮年卧巖扃煮石不得飽秋鬢蒼已星道逢紫霄翁示我餐霞經采采晨之華滌濯腐與腥向來役薪水終然槁柴荆跪謝起再拜飄颻蛻蟬輕飛升那敢學倘許學長生冷泉亭放水古苔危磴著枯藜脚底翻濤洶欲飛九陌倦遊那有此從敎驚雪濺塵衣九月十日南山見梅五斗留連首屢廻來尋南澗濯塵埃春風直恐淵明去借與橫斜對菊開送汪聖錫侍郎帥福唐承明纔入又南州重見旌旗照柁樓道義平生無捷徑風波隨處有虚舟如公未可違文石稽古何妨欠碧油我亦登門煩著録此行無力為王留送王純白郎中赴閩漕聲利場中百戰鏖今誰勇退似公豪緩尋南粤千山路先破西興百尺濤平日曼容嫌禄厚他年文本歎官髙才名政爾歸安徃富貴追蹤未可逃純白先君平生約官至正郎而休卒踐言故純白為兵部便丐去以承其志長至日與同舍遊北山嵗晚山同色湖平霧不收寒雲低閣雪佳節靜供愁竹柏森嚴立蒲荷索莫休瘦笻知脚力政爾耐清遊石湖詩集巻八欽定四庫全書石湖詩集巻九宋范成大撰次韻尹少稷察院九宫壇齋宿草草馳三里蕭蕭共一餐吏方緜禮蕝公自將詩壇隙月窺牀近窓風刮坐寒鴉鳴未忍散端為四并難冬祠太乙六言四首三一舊傳神呪十神今濟時艱願挽靈旗北指為君直擣隂山月色朧明碧瓦蠟烟浮動黃簾罡騎飈輪欲下一天飛霰纎纎雲木栖烏未動風庭警鶴先鳴殘夜百靈夙駕人間鼻息雷驚行道羽衣縹緲捲班玉珮冬瓏回首金鋪獸面歩虚聲在天風次韻李子永雪中長句黃昏苦寒烏鳥稀吹沙走石交橫飛布衾如鐵復似水夢想東風來解圍豈知天地有竒事夜半忩紙生光輝兜羅寶界佛所現𠖇凌不敢專璿璣開門倚杖眩一色迥立此世空無依少年行樂怳尚記瑶林珠樹中成蹊犬驕鷹俊馬蹄快狡穴未盡須窮追湖海粗豪今豈在但憶鳴哮如餓鴟北鄰亦復淡生活要我忍寒吟此詩手龜筆退不可捉墨泓齟齬氷生衣次韻子永見贈建除體建子玉杓直黃昏月如霜除道啓柴扃客來巾履忙滿炷寒缸油共此書檠光平生卜鄰願何意登我堂定交吾豈敢南榮慚伯陽執手道古作遺篇記河梁破􅑵風鳴悲孤客多慨傷危腸不捄飢我詩安得昌成章類村歌但可侣牛羊收功翰墨藪微子誰能良開巻得雅音玉鑾導旂常閉户坐相念雪深梅暗香與胡經仲陳朋元遊照山堂梅數百株盛開九陌緇塵滿客􅁭錢塘門外有園林胡牀住處梅無限酒斾垂邊柳未深晴日煖風千里目殘山剰水一人心元方伯始皆吾黨解后清遊直萬金次韻胡邦衡祕監斯言向來立千古敢疵瑕有命孤蓬轉何心勁箭加人窮名滿世天定客還家回首冥恩怨虚空不著花三月四日驟煖日脚融晴晚氣暄睡餘初覺薄羅便如何柳絮沾泥處煖似槐隂轉午天久雨地濕汗礎經旬未肯乾破􅑵隨處有蝸涎衹今不耐春隂得想見黃梅細雨天晝錦行送陳福公判信州漢家麟閣多王侯冠佩相望經幾秋晝錦聲名兩榮耀惟有信州如相州國南門頭折楊柳借問江津垂白叟住在行都四十年曽見歸舟似公否人言公與赤松期飊車羽輪來何時雲出雲歸俱是道苦學赤松還未妙君不見補陀大士海復山隨喜却來觀世間送張真甫中書奉祠歸蜀種成桃李恰新隂忽憶家山叢桂林客路莫嫌歸計拙春江爭似駭機深一封朝奏鈞天夢萬里江行魏闕心後日還朝飽風露黒頭應有雪絲侵送周子充左史奉祠歸廬陵黃鵠飄然下九闗江船載月客俱還名髙豈是孤臣願身退聊開壯士顔傾蓋當年真旦暮沾巾明日有河山後期淹速都難料相對猶憐鬢未斑送陳天予大監同年使閩春闗十載記英遊蚤喜時才近采旒夷路着鞭方逸駕急流回首忽扁舟雲霄正穩君猶去塵土無邊我合休問訊後車容客否茶山茘浦看南州送陸務觀編修監鎮江郡歸㑹稽待闕寶馬天街路烟篷海浦心非闗愛京口自是憶山隂髙興餘飛動孤忠有照臨浮雲付舒巻知子道根深見說雲門好全家住翠微京塵成嵗晚江雨送人歸邊鎖風雷動軍書日夜飛功名袖中手世事巧相違送李仲鎮宰溧陽相逢已歎十年遲冷淡貧交又語離玉筍換班通籍後黃梅催雨送帆時月巖家世猶為縣仲鎮方叔孫也金瀨溪山好賦詩喚起酸寒孟東野倒流三峽洗餘悲送吳元茂丞浦江玉筍翻乗縣佐車飄然不肯待新除才名已被人爭說官簿何妨計小踈憶昨西湖同我載從今南浦望君書遥知斂板趨風後始覺丞哉果負予雪晴呈子永碧空無處泊同雲晴入荒園鳥雀馴冰面小風池欲動雪邊濃日瓦如薫塵容俗狀長為客冷蘂踈枝又作去聲春詩巻豈能生煖熱犯寒聊復惱比鄰次韻子永雪後見贈雪瓴待伴半隂晴竟日檐冰溜雨聲九陌泥乾塵未動南山石露塔猶明稍聞吉語占農事便覺歸心勝宦情想得秫田來嵗好瓦盆加釀灌愁城次韻郊祀慶成帝德重堯緒天心與舜禋慶期符後甲元日際初辛上緯扶南極旄胡拱北辰律諧風自艮衡正斗垂寅桂燎靈宫曉蕭脂太室晨百神森壁壘萬衞密鉤陳日月青旂色雷霆玉輅塵洗兵銀漢水收雪紫壇春天歩臨黃道仙班像玉宸陶匏宗素樸琮璧慕精純祕祝裒時對髙斿歘下賓金鐘鳴傑簴朱火熭芳薪日麗雞竿矗天旋鳳律新端門敷錫後六合共絪緼從巨濟乞蠟梅寂寥人在曉雞窓苦憶花前續斷腸全樹折來應不惜君家真色自生香次韻朋元賣花處見梅烟濃日淡不多寒擔上看花雪作團想得竹邊春已暗明朝走馬過溪看與正夫朋元遊陳侍御園沙際春風捲物華意行聊復到君家年年我是曽來客處處梅皆舊識花官減不妨詩事業地寒猶辦醉生涯城中馬上那知此塵滿長裾席帽斜正月十四日雨中與正夫朋元小集夜歸燈市淒清燈火稀雨巾風帽笑歸遲月明想在雲堆處客醉都忘馬滑時老去樽前花隔霧春來句裏鬢成絲浮生不了悲歡事作劇兒童緫未知次韻子永夜雨辦作長愁客工哦苦雨吟挑燈今夕意欹枕故園心漏屋踈踈滴空檐細細斟相過巷南北屐齒怕泥深次韻朋元遊王氏園聮翩歩屧翠微間回首紅塵自鮮歡捲地雨添千澗急擁門雲鎖兩山盤絶憐茶笋能留客仍喜蛙聲不在官雪白楊梅消息未重來應至麥秋寒遊靈石山寺寺門頰壁有仙人顔禹李甲蕭筠三人題詩方運筆時伸臂丈餘閽人驚報主僧回顧已失矣西湖富清麗城府塵事并我獨數能來不負雙眼明騷騷殘絮罷颭颭新荷成嵗華日夜好遊子能無情午隂釀初暑稍喜巾袂輕小風吹鬢毛將我入松聲崖寺金碧暗石泉肝膽清壽藟萬蛟舞靈峰雙髻撐仙人昔來游筆墨上朱甍舉臂尋丈髙聊得兒童驚老矣謝狡獪題詩記吾曽次韻李器之編修靈石山萬嵗藤歌君不見東林怪蔓之詩三百年字如金繩鐵索相糾纒不如李侯靈石句筆陣壓倒長城堅藤隂詩律兩秀發此段竒事今無前吾聞草木未有不黃落雨荒霜倒相後先緜緜紫藟天所壽風雨不動常蒼然堅姿絶鄰傲一世深本無極融三泉騰虯舞蛟矯欲去流蘇絡帶翩如仙班荆芘藾得吾黨酌泉共吸杯中天詩成一斗屬太白擘牋揮埽如雲烟北門西掖君自有坐擁紅藥然金蓮山腰澗底莫濡滯早晚天風吹蛻蟬次韻正夫遊王園㑹者六人丘園窈窕復﨑嶇草木生香景倍殊花下百杯齊物我雲邊一眼盡江湖不知朱户趦趄者能勝青山放浪無六逸蕭然真可畵為君題作竹溪圖四月五日集陳園照山堂尋壑經丘到此堂官閑聊作送春忙短籬水面殘紅滿團扇風前衆緑香盡捲簾旌延竹色深斟杯酒納山光洞門無鎖城門近轉午雞啼日正長題寶林寺可賦軒十里山行雜市聲道傍無處濯塵纓寶林寺裏逢修竹方有詩情約略生次韻朋元久雨誰釀愁䨧玉宇間都縁梅子要斕斑騰騰困思午猶夢擾擾奔雲風未還休問滿城騎馬滑不妨長日閉門閑今朝晴色熹微似乾鵲飛來語屋山韓無咎檢詳出示所賦陳季陵户部巫山圖詩仰窺髙作歎息彌襟余嘗攷宋玉談朝雲事漫稱先王時本無據依及襄王夢之命玉為賦但云頩顔怒以自持曽不可乎犯干後世弗察一切溷以媟語曹子建賦宓妃亦感此而作此嘲誰當解者輙用此意次韻和呈以資撫掌瑶姬家山髙插天碧叢竒秀古未傳向來題目經楚客名字徑度岷峨前是邪非邪莽誰識喬林古廟常秋色暮去行雨朝行雲翠帷瑶席知何人峽船一息且千里五兩竿頭見旛尾仰窺仙館至今疑行人問訊居人指千年遺恨何當申陽臺愁絶如荒村髙唐賦裏人如畵玉色頩顔元不嫁後來飢客眼長寒浪傳樂府吹復彈此事牽連到温洛更憐塵韈有無間君不見天孫住在銀濤許塵間猶作兒女語公家春風錦瑟傍莫為此圖虚斷腸次韻樂先生吳中見寄八首金鶴飛來尺素通新詩字字挾光風三年湖海闗心處都在先生句子中官居門巷果園西桃李成蹊杏壓枝如許年芳忙裏過斬新今日試題詩墓林棲鳥各深枝燕子知巢觸幔飛倘有三椽今已去不闗五斗解忘歸懶不看書似姓邊夢魂飛繞白鷗前須知席帽衝塵出不似篷窓聴雨眠送春濛雨漲蘋灘荷葉田田柳絮䦨想見垂虹三萬頃拍天湖水釣絲寒知從了義透音聞古井無波豈更渾便好一坑埋衆妙何須六結解諸根幾多螻蟻與王侯徃古來今共一丘遮莫功名掀宇宙百年兩角寄蝸牛粟囊聊復寄三餐埋没緇塵懶濯冠紅紫百般紛過眼郷山嵗晚自蒼官胡長民監元挽詞太學虀鹽舊中吳翰墨聲闗山題柱筆風露讀書檠夜雨緑荷破孤墳丹桂生空將擅場手徃記玉樓成次韻朋元正夫夜飲歌豪仍作家奕勝豈徼幸莫嗤老非少乃尚可以逞玉瓶引杯長政爾寒漏永二三文章公共此銀燭影陳卿得秀句劉郎一笑領羸驂兀殘夢乗墜恍難省曉枕訌更潮俱墮無何境次韻趙正之同年客中清班合列大明宫自要牛刀試一同踏徧巉巖吾道在莫將尋尺較窮通氊車席帽各青春花下驊騮一閧塵離合飄零十霜露咸陽客舍有詩人可憐山縣五斤手不識王孫八斗才君自扶揺有霄漢從渠蜩鷃舞蒿萊次韻陳季鄰户部旦過菴宦遊觸處似懸匏北嶽南山想獻嘲拍手百年休鑄鐵蓋頭一把暫誅茅玉京嵗晚梧桐落水國霜清橘柚包飛錫已隨歸夢去何人頂上鵲成巢朋元不赴湖上觀雪之集明日余召試玉堂見寄二絶次其韻雪溪清興未渠䦨晚上西樓帶月看公子自貪低唱酒肯來同對玉峰寒文場寧復鬢霜冝白玉堂前雪霽時不惜狂言棖忌諱秃毫冰硯竟無竒石湖詩集巻九欽定四庫全書石湖詩集巻十宋范成大撰翰林學士何公溥輓詞以下館中作盛際羣多士諸儒遜一賢名場魁淡墨官簿到花磚地近行知政天髙不假年書生稽古力何必盡台躔送洪内翰北使二首郊廟熙成霈率濱罪如猾夏亦維新邊烽已却來南虜使節猶煩第一人遥想穹廬占漢月便呼重譯布唐春單于若問公家世說與麒麟畵老臣峨冠方侍玉輿香公比侍祠郊禋執綏備顧問雙節飄然照大荒正倚先生令國重寧容大敵詫兵強天教忠信行區脫人許功名上太常試卜和羹知未晚歸來烟雨正梅黃次韻趙德莊吏部休沐窈窕新堂好委蛇夜直還遥知欹帽髮正奈捲簾山門外客姑去窓前人對閒誰能烏帽底塵土涴朱顔次韻王夷仲正字同遊成氏園秀巖堂上玉東西把酒登臨望眼迷天宇四垂粘地近海山一抺帶潮低絶知客好無塵事聊記吾曽有醉題倚賴羣仙聮姓字他年誰敢一杴泥是日諸公令余題壁王季海祕監再賦成園復次韻雲莊風榭對東西清暑光隂近竹迷一斗正縁詩興盡兩睂休為客愁低披開豹霧尋陳迹埽盡蛛塵看舊題健徃莫愁騎馬滑闌珊梅雨不成泥春晚偶題寂寥春事冷於秋雨打風吹斷送休㸃檢梨花成一夢蘸紅新緑滿枝頭倪文舉奉常將歸東林出示綺川西溪二賦輙賦長句為謝且以贈行綺川亭上凌雲賦人在回仙舊遊處誰教書劒走長安荻月霜楓等閒度朱門不炙釣竿手萬巻難供折腰具偶然把筯憶蓴羮乞得閒官徑呼渡江漲橋頭有渡船船頭歴歴東林路雲烟如畵水如天笑憶紅塵問良苦我亦吳松一釣舟蟹舍漂揺幾風雨因君賦裏說江湖破帽蹇驢明亦去雞犬相聞望可見鷗鷺同盟心亦許相過得得欵溪門雪夜前村聴鳴㯭送吳智叔檢詳直中祕使閩抗章襥被豈公難已說髙風立懦頑客路莫嫌河畔草直廬須愛道家山秋生蓮浦船初泛春滿茶溪騎趣還却訪故人西府舊定煩書札墮田間楊君居士挽詞孝至蘭陔茂身脩梓里恭名場兒中鵠婣黨壻乗龍駒隙驚年運蟬嫣有慶鍾幽光定無憾豐刻妙形容送周畏知司直歸上饒待次漫郎西笑費三年故業新聞腹果然長麈劇談抽繭緒短檠細字綴蠶眠頻驚陸海風波夢未了京塵粥飯縁後日重來應訪舊五湖烟浪有漁船次韻魏端仁感懷俳諧體浪學騷人賦逺游大千何事不悠悠酒邊㸃檢顔紅在鏡裏端詳鬢雪羞過眼浮雲翻覆易曲肱短夢破除休孤烟落日冥鴻去心更冥鴻最上頭次韻李子永梅村散䇿圖光風先放越溪春蕭散尋詩索笑人藜杖前頭春浩蕩三生應是主林神太師陳文恭公挽詞日者更皇化公來輔聖能無心殊轍混不作衆波澄舉國材真相他年了中興天如遺一老人亦望三登候火朝連夕籌帷决縱擒一江奔馬勢千古殺狐林皦日黃河誓浮雲緑野心身名兩無憾天壤獨清音聖父咨當璧元臣預斷金玉衡賓舜日黃屋遂堯心國定功無迹身閒病已深旌忠有謨訓碑牓照來今趣召單車至驚傳兩鬢凋傾城迎國老即日走天驕夢已商人奠身猶漢相朝古來賢達意生滅兩消揺送陳朋元赴溧陽九畹滋蘭靜自芳啁啾誰復認孤凰風流嵗晚嫌杯酒文字功深得鬢霜斂板君猶能俛仰倚樓吾敢計行藏船開便作江南客天色無情更鴈行次韻韓無咎右司上已泛湖休沐辰良不待晴徑稱閑客此閑行春衫欺雨任教冷病眼得山元自明抺黛濃嵐圍坐晚揉藍新渌没篙清棲鴉未到催歸去想被東風笑薄情太保節使趙公挽詞密結髮險艱㑹捐軀跳盪功鬢凋猶陛㦸心在惜弢弓劒履三槐次樓臺四壁中諸郎競文武不朽是清風太冝人程氏挽詞程泰之吏部之母我昔官黟歙人傳女訓芳尊章冝小婦孫子壽髙堂風木真無定冰魚已不嘗遥憐霜露感何必薤歌傷捧檄三牲養稱觴百嵗期身猶孺子泣世已隙駒馳吉夢青衣卜豐碑黃絹辭佳城有竒事應足洗餘悲與王夷仲檢討祀社殘夜露如雨秋氣淒以分牆西雲正黒跕跕墮金盆良耜酢西成豆籩蓊芳芬去年嵗大祲小家甑生塵疫鬼投其巇虐甚溺與焚皇慈降清問下招離散魂調糜鬻藥石黒簿回春温德馨典神天秋稼如雲屯社公亦塞責醉此豐年樽神兮率舊職為國憂元元自今嵗其有驅癘蒼烟根王園官舍睡起公退閉閤卧官居如淨坊屋角斷虹飲日西楊柳黃客來束我帶客去書滿牀睡覺有忙事煮茶翻斷香古風酬胡元之以下白塔新居作拂我膝上琴當客清風襟我琴無軫絃不和願借之子調其音美人一笑千黃金彈作江岸花木深下有同隊之游魚上有同聲之鳴禽琴聲一叠一歎息江花江草無終極題徑山凌霄菴峰頭非塵寰一舍誰所茇軒睂玉霄近按指沙界豁萬山紛累塊衆水眇聚沬來雲觸石廻去鳥墮烟没向無超俗縁兹路詎可越偕行木上坐同我證解脫徑山傾葢亭萬杉離立翠雲幢嫋嫋稀聞晚吹香山下行人塵撲面誰知世界有清涼題徑山寺樓浴日蒼茫水捫星縹緲樓神光來燭夜壽木不知秋海内五峰秀天涯雙徑遊愛山吾欲住衰疾懶乗流丙戌閏七月九日與王必大登姑蘇臺招王浚明陳淵叔耿時舉避暑次時舉韻始賀火流西還嗟斗斜閏餘暑猶強顔新凉頗難進燥剛渴欲坼焦巻秃如燼炎官扶日轂輝赫不停運登臨有髙臺勇徃得三俊仍將王郎子飛歩凌劫仞風從噫氣來雲作壞山陣郷如垂頭魚忽已蟄蟲振空明晚逾清更要孤月印書生乃易與俛仰更喜愠憑闌天為髙舉酒山欲近竒書鐵鉤鎖麗句錦窠暈兹遊我輩獨難挽軟紅軔君看籠中鳥寧識咸池韻淵叔出米元章書蹟甚竒明日夜雨陡凉復次前韻呈時舉幽懷青松獨直道黃楊閏懶從褦襶子遮日干主進閉户友千載脫簡理秦燼秋熱出意表誰云法天運摧頽如鎩翮何暇賈餘俊願從青溪仙飛下二千仞撇波嘯長風鏖暑陷其陣兹行病未能暍卧何時振一雨忽破慳江湖發封印天公如仲尼亦念季路愠團扇未全踈短檠差可近細字讀蠶眠揩眼眩燈暈明當呼我友乗凉蹳游軔賡詩代僕呐非敢翫強韻七月二日上沙夜泛困倚船窓看斗斜起來風露滿天涯亭亭宿鷺明菰葉閃閃凉螢入稻花月下片雲應夜雨山根炬火忽人家江湖處處無窮景半世紅塵老嵗華浴罷西城落日半輪明浴罷衣裳一倍輕玉宇風來歸鳥急火雲銷盡緑雲生寄溧陽陳朋元明府約秋末過之海内交情兩斷金一官分袂阻登臨書來恰值看雲眼夢徃誰知共月心道義只今無捷徑溪山依舊有清音西風滿棹蒲帆飽秉燭相尋語夜深次韻耿時舉苦熱赤日纔低又火雲巷南街北斷知聞荷風拂簟昭蘇我竹月篩窓慰藉君避暑無竒那避謗能觴便了莫能文浮湛放蕩從今始悔把長裾強沐薫余家近穿小蓮池時舉亦種竹簷間皆為度暑計次韻王浚明用時舉苦熱韻見贈暑窓當午思昏昏雷起千峰睡不聞鑠石誰能招楚魄斵冰我欲訪湘君年華衹合加餐飯事業休工刺繡文賴有兩賢南北巷嵗寒幽谷共蘭薫李次山自畵兩圖其一泛舟湖山之下小女奴坐船頭吹笛其一跨驢渡小橋入深谷各題一絶船頭月午坐忘歸不管風鬟露滿衣橫玉三聲湖起浪前山應有鵲驚飛黃塵車馬夢初䦨杳杳騎驢紫翠間飽識千峰真面目當年拄笏漫看山太傅楊和王挽歌詞二首先廟垂忠烈孤童侈舊勲風雲天䇿府心膂殿前軍已快漸臺蹙還看罽幕焚人亡汗青在足以詔無垠定逺之師劉豫以廢石梁之役虜帳蕩然功無烈於此者嵗與靈光晚名登甲令芳剖符山若礪交㦸鬢如霜半世三槐位千秋異姓王哀榮公不憾人自惜堂堂少卿直閣鄭公挽歌詞恭老今代魁梧老終身寂寞濱鬢霜三館直碑淚五州春壽相空壬甲行年竟己辰墳丘纔馬鬛何處著經綸憶昨登門日驩傳考室詩謂公安且吉何意哭於斯遺老典刑盡此邦名教悲誰能傳耆舊他日慰吳兒髙景菴讀舊題有感莓苔風雨舊詩留十七年前鬢未秋巖桂拂雲篁竹拱樹猶如此一搔頭華山道中過午曽雲未肯開煖寒村店竹篘灰蕭蕭林響棠梨戰晚恐陽山有雨來送嚴子文通判建康四海論交賴有子一日不見真愁予人誰可與話心曲天忽遣來同里居懊惱春來不數面丁寧嵗晚猶頻書黒頭屢别那敢惜歎息駸駸霜滿梳次韻王浚明詠新居木犀月窟移來有貴名一簾金碧照東榮鼻端入妙睡魔醒眼底㑹真詩句生日氣瓏􅋛無奈醉露華凌亂不勝清君家傾國何時見淡埽蛾睂撚夕隂提刑察院王丈挽詞彦光諭蜀三年戍還吳萬里船雲歸雙節後雪白短檠前百世春秋傳一丘陽羨田浮生如此了何必更凌烟日者悲離索公今又眇冥門人辦韓集子舍得韋經此去念築室空來聞過庭平生無路見終古泣松銘送闗壽卿校書出守簡州東壁星宫館列仙一麾苦欲近田園宅家但寶千金鑑臣輩何辭萬里船壽卿述藝祖寶訓為書以獻多觸貴要者京洛知心塵鞅裏江吳攜手暮帆邊聲名如此歸安徃日日閶門望眼穿頃自吏部郎去國時獨同舎趙友益追路送詩數月友益得儀真過吳江次元韻招之東風分袂省西廊袖有明珠照客航道義有情通出處文章無地著炎凉君今猶把一麾去我敢倦鋤三徑荒邂逅天涯如夢寐肯來相對話更長長沙王墓在閶門外孫伯符英雄轉眼逐東流百戰工夫土一坏蕎麥茫茫花似雪牧童吹笛上髙丘次韻孫長文泊姑蘓館讀書窓下一燈殘忽有詩來為煖寒聞道扁舟春共載雪雲雖冷不相干長文再作復次韻渚蒲汀蓼得霜殘歸客思家不計寒喜鵲門前人一笑絶勝風色候長干次韻耿時舉王直之夜坐庭葉翻翻閙燈花粟粟穠闗山千里鴈風雨滿城鐘隴上新登榖江頭舊熄烽今年吾計得安穩讀三冬次韻徐子禮提舉鶯花亭并序秦少游水邊沙外之詞葢在括蒼監征時所作予至郡徐子禮提舉按部來過勸予作小亭記少游舊事又取詞中語名之曰鶯花賦詩六絶而去明年亭成次韻寄之灘長石出水鳴隄城郭西頭舊小溪游子斷魂招不得秋來春草更萋萋愁邊逢酒却成憎衣帶寬來不自勝烟水蒼茫外沙路東風何處拄枯藤壚下三年世路窮蟻封盤馬竟難工千山雖隔日邊夢猶到平陽池館中文章光燄照金閨豈是遭逢乏聖時縱有百身那可贖琳瑯空有萬篇垂山碧叢叢四打圍煩將舊恨訪黃鸝纈林霜後黃鸝少須是愁紅萬㸃時古藤隂下醉中休誰與低睂唱此愁團扇他年書好句平生知己識儋州石湖詩集巻十欽定四庫全書石湖詩集巻十一宋范成大撰己丑五月被召至行在遇周畏知司直和五年前送周歸弋陽韻見贈復次韻荅之以下自處州再至行在作分袂悠悠爾許年莫嗔蓬鬢兩蕭然酒槽不奈青春老經笥空供白晝眠暗緑千章新活計軟紅三尺舊塵縁相逢且作西湖客山繞荷花檥畫船次韻馬少伊郁舜舉寄示同游石湖詩巻七首蕪城老蘚不知春忽有柴門月色新芝草琅玕無鎖鑰自無超俗扣門人莫問朝歌與棘津浮生惟有一杯春君看百戰功名地越戍吳臺兩窖塵鏡面波光倒碧峰半湖雲錦萬芙蓉去年蕩槳香風裏行傍石橋花正濃紅皺黃團熟暑風甘瓜削玉藕玲瓏身謀已落園丁後滿帽京塵日正中兩賢風度藹春陽歩屧隨風上柳塘綵筆紅牋芳徑裏句中挾我萬花香得得來題小隱詩拂花縈柳画船移湖邊好景春猶未須到秋清月滿時瀟洒王郎亦勝流今年何事阻清遊當家風味今如此孤負山隂夜雪舟王必大獨不赴二公同遊之約玉堂寓直摛文窓户九霄中岸幘燒香愧老農上直馬歸催下鑰傳更人唱促鳴鐘金城􅏭嵲雲千雉碧瓦參差月萬重骨冷魂清都不夢玉階蕭瑟聴秋蛩己丑中秋寓宿玉堂聞沈公雅大卿劉正夫户部集張園賞月走筆寄之笑看收雲捲雨忙沉沉宫樹納空光夜長來伴玉堂宿天近似聞丹桂香鳷鵲樓欄浮瑞氣鳳凰城闕帶新凉遥知勝絶西園㑹也憶車公對舉觴八月二十二日寓直玉堂雨後頓凉雨意蒸雲暗夕陽濃薫滿院落花香題詩弄筆北窓下將此工夫報荅凉次韻荅吳江周縣尉飲垂虹見寄垂虹亭上角巾傾鼉怒龍吟醉不聴安得對君浮大白想應嗤我汗新青夢魂舞蝶隨春草時節賓鴻㸃暮汀湖海扁舟須及健莫教明月照星星次韻徐廷獻機冝送自釀石室酒三首元亮折腰嘻已久故山應有欲蕪田因君辦作送酒客憶我北窓清晝眠清絶仍香如橘露甘餘小苦似松肪官槽重濁那知此付與街頭白面郎一語為君評石室三杯便可博凉州百年兀兀同渠住何處能生半㸃愁玉堂寓直曉起書事記直舎老兵語江湖垂釣手天漢摛文堂魂清不得眠室虚自生光曉緯澹天闕江濤隱胡牀傳呼九門開奔走千官忙若若誇組綬紛紛夢黃梁微聞鈴下騶竊議馬上郎但計夢長短寧論已行藏與長文正夫游北山柳岸松門勝處通馬蹄踏霧入空濛春寒有力欺遊子天色無情没斷鴻雨脚逺連山脚暗杏梢斜倚竹梢紅駞裘擁鼻吾衰矣年少猶嫌料峭風致政承奉盧君挽詞二首德華父泮水橋門識太平歸來霜鬢老柴荆淹中學䆳方成傳谷口名髙豈待卿黃壤無情埋玉樹青衫有道勝金籯襄陽耆舊今蕭索惟有松風到晚清純孝當年有䕶持赤睂那敢近姜詩眼看庭玉成名後身及堂萱未老時湖海青鞵驚斷夢風霜丹旐挂新悲尊前五客今誰在愁絶廬山十段竒寓直玉堂拜賜御酒歸鴉陸續墮宫槐簾幙參差晩不開小雨遂將秋色至長風時送市聲來近瞻北斗璿璣次猶夢西山翠碧堆慚愧君恩來甲夜殿頭宣勸紫金杯送汪仲嘉侍郎使金分韻得待字聖人坐明堂洪覆等穹蓋嵗頒兩玉節前後歌出塞公才有廊廟安用試專對要煩第一人鎮撫大荒外嫩寒欺别酒微月見征斾遥知燕山雪飄灑漢冠佩玉色照穹廬驕子亦心醉要領一笑得歸來安鼎鼐是時春正佳湖上花如海清遊不可遲日日檥船待李翬知縣作亭西湖上余用東坡語名之曰飲緑遂為勝槩芷葺蓮巢喚客遊蘆鞭席帽為君留未論吹水堪添酒且要移牀學枕流乍霽却隂梅釀雨暫暄還冷麥催秋石湖也似西湖好煩向蒼烟問白鷗草蟲扇莫嫌絡緯股鳴悲解向寒牕促曉機海眼多花無藉在顛狂只待學于飛送汪仲嘉待制奉祠歸四明分韻得論字丹霄碧海眇髙鶱厭直承明却自論寶馬十年聴漏箭扁舟一雨看潮痕侍臣相憶松門逺歸客還憐菊徑存清潤要非山澤相又煩一札下雲根魯如晦郎中挽詞二首術業推游刃功名苦溯洄著鞭孤壯志籌算老竒才星省龎睂去雲山袖手來知公了時命何必誄餘哀自古歸來引于今遂隠篇碁燈熒夜觀歌板聒春船陳迹空華似佳城露草邊寂寥雞黍約望眼一􅏰然初約鄰人至石湖以下辛卯自西掖歸吳作窈窕﨑嶇學種園此生丘壑是前縁隔籬日上浮天水當户山橫匝地烟春入葑田蘆綻筍雨傾沙岸竹垂鞭荒寒未辦招君醉且吸湖光當酒泉社日獨坐海棠雨後沁臙脂楊柳風前撚緑絲香篆結雲深院靜去年今日燕來時與周子充侍郎同宿石湖幽香馥蕙帳清夢安且吉蘿月墮蒼茫松風隠蕭瑟曉禽啄且鳴喚我起盥櫛鈎窓納雲濤灔灔浴初日金鉦忽騰上倒景落書帙佳晴有新課曬種催萟秫從今不得間東臯草過膝和周子充侍郎見寄樂府戲贈之作釣海風水急登樓塵霧髙不如岸綸巾春船攜小橋芳草含竒薫光景上東壁桂林那辦此辦作安昌客壬辰三月十八日石湖花下作夜飲海棠月朝潄山茶露臞儒槁木形受用侈如許荆扉隔黃塵誰識花島路惟有瘦笻枝共飽園中趣林神釀餘春政爾美無度葱蘢千萬重芳意未渠暮風香薦秀色鼎俎謝腥腐雖無稻粱謀捫腹有餘飫刈麥行梅花開時我種麥桃李花飛麥叢碧多病經旬不出門東陂已作黃雲色腰鐮刈熟趂晴歸明朝雨來麥沾泥犁田待雨插晩稻朝出移秧夜食麨壬辰天中節赴平江錫燕因懷去年以侍臣攝事捧御盃殿上賦二小詩去嵗排場德壽宫薫風披拂酒鱗紅小臣供奉金龍醆親到虚皇玉座東天中繖動玉輿來萬嵗三聲徹九街想見牙牀當殿過舜裳雲委拜堯階壬辰七月十六日侵晨真率㑹石湖路中書事白葛烏紗稱老農溪南溪北水車風稻頭的皪粘朝露歩入明珠翠網中次韻施進之惠紫芝术山精媒長生仙理信可詰梨棗本寓言杞菊亦凡質幽人愛臞儒藥鼎薦珍物絶粒謝烟火耘苗換肌骨摩挱萊蕪甑塵生不須拂題醉道士圖蜩鷃鵬鵾任過前壺中春色瓮中天朝來兀兀三杯後且作人間有漏仙五雜組四首并序古樂府有五雜組及兩頭纎纎殆類酒令孔平仲最愛作此以為詩戲亦效之五雜組同心結徃復來當窓月不得已話離别五雜組流蘇縷徃復來臨行語不得已上馬去五雜組回文機徃復來錦梭飛不得已獨畵睂五雜組綵絲鍼徃復來鳥投林不得已夢孤衾兩頭纎纎二首兩頭纎纎探官繭半白半黒鶴氅縁腷腷膊膊上帖箭磊磊落落封侯面兩頭纎纎小秤衡半白半黒月未明腷腷膊膊扣户聲磊磊落落金盤冰再賦五雜組四首五雜組綬若若徃復來大車鐸不得已去丘壑五雜組侯門㦸徃復來道上檄不得已天涯客五雜組漢旌斾徃復來賓鴻字不得已餐氊使五雜組非烟雲徃復來朝馬塵不得已嬰龍鱗夜坐聴雨四檐密密又踈踈聲到蒲團醉夢蘇恰似秋眠天竺寺東軒窓外聴跳珠寒夜獨歩中庭忍寒索句踏霜行刮面風來鬚結冰倦僕觸屏呼不應梅花影下一窓燈㑹散夜歩忘却下樓扶我誰接離顛倒酒沾衣貪看雪樣滿街月不上籃輿歩砌歸歩砌吳語也孟嶠之家姬乞題扇二首輕雲翠英輕烟小雨釀芳春草色連天緑似裙斜日滿樓人獨望斷鴻飛入萬重雲翠袖凌寒弄月明梅花影下醉三更一天風露誰驚覺寂寞空杯綴落英周畏知司直得湖南帥屬過吳門復用己丑年倡和韻贈别邂逅婆娑失少年劇談抵掌尚超然君猶拄笏看山去我且披蓑聴雨眠京洛分襟疑後㑹江吳把酒悟前縁暫來忽去都如夢疑是陳卿竹葉船偶書以下十五首三十年前所作續得殘稾附此巻末伯勞東去燕西飛同寄春風二月時可恨同時不同調此情那得更相知雙燕底處飛雙燕銜泥上藥欄莫教驚得去留取隔簾看戲題牡丹主人細意惜芳春寶帳籠堦護紫雲風日等閒猶不到外邊蜂蹀莫紛紛春日三首藥欄花煖小猧眠雪白晴雲水碧天煮酒青梅寒食過夕陽庭院鎖鞦韆西窓一雨又斜暉睡起薫籠換夾衣莫放珠簾遮洞户從教燕子作雙飛雙鯉無書直萬金畵橋新緑一篙深青蘋白芷皆愁思不獨江楓動客心髙樓曲以下六首皆夢境所得嵗暮天涯客黃昏蝙蝠飛髙樓人不到小雨怯單衣湘江怨蘋芷迷烟路蓮舟忘却歸夜寒江水黒風雨夢如飛採蓮三首溪頭風迅怯單衣兩槳凌波去似飛折得蘋花雙葉子緑鬟撩亂帶香歸藕花深處好徘徊不奈華筵苦見催記取南涇茭葉露月明風熟更重來柔櫓無聲坐釣魚浪花飛㸃翠羅裾空江日暮無來客腸斷三湘一紙書弔陳叔寶詞賞心亭上再來遊烟月迷人獨自愁行到江邊無去路却隨潮水過揚州石湖詩集巻十一欽定四庫全書石湖詩集巻十二宋范成大撰渡淮八月十一日渡盱眙過泗州順風如飛船旗衮衮徑長淮汴口人看撥不開昨夜南風浪如屋果然雙節下天來汴河汴自泗州以北皆涸草木生之土人云本朝恢復駕回即河須復開指顧枯河五十年龍舟早晩定䟽川還京却要東南運酸棗棠梨莫蓊然虞姬墓在虹縣下馬鋪北三十七里劉項家人緫可憐英雄無策庇嬋娟戚姬葬處君知否不及虞兮有墓田宿州五更出城鬼火滿野狐鳴鬼嘯夜茫茫元是官軍舊戰場土伯不能藏碧燐三三兩兩照前岡雷萬春墓在南京城南環以小牆榜曰忠勇雷公之墓九隕元身不隕名言言千載氣如生欲知忠信行蠻貊過墓行人下馬行雙廟在南京北門外張巡許逺廟也世稱雙廟南京人呼為雙王廟平地孤城寇若林兩公猶解障妖祲大梁襟帶洪河險誰遣神州陸地沉睢水睢口石門已隤河亦塞即項羽大敗漢兵處一戰填河擁漢屯拔山意氣已鯨吞直南即是隂陵路兵果難將勝負論伊尹墓在空桑北一里有磚堠刻云湯相伊公之墓相傳墓左右生棘皆直如矢三尺黃壚直棘邊此心終古享皇天汲書猥述流傳妄剖擊嗟無咎單篇留侯廟在陳留縣中案王原叔諸家攷子房所封乃彭城留城非陳留也自宋武下教修復時其失久矣功成輕舉信良謀心與鴟夷共一舟吕媪區區無鳥喙先生輕負赤松遊西瓜園味淡而多液本燕北種今河南皆種之碧蔓凌霜卧軟沙年來處處食西瓜形模濩落淡如水未可蒲萄苜蓿誇冝春苑在舊宋門外俗名東御園狐塜獾蹊滿路隅行人猶作御園呼連昌尚有花臨砌腸斷冝春寸草無京城倚天櫛櫛萬樓棚聖代規模若化成如許金湯尚資盜古來李勣勝長城護龍河在新宋門外中有􅃠船數十艘新郭門前見客舟清漣淺淺抱城樓六龍行在東南國河若能神合斷流福勝閣曹太皇所建竒崛冠京城中翬飛五級半空翔指㸃樓欄說太皇劫火不能侵願力巋然獨似漢靈光相國寺寺榜猶祐陵御書寺中雜貨皆裔俗所需而已傾檐缺吻護奎文金碧浮圖暗古塵聞說今朝恰開寺羊裘狼帽趂時新州橋南望朱雀門北望宣德樓皆舊御路也州橋南北是天街父老年年等駕廻忍淚失聲詢使者幾時真有六軍來宣德樓金人加崇葺改曰承天門嶢闕叢霄舊玉京多年淪陷最傷神何時得作清宫使重睹承平五鳯城市街京師諸市皆荒索僅有人居梳行訛雜馬行殘藥市蕭騷土市寒惆悵軟紅佳麗地黃沙如雨撲征鞍金水河在舊封丘門外河中多大石皆艮嶽所隤菜市橋西一水環宫牆依舊俯清灣誰憐磊磊河中石曽上君王萬嵗山壺春堂徽廟稱道君時所居在擷芳園中俗呼為八滴水閣者松漠丹成去不歸龍髯無復有攀時芳園留得觚稜在長與都人作淚垂漸水黃河將決其地則伏流先出名曰漸水河身日徙而南過封丘至胙城界中已有漸水去汴京大約五十里耳黃流日夜向南風道出封丘處處逢紫蓋黃旗在湖海故應河伯欲朝宗李固渡洪河萬里界中州倒捲銀潢聒地流列弩燔梁那可渡向來天數亦人謀天成橋碑石蔡京書在睿州岡上驛中東廡下舊浮橋在此今河徙南行矣一岡邑屋舊河灘却望河身百里間湧土漲沙漫白道天成橋石在髙山舊滑州在濬州側積水中為河所淪久矣大伾即黎陽山西望積水不逺大伾山麓馬徘徊積水中間舊滑臺漁子不知興廢事清晨吹笛棹船來扁鵲墓在湯隂伏道路傍相傳墓上土可療病禱而求之或得小圎如丹藥活人絶技古今無名下從教世俗趨墳土尚堪充藥餌莫嗔醫者例多盧羑里城在羑河上四垣儼然陵谷遷移尚故墟天盈商罪未蠲除古今行客同嗤罵何止三篇泰誓書文王廟在羑里城南堂堂十亂欲興周肯使君王死作囚巧笑入宫天亦笑可憐元不費深謀相州推車老人自言吾州韓魏公鄉里南北兩墳尚無恙禿巾髽髻老扶車茹痛含辛說夢華賴有郷人聊刷恥魏公元是魯東家秦樓在相州寺中上有貴人幕而觀使客云是郡主太守之妻也大抵相臺傾城出觀異於他州欄街看幕似春遊斑犢雕車碧畵油奚女家人稱貴主縷金長袖倚秦樓翠樓在秦樓之北樓上下皆飲酒者連袵成帷迓漢官翠樓沽酒滿城歡白頭翁媪相扶拜垂老從今幾度看講武城在漳河上曹操所築周遭十數里鑿城為道而過阿瞞虓武蓋劉孫千古還將鬼蜮論縱有周遭遺堞在不如魚復陣圖尊七十二塜在講武城外曹操疑塜也森然彌望北人比常増封之一棺何用塜如林誰復如公負此心聞說北人為封土世間隨事有知音趙故城在邯鄲縣南延袤數十里金石笙篁絶代無鼪鼯藜藿正乗除園翁但愛城泥煖侵早鋤霜種晩蔬邯鄲道即昔人作黃粱夢處薄曉霜侵使者車邯鄲阪峻且徐驅困來也作黃粱夢不夢封侯夢石湖藺相如墓在邯鄲縣南趙故城之西玉節經行障塞深馬頭釃酒奠踈林兹行璧重身如葉天日應臨慕藺心邯鄲驛驛後有磔犬祭天者大抵盡為裔俗漢戚夫人縣人也長安大道走邯鄲倚瑟佳人悵望間逺嫁更憐邊塞苦琵琶馬上憶闗山叢臺在邯鄲北門外憑髙閱士劒如林故國風流變古今袨服雲仍猶左袵叢臺休恨緑蕪深臨洺鎮去洺州三十里洺酒最佳伴使以數壺及新兔見餉竟日霜寒暮解圍融融桑柘染斜暉北人爭勸臨洺酒云有棚頭得兔歸邢臺驛信德府驛也去太行最近城外有荷塘柳隄頗清麗不類河朔太行東麓照邢州萬叠烟螺紫翠浮誰解登臨管風物枯荷老柳替人愁柳公亭在邢州城北小園中伴使邀客入遊云舊有流杯今廢園正對太行馬鞍一峰極􅍶崒主人敬客有餘情催喚繩牀坐柳亭曲水流觴非故物馬鞍山色舊青青内丘梨園内丘鵞梨為天下第一初熟收藏十月出汗後方佳園户云梨至易種一接便生可支數十年吾家園者猶聖宋太平時所接汗後鵞梨爽似冰花身耐久老猶榮園翁指似還三嘆曽共翁身見太平大寧河在内丘北河之東皆梨棗園二果正熟梨棗從來數内丘大寧河畔果園稠荆箱擾擾攔街賣紅皺黃團滿店頭北人謂道上聚落為店頭柏鄉唐志堯山乃古柏仁俗傳或以此柏鄉為柏人貫生名壓漢公卿自古逢讎不反兵仇敵滔天無敢動柏鄉空溷迫人名唐山即堯山金主之父名宗堯改山名山下有放勲廟勲唐遺德照清灣百聖聞風不敢班底事遺名遭變易何人知道是堯山光武廟在柏鄉北兩壁有二十八將像廟前有二石人皆自腰而斷俗傳光武夜過以為生人問途不應劒斬之云雲臺列像拱真人野老猶誇建武春不用劒鋒能刜石冰河一瞥已通神趙州石橋在城南洨河上以鐵筍卯貫石捲篷不類人工石色如霜鐵色新洨河南北尚通津不因再度皇華使誰洗奚車塞馬塵柏林院即東院趙州禪師道場在城中邊塵一起劫灰深風鼓三灾海印沈急過當年無佛處庭前空有柏森森欒城縣極草草伴使怒頓餐不精欲榜縣令跪告移時方免頽垣破屋古城邊客傳蕭寒㸑不烟明府牙緋危受杖欒城風物一淒然呼沲河即光武渡冰處在真定南五里聞道河神解造冰曽扶陽九見中興如今爛被風塵涴不似滄浪可濯纓真定舞裔樂悉變中華惟真定有京師舊樂工尚舞髙平曲破紫袖當棚雪鬢凋曽隨廣樂奏雲韶老來未忍耆婆舞猶倚黃鐘衮六么東坡祠堂在中山府學學在化原坊化原坊裏尚黌堂聞道蘇仙有奉嘗想見當年行樂處牙旗鐵馬照金章松醪中山酒猶名松醪然甚漓松風潄罷讀離騷翰墨仙翁百代豪一笑邊人那辦此當年嵇阮尚餔糟望都縣人多癭婦人尤甚相傳縣東接唐縣病癭者甚衆此縣蓋染其風土縣西有小阜曰由山荒寺踈鐘解客鞍由山東畔白烟寒望都風土連唐縣翁媪排門帶癭看安肅軍舊梁門三城今惟一城有人烟溏濼皆涸矣從古銅門控朔方南城烟火北城荒臺家抵死爭溏濼滿眼秋蕪襯夕陽出塞路安肅北門外大道容數車方軌當年玉帛聘遼陽出塞曽歌此路長漢節重尋舊車轍插天猶有萬垂楊白溝在安肅北十五里闊纔丈餘古亦名巨馬河本朝與遼人分界處髙陵深谷變遷中佛劫仙塵事事空一水涓流獨如帶天應留作漢提封太行渡河即與太行俱北至燕猶未斷大抵東至薊門北至塞北西接奚界也若晴日無埃則出京至封丘已望見之矣西北浮雲捲莫秋太行南麓照封丘橫峰側嶺知多少行到燕山翠未休固城自白溝十五里至固城鎮舊遼界也水味極惡用柳作大棬汲井謂之凉罐柳棬凉罐汲泉遥味苦仍鹹似海潮却憶徑山龍井水一杯洗眼洞層霄范陽驛涿州驛牆外有尼寺二鐵塔夾塗如雪俯瞰驛中郵亭偪仄但冝冬恰似披裘坐土空枕上驚回丹闕夢屋頭白塔滿鈴風定興舊黃村金人建為縣井邑未成新城遷次少人烟桑柘中間井徑寒亦有染人來賣纈淡紅深碧挂長竿清逺店定興縣中客邸前有婢兩頰刺逃走字云是王家私自黥涅雖殺之不禁女僮流汗逐氈軿云在淮鄉有父兄屠婢殺奴官不問大書黥面罰猶輕琉璃河又名劉李河在涿州北三十里極清泚茂林環之尤多鴛鴦千百為羣烟林葱蒨帶回塘橋眼驚人失睡鄉健起褰帷揩病眼琉璃河上看鴛鴦此河大中祥符間路振乗軺録亦謂琉璃河惟嘉祐中宋敏求入番録乃謂之六里河語音相近難得其真灰洞在涿北燕南之間兩旁皆髙岡無風而路極狹塵土坌積咫尺不辨人物塞北風沙漲帽檐路經灰洞十分添據鞍莫問塵多少馬耳冥濛不見尖良鄉燕山屬邑驛中供金粟梨天生子皆珍果又有易州栗甚小而甘新寒凍指似排籖村酒雖酸未可嫌紫爛山梨紅皺棗緫輸易栗十分甜盧溝去燕山三十五里金以活鴈餉客積數十隻至此放之河中金法五百里内禁採捕故也草草魚梁枕水低怱怱小駐濯漣漪河邊服匿多生口長記軺車放鴈時此河宋敏求謂之蘆菰即桑乾河也今呼盧溝燕賓館燕山城外館也至是適以重陽金重此節以其日祭天伴使把菊酌酒相勸西望諸山皆縞云初六日大雪九日朝天種落驩也將佳節勸杯盤苦寒不似東籬下雪滿西山把菊看㑹同館燕山客館也授館之明日守吏㣲言有議留使人者萬里孤臣致命秋此身何止一漚浮提擕漢節同生死休問羝羊解乳不遼人館本朝使已謂之㑹同館石湖詩集巻十二欽定四庫全書石湖詩集巻十三宋范成大撰與吳興薛士隆使君遊弁山石林先生故居此巻乾道壬辰冬赴廣西道中所作舊名南征小集白蘋有嘉招蒼弁得勝踐㑹心不憚逺乗興恐失便籃輿犯窮臘共作忍寒面溟濛雲釀雪浩蕩風落鴈松篁漸清幽猿鶴或悲怨英英文章公作舎鎖葱蒨嶢峰俯前榮佳木秀諸院窮搜發山骨林立侍談讌西巖踞熊虎東巖峙屏案履綦故仿佛葢瓦已零亂經營三十年成毀一飛電摩挲土花碧小立為三歎自石林回過小玲瓏巖竇益竒昔為富人吳氏所有今一子尚幼山檢校於官一丘乃中虚洞穴四無礙却略巖岫杳黝糾石狀怪蒼牛飲前池碧罅灔微瀨雕鎪具百巧圖畵窘千態哀湍寫壞磴凍雨濕空翠踈梅照草棘瘦竹拔蹊隧當時閭閻子目力在塵外孤童藐難料竒事疑有待誰歟千金捐來換把茅蓋不仙亦足豪衆垤皆累塊我評北山遊勝絶此無對玲瓏詎可小孰能為之大濯纓亭在吳興南門外淒風急雨脫然晴當道橫山似見迎野水茫茫何用許斕供遊子濯塵纓乾道己丑守括被召再過釣臺自和十年前小詩刻之柱間後五年自西掖帥桂林癸巳元日雪晴復過之再用舊韻三絶浮生渺渺但飛埃問訊星宫又獨來天上人間最髙處為君題作鬱蕭臺拙踈何計補㳙埃慚愧雙旌去復來三過溪門今老矣病無脚力更登臺界天山雪淨黃埃溪上扁舟夜汎來匝地東風勸椒酒山頭今日是春臺玉山道中常山多清溪玉山富喬木行色鬱蒼然頗亦慰愁目梅花隔籬見瓏􅋛照茅屋晩來風刮地想見飄香玉桃花壇下望龜峰石壇無土謾嶔岑何自能生小柏林擬擘蛤蜊龜殻上病來不殺嬾登臨清音堂與趙德莊太常小飲在餘干琵琶洲傍洲以形似得名曲浦彎環繞縣青一盃閒客兩飄零琵琶不語蒼烟暮山水清音著意聴過鄱陽湖次游子明韻春工釀雪無端密大塊囊風不肯收休問巉巖與欹側我今茅靡共波流野鷹兀兀平沙上折葦蕭蕭古渡頭滿眼荒寒底處所令人腸斷五湖舟豫章南浦亭泊舟二首繡檻臨滄渚牙檣插暮沙浦雲沉斷鴈江雨入昏鴉野曠天何近春寒嵗未華來朝風一席隨處且浮家閏嵗花光晚霜朝草色荒趂墟猶市井收潦再耕桑客路東西懶江流日夜忙長歌情不盡一酌酹滄浪清江道中橘園甚夥芳林不斷清江曲倒影入江江水緑未論萬户比封君瓦屋人家衣食足暑風汎花蘭芷香秋日籬落明青黃客舟來遲佳景盡但見碧樹愁春霜清江臺在臨江郡圃西岡上張安國題榜南來富壽岡形勝此蟠結岑􅱼戴髙臺欄檻了風月蕭灘曳長烟閣皁炯殘雪江流當帶橫練練浮木末天風來無郷萬里吹醉纈登臨信竒事忍凍亦癡絶故人春夢覺遺墨秋蛇掣浮雲真可咍揮觶酹空闊自冬徂春道中多雨至臨江冝春之間特甚遂作苦語客行無晴時涔涔如漏天東吳至西江舊嵗接新年蠟屐驚踵決油衣笑鶉懸掀淖起復仆頃歩如重闗略似鴨與猪汨没泥水䦨我塗未渠窮一晴愧天慳倒塔橋已斷壁破渡無船路人相告語未到先長歎薄晚得磽确稍入袁州山不辭石齧足聊免泥没韀自古行路吟聴者凋朱顔軒渠尚能賦詩人類癡頑玉虚觀去冝春二十五里許君上升時飛白茅數葉以賜王長史王以宅為觀觀旁至今有仙茅極異常草備五味尤辛辣云久食可仙道士煮湯以設客白雲堆裏白茅飛香味芳辛勝五芝揉葉煮泉摩腹去全勝石髓畏風吹入分冝新喻渡無橋分冝橋有欄孰歟兩徼吏賢否已判然堂上著威信四郊如目前入國政可知兹焉略闚觀方竹杖竹君箇箇面團團此士剛方獨凛然外貌中心俱壁立任從癡子削教圎游仰山謁小釋迦塔訪孚惠二王遺蹟贈長老混融堵田溪淵清洄洄梅洲問路寒雲堆連空磴道虬尾滑竹輿直上無梯階蒼官來迎夾道立相逢無言心眼開翠微中斷雪磵吼兩耳不辦供喧豗林間靜極成斷相政要萬壑號風雷山如蓮盆繞金地龍官避席餘蒼崖祖師抱膝坐古塔大禪海浪翻天來騰空狡獪我未暇拄杖踏濕撞莓苔問龍亦借一席地解包聴雨眠西齋當年公案忌錯舉神通佛法同坑埋混融菴中的的意笑我舌本空崔巍兹事且置飽喫飯稊田米賤如黃埃大雨宿仰山翌旦驟霽混融云無乃開仰山之雲乎出山道中作此寄混融誰開大仰雲此豈吾力及日光千丈毫彈指衆峰立衡山捲隂氣海市發冬蟄韓蘇兩枯魚出語自濡濕人厄與天窮底用苦封執但喜拄杖俊仍欣芒屩澁向來三尺泥有足似羈􅎗龍淵古橋皴獺徑寒溜泣龍淵獺徑皆山中徃迹春淺山容瘦風饕澗聲急一簞寄前村野䔩旋收拾猫頭髠筍尖雀舌剥茶粒土毛冠江西斗酒況可挹聊同一笑粲緩賦百憂集初入湖南醴陵界崖樹隂隂夾暝途出山歡喜見平蕪一春客夢飽風雨行盡江南聞鷓鴣醴陵驛緑水橋通縣縣前浮橋名門前柳已黃人稀山木壽土瘦水泉香乍脫泥中滑還嗟堠子長櫧州何日到鼓枻上滄浪湘潭道中詠芳草積雨倐然晴秀野若新沐芳草徑寸姿中有不勝緑萋萋路傍情頗亦念幽獨驅馬去不顧斷腸招隠曲初見山花三日晴泥尚没鞾幾將風雨過年華湘東二月春纔到恰有山櫻一樹花櫧洲道中烟凝山如影雲褰日射毫桃間紅樹迥麥裏緑叢髙客子歎游倦田家甘作勞乗除吾尚可未擬賦離騷浮湘行湘山中間湘水橫緑蘋葉齊春漲生盤渦沄沄去無聲吾乗桂舟泝中􅍽揚波擊汰雙擼獰轆轤引笮如牛鳴篙師絶叫叠鼓轟潛魚跳奔乳猿驚煖烟浮空晝夢騰山長水逺天無情吹簫拊瑟弔湘靈水妃風御繽來迎問客良苦逺征行昨者斧鉞下青冥命我盡護安南兵嶺海一視如王庭布蕩陽春濯腐腥王事靡盬來有程匪躬之故惟爾甿芳洲杜若空青青九歌淒悲不可聴願賡楚調歸和平湘江洲尾快風挂帆船頭雪浪吼奔雷十丈髙帆滿意開我自只憑忠信力風應不為世情來兒童屢惜峰巒過將士猶教鼓笛催明日祝融天柱去更煩先捲亂雲堆泊湘江魚口灘知時社燕語檣竿游子奔波自鮮歡趂客賣魚雙漿急隔林沽酒小旗寒瀟湘渾似日南落嶽麓已從天外看薄暮灘前收百丈卧聞三老報平安謁南嶽湘中固多山夾岸萬馬屯坡陀無敢髙似遜喬嶽尊曉投望雲亭衆丘拱牆藩濃嵐忽飄蕩積翠浮雲端天柱已峻極祝融更髙寒紫蓋鬱當中岡勢洶崩奔峙為赤帝峰下直宫壖垣角樓捧雙闕圎方模九閽炎符撫中興南正實司天草木薰協氣山林奠神姦妥靈有備物龍巻鸞旗軒走忝桂林伯與神俱南轅上謁禮亦冝為國憂元元心空禍福相古井寒無瀾杯珓不用擲但願歸田園相傳壁畵好拂拭塵埃昏弓刀立壯士劒珮班靈官後宫行樂處窈窕千雲鬟錦地舞月晝珠櫳侍春閑武氏筆已絶梗概猶清妍後宫壁畵武洞清筆極禁籞富貴之趣紹興二十年火後為雨所敗後人摹舊蹟更畵猶有彷彿旋車闔廟去頗厭山市喧勝果招客遊徑排集賢闗梵庋絢雜組衡嶽藏經皆錦絲竹簾護之孟蜀時捨簾乃其户部侍郎彬所造錫杖鏘古鐶開山善果尊者所遺避雨勝業閣在嶽祠之南晩晴留凭欄石廪暎岣嶁望眼増孱顔上封眇孤絶南臺半雲烟碧岫有靈藥朱陵巢洞仙晚晴乃盡見諸峰病倦懶幽討山僧鐫我頑松樛唐季枝柏跼隋初根竒事不勝紀重遊當細論廟路三十里夾岸大松五季時馬氏所植勝業寺柏不見根偃於地出八榦龍蟠占數畝世所未之見傳為隋時物兩蟲鷓鴣憂兄行不得杜宇勸客不如歸天涯羈思難繪畵惟有兩蟲相發揮衡陽道中二絶桑下蕪菁晚髙花出短籬茅簷少春事惟記浴蠶時黒羖鑚籬破花猪突户開空山竹瓦屋猶有燕飛來衡州石鼓書院古磴浮滄渚新黌鎖碧蘿要津山獨立巨壑水同波俎豆彌文肅衣冠盛事多地靈鍾傑俊寧但拾儒科合江亭并序合江亭即石鼓書院今為衡州學宫一峰特立踞兩水之㑹湘水自右蒸水自左俱至亭下合為一江而東有感而賦韓文公所謂渌淨不可唾者即此處今有渌淨閣石鼓鬱嵯峨截然踞滄洲有如古盟主勤王㑹諸侯蒸湘伯叔國禀命㑹葵丘敢不承載書戮力朝宗周混為同軌去崩奔不敢留冝哉百谷王博大無與儔氊毳昔亂華車馬隔中州未聞齊晉勲包茅費誅求桓文亦𢎞規尚取童子羞安知千載後但泣新亭囚我題石鼔詩願言續春秋沈家店道傍棣棠花乍晴芳草競懷新誰種幽花隔路塵緑地縷金羅結帶為誰開放可憐春邵陽口路麤惡積雨餘濘難行平生春夢境俛仰撫八極湖南天盡頭夢亦未常識豈知多病身今乃著脚厯山泉澄不清崖土璺而赤坳堂滑勝油累塊硬逾石貪夫一回顧壯士三歎息不知清淑氣果復曽鬱積我豈鄙夷之短咏聊一劇馬鞍驛飯罷縱歩食飽倦輿馬散䇿歩前岡意行踏芳草蕭艾蓊生香春事甚寂寥山桃帶松篁游蜂入菜花此豈堪蜜房今年蠶出遲柘葉分寸長好晴纔數日嵗事未渠央黃羆嶺薄遊每違已兹行遂登危峻阪盪胸立恍若對鏡窺傳呼半空響濛濛上烟霏木末見前驅可望不可追躋攀百千盤有頃身及之白雲叵攬擷但覺沾人衣髙木傲燒痕蔥蘢茁新荑春禽斷不到惟有蜀魄啼謂非人所寰居然見鋤犁山農如木客上下翾以飛寧知有康莊生死安嶮巇室屋了無處恐尚橧巢栖安得拔汝出王路方清夷衡永之間山路艱澁薄晩吏卒閧云漸近祁陽路已平夷皆有津津之色朝登赤土嶺暮入黃泥谷春江弄花月歸夢恍在目覺來行路難杜宇叫髙木凹中泥没踝凸處石齧足坐輿我尚病想見肩輿僕衡陽復祁陽可暫不可宿晩來出前岡路坦亭堠促將士走相賀喜色如膏沐人生本無悶逆境要先熟不從憂患來安識平為福夷塗不常遇厯險始知足書浯溪中興碑後并序乾道癸巳春三月余自西掖出守桂林九日渡湘江游浯溪摩挲中興石刻洎唐元和至今遊客所題竊謂四詩各有定體頌者美盛德之形容以其成功告於神明者也商周魯之遺篇可以槩見今元子乃以魯史筆法婉辭含譏葢之而章後來詞人復發明呈露之則夫磨崖之碑乃一罪案何頌之有竊以為未安題五十六字刻之石傍與來者共商略之此詩之出必有相詬病者謂不合題破次山碑此亦習俗固陋不能越拘攣之見耳余義正詞直不暇卹也三頌遺音和者希丰容寧有刺譏辭絶憐元子春秋法都寓唐家清廟詩歌詠當諧琴搏拊䇿書自管璧瑕疵紛紛健筆剛題破從此磨崖不是碑愚溪在零陵城對岸渡江即至溪甚狹一石澗耳葢衆山之水流出湘中一水彎環羅帶闊千古零陵擅風月取名如許安得愚因病成妍却竒絶至今鏡淨不可唾猶恐先生遺翰墨澤及溪流不庇身付與後來商巧拙我欲扁舟窮石澗春漲未生寒瀨咽紛紅駭緑四山空惟有風篁韻騷屑清溪東去客西征鈷鉧潭邊聊駐節何時隨汝下瀟湘歸路三千櫓伊軋鈷鉧熨斗也潭形似之宿清湘城外田家驅馬力猶彊奏牀身始疲浮浮雲拂帳潏潏水鳴籬未熟燈前夢閑尋道上詩湘中多夜雨客枕最先知宿深溪驛去廣右界只一程北户書頻到南雲鴈不飛試評騎馬路何似釣魚磯擊柝黄茅店篝燈白竹扉故園桑柘煖亦有稻粱肥石湖詩集巻十三欽定四庫全書石湖詩集巻十四宋范成大撰晩春二首以下桂林作舊在乙稿靜極聞檐珮慵來愛枕幃隙虹飛永晝簾影碎斜暉燕踏花枝語蜂縈柳絮歸輕颸冝白紵時節近清微好事憐春老無愁耐日長爐烟驚扇影酒面舞花光照水雲容嬾移牀竹意凉更煩紅槿帽促拍打山香紅荳蔲花緑葉蕉心展紅苞竹籜披貫珠垂寶珞剪綵倒鸞枝且入花欄品休論藥裹冝南方草木狀為爾首題詩偶題檐雨初乾團扇風夕陽芳樹緑葱葱蕉心榴萼俱無賴要與春衫相並紅次韻郭季勇機冝雪觀席上留别勝絶尊前萬事休縱非吾土且登樓山迎雨脚俄飛過風約江聲欲倒流野水漸堪添酒面夕陽依舊滿簾鈎憑䦨從此遲歸鞅能及中秋對月不次韻許季韶通判雪觀席上把酒臨風瑞露傾瓊漿何用謁雲英捲簾雨脚銀絲挂倚杖江頭緑漲生嶺海一凉蘇暑病山林千籟試秋聲兹遊竒絶忘羈宦慚愧烟中短棹橫送周直夫敎授歸永嘉青燈相對話儒酸老去羈遊自鮮歡昨夜榕溪三寸雨今朝桂嶺十分寒知心海内向來少解手天涯良獨難一笑不須論聚散少焉吾亦跨歸鞍贈趙廉州馬羣雜沓草蒙茸刮目權竒一洗空天末也煩行李到嵗寒聊得酒尊同梅花夜夜湘南雨榕葉年年海北風少待佳晴看山去玉篸髙插翠雲叢去年過弋陽訪趙恂道通判話西湖舊遊因題小詩近忽刻石寄來謾録紅塵寶馬碧湖船一夢如今費十年却照清溪尋緑鬢但餘衰雪兩蕭然送唐彦博宰安豐兼寄呈淮西帥趙渭師郎中唐子皦自鮮水清石粼粼繡腸五車書不鄙簿領塵黟山與桂嶺一笑二十春天涯㑹面難嵗晩情話真五管無賢侯但有嵐烟昏此豈功名場徃戍清淮濱北門詩書帥平生吾故人問訊今何如凌烟上星辰為言落南客病作寒螿呻飄飄北歸夢夜繞吳淞雲燕堂後盧橘一株冬前先開極香盧橘花殘細細飛滿枝晴日閙峰兒霜餘有此香無奈合與稱題賦小詩乾道癸巳臘後二日桂林大雪尺餘郡人云前此未省見也郭季勇機冝賦古風為賀次其韻憶昔北征秋遇雪穹廬苦寒不堪說飛花如席暗燕然把酒悲歌度佳節異邦館客類西河鐍户不容浮蟻泄當時已分餐氊莩寧復夢遊炎嶺熱忽逐梅花行萬里又與故山輕話别天公恐我愁瘴霧十日號風吹石裂同雲乃肯度嚴闗一夜玉峰髙􅏭嵲老榕蓊密最先縞穉竹枵虚時一折須知桂海接蓬灜滿目三山白銀闕不管樓髙翠袖單但嫌酒淺金杯凸東郭先生履雖敝詩情却鬬冰壺潔歸撚凍髭搜好句山館青燈對明滅為憐叶氣到黃茅何止森森松柏恱豐年作守㑹飽煖羈宦思歸自愁絶豈無菊徑樂琴書亦有秫田供麴糵東岡雪後一犁春誰在陂頭憶調燮次韻陳仲思經屬西峰觀雪仙人灕江遊剪水馮夷宫賓友來鄒枚寒轡揺冬瓏起望天南陲玉沙滿長風越人未省識把酒酹層空從來嶠南北人謂將無同那知梁園霰飛入瑞露中幕府有清士尋僧上西峰六花信姢巧未及五字工我亦滌冰硯課虚貴新功莫嗤兩臞儒毫端尚清豐喜雪示桂人臘雪同雲嶺外稀南人北客盡冬衣從今老杜詩猶信梅片飛時雪也飛寄題商華叔心逺堂用巻中韻示我新詩巻知君遯俗情安流視巫峽灰劫笑昆明徽外夜絃語甕頭春蟻生藍橋即仙窟何況有雲英送郭季勇同年歸衡山天壤郭有道文獻今在兹啄啄家雞羣見子野鶴姿塵籠萬里心擇食中夜飢拙宦避捷徑瘴風吹鬢絲平生杏園友把酒天南陲何敢吏朱浮但喜見紫芝問君今何適舊圃餘荒畦提攜漢隂甕嵗晩俱忘機勿開衡山雲恐驚隠淪棲定肯從君遊嵗晚攀桂枝我亦理吳榜春湘緑蘋齊風蒲為誰落之子同襟期丁寧祝融峰將迎兩枯藜一望五千里共洗蠻烟悲甲午嵗朝寓桂林記去年是日泊桐江謁嚴子陵祠迤􅆔度嶺感懷賦詩去年曉纜解江臯也把屠蘇泛濁醪一席飽風漁浦闊千山封雪釣臺髙將軍老矣鳴孤劒客子歸哉咏大刀早晩扁舟尋舊路柁樓吹笛破雲濤癸水亭落成示坐客長老之記曰癸水繞東城永不見刀兵余作亭於水上其詳具記中天將福地鞏嚴城形勝山川表裏明舊說桂林無瘴氣今知灕水辟刀兵雲深銅柱邊聲樂月冷珠池海面平願挽江流接河漢為君直北洗欃槍緩帶軒獨坐午日烘開荳蔲苞檐塵飛動雀爭巢蒙蒙困眼無安處閒送爐烟到竹梢食罷書字甲子霖涔雨東南濕蟄風茘枝梅子緑荳蔲杏花紅捫腹蠻茶快扶頭老酒中荒隅經嵗客土俗漸相通蠻茶出修仁大治頭風老酒數年酒南人珍之次韻平江韓子師侍郎見寄三首自古四愁湘水深誰將城郭啓山林有情碧嶂團欒繞無數朱樓縹緲臨蚺鼓揭天驚客坐象鍪航海厭蠻琛三千客路長安逺故舊書來直萬金南人以蚺蛇皮作腰鼔響徹異常交趾以象革為兜鍪皆異事靈泉杖屨浙江頭經濟長懷尚典州堂上讀書朝氣爽臺前呼月海光浮交情尺素勤雙鯉筆力枯松挽萬牛已把三章翻樂府為君擊節變蠻謳子師新作小築於浙江號靈泉讀書堂呼月臺皆其處也前年衝雪過雙溪風帽泥韀騎吹隨爛醉依前逢錦瑟好音惟是欠黃鸝功名未試玉璜玦離别頻傾金屈巵疇昔北征煩吉夢南征合有夢歸時頃年北使時朝野多妄傳被留不歸子師家中人忽夢予歸翌日過界報到故末句及之鶯鶯子師家善歌者前年過婺劵滿已去冝齋雨中秀麥一番冷送梅三日霖緑肥新茘子紅浥舊蕉心映竹千絲舞垂檐一線斟終朝盤膝坐卑濕恐相侵次韻許季韶通判水鄉席上青山緑浦竹間明彷彿苕溪好處行解愠風來如故舊催詩雨作要將迎休兵幕府烏鳶樂熟稻邊城鼓笛聲摹寫箇中須綵筆句成仍挾水雲清水鄉酌别但能之主管能之將過石康南郭河橋市井喧緑荷香處有江天一簾梅雨爐烟外三叠陽闗燭淚前馬耳西風君並海船頭北渚我歸田後期只恐參商似且醉金槽四十絃六月十五日夜汎西湖風月温麗暮檥金龜潭追隨今夕凉波紋挾月影揺蕩舞船窓夜久四山髙松桂黯以蒼長烟界巖腹浮空餘劒鋩棹夫三弄笛跳魚翻素光我亦醉夢驚解纓濯滄浪多情芙蕖風嫋嫋吹鬢霜會心有竒賞天涯此何方清潤不立塵空明滿生香過清難久留俛俯墮渺茫燕堂書事嵗稔齋鈴閴年深屋塈摧狸爭雷瓦過螘化雨窓來盡日風常籟無時地不梅耳邊情話少笑口若為開酒邊二絶團扇香中嫋嫋風斷腸聲裏看羞紅不須過處催乾盞聴徹歌頭盞自空日長繡倦酒紅潮閒束羅巾理六么新樣築毬花十八丁寧小玉慢吹簫枕上作繞枕蚊相聒翻釭䑕自忙早衰秋夢亂不寢曉更長賦擬騷人屈吟成病客莊安心無可覓隨處且為鄉思歸再用枕上韻老覺觸事懶病添歸計忙行年心已化疇昔意空長五柳栗里宅百花錦城莊何時去檢校一棹水雲鄉李正之提㸃行至郴用予忙字韻寄和荅天涯逢我病秋晩送君忙感槩交情厚留連别恨長賓筵猶雪觀客路已雲莊揺落郴江路應須憶醉鄉曉出北郊偪仄深巷中葱蘢緑隂交山家不早起閉户如藏逃濃露蛻蟬咽小風飢燕髙新渠厪涓流壞陂方怒號遐甿病瘠土不肯昬作勞滅裂復滅裂晩秧如牛毛空餘朝氣白浮浮濕弓刀官稱勸農使臨風首頻搔甘雨應祈三絶晩稻成苞未肯肥鵓鳩啼曉雨來時黃紬被冷初眠覺先向芭蕉葉上知數日雖蒙霡霂霑浥塵終恨太廉纎今朝健起巡檐看恰似廬山看水簾髙田一雨免飛埃上水綱船亦可催說與東江津吏道打量今晩漲痕來與鄭少融趙養民二使者訪古訾家洲歸憩松闗二君欲助力興廢戲書此付長老善良以當䟽頭飄飄竹雨潤輕裘嫋嫋松風繫小舟安得從容興廢手越人重上訾家洲淳熙甲午桂林鹿鳴燕輒賦小詩少見勸駕之意維南吾國最多儒聳看招招赴隴書竹實秋風辭穴鳳桃花春浪脫淵魚月宫移種新栽桂江水朝宗舊鑿渠況有狀頭坊井在明年應表第三閭郡人曹鄴及第詩云我到月宫收得種為君移向故園栽今嵗用故事植桂正夏進德二堂之下又復朝宗古渠以應文章應舉之䜟趙觀文王世則亦郡人皆魁天下故詩中悉及之逍遥樓席上贈張邦達敎授張癸未省闈門生也同年進士俱㑹樓上者七人疇昔金門看選賢一星終矣半英躔誰憐蠻府清池句不著南山捷徑鞭作者七人茅瘴地肅霜九月菊殘天浮生聚散如風雨同倚東樓豈偶然畵工李友直為余作冰天桂海二圖冰天畵北使渡黃河時桂海畵游佛子巖道中也戲題許國無功浪著鞭天敎飽識漢山川酒邊蠻舞花低帽夢裏胡笳雪没韀收拾桑榆身老矣追隨萍梗意茫然明朝重上歸田奏更放岷江萬里船耳鳴戲題厯厯從何起泠泠與耳謀人言衰相現我以妄心求逺磬山房夜寒蜩隴樹秋圓通無别法但自此根修復作耳鳴二首至音豈寂透希夷珍重幽田為發揮妙用何闗新巻葉圓通自有倒聞機夢中鼔響生千偈覺後舂聲失百非寄語爵隂吞賊道玉牀安穩坐朱衣東極空歌下始青西方寶網奏韶英不須路入兜元國自有音聞室筏城牛蟻誰知牀下鬬雞蠅任向夢中鳴如今却笑難陁種無耳何勞強聴聲碧虚席上得趙養民運使寄詩約今晩可歸次韻迓之偶攜尊酒上孱顔忽憶行人瘴霧間便好來分蒼石坐已敎不鎖翠雲闗寒夜萬象閴無語一蛩吟獨譁肅肅月浸樹滿庭穠李花風從月中來吹我兩鬢華北斗聲廻環南斗亦橫斜人生幾良夜吾行久天涯離居隔江漢何由寄䟽麻甲午除夜猶在桂林念致一弟使金今夕當宿燕山㑹同館兄弟南北萬里感悵成詩把酒新年一笑非鶺鴒原上巧相違墨濃雲瘴我猶住席大雪花君未歸萬里闗山燈自照五更風雨夢如飛别離南北人誰免似此别離人亦稀乙未元日用前韻書懷今年五十矣浮生四十九俱非樓上行藏與願違縱有百年今過半别無三䇿但當歸定中久已安心竟飽外何須食肉飛若使一丘并一壑還鄉曲調儘依稀儘乃俗字再用前韻時被命帥蜀休論今昨緫皆非世味誠甘與我違蜀道雖如履平地杜鵑終勸不如歸三冬自苦坐毛穎一夢微官陪螱飛夜久南枝翻倦鵲茫茫月白衆星稀與同僚遊栖霞洞極深逺中有數路相傳有通九疑者燭將盡乃還飲碧虚上陳仲思用二華君韻賦詩即席和之竹杖芒鞵俗網踈每逢絶勝更踟躕但隨岐路東西去莫計光隂大小餘彷彿桃源猶舞鳳辛勤李白謾騎魚今朝真作遊仙夢不似騷人賦子虚施元光在崑山病中逺寄長句次韻荅之四海飄蓬客舍邊幾多雲水與風烟絶無膂力驅長轡空有孤忠誓大川參井忽隨征馬上斗牛應挂故山前親交情話知何許詩到天涯喜欲顛次韻趙養民碧虚坐上已將山色染睂黛更挽江波添酒罍珍重江山勸人醉笑人驅馬惺惺廻贛州明府楊同年挽歌詞二首拱璧温無纇深蘭逺自芳清班孤玉筍薄宦老銅章傳業麒麟子承家鴻鴈行門䦨自簪笏吾獨憾堂堂憶昔龍門化曽容鴈塔陪逡巡九閏過迢遞一書來未報錯刀贈驚傳丹旐廻辰陽隔江渚空些楚詞哀石湖詩集巻十四欽定四庫全書石湖詩集卷十五宋范成大撰初發桂林有出嶺之喜但病餘更覺登頓至靈川疲甚自歎羸軀乃無一可偶陸融州有使來書此寄之桂林獨宜人無瘴古所傳北客守炎官恃此以泰然堂髙愜宴坐訟簡容佳眠不計身落南璿柏三囘天今朝逐出嶺歡呼繫行纒罝兎脫豐草池魚躍清淵那知多病身久靜反懷安長風蕩籃輿簾箔飄以翾靈泉路喫蹶僕夫告頳肩我亦頭岑岑中若原闕蟻旋走投破驛宿強飯不下咽兹事未渠央萬里蜀道難十年故倦游况乃成華顛蠶老當作繭不繭夫何言甘棠驛萬里三年醉嶺梅東風刮地馬頭迴心勞政拙無遺愛慚向甘棠驛裏來靈泉驛後有龍惠泉泉螭無語笑經過欲拊焭鰥奈拙何孤奉明思雖出嶺歡顔終少汗顔多嚴闗或謂之炎氣逈人守險處朔雪多不入闗闗内外風闗桂殊人以為南北之限也囘看瘴嶺已無憂尚有嚴闗限北州裹飯長歌闗外去車如飛電馬如流施進之追路出嚴闗且寫予真戲題其上喚渡牂柯瘴水濱嚴闗闗外又逢春神仙富貴俱何在且作全家出嶺人興安乳洞有上中下三巖妙絶南州率同僚餞别者二十一人游之山水敦夙好煙霞痼竒懐向聞乳洞勝出嶺更徘徊雪林縞萬李東風知我來華裾繡髙原故人紛後陪繫馬玉溪橋嵌根豁崔嵬蕩蕩碧瑶宫水泉漱墻隈芝田溉石液深畦龍所開匄我一掬慳頮此炎州埃仍呼輪袍舞醉倒瑞露盃但恐驚山林腰鼔轟春雷薪翁雜餉婦圜視歡以咍兹巖何時鑿閱世幾刼灰始有此客往後㑹真悠哉南游冠平生已去首猶囘嵗月可無紀三洞俱磨崖㑹有好事者摩挲讀蒼苔鏵觜在興安縣五里所秦史禄所作也迎海陽水疊石為壇前銳如鏵衝水分南北下為湘灕二江功用竒偉子交代李徳逺嘗修之導江自海陽至縣迺瀰迤狂瀾既奔傾中流遇鏵觜分為兩道開南灕北湘水至今舟檝利楚粤徑萬里人謀敓天造史禄所經始無謂秦無人虎䑕用否耳紫藤纒老蒼白石溜清泚是間可作社牡酒百世祀修廢者誰歟配以臨川李大通界首驛愚悃無華敢自欺寸誠珍重吏民知東風重倚庭前樹送别人情似到時陳仲思陳席珍李靜翁周直夫鄭夢授追路過大通相送至羅江分袂留詩為别相送不忍别更行一程路情知不可留猶勝輕别去二陳拱連璧僊李瑚璉具周子雋拔俗鄭子秀風度嗟我與五君曩如棲鳥聚偶投一林宿飄揺共風雨明發各飛散後㑹𣺌何處栖鳥固無情我輩豈漫與班荆一炊頃聽此昆弟語把酒不能觴有淚若兒女修程各著鞭慷慨中夜舞功名在公等癯儒老農圃懷桂林所思亭篸山竒絶送歸時曽榜新亭號所思桂水秪今湘水外他年空有四愁詩羅江嶺北初程分外貪驚心猶自怯晴嵐如何花木湘江上也有黄茅似嶺南初入湖湘懷南州諸官今晨入湖南岡土絳以紫厥壤既殊異風氣當稱此囘思始安城舊籍贅楚尾實惟荆州𨽻零陵之南鄙時雪度嚴闗物色號清美倘以土宜觀尚非清湘比何况引而南焦茅數千里向我作牧時客過不停軌憧憧走官下既至輒咎悔書來無别語但說瘴鄉鬼我今幸北轅又念泉君子懷哉千金軀博此五斗米作詩諷方來南游可以已車輪倘無角吾詩亦金柅清湘縣郊外雜花盛開有懷石湖午行清湘縣妍煖春事嘉柴荆閙桃李冥冥一川花故園豈少此愈此百倍加我寧不念歸顧作失木鴉百年北窓凉安用天一涯君恩重喬嶽敢計征路賖鄉心與官身鑿枘方聱牙橘柚走珍貢何如繫匏瓜明當復露奏天日臨幽遐倘許清江使曳尾還汙邪珠塘未至清湘二十里茂林鳥烏急坡長驢䭾鳴坐輿猶足痺負笈想肩頳廢廟藤遮合危橋竹織成路傍行役苦隨處有柴荆題湘山大施堂山中祖師號無量夀真身塔在焉重倚春林淚竹枝南游風物鬢成絲難尋桂海千峯夢更了湘山一段竒來去别無心外法行藏休問塔中師若論大施門前事竿木逢場且賦詩清湘驛送祝賀州南歸海内交情兩斷金離歌倡和俱呉音桃花如雨暮春酒竹箭有筠他日心萬里書來蜀道易四愁詩成湘水深田園將蕪各蚤計一棹五湖能見尋清湘驛送王栁州南歸二絶南歸北去路茫茫不是行人也斷腸可惜湘江春夜月落花時節照離觴我已兼程無脚力君猶追路有襟期從今月下共花下誰復醉吟先和詩七里店口占分手暮江寒徘徊立馬看尋常相見易倍覺别離難全守支耀卿飲錢七里倅楊仲宣復攜具至深溪酌别且乞余書走筆作此兼寄耀卿店舎煙火寒塵沙亭堠逺嫣紅糝芸緑春事亦已晩年芳去踆踆江水來兖兖故人瀟湘逢留落一笑莞已張七里飲更出深溪餞草間艷紅粉竹裏趣㕑傳故意如許長由來共鄉縣愧我不能觴負此離歌囀别愁滿天末不醉何由遣却憶支使君風前白波捲深溪鋪中二絶追路寄呈元將仲顯二使君賀州歸去栁州還分路千山與萬山把酒故人都别盡今朝真箇出陽闗祗有南風捲路塵斷無南客送車輪故人合在瀟湘見却向瀟湘别故人戲題愚溪碧湍潄白石沄沄復湯湯既為人所愚安用爾許忙我昔曽經過重來已三霜無事趼雙足奔走寧非狂溪流到江平翻笑客路長豈不有嵗晩乞身還故鄉初泛瀟湘六槳齊飛急下灘碧琉璃上雪花翻越來溪色清如此只欠磯頭一釣竿湘口夜泊南去零陵十里矣營水來自營道過零陵下湘水自桂林之海陽至此與營㑹合為一江我從清湘發源來直送湘流入營水故人亭前合江處暮夜檣竿矗沙尾却從湘口望湘南城郭山川恍難紀萬壑千巖詩不徧惟有蒼苔㾗屐齒三年瘴霧亦竒絶浮世登臨如此幾湖南山色夾江來無復瑶篸插天起坡陀狠石蹲清漲澹蕩光風浮白芷騷人魂散若為招傷心極目春千里我亦江南轉蓬客白鳥愁煙思故壘逺游雖好不如歸一聲鶗鴂花如洗南臺瑞應閣用壁間張安國韻衝雨上山頭臨雲看山脚松間一彈指開此寶樓閣草鞵方費錢拂子不暇握小偈出雷音千古驚猿鶴湘潭暮雨檣竿縣一灣長官立馬水雲間風吹江沫浮浮去誰在沙頭閉户閒泊長沙楚秀亭雨從湘西來波動南楚門不知春漲髙但怪江水渾舟行風打頭陸行泥没鞍且登裴公臺半日心眼寛題嶽麓道鄉臺山外江水黄江外滿城緑城外杳無際天低到平陸長煙貫楚尾逺勢帶呉蜀故園東北望游子䦨干曲寄題潭帥王樞使佚老堂孺子滄浪濯纓處千載新堂來卜鄰潦收無波徹底靜東湖之水堂中人濛陽花譜勝洛下竹西藥䦨來海瀕新篁緑沉桂丹渥嶽立竒石蒼苔皴賞心滿眼伴閉户天風夜下扶車輪胸中種蠡妙經濟鬢鬚白雪朱顔春蒼生未佚身未老斯堂未可忘斯民四年西略可萬世孤撑獨立扛千鈞匹馬幡幡恃天日危言岌岌愁鬼神浮生蚤休信不惡持此欲去非吾聞客游瀟湘逢騎吹知公已為蒼生起公今少勞佚者多湛輩乃可寒江蓑王公自言堂去東湖頃步新得彭州牡丹揚州芍藥丹桂貓頭竹并徐氏五怪石列堂下湘隂橋口市别游子明馬首欲東舟欲西洞庭橋口暮寒時三年再别子輕去萬里獨行吾蚤衰遥憶美人湘水夢側身西望劒門詩老來不灑離亭淚今日天涯老淚垂竈渚白魚出水臥銀刀紫筍堆盤脫錦袍捫腹將軍猶未快棹船西岸摘蔞蒿大波林湖路荒寒又險艱大千空水我居間篙師晩始分南北指㸃青青漢口山連日風作洞庭不可渡出赤沙湖金沙堆前風未平赤沙湖邉波不驚客行但逐安穏去三十六灣漲痕生滄洲寒食春亦到荻芽深碧蔞芽青汨羅水飽動荆渚嶽麓雨來昏洞庭大荒無依飛鳥絶天地惟有孤舟行慷慨悲歌續楚些彷彿幽瑟迎湘靈黄昏慘淡檥極浦雖有漁舎無人聲冬湖落􅍽此暫住春潦怒長隨傭耕吾生一葉寄萬水况復揺落浮滄溟漁蠻尚自有常處羈官方汝尤飄零寄題贑江亭陳季陵贑州書云新作此亭泉使李正之題其榜要予詩二水之㑹新作亭主人文章子墨卿我記斯亭且不朽千載當與文俱鳴題榜誰歟漢使者風流好事飾儒雅平生兩君吾故人安得繫馬亭堦下鼔旗西征上奔瀧所思不見心難降瞿塘縱有文鱗雙愛莫致之章貢江浯溪道中江流去不定山石來無窮步步有勝處水清石玲瓏安得扁舟繫絶壁臥聽漁童吹短􅅇弄水看山到月明過盡行人不相識夜泊灣舟大風雨未至衡州一百二十里阿香攪客眠夜半驅疾雷空水受竒響如從船底來嘈嘈雨窓閙軋軋風柁開睡魔走辟易耳界愁喧豗有頃飄驟過灘聲獨鳴哀燈婢燭囊衣篙師理檣桅煩擾到明發村雞亦喈喈泊衡州客裏仍哦對雨吟夜來星月曉還隂空江十日無春事船到衡陽栁色深步入衡山應有人家住隔溪緑隂亭午但聞雞松根當路龍筋瘦竹筍漫山鳯尾齊墨染深雲猶似瘴絲來小雨不成泥更無騎吹喧相逐散誕閒身信馬蹄重游南嶽焚香鎮南殿過銓徳觀醮注生祠庭觀道君玉符王七及八角玉印經方四寸許文日注生真君玉印雨中登山游南臺福嚴至瑞應擲鉢天柱諸峯之上寒甚病衰不至上封而返捨舟得馬如馭氣歩入青松三十里我從蠻嶺瘴煙來不怕雨雲埋嶽趾憶昔南征欵廟庭往來無恙神所祉當時巳有歸田願帝臨此心如白水煌煌南正館於東手握八觚温玉璽駿奔灊霍左右輔好生不殺扶炎紀崇禋竣事曉壇空躋攀小試青鞋底不知雲磴幾千丈但見漫山白龍尾石頭招我上南臺瑞應䦨干天半倚福嚴鐘聲過橋來彷彿三生如夢裏堂中尊者已先去苔鎻巖扉何日啓竹嫌磽确老逾瘦松畏髙寒蟠不起癯儒尚病怕深登幽討未窮行且止我評七十二髙峯鬱律穹窿少觀美儼然可瞻不可玩往往雄爭如負扆乃知嶽鎮盖深厚不與他山爭秀偉區區獻狀眩兒童乳洞淡巖真戲耳四明人董嶧久居嶽市乞詩祝融峯下兩逢春雨宿風餐老病身莫笑五湖萍梗客海邉亦有未歸人三月十五日華容湖尾看月出雲銷澧陽風月生岳陽水誰推赤金盤湧出白銀地徘徊忽騰上蹀蹀恐顛墜稍髙輪漸安飛彩到篷背晶晶浪皆舞靨靨星欲避兜羅世界網普現無邉際官居束户庭有眼如幻翳向非行大荒寧有此巨麗乗除較得失漂泊非左計妻孥競驩譁渠亦知許事釣池口阻風迷失港道囘風打船失西東柁癡㯭弱無適從三老號呼鐵纜墜招頭撾鼓驅魚龍千篙撑折百丈斷日暮稍與洪相通推移尋尺力千里時有黄㡌來言功康莊大逵世不乏乃獨蹇産濤波中一官横起險易相刹那憂喜隨兒童漲湖連天逺目斷且復加飯追萍蓬蒲團坐煖看香作止任滅如頑空鼎河口枕上作漂泊離巢燕彎跧負殻蝸瘦嫌莞席硬老覺畫屏奢報道帆當落傳呼鼔已撾且投人處宿未到已聞蟇安鄉縣西晩泊水濶鳥烏倦墟寒童僕飢一灣村縣過百折暮江遲曉夢孤燈見春隂病骨知簡書寧不畏旅力奈先疲澧陽江順流下沅江溯流上澧浦水深蘭芷寒漂揺憚風雨采采不盈掬何由寄逺渚洞庭浮天白遐矚莽呉楚有懷獨晤歎㯭聲與人語暮夜即維舟蒼茫定何許澧浦葦岸齊齊似碧城江船罨岸逆風行緑蘋白芷俱憔悴惟有蔞蒿滿意生澧江漁舎安鄉澧陽之間自兵火後瘡殘猶未復狡窟空來四十年沿江猶自少炊煙茫茫曠土無人問蘆荻春深緑滿川孫黄渡自此登陸至公安渡江過沙頭捨舟從陸更間闗徑仄仍荒亦未乾􅁄刺近人牢閉眼泥塗兀馬緊扶鞍茶山盜藪路程惡麥壠人家懷抱寛擔僕輿夫盡劬瘁病翁那得更加餐潺陵舟横攸河水馬滑潺陵道百里無鉏犁閒田生春草春草亦已瘦栖栖晩花少落日見行人愁煙没孤鳥老翁雪髯鬢生長識羣盜歸來四十年墟里迹如埽莫訝土毛稀須知人力槁生聚何當復兹事恐終老人言古戰場瘡痍猝難療誰使至此極天乎吾請禱將至公安前村後村啼杜宇伴人憂煎與人語雲寒日薄春一夢地濶天低淚如雨我馬虺隤我僕痡豈不懷歸畏簡書公安縣前酒可沽不如且聽提胡盧公安渡江食罷雨方作起行泥已深伴愁多楚些吟病獨呉音莫怨馬蹄滑須愁蠶事侵梅黄時節是未可決晴隂荆渚堤上原田何莓莓野水亂平楚大堤少人行誰與藝稷黍獨木且百嵗骯髒立水滸當年識兵燼見赦幾樵斧摩挲欲問訊恨汝不能語薄暮有底茫沙頭聽鳴㯭渚宫野步題芳草草色沐新雨緑潤如得意披拂欲生煙苒苒著巾袂天涯各芳春秦呉千萬里故人攀桂枝今夕念游子發荆州自此登舟至夷陵初上篷籠竹笮船始知身是劒南官沙頭沽酒市樓煖徑步買薪江墅寒自古秦呉稱絶國於今歸峽有名灘千山萬水垂垂老只欠天西蜀道難虎牙灘又名金門十二倍屬夷陵傾崖溜雨色慘淡水墨畫辛夷碎花縣瘣木老藤挂翠莽楚甸窮黄流蜀江下一灘今始嘗三峽此其亞雨㸃鼔士摻雲騰挽夫跨驚心度石林破眼見村舎牛眠草色裏犬吠竹林罅步頭可檥船安穏睡殘夜峽州至喜亭斷崖臥水口連岡抱城樓下有呉蜀客檣竿立滄洲雨後漲江急黄濁如潮溝時見出峽船鐃鼓噪中流適從稠灘來白狗連黄牛渦濆大如屋九死爭船頭人鮓尚脫免虎牙不須憂初入峽山效孟東野自此登陸至秭歸峽山偪而峻峽泉湍以碕峽草如毨毛峽樹多樛枝峽禽惟杜鵑血吻日夜啼峽馬類黄狗不能長鳴嘶峽曉虎跡多峽暮人跡稀峽路如登天猿鶴不敢梯僕夫負嵎哭我亦呻吟悲悲吟不成章聊賡峽哀詩土門汙泥汨峻阪狠石臥中路睥睨無敢前趦趄屢却顧長繩引籃輿前輓後推去吏士更叫號作氣欲飛度顛墜較分寸商略營蹞步須㬰氣亦竭一一汗如雨桃花舖老蕨漫山鳯尾張青楓直榦如攢槍山深嵐重鼻酸楚石惡淖深神慘傷隂崖風生吹客急草中枯株似人立昳晡卓幕先下程將士黄昏始相及覆盆嶺三登三降岡始斷一步一休日欲斜濁酒半瓶不得煖覆盆有舖無漿家小望州峯頭髙絶鄰四瞰若窺井小山萬蟻垤大山拊其頂叢霄一握近罡風振衣冷似聞天人語笑我雪垂領曩侍玉案香委佩太清境獨下赤城戲俯仰一枰頃豈其厭晨華嗅此腥腐鼎揮手謝天人伶俜愧孤影來償繭足債尚欠界天嶺老矣且勌游歸期行可請大望州望州山頭天四低東瞰夷陵西秭歸峽江微茫細如帶江外千峯青打圍黄牛廟磯石如劈想看驚湍虎鬚白水行陸走俱險艱安得如鳥有羽翼一百八盤疇昔辭桂林自謂已出嶺蛻蟬蠻煙中恍若醉夢醒今來峽山路步步躡雲頂仍聞蚯蚓瘴顧與嶠南等平生行路難驚浪兀漂梗迷塗兹益逺鳥道非人境老矣法當佚懷哉跡可屏拜手天東南亟上歸田請火墨坡下嶺清晨入岑蔚嵐重寒颼飀忽聞黄鸝語方悟麥始秋旅食法當瘦逺行人所愁况復深山中不與和氣游苦辛那敢憚病悴良可憂徒憂亦無益聊作商聲謳八場平聞猿清猿泠泠鳴玉簫三聲兩聲髙樹梢子母聯拳傳枝去忽作哀厲長鳴號天寒林深山石惡行人舉頭雙淚閣雪澗琴心未足悲須寫峽中腸斷時琴曲有雪澗聞猿鑽天三里非岡非嶺復非坡黄鵠不度吾經過妻孥下行啼且笑聯手相攜如踏歌風吹汗乾人力盡屐齒與石方相磨鑽天三里似千里四十八盤將奈何蛇倒退山前壁如削山後崖復斷曏吾達隴首如海到彼岸那知下嶺處慄甚履氷戰牽前帶相挽縋後衣盡綻健倒輒尋丈徐行厪分寸上疑縁竹竿下劇滚金彈豈惟蛇退舎飛鳥望崖反稍喜一徑平猶有千石亂仍逢新燒畬約畧似耕畔心知人境近顰末百憂散山民茒數把鬼質犢子健腰鑱走迎客再拜復三歎謂非人所蹊官來定何幹倘為飢火驅平地豈無飯意者官事迫如馬就羈絆我乃不能答付以一笑粲大了隘峽行五程無聚落馬頭今日逢耕鑿麥苗踈瘦豆苗稀椒葉尖新柘葉薄家家婦女布纒頭背負小兒領垂瘤山深生理却不乏人有銀釵一雙插石湖集巻十五欽定四庫全書石湖詩集巻十六宋范成大撰麻線堆峽口驛前大山崛起舊路攀援而上縈紆如線十五年前浮圖徳寶始沿澗伐木作新路不復登山余觀峽路皆未嘗經修感徳寶之事作麻線堆詩一首以風䕫路使者及歸峽二州長吏沈葉管熊四君雲木盪胸起鬱峩一峯危上有路千折縺縷如縈絲是為麻線堆厥險天下稀偪仄容半足顛墜寧復稽騰猱尚愁苦游子將安之浮屠徳寶者悲智緒等慈隨山刋古木尋壑得長磯輿梁㨗飛度布石綿階梯自從新路改重趼無齎咨縣有孫少府琬琰劖文詞勿云此事小惟有行人知况觀峽山路由來欠平治官吏既弗跡誰肯深長思天險固自若當令路成蹊土工運畚鍤石工操鑿椎烈火敗磽确築沙填隙巇多用百夫力逺無五旬期但冀米鹽給不煩金幣支非客敢竊議道傍詢旄倪身雖雪山戍亦願助毫釐工費嗟小哉政須賢有司東有管夷陵西有葉秭歸上維沈隠侯䕫臺今吏師下維熊繹孫長材佐州麾豈吾金閨彦不如林下緇懸知議克合了此一段竒舟檝避潢潦置郵疾飛馳憧憧呉蜀客來往當無時仍磨鑽天石大書四賢詩不佞願秉筆逺寄峽口碑戲書麻線堆下一身半世走奔波疑是三生宿債多折劵已饒麻綿嶺責償難免竹竿坡胡孫愁傾崖當胸石齧足失勢毛氂槗幽谷王孫却走斷不到惟有哀猿如鬼哭僕夫酸嘶訴塗窮我亦付命無何中悲風忽來木葉戰落日虎嗥枯竹叢判命坡鑽天嶺上已飛魂判命坡前更駭聞側足三分垂壞磴舉頭一握到孤雲微生敢列千金子後福猶幾萬石君蚤晩北窓尋噩夢故應含笑老榆枌千石嶺晨光挂髙嶺晴色媚逺客哀湍吼叢薄宿霧裊絶壁露重薊花紫風來蓬背白迷塗朴渥跳飲澗於莵跡層巔多折木迮磴有飛石不知山幾重杳杳入叢碧九盤坡布水莫惜縈迴上九盤洗心雙瀑雪花寒野翁酌水煎茶獻自古人來到此難荒口十步九喫蹶百夫半􅩚跚豁然鳥道窮努力造其巔謂是嶺頭了一峯復當前既無反顧法仰望心茫然四十八盤詰曲不前如宦拙欹傾當面似交難若將世路比山路世路更多千萬盤紫荷車峽山此藥甚多緑英吐弱線翠葉抱修莖矗如青旄節草中立亭亭根有却老藥鱗皺友松苓長生不暇學聊冀病身輕錦帶花東南甚珍此花峽中漫生山谷妍紅棠棣粧弱緑薔薇枝小風一再來飄颻隨舞衣呉下嫵芳檻峽中滿荒陂佳人墮空谷皎皎白駒詩入秭歸界山根繫馬得漿家罙入窮鄉事可嗟蚯蚓祟人能作瘴茱茰隨俗強煎茶幽禽不見但聞語野草無名都著花窈窕﨑嶇殊未艾去程方始問三巴蚤發周平驛過清烈祠下屈平祠也祠前有獨醒亭物色近人境喜歡嚴曉裝山月雞犬聲野風麻麥香登嶺既開豁入林更清凉三呼獨醒士倘肯釂我觴白狗峽陸路亦自峽上過西岸有玉虚洞江紋圎復破樹色昏還明連灘竹節稠洶怒奔夷陵石磯鐵色頑相望如姦朋踞岸意不佳當流勢尤獰山囘水若盡但見青竛竮慘慘疑鬼寰幽幽無人聲顛沛安危機艱難古今情俯窺得目眩却立恐神驚白雲冐巖扉下維玉虛庭神仙坐閱世應笑行人行秭歸縣周封楚子熊繹於此縣宇宋玉宅東山清烈祠屈原宅也永日貪程客長年弔古詩悲秋荒故宅負石慘空祠峻壁鴉翻倦髙畬麥秀遲窮山熊繹國偪仄建邦時歸州竹枝歌二首東鄰男兒得湘纍西舎女兒生漢妃城郭如村莫相笑人家代閱似渠稀東岸艬船抛石門西山炊煙連白雲竹籬茅舎作晚市青蓋黄旗稱使君昭君臺在興山界中鄉人憐昭君築臺望之下有香溪然三峽女子十人九癭天生尤物元無種萬里巴村出青塜髙臺望思臺已荒東風溪漲流水香嬋娟鍾美空萬古翻使鄉山多醜女炙眉作瘢亦不須人人有癭如瓠壺人鮓瓮在歸州郭下長石截然據江三之二水盛時濆淖極大號峽下最險處東岸即屈原宅自此復登舟至巫山懷沙祠下鐵色磯中流束湍張禍機與齎俱入彼可弔乗流而行吾亦危江河難犯一至此天地好生安取斯朝歌勝母古尚諱我其覆醢航秭歸巴東峽口水宿頻欹側徒行又險艱舟危神女峽馬瘦鬼門闗照夜燒畬隴縁雲種笮山催成頭雪白休說鬢絲斑初入巫峽鑽火巴東岸摐金峽口船束江崖欲合潄石水多漩卓午三竿日中間一罅天偉哉神禹跡疏鑿此山川將至巫山遇雨數日快時水落丈餘舟人方以為喜雨作即水又長矣峽行水落惟憂雨通昔淋浪怨行旅千山萬山生白煙陽臺那得雲如許牋詞騰告翠帷僊匄我一晴翻手間放開十二峯頭色重賦碧叢髙插天巫山髙并序余舊嘗用韓無咎韻題陳季陵巫山圗攷宋玉賦意辨髙唐之事甚詳今過陽臺之下復賦樂府一首世傳瑶姬為西王母女嘗佐禹治水廟中石刻在焉濕雲不收煙雨霏峽船作灘梢廟磯杜鵑無聲猿叫斷惟有飢鴉迎客飛西真功髙佐禹跡斧鑿鱗皴倚天壁上有瑶簪十二尖下有黄湍三百尺蔓花虯木風煙昏蘚珮翠帷香火寒靈斿飄忽定何許時有行人開廟門楚客詞章元是諷紛紛餘子空嘲弄玉色頩顔不可干人間錯說髙唐夢刺濆淖并序濆淖盤渦之大者峽江水壯則有之或大如一間屋相傳水行峽底遇暗石則濆起已而下旋為渦然亦未嘗有定處或無故突然而作叵測也舟行遇之小則欹傾大則與齎俱入險惡之名聞天下峽江饒暗石水狀日千變不愁灘瀧來但畏濆淖見人言盤渦耳夷險顧有間仍於非時作未可一理貫安行方熨縠無事忽翻練突如湯鼎沸翕作茶磨旋勢迫中成窪怒霽外始暈已定稍安慰儵作更驚眩漂漂浮沫起疑有濳鯨噀勃勃駭浪騰復恐蟄鼇抃篙師瞪禠魄灘户呀雨汗逡巡怯大敵勇往決鏖戰幸免與齎入還憂似蓬轉驚呼招竿折奔救竹笮斷九死船頭爭萬苦石上牽旁觀兢薄氷撇過㨗飛電前余叱馭來山險固嘗徧今者擊檝誓豈復憚波面澎澎三峽長颭颭一葦亂既微掬指忙又匪科頭慢天子賜之履江神敢吾玩但催叠鼔轟往助雙㯭健嘲峽石并序峽山江濱亂石萬狀極其醜怪不可形容舉非世間諸所有石之比走筆戲題且以紀異峽山狠無情其下多醜石頑質賈憎唾傀狀發笑啞粗類墳壤黄沉漬鐵矢黒或如溝泥涴或似凍壁坼堆疑聚廪粟陊若壊城甓槎牙鏤朽木狼籍委枯骼礧砢包蠃蚌淋漓錮鉛鍚縱文瓦溝壠横叠衣摺襞鱗皴斧鑿餘坎窞蹴踏力云何清淑氣孕此詭譎跡我本一丘壑嗜石舊成癖端溪紫琳腴洮河緑沉色階冊截肪膩泗磬鳴球擊嵌空太湖底偶立韶江側真陽劖千巖營道剷寸碧倦游所閱多未易一二籍朅來兹山下刺眼昔未覿或云峽多材竒秀鬱以積絶代昭君村驚世屈原宅東家兩兒女氣足豪萬國山石何重輕奚暇更融液我亦味其言作詩曉行客勞畬耕并序畬田峽中刀耕火種之地也春初斫山衆木盡蹶至當種時伺有雨候則前一夕火之藉其灰以糞明日雨作乗熱土下種即苖盛倍收無雨反是山多磽确地力薄則一再斫燒始可蓺春種麥豆作餅餌以度夏秋則粟熟矣官輸甚微巫山民以收粟三百斛為率財用三四斛了二稅食三物以終年雖平生不識秔稻而未嘗苦飢余因記呉中號多嘉榖而公私之輸顧重田家得粒食者無幾峽農之不若也作詩以勞之峽農生甚艱斫畬大山巔赤植無土膏三刀財一田頗具穴居智占雨先燎原雨來亟下種不爾生不蕃麥穗黄剪剪豆苖緑芊芊餅餌了長夏更遲秋粟繁稅畆不什一遺秉得饜餐何曽識秔稻捫腹嘗果然我知呉農事請為峽農言呉田黒壤腴呉米玉粒鮮長腰瓠犀瘦齊頭珠顆圎紅蓮勝彫胡香子馥秋蘭或收虞舜餘或自占城傳早秈與晚䆉濫吹甑甗間長腰米狹長亦名箭子齊頭白圎凈如珠紅蓮色微赤香子亦名九里香斗米入數合作飯芳香滿案舜王稻焦頭無鬚俗傳瞽瞍燒種以與之占城種來自海南䆉稏秈禾價最賤以上皆呉中米品也不辭春養禾但畏秋輸官姦吏大雀䑕盜胥衆螟蝝掠剰増釡區取盈折緍錢兩鍾致一斛未免催租瘢重以私債迫逃屋無炊煙晶晶雲子飯生世不下咽食者定游手種者長流涎不如峽農飽豆麥終殘年巫山縣自此復登陸至䕫門縣前掉石灘最險登岸以過舟謂之盤灘城樓對髙唐門此去瞿唐不百里縣人以郭西流石堆為水信流石没則灧澦如馬矣借馬巫山縣盤舟掉石灘梅肥朝雨細茶老暮煙寒門對髙唐起江從灧澦難流堆三尺在旅夢一枝安自巫山遵陸以避黒石諸灘大雨不可行泊驛中一日吏士自秭歸陸行者亦㑹巫山信是陽雲臺客行五日雲不開隂晴何嘗有朝暮夜雨少休明復來今朝水長不知數没盡山根蒼石堆東磯西磯盡如削大灘小灘俱若雷不知瞿唐復何似想見萬頃淙一盃袛今水劑已壯矣聞道陸程尤艱哉摩圍隘口石生角蹋颯坡前泥似醅眼前安得故園路江沙江草便青鞋燕子坡大山如牆缺小山如塜纍衆山直下看方知此峯危木末見䕫峽一溝盎春泥中有天下險造化真兒嬉峯頂不滿笑舟中鬢成絲登髙尚超覽况乃絶俗姿鬼門闗天作隴頭石闕人言要隔塵樊百年㑹須作鬼無事先穿鬼闗離巫山好晴午後入瞿唐闗憇髙齋半日一昨題詩訴苦霖果然連夜卷曽隂盡收行雨瑶姬賜不徇世情巫峽心喜鵲滿枝朝日淡哀猿何處宿雲深水門山徑髙齋外一枕清風屏萬金髙齋即杜詩所謂暝色延山徑髙齋次水門者灧澦堆灧澦之石誰劖鐫惡駭天下形眇然客行五月潦始漲但見匹馬浮黄湍時時吐沫作濆淖灂灂有聲如粥煎蜀江西來已無路鑿山作澮方成川瞿唐之口狹如帶乃欲納此江漫漫奔流下赴故偪仄汝更爭道當其前舟師欹傾落膽過石孽水禍吁難全山川丘陵皆地險惟此險絶餘難肩東坡筆端喙三尺願與作賦評嘲喧云非此石峽更怒臼頭忽作傾城妍我從巫山飛一棹歡喜偶脫蛟龍涎是非信否未暇詰且上髙齋清晝眠䕫州竹枝歌九首五月五日嵐氣開南門競船爭看來雲安酒濃麴米賤家家扶得醉人迴赤甲白鹽碧叢叢半山人家草木風榴花滿山紅似火荔子天凉未肯紅新城果園連瀼西枇杷壓枝杏子肥半青半黄朝出賣日午買鹽沽酒歸癭婦趂墟城裏來十十五五市南街行人莫笑女麤醜兒郎自與買銀釵白頭老媪篸紅花黒頭女娘三髻丫背上兒眠上山去採桑已閒當採茶百衲畬山青間紅粟莖成穗豆成叢東屯平田秔米軟不到貧人飯甑中白帝廟前無舊城荒山野草古今情只餘峽口一堆石恰似人心未肯平灧澦如樸瞿唐深魚復陣圗江水心大昌鹽船出巫峽十日泝流無信音當筵女兒歌竹枝一聲三疊客忘歸萬里橋邉有船到繡羅衣服生光輝雲安縣春暮子規少日斜紅鵠飛兩山多布水一島幾柴扉蚓吐無窮壤人行不斷磯巴陽昨夜雨灘上水先肥杜子美詩云涪萬無杜鵑雲安詩云終日子規啼今萬州界固不聞杜鵑而雲安已自少矣紅鵠飛時滿背純赤或云即黄鶴也峽中蚯蚓之盛無如雲安江濱濆壤戢戢無際又多大石岸有一石長里許者杜子美詩云禹功多斷石其實甚長兩山間雨後瀑泉樓千百處尤可觀萬州自此後登陸州號南浦郡晨炊維下巖晚酌檥南浦波心照州榜雲腳響衙鼓前山如屏牆得得正當户西江朝宗來循屏復東去此萬州形勢也惟親歴者當知此言之工官曹倚巖棲市井喚船渡瓦屋仄石磴猿啼聞人語剔核杏餘酸連枝茶賸苦窮鄉固瘠薄陋俗亦寒窶土人賣杏皆先剔其核取仁以為藥也土茶甚苦不簡枝葉雜苿萸煎之營營謀食艱寂寂懷甎訴昔聞吏隠名今識吏隠處横溪驛感懷行徧天涯與地隅筋骸那比十年初朱顔有酒且留住白髪無方能掃除未得歸田先作賦專攻種樹已成書祗今飛到南山下猶解清晨出荷鋤午夜登嶓山癉暑嚴夜裝乗凉躡危嶠猿依黒林號鬼閃青炬嘯驚鳥動危葉吟蟲滿荒草泉聲逺相隨山色近如杳夢猶風燈前身已雲木杪浮生固有役逺道何時了豈惟失寢興亦自倒昏曉恭惟天心仁頗議民力槁我懷漢制詔來尉蜀父老熙如春臺登沃若時雨膏須知簡書急勿厭蓐食蚤但勤筆力淬時助詩腸攪峽石鋪萬州至此山頂皆有長石如城壁亘數峯不斷峽山至是亦稍開廣間有稻田峯頭壁立偉天造萬雉石城如帶繞山骨鱗皴火種難山下流泉却宜稻新秧一稜緑茸茸茅花秋生雪揺風后皇嘉種不易熟野草何為攙嵗功蟠龍嶺自峽歸䕫萬至於梁山五郡間不知其幾嶺梁山之蟠龍峯門尤為髙峻然下嶺即有平陸吏皆相賀云夷陸至􅓃䏰複嶺苦絲亂初程尚勇往少日還委頓安得長劒揮盡剷疊嶂斷雖云北山愚聊快南冥運此意竟蕭索勞歌謾凄曼日日望平陸念念到彼岸人言束馬險但欠蟠龍峻摧頽強弩末閔勉焚舟戰譬如已償逋猶有未折劵山根治曉裝峯頂寄朝飯稍脫蚓瘴染還探虎窠翫性命乃可憂䈥力何足算嶺半塗有饅頭山以形得名其上多鷙獸土人謂之彪窠蟠龍瀑布自山頂漫汗淋漓分數道而下望之宛從天降當為城中布水第一銀漢來從左界天天風吹浪落蒼巔人間只見秋田潤喚作嶓龍洞裏泉峯門嶺遇雨泊梁山窮鄉誰與話悲酸駐馬看雲強自寛酒力無端妨宿病詩情不淺任塵官虎狼地僻炊煙晚風雨天低夏木寒行盡峯門千萬丈梁山鼔角報平安􅼝邡驛大雨暮雨連朝雨長亭又短亭今朝騎馬怕平日繫船聽竹葉垂頭碧秧苖滿意青農疇方可望客路敢遑寧墊江縣屬忠州青泥没髁僕頻驚黄漲平橋馬不行舊雨雲招新雨至髙田水入下田鳴百年心事終懷土一日身謀且望晴休入忠州爭米市暝鴉同宿墊江城巾子山又雨百日籃輿困跼跧三晨泥坂兀躋攀晚晴幸自墊江縣今雨奈何巾子山樹色於人殊漠漠雲容憐我稍班班如今只憶雪溪句乗興而來興盡還鄰山縣山頂嘘雲黒似煙修篁髙栁共昏然鳥啼一夜勸歸去誰道東川無杜䳌没水鋪晚晴月出曉復大雨上漏下濕不堪其憂晚色熹微暖似薫兒童歡喜走相聞無端星月照濕土依舊山川生雨雲呉諺曰星月照濕土明朝依舊雨盖雨後微晴星月粲然必復雨占之每驗旅枕夢寒涔屋漏征衫潮潤冷鑪薫快晴信是行人願又恐田家暴背耘金山嶺阪峻身頻偃崖深首屢囘雲浮平地出路拂半天來但閱闗山過都忘嵗月催湘南初上馬猶插蚤春梅明日至隣水又雨昨日方無雨今朝又不晴滿山皆屐齒隨處有泉聲頗怪隂霖差應催老病成泥塗千騎士與我共勞生殘夜上峯頂上片月挂髙嶺我行至其巔舉手欲攬擷恐驚垂鸞仙菲菲桂香動肅肅露脚寒北斗已到地南斗猶闌干但聞浮黎音來從始青天大星與之俱曉色明旗旛素煙渺陸海中有人所寰想見地上友咨明膏火煎星落玉宇白日生綺霞丹氷輪未肯去相看尚團團望鄉臺千山已盡一峯孤立馬行人莫疾驅從此蜀川平似掌更無髙處望東呉蚤晴發廣安軍晚宿萍池村莊夜雨洗煩蒸曉風薦清穆雲頭隤鐵山日脚迸金瀑暑塗一日凉逺客萬事足羈人正奔波觀者何陸續翠盖立嚴粧青裠行跣足俗陋介南徼物華入東蜀竹萌苦已青荔子酸猶緑修蘆密成籬直柏森似纛泥乾馬蹄鬆路坦亭堠速暮投何人莊窓户暗修竹巴蜀人好食生蒜臭不可近頃在嶠南其人好食檳榔合蠣灰扶留藤一名蔞藤食之輒昏然已而醒快三物合和唾如膿血可厭今來蜀道又為食蒜者所薰戲題旅食諳殊俗堆盤駭異聞南飡灰薦蠣巴饌菜先葷幸脫蔞藤醉還遭葫蒜薰絲蓴鄉味好歸夢水連雲嘉陵江過合州漢初縣下井徑東川縣山河古合州木根挈斷岸急雨沸中流闗下嘉陵水沙頭杜老舟江花應好在無計㑹江樓新晴行郪水上與涪江相近塗泥初乾雨不落日色未出暑光薄畏途得晴天復凉真是腰錢更騎鶴渾渾郪水流未平悄悄涪江如鏡清過盡江沙穿麥壠忽有青蜩扶葉鳴小溪縣屬遂寧刈麥千平壠横槎一小溪梓花紅綻碎粟穗緑垂低村婦猶多跣山猿遂少啼東川雉已過錦里尚雲西茸山道中感懷侍臣筆槖舊西班大將麾幢又百蠻挂席南箕宿昔事閃旗東井何時還日増衰病復一日山隔舊游知幾山倦拂盤陀蒼石坐歸心聊與石俱頑曉發飛鳥晨霞滿天少頃大雨呉諺云朝霞不出門暮霞行千里驗之信然戲紀其事朝霞不出門暮霞行千里今晨日未出曉氣散如綺心疑雨再作眼轉雲四起我豈知天道呉農諺云爾古來占滂沲說者類恢恑飛雲走羣羊停雲俗三豨月當天畢宿風自少女起爛石燒成香汗濋潤如洗逐婦鳩能拙穴居狸有智蜉蝣強知時蜥蝪與聞計垤鳴東山觀堂審南柯蟻或加隂石鞭或議陽門閉或云逄庚變或自換甲始刑鵞與象龍聚訟非一理不如老農諺響應㨗如鬼哦詩敢夸博聊用醒午睡遂寧府始見平川喜成短歌峽之西遂之東更無平地二千里惟有髙山三萬重不知誰人鑿混沌獨此劖結何其工我本江呉弄水月忽來踏徧西南峯不知塵界在何許但怪星辰浮半空直疑飛入蝶夢境此豈應有人行蹤今朝平逺見城郭云是東川軍府雄原田坦若看掌上沙路淨如行鏡中芋區粟壠潤含雨楮林竹徑凉生風將士驩呼馬蹄快康莊直與錦里通半年﨑嶇得夷路一笑未暇憐飄蓬石湖集巻十六欽定四庫全書石湖詩集巻十七宋范成大撰九月十九日衙散囘留大將及幕屬飲清心堂觀晚菊分韻得譟暮字暮字作樂府甲光射層雲雨脚不敢到西山明古雪秋日一竿照先偏井絡密後拒參旗掉分弓滴博平鳴劒伊吾小君看天山箭狐兎何足了開邉吾豈敢自治有餘巧歸來翠帷巻聊共黄花笑雖無落㡌風亦復接䍦倒餘閒校筆陣刻燭龍蛇埽毛錐乃更勇我亦鼓旗譟冬至日銅壺閣落成走徧人間行路難異鄉風物雜悲歡三年北户梅邉暖萬里西樓雪外寒已辦鬢霜供嵗籥仍􅂸髀肉了征鞍故園雲物知何似試上東樓直北看十二月十八日海雲賞山茶追趂新晴管物華馬蹄鬆快㡌檐斜天南臘盡風晞雪氷下春來水潄沙已報主林催市栁仍從掌故問山茶豐年自是驩聲沸更著牙前畫鼔撾雨後東郭排岸司申梅開方及三分戲書小絶令一面開燕雨入南枝玉蘂皴合江雲冷凍芳塵司花好事相邀勒不著笙歌不肯春鞭春微雨旛勝絲絲雨笙歌步步塵一年新樂事萬里未歸人雲薄竟慳雪酒濃先受春送寒東作近慚愧耦耕身緑萼梅朝罷東皇放玉鸞霜羅薄袖緑裙單貪看修竹忘歸路不管人間日暮寒玉茗花折得瑶華付與誰人間鉛粉弄粧遲直須逺寄驂鸞客鬢脚飄飄可一枝張正字母夫人朱氏挽詞蘋藻儀邦媛詩書了嵗華籯金寧遺子羣玉竟傳家厚施心無斁浮生自有涯空餘報恩子三載亦苴麻十二月二十四日西樓觀雪一夜珠簾不下鈎徹明隨雪上西樓瑶池萬頃崑崙近玉壘千峯滴博收已報春迴南畆潤從教寒勒北枝愁四筵都為豐年醉録事何須校酒籌丙申元日安福寺禮塔成都一嵗故事始於此士女大集拜塔下然香挂旛以攘兵火之災嶺梅蜀栁笑人忙嵗嵗椒盤各異方耳畔逢人無魯語蜀人鄉音極難解其為京洛音輒謂之虜語或是僣偽時以中國自居循習至今不改也既又諱之改作魯語尤可笑姑就用其字鬢邉隨我是呉霜新年後飲屠蘇酒故事先然窣堵香石筍新街好行樂與民同處且逢場余新甃石筍街初三日出東郊碑樓院故事祭東君因宴此院蜀人皆以是日拜埽逺栁新晴暝紫煙小江吹凍舞清漣紅塵一鬨人歸後跕跕飢鳶蹙紙錢郊外閱驍騎剪栁亦曰槎栁千騎同瞻白羽揮驚塵一鬨響金鞿不知掣電彎弓過但覺栁梢隨箭飛初四日東郊觀麥苖去嵗秋霖麥下遲臘殘一雪潤無泥相將飽喫滹沱飯來聽林間快活啼櫻桃花借煖衝寒不用媒勻朱勻粉最先來玉梅一見憐癡小教向傍邉自在開再出東郊晚景増年慣官身作客諳大都縁偶熟豈是性能堪昔者開三徑他時老一龕越溪親種竹芸緑想毿毿三月二日北門馬上新街如拭過鳴騶芍藥酴醿競滿頭十里珠簾都捲上少城風物似揚州上巳前一日學射山萬嵗池故事北郊征路記前囘三尺驚塵馬踏開新漲忽明多病眼好風如把及時盃青黄麥壠平平去疎密榿林整整來游騎不知都幾許長堤十里轉輕雷上巳日萬嵗池上呈程詠之提刑濃春酒煖絳煙霏漲水天平雪浪遲緑岸翻鷗如北渚紅塵躍馬似西池麥苗剪剪嘗新麫梅子雙雙帶折枝試比長安水邉景祗無飢客為題詩新作景亭程詠之提刑賦詩次其韻二首飛鴻銜子謾紛紛萬里西游始識真不管呉霜微㸃鬢來看蜀錦爛爭春倚闌定有司花女秉燭仍留主夜神異日賞心誰與共故人新作坐中賓小築聊鋤草棘荒游人錯比召南棠花邉霧鬢風鬟滿酒畔雲衣月扇香燦爛吟牋煩索句淋漓醉墨自成行報章遲鈍吾衰矣終日冥捜謾七襄錦亭然燭觀海棠銀燭光中萬綺霞醉紅堆上缺蟾斜從今勝絶西園夜壓盡錦官城裏花寶相花誰把柔條夾砌栽壓枝萬朶一時開為君也著詩收拾題作西樓錦被堆三月二十三日海雲摸石勸耕亭上往來頻四海萍浮老病身亂插山茶猶昨夢重尋池石已殘春驚心嵗月東流水過眼人情一鬨塵賴有貽牟堪飽飯道逢田畯且眉伸四月十日出郊約束南風徹曉忙收雲捲雨一川凉漲江混混無聲緑熟麥騷騷有意黄吏卒逺時間信馬田園佳處忽思鄉鄰翁萬里應相念春晚不歸同插秧納凉雨洗新秋夜氣清悴肌無汗葛衣輕畫檐分月下西壁絡緯飛來庭樹鳴西樓獨上竹日駐微暑松風生蚤秋閒尋來處路獨倚靜中樓老景驅雙轂鄉心挽萬牛相隨木上坐脚底亦雲浮曉詣三井觀路轉市聲逺寛閒古城東適從紅塵來忽入蒼煙叢槿心傾穠露芋葉翻微風秋陽澹籬落殘暑不必攻野老熟睡起日髙首如蓬官身騎官馬君應笑龍鍾曉起黠䑕縁鈴索飢鴉啄井欄不眠秋漏近多病曉屏寒咄咄渠何怪休休我自闌牙門朝日上簫鼔報平安舫齋晚憩心作萬縁起境生千劫忙誰同油幕靜獨對篆煙長有盡天魔力無窮海印光雨餘弦月上塵界本清凉秋雨快晴靜勝堂席上一笑憧憧鴈鶩行簿書堆裏賦秋陽心如墜絮沾泥懶身似飛泉激石忙雨後蹲鴟先稻熟霜前浮蟻鬭棖香天涯節物遮愁眼且復隨鄉便入鄉新凉夜坐吏退焚香百慮空靜聞蟲響度簾櫳江頭一尺稻花雨窓外三更蕉葉風日日老添明鏡裏家家凉入短檠中簡編燈火平生事雪白眵昏奈此翁秋老四境雨已沛然晚坐籌邉樓方議祈晴樓下忽有東界農民數十人訴山田却要雨須長吏致禱感之作詩嵗晚羈懷有所思秋來病骨最先知鏡中公案已甘老紙上課程休諱癡西堰頗聞江漲急東山猶說雨來遲錦城樂事知多少憂旱憂霖蹙盡眉西樓夜坐抗塵懷抱若為寛繞屋蛙聲亦在官巖桂無香秋遂晚江鱸有約嵗將寒文書散亂嘲癡絶燈火凄清語夜闌病倦百骸非復我但思禪板與蒲團立秋月夜已放新凉入簟紋更驅餘溽避爐薰穿雲竹月時時見咽露莎蛩院院聞稍喜雪山無斥堠但虞煙驛有移文行藏且付蘧蘧夢明發還親鴈鶩羣前堂觀月箕踞繩牀政自豪逺游何暇續離騷蕭森萬竹秋逾瘦突兀雙楠夜更髙東郭風喧三鼓市西城石洶二江濤色塵聲界如如現本自無禪不用逃有懷石湖舊隠浩蕩沙鷗久倦飛摧頽櫪馬不勝鞿官中風月常虛度夢裏闗山或暫歸橘社十年霜欲飽鱸江一雨水應肥冷雲著地塘蒲晚誰為披蓑煖釣磯太平瑞聖花雪外捫參嶺煙中濯錦洲密攅文杏蘂髙結綵雲毬百世嘉名重三登瑞氣浮挽春同住夏看到火西流無題聞道明朝送舊官無情更鼔夜將闌此生見面知何日忍淚須㬰子細看晁子西寄詩謝酒自言其家數有逝者詞意悲甚次韻解之且以建茶同往我讀晁子詩十語九慨傷長川日夜逝鬢髮空蒼浪君家出世學無生亦無亡鄉謂法幢立何乃槁木僵起滅不滿笑古來共楸行豈其揑目華解翳海印光我酒愧薄薄未能煖愁腸申以春風芽一瀹萬慮忘慧刀倘未割㑹且掀禪牀錦里有逢迎謹避舎盖堂居然足音跫好在故意長啁耳念一洗遲君鳯鳴岡蚤衰不寐官事拘攣似力田作勞歸晚意茫然按摩合體俱非我展轉通宵似逺年一叟披衣惟兀坐羣兒得枕便佳眠人生元是華胥客休向迷塗更著鞭晚步宣華舊苑喬木如山廢苑西古溝疎水靜鳴池吏兵窸窣番更後樓閣崔嵬欲暝時有露冷螢猶照草無風驚雀自遷枝歸來更了塵書債目眚昏花燭穗垂西樓秋晚樓前處處長秋苔俛仰璿杓又欲囘殘暑已隨梁燕去小春應為海棠來客愁天逺詩無託吏案山横睡有媒晴日滿窓鳬鶩散巴童來按鴨爐灰明日分弓亭按閱再用西樓韻眼看白露㸃蒼苔嵗月飛流首屢囘老去讀書隨忘却醉中得句若飛來聞雞午夜猶能舞射雉西郊不用媒自笑支離聊復爾丹心元未十分灰丁酉重九藥市呈坐客余於南北西三方皆走萬里皆遇重九每作水調一闋燕山首句云萬里漢家使桂林云萬里漢都䕶成都云萬里橋邉客今嵗倦游甚矣不復更和前曲乃作此詩以自戲莫向登臨怨落暉自縁羈宦阻歸期年來厭把三邉酒此去休哦萬里詩烏㡌不辭欹短髮黄花終是欠東籬若無合坐揮毫健誰解西風楚客悲㑹慶節大慈寺茶酒霜暉催曉五雲鮮萬國歡呼共一天澹澹煖紅旗轉日浮浮寒碧瓦收煙銜盃樂聖千秋節撃鼔迎冬大有年忽憶捧觴供玉座不知身在雪山邉冬至日天慶觀朝拜雲日晴麗遥想郊禋慶成作驩喜口號浙浙霜風不滿旗紫煙黄氣捧朝曦五更貫索埋光後萬里鈎陳放仗時留滯周南無舊事布宣漢徳有新詩豐年四海皆温飽願把歡心壽玉巵十一月十日海雲賞山茶門巷歡呼十里村臘前風物已知春兩年池上經行處萬里天邉未去人客鬢花身俱嵗晚粧光酒色且時新海雲橋下溪如鏡休把冠巾照路塵海雲囘按驍騎於城北原時有吐番出没大渡河上古道風沙捲夕霏小江煙浪皺春漪天於麥壠猶慳雪人向梅梢大欠詩頓轡青驪飛脫兎離弦白羽嘯寒鴟牙門列校俱剽銳檄與河邉秃髪知合江亭隔江望瑶林莊梅盛開過江訪之馬上哦此何處春能蚤疎籬限激湍竹間煙雪迥馬上晚香寒喚渡聊相覓巡檐得細看極知微雨意未許日烘殘新作官梅莊移植大梅數十本繞之臘前催喚主林神玉樹飛來不動塵契濶西湖慚處士飄零東閣似詩人一天午夢空花碎滿地春愁月影新埽淨宣華藜藋逕他年誰記石湖濱丁酉正月二日東郊故事椒盤宿酒未全醒擾擾金鞍逐畫軿麥雨一犂隨處緑栁煙千縷幾時青客愁舊嵗連新嵗歸路長亭間短亭萬里松楸雙淚墮風前安得諱飄零二月二十七日病後始能扶頭複幕重簾苦見遮暮占栖雀曉占鴉殘燈煑藥看成老細雨鳴鳩過盡花心為蚤衰元自化髪從無病已先華更䝉厲鬼相提唱此去山林屬當家病中聞西園新花已茂及竹逕皆成而海棠亦未過梅塢桃蹊斫竹初三旬髙臥信音疎春雖與病無交渉雨莫將花便破除祗合蘧蘧隨夢去何須咄咄向空書頗聞蜀錦猶相待去嵗今朝已雪如枕上一枕經春似宿酲三衾投曉尚凄清殘更未盡鴉先起虚幌無聲鼠自驚久病厭聞銅鼎沸不眠惟望紙窓明摧頽豈是功名具燒藥爐邉過此生初履地扶頭今日強冠篸餘燼收從百戰酣長脛閣軀如瘐鶴衝風奪氣似枯柟客來慵抆懶殘涕老去定同彌勒龕何處更能容結習任教花雨落毿毿密室憊坐如許頭顱莫振矜但尋曲几與枯藤餘生不直一彈指此病寧論三折肱何處丹房癡候火誰家籌室強傳燈本來識字耕夫耳今嵗仍添百不能春晚初出西樓試倚枯藤似籋雲堂階微步小逡巡忽逢巖桂新抽葉屈指黄紬睡一春春晚臥病故事都廢聞西門種栁已成而燕宫海棠亦爛漫矣軒窓深窈似禪房竟日虚明裊斷香詩債無邉春已老睡魔有約晝初長市橋煙雨應官栁墟苑池臺自海棠游騎行歌莫相笑遨頭六結已龜藏病起初見賓僚時上疏匄祠未報浪將冠服衣猿狙因病偷閒稍自如時有好懷誇得句畧無情語怕囘書邉城晏閉稀傳箭村巷春游未荷鋤迨此良辰公事少天恩倘許賦歸歟陸務觀云春初多雨近方晴碧雞坊海棠全未及去年遲日温風䕶海棠十分顔色醉春粧天公已許晴教好說與鳴鳩一任忙報事碧雞坊裏來今年花少似前囘笙簧冷落遨頭病不著梁州打不開清明日試新火作牡丹㑹蜀人以洛中千葉種為京花單葉為川花再鑽巴火尚浮家去國年多客路賖那得青煙穿御栁且將銀燭照京花香鬟半醉斜枝重病眼全昏瘴霧遮錦地繡天春不散任教檐雨捲泥沙三月十九日夜極冷誰勒餘寒不放囘春深猶煖地爐灰鄉心忽向燈前動夜雨先從竹裏來鶗鴂已如鶯百囀酴醿那得雪千堆調糜煑藥東風老慚愧茶甌與酒盃垂絲海棠春工葉葉與絲絲怕日嫌風不自持曉鏡為誰粧未辦沁㾗猶有淚臙脂浣花戲題爭標者凌波一劇便捐生得失何曽較重輕蝸角虚名人尚愛錦標安得笑渠爭鹿鳴宴岷峨鍾秀蜀多珍坐上儒先更逸羣墨沼不憂經覆瓿琴臺重有賦凌雲文章小技聊干禄道學初心擬致君富貴功名今發軔願看稽古䇿髙勲陸務觀作春愁曲悲甚作詩反之東風本是繁華主天地元無著愁處詩人多事惹閒情閉門自造愁如許病翁老矣癡復頑風前一笑春無邉糟牀夜鳴如落泉一杯正與人相闗種竹了題愛山亭灑埽宣華舎此君煙中月下緑生塵他年葉葉清風滿莫忘今年借宅人題錦亭手開花徑錦成窠浩蕩春風載酒過來嵗游人應解笑甘棠終少海棠多石湖詩集巻十七欽定四庫全書石湖詩集巻十八宋范成大撰初發太城留别田父西蜀夏旱未行前數日連得兩父老云今嵗又熟矣秋苖五月未入土行人欲行心更苦路逢田翁有好語競說宿來三尺雨行人雖去亦伸眉翁皆好住莫相思流渠湯湯聲滿野今年醉飽雞豚社入崇寧界桑間三宿尚囘頭何况三年濯錦游草草郫筒中酒處不知身已在彭州懷古亭在永康離堆之上離堆分岷江水一派溉彭蜀而支流道郫縣以入於府江朝來冩得故人書雙鯉難尋鴈亦無付與離堆江水去解從郫縣到成都離堆行沿江有兩崖中斷相傳秦李太守鑿此以分江水又傳李鎖孽龍於潭中今有伏龍觀在潭上蜀旱支江水涸即遣官致祭壅都江水以自足謂之攝水無不應民祭賽者率以羊嵗殺四五萬計殘山狠石雙虎臥斧迹鱗皴中鑿破潭淵油油無敢唾下有猛龍跧鐵鎖自從分流注石門西州秔稻如黄雲刲羊五萬大作社春秋伐鼔蒼煙根我昔官稱勸農使年年來激西江水成都火米不論錢絲管相隨看蠶市欵門得得酹清尊椒漿桂酒刪羶葷妄欲一語神豈聞更願愛羊如愛人崇徳廟李太守廟食處也雪山南風融雪汁化作岷江江水來不知新漲髙幾畫離堆石壁舊有水則記漲㾗占嵗事一畫為一則但覺樓前奔萬雷天教此水入中國兩山辟易分道開我家長川到海處却在發源傳酒杯人生幾屐辦此役逺游如許神應咍東歸短棹昨已具明日發船撾鼔催灘平放溜日千里已夢鱠鱸如雪堆丹楓繫纜一囘首玉壘浮雲安在哉戲題索橋織簟勻鋪面排繩強架空染人髙曬帛獵户逺張罿薄薄難承雨翻翻不受風何時將蜀客東下看垂虹青城山㑹慶建福宫宫舊名丈人觀予為請於朝賜今名入山前數日勅書至自行在予就設醮以祝聖人夀云墨詔東來洶驛傳璇題金榜照山川祥開聖代千秋節響動仙都九室天觸石湧雲埋紫邏流金飛火燭蒼巔祗應老宅龎眉客長記新宫錫號年老宅即老人村也舊名潦澤疑傳之誤余為更此名再題青城山萬里清游不暇慵雙旌換得一枝笻來從井絡直西路上到江源第一峯海内閒身輸我佚山中佳氣為人濃題詩試刻巖前石付與他年蘚暈重玉華樓夜醮青城觀殿前大樓制作瑰麗初夜有火炬出殿後峯上羽衣云數年前曽一現已而如有風吹滅之比同行諸官至則無見矣予黙禱云此燈果為我來者當再明使衆共觀之語訖復現丈人峯前山四周中有五城十二樓玉華仙宫居上頭紫雲澒洞千柱浮剛風八面寒颼飀靈君宴坐三千秋蹻符飛行戲元洲下睨濁世悲蜉蝣桂旗偃蹇澹少休知我萬里遥相投暗蜩奏樂鏘鳴球浮黎空歌清夜遒參旗如虹歘下流化為神燈燭巖幽火鈴洞赤凌空斿誰歟蔽虧黯然收禱之復然為我留半生縛塵鷹在鞲豈有骨相肩浮丘山英發光洗羈愁行迷未逺夫何尤笙簫上雲神欲游揖我從之驂素虬上清宫自青城登山所謂最髙峯也歴井捫參興未闌丹梯通處更躋攀冥濛蜀道一雲氣破碎岷山千髻鬟但覺星辰垂地上不知風雨滿人間蝸牛兩角猶如夢更說紛紛觸與蠻最髙峯望雪山大面峯頭六月寒神燈收罷曉雲班浮空忽湧三銀闕云是西天雪嶺山范氏莊園夕陽塵土漲郊墟六六峯頭夢覺餘竹色喚人來下馬亂蟬深處有圗書青城縣何子方使君同年園池榿塍芋壠意中行浩蕩薫風不計程雨脚背人歸玉壘江聲隨馬入青城五橋今日新知路千佛當年舊綴名水竹光中同一笑丏君荷露濯塵纓何同年書院有丹竈甚雅竹色侵晚帙泉聲潄嵌根試通丹竈路應到老人村江源縣張季長正字家善頌堂季長盡出先世所藏圖書壁有趙清獻公為令時題名是日食新米坐中皆贊喜夏初嘗大旱也我窮江源來名勝頗追逐薰風秀沃野在處得竒矚頌堂有佳士文字照縑竹圗書抱世守古錦韜玉軸黄金不滿籯故國有喬木逡巡酒如澠霍霍具水陸田頭新榖升一飯香滿屋囘思閔雨時敢望遽炊玉摩挲壁間題明府遂州牧山髙江水長百世照尸祝我來坐琴壇琴壇在成都西園清獻公彈琴宴坐處靦汗媿前躅空餘煙霞痼未許是公獨請歌青城游或附耆舊録蜀州西湖荷花正盛開水月登舟亭也湖隂亭外别有白蓮尤竒蜀中無菱至此始見之閒隨渠水來偶到湖光裏仍呼水月舟徑度雲錦地誰云不解飲我已荷香醉湖隂玉嬋姢夐立紅粧外何須東閣梅悠然自詩思驚風入午暑水竹有秋意采菱不盈掬興與蓴鱸㑹遥知新津宿魂夢亦清麗新津道中雨後郊原淨村村各好音宿雲浮竹色清溜走榿隂曲沼擎青盖新畦藝緑針江天空濶處不受暑光侵次韻陸務觀編修新津遇雨不得登修覺山徑過眉州三絶新津館舎上漏下濕送客皆不堪憂修覺一望人云可見劒門杜子美所謂西川供客眼處眉山城中悉是汙池送客多情難語離僕夫無情車載脂平生飄泊知何限少似新津風雨時離合紛紛怕逺游逺游仍怕賦登樓何須一望三千里望盡西州轉更愁雨後蟇頤山色開玻瓈江清已可杯緑荷紅芰香四合又入芙蓉城裏來中巖去眉州一程諾詎羅尊者道塲相傳昔有天台僧遇病僧與之木鑰匙云異時至眉州中巖扣石筍當再相見後果然今三石屹立如樓觀前兩樓純紫石中一樓蘿蔓被之傍有寶瓶峯甚端正山半有喚魚潭慈姥龍所居世傳鴈蕩大小龍湫亦諾詎羅道塲豈化人往來無常處耶赤巖倚竛竮翠邏森戍削岑蔚嵐氣重稀間暑光薄聊尋大士處往扣洞門鑰雙撐紫玉闗中矗翠雲幄應供華藏海歸坐寶樓閣無法可示人但見雨花落不知龍湫勝何似魚潭樂夜深山四來人靜天一握驚看松桂白月影到林壑門前六月江世界塵漠漠寶瓶有甘露一滴洗煩濁捫天援斗杓請為諸君酌慈姥巖與送客酌别風雨大至凉甚諸賢用中巖韻各賦餞行詩紛然擘牋清飲終日雖無絲竹管絃而情味有餘山靈知我厭塵土喚起蟄雷鏖午暑松風無力雨絲長散作毿毿雪塵舞巖前懸溜珠簾傾安得吹來添玉觥詩成酒盡腸亦斷休喚佳人唱渭城次韻陸務觀慈姥巖酌别二絶送我彌旬未忍囘可憐蕭索把離杯不辭更宿中巖下投老餘年豈再來明朝真是送人行從此闗山隔故情道義不磨雙鯉在蜀江流水貫呉城次韻代答劉文潛司業二絶平羌江上首空囘慈姥巖前定把杯縱使石腸都忘却也應風雨送愁來囘廊月下短歌行惟有知音解有情一曲紅窓聲裏怨如今分作兩愁城玻瓈江一首戲效陸務觀作玻瓈江頭春渌深别時沄沄流到今祗言日逺易排遣不道相思翻苦心烏頭可白我可去菖花易青君易尋人生若未免離别不如碌碌無知音余與陸務觀自聖政所分袂每别輒五年離合又常以六月似有數者中巖送别至揮淚失聲留此為贈宦途流轉幾沉浮雞黍何年共一丘動輒五年遲逺信常於三伏話羈愁月生後夜天應老淚落中巖水不流一語相開仍自解除書聞已趣刀頭萬景樓在漢嘉城中山上登覽勝絶殆冠西州予令畫工作圗以歸山谷來游時但有安樂園未有此樓也左披九頂雲右送大峨月殘山剰水不知數一一當樓供勝絶玻瓈濯錦遥相通指麾大渡來朝宗川靈胥命各東去我亦順流呼短篷詩無傑語慚風物賴有丹青傳小筆仍添書客倚闌看令與山川相暎發龍彎歸路繞烏尤棟雲簾雨邀人留若為喚得涪翁起題作西南第一樓凌雲九頂即大石佛處初登山時巖壁上悉劖為小佛不知其數山前佛頭灘受雅江之衝最為艱險聊為東坡載酒游萬龕迎我到峯頭江揺九頂風雷過雲抹三峨日夜浮古佛臨流都坐斷行人識路亦歸休酣酣午枕眠方丈一笑閒身始自由戲題方響洞漢嘉廣福院中水洞有聲琅然莫知其所在舊名丁東水山谷易今名且題詩云古人名此丁東水自古丁東直至今我為改為方響洞要知山水有清音隔凡氷澗不可越衆真微步壺中月徙倚含風玉珮聲何須聽作㽔賓鐵問月堂酌别半明燈火話悲酸此㑹情知後㑹難四海宦游多聚散一生情事足悲歡鬢絲今夜不多黑酒量徹明無數寛醉夢登舟都不記但聞風雨滿江寒别後寄題漢嘉月榭陸務觀所作同年謂王子蒼萬景嘉州酒名湖亭明月湖也在州治前方作旗亭月榭正直大峨取太白峨眉山月之語以名傍有一巖景趣尤佳子蒼欲作樓未果隱吏詩情卜築幽同年惜别勸淹留試傾萬景湖亭酒來看半輪江月秋川路雖長猶共此夜船空載且歸休碧巖勝處頻囘首好事誰能更小樓過燕渡望大峨有白氣如層樓拔起叢雲中圍野千山暑氣昏大峨煙靄亦繽紛玉峯忽起三千丈應是兜羅世界雲蘇稽鎮客舎送客都囘我獨前何人開此竹間軒灘聲悲壯夜蟬咽併入小窓供不眠峨眉縣縣出符文布婦女人人績麻且行且觀田家束蒿然於門口為香氣以迎客窮鄉未省識旌旄雞犬歡呼巷陌騷村媪聚觀行績布野翁迎拜跽然蒿泉清土沃稻芒蚤縣古林深槐癭髙珍重里儒來獻頌盛言千載此丘遭初入大峨煙霞沉痼不須醫此去真同汗漫期曽欵上清臨大面仍從太白問峨眉山中縁法如今熟世上功名自古癡賸作畫圗歸挂壁他年猶欲臥游之華巖寺衆峯攅壁立中有路一綫攀援白雲梯食頃已天半我本紫芝曲誤落青芻棧向來脫新羈恍已還舊觀花煙辭少城暑雪對大面來從太白西更走三峨徧風生兩腋輕泉吼四山眩今晨第一程莫歎輿僕倦中峯有普賢閣背倚白崖峯餘七十峯共環之茂真尊者舊菴在峯下其傍一峯最秀號呼應孫思邈所往來傳云茂真與孫常相呼而應故名凌髙蹋危峯斗下頫幽谷仙英馥椒蘭嘉䕃矗旄纛空翠元不雨洩雲自膏沐暑綌森有稜瘁肌凄欲粟白崖如負依金界奠蒼麓衆峯拱二八娟妙繞重屋真人與尊者幽居接松竹呼之倘肯應留我試餐玉雙溪在白水寺前兩溪各自一山來齊出橋下前行入林數十步合為一水洄向深潭以入寶現溪僧云此景猶在廬山三峽鴈蕩龍湫之上溪中舊常有兩石子鬭日照溪中常有五色光相冷風騷騷木葉低洞淵阻深生怪竒碧琳雙澗黒無底中有玉龍相對飛雷轟雪捲入林樾化為一龍潭底没摩尼鬭罷四山空時有寶光巖下發寶現溪雙溪合而一既出巖竇散為此溪叢語三藏自西域歸過溪見兩石子鬭攬得其一今藏黑水寺石上有一目端正透底溪以此得名粲粲罨畫沙粼粼麴塵水朝陽相發揮光景艷孔翠寧聞雙溪號但見縠紋細神魚不謀食終日印潭底躍珠本具眼聊共阿師戲收藏更傳寶一笑落第二㸃心山在白水寺後自此登峯頂入山窘宿雨上山賀朝霽跬步便歴險轉盼已呀氣豈惟膝㸃心固已頭搶地游人貪勝踐姑吟蜀道易大扶􅐝身如魚躍上長竿路似鏡中相對看珍重山丁扶我過人間踽踽獨行難小扶􅐝食時方了大扶􅐝前逢仄徑仍﨑嶇懸崖破棧不可玩輿丁挾我如騰狙平生行路險艱足如今雪鬢應難緑却憐苔髪鎮長青千古􅆴􅆴挂髙木胡孫梯峽山有胡孫愁予常過之木磴鱗鱗滑帶泥微生欹側寄枯藜胡孫愁處我猶過箇裏如今幸有梯雷洞平七十二洞皆在道傍大旱有禱投香花不應即以大石或死彘及婦人弊履投而觸之雷雨即至行人魄動風森森兩崖奔黒愁太隂不知七十二洞處側足下窺雲海深聞有神龍依佛住棖觸須㬰召雷雨兩川稻熟須好晴我亦閒游神勿驚八十四盤冥鴻無伴鶴孤飛囘首塵籠一笑嬉八十四盤新拄杖萬三千乗舊牙旗石梯碧滑雲生後木葉紅斑雪霽時說與同行莫惆悵人間捷徑轉嶔巇婆羅平仙聖飛行此是家路逢真境但驚呀神農嘗外盡靈藥天女散餘多異花嵐雨逼衣寒似鐵氷泉炊米硬於沙峯頭事事殊塵世缺甃跳梁笑井蛙思佛亭曉望栗烈剛風刮病眸登臨何啻緩千憂界天暑雪青城外湧地晴雲瓦屋頭浩蕩他年誇北客蒼茫何處認西州千巖萬壑須尋徧身是江湖不繫舟光相寺峰頂四時如大冬芳花芳草春自融苔痕新晞六月雪木勢舊偃千年風雲物為人布世界日輪同我行虚空浮生元自有超脱地上可憐悲攓蓬七寶巖大峨絶頂白水寺已在山半由白水陡上至巖又六十里天如碧玉甌下覆白玉盤晶光眩相射我獨居兩間正視不勝瞬却立聊少安但覺風浩浩骨毛森以寒神仙杳無處寧論有塵寰身輕一槁葉兩腋如飛翰同行挽我衣何往何當還少㽞作詩去竒哉此憑闌淳熙四年六月二十七日登大峨之巔一名勝峰山佛書以為普賢大士所居連日光相大現賦詩紀實屬印老刻之以為山中一重公案勝峰髙哉摩紫青白鹿導我登化城住山大士喜客至兜羅布界繽相迎圓景明暉倚雲立艴如七寶莊嚴成一光未定一光發中有墨像隨心生白毫從地插空碧散燭象緯天龍驚夜神受記亦修供照世洞然千百燈明朝銀界混一白咫尺眩轉寒凌兢天容野色儵開閉慘澹變化愁仙靈人言六通欲大現洗山急雨如盆傾重輪叠采印巖腹非煙非霧非丹青我與化人中共住鏡光覿面交相呈前山忽湧大圓相日圍月暈浮青冥林泉草木盡含裹是則名為普光明言詞海藏不勝讚北峰復有金橋横衆慈久立佛事竟一塵不起山竛竮向來無法可宣説為問有耳如何聽我本三生同行願隨縁一念猶相應此行且復印心地衣有寶珠奚外營題詩説偈作公案亦使來者知吾曽神通佛法須判斷一任熱椀春雷鳴詣佛閣晚望雪山數十峰如爛銀晃耀暑光中累塊蒼然是九州大千起滅更悠悠雪光正照天西角日影長浮雨上頭峰頂何曽知六月塵間想已别三秋佛毫似欲㽞人住横野金橋晚未收浄光軒白水寺翳華銷盡八窓明雨竹風泉演妙聲身世只今髙幾許北峰渾共倚闌平虎溪黑水寺前雖不及雙溪亦佳處也開山僧至此斷渡一虎踞前因跨之亂流以濟今作橋其上水嵗推盪輒更新之水本無心作浪波經行偶與石相磨不須更問橋安否喚取於菟載我過白雲峽牛心寺雙溪疑從銀漢下我欲窮源問仙舎飛瀾濺沫潄籃輿却望兩崖天一罅踈踈暑雨滑危梯䇿䇿山風掖髙駕幽尋險絶太竒生莫笑退之號太華孫眞人菴何處仙翁舊隱居青蓮巉絶似蓬壺雲深未到淘朱洞雨小先尋煉藥爐磵下草香疑可餌林間虎伏試教呼閒身儘辦供薪水定肯分山一半無龍門峽插天千丈兩碧城中有玉塹穿巖扃瀑流懸布不知數亂落嵌根飛白雨瑶琨為室雲為闗龍君所居朱夏寒不辭擊棹更深入萬一龍驚雷破山既離成都故人送者逺至漢嘉分袂其尤逺而相及於峨睂之上者六人范季申郭中行楊商卿嗣勲李良仲譚德稱口占此詩㽞别我本住林屋風吹來錦城錦城亦何樂所樂多友生相從不知久相送不計程横絶峨睂巔欲去有餘情吾宗蓋難弟李郭人中英二楊懿文德譚子資粹清相視心莫逆劇談四筵輕明朝各回首雲水相與平我今投紱去行且扶藜耕淒凉别知賦慷慨結客行後㑹豈不好路長恐寒盟諸賢乃不凡骨相有功名大厦罩羣木明廷朝萬靈王畿坦如砥結綬當同登道傍石湖水誰能叩柴荆夢中儻相見秉燭聽殘更聞威州諸羌退聽邊事已寧少城籌邊樓開檻修葺亦畢工作詩寄權制帥髙子長籌邊樓上美髯翁赤白􅇸飛笑語中勃律天西元采玉蓬婆雪外昨分弓踏筵舞罷平䦨月横槊詩成滿袖風諸校各能歌破陣何須琴裏聽平戎破陣平戎皆有本事子長當一笑領石湖詩集卷十八欽定四庫全書石湖詩集卷十九宋范成大撰犍為江樓河邉堵立看歸篷三老開頭暮欲東漲水稠灘連峽内淺山浮石似湘中無人驛路榛榛草有客江樓浩浩風種落塵消少公事賸裁新語寄詩筒縣令師永錫同年能詩宣化道中瘦草蕭疎已似秋盤陀山骨束江流兩崖若不頑如鐵爭得狂瀾拍岸休將至叙州亂山滿平野漲水豪大川仄徑無轍跡疎林有炊煙山農旦燒畬蠻賈暑荷氈窮鄉足荒怪打鼓催我船七夕至叙州登鎖江亭山谷謫居時屢登此亭有詩四篇敬用其韻水口故城丘壠平新亭乃有縆鐵横舊戎州在對江山趾下臨馬湖蠻江路蠻自江出必過城下故寘鎖以為限今遷城過江已失形勝而猶於亭下鎖江特以攔稅而已非本㫖也歸艎擊汰若飛渡一雨徹明秋漲生東樓鎖江兩重客筆墨當代俱詩鳴我來但醉春碧酒星橋脈脈向三更郡醖舊名重碧取杜子美東樓詩重碧酤春酒之句余更其名春碧語意便勝江安道中近瀘州最險處號張旗三灘言張旗之頃已過三灘其湍急如此瀘戎之間有渡瀘亭然不知孔明竟出何路今鎖江對岸廢城下臨馬湖有韋臯紀功碑巋然荒搸中疑此或是古迹穠緑連村荔子丹瘴雲將雨暗前灣張旗且喜三灘駛叱馭曽驚九折艱瀘水舟聞迷古渡馬湖碑缺伴荒山威名功業吾何有無事飄飄犯百蠻瀘州南定樓歸艎東下興悠哉小住危闌把一杯樓下沄沄内江水明朝同入大江來題譚徳稱扇德稱與楊商卿父子送余逺至瀘之合江以扇求詩各為題一絶蠻風吹雨瘴江肥短草荒山鳥不飛盡是瀘南腸斷句如今分與故人歸題楊商卿扇君歸我去兩銷魂愁滿千山鎖瘴雲後夜短檠風雨暗誰能相伴細論文題楊子容扇雙竹軒窓聽讀書垂天雲翼要摶扶與君只作三年别射䇿東來過石湖譚徳稱楊商卿父子送余自成都合江亭相從至瀘南合江縣始分袂水行踰千里作詩以别合江亭前送我來合江縣裏别我去江流好合人好乖明日東西南北路千里追隨不忍歸一杯重把知何處臨岐心曲兩茫然但祝頻書無别語發合江數里寄楊商卿諸公臨分滿意說離愁草草無言祗淚流船尾竹林遮縣市故人猶自立沙頭過江津縣睡熟不暇梢船西風扶櫓似乗槎水濶灘沉浪不花夢裏竹間喧急雪覺來船底滚鳴沙恭州夜泊萆山磽确強田疇村落熙然粟豆秋翠竹江村非錦里青溪夜月已渝州小樓髙下依盤石弱纜西東戰急流入峽初程風物異布裙跣婦總垂瘤大熱泊樂温有懷商卿徳稱暑候秋逾濁江流晚更渾瘴風如火焮嵐月似煙昏城郭廪君國山林妃子園故人新判袂得句與誰論涪州江險不可泊入黔江檥舟黄沙翻浪攻排亭濆淖百尺呀成坑坳窪眩轉久乃平一渦熨帖千渦生篙師絶叫敺川靈鳴鐃飛渡如奔霆水從岷來如濁涇夜榜黔江聊濯纓玻瓈徹底鏡面清忽思短棹中流横釣絲隨風浮月明妃子園涪陵荔子天寶所貢去州里所有此園然峽中荔子不及閩中逺甚陳紫又閩中之最也露葉風枝驛騎傳華清天上一嫣然當時若識陳家紫何處蠻村更有園豐都觀在豐都縣後三里平都山舊名仙都觀相傳前漢王方平後漢隂長生得道處隂君上升時五雲從地湧出丹竈古柏皆其故物晉隋殿宇無恙壁畫悉是當時遺蹟内王母朝元隊仗尤竒道士云此地即所謂北都羅豐所住又名平都福地也神仙得者王方平誰其繼之隂長生飄然空飛五雲軿上賓寥陽留玉京石爐丹氣常夜明寵光萬柏森千齡峽山偪仄岷江縈洞宫福地古所銘云有北隂神帝庭太隂黒簿囚鬼靈自從仙都啟巖扄明霞流電飛陽晶暉景下墮鑠九氷塞絶苦道升無形至今臺殿棲竛竮隋圬唐堊留丹青十仙怪竒溪女清瑶池仙仗紛娉婷琅璈赴節鏘欲鳴我來秋暑如炊蒸汗流呀氣扶枯藤摩挲衆蹟不暇評聊記梗槩知吾曽萬州西山湖亭秋荷尚盛叢薈忽明眼山腰灧湖光列岫繞雲錦深林䕶風香西山即太華玉井餘秋芳隔江招岑仙共擘雙蓮房下巖疇昔中巖一夢殘下巖風景亦髙寒峽中無處堪停棹雨後今朝始凭闌不用苦求毫相現祗教長挂水簾看山僧勸我題蒼壁坡谷前頭未敢刋魚復浦泊舟望月出赤甲山山形斷缺如鼉龍坐而張頤月自缺中騰上山頂月生赤甲如金盆蹲龍呀口吐復吞長風浩浩挾之出影落半江沉復翻天髙夜靜四山寂惟有灘聲喧水門髙齋詩翁不可作我亦不眠終夕看䕫州即事自東川入峽路至恭州便有癭俗夾岸山悉痺小入䕫界山皆傑然連三峽䕫水不可飲取之臥龍十里之外雲安麴米春自唐以來稱之今䕫酒乃不佳峽行風物不堪論袢暑驕陽雜瘴氛人入恭南多附贅山從䕫子盡侵雲竹枝舊曲元無調麴米新篘但有聞試覓清泠一杯水筒泉須自臥龍分瞿唐行七月十九日至䕫子灧澦撒髪不可犯是夜水漲及山腹詰旦視灧澦則已在水中土人云此青草齊也可以冒險而入遂鼔棹畧其頂而過郡中遣候兵立山上每一舟平安則揺幟以招後舟白鹽赤甲皆峽口大山黄嵌黑石皆峽中至險處入峽西岸有聖泉舟人或向之疾呼曰人渴也泉即迸下一杯許復乾余舟過甚急未之試也川靈知我歸有程一夜漲㾗千丈生中流撃楫洶作氣夾岸簸旗呀失聲不知灧澦在船底但覺瞿唐如鏡平鑿峽疏川狠石破號山索飲飛泉驚白鹽赤甲轉頭失黒石黄嵌􅂸命輕草齊増肥無泊處竹枝凝咽空餘情人間險路此竒絶客裏驚心吾飽更劒閣翻成蜀道易請歌范子瞿唐行夜泊歸州州有宋玉宅昭君臺舊國風煙古新凉瘴癘清片雲將客夢微月照江聲細和悲秋賦遥憐出塞情荒山餘閥閱兒女擅嘉名秭歸郡圃絶句二首花竹蕭騷小圃畦官居翻似隠淪棲巴山四合秋陽滿杜宇黄鸝相對啼孤城偪仄復偪仄前山後山青欲來市聲蕭條衙鼓靜惟有叱灘喧萬雷叱灘即黄魔灘下連人鮓甕宋玉宅相傳秭歸縣治即其舊址縣左旗亭好事者題作宋玉東家悲秋人去語難工揺落空山草木風猶有市人傳舊事酒壚還在宋家東後巫山髙一首余前年入峽常賦巫山髙今復作一篇十二峯中東西各一峯最竒不可繪畫左右前後餘峯之可觀者尚多不止十二峯也不問隂晴雲物常相暎帶尤為勝絶但以漲江湍怒難檥泊鼓棹而過不復登廟前余以水暴漲得下瞿唐至巫山縣人云却須水退始可入巫峽一夜水落十餘丈遂不復滯留凝真宫前十二峯兩峯姢妙翠插空餘峯競秀尚多有白壁蒼崖無數重秋江潄石半山腹倚天削鐵荒行蹤造化鍾竒矗瑶巘真靈擇勝深珠宫朝雲未罷暮雲起隂晴竟日長冥濛瑶姬作意送歸客一夜收潦仍囘風仰看館御飛檝過囘首已在虚無中惟餘烏鴉作使者迎船送船西復東黄牛峽廟為黄牛神所居即石馬繋祠門處東坡所書歐公詩及本事碑石在東廡祠後髙峯之上有黄牛迹客舟甚敬之以歐公故石馬亦有靈扄䕶甚嚴朝離悲秋宅午榜叠石磯小留黄牛廟細讀石馬詩黄牛隠見蒼山裏石馬至今猶馘耳當年夢境識仙翁馬為迎門神為起物生不朽繫所逢歐詞蘇筆蒼苔封山髙水長翁之風石馬亦與翁無窮假十二峯即黄牛峽山自此直至平喜埧千峯重複靡不竒峭巴東三峽數巫陽山入西陵更鬱蒼何以假為非確論直疑溟涬弟髙唐扇子峽兩岸山尤竒殆過巫峽蝦蟇碚在南岸兹行看山真飽諳今晨出峽仍窮探南磯北磯白鐵壁千峯萬峯蒼玉篸横前直疑江已斷崛起競與天相攙蜀山欲窮此盤礴禹力且盡猶鐫劖望舒宫中金背蟾泥塗脫盡餘老饞下飲岷江不知去流涎落吻如排髯挈瓶檥棹㪺清甘未暇煑茗和薑鹽聊將滌硯濡我筆恍惚詩律髙巉巖荆渚中流囘望巫山無復一㸃戲成短歌千峯萬峯巴峽裏不信人間有平地渚宫囘望水連天却疑平地元無山山川相迎復相送轉頭變滅都如夢歸程萬里今三千幾夢即到石湖邉魯家洑入沌三江口即岳陽路水大難行遂入沌行沌中最空夐處名百里荒盜區也過盡巴東巫峽長荆川鼔棹更茫茫避風怕入三江口乗月貪行百里荒夜後逢人盡刀劒古來踏地皆耕桑可憐行路難如此一簇寒蘆尚稅場鄂州南樓誰將玉􅅇弄中秋黄鶴飛來識舊游漢樹有情横北渚蜀江無語抱南樓燭天燈火三更市揺月旌旗萬里舟却笑鱸鄉垂釣手武昌魚好便淹留題黄州臨皋亭夏口風帆赤壁磯雪堂釃酒竹樓棋繫舟一日黄州下只辦登臨不辦詩江州庾樓夜宴前瞰大江後臨廬山登臨名勝殆甲他處庾亮南樓乃在武昌非此也亮常刺江州後人製此名非斯樓之要岷江潄北渚廬阜窺南窓名山復大川超覽兹樓雙何必元規塵自足豪他邦使君秫田熟新凉篘酒缸落景澹碧瓦長虹吐金釭客從三峽來噩夢隨奔瀧小留聽琵琶船旗卷修杠請呼裂帛絃為拊洮河腔曲終四憑闌倦游心始降明發挂帆去曉鐘煙外撞東林寺慧逺師白蓮社也傍有樂天草堂對山絶頂即天池文殊現燈處李成焚劫南北山獨不毁二林談易繙經宰木春三生猶自裊煙熏客塵長隔虎溪水劫火不侵香谷雲老矣懶供蓮社課歸哉忺讀草堂丈山頭一任天燈現箇事何曽落見聞過虎溪對東林蒼巖翠樾下浸大澗宛似靈隠冷泉囑長老法才作亭名曰過溪且為率山丁薙草定基一朝而畢過溪無限翠屏開大笑從教虎子猜不獨山中添故事仍教題作小飛來病倦不能過谷簾三峽寄題白龍青峽紫煙爐山北山南只半塗說與同來緑玉杖他年終補臥游圗湖口望大孤廬阜岡勢斷江流漭相通大孤如小冠插入奫淪中我欲蛻濁浪往馭揚瀾風晃晃銀色界濙濙水晶宫濯足望八荒列宿羅心胸客帆詎肯駐搔首蒼煙叢澎浪磯阻風浦口藏舟尋丈慳篙師抱膝朝暮閒逆風來從水府廟濁浪欲碎小孤山太白猶髙缺蟾墮長江未盡歸鬢斑短歌聊復怨行路當有聽者凋朱顔馬當洑阻風居人云非五日或七日風不止謂之重陽信柏岸囘流逆上磯枯楊折葦靜相依趂墟漁子晨爭渡賽廟商人晚醉歸重九信來風未憗大千行徧昨俱非羈愁萬斛從頭數帶眼今秋又減圍放舟風復不順再泊馬當對岸夾中馬當水府即小說所載神助王勃一席清風處也戲題兩絶萬里東隨倦客東馬當山觜勒孤篷無才解賦珠簾雨誰肯相賖一席風禁江上口柏山東三日荒寒繋短篷却憶宫亭湖裏去隨人南北解分風守風嘲舟子奪命稠灘百戰餘守風端坐恰乗除日長飽飯佳眠覺閒傍蘆花學釣魚佛池口大風復泊碧葦無思連天生青山有情終日横風聲洶怒木朝拔川氣流光珠夜明誰能坐守白頭浪我欲往騎金背鯨俛仰之間撫四海可憐步步愁江程長風沙夕陽明逺帆髙浪兀孤嶼綿綿淮山來閃閃沙鳥去落木兩三家炊煙南北渡眉伸擊汰行夢愕阻風處九月八日泊池口斜景下天末煙霏酣夕紅餘暉染江色瀲灧琥珀濃我從落日西忽到大江東囘首舊游處曛黄錦城中藥市并樂事歌樓沸晴空故人十二䦨豈復念此翁池州九日用杜牧之齊山韻年年佳節歌式微秋浦片帆還欲飛萬里蜀魂思逺道九歌楚調送將歸杯中山影分秋色木末江光借夕暉細撚黄花一枝盡霏霏金屑滿征衣離池陽十里清溪口復阻風恰從秋浦挂籧篨又泊清溪十里餘愁水愁風吹帽後作雲作雨授衣初逺尋草市沽新酒牢閉篷窓理舊書行路阻艱催老病騷騷落雪滿晨梳梅根夾辛苦凌波棹平安入夾船日明漁浦網風側瓦窑煙老圃容挑菜村巫横索錢且投人處宿終夜得佳眠宿長蘆寺方丈塔廟新浮水汀洲舊布金聊憑一葦力與障萬波侵帆影窺門近鐘聲出院深夜䦨雷破夢欹枕聽潮音將至呉中親舊多來相迓感懷有作望見家山意欲飛古來燕晉一沾衣囘思客路豈非夢乍聽鄉音真是歸新事畧從年少問故人差覺坐中稀不須更說桑榆晚霜後鱸魚也自肥石湖詩集卷十九欽定四庫全書石湖詩集巻二十宋范成大撰淳熙五年四月二日直宿玉堂懷舊二絶句桂海冰天老嵗華直廬重上玉皇家當年曾識青青􅁂惟有東墻一架花雪山刁斗不停撾夜把軍書敢顧家珍重玉堂今夜夢静聞宫漏隔宫花初歸石湖曉霧朝暾紺碧烘横塘西岸越城東行人半出稻花上宿鷺孤明菱葉中信脚自能知舊路驚心時復認鄰翁當時手種斜橋栁無限鳴蜩翠埽空寄蜀州楊道人老來萬事緫蕭然猶憶西州暑雪邊為報岷峨山水道如今真箇得歸田送同年萬元亨知階州老我曾頒萬里春憐君飛棹也浮秦當年千佛名經裏又見西遊第二人路入南山舊漢畿油油清渭照牙旗古來百戰功名地正是雞鳴起舞時十年關隴困科輸聖徳如天盡埽除臨遣中和二千石好乘春日下寛書次韻蜀客西歸者來過石湖并寄成都舊僚走徧塵埃倦鳥還故鄉元在水雲間黄粱飯裏夢魂醒青篛笠前身世閒鷗鷺飛來俱玉立松篁嵗晚各蒼顔岷峨交舊如相問鐵鎖無扃任客攀十一月大霧中自胥口渡太湖白霧漫空白浪深舟如竹葉信浮沉科