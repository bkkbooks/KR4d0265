行色住重肯過蘇端頃乾道辛卯嵗三月望夜與周子充内翰泛舟石湖松江之間夜艾歸宿農圃距今淳熙己亥九年矣余先得歸田復以是夕泛湖有懷昔遊賦詩紀事石湖花月浮春空憶共仙人同短篷三更半醉吹笛去櫂入濕銀夭鏡中鶴鳴喚歸斗未没却歩扶踈花底月不知行到碧桃邊但見夭風吹積雪月圓月缺今幾回依舊滿湖金碧堆仙人還上玉堂宿合有片時清夢來一笑流光飛電抺嫦娥相對兩愁絶桂枝應亦老無花蟾兔不須疑鶴髮嬾牀午坐晴霄垂北窓卧我翠幄中不知幾斧鑿成此太虛空前雲稍過盡後雲來無窮鳥雀有底忙激彈過牆東不如雙飛蝶欵欵㺯微風我亦困思生抛書眼䝉茸秋前三日大雨暑殘堪喜亦堪憎恰似沙場喋血兵縱有背城餘燼在能禁幾度瀉檐聲秋前風雨頓凉秋期如約不須催雨脚風聲雨快哉但得暑光如寇退不辭老景似潮來酒杯觸撥詩情動書巻招邀病眼開明日更凉吾已卜暮雲渾作亂峰堆立秋後二日泛舟越來溪三絶西風初入小溪帆旋織波紋縐淺藍行入閙荷無水面紅蓮沉醉白蓮酣一川新漲慰秋光挂起篷窻受晚凉楊桞無窮蟬不斷好風將夢過横塘飯後茶前困思生水寛風穩信篙撐不知浪打船頭響聽作凌波解佩聲采菱户采菱辛苦似天刑刺手朱殷鬼質青休問揚荷渉江曲只堪聊誦楚詞聽曉起聞雨老來稍喜睡魔清兀坐枯株聽五更蕭索輪囷憐燭燼飛揚跋扈厭蚊聲登髙事了從教雨刈熟人忙却要晴莫道西成便無慮大須濃日㬠香秔説虎軒夜坐白雲深處卧癡頑挂起東窻水月寛但得好詩生眼底何須寳刹現毫端一身莫作官身想萬境都如夢境看蠏舍鄰翁能日醉呼來分與一蒲團偶書太行巫峽費車舟休向滄溟認一漚日下冰山難把玩雨中土偶任漂流元無刻木牽絲技但合收繩卷索休惟有酒缸并飯甑却須秔秫十分收睡覺漏箭聲中斷角哀界窻猶有月徘徊心兵休為一蚊動句法却隨孤鴈來潄罷玉池甘似醴夢餘金鼓辯如雷夜長展轉添許事推枕蕭然一笑咍閶門行送胡子逺著作守漢川前年送君朝明光今年送君還故鄉錦官樓上一樽酒萬里閶門折楊桞呉波沄沄蜀山蒼人生行路如許長相逢相送鬢如雪人生能禁幾離别房湖風月開春䑓石湖水雲歸去來西棹東帆君未了相逢還向閶門道嘲蚊四十韻暑魃方肆行羽孽亦厲習肖翹極么魔坱圠累闢翕濕生同糞蝎腐化類宵熠初來鬧郭郛少進亘原隰嚶如蠅聲薨聚若螽羽揖俄為殷雷鬨遂作密霰集口銜鋼針鋒力洞衲衣襲啾聲先計議著肉便噓吸立豹猶未定卓錐已深入血隨姑嘬升勢甚轆轤汲沉酣尻益髙飽滿腹漸急晶晶紫蟹眼滴滴紅飯粒拂掠倦體煩爬搔瘁肌澁捄東不虞西擒一已竄十新瘢蓓蕾漲宿暈斑斕浥竟夜眠轉展連牀歎於悒云何人戚欣乃係汝張歙驅以葵扇風熏以艾煙濕檠長鎮藏遮帳隙亟補葺火攻憚穢臭手拍嫌腥汁伏翼佐埽除網蛛助收拾薄暮洶交攻大明訌未戢牛革厚逾氊鱟介銛勝鈒遭汝若欲困嗟人何以給夏蟲雖衆多罪狀相百什蜂蠆豈房櫳蟣蝨但禈褶羊羶蟻登爼驥逸蝱附􅎗蠓惟舞醯瓮蟫止祟書袠蚤為鵂所撮蠅亦虎能執彼愆可貰死汝罪當獻級凉飊倐然至醜類殆哉岌一吹觜吻破再鼓翅翎縶三千蹀頡利百萬走尋邑快哉六合内蔑有一塵立虚空旣清凉家巷得寧輯雞窻夜可誦蛩機曉猶織雨簾繡浪卷風燭淚珠泣客來添羽觴人静拂塵笈恍還神明觀似啓坏户蟄消長誰使然智力詎能及閶門戲調行客日夜飛帆與跨鞍閶門川陸路漫漫人生自苦身餘幾天色無情嵗又寒萬事惟堪六如觀一杯莫信四并難重陽雖過黄花少尚有遲開玉雪團九月二十八日湖上檢校籬落村北村南打稻聲荒園屐齒亦嬉晴菊邊更覺朝陽好松下偏聞晚吹清一嵗無非吾樂事千金不博此閒行周遭踏徧芙蓉岸足痺腰頑栩栩輕晚歩呉故城下意行殊不計榛菅風䄂飄然勝羽翰挂杖前頭雙雉起浮圖絶頂一鵰盤醉紅匝地斜曛暖熨練涵空漲水寒却向東臯望煙火缺蟾先暎槲林丹上沙田舍更無雲物起微隂壠畝人家各好音嵗晚陽和歸稻把夜來霜力到楓林兒童笑裏豐年面烏鳥聲中落日心釀秫炊秔都入手賸􅂸腰脚辦登臨與現壽二長老遊壽泉因話去年林屋之遊題贈何年錫杖劚清甘天遣深源壽此菴金靨萬枝浮倒影為君題作菊花潭松風放浪入雲關二衲相從一士閒人與瘦笻俱老健去年今日在包山渡太湖囊風閣雨半晴隂慘淡誰知造化心委命浮沉惟一葉計身輕重亦千金紅塵猶道不勝險白浪莫嗔如許深晚得薌山堪寄纜卧聽鼉吼與龍吟再渡胥口古來此地快蓬心天繞明湖日照臨一鴈雲平時隐現兩山波動對浮沉衰髯都共荻花老醉面不如楓葉深罾户釣徒來問訊去年盟在肯重尋跨馬過練墟喜晴稻穗初乾怕雨時晚來蒸煖欲霏微西風若肯吹雲盡不惜飄飄側㡌歸晚歸石湖何須駟馬衒鄉關只作歸農老圃看夢裏曾腰綪結佩年來新著惰遊冠和煙種竹聊醫俗帶月聞蛙不在官久矣此心恬不動如今併與此身安北山堂開爐夜坐困眠醒坐一龕多竹洞無關斷客過貪向爐中煨榾柮懶從掌上看菴摩閒無雜念惟詩在老不甘心奈鏡何八萬四千安樂法元無祕密可伽陀入城十里清風一餉間片帆真欲解人顔林家莊近聞鵞鴨船到閶門儘未關儘字俗用已久據理只合用盡字次韻蚤蚊羽蟲么魔塞區寰造化胡為弗疾頑長養汙泥草木處縱横大地山河間夜聲雷動人力屈秋喙花開天理還但願江湖無白鳥何須金鼎鑄神姦冬至晚起枕上有懐晉陵楊使君新衣兒女閙燈前夢裏莊周正栩然騎馬十年聽曉鼓人生元有日髙眠多稼亭邊有所思冬來撚却幾行髭也應坐擁黄紬被斷角孤鴻緫要詩寒雨何事冬來雨打窻夜聲滴滴曉聲淙若為化作漫天雪徑上孤篷釣晚江戲贈脚婆日滿東窻照被堆宿窻猶自煖如煨尺三汗脚君休笑曾踏鞾霜待漏來除夜前二日夜雨雪不成花夜雨來壠頭一洗定無埃小童却怕溪橋滑明日先生合探梅次韻章秀才北城新圃方流桃花塢窈窕入壺天碧城當巖岫清灣如澗泉風月欲無價聊費四萬錢雪後春事起紅雲蜂蝶邊西城如西塞桃花古來多釣艇鱖魚肥前身張志和煙霏幾白鷺風雨一緑蓑清江韻新引清絶勝陽阿夢中作漠漠人間一氣平虛無宫殿銷飛瓊碧雲萬里海光動何處書來金鶴鳴北城梅為雪所厄凍蘂粘枝瘦欲乾新年猶未有春看雪花祗欲欺紅紫不道梅花也怕寒雪後六言二首雨聲和深巷屐風力到短檠燈可惜滴殘檐雪從教漂盡河冰嵗寒破屋萬巻風急踈窻一燈髙卧眼生醉纈逺遊鬚有堅冰元夕大風雨二絶東風無賴妒華年一夜淒寒到酒邊放盡珠簾遮畫炬莫教檐雨濕青煙河傾海立夜翻盆不獨妨燈更損春凍澁笙簧猶可耐滴皴梅頰勢須嗔春懷桞顰梅笑各相惱詩債棋讎俱見尋莫道幽居無一事春來風物緫關心自横塘橋過黄山陣陣輕寒細馬驕竹林茅店小帘招東風已緑南溪水更染溪南萬桞條次韻謝李叔玠追路送筍墮地錦䙀茁解衣温玉姿來償食竹債大勝伏雌炊少日羮藜子老來煨芋師盤餐登異味指動已先知石湖詩集卷二十欽定四庫全書石湖詩集巻二十一宋范成大撰秀州門外泊舟拍岸清波撲岸埃黑頭霜􅁂幾徘徊禾興門外官楊栁又見扁舟上堰來臨平道中煙雨桃花夾岸栽低低渾欲傍船來石湖有此紅千葉前日春寒緫未開夜過越上不得遊覽王程公事兩相催衝雨片帆連夜開千巖萬壑在何處山隂道中無好懷豈有酒船尋賀老興盡那能訪安道鑑湖春色漫芳菲付與青青湖畔草道中古意二絶桃李寂無言垂楊照溪緑不見苧蘿人空吟若邪曲浣紗寂不好辛苦觸戰箭東施無麗質安穩嫁鄉縣觀禊帖有感三絶古人賦多情無事輒愁苦蘭亭一觴詠感慨乃如許寳章薶九泉摹本範百世白鵞滿波間誰識腕中意三日天氣新禊飲傳自古今人不好事佳節棄如土浙東舟中處處槿樊圃家家桃廡門魚鹽臨水市煙火隔江村雨過張帆重潮來汲井渾彎跧短篷底休說兩朱轓初赴明州四征惟是欠東征行李如今忽四明海接三韓諸島近江分七堰兩潮平擬將寛大來宣詔先趂清和去勸耕頂踵國恩元未報驅馳何敢歎勞生昌國縣圖障於海中題字云自此與髙麗國接界蓋宇内極東處也寄虎丘範長老誰云簪紱坐成禽亦漫為官漫好音身已備嘗生老病心何曾住去來今一波不動月空照萬籟無情風自吟持此東歸似同志故應分我半山林次韻汪仲嘉尚書喜雨雨雲渾似雪雲同天意人心本自通吏役驅驅騎馬滑何如欹枕閉門中老身窮苦不須憂未有毫分慰此州但得田間無歎息何須地上見錢流曉起窻明驚起倒裳衣鈐索頻揺定怪遲即入簿書叢裏去少留欹枕聽黄鸝大風四明亦有颶風颶母來從海若家青天白地忽飛沙煩將殘暑驅除盡只莫顛狂損稻花大黄花大芋髙荷半畝隂玉英危綴碧瑶簪誰知一葉蓮花面中有將軍劔㦸心進修堂前荷池方池留水勝埋盆露入蓮腮沁粉痕鈴索無聲人不到小禽飛入閙荷根州宅堂前荷花凌波仙子静中芳也帶酣紅學醉粧有意十分開曉露無情一餉斂斜陽泥根玉雪元無染風葉青葱亦自香想得石湖花正好接天雲錦畫船凉新茘枝四絶茘浦園林瘴霧中戎州沽酒擘輕紅五年食指無占處何意相逢萬壑東海北天西兩􅁂蓬閩山猶欠一枝笻鄞船茘子如新摘行脚何須更雪峰甘露凝成一顆冰露穠冰厚更芳馨夜凉將到星河下擬共嫦娥鬬月明趠泊飛來不作難紅塵一騎笑長安孫郎皺玉無消息先破潘郎玳瑁盤四明海舟自福唐來順風三數日至得茘子色香都未減大勝戎涪間所産莆陽孫使君許寄蜜茘過期不至貳車潘進奏餉玳瑁一種亦佳并賦之角東道院午坐一夜西風轉酒旗午餘殘暑不多時緑荷半蝕霜前葉丹桂全封雨後枝忙裏有詩償日課老来無賦為秋悲梳頭小隷那知此强向窻前數􅁂絲東門外觀刈熟民間租米船相銜入城喜作二絶菊莎把棘㸑無煙日日文書横索錢今日甬東官况好東津門外看租船文書謂諸司督逋者潮到靈橋緑繞船海邊力穡屢豐年淡青山色深黄稻恰似胥門九月天探木犀秋半秋香花信遲攀枝擘葉看纎微昨朝尚作茶槍瘦今雨催成粟粒肥九月五日晴煖歩後園海氣烘晴入斷霞半空雲影界山斜輕羅小扇游蜂畔只比東風有菊花九日憶菊坡菊坡長恨隔横塘城郭山林自不雙放棹松江花已逺濤江之外更鄞江重陽九經堂作俗間佳節自悤悤老去悲秋又客中青嶂捲簾三面月黄花吹􅁂幾絲風十年故國新栽栁萬里他鄉舊轉蓬誰與安排今夜夢片帆飛到小籬東真瑞堂前丹桂血色凡花太俗生花工新意染秋英􅂁紅太重鞓紅淺畫不能摹句寫成官忙風月鎮長閒開遍香紅酒尚寒若要與花相領略千巖隨分有闌干石湖千巖觀前手植丹桂二畝題羔羊齋外木芙蓉慵粧酣酒夕陽濃洗盡霜痕看綺叢緑地團花紅錦障不知庭院有西風進思堂夜坐懷故山塵事潮來不可推身如病鶴强毰毸簿書遮斷尋詩路風雨驚殘問月杯想得竹門無客到直須雪夜有船㢠廻鱸鄉望眼雙明處祇欠凌霄萬仞臺楊少監寄西征近詩來因賦二絶為謝詩巻第一首乃石湖作别時倡和也柴門重客醉中歸尚憶揮毫索紙時何物與儂供不朽西征巻首石湖詩錦囊隨上越王臺天海風濤亦壯哉書到嶺頭梅恰動一枝應伴一篇來羔羊齋小池兩涘木芙蓉盛開有懷故園洞户掩秋深畫橋横晚静嫋嫋芙蓉風池光㺯花影懷我白鷗邊錦帳繚千頃明河拍岸平紅緑染天鏡釣船無畔岸收拾入簿領牆籓束院落寒窘令人癭鹿鳴席上贈貢士登陸由來說四明台星光處更魁星海濵二老尊周室館下諸生右漢廷秋賦重增人物志春闈俱上佛名經一飛好趂扶揺便咫尺西興是北溟大廳後堂南窻負暄萬壑無聲海不波一窻油紙暮春和醉眠陡覺氍毹贅圍坐翻嫌榾柮多水煖玉池添潄嚥花生銀海費揩摩端如擁褐茅檐下祇欠烏烏擊缶歌晚歩北園刮地晴飊退海痕出門無扇可障塵麥粘瘠土何時雪梅糝踈林昨夜春天鏡風煙疑夢事􅁂霜時節尚官身裹章束帶朝還暮慚愧青鞋紫領巾謝賜臘藥感遇之什鴻寳刀圭下九關十年長奉璽封看扶持蒲栁身猶健收拾桑榆嵗又寒天地恩深雙鬢雪山川途逺一心丹疲甿疾苦今何似拜手歸來愧伐檀立春後一日作浮生萬法本悠哉大笑羲娥轉轂催官事已邀癡作伴春風應共老俱來雲容雪意將詩問栁眼花心待酒媒九十韶光天不斳人間笑口自難開春前十日作臘淺猶賒十日春官忙長愧百年身雪催未動詩無力愁遣還來酒不神節物何曾欺老病書生自慣說悲辛終期戚促成何事今古紛紛一窖塵三江亭觀雪隂山陽朔雪中廻行到天西玉作堆乘興却遊東海上白銀宫闕認蓬萊懷歸寄題小艇日出塵生萬劫忙可憐虛費隙駒光若教閒裏工夫到始覺淡中滋味長嵗晚角巾思芋栗年來手版愧耕桑松風蘿月須相信春水深時上野航雪後雨作瑞葉飛來麥已青更煩膏雨發欣榮東風不是厭滕六却怕雪天容易晴再雪銀竹方依檐住瑶花又入簾窺一白本憐麥瘦重來應為梅遲立春日陪魏丞相登三江亭佳節登臨始此囘聊從晻靄望蓬萊水分江北渡頭去風自海東潮外來太白天寒猶帶雪十洲池煖已浮醅一尊往酹發船鼓我亦歸帆相次開寄題鹿伯可見一堂夢覺春闈俱轉蓬仙凡今隔玉霄東聊攀鐵鎖問何似豈敢避堂邀蓋公生來於君一嵗長決去愧我三年遲今世誰不落第二著鞭尚續堂中詩雪溪興盡船當廻却擬登陸遊天台經行見一堂前路轉入湖山尋悞來將赴建康出城牒訴繽紛塞甕天經年癡坐兩三椽出門納納乾坤大依舊青山繞畫船寺莊大麥成苞小麥深秧田水滿緑浮針今年一飽全無慮寛盡歸舟去客心育王方丈窻紙悲嘶萬壑風石梁飛澗倒枯松因勤昨夜三更雨添作投淵雪色龍鰻井決甃神通未易論雨聲留客夜翻盆不辭客路春泥滑且足秧田舊水痕妙喜泉二士共談碑上法千僧同酌沼中泉法門泉味知多少水桶繩頭一串穿明月堂古來禪窟銷巖扃拂子崔嵬拄杖横塔上佛光堂上月莫言公案不分明自育王過天童松林三十里竹輿窈窕入蕭森逗雨梳風冷客襟翠錦屠蘇三十里不知脚㡳白雲深香山抖擻軒裳一鬨塵任教空翠滴烏巾老身已到籃輿上處處青山是故人育王望海亭海雲晻靄日蘢葱案指光中萬象空想見蓬萊西望眼也應知我立長風天童三閣千佛羅漢善財松蘿羃天墮空翠迎面風香三千里曾宫亭亭隔瑶水碧瓦瓊榱五雲裏千佛當門無半偈聲聞未解祖師意徧參踏破青鞋底前樓後閣玲瓏起閒客那知如許事東齋聽雨爛熳睡覺來一轉聊布施普請雲堂來擬議石湖詩集卷二十一欽定四庫全書石湖詩集卷二十二宋范成大撰送江朝宗歸括蒼半生三解后相看成老翁詩情故崒嵂袖有天都峯江山佳麗地登臨苦怱怱塔燈落淮水寺樓倚霜空攟拾著錦囊撫掌夸窮工歸轡不可挽思入孤征鴻洞天我昔遊俛仰星一終士友歎契闊吏民念罷癃婆娑故將軍白髪簿書叢足趼雖四方夢寐煙雨東歸田有脚力尚往尋行蹤期君斬寒藤伴我搘枯笻鍾山閣上望雨天闊山長雨似煙忽然飛去暗平川秔禾未實秈禾瘦不用㢘纎便霈然除夜婪尾杯殘雪滿簪牀頭厯日費光隂故山巧入忙中夢新嵗尤關客裏心烏鵲倦時三匝繞鷦鷯穩處一枝深勞生佚老尋常事從政那堪力不任元日老來百味絮沾泥期㑹關身尚火馳幾夜鄉心欹枕處今年脚力上樓時酒缸幸有乾坤大丹鼎何憂日月遲莫道神仙無可學學仙猶勝簿書癡體中不佳偶書生平人比似維摩試比尫孱不啻過舊摘衰髯今雪徧頻揩病眼轉花多從來世味聊復爾此去官身如老何收拾頽齡加藥餌尚堪風月對婆娑坐嘯齋書懷時方治振濟老來窮苦事相違兀坐鈴齋竟日癡眼目昏縁多押字胸襟俗為少吟詩月侵燈影吏方去春徧梅梢官未知直待食新方綬帶明朝騎馬過陵陂寳公祈雨感應用陳申公韻賦詩為謝膴原龜坼暮春時夾路爐薰共禱祠喚起雲頭千嶂湧飛來雨脚萬絲垂無情梅塢猶紅綻有意秧田盡緑滋大施門開須滿願願均此施匝天涯送徐叔智運使奉祠歸呉中手種湖邊花百畝東風日夜催歸去當年辛苦種花時不道白頭猶未歸君如肯過城南陌但向水雲紅處覓煩呼猿鶴問平安當有畦丁解看客我今江船亦欲東檝迎楓橋成兩翁壓枝萬朶雖過盡尚及巢龜蓮葉中送舉老歸盧山二千里往回似夢四十年今昔如浮去矣莫久留桑下歸歟來共煨芋頭題現老真三十年來共葛藤如今蓮社冷如冰茶瓜櫻筍遊山㑹從此齋廚欠一僧致一齋述事文書煙海困浮沉不覺盤跚百病侵偶問客年驚我老忽聞鶯語歎春深今朝麥粒黄堪麫㡬日秧田緑似針除却一犁春雨足眼前無物可關心次韻楊同年祕監見寄二首瘴雲嵐雨㡬時歸應把周南視九夷舊説鬼神驚落筆新傳狐兔駭搴旗韶江石老簫音在庾嶺梅殘驛使遲自古朱絃清廟具莫貪鵬海看天池吾衰長愧接輿狂忙裏何心領燕香塵土簿書憎鐵研水雲蓑笠傲金章論文無伴法孤起訪舊有情書數行何日却同湖上醉露幃宵幄為君張曉起信筆午枕汗如洗曉櫛氣稍蘇莎蛩試風露滿意鳴相呼倦客感節物流光不躊躇秋聲已如許殘暑何足驅人言今嵗熱迥與常嵗殊此理恐未然豈不知頭顱年年有三伏日日非故吾婆娑今尚可後當彌不如病骨須一凉未暇惜居諸坐來有清思西風揺井梧送曾原伯運使歸㑹稽用送徐叔智韻秧田水滿麥棲畝勸農使者翩然去去年愁苦救荒時豈敢夢為今日歸天津橋西官栁陌文書燈火長相覓江上信美不留人寂寞囘潮工送客鏡湖一曲浙河東萬頃太湖蓑笠翁願賡四愁作五詠我所思兮思剡中王南卿母挽詞櫛縰稱純孝笄珈蚤隱憂病中心已化身外世如浮聞道悲風木誰能駐壑舟佳兒行古道足以賁潛幽次韻鄭校書參議留别年豐方共慶嵗晚客他之吏事朝還暮人生合復離江山殘夢破風月片帆移後㑹吾衰矣桑榆一繭絲重九賞心亭登髙憶隨書劔此徘徊投老雙旌重把杯緑鬢風前無幾在黄花雨後不多開豐年江隴青黄徧落日淮山紫翠來飲罷此身猶是客鄉心却附晚潮囘寄題王仲顯讀書樓嗜書如嗜酒知味乃篤好欲辨已㤀言不為醒者道使君青箱家文史裝懐抱平生名教樂雙旌不滿笑忽乘雪溪興來檥秦淮棹丘亭客漂泊夜夜短檠照人云太癡絶我自斲輪妙今朝檣竿起昨夢繞閤皂云有百尺樓歸寄北窻傲滴露紬朱黄拂塵静緗縹想當呻畢時寧復羡騰趠古心千載事俗眼詎能料蕭灘富還往取友必同調一張復一弛釀秫助歌嘯菊樓金陵出一種菊甚髙園丁結成樓塔或至一二大東籬秋色照踈蕪挽結髙花不用扶淨洗西風塵土靣來看金碧萬浮圖北門覆舟山道中苒苒霜風掠弊貂簿書塵外訪漁樵林煙色淡如濛雨塘水痕深似落潮鴈字江天聞塞管梅梢山路欠溪橋騎驢索句當年事嵗暮騷人不自聊送郭明復寺丞守蜀州士進固未易退亦良獨難西州多故人歸路常險艱有道獨行意郭舟若神仙勿輕銀兔符傾倒金貂蟬唐安君昔遊百萬蠲逋錢我亦常客夢醉歌采菱船父老尚相記况君有前縁想見東西湖恩波漲春瀾此地著經濟紗籠相後先潭潭相業堂新題我所刋政為來者地君行豈偶然去去進明徳後日五四賢元日謁鍾山寳公塔雪後江臯未放春老來猶駕兩朱輪歸心歷歷來時路官事驅驅病裏身未暇雞窠尋古佛且防鶴帳怨山人君看王謝墩邊地今古功名一窖塵元日馬上二絶泥絮心情雪様髯詩囊羞澁酒杯嫌年來萬事都消減惟有牀頭厯日添筯骸全比去年非騎吹聲中憶釣磯待得江風欺老病何如閒健一蓑歸春晚荒園蕭瑟懶追隨舞燕啼鶯各自私窻下日長多得睡尊前花老不供詩吾衰久矣雙蓬􅁂歸去來兮一釣絲想見籬東春漲動小舟無伴栁絲垂北窻偶書呈王仲顯南卿二友官居故偪仄北窻誰所開胡牀憩午暑簾影久徘徊髙槐忽低昻知有好風來須㬰墮几席篆香小飛灰病翁亦披襟月露裝竒懷壠頭暴背耘永晝婦子偕不辭夢山裂田水如潑醅去年豈堪説稻根已浮埃使君坐侯宅窻間即凉臺何敢訴苦熱灑然助心齋中秋清暉閣静坐因思前二年石湖四明賞月前年銀界接天迷去嵗金盤湧海低漂泊相逢重一笑秦淮東畔女牆西玉麟堂㑹諸司觀牡丹酴醿三絶東風微峭護餘春紅紫香中酒自温不用忙催銀燭上酴醿如雪照黄昏洛園姚魏碧雲愁風物江東亦上游憶起遨頭八年夢彭州花檻滿西樓莫向花前惜酒杯一年一度有花開浮生滿百今强半嵗嵗看花得幾囘重九獨坐玉麟堂江上西風動所思又將清賞負東籬年年客路黄花酒日日鄉心白鴈詩籠月秦淮無舊曲馳煙鍾阜有新移人生笑口真稀闊況值官忙閔雨時次韻舉老見嘲未歸石湖半世吟客舍栁長年憶後園花為報廬山莫笑雲丘今屬誰家次韻曾仲躬侍郎同登伏龜樓二絶帶束江淮翠岫園掌窺臺殿碧鱗差劉郎句裏登臨眼壓倒三江二水詩古來遊客謾西東領㑹誰如我與公露坐繩牀天不盡絶勝簾雨棟雲中題李雲叟畫軸兼寄江安楊簡卿明府二絶蒼煙枯木共荒寒籬落堤灣洶漲湍歸路宛然歸未得閒將李叟畫圖看新圖來自雪邊州皴石枯槎筆最遒明府能詩如此畫為渠題作小營丘晨出蔣山道中霜痕如雨沁東郊樂嵗家家一把茅故國丘陵多麥壠新晴籬落有梅梢小山何在應招隱北嶺如今已獻嘲歸計未成聊琢玉飄颻風䄂作推敲有感今昔二首陽春白雪雅音希俚耳冬烘輒笑嗤麋見麗姬翻決驟鳥聞韶樂却憂悲爛奚輕簿人何敢伏獵荒唐自不知蚓竅蠅鳴莫嘲誚彭亨菌蠢正當時飄風驟雨謾驚春埽蕩何煩臂屈伸天識不衷宜不恕神歆非類即非仁休讎地下枯魚骨且鬬尊前健犢身静看可憐還可笑香山寧是幸災人種竹歎向在成都種竹滿西園偶苦寒疾朅來金陵復種繞池未幾以眩卧閤家人子遂謂不當種竹其説甚可怪歎口占此詩宣華種萬竿寒疾適相值玉麟種千竿偶復須藥餌僮奴狃今昨競道竹相祟如將聖作狂似以儒為戲此君來聲寃林神亦短氣我夢不平鳴霍然推枕起明當還石湖賸種千畝地未論比封君且用執讒喙公退書懐昨日騰章奏發倉今兹飛檄議驅蝗四無告者僅一飽七不堪中仍百忙皦日自能臨俯仰浮雲寧解制行藏求田問舍亦何有嵗晚倦遊思故鄉石湖詩集卷二十二欽定四庫全書石湖詩集巻二十三宋范成大撰初秋二首急雨過忩紙新凉生簟藤蹣跚老鈴下來炷壁間燈壯歲故多病老年知不堪何須看公案只此是眞參蝙蝠伏翼昏飛急營營定苦飢聚蚊充口腹生汝亦奚為蛩壁下秋蟲語一蛩鳴獨雄自然遭跡捕窘束入雕龍四花素馨間末利木犀和玉簪醫來都屏去頭眩怕香侵謝範老問病三椽一席度秋冬造化兒嬉困此翁帖有王書難治眩文如陳檄不驅風骨枯似枿膚如腊髪織成氊鬢作蓬㸃檢病身還一笑本來四大滿虛空二偈呈似夀老法法刹那無住云何見在去來若覓三心不見便從不見打開孟説所過者化莊云相代乎前何處安身立命飢餐渴飲困眠諾惺菴枕上噩夢驚回曉枕寒青燈猶照藥爐邊紙忩弄色如朧月又了浮生一夜眠癸卯除夜聊復爾齋偶題五夜燈花重東風角韻來雪慳衣未纊春早句多梅寂厯羅門亞温黁藥鼎煨老嫌新歲換病喜舊星回鬱壘先題版屠蘇後把杯書扉無健筆爆竹有寒灰餳楪牙難膠椒盤眼倦開陳人仍憊卧身世兩悠哉甲辰人日病中吟六言六首以自嘲攢睂輒作山字啾耳惟聞水聲人應見憐久病我亦自厭餘生目慌慌蟻旋磨頭岑岑鼇負山筆牀久已均伏藥鼎何時丐閒政爾榮枯衞澁剛云人厄天窮歸咎四衝臨歲乞憐九曜過宫復吉既愆七日泰來惟候三陽厯日今頒寅正占星更候農祥有日猶嫌開牖無風不敢上簾報國丹心何似夢中抵掌掀髯壯歲喜新節物老來愔舊年華病後都盧不問家人時換瓶花正月九日雪霰後大雨二首夜霰三更碎瓦晝冥一陣翻盆賴是梅花已過不然皴玉誰温黃昏簷澑垂瀑清曉屐聲滿門湖光萬頃何似小沼先吹縠紋正月十日夜大雷震二首阿香眞是健婦夜半鼔行疾驅直恐南山破碎絶憐忩紙枝梧人言有物司鼔春到揚桴發聲但要蟄蟲啓戸何須一許震驚吳燈兩品最高鏤冰影裏百千光剪綵毬中一萬忩不是齊人誇管晏吳中風物竟難雙燈夕懷廣蜀舊事灕水橋西列炬香少城樓下變燈忙兒嬉萬里客程逺老懶一龕春夢長上元紀吳中節物俳諧體三十二韻斗野豐年屢吳臺樂事并酒壚先叠鼓歳後即旗亭先擊鼓不已以迎節意燈市蚤投瓊臘月即有燈市珍奇者數人醵買之相與呼盧采勝者得燈價喜膏油賤祥占雨雪晴篔簹仙子洞坊巷燈以連枝竹縳成洞門多處數十重菡萏化人城蓮花燈最多檣炬疑龍見舟人接竹桅檣之表置一燈望之如星橋星訝鵲成橋燈小家厖獨踞犬燈高閈鹿雙撑鹿燈屏展輝雲母琉璃屏風簾垂晃水精琉璃簾萬忩花眼密萬眼燈以碎羅紅白相間砌成工夫妙天下多至萬眼千隙玉虹明琉璃毬燈每一隙映成一花亦妙天下薝蔔丹房挂梔子燈葡萄綠蔓縈葡萄燈方縑繙史册生絹糊大方燈圖畫史册故事村人喜看圓魄綴門衡月燈擲燭騰空穩小毬燈時擲空中推毬滚地輕大滚毬燈映光魚隱見琉璃壺瓶貯水養魚以燈映之轉影騎縱橫馬騎燈輕薄行歌過顚狂社舞呈民間鼓樂謂之社火不可悉記大抵以滑稽取笑村田蓑笠野村田樂街市管絃清街市細樂里巷分題句每里門作長燈題好句其上官曹别扁名官府名額多以絹或琉璃照映旱船遥似泛夾道陸行為競渡之樂謂之划旱船水儡近如尘水戲照以燈鉗赭裝牢户獄燈嘲嗤繪樂棚山柵多畫一時可嘲誚之人堵觀瑶席隘喝道綺叢爭禁鑰通三鼓歸鞭任五更桑蠶春繭勸春繭自臘月即入食次所以為蠶事之兆花蝶夜蛾迎大白蛾花無貴賤悉戴之亦以迎春物也鳬子描丹筆紅畫鴨子相餽遺鵞毛剪雪英剪鵞毛為雪花與夜蛾並戴寳糖珍粔籹䭔拍吳中謂之寶糖䭔特為脆美烏膩美飴餳烏膩糖即白餳俗言能去烏膩撚粉團欒意糰子熬稃腷􅈩聲炒糯穀以卜俗名孛婁北人號糯米花筵篿巫志怪香火婢輸誠俗謂正月百草靈故帚葦針箕之屬皆卜焉多婢子之輩為之箒卜拖裙驗弊帚繫裙以卜名埽帚姑箕詩落筆驚即古紫姑今謂之大仙俗名筲箕姑微如針屬尾以針姑卜伺其尾相屬為兆名針姑賤及葦分莖葦莖分合為卜名葦姑末俗難訶止佳辰且放行此時紛僕馬有客静柴荆幸甚歸長鋏居然照短檠生涯惟病骨節物尚鄉情掎摭成俳體咨詢逮里甿誰修吳地志聊以助譏評雪寒探梅酸風如箭莫憑闌凍合横枝雪未乾吳下得春元自晚那堪天與十分寒曉枕三首煮湯聽成萬籟添被知是五更陸續滿城鐘動須臾後巷鷄鳴卧聞赤脚鼾息樂哉栩栩蘧蘧病夫心口相語何日佳眠似渠舒慘常隨天氣關心忩暗忩明日晏扶頭未起喚人先問陰晴不寐春宵似暖非暖曉夢欲成未成風竹時驚雀噪月忩誰伴梅横戲書二首長病人嫌理亦冝吾今有計可扶衰煩君舁著山深處恐有黃龍浴水醫羣兒欺老少陵窮口燥脣乾髪漫衝顚沛須臾猶執禮古來惟有一高共耳嗚風號高木水翻洪厯厯音聞不是聾一任大千都震吼便從卷葉證圓通案上梅花二首南坡玉雪萬花團舊約東風載酒看冷落銅瓶一枝亞今年天女亦酸寒地爐火煖日烘忩一夜花鬚半吐黃鼻觀圓通熏百和博山三夕罷燒香古梅二首孤標元不鬬芳菲雨瘦風皴老更奇壓倒嫩條千萬蘂只消疎影雨三枝誰似西湖處士才詩中籬落久塵埃陸郎舊有梅花課未見今年句子來至昌為具賞東軒千葉梅然梅尚未開玉葉重英意已芽新移竹外小橫斜東齋何似春工晚鐵樹已花梅未花喜周妹自四明到團欒話裏老龎衰一妹仍從海浦來孤苦尚餘兄弟樂如今雖病也睂開占星者謂命宫月孛獨行無害但去年復照作災今年正月一日已出而歲星作福戲書二絶昔躔初度本除災何意重逢作病媒久住靈斿今日過厯翁歡喜勸椒杯暗曜加臨有救神煌煌福德自天仁只煩終惠蘓殘喘官爵從渠奉董秦題藥方孤童亦復夢槐柯無德無功用福多天理乘除當老病巢源王訣奈君何園丁折花七品各賦一絶單葉御衣黃舟前鵞羽映酒塞上駞酥截肪春工若與多葉應入姚家鴈行水精毬輕盈嫵媚不耐風日又名醉西施又名風嬌又名玉勝瓊縹緲醉魂夢物嬌饒輕素輕紅若非風細日薄直恐雲消雪融夀安紅深色粉紅多葉易種且耐乆豐肌弱骨自喜醉暈粧光緫宜獨立風前雨裏嫣然不要人持叠羅紅開遲旬日始放盡襞積剪裁千叠深藏愛惜孤芳若要韶華展盡東風細細商量崇寧紅勻染十分艶絶當年欲占春風曉起粧光沁粉晚來醉面潮紅鞓紅猩脣鶴頂太赤橊蕚梅腮弄黃帶眼一般官様祗愁瘦損東陽紫中貴沉沉色與露滴泥泥香隨日烘滿眼艷粧紅袖紫綃終是仙風聞春逺牡丹盛開東軒聞道有花開癡坐三椽首謾回縱得好晴猶懶看那堪風雨揭天來蜀花以狀元紅為第一金陵東御園紫繡毬為最西樓第一紅多葉東苑無雙紫壓枝夢裏東風忙裏過蒲團藥鼎鬢成絲喜雨昨遣長鬚借踏車小池須水引鳴蛙今朝一雨添新漲便合翻泥種藕花嘲風紛紅駭綠驟飄零癡騃封姨沒性靈報道海棠方熟睡也須畱眼為渠青大風春晴雖好恨多風到眼花枝轉眼空晴不與花為道地爭如雲淡雨濛濛風止收盡狂飊捲盡雲一竿晴日曉光新桞魂花魄都無恙依舊商量作好春苦雨五首河流滿滿更滿檐澑垂垂又垂皇天寧有漏處后土豈無乾時不辭蛾化麥穗叵忍秧浮浪花兒孫汨汰護岸翁媪扶攜上車折筍肥梅飣坐涎蝸鬬蟻上梁雨工莫賈餘勇畱待稻花半黃潤礎纔晴又汗濕薪未爆先煙壯夫往往言病病叟岑岑且眠已厭衣裳蒸潤仍憐書畫斕斑匳香尚餘幾所盡付熏罏博山謝龔養正送蘄竹杖一聲霜曉謾吹愁八尺風漪不耐秋上座獨超三昧地諾惺菴裏證般舟釋氏謂常行為般舟三昧寄題祝郢州白雪樓楚望風煙倚繡楹使君静治有高情袛應襦袴新翻曲壓倒當年寡和聲夏至二首李核垂腰祝饐粽絲繫臂扶羸節物競隨鄉俗老翁閒伴兒嬉石鼎聲中朝暮紙忩影下寒温踰年不與廟祭敢云孝子慈孫重午熨斗薰籠分夏衣翁身獨比去年衰已孤菖淥十分勸却要艾黃千壯醫蜜粽冰糰為誰好丹符綵索聊自欺小兒造物亦難料藥裏有時生網絲積雨作寒五首壓屋雨雲晝暗環城霖潦夏寒西池半没荷柄南蕩平沉芡盤已報舟浮登岸更憐橋塌平池養成蛙吹無謂埽盡蚊雷却奇熨帖重尋毳衲補苴盡護紙忩餘生雪鬢禪榻昨夢雲帆漲江婢喜蚊僵霧帳兒嗔蝸篆風櫺兀坐鼻端正白忘懷眼底常青山寒禪老不下泥滑琴僧罕來且喚園丁閒語喜聞湖岸未頽禪老範黙堂琴僧淨月師也喜晴二首驅帚水爭溝口卷簾日欵屋山飢燕癡兒叫怒拙鳩去婦復還忩間梅熟落蔕牆下筍成出林連雨不知春去一晴方覺夏深子文大丞重午日走貺煮酒清甚殆與逺水一色何其妙哉數語奉謝臘脚清若空吾聞其語矣今晨品義尊公酒正如此太常家有此段奇銷得不齋醉如泥但恨今無遏雲曲送我菖蒲一杯綠子文舊有歌者名遏雲子文見和云亦有小鬟能度曲復用韻戲贈三年屏杯酌甚矣吾衰矣眼中有淄澠猶解商略此花酒俱來事更奇不妨禪心絮沾泥翠睂何時眞度曲細意煩君畫蛾緑石湖詩集巻二十三欽定四庫全書石湖詩集卷二十四宋范成大撰題請息齋六言十首洞門晝挂鐵鎖閣道秋生綠苔蓍下略同龜伏瓜中且免蠅來多謝紛紛雲雨相忘渺渺江湖坐隅但忌占鵩屋上何煩譽烏灧澦年年似馬太行日日推車笑中恐有義甫泣裏難防叔魚見影蜮猶鉍鉍聞聲厖尚狺狺問誰毛生名紙知我角出車輪不惜人扶難拜非關我醉欲眠勞君敬枯木耳恐汝見濕灰焉稅駕今吾將老結廬此地不喧恐妨蝴蝶同夢笑倩顚當守門口邊一任醭去鼻孔慵將涕收閒門冷落車轍空室團欒話頭冷煖舊雨今雨是非一波萬波壁下禪枯達磨室中病著維摩親戚自有情話來往都無雜言酒熟徑須相報文成聊與細論園丁以時白事山客終日相陪竹比平安報到花依次第折來送劉唐卿戸曹擢第西歸六首摩挲漢柱愴分襟邂逅吳船喜盍簪别久十年知幾夢情親萬里只初心學道何關紫與青發身聊假佛名經歸來解盡程書縳千古文章似建瓴槐黃燈火困豪英此去書忩得此生學力根深方蔕固功名水到自渠成中年親友惜分離況我身兼老病衰餘景庶幾猶及見登瀛召客過門時我識岷峨最上頭當年脚力與雲浮兩山父老如相問一席三椽正卧遊四海西州舊故多煩君問訊各如何心期本自無南北萬里天波一月波末句戲用蜀語以見久要不忘之意富順楊商卿使君曏與余相别于瀘之合江渺然再㑹之期後九年迺訪余吳門則喜可知也今復分袂更增惘然病中强書數語送之合江縣下初語離共説再㑹知何時夀櫟堂前哄一笑人生聚散眞難料青燈話舊語未終船頭叠鼓帆爭風草草相逢復相送直恐送迎皆夢中昨聞親上安邊奏玉陛從容移禁漏天香懷䄂左魚符歸作雙親千歲夀我今老病塘蒲衰君歸報政還復來萬里儻容明月共更期後夢如今夢久病或勸勉强遊適吟四絶答之風月箇中老子江湖之上散人化鑪苦靳清福環堵閒抛好春鶴怨久迴俗駕鷗盟誰主載書一丘一壑謝汝三歲三秋望予捫蝨即是忙事驅蠅豈非褊心香煖香寒功課忩明忩暗光陰羸如蓐婦多忌倦似田翁作勞玩具僧梳刖屨歡悰丁尾龜毛初秋閒記園池草木五首茙葵爛紫終陋薝蔔嫣黃亦香醫俗賸延竹色療愁催拆萱房牛牽碧蔓自繞雞聳朱冠欲爭菱葩可範伯雅蓼節偏宜麴生菱葩為酒杯様最佳蓼入麴為勝旱地蓮花嬌小水盆梔子幽芳薇帳半年春艶桂叢四季秋香紫薇一名半年紅嵓桂一種四季有花醉憐金琖齊側卧看玉簪對橫腥水畱灌末利結香旋薫素馨末利用治魚腥水澆方多花玉菡化生稚子碧枝視現聲聞馬齒任藏汞冷鴻頭自勝硫温謂孩兒蓮羅漢木馬齒莧中有水銀鴻頭芡實也芡性煖號水硫黃巖桂三首風簾疎爽月裵回悵望家人把酒杯病著幽忩知幾日瓶花兩見木犀開越城芳徑手親栽紅淺黃深次第開不用小山招隱賦身如強健日千迴一株蕭索倚宣華東苑香風屬内家丹碧屠蘇銀燭照平生奇絶象山花少城圃中惟有一株建康東御園有亦不多四明丹桂特奇州宅所種尤蔚茂常與魏丞相夜飲其下中秋無月三首兒女無悰坐客稀今年孤負隔年期誰從天上牢遮月不管人間大欠詩撲地癡雲欲萬重家家簾幙護房櫳世間第一無情物誰似中秋雨與風一生露下風前客兩歲愁邊病裏身姑置陰晴圓缺事藥寮燈火正相親藻姪比課五言詩已有意趣老懷甚喜因吟病中十二首示之可率昆季賡和勝終日飽閒也舊歲連新歲凉牀又煖牀山川屏裏畫時刻篆中香畏壘安吾土支離飽太倉若敎身更健鶴背入維揚認鹿紛紜夢亡羊散亂心眵昏遮眼讀愁苦撚髭吟幸覺行迷逺其如卧病深通身都放下何用覓砭鍼日煖衣猶襲宵長被有稜朝晡三楪飯昏曉一釭燈伴坐跧如几扶行瘦比藤生緣堪入畫寂寞憩松僧繩倚扶枵骨蒲團閣瘁膚事疑償業債形類窘囚拘空劫眞常體浮生幻化軀箇中元不二無語對文殊軟熟羞盤饌芳辛實枕幃候晴先晒席占濕豫烘衣易栗雞皮皺難培鶴骨肥頭顱雖若此虛白自生輝數息憎晨凊伸睂愜晚晴隙塵浮日影忩穴嘯風聲捫蝨天機動驅蚊我相生偶然成一笑栩栩暫身輕貴仕龜鑽筴閒居馬脱鞿冠塵昏舊製帶眼剰新圍堆案書郵少登門刺字稀掩關灰木坐休示季咸機目眚浮珠珮聲塵籟玉簫秋懷潘鬢秃午夢楚魂銷注水瓶花醒吹薪藥鼎潮南柯何處是斜日上廊腰静裏秋先到閒中晝自長門闌疑泄桞尸祝漫庚桑腹已枵經笥身猶試藥方强名今日愈勃窣負東牆汗漬笻枝赤苔封屐齒青有醫延上坐無客抗分庭霽月鑽忩看鳴琴側枕聽莫嗔猿鶴怨岫幌兩年扃視絮勞羣從祇承愧闔家乳泉供水遞金液養丹芽加釀厚如酪旋舂香勝花百端扶老憊無物報投瓜學業荒呻畢歡悰隔笑鹽入秋先複幕過夏亦疎簾門客嗔愁思家人獻吉占尤憐小兒女時報鵲鳴簷贈臨江簡壽玉二首簡攜王仲顯使君書來謁并示孔毅甫夢蟾圖今廟堂五府皆有題字蕭灘逺客扣田廬貽我讀書樓上書千里故情元共月錯云多病故人疎巻中圖畫袖中珍上有三階五朶雲白日青天光範路未饒蟾窟夢紛紜夀櫟前假山成移丹桂於馬城自嘲堂前趣就小嶙峋未許蹣跚杖屨親更遣移花三百里世間眞有大癡人灼艾血忌詳涓日尻神謹避方艾求眞伏道穴按古明堂謝去羣巫祝勝如幾藥湯起來成獨笑一病攪千忙東宫夀詩甲觀秋彌月前星蚤麗天君親重慶日家國中興年英武神機逺温文德宇全摛章森典則㑹道極高堅儉寶躬安履仁端性自然淵沖澄有量海潤浹無邊五學臨函丈三朝拱䆳延頌聲敷政久喜色問安還銅律諧初度桑弧絶舊傳菊催重九近梅占小春先戲綵猗蘭殿宣杯玳瑁筵青宫千億壽長對兩宫前十月朝開爐偶書余病歸二年未能拜埽松楸曩常以此日侍先兄遊洞庭并寫悲感之懷圃芋今年紫籬楓昨日丹開爐修故事聽雨説新寒橘社重遊阻楸行再拜難此時西望眼衰涕不勝彈有懷龔養正好在楚龔子秋來情話稀昨承書素説行侍板輿歸烟水潮平棹風霜歲晚衣幾時眞訪戴莫待雪花霏白髭行四十踰四髭始黃手持漢節臨大荒輿疾歸來皮骨在兩鬢尚作青絲光俛仰行年四十九萬里南馳復西走斑斑頷下㸃吳霜猶可芟夷誑賓友屈指如今又十年兩年憊卧愁風前人生血氣能幾許不待覽鏡知皤然長安後輩輕前輩百方染藥千金賣煩撋包裹夜不眠無奈霞頭出光怪病翁高卧門長扃垂雪􅆴􅆴骨更清兒童不作居士喚喚作堂中老夀星但能之提刑相别十年自曲江逺寄二詩叙舊良厚次韻為謝亦以首章奉懷略道湘南分攜故事末篇自述年來衰病不復故吾也憶昔驂鸞識俊英朱旛繡斧盡能名書隨庾嶺一枝寄句挾韶江九奏成吳粤交馳清夜夢參辰不隔故人情何時重醉金槽曲一洗陽關别恨平濩落枵虛似瓠壺新添雪鬢與雙鬚也知病叟形容變非是仙儒骨相癯歲晚山林如自獻年豐田野亦多娛無端拙恙妨清樂未許扁舟到五湖復以蟾硯歸龔養正夢裏何人歌式微覺來石友在書幃鄭環信美非吾寶趙璧猶全任汝歸渴水雙蟾窺海闊出雲孤月照星稀好將自草三千牘莫與蚍蜉作釣磯大雪書懷天將奇賞發清歡疇昔登臨揷羽翰梅下尋詩騎馬滑松梢索酒倚樓寒閉門老子愁無賴返棹歸來興已闌聊掬玉塵添石鼎自煎魚眼破龍團雪中苦寒戲嘲二絶冥凌分職大間關辛苦行冬强作難費盡無邊風與雪劣能供得一番寒茸氊帳下玉杯寛香裏吹笙醉裏看風雪過門無入處却投窮巷覓袁安雪復大作六言四首奇寒擁被曉枕噩夢披蓑晚江遥想漫天匝地近聽穿幔鳴忩釀成送臘三白功在迎年九秋樵指擔肩相賀飯囊酒甕何憂初報折篁搶地旋聞壓桞堆橋寧敎風過掀舞可惜雨來半銷伶俜凍雀蹲晚噤滲疎梅鎖春有客典衣沽酒何人増價賣薪立春乙巳綵勝金旛夢裏茶槽藥杵聲中索莫兩年春事小忩卧聽東風題徐熙風牡丹二首紫花蘂珠仙馭曉驂鸞道服朝元露未乾天半剛風如激箭綠綃飄蕩紫綃寒白花寒入仙裙粟玉肌無餘全不耐風吹從敎旅拒春無力細看腰支嫋嫋時題黃居寀雀竹圖二首居寀筌之子羣雀歲寒保聚兩鶉日晏忘歸草間豈無餘粒刮地風號雪飛蔓花露下凝碧叢竹秋來老蒼噪雀羣爭何事么禽自囀清篁題張晞顏兩花圖二首晞顏廣漢人趙昌之甥繁杏紅粉團枝一萬重當年獨自費東風若為報答春無賴付與笙歌鼎沸中玉梨雪薄冰輕不耐春雨中愁緒月中眞莫教夢作雲飛去畱伴昭陽第一人題范道士二牛圖道士處州人號范牛中年狂顚人傳其得道此圖自稱中興道士范子珉蓋未顚時所作尤為精妙西疇滌場淨無塵原頭逺牧秋草春一牛疾行離其羣一牛返顧如怒嗔目光炯炯獰而馴㸃綴毫末俱逼眞不顚不狂筆有神妙哉吾宗散仙人石湖詩集巻二十四欽定四庫全書石湖詩集卷二十五宋范成大撰小峨睂并序近得靈璧古石絶似大峨正峰名之曰小峨睂東坡常以名盧山恐不若此石之逼眞也作小峨睂歌以夸之三峨參橫大峨高奔崖側勢倚半霄龍跧虎卧起且伏旁睨沬水沱江朝禹從岷嶓過其下奠山著籍稱雄豪告成歸來兩階舞泗濱錫貢備九韶覽觀此石三歎息髣髴蜀鎭俱岧嶤惜哉擊拊墮簨虛輦送淮海還山椒降商訖周謹呵護磬氏無敢加鐫彫劉項蝸爭鬨靈璧血漂川谷流腥臊水官恐此被染涴氊包席裹吳中逃市門大隱閱千祀苔衣塵網薶孤標尤物顯晦定有數昨者惠顧不待招我昔西遊踏禹迹暑宿光相披重貂十年境落卧遊夢摩挲壁畫雙鬢凋天憐愛山欲成癖特設奇供慰寂寥恍然坐我寶巖上疑有太古雪未消嵌根襞積巧入妙峰頂箕踞貴不驕爐煙雲浮布銀界隙日虹貫凝金橋是時歲杪卧衰病健起放杖驚兒曹龍鍾繞圍喜折屐龜手拂拭寒侵袍太湖未暇商甲乙羅浮天竺均鴻毛小峨之名神所畀永與野老歸漁樵作詩賀我得石友且以併賀兹丘遭煙江叠嶂煙江叠嶂太湖石也鱗次重複巧出天然王晉卿嘗畫煙江叠嶂圖東坡作詩今借以為名此石里人方氏所藏故物非近年以人功雕斵者比尤可貴太湖嵌根藏洞宫槎牙石生奫淪中波濤投隙潄且囓歲久缺罅深重重水空發聲夜鏜鎝中有晴江煙嶂叠誰歟斷取來何時山客自言藏奕葉江上愁心惟畫圖蘇仙作詩畫不如當年此石若並世雪浪仇池何足書我無俊語對巨麗欲定等差誰與議直須具眼老香山來為平章作新記天柱峰天柱峰英石也一峰峭豎特起有昻霄之意天柱本在衡山自黃帝時即以灊山輔南岳漢氏因之遂寓其祭於灊天柱山衡灊蓋皆有天柱而灊名特彰九華鴈蕩若他山亦皆以此名峰不足算也衡山紫蓋連延處一峰巉絶擎玉宇漢家憚逺不能到寓祭􅈞山作天柱我今卧遊長揜關却寓此石充灊山形摹三尺氣萬仞世間培塿何由攀南州山骨孕清淑乳孽砂牀未超俗神奇都賦小崢嶸雷雨飛來伴幽獨哦詩月明清夜闌坐看高影橫屋山摩霄拂雲政如此吾言實夸誰敢删甲辰除夜吟一年三百六十日日日三椽卧衰疾旁人揶揄還歎咨問我如何度四時我言平生老行李蓐食趂程中夜起當時想像閉門閒弱水迢迢三萬里如今因病得疎慵脚底關山如夢中重簾複幕白晝靜戸外車馬從西東若問四時何以度念定更無新與故瓶花開落紀春冬忩紙昏明認朝暮行年六十是明朝不暇自憐聊自嘲婪尾三杯餳一楪從今身健齒牙牢次韻龔養正送水仙花色界香塵付八還正觀不起况邪觀花前猶有詩情在還作凌波步月看元日屋角崢嶸斗柄移案頭蕭索燭花垂與時消息評新藥若節春秋憶舊詩飢飯困眠全體懶風餐露宿半生癡尊前現在休嫌老最後屠蘇把一巵正月六日風雪大作滕六無端巽二癡翻天作惡破春遲邀梅勒桞何功業誰與停杯一問之奇寒何事入芳辰不管燈枝欲試新即日反風吹盡雪東君已費一分春元夕四首粉痕紅㸃萬花攢玉氣珠光寶月團簾箔通明香似霧東君無處著春寒謂吳中剪羅琉璃二燈不夜城中陸地蓮小梅初破月初圓新年第一佳時節誰肯如翁閉戸眠藥爐湯鼎煮孤燈禪版蒲團老病僧兒女强修元夕供玉蛾先避雪鬅鬠落梅穠李趂時新枯木崖邊一任春尚愛鄉音醒病耳隔牆時有賣餳人謂唱賣烏膩糖者去年多雪苦寒梅花遂晚元夕猶未盛開隔年寒力凍芳塵勒住東風寂莫濱只管苦吟三尺雪那知遲把一枝春燈烘畫閣香猶冷湯煖銅瓶玉尚皴花定有情堪索笑自憐無術喚眞眞寄題筠州錢有文明府新昌小道院忠厚平生心學敏明隨處民功江左幕中荒政江西縣裏仁風勿云私淑小邑可以匹休大邦健筆誰能後賦向來江夏無雙題徐熙杏花老枝當歲寒芳蘤春澹泞霧綃輕欲無嬌紅恐飛去題趙昌木瓜花秋風魏瓠實春雨燕脂花綵筆不可寫滴露勻朝霞題易元吉獐猿兩圖二首擇食麕相喚無人意不驚猿啼風動葉機熟兩忘情烏逐山公噪驚麕仰望疑春林無一事獝狘自生悲題張希賢紙本花四首牡丹洛花肉紅姿蜀筆丹砂染生綃多俗格紙本有眞艶常春染根得靈藥無時不春風倚闌與挂壁相伴歲寒中紅梅酒力欺朝寒潮紅上粧面桃李漫同時輸了春風半雞冠號名極形似摹寫與眞逼聊以畫滑稽慰我秋園寂喜沈叔晦至澹若論交味嚶其求友聲江湖幾魚沬風雨一雞鳴舊事休重説新詩莫細評煩將憶勤夢歸對海山橫驚蟄家人子輩為易疎簾二分春色到窮閻兒女祈翁出滯淹幽蟄夜驚雷奮地小忩朝爽日篩簾惠風全解墨池凍清晝賸繙雲笈籖親友莫嗔情話少向來屏息似龜蟾韓尚書新造雲笈七籖信筆天地同浮水上萍羲娥迭耀案頭螢山中名器兩芒屩花下友朋雙玉瓶童子昔曾誇了了主翁今但諾醒醒歸田贏得多無事輸與諸公汗簡青請息齋書事三首覆雨翻雲轉手成紛紛輕薄可憐生天無寒暑無時令人不炎涼不世情栩栩算來俱蝶夢喈喈能有幾雞鳴冰山側畔紅塵漲不隔瑶臺月露清刻木牽􅁝罷戲場祭餘雨後兩相忘門雖有雀尚廷尉食已無魚休孟嘗蝨裏趨時眞是賊虎中宣力任為倀籬東舎北誰情話鷄語鷗盟意却長聚蚋醯邊鬧似雷乞兒爭背向寒灰長平失勢見何晚栗里息交歸去來休問江湖魚有沬但蘄雲水鶴無媒巖扉岫幌牢扃鑰不是漁樵不與開送文季高倅興元素衣京洛悵成緇青鬢江吳喜未絲燭暗不眠談舊事酒闌作惡問行期琴書情話須親戚風雨殘春更别離屈指歸來重一笑埽除門巷著旌麾書懷二絶再送文季高兼呈新帥閻才元侍郎劒關雲棧守非難函谷泥封久未刋今日漢中誰國士莫敎春草上齋壇西出陽關有舊知薰風渌水泛蓮時煩君傳語詩書帥更寄臺城别後詞寄題石湖海棠二首手開芳徑越城頭紅錦屠蘇結綺樓不把萬枝銀燭照淡雲微月替人愁老懶居家似出家園林春色雨沾沙海棠尚自無心看天女何須更散花家人子輩往石湖檢校暮歸南浦回春棹東城掩暮扉兒修雞柵了女挈菜籃歸風力雖欺酒花香尚染衣衰翁牢守舍腸斷釣魚磯枕上聞蒲餅焦曉寒燕雀噤春陰珍重清簧度好音忩色熹微欹枕聽夢成舟檥竹溪深石湖芍藥盛開向北使歸過維揚時買根栽此因記舊事二首竹西歌吹荻花秋遺老垂洟送逺遊羌􅅇夜闌吹出塞當年如此夢揚州萬里歸程許過家移將二十四橋花石湖從此添春色莫把蒲萄苜蓿誇次韻龔養正中秋無月三首詞客幕天清露下老翁卧病破忩中高吟大醉輸公等不見常娥與我同去年怪雨無端甚今歲癡雲亦復然減却新詩酸却酒乘除添得一更眠丙夜清光些子見兒童驚喜强雄夸闌珊高興應無幾恰似春殘看落花殊不惡齋秋晚閒吟五絶好風入簾圖畫響斜照穿隙網絲明檐閒雙雀有時鬬壁下一蛩終日鳴旁若無人䑕飲硯麾之不去蠅登盤天凉睡起枕痕煖日晚慵來香字寒就食遷居蟻墳壤隨風作舍蛛裊絲百年何處用三窟萬事信緣安一枝市聲洶洶鼓催陣日影駸駸潮漲痕消磨意氣黙數息把翫光陰牢閉門中秋昨已等閒過重九今還如夢來霜鬢數莖羞墮幘黃花三度笑空杯老陳道人自云夢被召怍地上主者又常受一貴家供祝之曰他日必來吾家作兒戲贈小頌野人何苦赴官差符使追呼撓道懷幸有于門香積供不如隨喜去羅齋題張戡蕃馬射獵圖陰山磧中射生騎馬逐箭飛如脱兔割鮮大嚼飽何求荐食中原天震怒太乙靈旗方北指掣轡逃歸莫南顧漢家飛將李將軍馬蹄行踏燕然路題趙昌四季花圖海棠梨花醉紅睡未熟淚玉春帶雨阿環不可招空寄凭肩語葵花萱草衞足保明哲忘憂助歡娛欣欣夏日永媚我幽人廬拒霜旱蓮霜天木芙蓉陸地旱蓮草水花雲錦盡不見秋風好梅花山茶月淡玉逾瘦雪深紅欲燃同時不同調聊用慰衰年乙巳十月朔開爐三首石湖今日開爐紙忩銀白新糊童子燒紅榾柮老翁睡煖􅉊毺石湖今日開爐兩壁仍安畫圖萬事篆煙曲几百年毳衲團蒲石湖今日開爐俗家恰似精廬抆涕雖無情緒吟詩却有工夫有歎二首春秋蘭菊殊調南北馬牛異方心醉井蛙海若眼空鵬海鳩枋貧富交情乃見炎凉歲序方成越秦本異肥瘠魯衞何曽弟兄畱簡伯俊我昔賦逺遊萬里無親朋惟君同懷抱相從共茵憑踰嶺穿瘴茅捫參倚枯藤随行一瓶鉢澹如雲水僧火馳炎熱場見此玉壺氷東歸常愧君無力相引繩長材屈小邑果以循吏稱豈不有薦墨翩然支郡丞五溪在何許水駛山崚嶒漫仕不擇地摶扶笑鯤鵬獨有故意長問疾訪姜肱亹亹談昨夢一一記吾曽中年畏離别況我雪鬅鬙此意君自解少畱對青燈枕上有感忩明似月曉光新被煖如薫睡息勻衝雨販夫牆外過故應嗤我是何人夜坐有感静夜家家問戸眠滿城風雨驟寒天號呼賣卜誰家子想欠明朝糴米錢十月二十六日三偈聲聞與色塵普以妙香薫昔汝來迷我今吾却戲君有箇安心法無時不可行只將今日事隨分了今生忩外塵塵事忩中夢夢身既知身是夢一任事如塵石湖詩集卷二十五欽定四庫全書石湖詩集卷二十六宋范成大撰呉歈一首送丘宗卿自平江移㑹稽呉兒與君縁不薄再騎竹馬迎南郭呉兒與君縁復淺坐席纔温旗脚轉東人賦重越吟悲趣了兹段隨朝雞胸竒百鍊當活國君豈獨私呉與越鶴鳴樟橋猿夜啼匈奴未滅家何為功成他年歸結屋好在山花休斬竹宗卿十三年前甞守呉今復来幾年而去越民困於和買蓋有意為蠲減之樟橋宗卿卜築處有山牡丹二本嵗各發百花手植筀竹二十年今一尺圍作舍時悉當伐去皆實錄席上語也贈壽老農圃規模昔共論雲奎卜築又逢君睂菴壽老長隨喜好箇抛梁伏願文十八年前始作農圃堂壽老自睂菴逺來相與度地今雲奎始基又值其入城留觀上梁似非偶然再贈壽老澹齋寂莫澹菴空玉柱金庭一夢中我病君衰猶見在莫嫌俱作白頭翁頃與澹齋兄遊洞庭林屋并澹菴現老睂菴壽老偕今十年矣壽老見過話舊事二澹已為古人雪中聞牆外鬻魚菜者求售之聲甚苦有感三絶飯籮驅出敢偷閒雪脛冰鬚慣忍寒豈是不能扃户坐忍寒猶可忍饑難憂渴焦山業海深貪渠刀蜜坐成禽一身冒雪渾家煖汝不能詩替汝吟啼號升斗扺千金凍雀飢鴉共一音勞汝以生令至此悠悠大塊亦何心詠河市歌者豈是從容唱渭城箇中當有不平鳴可憐日晏忍飢面强作春深求友聲偶箴情知萬法本來空猶復將心奉八風逆順境來欣戚變咄哉誰是主人翁丙午新正書懷十首不用桃符貼畫雞身心安處是天倪行年六十舊厯日汗脚尺三新杖藜祝我賸周花甲子謝人深勸玉東西春風若借筋骸便先渡南村學灌畦新圃在河南名范村瘦骨難勝遇節衣日髙催起趂晨炊病憐楖栗隨身慣老覺屠蘇到手遲一飽但蘄庚癸諾百年甘守甲辰雌莫言此外都無事栁眼梅梢正索詩煮茗燒香了嵗時静中光景笑中嬉身閒一日似兩日春淺南枝如北枝朝鏡畧無功業到午窻惟有睡魔知年來并束牀頭易一任平章濟叔癡窮巷閒門本閴然强將爆竹聒堦前人情舊雨非今雨老境增年是減年口不兩匙休足榖身能幾屐莫言錢埽除一室空諸有龎老家人緫解禪呉諺云一口不能著兩匙厲風翻海雪漫天百計逃寒息萬縁穩作被爐如卧炕厚裁綿旋入聲勝披氊尊前現在瞢騰醉飯後無何爛熳眠斟酌出門髙興盡從教閒却剡溪船被爐綿旋皆新得法老人御冬之具二物尤為要切俗情如絮已泥沾因病偷閒意屬厭鵬鷃相安無可笑熊魚自古不容兼灰藏榾柮多時煖雪壓蔓菁滿意甜温飽閉門吾事辦異時書判指如籖炭熟香濃石鼎煨人言小閤是春臺蕉心翠展一冬在梅藟粉融連夜開肅肅九冰妨發育温温三火䕶恢台養生此外無遺説梨棗元須趂煖栽水芭蕉長三寸在煖閤中經冬不瘁瓶梅亦烘然先拆經過埽軌但幽棲巢穩林深寄一枝栗里歸來窻下卧香山老去病中詩東風馬耳塵勞後半夜雞聲睡熟時俯仰平生盡塵迹恰如腷膊㡬枰棊窻明窻暗篆煙馡珍重晨光與夕暉東院齋鐘披被坐南城嚴鼓岸巾歸幾人霜滑騎朝馬何處燈殘織曉機懶裏若承三昧力始知忙裏事俱非此篇敘蚤眠晏起之事殊方節物記吾曾海北天西一瘦藤烏欖雞㯽甞老酒酥花芋葉試新燈瘴雲度嶺濃如墨邊雪窺窻冷欲冰閒展兩鄉圖畫看卧遊何必減深登此篇記桂林成都元日舊事㯽欖皆椒盤中物老酒十數年不壊者滴酥為花熬芋為栁葉三夕張燈如上元上下句分記廣蜀雲露并序予素不能飲病又止酒比得佳釀法客以雲露名之取吉雲五露飲之則老者少病者除之意也乃復濡脣且為賦詩飲少甞遭大户嗤病中全是獨醒時三年魯望自憐賦萬祀淵明真止詩破戒忽傳雲露法賞心仍把雪梅枝一杯未問長生事先罥蛛塵藥裏絲陸魯望好飲病甫里三年作自憐賦賔至潔壺置觴而已丙午新年六十一嵗俗謂之元命作詩自貺嵗復當生次星臨本命辰四人同丙午初度再庚寅長狄名猶記沙隨㑹若新童心仍竹馬暮境忽蒲輪鏡裏全成老尊前略似春三年歸汶上千日卧漳濵剛長交新泰隂消脱舊屯網蛛縈藥裏竇犬吠醫人窻下烏皮几田間紫領巾鯢淵方止水鯤海任揚塵波匿觀河見維摩示病身顰端還一笑黙識幻中真文潞公詩云四人三百七十嵗汎是同生丙午年僕與今丞相王公樞使周公參政錢公皆丙午人頃皆同朝故用此事稍的也丙午人日立春屈指癸卯孟夏晦得疾恰千日矣戲書百年能有幾春光只合都將付醉鄉衰病豁除千日外尚餘三萬五千場春困二絶呉俗立春日兒童以春困相呼以掉頭不應者為黠綵花生菜又新年節物人情已可憐不待春來呼我困四時何日不堪眠諾惺菴裏呼春困特地回頭著耳聽若解昏昏安穩睡主翁方始是惺惺立春大雪招親友共春盤坐上作積雪錮萬瓦雲容如死灰豈惟梅栁寒小槽冰去聲春醅東風乃多事仍將六花來兒女曉翻餅呵手把一杯菘甲剪翠羽韭黄㔃金釵齒牙幸牢潔對案心眼開華年惜節物況此霜鬢摧如何千日病三見寅杓回旁人不堪憂我心猶始孩衰翁豈知道癡絶㤀形骸化兒任惡劇歡伯有竒懷餘寒㑹退聽一笑當安排嚴子文以春雪數作用為瑞不冝多為韻賦詩見寄次韻同雲癡不埽梅栁春到遲笙歌煖寒㑹當任主人為圍尺庸何傷袤丈乃非瑞郢中姑度曲山左已驅癘世無辟寒香誰能不龜手鄰舍索米歸衾稠無恙不貧人寒切骨無地兼無錐安知雙綵勝但寫入春宜販夫博口食奈此不售何無術慰啼號汝今一身多詠呉中二燈琉璃毬龍綜繅冰繭魚文鏤玉英雨絲風外縐雲網日邊明叠暈重重見分光靣靣呈不深閒裏趣爭識箇中情萬眼羅弱骨千絲結輕毬萬錦裝綵雲籠月魄寳氣繞星芒檀㸃紅嬌小梅粧粉細香等閒三夕看消費一年忙元夕後連隂問訊東風幾日來冷煙寒霧鎻池臺埽空積雪翻成雨收盡殘燈未見梅夜飲厭厭非老伴春隂漠漠是愁媒誰能腰鼓催花信快打凉州百面雷次韻嚴子文見寄雨雲濃壓屋山頭詩句端來寫客憂雷電已將金薤取瓊瑶難報木𤓰投無心我正銘三住有意君堪話四休何日尋春同歩屧先教啼鳥說來由再次韻述懷約子文見過灰木心形雪滿頭鶴鳬長短不悲憂瓮畦純白無機械蒲局裊盧任博投若愛陶陶并兀兀先須莫莫與休休箇中情話誰能共雞黍明當挽仲由寄題郫縣蘧仙觀四楠蘧仙手植甞有丹光現其杪沉犀浦上舊仙蹤老木長春翠埽空敢請丹光來萬里為扶雲嶠駕飛鴻春來風雨無一日好晴因賦瓶花二絶滿插瓶花罷出遊莫將攀折為花愁不知燭照香薰看何似風吹雨打休酒冷花寒無好懷柴荆終日為誰開三分春色三分雨疋似東風本不來寄題永新張教授無盡藏古來誰道四并難對境心空著處安要識見聞無盡藏先除夢幻有為觀削平丘垤孤峯峻撒去籓籬萬象寛快誦老坡秋望賦大千風月一毫端寄題莫氏椿桂堂莫氏五子皆登科居崇德縣君不見衣冠盛事今猶昔前說燕山後崇徳聯翩五組帶天香世上籯金賤如礫他年詩禮到雲來日日髙堂稱壽杯桂長孫枝椿不老却比竇家應更好春晚即事留游子明王仲顯繡地紅千㸃平橋緑一篙楝花來石首榖雨熟櫻桃笑我生塵甑慚君有意􅂁故人能少駐門徑久蓬蒿留游子明得得跫音喜悤悤笑口開牢愁攻易破歸夢挽難廻我已踈茶椀君今減酒杯不知乗興棹更得㡬囘來初夏三絶呈游子明王仲顯東君不解惜芳菲料峭寒中一夢非剪盡牡丹梅子綻何須風雨送春歸一簾芳樹緑蔥蔥胡蝶飛來覓綺叢雪白荼䕷紅寳相尚攜春色見薰風送春迎夏未聞雷日日斜風細雨來不是故人能裹飯柴門雖設為誰開送王仲顯赴瓊莞三徑蓬蒿春雨肥微君誰與開柴扉電光射牛書過目虹氣干斗酒淋衣十年五别嵗月老一方萬里音塵稀誰云滄海斷地脉莫信天南無鴈飛梅雨五絶梅雨暫收斜照明去年無此一日晴忽思城東黄篾舫卧聽打鼓踏車聲乙酉甲申雷雨驚乗除却賀芒種晴插秧先插蚤秈稻少忍數旬蒸米成呉農忌五月甲申乙酉雨雨則大水諺云甲申猶自可乙酉怕殺我風聲不多雨聲多洶洶曉衾聞浪波恰似秋眠隱静寺玉霄泉從牀下過繁昌隱静寺方丈山後玉霄泉自极閣下過最為佳致千山雲深甲子雨十日地濕東南風静裏壺天人不到大輪飛出黙存中道家東向坐想日出以煉氣雨霽雲開池面光三年魚苖如許長小荷拳拳可包鮓晚日照盤風露香芒種後積雨驟冷三絶一菴濕蟄似龜藏深夏暄寒未可常昨日蒙絺今挾纊莫嗔門外有炎凉梅黄時節怯衣單五月江呉麥秀寒香篆吐雲生煖熱從教窻外雨漫漫梅霖傾瀉九河翻百瀆交流海面寛良苦呉農田下濕年年披絮插秧寒崑山農人梅雨時著毳絮以耘秧嵗以為常東宫壽詩再造炎圖撫太寧龍樓毓德㑹千齡三宫叠矩深邦本雨曜重光炳帝庭自古東明陪出日祇今南極是前星鈞天嵗嵗家人禮長對瑶階第四蓂並世勲華照古今朱明綵服侍尊臨邦家大慶重親飬社稷元良萬國心菊露壺觴秋色正桂風殿閣月香深欲知天序無疆處銅律聲中治世音寄題漢中新作南樓二首我作籌邊倚半霄西山雲雪照弓刀如今且說南樓勝應共漢壇相對髙甲子周天事好還關河響動劒光寒秦川草木多如薺時倚樓闌直北看次韻李子永見訪二首混俗休超俗居家似出家有為皆影事無念即生涯莫覓安心法翻成揑目花作糜須榖粟千劫漫炊砂有意能停棹多情易憶家清詩穿月脇逺夢繞天涯雨蝶衣濡粉秋蚊喙吐花新凉宜小駐談笑有丹砂自詠瘦悴皮下多無肉秋來瘦不禁骨稜春焙銙筋蹙海山沉蟣蝨從何有蚊蠅枉見侵惟餘老笻杖相伴兩虛心石湖詩集巻二十六欽定四庫全書石湖詩集卷二十七宋范成大撰四時田園雜興六十首并引淳熈丙午沉疴少紓復至石湖舊隠野外即事輒書一絶終歳得六十篇號四時田園雜興栁花深巷午雞聲桑葉尖新緑未成坐睡覺來無一事滿窓晴日看蠶生土豪欲動雨頻催萬草千花一餉開舎後荒畦猶緑秀鄰家鞭筍過牆來髙田二麥接山青傍水低田綠未耕桃杏滿村春似錦踏歌椎鼓過清明老盆初熟杜茅柴携向田頭祭社來巫媪莫嫌滋味薄旗亭官酒更多灰社下燒錢鼓似雷日斜扶得醉翁囬青枝滿地花狼籍知是兒孫鬬草來騎吹東來里巷喧行春車馬閙如煙繫牛莫礙門前路移繫門西碌碡邉寒食花枝揷滿頭蒨裙青袂幾扁舟一年一度遊山寺不上靈巖即虎丘郭裏人家拜埽囬新開醪酒薦青梅日長路好城門近借我茅亭煖一杯歩屧尋春有好懐雨餘蹄道水如杯隨人黄犬攙前去走到溪邉忽自廽種園得果厪償勞不奈兒童鳥雀搔已揷棘針樊筍徑更鋪漁網盖櫻桃吉日初開種稻包南山雷動雨連宵今年不欠秧田水新漲看看拍小橋桑下春蔬綠滿畦松心青嫩芥薹肥溪頭洗擇店頭賣日暮裹鹽沽酒歸右春日田園雜興十二絶紫青蓴菜卷荷香玉雪芹芽㧞薤長自擷溪毛充晚供短蓬風雨宿横塘湖蓮舊蕩藕新翻小小荷錢没漲痕斟酌梅天風浪𦂳更從外水種蘆根胡蝶雙雙入菜花日長無客到田家雞飛過籬犬吠竇知有行商來買茶湔裙水滿緑蘋洲上已㣲寒懶出遊薄暮蛙聲連曉閙今年田稻十分秋吴下以上巳蛙鳴則知無水災新綠園林曉氣凉晨炊蚤出看移秧百花飄盡桑麻小夾路風來阿魏香三旬蠶忌閉門中鄰曲都無歩往蹤猶是曉晴風露下采桑時節暫相逢汙萊一稜水周圍歳嵗蝸廬没半扉不看茭青難護岸小舟撐取葑田歸茅針香軟漸包茸蓬甘酸半染紅采采歸來兒女笑杖頭髙挂小筠籠榖雨如絲復似塵煮瓶浮蠟正嘗新牡丹破蕚櫻桃熟未許飛花減却春雨後山家起較遲天窓曉色半熹㣲老翁欹枕聽鶯囀童子開門放燕飛海雨江風浪作堆時新魚菜逐春囬荻芽抽筍河魨上楝子開花石首來烏鳥投林過客稀前山煙瞑到柴扉小童一棹舟如葉獨自編䦨鴨陣歸右晚春田園雜興十二絶梅子金黄杏子肥麥花雪白菜花稀日長籬落無人過惟有蜻蜓蛺蝶飛五月吴江麥秀寒移秧披絮尚衣單稻根科斗行如塊田水今年一尺寛二麥俱秋斗百錢田家唤作小豐年餅爐飯甑無饑色接到西風熟稻天百沸繰湯雪湧波繰車嘈囋雨鳴簔桑姑盆手交相賀綿繭無多絲繭多小婦連宵上絹機大耆催稅急于飛今年幸甚蠶桑熟留得黄絲織夏衣下田戽水出江流髙壠翻江逆上溝地勢不齊人力盡丁男長在踏車頭晝出耘田夜績麻村荘兒女各當家童孫未解供耕織也傍桑隂學種𤓰槐葉初勻日氣凉蔥蔥䑕耳翠成雙三公只得三株看閒客清隂滿北窓黄塵行客汗如漿少住儂家潄井香借與門前磐石坐栁隂亭午正風凉千頃芙蕖放棹嬉花深迷路晚忘歸家人暗識船行處時有驚忙小鴨飛采菱辛苦廢犂鉏血指流丹鬼質枯無力買田聊種水近來湖面亦収租蜩螗千頃沸斜陽蛙黽無邉聒夜長不把癡聾相對治夢魂争得到藜牀右夏日田園雜興十二絶把菊垂珠滴露紅兩蛩相應語莎叢蟲絲罥盡黄葵葉寂歴髙花側晚風朱門巧夕沸歡聲田舎黄昏静掩扄男解牽牛女能織不須徼福渡河星橘蠧如蠺入化機枝間垂繭似蓑衣忽然蛻作多花蝶翅粉纔乾便學飛静看簷蛛結網低無端妨礙小蟲飛蜻蜓倒挂蜂兒窘催唤山童為解圍垂成穡事苦艱難忌雨嫌風更怯寒牋訴天公休掠剰半償私債半輸官秋來只怕雨垂垂甲子無雲萬事宜穫稻畢工隨曬榖直須晴到入倉時中秋全景屬潜夫棹入空眀看太湖身外水天銀一色城中有此月眀無新築場泥鏡面平家家打稻趂霜晴笑歌聲裏春雷動一夜連枷響到眀租船滿載候開倉粒粒如珠白似霜不惜兩鍾輸一斛尚贏糠覈飽兒郎菽粟瓶罌貯滿家天教将醉作生涯不知新滴堪篘未今歳重陽有菊花細𢷬棖虀買鱠魚西風吹上四腮鱸雪鬆酥膩千絲縷除却松江到處無新霜徹曉報秋深染盡青林作纈林惟有橘園風景異碧叢叢裏萬黄金右秋日田園雜興十二絶斜日低山片月髙睡餘行藥繞江郊霜風掃盡千林葉閒倚笻枝數鸛巢炙背檐前日似烘煖醺醺後困䝉䝉過門走馬何官職側㡌籠鞭戰北風屋上添髙一把茅宻泥房壁似僧寮從教屋外隂風吼卧聽籬頭響玉簫松節然膏當燭籠凝煙如墨暗房櫳晚來拭盡南窓紙便覺斜陽一倍紅乾髙寅缺築牛宫巵酒豚蹄酹土公牯㹀無瘟犢兒長眀年添種越城東放船閒看雪山晴風定竒寒晚更凝坐聽一篙珠玉碎不知湖面已成氷撥雪挑來踏地菘味如宻藕更肥醲朱門肉食無風味只作尋常菜把供榾柮無煙雪夜長地爐煨酒煖如湯莫嗔老婦無盤飣笑指灰中芋栗香煮酒春前臘後蒸一年長饗甕頭清廛居何似山居樂秫米新來禁入城黄紙蠲租白紙催皂衣旁午下鄉來長官頭腦冬烘甚乞汝青錢買酒廽探梅公子欵柴門枝北枝南總未春忽見小桃紅似錦却疑儂是武陵人村巷冬年見俗情鄰翁講禮拜柴荆長衫布縷如霜雪云是家機自織成右冬日田園雜興十二絶自晨至午起居飲食皆以牆外人物之聲為節戲書四絶巷南敲板報殘更街北彈絲行誦經已被兩人驚夣斷誰家風鴿闘鳴鈴菜市喧時窓透明餅師叫後藥煎成閒居日出都無事惟有開門掃地聲北砦教囬撾鼓逺東禪飯熟打鐘頻小童三唤先生起日滿東窓煖似春起傍東窓手把書華顛種種不禁梳朝餐欲到須巾裏已有重來晚市魚舫齋信筆燕居故可樂病卧翻可憐身閒儻更健其人半神仙既無揚州鶴龍種任吾年南齋深而明略似西江船船中何所有藥氣雜爐煙親朋稀老伴暫來即飄然秋蠅獨戀戀終朝相撲緣霜晴日色濃窓紙烘春妍但愁添眼花瞑坐聊參禪困從定中生瞢騰夢相牽三昧未得力十魔方現前欠伸付一笑朽腐難琱鐫東藍午齋動風順鐘鼓傳家人亦相呼趣具先生餐牛呞能幾何蟬腹易便便此日雖可惜姑付食與眠病中不復問節序四遇重陽既不能登髙又不觴客聊書老懐四時變遷翻覆手百卉於人亦何有騷客顛詩亦狂酒強惜黄花愛重九少年習氣似陶公采采金英滿衣袖携壺木末最關情欹㡌風前幾搔首饞吻偏憐粽栗香新衣不管囊萸臭貪将節物趁遨頭肯向賔筵稱病叟如今衰颯悟空華現在去來飛電走登臨舊迹如夣斷觴咏故人多骨朽百年長短隨隙駒萬化陳新直芻狗不堪把玩堪一笑安用歳時歌拊缶家人亦復探新篘插花洗醆為翁夀蒲團困坐眼慵開莫把故情看老醜挽鬚兒女太癡生更問今年有詩否閶門初泛二十四韻淳熙丙午重九後十日家人輩以余久病適新修小舫勸扶頭一出以醸袚屯滯遂至北城檢校桃花塢出關傍漕河望楓橋横塘中路而還故有即事詠景唐律之作好在馳煙路平生載酒行摧蔵身久病契闊歳頻更昨夜燈花曉今朝稻把晴出門新夣境觸目舊詩情水逺推篷眩天寛倚柁驚轉灣添縴挽罨岸併篙撐舫後裝兒女艫前酌弟兄醅香新麴嫩茗味小春輕紅皺分霜果黄蔫撚夕英纈林踈露屋朱閣靜臨城桃塢論今昔楓橋管送迎山腰樵擔動木末酒旗明竟日窑煙直中流塔影横數帆殘照滿一笛暮江平㬠網楓邉桁牽罾栁際棚岫雲縈石住田水穴堤鳴過渡牛歸速穿籬犬吠獰魚寒猶作陣鴈逺更聞聲急㯭潮痕出踈鐘暝色生鄰翁欣問訊逋客愧寒盟一昨成歸卧於今負耦耕生涯都塌颯心曲漫崢嶸猿鶴休多怨菰蓴尚可羹藥囊吾厭苦扶憊且班荆小春海棠來禽東君好事惜年華偏愛荒園野老家一任西風管揺落小春自管數枝花丙午東宫夀詩國絫丁年盛天開甲觀祥黄離増煥炳赤伏衍明昌一日三天見元辰萬國康姿神輝玉裕徳業燦金相書聖規宸藻文心儷漢章乾坤參久大日月並升常祖武瞻興慶親庭拱未央晨昏兩慈壼詩禮一賢王道統家傳正炎圗國本強桑弧仍榖旦銅律又清商舊事蘭猗殿新凉桂子香黄華先浥露青女緩行霜史賀星同軌農歌稼滌塲與齡占夢帝多祜叶思皇磐石重山固靈源少海長三宫同夀域歳歳頌無疆重陽後菊花二首寂莫東籬濕露華依前金靨照泥沙世情兒女無髙韻只看重陽一日花過了登髙菊尚新酒徒詩客斷知聞恰如退士垂車後勢利交親不到門驟寒吟九月竒寒前未聞巷南巷北無行人𠖇凌盡用大冬手肯為歳華留小春隂風吹雨作氷屑駞裘如鐵綿裘折可憐籬下木芙蓉不獨宜霜更宜雪重陽後半月天氣温麗忽變竒寒晦日大雪鄉人御冬之計多未辦狂颷吹小春刮面劇劍鋩雲氣潑濃墨午窓變曛黄六花大如掌浩蕩來無鄉青女正熟睡不記行新霜寒暑故宻移滕巽乃爾狂南鄰炭未買北鄰綿未裝敢論酒價湧束薪逾桂芳豈不解蚤計善舞須袖長頻年田薄収十家九空嚢被凍知不免但恨太怱忙今朝復何朝晴色挂屋梁人物各解嚴兒童笑相将熈如谷黍温免作溝木僵兩鄰報無恙為汝歌慨慷戲詠絮帽簡伯俊傳此様睡中甚禦寒氣尖斜細撮似兜鍪𦂳護風寒煖白頭不解兵前當箭鑿解令曉枕睡􅋜􅋜雪中送炭與龔養正立春前五日誰與幽人煖直身筠籠衝雪送烏薪煩君笑領婆歡喜探借新年五日春代門生作立春書門貼子詩四首煖日黄金栁光風白玉梅門䦨開夀域人物滿春臺有喜何須藥無塵即是仙壺中春日月聊數八千年草木霑雲露峰巒近璧奎新春行樂處南北共花溪日月添書帙湖山引杖藜賸周花甲子多醉玉東西石湖詩集巻二十七欽定四庫全書石湖詩集巻二十八宋范成大撰送聞人伯卿赴銅陵雪壓關山晝掩扄故人何事短長亭折腰直為瓶無粟便腹猶憐笥有經牒訴塵埃頭更白簡編燈火眼終青可憐東壁輝光外寥落江湖處士星重送伯卿雪花來無時入春遂三作氷柱凍不解去地纔一握東風畏竒寒未敢破梅蕚已僵員嶠蠺那問紇干雀萬徑無行蹤扣户驚剥啄故人竹葉舟歳晚夣漂泊自云飢所驅豈不念丘壑經誼金華省文采石渠閣平生百未試墨綬嚇猿鶴取舎一熊掌得䘮兩蝸角不嫌干進鈍俯仰無愧怍低囬簿書叢萬卷無處著惜哉小舉袖負此不龜藥頗聞江臯縣訟簡民氣樂政成松竹林詁訓緝家學廼翁力菑畬待子収播穫三年此書出衆說眇螢皭持歸許窺觀慰我久離索今朝雲潑墨霰雨縱横落檣竿挽不住帆峭北風惡惡難忘昆弟易散清夜酌怱怱别知賦掩涕倚郛郭送夀老徃雲間行化天平船子過華亭舎衛城中次第行留取鉢盂歸院洗東巖新出一泉清次韻知府王仲行尚書鹿鳴燕古風昔人重逺行供帳餞出祖矧今燕嘉賔宜有贈行語府公文章公青紫拾芥取聨翩二百言字字勸稽古戒之書魚蠧勉以雲鵬舉作霖要實用洗兵嫌不武諸生承意氣脫迹蛻農圃明年一聲雷幽蟄起平楚班行入鵷鷺榜貼綴龍虎囬頭謝府公公言非漫與府公亦廟廊來蒞瓊林俎千載吴趨行愁絶白紵舞我聞有此作病卧嗟未睹今晨梅驛動副墨到衡宇調髙瑟音希芒寒劍光吐誰云鹿鳴廢正頼廣㣲補當年羣玉㑹方駕肅飈羽倡酬久寂莫解后相勞苦世故萬浮雲交情一舊雨誰當将詩壇君實東道主苦寒六言簷氷低挂䦨角隙雪斜侵坐隅春後一寒如此梅花有信來無丁未春日瓶中梅殊未開二首暖閤無人到寒枝為我横情鍾吹蘂破靜極覺香生老去魂収斷春來眼且明逃禪時索笑百匝傍窓行夜雪臘前凍朝陽春後蘇人憐踈蘂瘦花笑病翁臞露白能多少尋春似有無詩催全不力煮水换銅壺再題瓶中梅花園林籬落凍芳塵南北枝間玉蘂皴風袂挽香雖淡薄月窓横影已精神雪霜春事年年晚今古詩情日日新鐵石如翁猶索句真能嚼蠟對横陳王仲行尚書録示近詩聞今日勸農靈巖次韻紀事館蛙宫殿壓雲頭自昔登臨隘九州雪浪長風三萬頃蒼煙古木二千秋賔僚誰伴作詩苦父老競傳敷政優想見歸驂穿夜市月邉燈火滿西樓仲行再示新句復次韻述懐神仙懶學古浮丘祖意慵參老趙州四壁塵埃心似水一生風露􅁂先秋病衰謹謝吴中客技拙甘同楚國優斥鷃蓬蒿元自足世間何必卧髙樓李子永赴溧水過吴訪别戲書送之萬壑斷流氷塞川千巖森玉雪漫天怱怱葉縣雙鳬舄换却山隂訪戴船犯寒書劍出春蘿風雪橋邉得句多牒訴繽紛似煙海梅花時節奈君何民病春疫作詩憫之乖氣肆行傷好春十家九室寒螀呻隂陽何者強作孽天地豈其真不仁去臘竒寒衾似鐵連年薄熟甑生塵疲甿憊矣可更病我作此詩當感神題夫差廟縱敵稽山禍已胎垂涎上國更荒哉不知養虎自遺患只道求魚無後災夢見梧桐生後圃眼看麋鹿上髙臺千齡只有忠臣恨化作濤江雪浪堆翻襪菴夜坐聞雨閒門冷落靜無譁小閣簾幃宻自遮日晚課程丹竈火夜深光景佛燈花人生寕有病連歳身世略如僧在家歩屧尋春非老伴任教風雨唤雷車睡起憨憨與世共兒嬉兀兀從人笑我癡閒裏事忙晴曬樂静中機動夜争棋心情詩卷無佳句時節梅花有好枝熟睡覺來何所欠氊根香軟飯流匙賞海棠三絶芳春隨分到貧家兒女多情惜歳華聊為海棠修故事去年燈燭去年花燭光花影兩相宜占斷風光二月時但得常如妃子醉何妨獨欠少陵詩憶向宣華夜倚䦨花光妍煖月光寒如今蹋颯嫌風露且只銅瓶滿插看午窓遣興家人謀過石湖雲日初収破柱雷小窓坐穏興悠哉燻爐花氣朝酲解茶鼎松風午夣廽謝客門䦨風動竹惜春時節雨肥梅畫船破浪亦一快聞道湖光如潑醅將至石湖道中書事水緑鷗邉漲天青雁外晴栁堤隨草逺麥隴帶桑平白道吴新郭蒼煙越故城稍聞鷄犬閙僮僕想來迎三月十六日石湖書事三首春事日以䦨暑隂正清美拖笻入林下秀緑照衣袂盧橘梅子黄櫻桃桑椹紫荷依浪花顫筍破苔色起風日収宿隂物色有新意鄰曲知我歸爭來問何以病惱今有無加飯日能幾掀髯謝父老衰雪已如此種木二十年手開南野荒苒苒新歳月依依舊林塘汙萊擅下濕岑蔚驕衆芳菱母尚能瘦竹孫如許長憶初學圃時刀笠冒風霜今兹百不堪裹㡌人扶将龍鍾數能來猶勝兩相忘湖光明可鑑山色浄如沐閒心惬舊觀愁眼快竒矚依然北窓下凝塵滿書簏訪我烏皮几拂我青氊褥荒哉賦逺逰幸甚遂初服老紅餞餘春衆緑自幽馥好風吹晚晴斜照入踈竹兀坐胎息匀不覺清夢熟或勸病中不宜數親文墨醫亦歸咎題四絶以自戒末篇又以解嘲作字腕中百斛吟詩天外片心習氣吹劍一吷病軀垂堂千金意馬塲中汗血隙駒影裏心灰吉蠲筆墨安用付與蛛絲壁煤詩成徒能泣鬼博塞未必亡羊剛将妄言綺語認作錦心繡腸師熸尚合餘燼羮熟休吹冷虀解酲縱無五斗且復月攘一鷄送遂寧何道士自潭湘歸蜀塵埃波浪幾東西歸去丹瓢挂杖藜戊己爐中真造化功成分我一刀圭書劍飄然席未温火雲撲地暑煙昏山黄水濁湖南路竹月荷風憶范村立秋二絶戴楸葉食𤓰水吞赤小豆七粒皆吴中節物也三伏熏蒸四大愁暑中方信此生浮歳華過半休惆悵且對西風賀立秋折枝楸葉起園𤓰赤小如珠嚥井花洗濯煩襟酬節物安排笑口問生涯秋雷歎吴諺云秋孛轆損萬斛謂立秋日雷也立秋之雷損萬斛吴儂記此占年榖沃哉豐隆無藉在政用此時鳴孛轆向來夏旱連三月吁嗟上訴聲滿屋訟風未慗復占雷助魃為妖天更酷我雖閒寂忝祠史家請官供尚倉粟塵甑貧交滿目前卒歳将何救枵腹但願吴儂言不騐共割黄雲炊白玉天人逺近叵戲論禆竈安能尸禍福用漢中帥閻才元侍郎韻送樊子南西歸兼呈侍郎萬里山巔與水涯春風招看杏園花向來科第直溷子此去文章應滿家休學逰仙窮越嶲且從知已控襃斜南樓東望當思我藥裹堆中兩􅁂華子南嘗自岷山西逰窮探勝境多見異人南樓侍郎新作書樊子南逰西山二記後仙山草木鎻卿雲不到花平不離塵十丈牡丹如錦盖人間姚魏却争春右牡丹瓶春晚娑羅百葉開仙翁精舍長蓬萊朝元未罷門深閉不管人間有客來右大面題天平夀老方丈二十三年再入山此山於我有前縁時人不用憐衰病天與丹房一線泉夀老近於半山石壁之中得泉眼如筯清泉如一線涓涓而出大旱不増減欲為余作小菴於泉傍以煉丹云再逰天平有懐舊事且得卓菴之處呈夀老訪舊光隂二十年殘僧相對兩依然木蘭已老無花發石竹依前有麝眠萬户直須龜手藥一龕何用買山錢從今半座湏分我共說昏昏一覺禪重九日行營夀蔵之地家山隨處可行楸荷鍤攜壺似醉劉縱有千年鐵門限終須一箇土饅頭三輪世界猶灰刦四大形骸強首丘螻蟻烏鳶何厚薄臨風拊掌菊花秋得夀蔵於先隴之傍俯酬素願感槩交懐宻邇松楸地一隅㑹心何必問青烏亢宗雖愧鎮公子没世尚從先大夫京兆漢阡賢問望邢山鄭冢儉規模家庭遺訓焄蒿在不學邠卿畫古圗晚登木瀆小樓萬象當樓黼繡張䦨干一士立蒼茫雲堆不動山深碧星出無多月淡黄宿鳥盡時猶數㸃歸鴻驚處更斜行松陵政有鱸魚上安得長竿坐釣航題秋鷺圗昨夜新霜冷釣磯緑荷消瘦碧蘆肥一江秋色無人問盡屬風標兩雪衣送蘇秀才歸永嘉再入庭闈再入山偷閒百日了金丹他年㧞宅上升後休道使親忘我難大道凝神術養形形神俱煉始功成勸君觀妙還觀徼先作頑仙地上行東宫夀詩丁未年有赫題期盛無疆嗣歴昌中興歸濬哲重慶啟元良兩亥開基逺三丁系統長恭惟藝祖太宗皇帝元命皆在亥今太上主上殿下元命皆在丁帝咨同物瑞人卜降年祥離日融雙照乾天秉少陽晨昏周内寢詩禮舜巖廊極右辰居煥心前火徳光與齡偕聖父徳夀協虚皇銅律風占兊瑶山樂奏商蓂芳鄰五位菊色麗中央視膳斑衣拱傳觴玉契將宸楓霜獻葉仙桂月輸香薰炷争延祝吟牋曷讚揚形容仁與孝歩障有雲章送同年朱師古龍圖赴潼川杏園耆舊如晨星白頭相對眼故青奉常禮樂照東蜀十年清名留漢廷蜀人減估天恩厚髙議清隂猶記否邇來聞道更蠲除此段始終君一手歸見岷峨無愧詞父老笑迎還歎咨賈生未可去宣室屯膏一州誰謂宜魏闕江湖關出處招頭不用催鳴㯭遥知夢境尚京塵啞咤滿船聞魯語蜀士仕於朝者所買婢妾例不肯隨歸獨師古家無一人肯相舎傳以為竒事蜀人以中原語音為魯語題趙希逺案鷹圖學射春山萬嵗湖牙門列騎巻平蕪如今黃土原邊夢猶識呼鷹嗾犬圖題米元暉吳興山水橫卷道塲山麓接何山影落苕溪浸碧瀾只欠荷花三十里橛頭船上把漁竿圍田歎四絶萬夫陻水水乾源障斷江湖極目天秋潦灌河無洩處眼看漂盡小家田山邉百畆古民田田外新圍截半川六七月間天不雨若為車水到山邉壑鄰罔利一家優水旱無妨衆户愁浪說新収若干稅不知逋失萬新収臺家水利有科條膏潤千年廢一朝安得能言兩黄鵠為君重唱復陂謡素羮氊芋凝酥敵少城土藷割玉勝南京合和二物歸藜糝新法儂家骨董羮夜雨燭花垂穗伴空齋心事如灰入壮懐老倦更䦨惟熟睡任他踈雨滴空堦野景菰蒲聲裏荻花乾鷺立江天水鏡寛畫不能成詩不到筆端無處著荒寒除夜地爐書事節物閒門裏人情老境中雁聲凌急雨燈影戰斜風糟䤑新醅白柴堆軟火紅家人忺夜話我已困䝉葺吴人酌酒瓮浮醅謂之撆䤑酒之精英也元日立春感歎有作二首元日兼春日霜寒又雪寒併煩傳菜手同捧頌椒盤疊膝稀穿履扶頭􅂴正冠五年如此度寧得諱衰殘元日兼春日閒身是老身行年申直戊交運丑支辛豈敢綦安佚聊希刮鈍屯童兒看書户把筆已如神古鼎作香爐雲雷縈帯古文章子子孫孫永奉常辛苦勒銘成底事如今流落管燒香偶書揑目華中影現身有為皆妄懶方真已甘搰搰勤為圃休向滔滔苦問津書至五千空拄腹錢非十萬不通神君看汗簡沉碑者隨水隨風幾窖塵太上皇帝靈駕發引輓歌詞六首紹運鍾陽九興王撫半千斷鼇媧立極翔鳯漢中天宵旰三星紀希夷十閏年聲容彌宇宙浯石不勝鐫自将吴津騎誰嬰泰一鋒旄頭連夜落京觀隔江封舞武三成備書文九譯重修攘遺䇿在嗣聖續車攻簫勺妖氛静甄陶叶氣還春囬慈殿駕天作祐陵山開闢風雲惨登平日月間艱難雖獨瘠夀域徧人間傳聖家人禮凝神象帝先勲華今歷數汾社古山川衆父尊歸父中天更有天夀宫何所厭亟上白雲仙帝業雖天廣皇心本谷虚神應游混沌夢不返華胥挍徳難涯涘銘功總緒餘誰能言大道第入四墳書文徳堯新廟威靈禹舊山海門賔羽衛地軸啟雲關無路攀仙駕當年拱聖顔小臣衰疾淚空望帝鄉澘别擬太上皇帝輓歌詞六首不進身濟投艱業時乗撥亂機荆榛荒帳殿風雨頮戎衣有日臨黄道無星彗紫㣲至今淮海上猶詠六龍飛太上皇帝初載御製詩云六龍轉淮海萬騎臨吴津大孝天孚佑精誠敵可摧龍楯遷座至騩馭及泉囬永祐千章木慈寜萬夀杯古今無此事絶徳詔方來歛福開皇極儲祥握赤符烽煙銷紫塞耕鑿奠黄圖遺誥之下淮北父老聞而涕泣曰太上皇帝真主也南北講和實使天下百姓得免干戈塗炭之苦洗甲民安枕垂衣國覆盂有生何以報夀域亘綿區與子傳神器承家得聖人堦庭天下養壺嶠海中春四葉斑衣樂三加玉册新夀宫如帝所何必上霄晨舞羽修文後投歌講藝時天章雲漢麗國典日星垂麟絶仲尼筆猿啼神禹碑傷心河洛水無處問龍龜甫賀蠅傳赦俄驚鶴馭風首山銅鼎就前殿玉巵空日豈揮戈及天無鍊石功如何千萬夀不待九齡終送許耀卿監丞同年赴靜江倅四絶南國春深雁欲囬湘江花浪一帆開知君不為驂鸞去直為淵明五斗來羅帶江流碧玉峰舊游如夢一星終煩披蘚石尋題字定有人能記此翁鴈塔交親比斷金故人歳晚更情深只今不隔同年面想見青雲異日心官塗真有上竿魚玉筍翻乗别駕車聞道留行有公論從今日日看除書石湖詩集巻二十八欽定四庫全書石湖詩集巻二十九宋范成大撰次韻虞子建見咍贖帶作醮齋祠難著野衣冠旋贖金章始見閒台架塵清毬路暗花書墨漬笏頭斑當年馹騎傳呼賜此日村童拂拭還若比前㕔荒驛舎見存猶可一開顔兒女傳觀省見稀病身聊復借光輝莫嫌憔悴沈腰瘦且喜間關秦璧歸不是典來還酒債亦非將去换蓑衣塵魚甑釡時相阨㣲汝誰能為解圍顔橋道中村村籬落總新修處處田疇盡有秋一段農家好風景稻堆髙出屋山頭上沙舎舟村北村南打稻聲竹輿隨處欵柴荆斜陽倒景天如醉明日山行更好晴宿