body:
  text: 石湖詩集目錄别集類三宋巻一詩巻二詩巻三詩巻四詩巻五詩巻六詩巻七詩巻八詩巻九詩巻十詩巻十一詩巻十二詩巻十三詩巻十四詩巻十五詩巻十六詩巻十七詩巻十八詩巻十九詩巻二十詩巻二十一詩巻二十二詩巻二十三詩卷二十四詩卷二十五詩卷二十六詩卷二十七詩卷二十八詩巻二十九詩巻三十詩巻三十一詩巻三十二詩巻三十三詩巻三十四賦楚辭跋臣等謹案石湖詩集三十四巻宋范成大撰成大有呉郡志已别著錄案陳振孫書錄解題成大有集一百三十六巻宋史藝文志亦載石湖大全集一百三十六巻與陳氏著錄同又石湖别集二十九巻又石湖居士文集亡其巻數明代刻本僅一百三巻未詳其故此本長洲顧嗣立等所訂乃於全書之中獨摘其詩别行而附以賦一巻前有楊萬里陸㳺二序然萬里所序者乃其全集不專序詩㳺所序者乃其西征小集亦非序全詩以名人之筆嗣立等姑取以弁首耳據萬里序集乃成大所自編考十一巻末有自註云以下十五首三十年前所作續得殘稿附此卷末其餘諸詩亦皆註以下某處作今所傳者猶自編之舊本矣詩不分體亦不分立名目惟編年為次然送洪邁使金詩凡四首其兩首在第八巻列於邁使還入境以詩迓之之前其兩首乃列於第十巻何溥挽詞之後邁未嘗再使金則送别之詩不應前後兩見又南徐道中詩下註曰以下赴金陵漕試作則是當在第二巻之首不應孤贅第一巻之末疑後人亦有所竄亂割併故與宋本巻數不符歟成大在南宋時與尤袤楊萬里陸㳺齊名袤集久佚世所傳者僅尤侗所輯之一巻篇什寥寥未足定其優劣今以楊陸二集相較其才調之健不及萬里而亦無萬里之粗豪氣象之濶不及㳺而亦無㳺之窠臼初年吟詠實沿溯中唐以下觀第三巻夜宴曲下註曰以下二首效李賀樂神曲下註曰以下四首效王建巳明明言之其他如西江有單鵠行河豚嘆則雜長慶之體嘲里人新婚詩春晚三首隆師四圖諸作則全為晚唐五代之音其門徑皆可覆按自官新安掾以後骨力乃以漸而遒盖追溯蘇黄遺法而約以婉峭自為一家伯仲於楊陸之間固亦宜也乾隆四十四年二月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀石湖詩集原序予疇昔之晨與客坐堂上遥見一健步黄衣負一笈至庭下呼而諏其奚自曰自參政公范氏也發其笈公之文集在焉索其書讀之則公之子莘叩頭請曰莘不夭不自霣越而先公一夕奄忽棄其孤莘欲死而不敢者有先公付託之重任在方先公之疾而未病也日夜手編其詩文數年成集凡若干巻逮將易簀執莘手而授之且曰吾集不可以無序編有序篇非序篇寧無序篇也今四海文字之友惟江西楊誠齋與吾好且我知微斯人疇可以屬斯事小子識之若莘則何敢請而先公之治命不敢墜惟先生哀而諾之予執書抱遺編而泣曰萬里與公同年進士也公先進至為朝廷大臣與天子論道發政坐廟堂進退百官而萬里環堵荒寒之士也何敢與公友公不我薄陋而辱友之萬里不敢拒公亦不敢以執政俟公也今忍死丁寧之託其何敢辭初公以文學材氣受知壽皇自致大用至杖漢節使強敵即其庭伏穹廬不肯起袖出私書切責之君臣大驚有自階闥之嬖竊位樞臣者其勢方震赫公沮之竟不奉詔而去其所立又有不凡者矣若夫劌心於山水風月之埸彫龍於言語文章之囿此吾輩羈窮酸寒無聊不平之音也公何必能此哉古語曰爭名者必於朝爭利者必於市是二人者使之以此易彼或以彼易此二人者其肯乎哉非不肯也不願也非不願也亦各樂其樂也詩人文士挾其所樂足以敵王公大人之所樂不啻也猶將愈之故王公大人無以傲夫士而士亦無所折於王公大人今公乃自屏其所可樂而復力爭夫士之所甚樂所謂不虞君之涉吾地者其不多取乎然公之詩文非能工也不能不工耳公風神英邁意氣傾倒㧞新領異之談登峰造極之理蕭然如晉宋間人物他人戛戛吃吃而不能出諸口者公矉呻噫欠之間猝然談笑而道之則其詩文之工豈十日一水五日一石之謂也哉甚矣文之難也長於臺閣之體者或短於山林之味諧於時世之嗜者或漓於古雅之風牋奏與記序異曲五七與千百不同調非文之難兼之者難也至於公訓語具西漢之爾雅賦篇有杜牧之之刻深騷詞得楚人之幽婉序山水則栁子厚傳任俠則太史遷至於詩大篇決流短章歛芒縟而不釀縮而不僒清新嫵麗奄有鮑謝奔逸儁偉窮追太白求其隻字之陳陳一倡之鳴鳴而不可得也今海内詩人不過三四而公皆過之無不及者予於詩豈敢以千里畏人者而於公獨斂袵焉於是文士詩人之難者易偏者兼矣其不盛矣乎嘻人琴今俱亡矣廣陵散今此聲遂絶矣惠子不生莊子不死復何道哉公之别墅曰石湖山水之勝東南絶境也壽皇嘗為書兩大字以揭之故號石湖居士云公諱成大字至能世為姑蘇人其世次言行職官則有少保大觀文大丞相益公周公之銘詩在紹熙五年六月十一日誠齋野客楊萬里謹序石湖居士范公待制敷文閣来帥成都兼制置成都潼川利夔四道成都地大人衆事巳十倍他鎮而四道大抵皆帶蠻夷且北控秦隴所以臨制捍防一失其冝皆足致變故於呼吸顧盻之間以是幕府率窮日夜力理文書應期㑹而故時巨公大人亦或不得少休及公之至也定規模信命令施利惠農選將治兵未數月聲震四境嵗復大登幕府益無事公時從其屬及四方之賓客飲酒賦詩公素以詩名一代故落紙墨未及燥士女萬人己更傳誦被之樂府弦歌或題寫素屏團扇更相贈遺蓋自蜀置帥守以来未有也或曰公之自桂林入蜀也舟車鞍馬之間有詩百餘篇號西征小集尤雋偉蜀人未有見者盍請於公以傳屢請而公不可彌年乃僅得之於是相與刻之而屬㳺為序淳熙三年上巳日朝奉郎成都府路安撫司參議官兼四川制置使司參議官山隂陸游序欽定四庫全書石湖詩集巻一宋范成大撰
