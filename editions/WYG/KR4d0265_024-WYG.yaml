seq: 24
front:
  text: 俱來事更奇不妨禪心絮沾泥翠睂何時眞度曲細意煩君畫蛾緑
  hash: sha256:d8d695584f45ecad343a4b2806f630b1afadb57ab689087c0e8bec3512884307
body:
  text: 石湖詩集巻二十三欽定四庫全書石湖詩集卷二十四宋范成大撰題請息齋六言十首洞門晝挂鐵鎖閣道秋生綠苔蓍下略同龜伏瓜中且免蠅來多謝紛紛雲雨相忘渺渺江湖坐隅但忌占鵩屋上何煩譽烏灧澦年年似馬太行日日推車笑中恐有義甫泣裏難防叔魚見影蜮猶鉍鉍聞聲厖尚狺狺問誰毛生名紙知我角出車輪不惜人扶難拜非關我醉欲眠勞君敬枯木耳恐汝見濕灰焉稅駕今吾將老結廬此地不喧恐妨蝴蝶同夢笑倩顚當守門口邊一任醭去鼻孔慵將涕收閒門冷落車轍空室團欒話頭冷煖舊雨今雨是非一波萬波壁下禪枯達磨室中病著維摩親戚自有情話來往都無雜言酒熟徑須相報文成聊與細論園丁以時白事山客終日相陪竹比平安報到花依次第折來送劉唐卿戸曹擢第西歸六首摩挲漢柱愴分襟邂逅吳船喜盍簪别久十年知幾夢情親萬里只初心學道何關紫與青發身聊假佛名經歸來解盡程書縳千古文章似建瓴槐黃燈火困豪英此去書忩得此生學力根深方蔕固功名水到自渠成中年親友惜分離況我身兼老病衰餘景庶幾猶及見登瀛召客過門時我識岷峨最上頭當年脚力與雲浮兩山父老如相問一席三椽正卧遊四海西州舊故多煩君問訊各如何心期本自無南北萬里天波一月波末句戲用蜀語以見久要不忘之意富順楊商卿使君曏與余相别于瀘之合江渺然再㑹之期後九年迺訪余吳門則喜可知也今復分袂更增惘然病中强書數語送之合江縣下初語離共説再㑹知何時夀櫟堂前哄一笑人生聚散眞難料青燈話舊語未終船頭叠鼓帆爭風草草相逢復相送直恐送迎皆夢中昨聞親上安邊奏玉陛從容移禁漏天香懷䄂左魚符歸作雙親千歲夀我今老病塘蒲衰君歸報政還復來萬里儻容明月共更期後夢如今夢久病或勸勉强遊適吟四絶答之風月箇中老子江湖之上散人化鑪苦靳清福環堵閒抛好春鶴怨久迴俗駕鷗盟誰主載書一丘一壑謝汝三歲三秋望予捫蝨即是忙事驅蠅豈非褊心香煖香寒功課忩明忩暗光陰羸如蓐婦多忌倦似田翁作勞玩具僧梳刖屨歡悰丁尾龜毛初秋閒記園池草木五首茙葵爛紫終陋薝蔔嫣黃亦香醫俗賸延竹色療愁催拆萱房牛牽碧蔓自繞雞聳朱冠欲爭菱葩可範伯雅蓼節偏宜麴生菱葩為酒杯様最佳蓼入麴為勝旱地蓮花嬌小水盆梔子幽芳薇帳半年春艶桂叢四季秋香紫薇一名半年紅嵓桂一種四季有花醉憐金琖齊側卧看玉簪對橫腥水畱灌末利結香旋薫素馨末利用治魚腥水澆方多花玉菡化生稚子碧枝視現聲聞馬齒任藏汞冷鴻頭自勝硫温謂孩兒蓮羅漢木馬齒莧中有水銀鴻頭芡實也芡性煖號水硫黃巖桂三首風簾疎爽月裵回悵望家人把酒杯病著幽忩知幾日瓶花兩見木犀開越城芳徑手親栽紅淺黃深次第開不用小山招隱賦身如強健日千迴一株蕭索倚宣華東苑香風屬内家丹碧屠蘇銀燭照平生奇絶象山花少城圃中惟有一株建康東御園有亦不多四明丹桂特奇州宅所種尤蔚茂常與魏丞相夜飲其下中秋無月三首兒女無悰坐客稀今年孤負隔年期誰從天上牢遮月不管人間大欠詩撲地癡雲欲萬重家家簾幙護房櫳世間第一無情物誰似中秋雨與風一生露下風前客兩歲愁邊病裏身姑置陰晴圓缺事藥寮燈火正相親藻姪比課五言詩已有意趣老懷甚喜因吟病中十二首示之可率昆季賡和勝終日飽閒也舊歲連新歲凉牀又煖牀山川屏裏畫時刻篆中香畏壘安吾土支離飽太倉若敎身更健鶴背入維揚認鹿紛紜夢亡羊散亂心眵昏遮眼讀愁苦撚髭吟幸覺行迷逺其如卧病深通身都放下何用覓砭鍼日煖衣猶襲宵長被有稜朝晡三楪飯昏曉一釭燈伴坐跧如几扶行瘦比藤生緣堪入畫寂寞憩松僧繩倚扶枵骨蒲團閣瘁膚事疑償業債形類窘囚拘空劫眞常體浮生幻化軀箇中元不二無語對文殊軟熟羞盤饌芳辛實枕幃候晴先晒席占濕豫烘衣易栗雞皮皺難培鶴骨肥頭顱雖若此虛白自生輝數息憎晨凊伸睂愜晚晴隙塵浮日影忩穴嘯風聲捫蝨天機動驅蚊我相生偶然成一笑栩栩暫身輕貴仕龜鑽筴閒居馬脱鞿冠塵昏舊製帶眼剰新圍堆案書郵少登門刺字稀掩關灰木坐休示季咸機目眚浮珠珮聲塵籟玉簫秋懷潘鬢秃午夢楚魂銷注水瓶花醒吹薪藥鼎潮南柯何處是斜日上廊腰静裏秋先到閒中晝自長門闌疑泄桞尸祝漫庚桑腹已枵經笥身猶試藥方强名今日愈勃窣負東牆汗漬笻枝赤苔封屐齒青有醫延上坐無客抗分庭霽月鑽忩看鳴琴側枕聽莫嗔猿鶴怨岫幌兩年扃視絮勞羣從祇承愧闔家乳泉供水遞金液養丹芽加釀厚如酪旋舂香勝花百端扶老憊無物報投瓜學業荒呻畢歡悰隔笑鹽入秋先複幕過夏亦疎簾門客嗔愁思家人獻吉占尤憐小兒女時報鵲鳴簷贈臨江簡壽玉二首簡攜王仲顯使君書來謁并示孔毅甫夢蟾圖今廟堂五府皆有題字蕭灘逺客扣田廬貽我讀書樓上書千里故情元共月錯云多病故人疎巻中圖畫袖中珍上有三階五朶雲白日青天光範路未饒蟾窟夢紛紜夀櫟前假山成移丹桂於馬城自嘲堂前趣就小嶙峋未許蹣跚杖屨親更遣移花三百里世間眞有大癡人灼艾血忌詳涓日尻神謹避方艾求眞伏道穴按古明堂謝去羣巫祝勝如幾藥湯起來成獨笑一病攪千忙東宫夀詩甲觀秋彌月前星蚤麗天君親重慶日家國中興年英武神機逺温文德宇全摛章森典則㑹道極高堅儉寶躬安履仁端性自然淵沖澄有量海潤浹無邊五學臨函丈三朝拱䆳延頌聲敷政久喜色問安還銅律諧初度桑弧絶舊傳菊催重九近梅占小春先戲綵猗蘭殿宣杯玳瑁筵青宫千億壽長對兩宫前十月朝開爐偶書余病歸二年未能拜埽松楸曩常以此日侍先兄遊洞庭并寫悲感之懷圃芋今年紫籬楓昨日丹開爐修故事聽雨説新寒橘社重遊阻楸行再拜難此時西望眼衰涕不勝彈有懷龔養正好在楚龔子秋來情話稀昨承書素説行侍板輿歸烟水潮平棹風霜歲晚衣幾時眞訪戴莫待雪花霏白髭行四十踰四髭始黃手持漢節臨大荒輿疾歸來皮骨在兩鬢尚作青絲光俛仰行年四十九萬里南馳復西走斑斑頷下㸃吳霜猶可芟夷誑賓友屈指如今又十年兩年憊卧愁風前人生血氣能幾許不待覽鏡知皤然長安後輩輕前輩百方染藥千金賣煩撋包裹夜不眠無奈霞頭出光怪病翁高卧門長扃垂雪􅆴􅆴骨更清兒童不作居士喚喚作堂中老夀星但能之提刑相别十年自曲江逺寄二詩叙舊良厚次韻為謝亦以首章奉懷略道湘南分攜故事末篇自述年來衰病不復故吾也憶昔驂鸞識俊英朱旛繡斧盡能名書隨庾嶺一枝寄句挾韶江九奏成吳粤交馳清夜夢參辰不隔故人情何時重醉金槽曲一洗陽關别恨平濩落枵虛似瓠壺新添雪鬢與雙鬚也知病叟形容變非是仙儒骨相癯歲晚山林如自獻年豐田野亦多娛無端拙恙妨清樂未許扁舟到五湖復以蟾硯歸龔養正夢裏何人歌式微覺來石友在書幃鄭環信美非吾寶趙璧猶全任汝歸渴水雙蟾窺海闊出雲孤月照星稀好將自草三千牘莫與蚍蜉作釣磯大雪書懷天將奇賞發清歡疇昔登臨揷羽翰梅下尋詩騎馬滑松梢索酒倚樓寒閉門老子愁無賴返棹歸來興已闌聊掬玉塵添石鼎自煎魚眼破龍團雪中苦寒戲嘲二絶冥凌分職大間關辛苦行冬强作難費盡無邊風與雪劣能供得一番寒茸氊帳下玉杯寛香裏吹笙醉裏看風雪過門無入處却投窮巷覓袁安雪復大作六言四首奇寒擁被曉枕噩夢披蓑晚江遥想漫天匝地近聽穿幔鳴忩釀成送臘三白功在迎年九秋樵指擔肩相賀飯囊酒甕何憂初報折篁搶地旋聞壓桞堆橋寧敎風過掀舞可惜雨來半銷伶俜凍雀蹲晚噤滲疎梅鎖春有客典衣沽酒何人増價賣薪立春乙巳綵勝金旛夢裏茶槽藥杵聲中索莫兩年春事小忩卧聽東風題徐熙風牡丹二首紫花蘂珠仙馭曉驂鸞道服朝元露未乾天半剛風如激箭綠綃飄蕩紫綃寒白花寒入仙裙粟玉肌無餘全不耐風吹從敎旅拒春無力細看腰支嫋嫋時題黃居寀雀竹圖二首居寀筌之子羣雀歲寒保聚兩鶉日晏忘歸草間豈無餘粒刮地風號雪飛蔓花露下凝碧叢竹秋來老蒼噪雀羣爭何事么禽自囀清篁題張晞顏兩花圖二首晞顏廣漢人趙昌之甥繁杏紅粉團枝一萬重當年獨自費東風若為報答春無賴付與笙歌鼎沸中玉梨雪薄冰輕不耐春雨中愁緒月中眞莫教夢作雲飛去畱伴昭陽第一人題范道士二牛圖道士處州人號范牛中年狂顚人傳其得道此圖自稱中興道士范子珉蓋未顚時所作尤為精妙西疇滌場淨無塵原頭逺牧秋草春一牛疾行離其羣一牛返顧如怒嗔目光炯炯獰而馴㸃綴毫末俱逼眞不顚不狂筆有神妙哉吾宗散仙人石湖詩集巻二十四
