body:
  text: 石湖詩集卷三十二宋范成大撰春日覽鏡有感習氣不解老壯心故嵯峨忽與鄉曲齒方驚年許多有眼不自見尚謂朱顔酡今朝鏡中逢憔悴如枯荷形骸既遷變歳華復蹉跎悟此吁已晚既悟當若何烏兔兩惡劇不滿一笑呵但淬割愁劍何須揮日戈兒童競佳節呼喚儛且歌我亦興不淺健起相婆娑故太夫人章氏挽詞二首張子儀縂領之母洵美相門裔有齊邦媛賢藻蘋南澗下萱竹北堂前孝敬三從謹哀榮五福全松銘諸健筆題作晉陵阡積慶今如許生兒得寧馨軻親躬授教韋子世傳經壽斚明卿月安輿拱使星市橋何處在夢斷一溪青舅母太夫人方氏挽詞三首四徳儀邦族三遷奠里門姑寧憂疾痛子自樂平反夏枕方供扇薰堂甫種萱那知秋暑退無復御輕軒門户傳清白階庭侍紫青百年歌燕喜五福用康寧訣籙嘗觀妙旒旌謾勒銘神遊定超絶何必訊泉扃我願延陵道幾如渭水陽適傳杯泛影何意隙沉光擬補蘭陔雅翻吟薤露章支離妨執紼雨泣望楸行壽櫟堂前小山峰凌霄花盛開葱蒨如畵因名之曰凌霄峰天風揺曳寶花垂花下仙人住翠微一夜新枝香焙煖旋薰金縷緑羅衣山容花意各翔空題作凌霄第一峰門外輪蹄塵撲地呼来借與一枝笻代兒童作立春貼門詩三首剪綵宜春勝泥金祝壽幡雪梅同雪􅁂相對兩凌寒緑野添花逕青春引杖藜家人行樂處䨇勸玉東西盛族推山長修齡號櫟翁屏花春不老日日是東風代兒童作端午貼門詩三首畵閤圍香裏明窓宴坐中兵符不須篆丹轉藥爐紅管領神仙侣追陪山長家往来惟意適歌舞對年華黍筒小費名田課昌歜多浮樂聖杯笑倩艾人看户外北窓深處詠歸来重陽不見菊二絶節物今年事事遲小春全未到東籬可憐短髪空欹㡌欠了黃花一兩枝冷蕊蕭踈蝶􅂴飛商量何日是花時重陽過後開無害只恐先生不賦詩古風送南卿廬阜有佳人顔色皦冰玉不能時世粧蕭然古冠服紛紜倚市門組麗眩紅緑妖歌促艶舞飛上黄金屋安知乘鸞侣流落墮空谷風泉入環珮月露作膏馥粱肉豈不珍瀹雪煮黄獨聊用慰朝飢歳寒膚起粟綺叢三尺塵無路到松竹誰能撫孤桐為奏招隐曲偶至東堂岸幘蕭騷雪滿簮一閒真是直千金歸来栗里多情話病後香山少醉吟乆坐蒲團蕉葉放閒拖藜杖蘚花深飢時喫飯慵時睡何暇將心更覓心李中郎挽詞二首聖俞劇郡思賢牧名曹失望郎六叅能幾日兩􅁂未全霜霅水新阡逺桐川舊隐荒絶憐垂白母淚血獨還鄉憶昔單車使惟君勇輔行馬隤招共載羝乳約同盟老去長懐舊悲来遽隔生故人凋落盡衰涕不勝横謝江東漕楊廷秀秘監送江柬集并索近詩二首逺道悠悠日暮雲愁眉今日為君軒殘燈獨照江東集短夢相尋白下門即事想多梅蕊句有誰堪共桂花樽斯文頼有斯人在㑹合何時得細論秃翁衰雪涕垂頤仿佛三生􅂴散師浃髓淪膚都是病傾囷倒廩更無詩笑看筆格網絲徧閒數窓櫺花影移事業光隂今若此故人休説舊襟期霜後紀園中草木十二絶菊老芙蓉退化工少均逸蚤晚梅花動從此無閒日遮藏茉莉檻纒裹芭蕉身我亦入室處忍寒待陽春製芰亦不急緼􅂁堪禦冬從渠抱枝槁摵摵鳴霜風種葵如種麥隔歳已下子僅成一榦花浪備四時氣棠梨芳意多頗惜歳晼晚殷勤小春花特地慰愁眼牡丹初翦時已具新花眼代謝不容髮笑殺鐡門限客從揚州来遺我揚州花筠籠貯枯枿明年擅春華風倒酴醿架長條頭搶地趁渠未萌芽政可相料理清霜染柿葉荒園有佳趣留連伴歳晚莫作流紅去真珠綴玉船梧子炒可供莫嫌能墮髮老夫頭已童桃能驅不祥霜後葉鋪地抱枝崑崙奴猶解禦魑魅門冬如佳𨽻長年䕶階除生兒乃不凢磊落玻璃珠以狨坐覆蒲龕中蠧鉵塵昏度幾年䝉茸依舊輭如綿且来助煖烏皮几莫憶衝寒紫繡韉再到虎丘不過溪橋又兩年偶隨笻竹訪幽禪有縁再踏雲巖路無處重尋石井泉擬輟半山分座住先攜一枕借牀眠覺来飽喫紅蓮飯正是塘東稻熟天虎丘石井在張又新東南水品第三今寺僧不能名其處妄指寺中一土井當之經藏後有大方井舊名觀音井上有石柱為挂轆轤之處疑此是古石井今井已陻塞百年柱亦徙他用累諷住山者多邈然今以語壁老虎丘六絶句㸃頭石當年揮麈講何經賺得堅頑側耳聼我自吟詩無法説石頭莫作定盤星千人坐聼經人散蘚花深千古誰能更賞音只好岸巾披鶴氅風清月白坐彈琴白蓮池碧泓白石偃樛枝愛水嫌風老更低潭影中間龍影卧一山好處沒人題劍池石罅泓渟劍氣潛誰將樓閣苦莊嚴只知煖熱遊人眼不道蒼藤翠木嫌致爽閣碧嶂橫陳似斷鼇畵闌相對兩雄豪東軒只有雲千頃不似西山爽氣髙方丈南窓鼓板鐘魚徹曉喧誰云方外事蕭然窓間日暮寒煙重未到齋時我正眠雪寒圍爐小集席簾紙閣䕶香濃説有談空愛燭紅髙飣羶根澆杏酪旋融雪汁煮松風康年氣象冬三白浮世功名酒一中無事閉門渠易得何人躡屐響牆東白玉樓歩虛詞六首并序趙從善示余玉樓圗其前玉階一道横跨緑霄中琪樹垂珠網夾階兩傍綠霄之外周以玉闌闌外方是碧落階所接亦玉池中間湧起玉樓三重千門萬户無非連璐重璧屋覆金瓦屋山綴紅牙垂璫四簷黃簾皆捲樓中帝座依約可望紅雲自東来雲中虛皇乗玉輅駕兩金龍侍衞可見者靈官法服騎而夾侍二人力士黄麾前導二人儀劍四人金圍子四人夾輅黄幡二人五色㦸帯二人珠幢二人金龍旗四人負納陛而後從二人雲頭下垂將至玉階樓前仙官冠帔出迎方下階䨇舞鶴行前雲駕之傍又有紅雲二其一仙官立幢節間其二女樂並奏玉樓之後又有小玉樓六其制如前寶光祥雲前後蔽虧或隐或現小案之前獨為金地亦有仙官自金地下迎傍小樓最髙處有飛橋直瑶臺仙人度橋登臺以望名數可紀者大略如此若其景趣髙妙碧落浮黎青㝠風露之境則覽者可以神㑹不能述於筆端此畫運思超絶必夢遊帝所者彷彿得之非世間俗史意匠可到明窓净几盡卷展玩恍然便覺身在九霄三景之上竒事不可以不識簡齋有水府法駕導引歌詞乃倚其體作歩虛詞六章以遺從善羽人有不俗者使歌之於清風明月之下雖未得仙亦足以豪矣琳霄境却似化人宫梵氣彌羅融萬象玉樓十二倚清空一片寳光中浮黎路依約太微間雪色寶階千萬丈人間遥作白虹看幢節度髙寒罡風起背負玉虛廷九素煙中寒一色扶闌四面是青㝠環拱萬珠星流鈴響龍馭籋雲来夾道騫華籠綵仗紅雲扶輅輾天街迎駕鶴毰毸鈞天奏流韻滿空明琪樹玲瓏珠網碎仙風吹作歩虚聲相和八鸞鳴樓闌外輦道插非煙閒上鬱蕭臺上看空歌来自始青天揚袂揖飛仙送趙從善少卿將漕淮東玉筍風標右漢廷起家聊直使車星古来將相多頭黒此去功名尚􅁂青披草兩年南北巷折梅明日短長亭門前車轍從今少寂寞柴荆且暫扃范村雪後習氣猶餘燼鍾情未濕灰忍寒貪看雪諱老强尋梅熨貼愁眉展勾般笑口開直疑身健在時有句飛来寒夜觀雪靜極孤鴻響寒疑萬籟喑眼花燈下字髭斷雪中吟頗似償前債非闗惜寸隂可憐蝴蝶夢翩作蠧書蟫瓶花二首水仙攜蠟梅来作散花雨但驚醉夢醒不辨香来處小梅未可折不折惜空回擁鼻撚一枝也道探春来瑞香三首小檻移秀色端来媚禪房道人不解飲醺然醉天香紫雲蹙繡被團欒覆衣篝濃薰百和韵香極却成愁一叢三百朶細細拆濃檀簾幕䕶花氣不知窓外寒石湖詩集巻三十二
