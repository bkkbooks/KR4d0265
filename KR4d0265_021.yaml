front:
  text: 石湖居士詩集卷二十一
  hash: sha256:e63cfaa97bb9111d12060a71557547c9cd88f658a8431f3d9fdac2af773fcd10
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0265_SBCK_021-1a}
body:
  text: 秀州門外泊舟拍岸淸波撲岸埃黒頭霜鬢幾徘徊禾興門外官楊柳又見扁舟上堰來臨平道中煙雨桃花夾岸栽低低渾欲傍船來石湖有此紅千葉前日春寒緫未開夜過越上不得遊覽王程公事兩相催衝雨片帆連夜開千巖萬壑在何處山隂道中無好懷豈有酒船㝷賀老興盡却能訪安道鑑湖春色漫芳菲付與靑靑湖畔草道中古意二絶桃李寂無言垂楊照溪緑不見苧蘿人空吟若邪曲浣紗寂不好辛苦觸戰箭東施無麗質安穩嫁鄉縣觀禊帖有感三絶古人賦多情無事輒愁苦蘭亭一觴詠感慨乃如許寶章薶九泉摹本範百世白鵞滿波間誰識腕中意三日天氣新禊飲傳自古今人不好事佳節棄如土浙東舟中處處槿樊圃家家桃廡門魚鹽臨水市煙火隔江村雨過張帆重潮來汲井渾彎跧短篷底休說兩朱轓初赴明州四征惟是欠東征行李如今忽四明海接三韓諸島近江分七堰兩潮平擬將寬大來宣詔先趂淸和去勸耕頂踵國恩元未報驅馳何敢歎勞生昌國縣圖障於海中題字云自此與髙麗國接界蓋宇内極東處也寄虎丘範長老誰云簪紱坐成禽亦漫爲官漫好音身巳備嘗生老病心何曽住去來今一波不動月空照萬籟無情風自吟持此東歸似同志故應分我半山林次韻汪仲嘉尚書喜雨雨雲渾似雪雲同天意人心本自通吏役驅驅騎馬滑何如欹枕閉門中老身窮苦不須憂未有毫分慰此州但得田間無歎息何須地上見錢流曉起窓明驚起倒裳衣鈴索頻摇定怪遲即入簿書叢裏去少留欹枕聽黃鸝大風四明亦有颶風颶母從來海若家靑天白地忽飛沙煩將殘暑驅除盡只莫顚狂損稻花大黃花大芋髙荷半畝隂玉英危綴碧瑶簪誰知一葉蓮花面中有將軍劒㦸心進修堂前荷池方池留水勝埋盆露入蓮腮沁粉痕鈴索無聲人不到小禽飛入鬧荷根州宅堂前荷花凌波仙子靜中芳也帶酣紅學醉粧有意十分開曉露無情一餉斂斜陽泥根玉雪元無染風葉靑葱亦自香想得石湖花正好接天雲錦畵船凉新荔枝四絶荔浦園林瘴霧中戎州沽酒擘輕紅五年食指無占處何意相逢萬壑東海北天西兩鬢蓬閩山猶欠一枝笻鄞船荔子如新摘行脚何須更雪峰甘露凝成一顆冰露穠冰厚更芳馨夜凉將到星河下擬共嫦娥鬭月明趠泊飛來不作難紅塵一騎笑長安孫郎皺玉無消息先破潘郎玳瑁盤四明海舟自福唐來順風三數日至得荔子色香都未減大勝戎涪間所産莆陽孫使君許寄蜜荔過期不至貳車潘進奏餉玳瑁一種亦佳并賦之甬東道院午坐一夜西風轉酒旗午餘殘暑不多時緑荷半蝕霜前葉丹桂全封雨後枝忙裏有詩償日課老來無賦爲秋悲梳頭小隷那知此強向窓前數鬢絲東門外觀刈熟民間租米船相銜入門喜作二絶菊莎𣏌棘㸑無煙日日文書橫索錢今日甬東官况好東津門外看租船文書謂諸司督逋者潮到靈橋緑繞船海邊力穡屢豐年淡靑山色深黃稻恰似胥門九月天探木犀秋半秋香花信遲攀枝擘葉看纎微昨朝尚作茶槍痩今雨催成粟粒肥九月五日晴煖歩後園海氣烘晴入斷霞半空雲影界山斜輕羅小扇游蜂畔只比東風有菊花九日憶菊坡菊坡長恨隔橫塘城郭山林自不雙放棹松江花巳逺濤江之外更鄞江重陽九經堂作俗間佳節自悤悤老去悲秋又客中靑嶂捲簾三面月黃花吹鬢幾絲風十年故國新栽柳萬里他鄉舊轉蓬誰與安排今夜夢片帆飛到小籬東眞瑞堂前丹桂血色凡花太俗生花工新意染秋英袍紅太重鞓紅淺畵不能摹句寫成官忙風月鎭長閒開遍香紅酒尚寒若要與花相領略千巖隨分有闌干石湖千巖觀前手植丹桂二畝題羔羊齋外木芙蓉慵粧酣酒夕陽濃洗盡霜痕看綺叢緑地團花紅錦障不知庭院有西風進思堂夜坐懷故山塵事潮來不可推身如病鶴強毰毸簿書遮斷㝷詩路風雨驚殘問月杯想得竹門無客到直須雪夜有船廻鱸鄉望眼雙明處衹欠凌霄萬仞臺楊少監寄西征近詩來因賦二絶爲謝詩卷第一首乃石湖作別時倡和也柴門重客醉中歸尚憶揮毫索紙時何物與儂供不朽西征卷首石湖詩錦囊隨上越王臺天海風濤亦壯哉書到嶺頭梅恰動一枝應伴一篇來羔羊齋小池兩涘木芙蓉盛開有懷故園洞戸掩秋深畵橋橫晚靜嫋嫋芙蓉風池光弄花影懷我白鷗邊錦帳繚千頃明河拍岸平紅緑染天鏡釣船無畔岸收拾入簿領牆籓束院落寒窘令人癭鹿鳴席上贈貢士登陸由來說四明台星光處更魁星海濱二老尊周室館下諸生右漢廷秋賦重増人物志春闈俱上佛名經一飛好趂扶摇便咫尺西興是北溟大廳後堂南窓負暄萬壑無聲海不波一窓油紙暮春和醉眠陡覺氍毹贅圍坐翻嫌榾柮多水煖玉池添潄嚥花生銀海費揩摩端如擁褐茅檐下袛欠烏烏擊缶歌晚歩北園刮地晴飊退海痕出門無扇可障塵麥䊀瘠土何時雪梅糝踈林昨夜春天鏡風煙疑夢事鬢霜時節尚官身裹章束帶朝還暮慚愧靑鞋紫領巾謝賜臘藥感遇之什鴻寶刀圭下九關十年長奉璽封看扶持蒲柳身猶健收拾桑榆歳又寒天地恩深雙鬢雪山川途逺一心丹疲甿疾苦今何似拜手歸來愧伐檀立春後一日作浮生萬法本悠哉大笑羲娥轉轂催官事巳邀癡作伴春風應共老俱來雲容雪意將詩問柳眼花心待酒媒九十韶光天不斳人間笑口自難開春前十日作臘淺猶賖十日春官忙長愧百年身雪催未動詩無力愁遣還來酒不神節物何曽欺老病書生自慣說悲辛終期戚促成何事今古紛紛一窖塵三江亭觀雪隂山陽朔雪中廻行到天西玉作堆乗興却遊東海上白銀宫闕認蓬萊懷歸寄題小艇日出塵生萬劫忙可憐虚費隙駒光若敎閒裏工夫到始覺淡中滋味長歳晚角巾思芋栗年來手版愧耕桑松風蘿月須相信春水深時上野航雪後雨作瑞葉飛來麥巳靑更煩膏雨發欣榮東風不是厭滕六却怕雪天容易晴再雪銀竹方依檐住瑶花又入簾窺一白本憐麥瘦重來應爲梅遲立春日陪魏丞相登三江亭佳節登臨始此回聊從晻靄望蓬萊水分江北渡頭去風自海東潮外來太白天寒猶帶雪十洲池煖巳浮醅一尊往酹發船鼓我亦歸帆相次開寄題鹿伯可見一堂夢覺春闈俱轉蓬仙凡今隔玉霄東聊攀鐵鎖問何似豈敢避堂邀蓋公生來於君一歳長決去愧我三年遲今世誰不落第二著鞭尚續堂中詩雪溪興盡船當廻却擬登陸遊天台經行見一堂前路轉入湖山㝷悞來將赴建康出城牒訴繽紛塞甕天經年癡坐兩三椽出門納納乾坤大依舊靑山繞畵船寺莊大麥成苞小麥深秧田水滿緑浮針今年一飽全無慮寬盡歸舟去客心育王方丈窓紙悲嘶萬壑風石梁飛澗倒枯松因勤昨夜三更雨添作投淵雪色龍鰻井決甃神通未易論雨聲留客夜翻盆不辭客路春泥滑抖擻軒裳一鬨塵任敎空翠滴烏巾老身巳到籃輿上處處靑山是故人育王望海亭海雲晻靄日蘢葱案指光中萬象空想見蓬萊西望眼也應知我立長風天童三閣千佛羅漢善財松蘿羃天墮空翠迎面風香三十里曽宫亭亭隔瑶水碧瓦瓊榱五雲裏千佛當門無半偈聲聞未解祖師意徧參踏破靑鞋底前樓後閣玲瓏起閒客那知如許事東齋聽雨爛熳睡覺來一轉聊布施普請雲堂來擬議石湖居士詩集卷二十一
