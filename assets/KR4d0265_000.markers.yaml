  - {type: variant, offset: 322, length: 256, content: 文穆公手自編定宋嘉泰間其子莘等刻以行世合詩文凡百有三十卷明時曽巳重刻而流傳頗少又有活板印本殘闕甚多今藏書家多有抄本而訛舛異同魯魚錯出吾友金子亦陶所藏從宋板抄得更爲廣集諸家較勘精密可稱善本兹先刻其詩集以公諸同好卷帙前後悉依原本所編其間譌字如井垔木刊之悞垔爲堊弚靡波流之悞弚爲弟皆略爲改正所有一二漶漫之處無從辨證姑闕之以俟攷外附賦楚辭一卷樂府一卷賦本在詩前今附於詩後者集以詩名從其類也嗟乎自文穆公至今四百有餘年矣而詩篇在是聲光爛然亦可以見吳下之風流其淵源至今弗絶也康熙戊辰八月中秋前一日依園主人謹識石湖居士詩集目次終, WYG: 成大撰}
