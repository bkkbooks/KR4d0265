  - {type: variant, offset: 1480, length: 1239, content: 乾道令以絹計贓估價輕而論罪重成大奏承平時絹匹不及千錢而估價過倍紹興初年遞増五分爲錢三千足今絹實貴當倍時直上驚曰是陷民深文遂増爲四千而刑輕矣隆興再講和失定受書之禮上嘗悔之遷成大起居郎假資政殿大學士充金祈請國信使圖書專求陵寢蓋泛使也上面諭受書事成大乞并載書中不從金迓使者慕成大名至求巾幘效之至燕山密章奏具言受書式懷之入初進國書詞氣慷慨金君臣方傾聽成大忽奏曰兩朝旣爲叔姪而受書禮未稱臣有䟽搢笏出之金主大駭曰此豈獻書處耶左右以笏摽起之成大屹不動必欲書達旣而歸館所金主遣伴使宣旨取奏成大之未起也金庭紛然太子欲殺成大越王止之竟得全節而歸除中書舎人初上書崔實政論賜輔臣成大奏曰御書政論意在飭綱紀振積敝而近日大理議刑遞加一等此非以嚴致平乃酷也上稱爲知言張說除簽書樞密院事成大當制留詞頭七日不下又上䟽言之說命竟寢知靜江府廣西窘匱專藉鹽利漕臣盡取之於是屬邑有増價抑配之敝詔復行鈔鹽漕司拘鈔錢均給所部而錢不時至成大入境曰利害有大於此乎奏䟽謂能裁抑漕司強取之數以寛郡縣則科抑可禁止從之數年廣州鹽商上書乞復令客販宰相可其說成大出銀錢助之人多以爲非下有司議卒不易成大說舊法馬以四尺三寸爲限詔加至四寸以上成大謂互市四十年不宜驟改除敷文閣待制四川制置使䟽言吐蕃靑羌兩犯黎州而結蕃列等尤桀黠輕視中國臣當敎閱將兵外修堡砦仍講明敎閱團結之法使人自爲戰三者非財不可上賜度牒錢四十萬緡成大謂西南諸邊黎爲要地増戰兵五千奏置都監路分吐蕃入寇之路十有八悉築柵分戍結擾安靜砦發飛山軍千人赴之料其三日必遁已而果然白水砦將王文才私娶蠻女常導之寇邊成大重賞檄羣蠻使相疑貳俄禽文才以獻即斬之蜀北邊舊有義士三萬本民兵也監司郡守雜役之都統司又俾與大軍更戍成大力具其不可詔遵舊法蜀知名士孫松壽年六十餘樊漢廣甫五十九皆挂冠不仕表其節詔召之皆不起蜀士由是歸心凡人才可用者悉致幕下用所長不拘小節其傑然者露章薦之往往顯於朝位至二府召對除權吏部尚書拜參知政事兩月爲言者所論奉祠起知明州奏罷海物之獻除端明殿學士㝷帥金陵會歳旱奏移軍儲米二十萬賑飢民減租米五萬水賊徐五竊發號靜江大將軍捕而戮之以病請閒進資政殿學士再領洞霄宫紹興二年加大學士四年薨成大素有文名尤工於詩上嘗命陳俊卿擇文士掌内制俊卿以成大及張震對自號石湖有石湖集攬轡録桂海虞衡集行於世石湖居士詩集目次嗣協迂客吳郡顧嗣臯漢魚重訂嗣立俠君卷一詩四十六首卷二詩五十四首卷三詩六十三首卷四詩六十七首卷五詩五十一首卷六詩四十三首卷七詩四十九首卷八詩五十二首卷九詩五十一首卷十詩五十九首卷十一詩六十五首卷十二詩七十二首卷十三詩四十四首卷十四詩五十四首卷十五詩六十九首卷十六詩六十五首卷十七詩六十九首卷十八詩六十首卷十九詩五十二首卷二十詩八十四首卷二十一詩六十首卷二十二詩四十二首卷二十三詩七十二首卷二十四詩七十首卷二十五詩六十三首卷二十六詩五十六首卷二十七詩七十九首卷二十八詩七十五首卷二十九詩五十首卷三十詩三十三首卷三十一詩五十一首卷三十二詩五十七首卷三十三詩三十九首卷三十四嗣出賦六首楚辭四首卷三十五嗣出詞, WYG: ''}
