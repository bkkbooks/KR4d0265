  - {type: variant, offset: 0, length: 0, content: '', WYG: 欽定四庫全書集部四石湖詩集目錄别集類三宋巻一詩巻二詩巻三詩巻四詩巻五詩巻六詩巻七詩巻八詩巻九詩巻十詩巻十一詩巻十二詩巻十三詩巻十四詩巻十五詩巻十六詩巻十七詩巻十八詩巻十九詩巻二十詩巻二十一詩巻二十二詩巻二十三詩卷二十四詩卷二十五詩卷二十六詩卷二十七詩卷二十八詩巻二十九詩巻三十詩巻三十一詩巻三十二詩巻三十三詩巻三十四賦楚辭跋臣等謹案石湖詩集三十四巻宋范成大撰成大有呉郡志已别著錄案陳振孫書錄解題成大有集一百三十六巻宋史藝文志亦載石湖大全集一百三十六巻與陳氏著錄同又石湖别集二十九巻又石湖居士文集亡其巻數明代刻本僅一百三巻未詳其故此本長洲顧嗣立等所訂乃於全書之中獨摘其詩别行而附以賦一巻前有楊萬里陸㳺二序然萬里所序者乃其全集不專序詩㳺所序者乃其西征小集亦非序全詩以名人之筆嗣立等姑取以弁首耳據萬里序集乃成大所自編考十一巻末有自註云以下十五首三十年前所作續得殘稿附此卷末其餘諸詩亦皆註以下某處作今所傳者猶自編之舊本矣詩不分體亦不分立名目惟編年為次然送洪邁使金詩凡四首其兩首在第八巻列於邁使還入境以詩迓之之前其兩首乃列於第十巻何溥挽詞之後邁未嘗再使金則送别之詩不應前後兩見又南徐道中詩下註曰以下赴金陵漕試作則是當在第二巻之首不應孤贅第一巻之末疑後人亦有所竄亂割併故與宋本巻數不符歟成大在南宋時與尤袤楊萬里陸㳺齊名袤集久佚世所傳者僅尤侗所輯之一巻篇什寥寥未足定其優劣今以楊陸二集相較其才調之健不及萬里而亦無萬里之粗豪氣象之濶不及㳺而亦無㳺之窠臼初年吟詠實沿溯中唐以下觀第三巻夜宴曲下註曰以下二首效李賀樂神曲下註曰以下四首效王建巳明明言之其他如西江有單鵠行河豚嘆則雜長慶之體嘲里人新婚詩春晚三首隆師四圖諸作則全為晚唐五代之音其門徑皆可覆按自官新安掾以後骨力乃以漸而遒盖追溯蘇黄遺法而約以婉峭自為一家伯仲於楊陸之間固亦宜也乾隆四十四年二月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀石湖詩集原}
